        const cls = isSec ? 'sec' : (STATUS_COL[(statusIdx>=0 ? r[statusIdx] : '')] || '');
        const hit = q && r.join(' ').toLowerCase().includes(q);
        if (q && !hit && !isSec) return '';
        return `<tr class="${cls} ${hit?'hit':''}">` + r.map((c,i) => `<td class="${i?'c':''}">${fmt(c)}</td>`).join('') + '</tr>';
    }).join('');
    document.getElementById('view').innerHTML = `
        <div class="notion-card p-4 md:p-6 mb-6">
            <div class="font-black text-[18px] text-[#37352f] mb-1">${esc(d.title)}</div>
            ${d.sub ? `<div class="text-[12px] text-[#787774] font-bold">${esc(d.sub)}</div>` : ''}
        </div>
        <div class="tbox"><table class="vp-gt"><thead><tr>${d.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows || '<tr><td colspan="'+d.head.length+'" class="c text-[#b0aeaa]">맞는 줄이 없습니다</td></tr>'}</tbody></table></div>`;
}
document.getElementById('q').addEventListener('input', () => {
    const q = document.getElementById('q').value.trim().toLowerCase();
    if (q) { const hitSheet = DATA.find(d => d.rows.some(r => r.join(' ').toLowerCase().includes(q))); if (hitSheet && !DATA.find(x=>x.id===cur).rows.some(r => r.join(' ').toLowerCase().includes(q))) cur = hitSheet.id; }
    render();
});
render();
</script>
</body>
</html>
