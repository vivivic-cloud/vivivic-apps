<!doctype html>
<!-- v220 거래처 링크(사장님 「발주링크 납품확인링크 구매납품확인 링크등 나눠진 거래처 링크를 하나로 합쳐 주세요」 · 「거래처는 나눠져 있어야죠」)
     거래처마다 링크 하나 = 거래처.html#<열쇠>. 자료 = erp_pobox/<열쇠> {kind:'거래처', name, a, o, i}(폼이 만듦, 새 문서만 — 옛 박스 안 건드림).
       a = 그 거래처 발주서 박스(erp_asmbox → 발주.html: 발주·생산 납품확인) · o = 출고처 발주목록 박스(발주박스.html: 구매 발주확인) · i = 입고처 발주목록 박스(발주박스.html: 구매 입고확인).
     옛 링크(발주.html#k · 발주박스.html#k · 출고처박스/입고처박스.html#k) = 폼이 만든 erp_pobox/to_<k> {kind:'거래처링크', v} 를 보고 여기로 넘어옴(없으면 옛 화면 그대로). 로그인 없음.
     v222 사장님 「거래처 공유 발주링크도 입력폼의 거래처별 박스구성 동일하게 나타나게 해줘라」 — 폼 거래처 박스 안과 같은 흑백 정사각 박스, 토글 없음.
       이 페이지 = 그 거래처 박스 안부터(다른 거래처 없음). 칸이 둘 이상이면 정사각 박스(「발주서」·「출고처 발주목록 박스」·「입고처 발주목록 박스」, 겉 = 건수·요약 칩·제품명)
       → 누르면 그 박스만. 칸이 하나면 바로 그 안. 안 = 옛 페이지를 그대로 띄움(같은 코드·같은 규칙·같은 기능) — 안 페이지가 박스(단계 → 발주 → 한 장)를 그리고
       경로(VL.crumb)·겉 요약(VL.sum)을 이 페이지로 보냄. 맨 위 한 줄 경로(거래처 › 박스 › 단계 › 발주)로 돌아감. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>INGHOME 거래처</title>
<meta name="description" content="거래처 발주·납품확인">
<meta property="og:type" content="website">
<meta property="og:site_name" content="INGHOME">
<meta property="og:title" content="INGHOME 거래처">
<meta property="og:description" content="거래처 발주·납품확인">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="발주공통.css">
<style>
main.vl{padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
.vlhead{padding:16px 16px 0}
.vlbody{padding:0 16px}
.vlfr iframe{display:block;width:100%;border:0;height:120px;background:#fff}
.vlhead .msg{margin:12px 0 0}
</style>
</head>
<body>
<main id="main" class="vl asmq"><div class="vlhead"><p class="msg">불러오는 중</p></div></main>
<script src="발주공통.js"></script>
<script>
(function(){
"use strict";
var P=window.PO,h=P.h,show=P.show,mainEl=document.getElementById('main');
function say(t,bad){mainEl.replaceChildren(h('div','vlhead',h('p','msg'+(bad?' bad':''),t)));}
var key=(location.hash||'').slice(1).split('&')[0];
if(!P.keyOk(key)){say('링크가 없습니다.',true);return;}
var NAME='',PARTS=[],ACT=null,headEl=h('div','vlhead'),bodyEl=h('div','vlbody'),frEl=h('div','vlfr');
/* 안 페이지 높이 = 안 내용 높이(같은 출처라 읽을 수 있음) */
function fitNow(fr){try{var d=fr.contentDocument;if(!d||!d.documentElement)return;var m=d.getElementById('main')||d.body;if(!m)return;var hgt=Math.ceil(m.getBoundingClientRect().bottom+(d.defaultView?d.defaultView.scrollY:0));if(hgt>0)fr.style.height=hgt+'px';}catch(e){}}
function fit(fr){
  fr.addEventListener('load',function(){fitNow(fr);try{var d=fr.contentDocument;if(window.ResizeObserver){var ro=new ResizeObserver(function(){fitNow(fr);});ro.observe(d.documentElement);if(d.body)ro.observe(d.body);}
    else setInterval(function(){fitNow(fr);},1000);}catch(e){}});
}
function partOf(win){return PARTS.filter(function(p){return p.fr&&p.fr.contentWindow===win;})[0];}
function activate(k){ACT=k;PARTS.forEach(function(p){p.fr.hidden=p.key!==k;});render();var a=cur();if(a)fitNow(a.fr);window.scrollTo(0,0);}
function cur(){return PARTS.filter(function(p){return p.key===ACT;})[0]||null;}
/* 안 페이지가 부름: 경로 · 겉 요약 · 맨 위로 */
window.VL={
  crumb:function(win,cs){var p=partOf(win);if(!p)return;p.cs=cs||[];if(p.key===ACT)render();},
  sum:function(win,s){var p=partOf(win);if(!p)return;p.sum=s||null;if(ACT==null)render();},
  top:function(){window.scrollTo(0,0);}
};
function render(){
  var a=cur(),multi=PARTS.length>1,cs=[];
  var home=function(){if(a&&a.cs&&a.cs[0]&&a.cs[0].go)a.cs[0].go();if(multi)activate(null);};
  cs.push({t:NAME,go:home});
  if(a){if(multi)cs.push({t:a.label,go:function(){if(a.cs[0]&&a.cs[0].go)a.cs[0].go();}});cs=cs.concat((a.cs||[]).slice(1));}
  headEl.replaceChildren(h('div','asmcrumb',cs.reduce(function(o,c,i){var last=i===cs.length-1,b=null;if(!last){b=h('button','',c.t);b.type='button';b.addEventListener('click',function(){c.go&&c.go();});}return o.concat([i?h('i','','›'):null,last?h('b','',c.t):b]);},[])));
  if(a){bodyEl.replaceChildren();return;}
  bodyEl.replaceChildren(h('div','asmgrid2',PARTS.map(function(p){var s=p.sum,nm=[],seen={};
    ((s&&s.names)||[]).forEach(function(m){var t=show(m.t);if(!t)return;if(seen[t]){if(!m.done)seen[t].done=false;return;}seen[t]={t:t,done:!!m.done};nm.push(seen[t]);});
    nm=nm.filter(function(m){return !m.done;}).concat(nm.filter(function(m){return m.done;}));
    return P.tile([h('b','asmtt asmvt',p.label),h('div','asmn2',s?(s.n||0)+'건':''),s&&(s.chips||[]).length?h('div','asmnum',s.chips.map(function(c){return h('span','chip '+c[1],c[0]);})):null,
      nm.length?h('ul','asmnames',nm.map(function(m){return h('li',m.done?'done':'',m.t);})):null],function(){activate(p.key);},'asmsq');})));
}
P.getOne('erp_pobox/'+key).then(function(v){
  if(!v||v.kind!=='거래처'){say('링크가 없습니다.',true);return;}
  PARTS=[['a','발주서','발주.html'],['o','출고처 발주목록 박스','출고처박스.html'],['i','입고처 발주목록 박스','입고처박스.html']]
    .filter(function(p){return P.keyOk(v[p[0]]);}).map(function(p){return {key:p[0],label:p[1],src:p[2]+'#'+v[p[0]],cs:[],sum:null,fr:null};});
  if(!PARTS.length){say('발주서가 없습니다.',true);return;}
  NAME=show(v.name);document.title='INGHOME-'+NAME;
  ACT=PARTS.length===1?PARTS[0].key:null;
  PARTS.forEach(function(p){var fr=document.createElement('iframe');fr.title=p.label;fr.setAttribute('allow','camera; clipboard-write; web-share; fullscreen');fr.hidden=p.key!==ACT;fit(fr);p.fr=fr;fr.src=p.src;frEl.append(fr);});
  mainEl.replaceChildren(headEl,bodyEl,frEl);render();
},function(){say('불러오지 못했습니다.',true);});
window.addEventListener('hashchange',function(){var k2=(location.hash||'').slice(1).split('&')[0];if(k2!==key)location.reload();});
})();
</script>
</body>
</html>
