<!doctype html>
<!-- 발주서 공개 페이지(v128) — 영림원외주입력 「발주서관리」 QR 이 여는 보기 전용 한 장. 폼과 별개 파일, 로그인 없음, 메뉴·폼으로 가는 길 없음.
     주소 = 발주서.html#<열쇠>. 자료 = 파이어스토어 erp_podocs_pub/<열쇠> 한 장(REST GET). 열쇠 없이는 못 연다(발주번호로 안 열림).
     보이는 칸은 임시(사장님이 쓰면서 고침): 발주번호·발주일·품번·품명·규격·단위·발주수량·납품예정일·창고·납품 상황. 단가·구매거래처 뺌.
     저장소 규칙 배포 전에는 로그인 없는 읽기가 막혀 익명 로그인 뒤 다시 읽는다. 규칙에 `match /erp_podocs_pub/{key} { allow get: if true; }` 가 들어가면 바로 읽힌다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>발주서</title>
<link rel="icon" href="data:,">
<style>
:root{--ink:#37352f;--muted:#787774;--line:#ededeb;--fill2:#f5f5f4;--rowline:#f0eeec;--red:#dc2626;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:#fff;color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;font-weight:900;letter-spacing:-0.02em;margin:0 0 12px}
h2{font-size:15px;font-weight:900;margin:20px 0 8px}
.msg{color:var(--muted);font-weight:700}.msg.bad{color:var(--red)}
dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;margin:0}
dt{color:var(--muted);font-weight:700;font-size:13px;padding-top:1px}
dd{margin:0;font-weight:600;word-break:break-all}
dd.mono{font-family:var(--mono)}dd.n{font-variant-numeric:tabular-nums}
.head{margin:0 0 12px}
.row{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.row .nt{font-weight:800;word-break:break-all;margin:0 0 6px}
table{width:100%;border-collapse:collapse;font-size:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{background:var(--fill2);color:var(--muted);font-weight:800;font-size:12px;text-align:left;padding:8px 10px}
td{border-top:1px solid var(--rowline);padding:8px 10px;word-break:break-all}
th:not(:first-child),td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main id="main"><p class="msg">불러오는 중</p></main>
<script>
(function(){
"use strict";
var KEY='AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs',PROJ='vivivic-4b7ef';
var mainEl=document.getElementById('main');
function h(tag,cls){var e=document.createElement(tag);if(cls)e.className=cls;for(var i=2;i<arguments.length;i++){var c=arguments[i];(Array.isArray(c)?c:[c]).forEach(function(x){if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(String(x)));});}return e;}
function show(v){return v==null?'':String(v);}
function num(v){if(v==null||String(v).trim()==='')return '';var n=Number(v);return isFinite(n)?n.toLocaleString('ko-KR',{maximumFractionDigits:6}):String(v);}
function say(t,bad){mainEl.replaceChildren(h('p','msg'+(bad?' bad':''),t));}
/* 파이어스토어 REST 값 → 보통 값 */
function val(x){if(!x)return null;var k=Object.keys(x)[0],y=x[k];
  if(k==='mapValue'){var o={};Object.keys(y.fields||{}).forEach(function(f){o[f]=val(y.fields[f]);});return o;}
  if(k==='arrayValue')return (y.values||[]).map(val);
  if(k==='integerValue')return Number(y);if(k==='nullValue')return null;return y;}
var key=(location.hash||'').slice(1);
if(!/^[A-Za-z0-9_-]{32,64}$/.test(key)){say('발주서가 없습니다.',true);return;}
var url='https://firestore.googleapis.com/v1/projects/'+PROJ+'/databases/(default)/documents/erp_podocs_pub/'+key+'?key='+KEY;
function get(tok){return fetch(url,{headers:tok?{Authorization:'Bearer '+tok}:{},referrerPolicy:'no-referrer',cache:'no-store'});}
function anon(){   /* 규칙 배포 전: 익명 로그인 토큰(이 탭에서만 다시 씀) */
  var t=null;try{t=JSON.parse(sessionStorage.getItem('po.tok')||'null');}catch(e){}
  if(t&&t.exp>Date.now())return Promise.resolve(t.id);
  return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"returnSecureToken":true}'})
    .then(function(r){return r.json();}).then(function(j){if(!j.idToken)throw new Error('anon');
      try{sessionStorage.setItem('po.tok',JSON.stringify({id:j.idToken,exp:Date.now()+50*60*1000}));}catch(e){}return j.idToken;});
}
get(null).then(function(r){return r.status===401||r.status===403?anon().then(get):r;}).then(function(r){
  if(r.status===404||r.status===403){say('발주서가 없습니다.',true);return;}
  if(!r.ok)throw new Error(r.status);
  return r.json().then(function(j){
    var f={};Object.keys(j.fields||{}).forEach(function(k){f[k]=val(j.fields[k]);});
    var rows=Array.isArray(f.rows)?f.rows.filter(Boolean):[];
    document.title='발주서 '+show(f.pono);
    var kv=function(pairs){var d=h('dl');pairs.forEach(function(p){d.append(h('dt','',p[0]),h('dd',p[2]||'',p[1]));});return d;};
    mainEl.replaceChildren.apply(mainEl,[].concat(
      h('h1','','발주서'),
      h('div','head',kv([['발주번호',show(f.pono),'mono'],['발주일',show(f.podate)]])),
      rows.map(function(x){return h('div','row',h('div','nt',show(x.cname)),
        kv([['품번',show(x.ccode),'mono'],['규격',show(x.cspec)],['단위',show(x.unit)],['발주수량',num(x.qty),'n'],['납품예정일',show(x.duedate)],['창고',show(x.wh)]]));}),
      h('h2','','납품 상황'),
      h('table','',h('thead','',h('tr','',['품명','발주수량','납품수량'].map(function(t){return h('th','',t);}))),
        h('tbody','',rows.map(function(x){return h('tr','',h('td','',show(x.cname)),h('td','n',num(x.qty)),h('td','n',num(x.dlv)));})))));
  });
}).catch(function(){say('불러오지 못했습니다.',true);});
})();
</script>
</body>
</html>
