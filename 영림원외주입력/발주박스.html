<!doctype html>
<!-- 발주박스 공유 페이지 — 로그인 없음, 폼과 별개. 주소 = 발주박스.html#<박스 열쇠>[&s=<배송열쇠>]. 자료 = erp_pobox/<열쇠>(폼이 씀) · erp_poconfirm/<발주번호>.
     v149 맨 위 머리 줄(누구용 링크): 출고처 = 「출고처 발주목록 박스 — 거래처」 · 입고처 = 「입고처 발주목록 박스 — 창고」 · 기사 QR 로 연 때(&s=) = 「입고처 입고 확인 — 창고」.
     v155 영림원 입력완료(폼이 pos.final 을 적음) = 「납품완료」, QR·바코드·발주확인·배송기사 공유·사진·입고수량·입고확인·수정요청 모두 없음(보기만).
     v148 「배송기사 공유」 제한 없음(사장님 「배송기사 공유 버튼은 제한없이 사용할 수 있게 해주세요」) — 발주확인 전·잠김에도, 몇 번이든 같은 링크.
     v133 출고처·입고처 박스 · v138 단가 없음 · v142 QR·바코드 · v145 납품 흐름 · v146 입고를 박스 안 발주서에서:
     출고처 = 그 거래처 발주 모두 + 「발주확인」 → 확인되면 QR(발주서.html#공개열쇠)·바코드(발주번호) + 「배송기사 공유」(배송.html#배송열쇠, 한 발주 한 링크).
     입고처 = 발주확인된 발주만, QR·바코드 없음. 기사 폰 QR(입고.html#배송열쇠 → 이 박스로 넘어옴 &s=)·위 「스캔」·발주번호 칸 → 이 박스의 그 발주서가 열려
       사진·입고수량·「입고확인」·확인 뒤 「수정요청」(기사 QR 다시 찍거나 발주번호 → 같은 발주면 고칠 수 있음). 이 박스에 없는 발주면 「이 입고처 박스에 없는 발주입니다.」로 멈춤.
     입고 자료 = erp_poin/<입고열쇠>_<배송열쇠> · erp_podlv/<배송열쇠> · erp_podlvimg/<입고열쇠>_<배송열쇠>_<0~5>. 잠김(구매납품입력 처리 시작) = 모든 수정 막힘. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>INGHOME 발주목록</title>
<meta name="description" content="발주목록 박스">
<meta property="og:type" content="website">
<meta property="og:site_name" content="INGHOME">
<meta property="og:title" content="INGHOME 발주목록">
<meta property="og:description" content="발주목록 박스">   <!-- v160 카톡 카드(옛 주소로 보낸 링크) -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="발주공통.css">
<style>.po.act{border-color:var(--ink);box-shadow:0 0 0 2px rgba(55,53,47,.12)}.in{border-top:1px solid var(--rowline);margin:12px 0 0;padding:12px 0 0}.in .acts{margin:10px 0 0}</style>
</head>
<body>
<main id="main"><p class="msg">불러오는 중</p></main>
<script src="발주공통.js"></script>
<script>
(function(){
"use strict";
var P=window.PO,h=P.h,show=P.show,num=P.num,mainEl=document.getElementById('main');
function say(t,bad){mainEl.replaceChildren(h('p','msg'+(bad?' bad':''),t));}
function when(s){var t=new Date(s);if(!s||isNaN(t))return show(s);var p=function(n){return String(n).padStart(2,'0');};return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate())+' '+p(t.getHours())+':'+p(t.getMinutes());}
var hp=(location.hash||'').slice(1).split('&'),key=hp[0],sq=(hp.filter(function(x){return x.indexOf('s=')===0;})[0]||'').slice(2);
if(!P.keyOk(key)){say('발주서가 없습니다.',true);return;}
var BOX=null,CONF={},DLV={},busy={},errs={},NOTE={},CODES={},topErr='',stopCam=null,camEl=null;
/* v146 입고처: 지금 연 발주(기사 QR 로 연 것) */
var ACT=null;   /* {pono, ship, inr, dlv, imgs, editing, draft, editBox} */
function load(){
  return P.getOne('erp_pobox/'+key).then(function(b){
    if(!b){BOX=false;return;}BOX=b;if(b.kind==='입고처')P.rememberInbox(key);
    var pos=(b.pos||[]).filter(function(p){return p&&P.noOk(p.pono);}),names=pos.map(function(p){return 'erp_poconfirm/'+p.pono;});
    if(b.kind==='입고처')pos.forEach(function(p){if(P.keyOk(p.ship))names.push('erp_podlv/'+p.ship);});
    return P.getMany(names).then(function(o){var c={},d={};pos.forEach(function(p){if(o['erp_poconfirm/'+p.pono])c[p.pono]=o['erp_poconfirm/'+p.pono];if(P.keyOk(p.ship)&&o['erp_podlv/'+p.ship])d[p.pono]=o['erp_podlv/'+p.ship];});CONF=c;DLV=d;})
      .then(function(){if(b.kind==='입고처'&&ACT)return loadAct();});
  }).then(draw,function(){if(BOX==null)say('불러오지 못했습니다.',true);});
}
/* 입고처: 배송열쇠 → 이 박스의 발주인지 보고 열기(박스 문서에 배송열쇠가 아직 없으면 배송 문서의 발주번호로 봄) */
function openShip(sk){
  if(!P.keyOk(sk)){topErr='이 입고처 박스에 없는 발주입니다.';draw();return Promise.resolve();}
  return P.shipChain(sk).then(function(ch){var l=ch[ch.length-1];if(l)sk=l.id;return l?l.doc:null;}).then(function(s){   /* v159 지금 회차 */
    var p=s&&(BOX.pos||[]).filter(function(x){return x&&x.pono===s.pono&&P.keyOk(x.inTok);})[0];
    if(p&&!CONF[p.pono]){ACT=null;topErr='발주확인 전';draw();return;}   /* v153 */
    if(!p){   /* v152 다른 입고처 발주의 기사 QR → 그 발주의 입고처 박스로 넘김(사장님 결정 전 임시). 갈 박스를 모르면 안내 */
      if(s&&P.keyOk(s.inbox)&&s.inbox!==key){location.href=new URL('발주박스.html#'+s.inbox+'&s='+sk,location.href).href;return;}
      ACT=null;topErr='이 입고처 박스에 없는 발주입니다.';draw();return;}
    topErr='';ACT={pono:p.pono,ship:sk,inr:null,dlv:null,imgs:[],editing:false,draft:{},editBox:null};
    try{history.replaceState(null,'','#'+key+'&s='+sk);}catch(e){}
    return loadAct().then(function(){draw();var el=document.querySelector('.po.act');if(el)el.scrollIntoView({block:'start'});});
  },function(){topErr='불러오지 못했습니다.';draw();});
}
function actPo(){return ACT&&(BOX.pos||[]).filter(function(x){return x&&x.pono===ACT.pono;})[0];}
function loadAct(){
  var p=actPo();if(!p)return Promise.resolve();var base=p.inTok+'_'+ACT.ship,names=['erp_poin/'+base,'erp_podlv/'+ACT.ship];for(var i=0;i<6;i++)names.push('erp_podlvimg/'+base+'_'+i);
  return P.getMany(names).then(function(o){ACT.inr=o['erp_poin/'+base];ACT.dlv=o['erp_podlv/'+ACT.ship];ACT.imgs=[];for(var i=0;i<6;i++)ACT.imgs.push(o['erp_podlvimg/'+base+'_'+i]);if(ACT.dlv)DLV[ACT.pono]=ACT.dlv;});
}
function goIn(txt){   /* 위 「스캔」·발주번호 칸 */
  var t=String(txt||'').trim(),m=/(?:입고|%EC%9E%85%EA%B3%A0)\.html#([A-Za-z0-9_-]{32,64})/.exec(t);
  if(m)return openShip(m[1]);
  var p=(BOX.pos||[]).filter(function(x){return x&&String(x.pono).toUpperCase()===t.toUpperCase();})[0];
  if(!p||!CONF[p.pono]){topErr='이 입고처 박스에 없는 발주입니다.';draw();return;}
  if(!P.keyOk(p.ship)){topErr='배송기사 링크가 아직 없는 발주입니다.';draw();return;}
  openShip(p.ship);
}
function scanTop(){if(stopCam)stopCam();topErr='';camEl=h('div','cam');draw();stopCam=P.scanner(camEl,function(t){stopCam=null;camEl=null;goIn(t);},function(){camEl=null;topErr='카메라를 쓸 수 없습니다. 발주번호를 넣어 주세요.';draw();});}
function confirmPo(no){
  if(!confirm(no+' 발주를 확인합니다.'))return;
  busy[no]=1;errs[no]='';draw();
  P.commit([{name:'erp_poconfirm/'+no,fields:{box:key,pono:no,at:new Date().toISOString()},exists:false}])
    .then(function(){busy[no]=0;return load();},function(){busy[no]=0;return load().then(function(){if(!CONF[no]){errs[no]='발주확인을 저장하지 못했습니다.';draw();}});});
}
/* 출고처: 배송기사 링크 = erp_poship/<새 열쇠> — 한 발주 하나(erp_poshipref/<박스 열쇠>_<발주번호>) */
function shipOf(p){
  var ref='erp_poshipref/'+key+'_'+p.pono,get=function(){return P.getOne(ref).then(function(r){return r&&r.ship||null;});};
  return get().then(function(k){if(k)return k;k=P.rkey();
    return P.commit([{name:'erp_poship/'+k,fields:{box:key,pono:p.pono,pubKey:p.pubKey,at:new Date().toISOString()},exists:false},
      {name:ref,fields:{ship:k,box:key,pono:p.pono},exists:false}]).then(function(){return k;},function(e){return get().then(function(k2){if(k2)return k2;throw e;});});});
}
function shareShip(p){
  if(busy['s'+p.pono])return;busy['s'+p.pono]=1;errs[p.pono]='';NOTE[p.pono]='';draw();
  shipOf(p).then(function(k){busy['s'+p.pono]=0;draw();
    /* v160 입구 파일 배송기사.html(카드 제목) · 상황별 글 · 글 한 덩어리(카톡이 url 만 보내지 않게) */
    var url=new URL('배송기사.html#'+k,location.href).href,text='INGHOME-'+show(BOX.name)+' - 발주서 '+p.pono+(p.part&&p.final!==true?' 부분납품 남은 '+num(p.part.left)+' 출고 발주서입니다.':' 출고 발주서입니다.'),msg=text+'\n'+url;
    var cp=function(){return (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(msg):Promise.reject()).then(function(){return true;},function(){return false;});};   /* v162 */
    var done=function(ok){NOTE[p.pono]=ok?'글과 링크를 복사했습니다. 카카오톡이 안 보이면 붙여넣으세요.':msg;draw();};
    if(navigator.share)return navigator.share({text:msg}).then(function(){return cp();},function(e){return cp();}).then(done);
    return cp().then(done);
  },function(){busy['s'+p.pono]=0;errs[p.pono]='배송기사 링크를 만들지 못했습니다.';draw();});
}
/* ---- 입고처: 연 발주서의 입고(사진·입고수량·입고확인·수정요청) ---- */
function locked(){return !!(ACT&&ACT.dlv&&ACT.dlv.locked);}
function canEdit(){return !!ACT&&!locked()&&(!ACT.inr||ACT.editing);}
function qtyOf(x){var c=show(x.ccode);if(ACT.draft[c]!=null)return ACT.draft[c];var r=ACT.inr&&(ACT.inr.rows||[]).filter(function(y){return y&&show(y.ccode)===c;})[0];if(r)return String(r.qty);var L=Number(x.qty||0)-Number(x.dlv||0);return String(L>0?Math.round(L*100)/100:Number(x.qty||0));   /* v159 처음 값 = 남은 수량 */}
function addPhotos(files){
  var p=actPo();if(!p||busy.in||!canEdit())return;var free=[];ACT.imgs.forEach(function(x,i){if(!x)free.push(i);});
  var fs=Array.prototype.slice.call(files||[]).slice(0,free.length);if(!fs.length){errs[p.pono]=free.length?'':'사진은 6장까지입니다.';draw();return;}
  busy.in=1;errs[p.pono]='';draw();
  fs.reduce(function(pr,f,j){return pr.then(function(){return P.shrink(f).then(function(d){
    return P.commit([{name:'erp_podlvimg/'+p.inTok+'_'+ACT.ship+'_'+free[j],fields:{tok:p.inTok,ship:ACT.ship,pono:p.pono,data:d,at:new Date().toISOString()},exists:false}]);});});},Promise.resolve())
    .then(function(){busy.in=0;return loadAct().then(draw);},function(){busy.in=0;errs[p.pono]='사진을 올리지 못했습니다.';return loadAct().then(draw);});
}
function saveIn(){
  var p=actPo();if(!p||busy.in||!canEdit())return;
  var rows=(p.rows||[]).filter(Boolean).map(function(x){return {ccode:show(x.ccode),qty:String(qtyOf(x)).replace(/,/g,'').trim()};});
  if(rows.some(function(r){return !/^\d+(\.\d{1,2})?$/.test(r.qty);})){errs[p.pono]='입고수량을 확인해 주세요.';draw();return;}
  if(!confirm(p.pono+' 입고확인을 저장합니다.'))return;
  busy.in=1;errs[p.pono]='';draw();
  var at=new Date().toISOString(),rev=Number(ACT.inr&&ACT.inr.rev||0)+1,rs=rows.map(function(r){return {ccode:r.ccode,qty:Number(r.qty)};}),np=ACT.imgs.filter(Boolean).length;
  P.commit([{name:'erp_poin/'+p.inTok+'_'+ACT.ship,fields:{tok:p.inTok,ship:ACT.ship,pono:p.pono,rows:rs,at:at,rev:rev,photos:np}},
    {name:'erp_podlv/'+ACT.ship,fields:{pono:p.pono,rows:rs,inAt:at,rev:rev},mask:['pono','rows','inAt','rev']}])
    .then(function(){busy.in=0;ACT.editing=false;ACT.editBox=null;ACT.draft={};return loadAct().then(draw);},
      function(){busy.in=0;return loadAct().then(function(){errs[p.pono]=locked()?'잠겨서 고칠 수 없습니다.':'입고확인을 저장하지 못했습니다.';draw();});});
}
function askEdit(){   /* 「수정요청」: 기사 발주서 QR 을 다시 찍어(또는 발주번호) 같은 발주면 고칠 수 있음 */
  var p=actPo();if(!p||busy.in||locked())return;errs[p.pono]='';
  var cam=h('div','cam'),inp=h('input'),okb=h('button','sec','확인');inp.placeholder='발주번호';inp.setAttribute('aria-label','발주번호');inp.autocomplete='off';okb.type='button';
  var check=function(t){t=String(t||'').trim();var m=/(?:입고|%EC%9E%85%EA%B3%A0)\.html#([A-Za-z0-9_-]{32,64})/.exec(t);
    var same=(m&&m[1]===ACT.ship)||t.toUpperCase()===String(p.pono).toUpperCase();
    if(stopCam)stopCam();stopCam=null;if(same){ACT.editing=true;ACT.editBox=null;errs[p.pono]='';}else errs[p.pono]='다른 발주서입니다.';draw();};
  okb.addEventListener('click',function(){check(inp.value);});inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();check(inp.value);}});
  ACT.editBox=h('div','acts',cam,h('div','manual',inp,okb));draw();
  stopCam=P.scanner(cam,check,function(){cam.hidden=true;if(!errs[p.pono])errs[p.pono]='카메라를 쓸 수 없습니다. 발주번호를 넣어 주세요.';draw();});   /* 늦게 온 카메라 실패가 「다른 발주서입니다」를 덮지 않게 */
}
function inPart(p){
  var d=ACT.dlv||{},fin=p.final===true||d.final===true,ed=canEdit()&&!fin,rows=(p.rows||[]).filter(Boolean);   /* v155 납품완료 = 보기만 */
  var done=d.doneAt&&ACT.inr&&Number(d.doneRev||0)>=Number(ACT.inr.rev||0);
  var step=function(t,on,at){return h('div','step'+(on?' on':''),h('span','',t),h('span','',at||''));};
  var file=h('input');file.type='file';file.accept='image/*';file.multiple=true;file.setAttribute('capture','environment');file.hidden=true;
  file.addEventListener('change',function(){addPhotos(file.files);file.value='';});
  var pb=h('button','sec wide','명세서사진업로드');   /* v154 사장님 「입고처 명세서사진 업로드 버튼 이름을 명세서사진업로드 라고 바꿔줘」 */pb.type='button';pb.disabled=!!busy.in||!ed||ACT.imgs.every(Boolean);pb.addEventListener('click',function(){file.click();});
  var ib=h('button','wide','입고확인');ib.type='button';ib.disabled=!!busy.in||!ed;ib.addEventListener('click',saveIn);
  if(fin){pb=null;ib=null;}
  var eb=null;if(!fin&&ACT.inr&&!ACT.editing&&!locked()){eb=h('button','sec wide','수정요청');eb.type='button';eb.disabled=!!busy.in;eb.addEventListener('click',askEdit);}
  return h('div','in',
    h('div','steps',step('입고확인'+(ACT.inr&&Number(ACT.inr.rev)>1?' (수정 '+(Number(ACT.inr.rev)-1)+')':''),!!ACT.inr,ACT.inr?P.when(ACT.inr.at):''),step('납품완료',!!done,done?P.when(d.doneAt):''),!fin&&locked()?step('잠김',true,''):null),
    rows.map(function(x){var c=show(x.ccode),q=h('input');q.type='text';q.inputMode='decimal';q.value=qtyOf(x);q.disabled=!ed||!!busy.in;q.setAttribute('aria-label','입고수량 '+show(x.cname));
      q.addEventListener('input',function(){ACT.draft[c]=q.value;});return h('div','inq',h('span','','입고수량 · '+show(x.cname)),q);}),
    h('div','photos',ACT.imgs.filter(Boolean).map(function(im){var i=h('img');i.alt='발주서 사진';i.src=String(im.data||'').indexOf('data:image/')===0?im.data:'';return i;})),
    h('div','acts',pb,file,ib,eb),ACT.editBox&&!ACT.editing?ACT.editBox:null);
}
function kv(pairs){var d=h('dl');pairs.forEach(function(p){d.append(h('dt','',p[0]),h('dd',p[2]||'',p[1]));});return d;}
function draw(){
  if(BOX===false){say('발주서가 없습니다.',true);return;}
  if(!BOX)return;
  var out=BOX.kind==='출고처',pos=(BOX.pos||[]).filter(Boolean);
  if(!out)pos=pos.filter(function(p){return !!CONF[p.pono];});   /* 입고처 = 발주확인된 것만 */
  pos=pos.filter(function(p){return p.final!==true||(ACT&&ACT.pono===p.pono);});   /* v156 납품완료는 목록·건수에서 뺌(기사 QR 로 연 그 발주만 보기용으로 남김) */
  if(!out&&ACT)pos=pos.filter(function(p){return p.pono===ACT.pono;}).concat(pos.filter(function(p){return p.pono!==ACT.pono;}));   /* 연 발주서를 맨 위로 */
  document.title='발주서 '+show(BOX.name);
  var cards=pos.map(function(p){
    var c=CONF[p.pono],d=DLV[p.pono]||{},rows=(p.rows||[]).filter(Boolean),top=h('div','top',h('span','no',show(p.pono))),act=!out&&ACT&&ACT.pono===p.pono,fin=p.final===true||d.final===true;   /* v155 영림원 입력완료 = 납품완료 */
    if(fin)top.append(h('span','st on','납품완료'));
    else if(out){if(c)top.append(h('span','st on','발주확인 '+when(c.at)));
      else{top.append(h('span','st','발주확인 전'));var b=h('button','','발주확인');b.type='button';b.disabled=!!busy[p.pono];b.addEventListener('click',function(){confirmPo(p.pono);});top.append(b);}}
