<!doctype html>
<!-- 발주박스 공유 페이지 — 로그인 없음, 폼과 별개. 주소 = 발주박스.html#<박스 열쇠>. 자료 = erp_pobox/<열쇠>(폼이 씀) · erp_poconfirm/<발주번호>.
     v133 출고처·입고처 박스 · v138 단가 없음 · v142 QR·바코드 · v145(사장님 확정 흐름) 다시 짬:
     출고처 = 그 거래처 발주 모두 + 「발주확인」 → 확인되면 QR(발주서.html#공개열쇠)·바코드(발주번호) + 「배송기사 공유」(배송.html#배송열쇠, 한 발주 한 링크).
     입고처 = 발주확인된 발주만, QR·바코드 없음. 위에 「스캔」(기사 폰 발주서 QR)·발주번호 칸 → 입고.html(이 박스에 없는 발주면 멈춤). 카드마다 「입고」·진행 단계. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>발주서</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="발주공통.css">
</head>
<body>
<main id="main"><p class="msg">불러오는 중</p></main>
<script src="발주공통.js"></script>
<script>
(function(){
"use strict";
var P=window.PO,h=P.h,show=P.show,num=P.num,mainEl=document.getElementById('main');
function say(t,bad){mainEl.replaceChildren(h('p','msg'+(bad?' bad':''),t));}
function when(s){var t=new Date(s);if(!s||isNaN(t))return show(s);var p=function(n){return String(n).padStart(2,'0');};return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate())+' '+p(t.getHours())+':'+p(t.getMinutes());}
var key=(location.hash||'').slice(1);
if(!P.keyOk(key)){say('발주서가 없습니다.',true);return;}
var BOX=null,CONF={},DLV={},busy={},errs={},NOTE={},CODES={},topErr='',stopCam=null,camEl=null;
function load(){
  return P.getOne('erp_pobox/'+key).then(function(b){
    if(!b){BOX=false;return;}BOX=b;if(b.kind==='입고처')P.rememberInbox(key);
    var pos=(b.pos||[]).filter(function(p){return p&&P.noOk(p.pono);}),names=pos.map(function(p){return 'erp_poconfirm/'+p.pono;});
    if(b.kind==='입고처')pos.forEach(function(p){if(P.keyOk(p.ship))names.push('erp_podlv/'+p.ship);});
    return P.getMany(names).then(function(o){var c={},d={};pos.forEach(function(p){if(o['erp_poconfirm/'+p.pono])c[p.pono]=o['erp_poconfirm/'+p.pono];if(P.keyOk(p.ship)&&o['erp_podlv/'+p.ship])d[p.pono]=o['erp_podlv/'+p.ship];});CONF=c;DLV=d;});
  }).then(draw,function(){if(BOX==null)say('불러오지 못했습니다.',true);});
}
function confirmPo(no){
  if(!confirm(no+' 발주를 확인합니다.'))return;
  busy[no]=1;errs[no]='';draw();
  P.commit([{name:'erp_poconfirm/'+no,fields:{box:key,pono:no,at:new Date().toISOString()},exists:false}])
    .then(function(){busy[no]=0;return load();},function(){busy[no]=0;return load().then(function(){if(!CONF[no]){errs[no]='발주확인을 저장하지 못했습니다.';draw();}});});
}
/* 출고처: 배송기사 링크 = erp_poship/<새 열쇠> — 한 발주 하나(erp_poshipref/<박스 열쇠>_<발주번호>) */
function shipOf(p){
  var ref='erp_poshipref/'+key+'_'+p.pono,get=function(){return P.getOne(ref).then(function(r){return r&&r.ship||null;});};
  return get().then(function(k){if(k)return k;k=P.rkey();
    return P.commit([{name:'erp_poship/'+k,fields:{box:key,pono:p.pono,pubKey:p.pubKey,at:new Date().toISOString()},exists:false},
      {name:ref,fields:{ship:k,box:key,pono:p.pono},exists:false}]).then(function(){return k;},function(e){return get().then(function(k2){if(k2)return k2;throw e;});});});
}
function shareShip(p){
  if(busy['s'+p.pono])return;busy['s'+p.pono]=1;errs[p.pono]='';NOTE[p.pono]='';draw();
  shipOf(p).then(function(k){busy['s'+p.pono]=0;draw();
    var url=new URL('배송.html#'+k,location.href).href,text='INGHOME-'+show(BOX.name)+' - 발주서 '+p.pono+' 배송';
    var copy=function(){return (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(text+'\n'+url):Promise.reject()).then(function(){NOTE[p.pono]='링크를 복사했습니다.';draw();},function(){NOTE[p.pono]=url;draw();});};
    if(navigator.share)return navigator.share({title:text,text:text,url:url}).catch(function(e){if(e&&e.name==='AbortError')return;return copy();});
    return copy();
  },function(){busy['s'+p.pono]=0;errs[p.pono]='배송기사 링크를 만들지 못했습니다.';draw();});
}
/* 입고처: 기사 폰 발주서 QR(입고.html#배송열쇠) 또는 발주번호 → 이 박스의 그 발주 입고 페이지. 이 박스에 없으면 멈춤 */
function goIn(txt){
  var t=String(txt||'').trim(),i=t.indexOf('입고.html#'),j=t.indexOf('%EC%9E%85%EA%B3%A0.html#'),pos=(BOX.pos||[]).filter(Boolean),p=null,sk='';
  if(i>=0||j>=0){sk=t.slice(i>=0?i+'입고.html#'.length:j+'%EC%9E%85%EA%B3%A0.html#'.length).split('&')[0];p=pos.filter(function(x){return x.ship===sk;})[0];
    if(!p&&P.keyOk(sk)){location.href=new URL('입고.html#'+sk+'&b='+key,location.href).href;return;}}   /* 박스 문서에 배송 열쇠가 아직 없으면 입고.html 이 발주번호로 다시 봄(없으면 멈춤) */
  else{p=pos.filter(function(x){return String(x.pono).toUpperCase()===t.toUpperCase();})[0];sk=p&&p.ship;}
  if(!p||!CONF[p.pono]){topErr='이 입고처 박스에 없는 발주입니다.';draw();return;}
  if(!P.keyOk(sk)){topErr='배송기사 링크가 아직 없는 발주입니다.';draw();return;}
  location.href=new URL('입고.html#'+sk+'&b='+key,location.href).href;
}
function scanTop(){if(stopCam)stopCam();topErr='';camEl=h('div','cam');draw();stopCam=P.scanner(camEl,function(t){stopCam=null;camEl=null;goIn(t);},function(){camEl=null;topErr='카메라를 쓸 수 없습니다. 발주번호를 넣어 주세요.';draw();});}
function kv(pairs){var d=h('dl');pairs.forEach(function(p){d.append(h('dt','',p[0]),h('dd',p[2]||'',p[1]));});return d;}
function draw(){
  if(BOX===false){say('발주서가 없습니다.',true);return;}
  if(!BOX)return;
  var out=BOX.kind==='출고처',pos=(BOX.pos||[]).filter(Boolean);
  if(!out)pos=pos.filter(function(p){return !!CONF[p.pono];});   /* 입고처 = 발주확인된 것만 */
  document.title='발주서 '+show(BOX.name);
  var cards=pos.map(function(p){
    var c=CONF[p.pono],d=DLV[p.pono]||{},rows=(p.rows||[]).filter(Boolean),top=h('div','top',h('span','no',show(p.pono)));
    if(out){if(c)top.append(h('span','st on','발주확인 '+when(c.at)));
      else{top.append(h('span','st','발주확인 전'));var b=h('button','','발주확인');b.type='button';b.disabled=!!busy[p.pono];b.addEventListener('click',function(){confirmPo(p.pono);});top.append(b);}}
    else{var stt=d.locked?'잠김':d.doneAt&&Number(d.doneRev||0)>=Number(d.rev||0)&&d.rev?'납품완료 '+when(d.doneAt):d.inAt?'입고확인 '+when(d.inAt):'입고대기';
      top.append(h('span','st on',stt));
      if(P.keyOk(p.ship)){var ib=h('button','sec','입고');ib.type='button';ib.addEventListener('click',function(){location.href=new URL('입고.html#'+p.ship+'&b='+key,location.href).href;});top.append(ib);}}
    var ck=p.pono+'|'+p.pubKey;if(out&&c&&!CODES[ck])CODES[ck]=P.codes(P.keyOk(p.pubKey)?new URL('발주서.html#'+p.pubKey,location.href).href:'',show(p.pono));
    var head=out?[['발주일',show(p.podate)]]:[['발주일',show(p.podate)],['구매거래처',show(p.vendor)],['발주확인',c?when(c.at):'']];
    return h('div','po',top,out&&c?CODES[ck]:null,kv(head),
      rows.map(function(x){return h('div','row',h('div','nt',show(x.cname)),kv([['품번',show(x.ccode),'mono'],['규격',show(x.cspec)],['단위',show(x.unit)],['발주수량',num(x.qty),'n'],['납품예정일',show(x.duedate)],['창고',show(x.wh)],['납품수량',num(x.dlv),'n']]));}),
      out&&c?h('div','ship',(function(){var sb=h('button','','배송기사 공유');sb.type='button';sb.disabled=!!busy['s'+p.pono];sb.addEventListener('click',function(){shareShip(p);});return sb;})(),NOTE[p.pono]?h('span','note',NOTE[p.pono]):null):null,
      errs[p.pono]?h('p','err',errs[p.pono]):null);});
  var bar=null;
  if(!out){var inp=h('input'),okb=h('button','sec','확인'),sc=h('button','wide','스캔');inp.placeholder='발주번호';inp.setAttribute('aria-label','발주번호');inp.autocomplete='off';okb.type='button';sc.type='button';
    okb.addEventListener('click',function(){goIn(inp.value);});inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();goIn(inp.value);}});sc.addEventListener('click',scanTop);
    bar=h('div','acts',sc,camEl,h('div','manual',inp,okb),topErr?h('p','err',topErr):null);}
  PO.fill(mainEl,[].concat(h('h1','',show(BOX.name)),h('p','sub',out?'출고처 · '+pos.length+'건':'입고처 · 입고대기 '+pos.length+'건'),bar,
    cards.length?cards:h('p','msg',out?'발주서가 없습니다.':'입고대기 발주가 없습니다.')));
}
load();
setInterval(function(){if(document.visibilityState==='visible'&&!camEl&&!Object.keys(busy).some(function(k){return busy[k];}))load();},30000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!camEl)load();});
})();
</script>
</body>
</html>
