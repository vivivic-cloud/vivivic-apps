<!doctype html>
<!-- 배송기사 납품 링크 — 판 번호는 머리띠 VIVIVIC 옆 배지와 같다. 고칠 때 둘을 같이 올린다: v1 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>납품</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* 폼 영림원외주입력.html(v3 = 에이엠티·조혼가구 값)의 값을 그대로 옮김 — 새로 지은 값 없음.
   머리띠 .topbar · 카드 .card · 단추 .btn/.primary/.small · 입력칸 · 빈 화면 .empty · 흑백 정사각 박스 .asmq/.asmtile · 경로 .asmcrumb */
:root{--ink:#37352f;--muted:#787774;--faint:#b0aeaa;--line:#ededeb;--line2:#e3e2e0;--rowline:#f0eeec;
  --fill:#f1f1ef;--fill2:#f5f5f4;--fill3:#f7f6f3;--fill4:#fbfbfa;--red:#dc2626;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:#fff;color:var(--ink);font:400 14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;height:64px;display:flex;align-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:900;font-size:20px;letter-spacing:-0.05em;color:var(--ink);line-height:1}
.ver{font-size:9px;font-weight:700;color:var(--faint);background:#f1f0ef;padding:1px 6px;border-radius:4px;letter-spacing:0.04em;font-family:var(--mono)}
.wrap{max-width:1180px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
h1{font-size:clamp(1.375rem,5vw,1.875rem);line-height:1.2;font-weight:900;letter-spacing:-0.03em;margin:0 0 14px;overflow-wrap:anywhere}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.stephead h2{font-size:clamp(1.125rem,4vw,1.375rem);margin:0 0 6px;font-weight:900;letter-spacing:-0.02em}
label,.lab{font-size:11px;font-weight:700;color:var(--muted)}
.req{color:var(--red);margin-left:2px}
input[type=text],input[type=date],input[type=number],textarea{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0;min-height:40px}
input:focus,textarea:focus{outline:none;border-color:var(--ink)}
input.bad{border-color:var(--red)}
textarea{resize:vertical;min-height:72px}
.err{font-size:11px;color:var(--red);font-weight:700}
.msg{font-size:13px;font-weight:700;color:var(--muted)}.msg.bad{color:var(--red)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;margin:10px 0 0}.fgrid .full{grid-column:1/-1}
.fcode{font-size:11px;color:var(--muted);font-family:var(--mono);overflow-wrap:anywhere}
.chip{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:800;border:1px solid var(--line2);letter-spacing:.02em;background:#fff;color:var(--ink);margin-left:6px;vertical-align:middle}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 13px var(--sans);border-radius:8px;padding:9px 14px;min-height:40px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s}
.btn:hover{background:var(--fill3)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);padding-inline:20px}.btn.primary:hover{background:#000}
.btn.small{padding:5px 10px;font-size:11px;min-height:32px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn:focus-visible,[role=button]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 0}
.empty{color:var(--muted);border:1px dashed var(--line2);border-radius:12px;padding:18px;font-size:13px;background:var(--fill4)}
.nav{display:flex;gap:6px;margin:0 0 8px}
/* 흑백 정사각 박스 — 폼 .asmq 값 그대로 */
.asmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0;min-width:0}
.asmtile{min-width:0;border:1px solid var(--line2);border-radius:12px;background:#fff;aspect-ratio:1/1;display:flex;flex-direction:column}
.asmface{flex:1 1 auto;display:flex;flex-direction:column;gap:4px;padding:10px;cursor:pointer;min-width:0;border-radius:11px}.asmface:hover{background:var(--fill2)}
.asmtt{display:block;font-weight:800;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}.asmn2{font-size:22px;font-weight:900;line-height:1.1}
.asmnames{list-style:none;margin:2px 0 0;padding:0;font-size:12px;font-weight:700;line-height:1.35;overflow:hidden}.asmnames li{overflow-wrap:anywhere}
.asmcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;margin:4px 0 10px;font-size:14px;font-weight:800;min-width:0}
.asmcrumb button{position:relative;background:none;border:0;padding:6px 2px;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer;overflow-wrap:anywhere;text-align:left}
.asmcrumb button::after{content:'';position:absolute;inset:-8px -4px}
.asmcrumb i{font-style:normal;color:var(--faint)}.asmcrumb b{font-weight:900;overflow-wrap:anywhere}
/* 발주 줄 — 폼 .rowcard 값 */
.po{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 10px;background:var(--fill4);min-width:0}
.po .nt{font-weight:800;overflow-wrap:anywhere}
.po dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 12px;margin:8px 0 0;font-size:13px}
.po dt{color:var(--muted);font-weight:700}.po dd{margin:0;font-weight:600;overflow-wrap:anywhere;white-space:pre-line}
.po dd.n{font-variant-numeric:tabular-nums}
@media (max-width:820px){.card{padding:16px}.wrap{padding-top:16px}}
@media (max-width:480px){.btn{min-height:44px}.btn.small{min-height:36px}.fgrid{grid-template-columns:minmax(0,1fr)}.actions .btn.primary{flex:1 1 100%}}
.qr{display:flex;justify-content:center;margin:14px 0 4px}.qr canvas{display:block;max-width:100%;height:auto}
.st{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--line2);background:var(--fill2);color:var(--ink)}.st.on{background:#fff;border-color:var(--ink)}.st.done{background:var(--ink);color:#fff;border-color:var(--ink)}
.sub{font-size:13px;font-weight:800;margin:18px 0 8px}
.po dd.chg{font-weight:900;text-decoration:underline}
.head dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 12px;margin:0;font-size:13px}.head dt{color:var(--muted);font-weight:700}.head dd{margin:0;font-weight:600;overflow-wrap:anywhere}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">VIVIVIC</div>
    <span class="ver">v1</span>
  </div>
</header>
<div class="wrap" id="app"><p class="msg">불러오는 중…</p></div>
<script>

   입고확인이 완료되면 수정된 내용이 동일한 배송기사의 공유된 발주서 화면이 변경되면서 납품완료 버튼이 활성화되어 … 배송기사의 납품완료확인이 되어야 모든 납품이 완료된 상황으로 봐 야 합니다.」

   v226 에 지운 옛 배송기사 페이지와 코드·자료를 함께 쓰지 않는다. */

    var n=q.getModuleCount(),cell=8,sz=(n+8)*cell,cv=document.createElement('canvas');

    return h('div',{class:'po'},h('div',{class:'nt'},t(x.cname)),h('dl',{},h('dt',{},'품번'),h('dd',{},t(x.ccode)),t(x.cspec)?[h('dt',{},'규격'),h('dd',{},t(x.cspec))]:null,t(x.unit)?[h('dt',{},'단위'),h('dd',{},t(x.unit))]:null,
      h('dt',{},'발주수량'),h('dd',{class:'n'},num(x.poqty)),recv?[h('dt',{},'입고수량'),h('dd',{class:'n'},num(x.qty)),h('dt',{},'차이'),h('dd',{class:'n'+(d?' chg':'')},d===0?'0':(d>0?'+':'')+num(d))]:null));});

</script>

</html>
