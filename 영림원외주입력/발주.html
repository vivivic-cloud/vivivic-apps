<!doctype html>
<!-- v203 사장님 「발주서 입고대기 박스의 내용은 출고되는 거래처별로 박스구분되어 보여지게 해주세요」 — 입고대기 안 = 보내는(출고) 거래처마다 박스(처음 닫힘, 폼과 같게). 카드에 보낸 거래처가 여럿이면 거래처마다 나눔.
     v202 사장님 「업무 흐름에 따라 납품될 수 없는 공정이 납품확인 버튼이 눌리면 안됩니다…」 — 보낸 공정이 앞 공정 물건을 아직 입고확인 안 했으면(fp 열쇠 없음) 「납품확인」 단추 없음.
     v201 사장님 「보내는 쪽에 적혀있는 납품대기라는 표현 모두 삭제해줘」 — 보낼 납품 칩 = 「받을업체-공정」만(완료면 「… 납품완료」).
     v200 사장님 「거래처박스가 있고 거래처 박스로 들어가면 작업박스와 입고대기 박스를 만들라고요 해당 박스로 들어가면 목록 보이게 해달라고」 — 머리 아래 박스 둘(처음 닫힘): 작업(시트 단추·발주·발주서·보낼 납품·납품완료) · 입고대기(받을 납품 「납품확인」).
     v199 사장님 「업체별 박스에 입고확인(납품받을것) / 작업(납품보낼것)  이렇게 구ㅡ분해」 — 상자 둘: 입고확인(받을 납품, 「납품확인」) · 작업(보낼 납품 + 납품완료). 조립 시트도 입고확인 상자.
     v196 사장님 「받는쪽과 보내는쪽 기준으로 안나눠져있는데?」 — 공정 시트 묶음 = 받을 납품(「납품확인」) · 보낼 납품 · 납품완료, 조립 시트 맨 위 받을 납품(박스 rcv).
     v195 받을 납품 「납품확인」 — 시트 카드 줄마다 받을 납품(앞 공정 보낸업체-공정 납품대기 + 「납품확인」)·보낼 납품(받을업체-공정 납품대기), 조립 시트 「도착」 칸도 「납품확인」.
       = erp_prodconfirm/<열쇠 fk> {box:이 박스 열쇠, dk, at} 새로 만들기(규칙: 박스 cks 에 든 열쇠만). 상태는 erp_prodconfirm 을 한 장씩 get(없으면 박스 값).
     v193 공정업체 시트 — 박스 sheets[{proc,pos}](폼이 씀): 그 업체가 맡은 공정마다 시트 하나, 카드 = 그 공정 줄 외주납품 대기/완료. 조립업체는 「조립」 시트 = 아래 v176~v186 그대로. 공정업체만인 박스는 발주 탭 없음.
     v186 묶음 등록대기 → 납품대기 → 납품완료 · 납품 카드 숫자 칩 · 펴면 공정별 외주납품·자재출고·도착·조립 외주납품·외주입고 대기/완료.
     v185 발주서 카드 = 폼 「저장한 항목」 카드 모양(details.rec · 칩 대기·진행중·완료·오류).
     v184 발주서 = 업체 박스 하나(처음 닫힘, 겉 숫자 칩, 안 등록대기·등록완료) — 폼 「발주서」 업체 박스와 같은 꼴.
     v183 제품 발주 부속 표의 공통부속(두 제품 이상 BOM) 줄 = 처음 체크 해제 · 왼쪽 띠.
     v182 「필요일」 → 「납품요청일」 · 발주서 목록 = 「등록대기」·「등록완료」 접힌 카드(폼 「발주서」 와 같은 꼴), 세는 말 뺌.
     v181 사장님 「발주서 링크에는 품번 나올필요없어요 숨겨 주세요.」 — 화면에서 품번 칸·글자 모두 뺌(문서에는 그대로 저장).
     v180 「제품 발주」·「공통부속 발주」 두 탭(공통부속 = 박스 parts 에서 여러 줄 골라 수량, 문서 kind '부속' — 규칙 배포 뒤 저장됨) · 발주서마다 단계(폼이 박스 pos.st 에 적음)·부속 공정·도착 숫자.
     v178 새로고침 단추 · 발주서 목록 = 박스 문서 pos(폼이 씀) + 이 폰에서 막 저장한 것. v177 제품 = 고르기 칸(select). v176 조립업체 발주 링크 — 사장님 「조립업체에서 시작될 발주링크를 만들어보자」(11-10). 로그인 없음, 폼과 별개.
     주소 = 발주.html#<조립업체 박스 열쇠>. 자료 = erp_asmbox/<열쇠>(폼이 씀: vendor·pcodes·items[{pcode,pname,pspec,rows[{ccode,cname,cspec,unit,per}]}]).
     제품 고르기 → 발주 수량·필요일 → 기본 BOM 부속 줄 전부(필요 수량 처음 값 = BOM 수량 × 발주 수량) → 줄마다 빼기(체크 해제)·수량 고치기 → 「발주서 저장」
       = erp_asmpo/<무작위 32자> {box,vendor,pcode,pname,pspec,qty,need,rows[{ccode,cname,cspec,unit,per,base,qty,on}],at,status:'대기'} 새로 만들기(REST commit, 없을 때만).
     이 폰에서 저장한 발주서 id 는 localStorage asm.sent 에 남겨 아래에 보인다(폼에서 지우면 사라짐). 영림원 입력·가공처 지시는 안 함. -->

<style>
/* v178 새로고침 */
.bar{display:flex;justify-content:flex-end;margin:-6px 0 10px}.bar button{min-height:40px;padding:8px 14px}
label.one{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 10px}
label.one select{font:inherit;font-weight:700;color:var(--ink);border:1px solid var(--ink);border-radius:12px;padding:10px 12px;min-height:48px;width:100%;background:#fff;max-width:100%}
.fl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:0 0 10px}
.fl label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.fl input{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%;background:#fff}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;margin:0 0 12px}
table{border-collapse:collapse;font-size:13px;min-width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--rowline);text-align:left;white-space:nowrap;vertical-align:middle}
th{background:var(--fill3);color:var(--muted);font-weight:800;font-size:12px}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td.mono{font-family:var(--mono)}
td input[type=number]{width:84px;font:inherit;text-align:right;border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px}
td input[type=checkbox]{width:20px;height:20px;margin:0}
tr.chg td{background:#fffbeb}tr.off td{background:var(--fill3);color:var(--muted)}tr.off td:not(:first-child){text-decoration:line-through}
tr.off input[type=number]{visibility:hidden}
tr.com td:first-child{box-shadow:inset 3px 0 0 #93c5fd}   /* v183 공통부속 줄 */
tr.idle td{color:var(--muted)}tr.idle input[type=number]{visibility:hidden}
.sent{border-top:1px solid var(--line);margin:18px 0 0;padding:12px 0 0}
.sent h2{font-size:15px;font-weight:900;margin:0 0 8px}
.sent .po{margin:8px 0}
/* v182 폼 「발주서」 와 같은 카드 */
.sent h3{font-size:13px;font-weight:800;color:var(--muted);margin:12px 0 2px}.sent .cnt{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}
.card{border:1px solid var(--line);border-radius:14px;margin:8px 0;background:var(--fill3)}.card.open{background:#fff}
.cardh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:10px 12px;font-weight:600;min-height:44px}
.cardh .arr{color:var(--muted);width:12px}.cardh .nt{font-weight:800;word-break:break-all}.cardh .ns{font-size:12px;color:var(--muted);font-weight:700;flex-basis:100%;padding-left:20px}
.cardh .st{padding-left:20px}.card .tw{margin:0 10px 10px}
/* v185 폼 「저장한 항목」 카드와 같은 모양(영림원외주입력.html details.rec · .rt · .chip · .list h3 · .empty 값 그대로) */
details.rec{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
details.rec[open]{border-color:#e3e2e0}
details.rec>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;min-height:44px}
details.rec>summary::-webkit-details-marker{display:none}
.rt{min-width:0;flex:1}.rt b{display:block;font-weight:800;font-size:13.5px;overflow-wrap:anywhere}.rt small{color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.chip{flex:none;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:800;border:1px solid transparent;letter-spacing:.02em}
.chip.대기{background:var(--fill2);color:var(--ink);border-color:#eeeeec}.chip.진행중{background:#fef3c7;color:var(--amber);border-color:#fde68a}
.chip.완료{background:#f0fdf4;color:var(--green);border-color:#bbf7d0}.chip.오류{background:#fef2f2;color:var(--red);border-color:#fecaca}
.recb .tw{margin:0 14px 12px}
h3.lh{font-size:15px;font-weight:900;margin:14px 0 8px;display:flex;gap:8px;align-items:baseline;letter-spacing:-0.02em;color:var(--ink)}h3.lh span{font-weight:700;font-size:11px;color:var(--muted)}
.empty{color:var(--muted);border:1px dashed #e3e2e0;border-radius:12px;padding:18px;font-size:13px;background:#fbfbfa}
.boxh .chip{margin-left:2px}
.nums{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}   /* v186 납품 카드 숫자 칩 */
table.det td{vertical-align:top}table.det td.dc{min-width:120px}table.det .dp{font-size:12px;font-weight:700;margin:0 0 3px}table.det .chip{display:inline-block;margin:0 4px 3px 0}table.det tr.asmrow td{background:#fbfbfa;font-weight:700}
.vbox{background:var(--fill3)}.vbox .vin{padding:0 10px 10px}.vbox .vin .card{background:#fff}.boxh .st{padding-left:0}
/* v180 두 탭 · 공통부속 표의 제품 칸 */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 12px}.tabs button{min-height:44px}
td.for{white-space:normal;min-width:160px;font-size:12px;color:var(--muted)}
.st.bad{color:var(--red)}
.sheets{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.sheets button{min-height:40px;padding:8px 14px}   /* v193 공정 시트 */
.bx3{border:1px solid var(--line);border-radius:14px;background:#fff;margin:8px 0 12px}.bx3.open{padding:0 12px 12px}.bx3>.cardh{padding:12px}.bx3.open>.cardh{padding:12px 0}.bx3 h3.sub{font-size:13px}   /* v200 작업·입고대기 박스 */
.rcv{display:grid;gap:4px;margin:2px 0 0}.rcv button{min-height:36px;padding:6px 12px;font-size:13px;justify-self:start}.rcv .manual button{min-height:36px;padding:6px 12px;font-size:13px}.rcv .part{margin:0;font-size:12px}.rcv .err{margin:0;font-size:12px}.rcv .at{font-size:11px;color:var(--muted);font-weight:700}   /* v195 납품확인 */
</style>

<body>
<main id="main"><p class="msg">불러오는 중</p></main>
<script src="발주공통.js"></script>
<script>
(function(){
"use strict";
var P=window.PO,h=P.h,show=P.show,num=P.num,mainEl=document.getElementById('main');
function say(t,bad){mainEl.replaceChildren(h('p','msg'+(bad?' bad':''),t));}
function when(s){var t=new Date(s);if(!s||isNaN(t))return show(s);var p=function(n){return String(n).padStart(2,'0');};return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate())+' '+p(t.getHours())+':'+p(t.getMinutes());}
function r4(n){return Math.round(n*10000)/10000;}
var key=(location.hash||'').slice(1).split('&')[0];
if(!P.keyOk(key)){say('발주 링크가 없습니다.',true);return;}
var BOX=null,SEL=null,QTY='',NEED='',ROWS=[],ERR='',NOTE='',BUSY=false,SENT=[],MODE='제품',PART={};   /* v180 PART = 공통부속 고른 것 {ccode:{on,qty}} */
/* v178 발주서 목록 = 저장소 기준: 폼이 박스 문서에 적는 그 박스 발주서 요약(pos — 폼에서 지우면 빠짐, 상태 그대로)
   + 이 폰에서 막 저장해 아직 pos 에 없는 것(한 장씩 get, 저장소에 없으면 뺌). 링크는 erp_asmpo 목록을 못 읽는다(규칙 get 만). */
function sentIds(){try{var o=JSON.parse(localStorage.getItem('asm.sent')||'{}');return (o[key]||[]).filter(P.keyOk);}catch(e){return [];}}
function sentPut(ids){try{var o=JSON.parse(localStorage.getItem('asm.sent')||'{}');o[key]=ids.slice(0,30);localStorage.setItem('asm.sent',JSON.stringify(o));}catch(e){}}
function sumOf(id,d){var rs=d.rows||[];return {id:id,kind:d.kind==='부속'?'부속':'제품',pname:d.kind==='부속'?(rs.length?show(rs[0].cname)+(rs.length>1?' 외 '+(rs.length-1):''):''):d.pname,qty:d.qty,need:d.need,status:d.status,at:d.at,n:rs.length,st:{r:1,t:'발주서 저장',c:'wait'},rows:rs.filter(function(r){return d.kind!=='부속'||r.on!==false;}).map(function(r){return {cname:r.cname,cspec:r.cspec,unit:r.unit,base:r.base,qty:r.qty,on:r.on!==false,for:r.for||[]};}),
  off:rs.filter(function(r){return r&&r.on===false;}).length,chg:rs.filter(function(r){return r&&r.on!==false&&Number(r.qty)!==Number(r.base);}).length};}
function loadSent(){
  var pos=Array.isArray(BOX&&BOX.pos)?BOX.pos.filter(function(p){return p&&P.keyOk(p.id);}):[],have={};pos.forEach(function(p){have[p.id]=1;});
  var ids=sentIds(),rest=ids.filter(function(i){return !have[i];});
  var done=function(extra){SENT=pos.concat(extra).sort(function(a,b){return String(a.at||'')<String(b.at||'')?1:-1;});
    sentPut(ids.filter(function(i){return have[i]||extra.some(function(x){return x.id===i;});}));};
  if(!rest.length){done([]);return Promise.resolve();}
  return P.getMany(rest.map(function(i){return 'erp_asmpo/'+i;})).then(function(o){
    done(rest.map(function(i){var d=o['erp_asmpo/'+i];return d&&d.box===key?sumOf(i,d):null;}).filter(Boolean));},function(){done([]);});}
var LOADING=false;
function load(){
  LOADING=true;
  return P.getOne('erp_asmbox/'+key).then(function(b){BOX=b||false;},function(){if(!BOX)BOX=null;})
    .then(function(){   /* 새로고침: 고른 제품이 그대로면 친 값 유지 */
      if(!SEL)return;var n=items().filter(function(it){return it.pcode===SEL.pcode;})[0];
      if(n&&JSON.stringify(n.rows)===JSON.stringify(SEL.rows)){SEL=n;ROWS.forEach(function(x,i){x.r=n.rows[i];});}else{SEL=null;ROWS=[];QTY='';}})
    .then(loadCf).then(loadSent).then(function(){LOADING=false;draw();},function(){LOADING=false;draw();});
}
function items(){return ((BOX&&BOX.items)||[]).filter(function(it){return it&&it.pcode&&(it.rows||[]).length;});}
/* v183 사장님 「발주링크 제품발주- 공통부속 기본적으로 체크안되어 있게 해주세요」 — 공통부속 = 박스 parts 중 두 제품 이상 BOM 에 있는 부속(for 2개 이상). 처음 체크 해제, 줄 왼쪽 띠로만 구별 */
function comSet(){var o={};parts().forEach(function(p){if((p.for||[]).length>=2)o[p.ccode]=1;});return o;}
function pickItem(it){SEL=it;ERR='';NOTE='';QTY='';var cm=comSet();ROWS=(it.rows||[]).map(function(r){var c=!!cm[r.ccode];return {r:r,on:!c,com:c,qty:'',edited:false};});draw();}
function rowCls(x){return (x.on?'':(x.com?'idle':'off'))+(x.com?' com':'')+(chg(x)?' chg':'');}
/* 발주 수량이 바뀌면 손대지 않은 줄의 필요 수량 = BOM 수량 × 발주 수량 */
function baseOf(x){var q=Number(QTY);return QTY!==''&&isFinite(q)&&q>0?r4(Number(x.r.per||0)*q):'';}
function setQty(v){QTY=v;ROWS.forEach(function(x){if(!x.edited)x.qty=baseOf(x)===''?'':String(baseOf(x));});}
function chg(x){if(!x.on)return false;var b=baseOf(x);return b!==''&&String(x.qty).trim()!==''&&Number(x.qty)!==b;}
function check(){
  var q=Number(QTY);if(QTY===''||!isFinite(q)||q<=0)return '발주 수량을 넣어 주세요.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(NEED))return '납품요청일을 넣어 주세요.';
  var on=ROWS.filter(function(x){return x.on;});if(!on.length)return '발주할 줄이 없습니다.';
  for(var i=0;i<on.length;i++){var v=Number(on[i].qty);if(String(on[i].qty).trim()===''||!isFinite(v)||v<=0)return show(on[i].r.cname)+' 수량을 넣어 주세요.';}
  return '';
}
