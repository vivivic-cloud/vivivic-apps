<!doctype html>
<!-- v183 제품 발주 부속 표의 공통부속(두 제품 이상 BOM) 줄 = 처음 체크 해제 · 왼쪽 띠.
     v182 「필요일」 → 「납품요청일」 · 발주서 목록 = 「등록대기」·「등록완료」 접힌 카드(폼 「발주서」 와 같은 꼴), 세는 말 뺌.
     v181 사장님 「발주서 링크에는 품번 나올필요없어요 숨겨 주세요.」 — 화면에서 품번 칸·글자 모두 뺌(문서에는 그대로 저장).
     v180 「제품 발주」·「공통부속 발주」 두 탭(공통부속 = 박스 parts 에서 여러 줄 골라 수량, 문서 kind '부속' — 규칙 배포 뒤 저장됨) · 발주서마다 단계(폼이 박스 pos.st 에 적음)·부속 공정·도착 숫자.
     v178 새로고침 단추 · 발주서 목록 = 박스 문서 pos(폼이 씀) + 이 폰에서 막 저장한 것. v177 제품 = 고르기 칸(select). v176 조립업체 발주 링크 — 사장님 「조립업체에서 시작될 발주링크를 만들어보자」(11-10). 로그인 없음, 폼과 별개.
     주소 = 발주.html#<조립업체 박스 열쇠>. 자료 = erp_asmbox/<열쇠>(폼이 씀: vendor·pcodes·items[{pcode,pname,pspec,rows[{ccode,cname,cspec,unit,per}]}]).
     제품 고르기 → 발주 수량·필요일 → 기본 BOM 부속 줄 전부(필요 수량 처음 값 = BOM 수량 × 발주 수량) → 줄마다 빼기(체크 해제)·수량 고치기 → 「발주서 저장」
       = erp_asmpo/<무작위 32자> {box,vendor,pcode,pname,pspec,qty,need,rows[{ccode,cname,cspec,unit,per,base,qty,on}],at,status:'대기'} 새로 만들기(REST commit, 없을 때만).
     이 폰에서 저장한 발주서 id 는 localStorage asm.sent 에 남겨 아래에 보인다(폼에서 지우면 사라짐). 영림원 입력·가공처 지시는 안 함. -->

.sent h2{font-size:15px;font-weight:900;margin:0 0 8px}
.sent .po{margin:8px 0}

.sent h3{font-size:13px;font-weight:800;color:var(--muted);margin:12px 0 2px}.sent .cnt{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}
.card{border:1px solid var(--line);border-radius:14px;margin:8px 0;background:var(--fill3)}.card.open{background:#fff}
.cardh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:10px 12px;font-weight:600;min-height:44px}
.cardh .arr{color:var(--muted);width:12px}.cardh .nt{font-weight:800;word-break:break-all}.cardh .ns{font-size:12px;color:var(--muted);font-weight:700;flex-basis:100%;padding-left:20px}
.cardh .st{padding-left:20px}.card .tw{margin:0 10px 10px}
/* v180 두 탭 · 공통부속 표의 제품 칸 */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 12px}.tabs button{min-height:44px}
td.for{white-space:normal;min-width:160px;font-size:12px;color:var(--muted)}
.st.bad{color:var(--red)}
</style>

<script>
(function(){

/* v183 사장님 「발주링크 제품발주- 공통부속 기본적으로 체크안되어 있게 해주세요」 — 공통부속 = 박스 parts 중 두 제품 이상 BOM 에 있는 부속(for 2개 이상). 처음 체크 해제, 줄 왼쪽 띠로만 구별 */

function save(){

/* v180 공통부속 발주 */

/* v182 사장님 「…저장된 발주서는 등록대기목록에 있게해주세요. 입력폼의 발주서와 동일한 구조로 만들어 주세요.」

function sentEl(){
  var reg=SENT.filter(function(d){return Number((d.st||{}).r||1)<=2;}),done=SENT.filter(function(d){return Number((d.st||{}).r||1)>2;});
  return h('section','sent',h('h2','','발주서'),h('h3','','등록대기'),h('p','cnt',reg.length+'건'),reg.length?reg.map(cardEl):h('p','msg','발주서가 없습니다.'),
    h('h3','','등록완료'),h('p','cnt',done.length+'건'),done.map(cardEl));
}
function draw(){
  if(BOX===null){say('불러오지 못했습니다.',true);return;}
  if(BOX===false){say('발주 링크가 없습니다.',true);return;}
  var rf=h('button','sec',LOADING?'불러오는 중':'새로고침');rf.type='button';rf.disabled=LOADING;rf.addEventListener('click',function(){NOTE='';load();draw();});   /* v178 사장님 「발주링크에 새로고침 버튼을 만들어 주세요」 */
  var its=items(),out=[P.who('발주 — '+show(BOX.vendor),'out'),h('div','bar',rf)];
  var tab=function(m,t){var b=h('button',MODE===m?'':'sec',t);b.type='button';b.setAttribute('aria-pressed',MODE===m?'true':'false');b.addEventListener('click',function(){if(MODE!==m){MODE=m;ERR='';NOTE='';draw();}});return b;};
  out.push(h('div','tabs',tab('제품','제품 발주'),tab('부속','공통부속 발주')));   /* v180 사장님 「발주서 입력 링크에서 공통 부속도  골라서 따로 발주 할 수 있어야 함」 */
  if(MODE==='부속'){
    if(NOTE)out.push(h('p','note',NOTE));
    var ps=parts();
    if(!ps.length)out.push(h('p','msg','발주할 부속이 없습니다.'));
    else{var dP=h('input');dP.type='date';dP.value=NEED;dP.addEventListener('input',function(){NEED=dP.value;});dP.addEventListener('change',function(){NEED=dP.value;});
      var erP=h('p','err',ERR);erP.hidden=!ERR;mainEl.oninput=function(){if(ERR){ERR='';erP.hidden=true;}};
      var svP=h('button','wide',BUSY?'저장 중':'발주서 저장');svP.type='button';svP.disabled=BUSY;svP.addEventListener('click',savePart);
      out.push(h('section','po',h('label','one','납품요청일',dP),
        h('div','tw',h('table','',h('thead','',h('tr','',['발주','품명','규격','단위','제품','수량'].map(function(t,i){return h('th',i===5?'n':'',t);}))),h('tbody','',ps.map(partEl)))),erP,svP));}
    out.push(sentEl());P.fill(mainEl,out);return;
  }
  if(NOTE)out.push(h('p','note',NOTE));
  if(!its.length)out.push(h('p','msg','발주할 제품이 없습니다.'));
  if(its.length){   /* v177 제품 = 고르기 칸(사장님 「제품선택칸이 없습니다」) */
    var pSel=h('select');var o0=h('option','','선택');o0.value='';pSel.append(o0);its.forEach(function(it,i){var o=h('option','',show(it.pname));o.value=String(i);if(SEL===it)o.selected=true;pSel.append(o);});
    if(!SEL)pSel.value='';
    pSel.addEventListener('change',function(){var it=its[Number(pSel.value)];if(pSel.value===''){SEL=null;ROWS=[];ERR='';draw();}else if(it&&SEL!==it)pickItem(it);});
    var sec=[h('label','one','제품',pSel)];
    if(SEL){
    var qIn=h('input');qIn.type='number';qIn.inputMode='decimal';qIn.step='any';qIn.min='0';qIn.value=QTY;
    var dIn=h('input');dIn.type='date';dIn.value=NEED;
    var tb=h('tbody','',ROWS.map(rowEl)),er=h('p','err',ERR);er.hidden=!ERR;
    mainEl.oninput=function(){if(ERR){ERR='';er.hidden=true;}};
    qIn.addEventListener('input',function(){setQty(qIn.value);tb.replaceChildren.apply(tb,ROWS.map(rowEl));});
    dIn.addEventListener('change',function(){NEED=dIn.value;});dIn.addEventListener('input',function(){NEED=dIn.value;});
    var sv=h('button','wide',BUSY?'저장 중':'발주서 저장');sv.type='button';sv.disabled=BUSY;sv.addEventListener('click',save);
    sec.push(h('div','fl',h('label','','발주 수량',qIn),h('label','','납품요청일',dIn)),
      h('div','tw',h('table','',h('thead','',h('tr','',['발주','품명','규격','단위','BOM 수량','필요 수량'].map(function(t,i){return h('th',i>=4?'n':'',t);}))),tb)),
      er,sv);
    }
    out.push(h('section','po',sec));
  }
  out.push(sentEl());
  P.fill(mainEl,out);
}
load();
})();
</script>
</body>
</html>
