<!doctype html>
<!-- ⚠ v151 시험용: 누가 찍어도 열림(erp_poship.inbox) — 실제 운영 전 보안 보완(사장님 11-09).
     기사 폰 발주서 QR 이 가리키는 주소(입고.html#<배송열쇠>) — v146 부터 넘겨주기만 한다(QR 안 주소라 지우면 안 됨). v150 박스 열쇠가 없는 폰 = 「입고처 발주목록 박스 링크를 먼저 열어 주세요」.
     이 폰에서 연 입고처 발주박스(localStorage po.inboxes, 주소에 &b= 가 있으면 그것) 중 이 발주가 있는 박스로 → 발주박스.html#<박스 열쇠>&s=<배송열쇠>
     (그 박스 안 발주서에서 사진·입고수량·입고확인·수정요청). 없으면 「이 입고처 박스에 없는 발주입니다.」로 멈춤. 로그인 없음. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>입고</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="발주공통.css">
</head>
<body>
<main id="main"><p class="msg">불러오는 중</p></main>
<script src="발주공통.js"></script>
<script>
(function(){
"use strict";
var P=window.PO,h=P.h,mainEl=document.getElementById('main');
function say(t,bad){mainEl.replaceChildren(h('p','msg'+(bad?' bad':''),t));}
var hp=(location.hash||'').slice(1).split('&'),ship=hp[0],bq=(hp.filter(function(x){return x.indexOf('b=')===0;})[0]||'').slice(2);
if(P.keyOk(bq))P.rememberInbox(bq);
if(!P.keyOk(ship)){say('발주서가 없습니다.',true);return;}
P.getOne('erp_poship/'+ship).then(function(s){
  if(!s){say('발주서가 없습니다.',true);return;}
  /* ⚠ v151 시험용(사장님 11-09): 배송 링크 문서의 inbox(폼이 적은 입고처 박스) — 누가 찍어도 열림. 실제 운영 전 보안 보완 */
  var ks=P.keyOk(bq)?[bq]:P.keyOk(s.inbox)?[s.inbox]:P.inboxes();
  if(!ks.length){say('입고처 발주목록 박스가 아직 준비되지 않았습니다.',true);return;}   /* v150 이 폰에 입고처 박스 열쇠 없음(기사 본인 폰 포함) */
  return P.getMany(ks.map(function(k){return 'erp_pobox/'+k;})).then(function(m){
    var k=ks.filter(function(k){var b=m['erp_pobox/'+k];return b&&b.kind==='입고처'&&(b.pos||[]).some(function(p){return p&&p.pono===s.pono&&P.keyOk(p.inTok);});})[0];
    if(!k){say('이 입고처 박스에 없는 발주입니다.',true);return;}
    location.replace(new URL('발주박스.html#'+k+'&s='+ship,location.href).href);
  });
}).catch(function(){say('불러오지 못했습니다.',true);});
})();
</script>
</body>
</html>
