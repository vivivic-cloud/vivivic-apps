<!doctype html>
<!-- 조립처 발주링크 — 판 번호는 머리띠 VIVIVIC 옆 배지와 같다. 고칠 때 둘을 같이 올린다: v1 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>발주</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* 폼 영림원외주입력.html(v3 = 에이엠티·조혼가구 값)의 값을 그대로 옮김 — 새로 지은 값 없음.
   머리띠 .topbar · 카드 .card · 단추 .btn/.primary/.small · 입력칸 · 빈 화면 .empty · 흑백 정사각 박스 .asmq/.asmtile · 경로 .asmcrumb */
:root{--ink:#37352f;--muted:#787774;--faint:#b0aeaa;--line:#ededeb;--line2:#e3e2e0;--rowline:#f0eeec;
  --fill:#f1f1ef;--fill2:#f5f5f4;--fill3:#f7f6f3;--fill4:#fbfbfa;--red:#dc2626;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:#fff;color:var(--ink);font:400 14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;height:64px;display:flex;align-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:900;font-size:20px;letter-spacing:-0.05em;color:var(--ink);line-height:1}
.ver{font-size:9px;font-weight:700;color:var(--faint);background:#f1f0ef;padding:1px 6px;border-radius:4px;letter-spacing:0.04em;font-family:var(--mono)}
.wrap{max-width:1180px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
h1{font-size:clamp(1.375rem,5vw,1.875rem);line-height:1.2;font-weight:900;letter-spacing:-0.03em;margin:0 0 14px;overflow-wrap:anywhere}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.stephead h2{font-size:clamp(1.125rem,4vw,1.375rem);margin:0 0 6px;font-weight:900;letter-spacing:-0.02em}
label,.lab{font-size:11px;font-weight:700;color:var(--muted)}
.req{color:var(--red);margin-left:2px}
input[type=text],input[type=date],input[type=number],textarea{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0;min-height:40px}
input:focus,textarea:focus{outline:none;border-color:var(--ink)}
input.bad{border-color:var(--red)}
textarea{resize:vertical;min-height:72px}
.err{font-size:11px;color:var(--red);font-weight:700}
.msg{font-size:13px;font-weight:700;color:var(--muted)}.msg.bad{color:var(--red)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;margin:10px 0 0}.fgrid .full{grid-column:1/-1}
.fcode{font-size:11px;color:var(--muted);font-family:var(--mono);overflow-wrap:anywhere}
.chip{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:800;border:1px solid var(--line2);letter-spacing:.02em;background:#fff;color:var(--ink);margin-left:6px;vertical-align:middle}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 13px var(--sans);border-radius:8px;padding:9px 14px;min-height:40px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s}
.btn:hover{background:var(--fill3)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);padding-inline:20px}.btn.primary:hover{background:#000}
.btn.small{padding:5px 10px;font-size:11px;min-height:32px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn:focus-visible,[role=button]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 0}
.empty{color:var(--muted);border:1px dashed var(--line2);border-radius:12px;padding:18px;font-size:13px;background:var(--fill4)}
.nav{display:flex;gap:6px;margin:0 0 8px}
/* 흑백 정사각 박스 — 폼 .asmq 값 그대로 */
.asmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0;min-width:0}
.asmtile{min-width:0;border:1px solid var(--line2);border-radius:12px;background:#fff;aspect-ratio:1/1;display:flex;flex-direction:column}
.asmface{flex:1 1 auto;display:flex;flex-direction:column;gap:4px;padding:10px;cursor:pointer;min-width:0;border-radius:11px}.asmface:hover{background:var(--fill2)}
.asmtt{display:block;font-weight:800;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}.asmn2{font-size:22px;font-weight:900;line-height:1.1}
.asmnames{list-style:none;margin:2px 0 0;padding:0;font-size:12px;font-weight:700;line-height:1.35;overflow:hidden}.asmnames li{overflow-wrap:anywhere}
.asmcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;margin:4px 0 10px;font-size:14px;font-weight:800;min-width:0}
.asmcrumb button{position:relative;background:none;border:0;padding:6px 2px;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer;overflow-wrap:anywhere;text-align:left}
.asmcrumb button::after{content:'';position:absolute;inset:-8px -4px}
.asmcrumb i{font-style:normal;color:var(--faint)}.asmcrumb b{font-weight:900;overflow-wrap:anywhere}
/* 보낸 발주 — 폼 .rowcard 값 */
.po{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 10px;background:var(--fill4);min-width:0}
.po .nt{font-weight:800;overflow-wrap:anywhere}
.po dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 12px;margin:8px 0 0;font-size:13px}
.po dt{color:var(--muted);font-weight:700}.po dd{margin:0;font-weight:600;overflow-wrap:anywhere;white-space:pre-line}
.po dd.n{font-variant-numeric:tabular-nums}
@media (max-width:820px){.card{padding:16px}.wrap{padding-top:16px}}
@media (max-width:480px){.btn{min-height:44px}.btn.small{min-height:36px}.fgrid{grid-template-columns:minmax(0,1fr)}.actions .btn.primary{flex:1 1 100%}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">VIVIVIC</div>
    <span class="ver">v1</span>
  </div>
</header>
<div class="wrap" id="app"><p class="msg">불러오는 중…</p></div>
<script>
/* 조립처 발주링크 v1 (2026-11-15) — 사장님 「조립업체링크로 들어온 발주가 입력폼 모든 발주의 시작 입니다.」
   주소 = 조립처발주.html#<열쇠 32자>. 열쇠 문서 erp_asmlink/<열쇠> = {vendor, items:[{code,name,spec}]} — 폼(구매발주납품 관리)이 만들고 제품 목록을 맞춘다.
   발주 = erp_asmlink/<열쇠>/po/<무작위 32자> 한 장 = {vendor, code, name, spec, qty, need, memo, at}. 이 링크는 제 열쇠 아래만 읽고 쓴다(다른 업체 안 보임).
   화면: 처음(업체 이름 + 박스 「발주 넣기」·「보낸 발주」) → 박스 하나. 맨 위 「← 뒤로」·「처음으로」 + 경로, 폰 뒤로가기 = 한 단계 앞. 로그인 없음.
   옛 링크(v226·v227 에서 지운 것)와 코드·자료를 함께 쓰지 않는다. */
(function(){
"use strict";
var FB_CONFIG={apiKey:"AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",authDomain:"vivivic-4b7ef.firebaseapp.com",projectId:"vivivic-4b7ef",storageBucket:"vivivic-4b7ef.firebasestorage.app",messagingSenderId:"830175660542",appId:"1:830175660542:web:9054030480c8280af8d8af"};
var V='https://www.gstatic.com/firebasejs/11.2.0/';
var app=document.getElementById('app');
var KEY=(location.hash||'').replace(/^#/,'');
function h(tag,props){
  var e=document.createElement(tag);props=props||{};
  Object.keys(props).forEach(function(k){var v=props[k];if(v==null||v===false)return;
    if(k==='class')e.className=v;else if(k==='on')Object.keys(v).forEach(function(ev){e.addEventListener(ev,v[ev]);});
    else if(k==='value'||k==='disabled'||k==='hidden')e[k]=v;else e.setAttribute(k,v===true?'':v);});
  for(var i=2;i<arguments.length;i++){var c=arguments[i];(Array.isArray(c)?c:[c]).forEach(function(x){if(x==null||x===false||x==='')return;e.append(x.nodeType?x:document.createTextNode(x));});}
  return e;
}
function t(x){return String(x==null?'':x).trim();}
function rid(){var a='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789',b=new Uint8Array(32),s='';crypto.getRandomValues(b);for(var i=0;i<32;i++)s+=a.charAt(b[i]%62);return s;}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function when(iso){var d=new Date(iso);if(isNaN(d))return t(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fail(m){app.replaceChildren(h('div',{class:'empty'},m));}
if(!/^[A-Za-z0-9]{32}$/.test(KEY)){fail('링크 주소가 맞지 않습니다.');return;}

var F=null,fs=null,LINK=null,POS=[],POS_OK=false,SCR='',DEPTH=0,IGN=0,DRAFT={name:'',qty:'',need:'',memo:''},SENT='';
var SCREENS={add:'발주 넣기',list:'보낸 발주'};

/* 폰·카톡 뒤로가기 = 한 단계 앞(처음). 박스에 들어갈 때 history 한 칸을 쌓는다(주소 그대로). */
window.addEventListener('popstate',function(){if(IGN){IGN--;return;}if(DEPTH>0){DEPTH=0;SCR='';draw();}});
function open1(s){SCR=s;if(DEPTH<1){try{history.pushState({al:1},'',location.href);DEPTH=1;}catch(e){}}draw();window.scrollTo(0,0);}
function home(){SCR='';if(DEPTH>0){DEPTH=0;IGN++;try{history.back();}catch(e){IGN--;}}draw();window.scrollTo(0,0);}

function tile(name,body,s){
  return h('div',{class:'asmtile'},h('div',{class:'asmface',role:'button',tabindex:'0',
    on:{click:function(){open1(s);},keydown:function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open1(s);}}}},h('b',{class:'asmtt'},name),body));
}
function navBar(){
  var bb=h('button',{type:'button',class:'btn small',disabled:!SCR,on:{click:home}},'← 뒤로'),
      hb=h('button',{type:'button',class:'btn small',disabled:!SCR,on:{click:home}},'처음으로');
  var cr=SCR?h('div',{class:'asmcrumb'},h('button',{type:'button',on:{click:home}},LINK.vendor),h('i',{},'›'),h('b',{},SCREENS[SCR]))
            :h('div',{class:'asmcrumb'},h('b',{},LINK.vendor));
  return [h('div',{class:'nav'},bb,hb),cr];
}
function sorted(){return POS.slice().sort(function(a,b){return t(b.at).localeCompare(t(a.at));});}

function draw(){
  if(!LINK)return;
  var body;
  if(SCR==='add')body=addForm();
  else if(SCR==='list')body=listBox();
  else{
    var ps=sorted();
    body=h('div',{class:'asmgrid'},
      tile('발주 넣기',null,'add'),
      tile('보낸 발주',[h('span',{class:'asmn2'},POS_OK?String(ps.length):'…'),h('ul',{class:'asmnames'},ps.slice(0,6).map(function(p){return h('li',{},t(p.name));}))],'list'));
  }
  app.replaceChildren(h('h1',{},LINK.vendor),h('section',{class:'card'},navBar(),body));
}

function addForm(){
  var items=(LINK.items||[]).filter(function(x){return x&&t(x.name);});
  var dl=h('datalist',{id:'dl-items'},items.map(function(x){return h('option',{value:t(x.name)},[t(x.code),t(x.spec)].filter(Boolean).join(' · '));}));
  var find=function(v){v=t(v).toLowerCase();if(!v)return null;for(var i=0;i<items.length;i++){if(t(items[i].name).toLowerCase()===v||t(items[i].code).toLowerCase()===v)return items[i];}return null;};
  var nm=h('input',{type:'text',id:'f-name',list:'dl-items',autocomplete:'off',value:DRAFT.name}),
      code=h('div',{class:'fcode'}),
      qty=h('input',{type:'number',id:'f-qty',inputmode:'numeric',min:'1',step:'1',value:DRAFT.qty}),
      need=h('input',{type:'date',id:'f-need',min:today(),value:DRAFT.need}),
      memo=h('textarea',{id:'f-memo',rows:'3'}),
      msg=h('p',{class:'msg',role:'status'}),
      send=h('button',{type:'submit',class:'btn primary'},'발주 보내기');
  memo.value=DRAFT.memo;
  var showCode=function(){var it=find(nm.value);code.replaceChildren();
    if(it){code.append([t(it.code),t(it.spec)].filter(Boolean).join(' · '));if(t(it.name).toLowerCase()!==t(nm.value).toLowerCase())nm.value=t(it.name);}
    else if(t(nm.value))code.append(h('span',{class:'chip'},'미등록'));};
  nm.addEventListener('input',function(){DRAFT.name=nm.value;nm.classList.remove('bad');showCode();});
  nm.addEventListener('change',showCode);
  qty.addEventListener('input',function(){DRAFT.qty=qty.value;qty.classList.remove('bad');});
  [nm,qty,need].forEach(function(x){x.addEventListener('input',function(){if(msg.className==='msg bad'&&!fm.querySelector('.bad')){msg.className='msg';msg.textContent='';}});});
  need.addEventListener('input',function(){DRAFT.need=need.value;need.classList.remove('bad');});
  memo.addEventListener('input',function(){DRAFT.memo=memo.value;});
  showCode();
  var lab=function(id,txt,req){return h('label',{for:id},txt,req?h('span',{class:'req','aria-hidden':'true'},'*'):null);};
  var fm=h('form',{novalidate:true},
    h('div',{class:'fgrid'},
      h('div',{class:'f full'},lab('f-name','제품',1),nm,dl,code),
      h('div',{class:'f'},lab('f-qty','수량',1),qty),
      h('div',{class:'f'},lab('f-need','납기요청일',1),need),
      h('div',{class:'f full'},lab('f-memo','메모'),memo)),
    h('div',{class:'actions'},send,msg));
  fm.addEventListener('submit',function(e){
    e.preventDefault();msg.className='msg';msg.textContent='';
    var it=find(nm.value),q=Number(qty.value),bad=[];
    if(!t(nm.value)){nm.classList.add('bad');bad.push('제품');}
    if(!(q>0)||Math.floor(q)!==q||q>1000000){qty.classList.add('bad');bad.push('수량');}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(need.value)){need.classList.add('bad');bad.push('납기요청일');}
    if(bad.length){msg.className='msg bad';msg.textContent=bad.join('·')+'을(를) 확인하세요.';return;}
    var doc={vendor:LINK.vendor,code:it?t(it.code):'',name:it?t(it.name):t(nm.value).slice(0,200),spec:it?t(it.spec):'',qty:q,need:need.value,memo:t(memo.value).slice(0,500),at:new Date().toISOString()};
    send.disabled=true;msg.textContent='보내는 중…';
    F.setDoc(F.doc(fs,'erp_asmlink',KEY,'po',rid()),doc).then(function(){
      DRAFT={name:'',qty:'',need:'',memo:''};SENT='발주를 보냈습니다.';SCR='list';draw();window.scrollTo(0,0);
    },function(err){console.warn(err);send.disabled=false;msg.className='msg bad';msg.textContent='보내지 못했습니다. 다시 눌러 주세요.';});
  });
  return fm;
}

function listBox(){
  var out=[];
  if(SENT){out.push(h('p',{class:'msg',role:'status'},SENT));SENT='';}
  if(!POS_OK){out.push(h('p',{class:'msg'},'불러오는 중…'));return h('div',{},out);}
  var ps=sorted();
  if(!ps.length){out.push(h('div',{class:'empty'},'보낸 발주가 없습니다.'));return h('div',{},out);}
  ps.forEach(function(p){
    out.push(h('div',{class:'po'},
      h('div',{class:'nt'},t(p.name),t(p.code)?null:h('span',{class:'chip'},'미등록')),
      h('dl',{},
        t(p.code)?[h('dt',{},'품번'),h('dd',{},t(p.code))]:null,
        t(p.spec)?[h('dt',{},'규격'),h('dd',{},t(p.spec))]:null,
        h('dt',{},'수량'),h('dd',{class:'n'},String(p.qty)),
        h('dt',{},'납기요청일'),h('dd',{},t(p.need)),
        t(p.memo)?[h('dt',{},'메모'),h('dd',{},t(p.memo))]:null,
        h('dt',{},'보낸 때'),h('dd',{},when(p.at)))));
  });
  return h('div',{},out);
}

Promise.all([import(V+'firebase-app.js'),import(V+'firebase-firestore.js')]).then(function(m){
  F=m[1];fs=F.getFirestore(m[0].initializeApp(FB_CONFIG,'asm-link'));
  return F.getDoc(F.doc(fs,'erp_asmlink',KEY));
}).then(function(d){
  if(!d.exists()||!t(d.data().vendor)){fail('링크를 열 수 없습니다.');return;}
  LINK=d.data();LINK.vendor=t(LINK.vendor);document.title=LINK.vendor+' 발주';draw();
  F.onSnapshot(F.doc(fs,'erp_asmlink',KEY),function(s){if(s.exists()&&t(s.data().vendor)===LINK.vendor){LINK=s.data();LINK.vendor=t(LINK.vendor);if(SCR!=='add')draw();}},function(){});
  F.onSnapshot(F.collection(fs,'erp_asmlink',KEY,'po'),function(sn){
    POS=sn.docs.map(function(x){return Object.assign({id:x.id},x.data());});POS_OK=true;if(SCR!=='add')draw();
  },function(err){console.warn(err);POS_OK=true;if(SCR!=='add')draw();});
}).catch(function(err){console.warn(err);fail('링크를 열 수 없습니다.');});
})();
</script>
</body>
</html>
