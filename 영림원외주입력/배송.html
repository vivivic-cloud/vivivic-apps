<!doctype html>
<!-- 배송기사 페이지(v144) — 출고처 발주박스 「배송기사 공유」 링크. 로그인 없음, 폼과 별개. 주소 = 배송.html#<배송 열쇠>.
     할 수 있는 일 = 발주서 바코드·QR 스캔(맞으면 erp_poscan/<열쇠> + erp_poflow/<공개열쇠>.scanAt) · 입고처 입고확인 뒤 「배송완료」(erp_podone/<열쇠> + erp_poflow.doneAt).
     구매납품 대기 문서는 이 페이지가 만들지 않는다 — 저장 권한자가 폼을 열 때 폼이 기록을 맞춰 보고 만든다(v144 podFlowSync). 가격 없음.
     저장소 규칙(제안, 규칙 작업자에게 넘김)이 배포돼야 쓰기가 된다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>배송</title>
<link rel="icon" href="data:,">
<style>
:root{--ink:#37352f;--muted:#787774;--line:#ededeb;--rowline:#f0eeec;--red:#dc2626;--green:#166534;--amber:#92400e;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:#fff;color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;font-weight:900;letter-spacing:-0.02em;margin:0;word-break:break-all;font-family:var(--mono)}
.sub{color:var(--muted);font-weight:700;font-size:13px;margin:2px 0 14px}
.msg{color:var(--muted);font-weight:700}.msg.bad,.err{color:var(--red);font-weight:700}
.err{font-size:13px;margin:8px 0 0}
.steps{display:grid;gap:6px;margin:0 0 14px}
.st{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px}
.st span:last-child{color:var(--muted);font-weight:600;font-size:13px;text-align:right}
.st.on{border-color:#bbf7d0;background:#f0fdf4}.st.on span:last-child{color:var(--green)}
.acts{display:grid;gap:8px;margin:0 0 16px}
button{font:inherit;font-weight:800;border-radius:12px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:12px 14px;min-height:48px;cursor:pointer;width:100%}
button.sec{background:#fff;color:var(--ink)}
button:disabled{opacity:.35;cursor:default}
.manual{display:flex;gap:8px}.manual input{flex:1 1 auto;min-width:0;font:inherit;font-family:var(--mono);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.manual button{width:auto;flex:0 0 auto}
#reader{width:100%;border-radius:12px;overflow:hidden}
.po{border:1px solid var(--line);border-radius:14px;padding:12px}
dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 12px;margin:0}
dt{color:var(--muted);font-weight:700;font-size:13px;padding-top:1px}
dd{margin:0;font-weight:600;word-break:break-all}
dd.mono{font-family:var(--mono)}
.row{border-top:1px solid var(--rowline);padding:8px 0 0;margin:8px 0 0}.row:first-child{border:0;margin:0;padding:0}
.row .nt{font-weight:800;word-break:break-all;margin:0 0 4px}
</style>
</head>
<body>
<main id="main"><p class="msg">불러오는 중</p></main>
<script>
(function(){
"use strict";
var KEY='AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs',DB='projects/vivivic-4b7ef/databases/(default)',DOCS=DB+'/documents',BASE='https://firestore.googleapis.com/v1/';
var mainEl=document.getElementById('main');
function h(tag,cls){var e=document.createElement(tag);if(cls)e.className=cls;for(var i=2;i<arguments.length;i++){var c=arguments[i];(Array.isArray(c)?c:[c]).forEach(function(x){if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(String(x)));});}return e;}
function show(v){return v==null?'':String(v);}
function num(v){if(v==null||String(v).trim()==='')return '';var n=Number(v);return isFinite(n)?n.toLocaleString('ko-KR',{maximumFractionDigits:6}):String(v);}
function say(t,bad){mainEl.replaceChildren(h('p','msg'+(bad?' bad':''),t));}
function val(x){if(!x)return null;var k=Object.keys(x)[0],y=x[k];
  if(k==='mapValue'){var o={};Object.keys(y.fields||{}).forEach(function(f){o[f]=val(y.fields[f]);});return o;}
  if(k==='arrayValue')return (y.values||[]).map(val);
  if(k==='integerValue')return Number(y);if(k==='nullValue')return null;return y;}
function fieldsOf(j){var f={};Object.keys((j&&j.fields)||{}).forEach(function(k){f[k]=val(j.fields[k]);});return f;}
function sv(s){return {stringValue:String(s)};}
function when(s){var t=new Date(s);if(!s||isNaN(t))return show(s);var p=function(n){return String(n).padStart(2,'0');};return (t.getMonth()+1)+'-'+p(t.getDate())+' '+p(t.getHours())+':'+p(t.getMinutes());}
var key=(location.hash||'').slice(1);
if(!/^[A-Za-z0-9_-]{32,64}$/.test(key)){say('발주서가 없습니다.',true);return;}
var tok=null;
function anon(){
  try{var t=JSON.parse(sessionStorage.getItem('po.tok')||'null');if(t&&t.exp>Date.now())return Promise.resolve(tok=t.id);}catch(e){}
  return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"returnSecureToken":true}'})
    .then(function(r){return r.json();}).then(function(j){if(!j.idToken)throw new Error('anon');
      try{sessionStorage.setItem('po.tok',JSON.stringify({id:j.idToken,exp:Date.now()+50*60*1000}));}catch(e){}return tok=j.idToken;});
}
function call(path,opt){
  var go=function(){var o=Object.assign({cache:'no-store',referrerPolicy:'no-referrer'},opt||{});o.headers=Object.assign({'Content-Type':'application/json'},tok?{Authorization:'Bearer '+tok}:{});
    return fetch(BASE+path+(path.indexOf('?')<0?'?':'&')+'key='+KEY,o);};
  return go().then(function(r){return (r.status===401||r.status===403)&&!tok?anon().then(go):r;});
}
function getMany(names){   /* 여러 문서 한 번에: 이름 → 칸(없으면 null) */
  return call(DOCS+':batchGet',{method:'POST',body:JSON.stringify({documents:names.map(function(n){return DOCS+'/'+n;})})}).then(function(r){
    if(!r.ok)throw new Error(r.status);return r.json();}).then(function(a){var o={};(a||[]).forEach(function(x){if(x.found)o[x.found.name.slice(DOCS.length+1)]=fieldsOf(x.found);else if(x.missing)o[x.missing.slice(DOCS.length+1)]=null;});return o;});
}
function commit(writes){return call(DOCS+':commit',{method:'POST',body:JSON.stringify({writes:writes})}).then(function(r){if(!r.ok)throw new Error(r.status);});}
/* 스캔 라이브러리: cdnjs(SRI) → 같은 폴더 사본(v131 방식) */
var SCAN_LIB=['https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js','sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+','라이브러리/html5-qrcode.min.js'],scanP=null;
function scanLib(){
  var lib=function(){return window.__Html5QrcodeLibrary__;};if(lib())return Promise.resolve(lib());
  var one=function(src,sri){return new Promise(function(ok,no){var sc=document.createElement('script');sc.src=src;
    if(sri){sc.integrity=sri;sc.crossOrigin='anonymous';sc.referrerPolicy='no-referrer';}
    sc.onload=function(){lib()?ok(lib()):no(new Error('scan'));};sc.onerror=function(){sc.remove();no(new Error('scan'));};document.head.append(sc);});};
  return scanP||(scanP=one(SCAN_LIB[0],SCAN_LIB[1]).catch(function(){return one(SCAN_LIB[2]);}).catch(function(e){scanP=null;throw e;}));
}
var S={ship:null,pub:null,scan:null,done:null,flow:null},busy=false,err='',reader=null,camOn=false;
function load(){
  return getMany(['erp_poship/'+key]).then(function(o){
    S.ship=o['erp_poship/'+key];if(!S.ship){S.ship=false;return;}
    var pk=S.ship.pubKey;
    return getMany(['erp_podocs_pub/'+pk,'erp_poscan/'+key,'erp_podone/'+key,'erp_poflow/'+pk]).then(function(m){
      S.pub=m['erp_podocs_pub/'+pk];S.scan=m['erp_poscan/'+key];S.done=m['erp_podone/'+key];S.flow=m['erp_poflow/'+pk];});
  }).then(draw,function(){if(S.ship==null)say('불러오지 못했습니다.',true);});
}
function matches(txt){
  var t=String(txt||'').trim();if(!t)return false;
  var pk=S.ship.pubKey,no=String(S.ship.pono||'');
  if(t.toUpperCase()===no.toUpperCase())return true;   /* 바코드 = 발주번호 */
  var i=t.indexOf('#');return i>=0&&t.slice(i+1)===pk;   /* QR = 발주서.html#공개열쇠 */
}
function doScan(txt){
  if(busy||S.scan)return;
  if(!matches(txt)){err='이 발주서가 아닙니다.';draw();return;}
  stopCam();busy=true;err='';draw();
  var at=new Date().toISOString(),pk=S.ship.pubKey;
  var w=[{update:{name:DOCS+'/erp_poscan/'+key,fields:{pono:sv(S.ship.pono),at:sv(at)}},currentDocument:{exists:false}}];
  if(!S.flow)w.push({update:{name:DOCS+'/erp_poflow/'+pk,fields:{pono:sv(S.ship.pono),scanAt:sv(at)}},currentDocument:{exists:false}});
  commit(w).then(function(){busy=false;return load();},function(){busy=false;err='스캔을 저장하지 못했습니다.';return load();});
}
function doDone(){
  if(busy||S.done||!S.scan||!(S.flow&&S.flow.inAt))return;
  if(!confirm(S.ship.pono+' 배송완료를 저장합니다.'))return;
  busy=true;err='';draw();
  var at=new Date().toISOString(),pk=S.ship.pubKey;
  commit([{update:{name:DOCS+'/erp_podone/'+key,fields:{pono:sv(S.ship.pono),at:sv(at)}},currentDocument:{exists:false}},
    {update:{name:DOCS+'/erp_poflow/'+pk,fields:{doneAt:sv(at)}},updateMask:{fieldPaths:['doneAt']},currentDocument:{exists:true}}])
    .then(function(){busy=false;return load();},function(){busy=false;err='배송완료를 저장하지 못했습니다.';return load();});
}
function stopCam(){if(reader&&camOn){camOn=false;try{reader.stop().catch(function(){});}catch(e){}}var el=document.getElementById('reader');if(el)el.hidden=true;}
function startCam(){
  err='';var el=document.getElementById('reader');if(!el)return;el.hidden=false;
  scanLib().then(function(L){
    var F=L.Html5QrcodeSupportedFormats;reader=reader||new L.Html5Qrcode('reader',{formatsToSupport:[F.QR_CODE,F.CODE_128],verbose:false});
    return reader.start({facingMode:'environment'},{fps:10,qrbox:function(w,h2){var s=Math.floor(Math.min(w,h2)*0.8);return {width:s,height:Math.floor(s*0.6)};}},function(txt){doScan(txt);},function(){}).then(function(){camOn=true;});
  }).catch(function(){el.hidden=true;err='카메라를 쓸 수 없습니다. 발주번호를 넣어 주세요.';draw();});
}
function kv(pairs){var d=h('dl');pairs.forEach(function(p){d.append(h('dt','',p[0]),h('dd',p[2]||'',p[1]));});return d;}
function draw(){
  if(S.ship===false){say('발주서가 없습니다.',true);return;}
  if(!S.ship)return;
  var no=show(S.ship.pono),fl=S.flow||{},rows=((S.pub||{}).rows||[]).filter(Boolean);
  document.title='배송 '+no;
  var step=function(t,at){return h('div','st'+(at?' on':''),h('span','',t),h('span','',at?when(at):''));};
  var acts=h('div','acts');
  if(!S.scan){
    var inp=h('input');inp.placeholder='발주번호';inp.setAttribute('aria-label','발주번호');inp.autocomplete='off';inp.autocapitalize='characters';
    var ok=h('button','sec','확인');ok.type='button';ok.addEventListener('click',function(){doScan(inp.value);});
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doScan(inp.value);}});
    var cam=h('button','','스캔');cam.type='button';cam.disabled=busy;cam.addEventListener('click',startCam);
    var rd=document.getElementById('reader')||h('div');rd.id='reader';if(!camOn)rd.hidden=true;
    acts.append(cam,rd,h('div','manual',inp,ok));
  }else{
    var dn=h('button','',S.done?'배송완료됨':'배송완료');dn.type='button';dn.disabled=busy||!!S.done||!fl.inAt;dn.addEventListener('click',doDone);acts.append(dn);
  }
  mainEl.replaceChildren.apply(mainEl,[].concat(
    h('h1','',no),h('p','sub','배송 · 발주일 '+show((S.pub||{}).podate)),
    h('div','steps',step('스캔',S.scan&&S.scan.at),step('입고확인',fl.inAt),step('배송완료',S.done&&S.done.at)),
    acts,err?h('p','err',err):null,
    rows.length?h('div','po',rows.map(function(x){return h('div','row',h('div','nt',show(x.cname)),
      kv([['품번',show(x.ccode),'mono'],['규격',show(x.cspec)],['단위',show(x.unit)],['발주수량',num(x.qty)],['납품예정일',show(x.duedate)],['창고',show(x.wh)]]));})):null));
}
load();
setInterval(function(){if(document.visibilityState==='visible'&&!busy&&!camOn)load();},15000);   /* 입고확인이 들어오면 15초 안에 배송완료가 켜짐 */
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!busy&&!camOn)load();});
})();
</script>
</body>
</html>
