<!doctype html>
<!-- 배송기사 발주서(v145) — 출고처 발주박스 「배송기사 공유」 링크. 로그인 없음, 폼과 별개. 주소 = 배송.html#<배송 열쇠>.
     v148: 발주확인 전에도 공유될 수 있어, 발주확인(erp_poconfirm/<발주번호>) 전에는 QR·바코드 대신 「발주확인 전」(15초마다 다시 읽어 확인되면 나타남).
     보이는 것 = QR(입고.html#배송열쇠 — 입고처가 납품 현장에서 찍음)·바코드(발주번호)·발주 내용(가격 없음)·입고확인 수량.
     할 수 있는 일 = 「납품완료」 하나(입고처 입고확인 뒤, 같은 입고확인에 한 번 — 수정되면 다시). 잠기면(구매납품입력이 영림원 처리 시작) 못 함.
     자료 = erp_poship/<열쇠> · erp_podocs_pub/<공개열쇠> · erp_podlv/<열쇠>. v144 기사 스캔 방식은 v145 에서 없앰. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>발주서</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="발주공통.css">
</head>
<body>
<main id="main"><p class="msg">불러오는 중</p></main>
<script src="발주공통.js"></script>
<script>
(function(){
"use strict";
var P=window.PO,h=P.h,show=P.show,mainEl=document.getElementById('main');
function say(t,bad){mainEl.replaceChildren(h('p','msg'+(bad?' bad':''),t));}
var key=(location.hash||'').slice(1);
if(!P.keyOk(key)){say('발주서가 없습니다.',true);return;}
var S={ship:null,pub:null,dlv:null,conf:null},busy=false,err='',CODE=null;
function load(){
  return P.getOne('erp_poship/'+key).then(function(s){
    if(!s){S.ship=false;return;}S.ship=s;
    return P.getMany(['erp_podocs_pub/'+s.pubKey,'erp_podlv/'+key,'erp_poconfirm/'+s.pono]).then(function(m){S.pub=m['erp_podocs_pub/'+s.pubKey];S.dlv=m['erp_podlv/'+key];S.conf=m['erp_poconfirm/'+s.pono];});
  }).then(draw,function(){if(S.ship==null)say('불러오지 못했습니다.',true);});
}
function canDone(){var d=S.dlv;return !!(d&&d.inAt&&!d.locked&&Number(d.doneRev||0)<Number(d.rev||0));}
function doDone(){
  if(busy||!canDone())return;
  if(!confirm(S.ship.pono+' 납품완료를 저장합니다.'))return;
  busy=true;err='';draw();
  P.commit([{name:'erp_podlv/'+key,fields:{doneAt:new Date().toISOString(),doneRev:Number(S.dlv.rev)},mask:['doneAt','doneRev'],exists:true}])
    .then(function(){busy=false;return load();},function(){busy=false;err='납품완료를 저장하지 못했습니다.';return load();});
}
function kv(pairs){var d=h('dl');pairs.forEach(function(p){d.append(h('dt','',p[0]),h('dd',p[2]||'',p[1]));});return d;}
function draw(){
  if(S.ship===false){say('발주서가 없습니다.',true);return;}
  if(!S.ship)return;
  var no=show(S.ship.pono),d=S.dlv||{},pub=S.pub||{},rows=(pub.rows||[]).filter(Boolean),inq={};
  (d.rows||[]).forEach(function(r){if(r)inq[show(r.ccode)]=r.qty;});
  document.title='발주서 '+no;
  if(!CODE&&S.conf)CODE=P.codes(new URL('입고.html#'+key,location.href).href,no);   /* v148 발주확인 전에는 QR·바코드 대신 「발주확인 전」(v136) — 확인되면 같은 링크에 나타남 */
  var done=d.doneAt&&Number(d.doneRev||0)>=Number(d.rev||0)&&d.rev;
  var step=function(t,on,at){return h('div','step'+(on?' on':''),h('span','',t),h('span','',at||''));};
  var btn=h('button','wide',done?'납품완료됨':'납품완료');btn.type='button';btn.disabled=busy||!canDone();btn.addEventListener('click',doDone);
  PO.fill(mainEl,[].concat(
    h('h1','mono',no),h('p','sub','발주서 · 발주일 '+show(pub.podate)),
    S.conf?CODE:h('p','st','발주확인 전'),
    h('div','steps',step('입고확인'+(Number(d.rev)>1?' (수정 '+(Number(d.rev)-1)+')':''),!!d.inAt,d.inAt?P.when(d.inAt):''),step('납품완료',!!done,done?P.when(d.doneAt):''),d.locked?step('잠김',true,''):null),
    h('div','acts',btn),err?h('p','err',err):null,
    rows.length?h('div','po',rows.map(function(x){var c=show(x.ccode);return h('div','row',h('div','nt',show(x.cname)),
      kv([['품번',c,'mono'],['규격',show(x.cspec)],['단위',show(x.unit)],['발주수량',P.num(x.qty),'n'],['입고수량',inq[c]!=null?P.num(inq[c]):'','n'],['납품예정일',show(x.duedate)],['창고',show(x.wh)]]));})):null));
}
load();
setInterval(function(){if(document.visibilityState==='visible'&&!busy)load();},15000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!busy)load();});
})();
</script>
</body>
</html>
