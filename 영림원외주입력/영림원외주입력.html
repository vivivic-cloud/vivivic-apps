<!doctype html>
<!-- 영림원외주입력 — 판 번호는 머리띠 VIVIVIC 옆 배지와 같다. 고칠 때 둘을 같이 올린다: v22 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>외주자료 입력폼</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* v3 (10-30) 디자인을 에이엠티·조혼가구에 맞췄다 — 새로 지은 값은 없다.
   색·글꼴: 두 집의 body·머리띠(#37352f 글자, #787774 흐린 글자, #ededeb 테두리, #f1f1ef·#f5f5f4·#f7f6f3·#fbfbfa 채움, Inter)
   머리띠: 두 집의 <header> — 흰 바탕 · 아래 줄 · VIVIVIC 900 · 판 배지(9px #b0aeaa/#f1f0ef)
   단계 줄: .nav-link · 카드: 로그인 카드(rounded-2xl, #ededeb) · 단추: 로그인 단추(#37352f, 굵게, rounded-lg)
   표: 에이엠티 .tl-wo-table(머리 #f5f5f4 · 800 굵기 #787774 · 칸줄 #f0eeec) · 스크롤바: .custom-scrollbar(#d3d1cb)
   밝은 테마만 쓴다. 두 집 모두 어두운 테마가 없다. */
:root{
  --ink:#37352f; --muted:#787774; --faint:#b0aeaa; --line:#ededeb; --line2:#e3e2e0; --rowline:#f0eeec;
  --fill:#f1f1ef; --fill2:#f5f5f4; --fill3:#f7f6f3; --fill4:#fbfbfa; --thumb:#d3d1cb;
  --red:#dc2626; --red-bg:#fef2f2; --red-line:#fecaca;
  --amber:#92400e; --amber-bg:#fef3c7;
  --green:#166534; --green-bg:#f0fdf4;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:#ffffff;color:var(--ink);font:400 14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
/* 머리띠 — 에이엠티·조혼가구 <header> 와 같은 모양 */
.topbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;height:64px;display:flex;align-items:center;gap:8px;
  padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:900;font-size:20px;letter-spacing:-0.05em;color:var(--ink);line-height:1}
.ver{font-size:9px;font-weight:700;color:var(--faint);background:#f1f0ef;padding:1px 6px;border-radius:4px;letter-spacing:0.04em;font-family:var(--mono)}
.wrap{max-width:1180px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
h1{font-size:clamp(1.375rem,5vw,1.875rem);line-height:1.2;margin:0 0 6px;font-weight:900;letter-spacing:-0.03em;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:62ch;font-size:13px}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 22px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--muted);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.err{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.pill.ok{background:var(--green-bg);color:var(--green);border-color:#bbf7d0}
.banner{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line);padding:10px 14px;border-radius:12px;margin:0 0 16px;font-size:13px;font-weight:700}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);gap:24px;align-items:start}
/* 단계 줄 — .nav-link (활성: #f1f1ef + 안쪽 테두리 #ededeb) */
nav{display:flex;flex-direction:column;gap:4px;position:sticky;top:80px}
nav button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;
  padding:9px 12px;border-radius:8px;color:var(--muted);min-height:44px;transition:background .2s}
nav button:hover{background:var(--fill3)}
nav button[aria-current="step"]{background:var(--fill);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--mono);background:#fff;color:var(--muted);border:1px solid var(--line)}
nav button[aria-current="step"] .num{background:var(--ink);color:#fff;border-color:var(--ink)}
.nt{font-weight:800;font-size:13.5px;line-height:1.25;color:inherit}
.ns{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
/* 카드 — 로그인 카드(bg-white border #ededeb rounded-2xl) */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.stephead h2{font-size:clamp(1.125rem,4vw,1.375rem);margin:0 0 6px;font-weight:900;letter-spacing:-0.02em}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;font-weight:700;color:var(--muted);margin:0 0 8px}
.path code{font:700 11px var(--mono);background:var(--fill2);color:var(--ink);padding:2px 6px;border-radius:4px;border:1px solid #eeeeec}
.needs{font-size:12px;color:var(--muted);margin:10px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-weight:700}
.needs button{all:unset;cursor:pointer;color:var(--ink);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.needs button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.stepnote{margin:12px 0 0;font-size:13px;color:var(--ink);background:var(--fill4);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
form{margin-top:18px}
.bulk{margin-top:18px}   /* v7 일괄 업로드 목록 — 버튼은 기존 .btn 모양 */
.bulklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.btn.bulkbtn{justify-content:space-between;text-align:left;gap:10px;padding:10px 12px;min-height:52px;font-weight:500}
.btn.bulkbtn[aria-pressed="true"]{background:var(--fill);box-shadow:inset 0 0 0 1px var(--ink)}
.bulkbtn .rt small{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
label,.lab{font-size:11px;font-weight:700;color:var(--muted)}
.checks label,.f>label:has(input[type=checkbox]){color:var(--ink);font-size:13px;font-weight:500}
.req{color:var(--red);margin-left:2px}
/* 입력칸 — 로그인 입력칸(border #ededeb, rounded-lg, 초점 #37352f) */
input[type=text],input[type=url],input[type=date],input[type=number],select,textarea{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0;min-height:40px}
input[type=text]:focus,input[type=url]:focus,input[type=date]:focus,input[type=number]:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
input[type=checkbox]{accent-color:var(--ink);width:16px;height:16px}
input.bad,select.bad{border-color:var(--red)}
.hint{font-size:11px;color:var(--muted)}
.hint.warn{background:var(--amber-bg);color:var(--amber);padding:3px 8px;border-radius:6px;font-weight:700}
.err{font-size:11px;color:var(--red);font-weight:700}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.checks label{display:flex;gap:6px;align-items:center;min-height:32px}
.sub{font-size:13px;font-weight:800;margin:22px 0 10px}
.rowcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--fill4)}
.rowtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font:800 11px var(--mono);color:var(--muted);letter-spacing:.02em}
/* 단추 — 로그인 단추(#37352f · 흰 글자 · 굵게 · rounded-lg) / 흰 단추(border #ededeb, hover #f7f6f3) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 13px var(--sans);border-radius:8px;padding:9px 14px;min-height:40px;
  border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s}
.btn:hover{background:var(--fill3)}
.btn:active{transform:scale(.97)}
.btn svg{flex:none}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);padding-inline:20px}
.btn.primary:hover{background:#000}
.btn.small{padding:5px 10px;font-size:11px;min-height:32px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.actions{display:flex;gap:8px;align-items:center;margin-top:20px;flex-wrap:wrap}
.card>.actions{margin-top:16px}
.gsrow{display:flex;gap:8px;align-items:center;flex-basis:100%}   /* 구글시트 링크 붙여넣는 줄 (v8) */
.gsrow[hidden]{display:none}
.pick{position:relative;display:inline-flex}   /* 단추 둘(양식 다운로드·일괄 업로드) → 누르면 엑셀/구글 고르는 작은 창 (v10) */
.pick>.btn{width:100%}
.pickmenu{position:absolute;top:calc(100% + 4px);left:0;z-index:20;display:flex;gap:4px;padding:4px;
  background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(15,15,15,.08)}
.pickmenu[hidden]{display:none}
.pickmenu .btn{border-color:transparent;justify-content:center;width:52px;height:52px;padding:0}   /* 글자 없이 로고만 (v11) */
.pickmenu .btn svg{width:32px;height:32px}
.msg{font-size:12px;font-weight:700;color:var(--muted)}
.msg.bad{color:var(--red)}
.list h3{font-size:15px;font-weight:900;margin:28px 0 10px;display:flex;gap:8px;align-items:baseline;letter-spacing:-0.02em}
.list h3 span{font-weight:700;font-size:11px;color:var(--muted)}
.list h3{flex-wrap:wrap}   /* v13 대기·오류 지우기 — 단추는 기존 .btn.small 모양, 목록 제목 줄 오른쪽 */
.delbar{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;letter-spacing:0}
details.rec>summary .rt{flex:1}
details.rec>summary input.pk{flex:none;margin:0}
.empty{color:var(--muted);border:1px dashed var(--line2);border-radius:12px;padding:18px;font-size:13px;background:var(--fill4)}
details.rec{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
details.rec[open]{border-color:var(--line2)}
details.rec>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;min-height:44px}
details.rec>summary:hover{background:var(--fill4)}
details.rec>summary::-webkit-details-marker{display:none}
.rt{min-width:0}
.rt b{display:block;font-weight:800;font-size:13.5px;overflow-wrap:anywhere}
.rt small{color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.chip{flex:none;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:800;border:1px solid transparent;letter-spacing:.02em}
.chip.대기{background:var(--fill2);color:var(--ink);border-color:#eeeeec}
.chip.진행중{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}
.chip.완료{background:var(--green-bg);color:var(--green);border-color:#bbf7d0}
.chip.오류{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.recbody{padding:2px 14px 14px;border-top:1px solid var(--line)}
dl{display:grid;grid-template-columns:minmax(100px,max-content) 1fr;gap:5px 14px;margin:12px 0;font-size:12.5px}
dt{color:var(--muted);font-weight:700;font-size:11px;padding-top:2px}dd{margin:0;overflow-wrap:anywhere}
/* 표 — 에이엠티 .tl-wo-table 모양. 가로 넘침은 표 상자 안에서만 스크롤한다.
   상자 높이를 화면 안으로 묶어 가로 스크롤바가 늘 화면에 보이게 한다. */
.tw{overflow:auto;max-height:60vh;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#fff;
  scrollbar-width:thin;scrollbar-color:var(--thumb) transparent;overscroll-behavior-x:contain}
.tw::-webkit-scrollbar,.contract pre::-webkit-scrollbar,nav::-webkit-scrollbar{width:8px;height:8px}
.tw::-webkit-scrollbar-track,.contract pre::-webkit-scrollbar-track,nav::-webkit-scrollbar-track{background:var(--fill4)}
.tw::-webkit-scrollbar-thumb,.contract pre::-webkit-scrollbar-thumb,nav::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:10px}
table{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
th,td{padding:6px 10px;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--fill2);color:var(--muted);font-size:10.5px;font-weight:800;border-bottom:1px solid var(--line)}
td{border-top:1px solid var(--rowline)}
tbody tr:first-child td{border-top:0}
tbody tr:hover td{background:var(--fill4)}
td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.agentnote{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line);padding:8px 10px;border-radius:8px;font-size:12px;font-weight:700;margin:10px 0 8px}
.agentnote.ok{background:var(--green-bg);color:var(--green);border-color:#bbf7d0}
.recact{display:flex;gap:8px;flex-wrap:wrap}
.contract{margin-top:32px}
.contract summary{cursor:pointer;font-weight:800;font-size:13px;min-height:24px}
.contract pre{font:400 11.5px/1.6 var(--mono);background:var(--fill4);border:1px solid var(--line);padding:12px;border-radius:8px;overflow-x:auto;margin:10px 0 0;
  scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px}
  nav{flex-direction:row;overflow-x:auto;position:static;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
  nav button{flex:none;grid-template-columns:24px auto;padding:8px 12px}
  .num{width:24px;height:24px;font-size:11px}
  .card{padding:16px}
  .wrap{padding-top:16px}
}
@media (max-width:480px){
  .btn{min-height:44px}
  .btn.small{min-height:36px}
  .card>.actions>.pick{flex:1 1 calc(50% - 4px)}   /* 단추 둘(양식 다운로드·일괄 업로드)은 한 줄에 반씩 (v10) */
  .card>.actions .btn.cert{flex-basis:100%}   /* 거래처 단계 셋째 단추(사업자등록증)는 아랫줄 한 줄 */
  .gsrow .btn{flex:none!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<header class="topbar">
  <div class="topbar-in">

  </div>
</header>
<div class="wrap">
  <div class="pagehead">
    <h1>외주자료 입력폼</h1>
    <p class="lead">영림원 ERP 테스트서버에 등록할 자료를 단계 순서대로 입력합니다. 저장한 항목은 에이전트가 ERP에 등록하고, 결과를 상태로 남깁니다.</p>
    <div class="sum" id="sum" aria-live="polite"></div>

  <div id="banner"></div>
  <div class="app">

    <main id="main"></main>
  </div>
  <section class="contract card">
    <details>
      <summary>에이전트용 데이터 규칙</summary>
      <p class="hint" style="margin-top:10px">에이전트는 아래 컬렉션에서 상태가 대기인 문서를 단계 순서대로 읽어 ERP에 등록하고, 결과를 같은 문서에 기록합니다. 저장소는 파이어베이스 vivivic-4b7ef의 Firestore이고 컬렉션 이름은 erp_ 로 시작합니다. 전체 규격은 같은 폴더의 erp-spec.json 입니다.</p>
      <pre id="contractPre"></pre>
    </details>
  </section>
</div>

<script>

   SDK 는 필요할 때 불러온다 — 못 불러와도 화면은 뜨고 안내 문구가 나온다. */
var FB_CONFIG={apiKey:"AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",authDomain:"vivivic-4b7ef.firebaseapp.com",projectId:"vivivic-4b7ef",storageBucket:"vivivic-4b7ef.firebasestorage.app",messagingSenderId:"830175660542",appId:"1:830175660542:web:9054030480c8280af8d8af"};
function connectDb(){
  var V='https://www.gstatic.com/firebasejs/11.2.0/';
  return Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]).then(function(m){
    var app=m[0].initializeApp(FB_CONFIG,'erp-input'),auth=m[1].getAuth(app),F=m[2],fs=F.getFirestore(app);

      /* 화면 코드가 쓰는 모양(collection/doc/add/update/delete/onSnapshot)만 맞춘 얇은 껍데기 */

(function(){

/* 사업자번호(v12): 숫자 10자리(하이픈은 있어도 없어도 됨) → 저장은 000-00-00000 꼴. 검증숫자가 틀리면 경고만(저장은 됨).
   거래처종류에 BIZ_KINDS 가 하나라도 있으면 필수 — 영림원 거래처등록이 이 종류에 사업자번호를 요구한다(입력작업자/화면별-요령.md). */

function bizDigits(v){return String(v==null?'':v).replace(/[\s\-–—]/g,'');}

function newProcsOf(rows,memos){

}

function h(tag,props){

    var v=props[k];if(v==null||v===false)return;
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k==='on'){Object.keys(v).forEach(function(ev){e.addEventListener(ev,v[ev]);});}
    else if(k==='value'||k==='checked'||k==='disabled'||k==='hidden')e[k]=v;
    else e.setAttribute(k,v===true?'':v);

  for(var i=2;i<arguments.length;i++){
    var c=arguments[i];
    (Array.isArray(c)?c:[c]).forEach(function(x){if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(x));});

var FLOW_ROWS=200;  /* v22 공정 수식을 미리 거는 줄 수(2~201행) */

function addFlowFormat(X,bytes,ff){
  var zip=X.CFB.read(new Uint8Array(bytes),{type:'array'});
  var ent=X.CFB.find(zip,'/xl/worksheets/sheet1.xml');
  var xml=new TextDecoder('utf-8').decode(ent.content);
  var tag='<conditionalFormatting sqref="'+ff.sq+'"><cfRule type="expression" dxfId="0" priority="1"><formula>AND('+ff.c0+'2&lt;&gt;"",COUNTIF(INDIRECT("\'목록\'!$A$1:$A$500"),'+ff.c0+'2)=0)</formula></cfRule></conditionalFormatting>';
  /* conditionalFormatting 은 dataValidations·hyperlinks… 보다 앞(시트 XML 순서) */
  var after=/<(dataValidations|hyperlinks|printOptions|pageMargins|pageSetup|headerFooter|rowBreaks|colBreaks|customProperties|cellWatches|ignoredErrors|smartTags|drawing|legacyDrawing|legacyDrawingHF|picture|oleObjects|controls|webPublishItems|tableParts|extLst)[\s>\/]/.exec(xml);
  xml=after?xml.slice(0,after.index)+tag+xml.slice(after.index):xml.replace('</worksheet>',tag+'</worksheet>');
  ent.content=new TextEncoder().encode(xml);ent.size=ent.content.length;
  var st=X.CFB.find(zip,'/xl/styles.xml'),sx=new TextDecoder('utf-8').decode(st.content);
  var dxf='<dxfs count="1"><dxf><font><color rgb="FFDC2626"/></font><fill><patternFill patternType="solid"><bgColor rgb="FFFEF2F2"/></patternFill></fill></dxf></dxfs>';
  if(/<dxfs[^>]*\/>/.test(sx))sx=sx.replace(/<dxfs[^>]*\/>/,dxf);
  else if(/<dxfs[\s\S]*?<\/dxfs>/.test(sx))sx=sx.replace(/<dxfs[\s\S]*?<\/dxfs>/,dxf);
  else{var m=/<(tableStyles|colors|extLst)[\s>\/]/.exec(sx);sx=m?sx.slice(0,m.index)+dxf+sx.slice(m.index):sx.replace('</styleSheet>',dxf+'</styleSheet>');}
  st.content=new TextEncoder().encode(sx);st.size=st.content.length;
  return X.CFB.write(zip,{type:'array',fileType:'zip'});
}
/* 칸의 고르기 목록: 정해진 목록(opts) · 앞 단계 자료 목록(LISTS) · 체크 칸은 O/X(올릴 때 O 면 체크) */
function pickList(f){

/* 양식 머리 칸 설명(v18) — 사장님 「업로드 양식 다운되면 각 입력부 명칭쪽에 해당 입력부가 무엇인지 설명이 나타나게…」

var DL_SRC={'dl-vendors':'1단계 거래처 중 영림원 등록이 끝난(완료) 외주가공 거래처','dl-wc':'서버의 외주 워크센터 + 2단계 워크센터','dl-proc':'서버의 공정(조립·가공) + 4단계 공정','dl-codes':'3단계 품목의 품번','dl-procs':'이미 저장된 공정(오류 건 뺌)'};

  else if(f.flowPos!=null)t.push('자동(수식)');   /* v22 공정·공정흐름 공정1~10 */
  else t.push(f.req?'필수':f.reqIf?'조건부 필수(아래 설명)':'선택 입력(비워도 됩니다)');
  if(f.type==='multi')t.push('한 칸에 하나씩 고릅니다. 여럿이면 '+f.label+'1~'+MULTI_N+' 에 나눠 고릅니다.');
  if(f.type==='check')t.push('O = 체크함, X 또는 빈 칸 = 체크 안 함.');
  else if(f.dl)t.push((pickList(f).length?(f.listOnly?'드롭다운 목록에 있는 것만 넣을 수 있습니다.':'드롭다운에서 고르거나 직접 적습니다.'):'양식을 받을 때 목록이 비어 있어 드롭다운이 없습니다. 직접 적습니다.')+' 목록: '+DL_SRC[f.dl]+'.');
  else if(f.opts)t.push((f.type==='select'?'목록에서만 고릅니다: ':'드롭다운에서 고르거나 직접 적습니다. 목록: ')+f.opts.join(' / '));
  if(f.type==='date')t.push('날짜 꼴: 2026-01-01 (연-월-일).');
  if(f.type==='number')t.push('숫자로 적습니다.');
  if(f.ph)t.push(/^예:/.test(f.ph)?'입력 '+f.ph:'칸 안내: '+f.ph);

/* SheetJS 메모 상자는 작아서(2칸×4줄) 긴 설명이 잘린다 → 그림 VML 의 상자 자리(Anchor)를 넓히고 설명 길이만큼 늘린다 */
function sizeNotes(X,bytes,notes){
  var zip=X.CFB.read(new Uint8Array(bytes),{type:'array'});
  var ent=X.CFB.find(zip,'/xl/drawings/vmlDrawing1.vml');if(!ent)return bytes;
  var xml=new TextDecoder('utf-8').decode(ent.content);
  xml=xml.replace(/<v:shape [\s\S]*?<\/v:shape>/g,function(sh){
    var c=+((/<x:Column>(\d+)/.exec(sh)||[])[1]),t=notes[c]||'';
    var lines=t.split('\n').reduce(function(n,l){return n+Math.max(1,Math.ceil(l.length/16));},0);
    var h=Math.min(30,lines+3);
    return sh.replace(/<x:Anchor>[^<]*/,'<x:Anchor>'+(c+1)+',10,0,10,'+(c+4)+',0,'+h+',0')
             .replace(/width:[\d.]+pt;height:[\d.]+pt/,'width:260pt;height:'+(h*15)+'pt');
  });
  ent.content=new TextEncoder().encode(xml);ent.size=ent.content.length;
  return X.CFB.write(zip,{type:'array',fileType:'zip'});
}
var VMAX=1000;  /* 드롭다운을 거는 줄 수(2~1000행) */
function xmlEsc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* SheetJS 무료판은 데이터 유효성 검사를 쓰지 못한다 → 만든 xlsx(zip)의 첫 시트 XML 에 dataValidations 를 직접 넣는다(SheetJS 안의 CFB 로 zip 을 열고 닫는다). */
function addValidation(X,bytes,dv){
  var zip=X.CFB.read(new Uint8Array(bytes),{type:'array'});
  var ent=X.CFB.find(zip,'/xl/worksheets/sheet1.xml');
  var xml=new TextDecoder('utf-8').decode(ent.content);
  var body=dv.map(function(d){
    var multi=d.f.type==='multi';
    return '<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="'+(d.strict?1:0)+'"'+
      (d.strict?' errorTitle="'+xmlEsc(d.f.label)+'" error="목록에서 고르세요."':'')+
      (multi?' promptTitle="'+xmlEsc(d.f.label)+'" prompt="한 칸에 하나씩 고릅니다. 여럿이면 '+xmlEsc(d.f.label)+'1~'+MULTI_N+' 에 나눠 고릅니다."':'')+
      ' sqref="'+d.col+'2:'+d.col+VMAX+'"><formula1>\'목록\'!$'+d.src+'$1:$'+d.src+'$'+d.n+'</formula1></dataValidation>';
  }).join('');

     SheetJS 가 ignoredErrors 를 쓰므로 맨 뒤에 붙이면 엑셀이 「손상된 파일」로 본다. */
  var after=/<(hyperlinks|printOptions|pageMargins|pageSetup|headerFooter|rowBreaks|colBreaks|customProperties|cellWatches|ignoredErrors|smartTags|drawing|legacyDrawing|legacyDrawingHF|picture|oleObjects|controls|webPublishItems|tableParts|extLst)[\s>\/]/.exec(xml);
  xml=after?xml.slice(0,after.index)+tag+xml.slice(after.index):xml.replace('</worksheet>',tag+'</worksheet>');
  ent.content=new TextEncoder().encode(xml);ent.size=ent.content.length;
  return X.CFB.write(zip,{type:'array',fileType:'zip'});
}
function saveFile(blob,name){

function normHead(t){return String(t==null?'':t).replace(/\s+/g,'').replace(/^\*+|\*+$/g,'');}
function pad2(n){return (n<10?'0':'')+n;}
/* 날짜 칸(시작일·종료일·적용시작일)은 엑셀이 날짜 숫자로 바꿔 두므로 yyyy-mm-dd 로 되돌린다 */
function cellVal(X,f,v){
  var isDate=f.type==='date'||/일$/.test(f.label);
  if(isDate&&typeof v==='number'){var d=X.SSF.parse_date_code(v);if(d)return d.y+'-'+pad2(d.m)+'-'+pad2(d.d);}
  var t=v==null?'':String(v).trim();
  if(isDate){var m=t.match(/^(\d{4})[.\/-]\s*(\d{1,2})[.\/-]\s*(\d{1,2})\.?$/);if(m)t=m[1]+'-'+pad2(+m[2])+'-'+pad2(+m[3]);}
  if(f.type==='check')return /^(o|v|y|yes|예|true|1|○|●|✓|✔)$/i.test(t);
  if(f.type==='multi')return t.split(/\s*[,，\n]\s*/).filter(Boolean);
  return t;
}
function readBook(X,file){
  return file.arrayBuffer().then(function(buf){
    if(/\.csv$/i.test(file.name)){
      /* 구글 스프레드시트 CSV 는 UTF-8, 한글 엑셀이 저장한 CSV 는 EUC-KR 인 경우가 있다 */
      var t=new TextDecoder('utf-8').decode(buf);
      if(t.indexOf('�')>=0){try{t=new TextDecoder('euc-kr').decode(buf);}catch(e){}}
      return X.read(t.replace(/^﻿/,''),{type:'string',raw:true});
    }
    return X.read(buf,{type:'array'});
  });
}
function uploadSheet(s,file,say){

    var ws=wb.Sheets[s.title]||wb.Sheets[wb.SheetNames[0]];

/* 표(줄 × 칸 배열)를 단계 칸에 받는다 — 엑셀·CSV 올리기와 다른 경로(구글 스프레드시트 등)가 같이 쓴다.
   행 있는 단계(BOM·외주계약)는 엑셀 한 줄 = 행 하나로 폼을 채운다.
   행 없는 단계(거래처·워크센터·품목·공정)는 한 줄이면 폼을 채우고, 여러 줄이면 줄마다 한 건씩 「여러 건 확인」 목록(showBulk)으로 받는다. */
function takeSheet(X,s,aoa,say){
    var cols=sheetCols(s),byLabel={};
    cols.forEach(function(f){byLabel[normHead(f.label)]=f;(f.alias||[]).forEach(function(l){byLabel[normHead(l)]=f;});if(f.type==='multi')multiLabs(f).forEach(function(l){byLabel[normHead(l)]=f;});});
    var hi=-1,map=[];
    for(var i=0;i<Math.min(aoa.length,10)&&hi<0;i++){
      var m=aoa[i].map(function(c){return byLabel[normHead(c)]||null;});
      if(m.some(Boolean)){hi=i;map=m;}
    }
    if(hi<0){say('이 단계 양식의 열 이름을 찾지 못했습니다. 양식 다운로드로 받은 파일에 입력해 올려 주세요.',true);return;}
    /* 머리 칸과 행 칸이 같은 키를 쓰는 단계가 있다(외주계약: 사업단위·단위 모두 unit) — 키가 아니라 칸으로 가른다 */
    var rowFs=s.rowFields||[];
    var head={},rowVals=[],recs=[],lines=0;
    aoa.slice(hi+1).forEach(function(line,li){
      var o={},one={},hasRow=false,any=false;
      map.forEach(function(f,c){
        if(!f)return;var raw=line[c];if(raw===''||raw==null)return;
        var v=cellVal(X,f,raw);any=true;
        /* 여럿 고르는 칸: 거래처종류1~4(또는 예전 쉼표 한 열) 값을 모두 합친다. 겹치는 값은 한 번만. */
        if(f.type==='multi'){var prev=rowFs.indexOf(f)>=0?o[f.k]:one[f.k];v=(prev||[]).concat(v.filter(function(x){return (prev||[]).indexOf(x)<0;}));v=v.filter(function(x,i){return v.indexOf(x)===i;});if(!v.length)return;}
        if(f.flowPos!=null){(one.rows=one.rows||[])[f.flowPos]={proc:v};}   /* v19 공정흐름유형 공정1~10 → 그 건의 행 */
        else if(rowFs.indexOf(f)>=0){o[f.k]=v;hasRow=true;}
        else{one[f.k]=v;if(!(f.k in head))head[f.k]=v;}
      });
      if(!any)return;
      lines++;
      if(hasRow)rowVals.push(o);
      if(one.rows)one.rows=one.rows.filter(Boolean);
      /* v22: 공정·공정흐름은 이름 기준 — 이름이 있으면 공정 칸(수식 값)은 보지 않고 이름을 「-」로 나눈다(수식 값이 비어 있어도 됨). 이름이 없으면 공정 칸 그대로 */
      if(s.flowCols&&one.name){var sp=splitFlow(one.name);one.rows=sp.map(function(p){return {proc:p};});one.name=sp.join('-');}
      recs.push({line:hi+2+li,vals:one});  /* line = 엑셀 줄 번호(머리 줄 다음부터) */
    });
    if(!lines){say('양식에 입력한 줄이 없습니다.',true);return;}
    if(BYKEY[cur]!==s)return;
    if((!s.rowFields||s.flowCols)&&lines>1){showBulk(s,recs,say);return;}
    if(!s.rowFields||s.flowCols){head=recs[0].vals;if(s.flowCols)rowVals=head.rows||[];}
    form.fill(head,rowVals);
    if(s.rowFields&&!s.flowCols)say('엑셀에서 '+rowVals.length+'행을 읽어 칸에 채웠습니다. 확인하고 저장을 누르세요.');
    else say('엑셀 값을 칸에 채웠습니다. 확인하고 저장을 누르세요.');
}
/* ---------- 일괄 업로드 목록 (행 없는 단계에 여러 줄을 올렸을 때, v7) ----------

function pdfLines(doc,p){

var CERT_LAB={
  sangho:'(?:'+sp('법인명')+'\\s*(?:[(（]\\s*'+sp('단체명')+'\\s*[)）])?|'+sp('상호')+')',
  rep:'(?:'+sp('대표자')+'(?:\\s*'+sp('성명')+')?|'+sp('성명')+')',
  biztype:sp('업태'),bizitem:sp('종목')};
var CERT_CUT=new RegExp('(?:'+[CERT_LAB.sangho,CERT_LAB.rep,CERT_LAB.biztype,CERT_LAB.bizitem].concat(
  ['생년월일','개업연월일','법인등록번호','주민등록번호','사업장소재지','본점소재지','사업의종류','발급사유','공동사업자','전자우편','등록번호'].map(sp)).join('|')+')');
function certClean(v){
  v=(v||'').split(CERT_CUT)[0].replace(/^[\s:：;.,·|_\-]+|[\s:：;.,·|_\-]+$/g,'');
  if(/^(\S\s)+\S$/.test(v))v=v.replace(/\s/g,'');   /* 「테 스 트」처럼 한 글자씩 띄어 읽힌 것 */
  return v;
}
function certGrab(lines,lab){
  var re=new RegExp(lab+'\\s*[:：;]?\\s*(.*)'),out=[];
  lines.forEach(function(l){var m=l.match(re);if(m){var v=certClean(m[1]);if(v&&out.indexOf(v)<0)out.push(v);}});
  return out;
}
function bizCheck(d){
  var w=[1,3,7,1,3,7,1,3,5],s=0;for(var i=0;i<9;i++)s+=d[i]*w[i];
  s+=Math.floor(d[8]*5/10);return (10-s%10)%10===d[9];
}
function parseCert(lines){
  lines=lines.map(function(l){return l.replace(/[\u0000-\u001f ]/g,' ').replace(/\s+/g,' ').trim();});
  var all=lines.join('\n'),flat=all.replace(/\s+/g,''),o={};
  /* 앞이 숫자가 아닌 자리만(법인등록번호 110111-1234567 속을 집지 않게). 옛 사파리 때문에 (?<!) 는 안 쓴다 */
  var nums=[],re=/(^|\D)(\d{3})\s*[-–—.]?\s*(\d{2})\s*[-–—.]?\s*(\d{5})(?!\d)/g,m;
  while((m=re.exec(all)))nums.push(m[2]+'-'+m[3]+'-'+m[4]);
  var ok=nums.filter(function(n){return bizCheck(n.replace(/-/g,'').split('').map(Number));});
  if(ok.length||nums.length)o.bizno=(ok[0]||nums[0]);
  var bizBad=!ok.length&&nums.length>0;   /* 검증숫자가 안 맞는 번호뿐 — 한 글자를 잘못 읽었을 가능성이 크다 */
  var sh=certGrab(lines,CERT_LAB.sangho)[0];if(sh){o.sangho=sh;o.name=sh;}
  var rp=certGrab(lines,CERT_LAB.rep)[0];if(rp)o.rep=rp;
  var bt=certGrab(lines,CERT_LAB.biztype);if(bt.length)o.biztype=bt.join(', ');
  var bi=certGrab(lines,CERT_LAB.bizitem);if(bi.length)o.bizitem=bi.join(', ');
  if(/법인사업자|법인등록번호|법인명/.test(flat))o.corp='법인';
  else if(/개인사업자|일반과세자|간이과세자|면세사업자|생년월일|주민등록번호/.test(flat))o.corp='개인';
  else if(o.bizno){var mid=+o.bizno.substr(4,2);if(mid>=81&&mid<=88)o.corp='법인';else if(mid<80)o.corp='개인';}
  return {vals:o,bizBad:bizBad};
}
function uploadCert(s,file,say){
  say('사업자등록증을 읽는 중입니다.');
  certLines(file,say).then(function(lines){
    var pc=parseCert(lines),got=pc.vals;
    if(BYKEY[cur]!==s)return;
    var keys=['sangho','name','bizno','rep','corp','biztype','bizitem'];
    var lab=function(k){return s.fields.filter(function(f){return f.k===k;})[0].label;};
    var hit=keys.filter(function(k){return got[k];}),miss=keys.filter(function(k){return !got[k];});
    if(!hit.length){say('사업자등록증 내용을 읽지 못했습니다. 더 밝고 반듯하게 찍은 사진이나 PDF 로 다시 올려 주세요.',true);return;}
    form.fill(got,[]);
    var bizE=got.bizno?bizErr(got.bizno):'';   /* 읽은 번호도 손으로 넣은 번호와 같은 검사(v12) */
    say('사업자등록증에서 '+hit.map(lab).join('·')+' 칸을 채웠습니다.'+(bizE?' '+bizE+' 고쳐 주세요.':'')+(pc.bizBad?' 사업자번호가 틀린 번호로 읽혔습니다 — 꼭 고쳐 주세요.':'')+(miss.length?' 못 읽은 칸('+miss.map(lab).join('·')+')은 직접 입력하세요.':'')+' 잘못 읽은 글자가 있을 수 있으니 확인하고 저장을 누르세요.');
  }).catch(function(e){
    console.warn('사업자등록증 읽기 실패',e);
    say(e&&e.message==='script'?'읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.':'파일을 읽지 못했습니다. PDF 나 사진(jpg · png · heic) 파일인지 확인해 주세요.',true);
  });
}
function recBody(s,r){
  var dl=h('dl',{});
  s.fields.forEach(function(f){if(!isEmpty(r[f.k])&&r[f.k]!==false){dl.append(h('dt',{},f.label),h('dd',{},show(r[f.k])));}});
  var parts=[dl];
  if(s.rowFields&&(r.rows||[]).length){
    var th=h('tr',{},s.rowFields.map(function(f){return h('th',{},f.label);}));
    var trs=r.rows.map(function(row){return h('tr',{},s.rowFields.map(function(f){return h('td',{class:f.type==='number'?'n':''},show(row[f.k]));}));});
    parts.push(h('div',{class:'tw'},h('table',{},h('thead',{},th),h('tbody',{},trs))));
  }
  return parts;
}
/* v13 대기·오류 건 고르기·지우기. 진행중·완료는 영림원에 들어갔거나 들어가는 중이라 대상이 아니다. */
var picked={};   /* 단계 키 → {문서 id → 1}. renderList 가 그 단계의 대기·오류 건만 남긴다 */
function canDel(r){return r.status==='대기'||r.status==='오류';}
function delMany(s,rows){
  if(!db){flash('저장소에 연결되지 않아 지울 수 없습니다.',true);return;}
  if(!rows.length)return;
  if(!confirm(s.title+' '+rows.length+'건을 지웁니다. 되돌릴 수 없습니다.'))return;
  Array.prototype.forEach.call(document.querySelectorAll('.delbar .btn'),function(b){b.disabled=true;});
  Promise.all(rows.map(function(r){
    return db.collection('erp_'+s.key).doc(r.id).deleteIf(canDel).catch(function(e){console.warn('삭제 실패',e);return null;});
  })).then(function(res){
    var done=res.filter(function(x){return x===true;}).length,kept=res.filter(function(x){return x===false;}).length,fail=res.filter(function(x){return x==null;}).length;
    picked[s.key]={};
    if(data[s.key])data[s.key]=data[s.key].filter(function(r){return !rows.some(function(x,i){return x.id===r.id&&res[i]===true;});});
    renderList();renderNav();renderSum();
    flash(done+'건을 지웠습니다.'+(kept?' '+kept+'건은 그 사이 진행중·완료로 바뀌어 남겼습니다.':'')+(fail?' '+fail+'건은 지우지 못했습니다. 잠시 뒤 다시 시도해 주세요.':''),!!fail);
  });
}
function renderList(){
  if(!listBox)return;
  var s=BYKEY[cur];
  renderListIn(s,listBox,'저장한 항목');
  if(s.alsoList&&listBox2)renderListIn(BYKEY[s.alsoList],listBox2,'저장한 공정');
}
function renderListIn(s,listBox,title){
  var a=data[s.key];
  var head=h('h3',{},title,h('span',{},a?a.length+'건':''));
  var dels=(a||[]).filter(canDel),keep={},pk0=picked[s.key]||{};
  dels.forEach(function(r){if(pk0[r.id])keep[r.id]=1;});picked[s.key]=keep;
  var pickedRows=function(){return dels.filter(function(r){return keep[r.id];});};
  if(dels.length){
    var selBtn=h('button',{type:'button',class:'btn small',on:{click:function(){delMany(s,pickedRows());}}});
    var drawSel=function(){var n=pickedRows().length;selBtn.hidden=!n;selBtn.textContent='선택 삭제 '+n+'건';};
    drawSel();
    head.append(h('div',{class:'delbar'},selBtn,h('button',{type:'button',class:'btn small',on:{click:function(){delMany(s,dels);}}},'대기·오류 모두 삭제')));
  }
  if(a==null){listBox.replaceChildren(head,h('div',{class:'empty'},'불러오는 중입니다.'));return;}
  if(!a.length){listBox.replaceChildren(head,h('div',{class:'empty'},'아직 저장한 '+s.title+' 항목이 없습니다. 위 폼에 입력하고 저장하면 여기에 쌓입니다.'));return;}
  var sorted=a.slice().sort(function(x,y){return (y.createdAt||'')<(x.createdAt||'')?-1:1;});
  var openIds={};
  Array.prototype.forEach.call(listBox.querySelectorAll('details[data-id]'),function(d){if(d.open)openIds[d.getAttribute('data-id')]=1;});
  var items=sorted.map(function(r){
    var st=STATUS.indexOf(r.status)>=0?r.status:'대기';
    var actions=h('div',{class:'recact'});
    if(st==='오류')actions.append(h('button',{type:'button',class:'btn small',on:{click:function(){patch(s,r,{status:'대기',agentNote:''});}}},'대기로 되돌리기'));
    if(st==='대기'||st==='오류')actions.append(delBtn(s,r));
    var pk=canDel(r)?h('input',{type:'checkbox',class:'pk','aria-label':'선택',on:{click:function(e){e.stopPropagation();},change:function(){if(pk.checked)keep[r.id]=1;else delete keep[r.id];drawSel();}}}):null;
    if(pk)pk.checked=!!keep[r.id];
    var d=h('details',{class:'rec','data-id':r.id},
      h('summary',{},pk,h('div',{class:'rt'},h('b',{},s.recTitle(r)||'(이름 없음)'),h('small',{},s.subt(r))),h('span',{class:'chip '+st},st)),
      h('div',{class:'recbody'},
        r.agentNote?h('div',{class:'agentnote'+(st==='완료'?' ok':'')},'에이전트 메모: '+r.agentNote):null,
        recBody(s,r),actions));
    if(openIds[r.id])d.open=true;
    return d;
  });
  listBox.replaceChildren.apply(listBox,[head].concat(items));
}
function delBtn(s,r){
  var armed=false,t;
  var b=h('button',{type:'button',class:'btn small',on:{click:function(){
    if(!armed){armed=true;b.textContent='정말 삭제';clearTimeout(t);t=setTimeout(function(){armed=false;b.textContent='삭제';},3000);return;}
    db.collection('erp_'+s.key).doc(r.id).delete().catch(function(e){flash('삭제하지 못했습니다. '+errText(e),true);});
  }}},'삭제');
  return b;
}
function errText(e){
  var c=e&&e.code;
  if(c==='invalid_argument'||c==='permission-denied'||c==='unauthenticated')return '저장 권한이 없습니다. 파이어베이스 규칙에서 erp_ 컬렉션을 허용해야 합니다.';
  if(c==='quota_exceeded')return '저장 한도에 도달했습니다.';
  return '잠시 뒤 다시 시도해 주세요.';
}
function flash(text,bad){
  if(!form)return;
  form.msg.textContent=text;form.msg.className='msg'+(bad?' bad':'');
  clearTimeout(msgTimer);if(!bad)msgTimer=setTimeout(function(){form.msg.textContent='';},3500);
}
function patch(s,r,o){db.collection('erp_'+s.key).doc(r.id).update(o).catch(function(e){flash('변경하지 못했습니다. '+errText(e),true);});}
function save(s){
  if(!db){flash('저장소에 연결되지 않아 저장할 수 없습니다.',true);return;}
  var res=form.collect();
  if(!res.ok){flash(res.fmt?res.fmt:'필수 항목 '+res.count+'곳이 비어 있습니다.',true);if(res.first)res.first.focus();return;}
  var blk=bulkBlock();if(blk){flash(blk,true);return;}
  form.submit.disabled=true;
  var doc,np=[];
  /* v20 공정·공정흐름: 목록에 없는 공정을 먼저 erp_processes 에 대기로 쌓고(입력 작업자가 공정을 먼저 넣는다) 흐름을 쌓는다 */
  (s.flowCols?addNewProcs(res.value.rows,res.memos).then(function(a){np=a;}):Promise.resolve()).then(function(){
    doc=Object.assign({},res.value,{status:'대기',agentNote:'',createdAt:new Date().toISOString(),route:routeOf(s)});
    return db.collection('erp_'+s.key).add(doc);
  }).then(function(){var fromBulk=bulk&&bulk.cur;if(fromBulk&&data[s.key])data[s.key].push(doc);bulkSaved();form.reset();
    var more=np.length?' 새 공정 '+np.length+'개('+np.map(function(x){return x.name;}).join(', ')+')도 공정으로 대기에 쌓였습니다.':'';
    flash((fromBulk?'저장했습니다. 일괄 업로드 목록에서 「저장됨」으로 바뀌었습니다.':'저장했습니다. 대기 상태로 쌓였습니다.')+more);})
   .catch(function(e){flash('저장하지 못했습니다. '+errText(e),true);})
   .then(function(){form.submit.disabled=false;});
}
/* v20: 흐름의 새 공정을 erp_processes 에 「대기」로 쌓는다. 같은 이름(오류 건 빼고)이 이미 있으면 안 쌓는다. 쌓은 것 = [{name,memo}] */
function addNewProcs(rows,memos){
  var todo=newProcsOf(rows,memos),P=BYKEY.processes;
  return todo.reduce(function(p,x){return p.then(function(){
    var d={name:x.name,memo:x.memo,inspect:false,status:'대기',agentNote:'',createdAt:new Date().toISOString(),route:routeOf(P)};
    return db.collection('erp_processes').add(d).then(function(){if(data.processes)data.processes.push(d);refreshLists();});
  });},Promise.resolve()).then(function(){return todo;});
}
function go(k){if(BYKEY[k]&&BYKEY[k].shownIn)k=BYKEY[k].shownIn;cur=k;try{history.replaceState(null,'','#'+k);}catch(e){location.hash=k;}renderNav();renderStep();}
function refreshAll(){renderNav();renderSum();renderList();refreshLists();}

/* ---------- boot ---------- */
document.getElementById('contractPre').textContent=JSON.stringify(SPEC,null,1)+'\n\n'+
  STEPS.map(function(s){return 'erp_'+s.key+'   '+s.n+'단계 '+s.title+' ('+s.screen+')';}).join('\n')+
  '\n\n문서 필드: 폼 항목, '+'status, agentNote, createdAt'+
  '\nstatus 값: 대기 → 진행중 → 완료 | 오류'+
  '\n행이 있는 단계(erp_flows, erp_boms, erp_contracts)는 rows 배열에 행을 담습니다.'+
  '\n에이전트 처리: status가 대기인 문서를 createdAt 오름차순으로 읽고,'+
  '\n단계 번호 순서대로 등록한 뒤 status와 agentNote를 갱신합니다.';

var hash=location.hash.slice(1);if(BYKEY[hash])cur=BYKEY[hash].shownIn||hash;
renderNav();renderSum();renderStep();refreshLists();

connectDb().then(function(d){
  db=d;
  if(!db){
    bannerEl.append(h('div',{class:'banner'},'파이어베이스에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 열어 주세요. 지금은 입력해도 저장되지 않습니다.'));
    STEPS.forEach(function(s){data[s.key]=[];});refreshAll();return;
  }
  STEPS.forEach(function(s){
    db.collection('erp_'+s.key).onSnapshot(function(snap){
      data[s.key]=snap.docs.map(function(x){return Object.assign({id:x.id},x.data());});
      refreshAll();
    },function(){data[s.key]=data[s.key]||[];refreshAll();});
  });
});
})();
</script>
