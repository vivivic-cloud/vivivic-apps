<style>

  --st-wait:#2a343e; --st-wait-ink:#c9d3dc;
  --st-run:#4a3a12; --st-run-ink:#f1d48a;
  --st-ok:#173a26; --st-ok-ink:#a9e2bc;

  --input:#141a20; color-scheme:dark;}}
:root[data-theme="dark"]{

  --accent:#4fc9be; --accent-ink:#06211f; --accent-soft:#17323a;

  --st-wait:#2a343e; --st-wait-ink:#c9d3dc;

*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);padding-block:20px 56px;

.nt{font-weight:500;line-height:1.25}
.ns{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.stephead h2{font-size:20px;margin:0 0 6px}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin:0 0 4px}
.path code{font:500 12.5px var(--mono);background:var(--accent-soft);color:var(--ink);padding:2px 8px;border-radius:6px}
.needs{font-size:13.5px;color:var(--muted);margin:10px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.needs button{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.needs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stepnote{margin:12px 0 0;font-size:14px;background:var(--bg);border-radius:8px;padding:10px 12px}
form{margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
label,.lab{font-size:13.5px;font-weight:500}
.req{color:var(--req);margin-left:2px}
input[type=text],input[type=date],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input.bad,select.bad{border-color:var(--req)}
.hint{font-size:12.5px;color:var(--muted)}

.checks{display:flex;flex-wrap:wrap;gap:6px 16px}

.sub{font-size:14px;font-weight:700;margin:22px 0 10px}
.rowcard{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--bg)}

.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}
.msg{font-size:14px}
.msg.bad{color:var(--req)}
.list h3{font-size:16px;margin:28px 0 10px;display:flex;gap:8px;align-items:baseline}
.list h3 span{font-weight:400;font-size:13px;color:var(--muted)}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:18px;font-size:14px}
details.rec{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.rec>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
details.rec>summary::-webkit-details-marker{display:none}
.rt{min-width:0}
.rt b{display:block;font-weight:500;overflow-wrap:anywhere}
.rt small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.chip{flex:none;font-size:12.5px;padding:2px 10px;border-radius:999px;font-weight:500}
.chip.대기{background:var(--st-wait);color:var(--st-wait-ink)}
.chip.진행중{background:var(--st-run);color:var(--st-run-ink)}
.chip.완료{background:var(--st-ok);color:var(--st-ok-ink)}
.chip.오류{background:var(--st-err);color:var(--st-err-ink)}
.recbody{padding:2px 14px 14px;border-top:1px solid var(--line)}
dl{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:4px 14px;margin:12px 0;font-size:14px}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;font-size:13px;min-width:100%}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;white-space:nowrap}
th{background:var(--bg);font-weight:500}
td.n{font-family:var(--mono);text-align:right}
.agentnote{background:var(--st-err);color:var(--st-err-ink);padding:8px 10px;border-radius:8px;font-size:13.5px;margin:8px 0}
.agentnote.ok{background:var(--st-ok);color:var(--st-ok-ink)}
.recact{display:flex;gap:8px;flex-wrap:wrap}
.contract{margin-top:32px}
.contract summary{cursor:pointer;font-weight:500}
.contract pre{font:400 12.5px/1.6 var(--mono);background:var(--bg);padding:12px;border-radius:8px;overflow-x:auto;margin:10px 0 0}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px}
  nav{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px}
  nav button{flex:none;grid-template-columns:26px auto}
  .num{width:26px;height:26px}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>외주자료 입력폼</h1>
    <p class="lead">영림원 ERP 테스트서버에 등록할 자료를 단계 순서대로 입력합니다. 저장한 항목은 에이전트가 ERP에 등록하고, 결과를 상태로 남깁니다.</p>
    <div class="sum" id="sum" aria-live="polite"></div>
  </header>
  <div id="banner"></div>
  <div class="app">
    <nav id="nav" aria-label="등록 단계"></nav>
    <main id="main"></main>
  </div>
  <section class="contract card">
    <details>
      <summary>에이전트용 데이터 규칙</summary>
      <p class="hint" style="margin-top:10px">에이전트는 아래 컬렉션에서 상태가 대기인 문서를 단계 순서대로 읽어 ERP에 등록하고, 결과를 같은 문서에 기록합니다. 저장소는 파이어베이스 vivivic-4b7ef의 Firestore이고 컬렉션 이름은 erp_ 로 시작합니다. 전체 규격은 같은 폴더의 erp-spec.json 입니다.</p>
      <pre id="contractPre"></pre>
    </details>
  </section>
</div>

<script>

   컬렉션은 erp_ 로 시작하는 6개만 쓴다. 기존 업무 기록 컬렉션은 건드리지 않는다.
   SDK 는 필요할 때 불러온다 — 못 불러와도 화면은 뜨고 안내 문구가 나온다. */
var FB_CONFIG={apiKey:"AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",authDomain:"vivivic-4b7ef.firebaseapp.com",projectId:"vivivic-4b7ef",storageBucket:"vivivic-4b7ef.firebasestorage.app",messagingSenderId:"830175660542",appId:"1:830175660542:web:9054030480c8280af8d8af"};
function connectDb(){
  var V='https://www.gstatic.com/firebasejs/11.2.0/';
  return Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]).then(function(m){
    var app=m[0].initializeApp(FB_CONFIG,'erp-input'),auth=m[1].getAuth(app),F=m[2],fs=F.getFirestore(app);
    return m[1].signInAnonymously(auth).then(function(){
      /* 화면 코드가 쓰는 모양(collection/doc/add/update/delete/onSnapshot)만 맞춘 얇은 껍데기 */
      return {collection:function(name){return {
        onSnapshot:function(next,err){return F.onSnapshot(F.collection(fs,name),function(s){next({docs:s.docs.map(function(d){return {id:d.id,data:function(){return d.data();}};})});},err);},
        add:function(data){return F.addDoc(F.collection(fs,name),data);},
        doc:function(id){return {delete:function(){return F.deleteDoc(F.doc(fs,name,id));},update:function(o){return F.updateDoc(F.doc(fs,name,id),o);}};}
      };}};
    });
  }).catch(function(e){console.warn('파이어베이스 연결 실패',e);return null;});
}
(function(){
"use strict";
var F=function(k,label,type,o){return Object.assign({k:k,label:label,type:type},o||{});};
var KNOWN_WC=['아인가구','AMT','경기산업','조혼가구','럭스디자인','진아산업'];
var KNOWN_PROC=['조립','가공'];

var STEPS=[
{key:'vendors',n:1,title:'거래처',screen:'거래처등록',
 path:['기본','[기본] 거래처정보','거래처'],needs:[],
 note:'외주처를 거래처로 먼저 등록합니다. 다음 단계의 워크센터가 이 거래처를 외주거래처로 선택합니다.',
 fields:[

  F('name','거래처명','text',{req:1,hint:'워크센터의 외주거래처에 표시되는 이름입니다.'}),
  F('state','거래처상태','combo',{opts:['정상'],def:'정상'}),
  F('region','국내외구분','select',{opts:['국내','해외'],def:'국내'}),
  F('credit','신용등급','combo',{opts:['A'],def:'A'}),
  F('corp','법인/개인','select',{opts:['법인','개인'],def:'법인'}),
  F('bizno','사업자번호','text',{ph:'000-00-00000'}),
  F('rep','대표자성명','text'),
  F('tel','전화번호','text'),
  F('biztype','업태','text'),
  F('bizitem','종목','text'),
  F('kinds','거래처종류','multi',{wide:1,opts:['국내매출거래처','수출매출거래처','국내매입거래처','해외매입거래처','외주가공거래처'],def:['외주가공거래처'],hint:'ERP 화면의 거래처종류 목록입니다. 외주처는 외주가공거래처에 체크합니다. 목록 아래쪽 항목은 화면에서 확인하지 못했습니다.'})
 ],
 recTitle:function(r){return r.name||r.sangho;},
 subt:function(r){return [r.region,(r.kinds||[]).join(', ')].filter(Boolean).join(' · ');}},

{key:'workcenters',n:2,title:'워크센터',screen:'워크센터등록',
 path:['생산/외주','[생산] 기본정보','워크센터관리','워크센터'],needs:['vendors'],
 note:'외주처는 워크센터로 등록하고, 외주거래처 칸에서 1단계 거래처와 연결합니다. 서버에 이미 있는 외주 워크센터는 목록 제안에 함께 나옵니다.',
 fields:[

  F('dept','생산부서','combo',{req:1,opts:['기획'],def:'기획'}),
  F('kind','워크센터구분','select',{req:1,opts:['사외외주','자체생산'],def:'사외외주'}),
  F('vendor','외주거래처','combo',{dl:'dl-vendors',reqIf:function(v){return v.kind==='사외외주';},hint:'사외외주일 때 필수입니다. 1단계에서 입력한 거래처명을 고릅니다.'}),
  F('capa','Capa산정구분','combo',{req:1,opts:['작업시간'],def:'작업시간'}),

  F('end','종료일','text',{def:'9999-12-31'}),
  F('whMat','자재출고창고','text'),
  F('whProd','제상품출고창고','text'),
  F('whDeliv','납품창고','text'),
  F('whSite','현장창고','text',{hint:'서버에 있는 워크센터는 창고 이름이 워크센터 이름과 같게 잡혀 있습니다.'})
 ],
 recTitle:function(r){return r.name;},

{key:'items',n:3,title:'품목',screen:'품목등록',

  F('io','내외자구분','select',{opts:['내자','외자'],def:'내자'}),
  F('imp','중요도','combo',{opts:['A등급'],def:'A등급'}),

 ],

{key:'processes',n:4,title:'공정',screen:'공정등록',

    h('span',{class:'pill'},'진행중 '+t['진행중']),
    h('span',{class:'pill ok'},'완료 '+t['완료']),
    h('span',{class:'pill'+(t['오류']?' err':'')},'오류 '+t['오류']));
}
function datalist(id,vals){
  var el=document.getElementById(id);
  if(!el){el=h('datalist',{id:id});document.body.append(el);}
  var seen={};var u=vals.filter(function(v){if(!v||seen[v])return false;seen[v]=1;return true;});
  el.replaceChildren.apply(el,u.map(function(v){return h('option',{value:v});}));
}
function refreshLists(){
  var vend=(data.vendors||[]).map(function(r){return r.name;});
  var wc=(data.workcenters||[]).filter(function(r){return r.kind==='사외외주';}).map(function(r){return r.name;});
  datalist('dl-vendors',vend);
  datalist('dl-wc',KNOWN_WC.concat(wc));
  datalist('dl-proc',KNOWN_PROC.concat((data.processes||[]).map(function(r){return r.name;})));
  datalist('dl-codes',(data.items||[]).map(function(r){return r.code;}));
}
function renderStep(){
  var s=BYKEY[cur];
  form=buildForm(s);
  form.el.addEventListener('submit',function(e){e.preventDefault();save(s);});
  var needs=s.needs.length?h('p',{class:'needs'},'먼저 필요한 단계',s.needs.map(function(k){return h('button',{type:'button',on:{click:function(){go(k);}}},BYKEY[k].n+'. '+BYKEY[k].title);})):null;
  listBox=h('div',{class:'list'});
  var xlMsg=h('span',{class:'msg','aria-live':'polite'});
  var say=function(t,bad){xlMsg.textContent=t;xlMsg.className='msg'+(bad?' bad':'');};
  var fileIn=h('input',{type:'file',accept:'.xlsx,.xls,.csv',hidden:true,on:{change:function(){
    var file=fileIn.files[0];fileIn.value='';if(file)uploadSheet(s,file,say);}}});
  var xlBar=h('div',{class:'actions'},
    h('button',{type:'button',class:'btn',on:{click:function(){downloadTemplate(s,say);}}},'양식 다운로드'),
    h('button',{type:'button',class:'btn',on:{click:function(){fileIn.click();}}},'엑셀 업로드'),
    fileIn,xlMsg);
  mainEl.replaceChildren(
    h('section',{class:'card'},
      h('div',{class:'stephead'},
        h('p',{class:'path'},'ERP 경로',s.path.map(function(p,i){return h('code',{},p);}),h('span',{},'화면: '+s.screen)),
        h('h2',{},s.n+'. '+s.title+' 입력'),
        needs,h('p',{class:'stepnote'},s.note)),
      xlBar,
      form.el),
    listBox);
  renderList();
}
/* ---------- 엑셀 양식 받기 · 올리기 (SheetJS, 브라우저 안에서만. 누를 때 불러온다) ----------
   양식 열 = 단계의 머리 칸 + 행 칸, 열 이름 = 화면 칸 이름. 행이 있는 단계는 엑셀 한 줄이 행 하나다. */
var XLSX_URL='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js',xlsxP=null;
function loadXlsx(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(!xlsxP)xlsxP=new Promise(function(ok,no){
    var sc=h('script',{src:XLSX_URL});
    sc.onload=function(){ok(window.XLSX);};sc.onerror=function(){xlsxP=null;sc.remove();no(new Error('xlsx'));};
    document.head.append(sc);
  });
  return xlsxP;
}
var XLSX_FAIL='엑셀 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.';
function sheetCols(s){return s.fields.concat(s.rowFields||[]);}
function downloadTemplate(s,say){
  loadXlsx().then(function(X){
    var cols=sheetCols(s);
    var ws=X.utils.aoa_to_sheet([cols.map(function(f){return f.label;})]);
    ws['!cols']=cols.map(function(f){return {wch:Math.max(12,f.label.length*2+4)};});
    var wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,s.title);
    X.writeFile(wb,'외주입력_'+s.n+'_'+s.title+'_양식.xlsx');
    say('');
  }).catch(function(){say(XLSX_FAIL,true);});
}
function normHead(t){return String(t==null?'':t).replace(/\s+/g,'').replace(/\*+$/,'');}
function pad2(n){return (n<10?'0':'')+n;}
/* 날짜 칸(시작일·종료일·적용시작일)은 엑셀이 날짜 숫자로 바꿔 두므로 yyyy-mm-dd 로 되돌린다 */
function cellVal(X,f,v){
  var isDate=f.type==='date'||/일$/.test(f.label);
  if(isDate&&typeof v==='number'){var d=X.SSF.parse_date_code(v);if(d)return d.y+'-'+pad2(d.m)+'-'+pad2(d.d);}
  var t=v==null?'':String(v).trim();
  if(isDate){var m=t.match(/^(\d{4})[.\/-]\s*(\d{1,2})[.\/-]\s*(\d{1,2})\.?$/);if(m)t=m[1]+'-'+pad2(+m[2])+'-'+pad2(+m[3]);}
  if(f.type==='check')return /^(o|v|y|yes|예|true|1|○|●|✓|✔)$/i.test(t);
  if(f.type==='multi')return t.split(/\s*[,，\n]\s*/).filter(Boolean);
  return t;
}
function readBook(X,file){
  return file.arrayBuffer().then(function(buf){
    if(/\.csv$/i.test(file.name)){
      /* 구글 스프레드시트 CSV 는 UTF-8, 한글 엑셀이 저장한 CSV 는 EUC-KR 인 경우가 있다 */
      var t=new TextDecoder('utf-8').decode(buf);
      if(t.indexOf('�')>=0){try{t=new TextDecoder('euc-kr').decode(buf);}catch(e){}}
      return X.read(t.replace(/^﻿/,''),{type:'string',raw:true});
    }
    return X.read(buf,{type:'array'});
  });
}
function uploadSheet(s,file,say){
  say('읽는 중입니다.');
  loadXlsx().then(function(X){return readBook(X,file).then(function(wb){
    var ws=wb.Sheets[s.title]||wb.Sheets[wb.SheetNames[0]];
    var aoa=ws?X.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}):[];
    var cols=sheetCols(s),byLabel={};cols.forEach(function(f){byLabel[normHead(f.label)]=f;});
    var hi=-1,map=[];
    for(var i=0;i<Math.min(aoa.length,10)&&hi<0;i++){
      var m=aoa[i].map(function(c){return byLabel[normHead(c)]||null;});
      if(m.some(Boolean)){hi=i;map=m;}
    }
    if(hi<0){say('이 단계 양식의 열 이름을 찾지 못했습니다. 양식 다운로드로 받은 파일에 입력해 올려 주세요.',true);return;}
    /* 머리 칸과 행 칸이 같은 키를 쓰는 단계가 있다(외주계약: 사업단위·단위 모두 unit) — 키가 아니라 칸으로 가른다 */
    var rowFs=s.rowFields||[];
    var head={},rowVals=[],lines=0;
    aoa.slice(hi+1).forEach(function(line){
      var o={},hasRow=false,any=false;
      map.forEach(function(f,c){
        if(!f)return;var raw=line[c];if(raw===''||raw==null)return;
        var v=cellVal(X,f,raw);any=true;
        if(rowFs.indexOf(f)>=0){o[f.k]=v;hasRow=true;}
        else if(!(f.k in head)&&(!s.rowFields?lines===0:true))head[f.k]=v;
      });
      if(!any)return;
      lines++;
      if(hasRow)rowVals.push(o);
    });
    if(!lines){say('양식에 입력한 줄이 없습니다.',true);return;}
    if(BYKEY[cur]!==s)return;
    form.fill(head,rowVals);
    if(s.rowFields)say('엑셀에서 '+rowVals.length+'행을 읽어 칸에 채웠습니다. 확인하고 저장을 누르세요.');
    else say(lines>1?'파일의 '+lines+'줄 중 첫 줄을 칸에 채웠습니다. 확인하고 저장을 누르세요.':'엑셀 값을 칸에 채웠습니다. 확인하고 저장을 누르세요.');
  });},function(){say(XLSX_FAIL,true);}).catch(function(){say('파일을 읽지 못했습니다. xlsx · xls · csv 파일인지 확인해 주세요.',true);});
}
function recBody(s,r){
  var dl=h('dl',{});
  s.fields.forEach(function(f){if(!isEmpty(r[f.k])&&r[f.k]!==false){dl.append(h('dt',{},f.label),h('dd',{},show(r[f.k])));}});
  var parts=[dl];
  if(s.rowFields&&(r.rows||[]).length){
    var th=h('tr',{},s.rowFields.map(function(f){return h('th',{},f.label);}));
    var trs=r.rows.map(function(row){return h('tr',{},s.rowFields.map(function(f){return h('td',{class:f.type==='number'?'n':''},show(row[f.k]));}));});
    parts.push(h('div',{class:'tw'},h('table',{},h('thead',{},th),h('tbody',{},trs))));
  }
  return parts;
}
function renderList(){
  if(!listBox)return;
  var s=BYKEY[cur];var a=data[cur];
  var head=h('h3',{},'저장한 항목',h('span',{},a?a.length+'건':''));
  if(a==null){listBox.replaceChildren(head,h('div',{class:'empty'},'불러오는 중입니다.'));return;}
  if(!a.length){listBox.replaceChildren(head,h('div',{class:'empty'},'아직 저장한 '+s.title+' 항목이 없습니다. 위 폼에 입력하고 저장하면 여기에 쌓입니다.'));return;}
  var sorted=a.slice().sort(function(x,y){return (y.createdAt||'')<(x.createdAt||'')?-1:1;});
  var openIds={};
  Array.prototype.forEach.call(listBox.querySelectorAll('details[data-id]'),function(d){if(d.open)openIds[d.getAttribute('data-id')]=1;});
  var items=sorted.map(function(r){
    var st=STATUS.indexOf(r.status)>=0?r.status:'대기';
    var actions=h('div',{class:'recact'});
    if(st==='오류')actions.append(h('button',{type:'button',class:'btn small',on:{click:function(){patch(s,r,{status:'대기',agentNote:''});}}},'대기로 되돌리기'));
    if(st==='대기'||st==='오류')actions.append(delBtn(s,r));
    var d=h('details',{class:'rec','data-id':r.id},
      h('summary',{},h('div',{class:'rt'},h('b',{},s.recTitle(r)||'(이름 없음)'),h('small',{},s.subt(r))),h('span',{class:'chip '+st},st)),
      h('div',{class:'recbody'},
        r.agentNote?h('div',{class:'agentnote'+(st==='완료'?' ok':'')},'에이전트 메모: '+r.agentNote):null,
        recBody(s,r),actions));
    if(openIds[r.id])d.open=true;
    return d;
  });
  listBox.replaceChildren.apply(listBox,[head].concat(items));
}
function delBtn(s,r){
  var armed=false,t;
  var b=h('button',{type:'button',class:'btn small',on:{click:function(){
    if(!armed){armed=true;b.textContent='정말 삭제';clearTimeout(t);t=setTimeout(function(){armed=false;b.textContent='삭제';},3000);return;}
    db.collection('erp_'+s.key).doc(r.id).delete().catch(function(e){flash('삭제하지 못했습니다. '+errText(e),true);});
  }}},'삭제');
  return b;
}
function errText(e){
  var c=e&&e.code;
  if(c==='invalid_argument'||c==='permission-denied'||c==='unauthenticated')return '저장 권한이 없습니다. 파이어베이스 규칙에서 erp_ 컬렉션을 허용해야 합니다.';
  if(c==='quota_exceeded')return '저장 한도에 도달했습니다.';
  return '잠시 뒤 다시 시도해 주세요.';
}
function flash(text,bad){
  if(!form)return;
  form.msg.textContent=text;form.msg.className='msg'+(bad?' bad':'');
  clearTimeout(msgTimer);if(!bad)msgTimer=setTimeout(function(){form.msg.textContent='';},3500);
}
function patch(s,r,o){db.collection('erp_'+s.key).doc(r.id).update(o).catch(function(e){flash('변경하지 못했습니다. '+errText(e),true);});}
function save(s){
  if(!db){flash('저장소에 연결되지 않아 저장할 수 없습니다.',true);return;}
  var res=form.collect();
  if(!res.ok){flash('필수 항목 '+res.count+'곳이 비어 있습니다.',true);if(res.first)res.first.focus();return;}
  var doc=Object.assign({},res.value,{status:'대기',agentNote:'',createdAt:new Date().toISOString(),route:routeOf(s)});
  form.submit.disabled=true;
  db.collection('erp_'+s.key).add(doc).then(function(){form.reset();flash('저장했습니다. 대기 상태로 쌓였습니다.');})
   .catch(function(e){flash('저장하지 못했습니다. '+errText(e),true);})
   .then(function(){form.submit.disabled=false;});
}
function go(k){cur=k;try{history.replaceState(null,'','#'+k);}catch(e){location.hash=k;}renderNav();renderStep();}
function refreshAll(){renderNav();renderSum();renderList();refreshLists();}

/* ---------- boot ---------- */
document.getElementById('contractPre').textContent=JSON.stringify(SPEC,null,1)+'\n\n'+
  STEPS.map(function(s){return 'erp_'+s.key+'   '+s.n+'단계 '+s.title+' ('+s.screen+')';}).join('\n')+
  '\n\n문서 필드: 폼 항목, '+'status, agentNote, createdAt'+
  '\nstatus 값: 대기 → 진행중 → 완료 | 오류'+
  '\n행이 있는 단계(erp_boms, erp_contracts)는 rows 배열에 행을 담습니다.'+
  '\n에이전트 처리: status가 대기인 문서를 createdAt 오름차순으로 읽고,'+
  '\n단계 번호 순서대로 등록한 뒤 status와 agentNote를 갱신합니다.';

var hash=location.hash.slice(1);if(BYKEY[hash])cur=hash;
renderNav();renderSum();renderStep();refreshLists();

connectDb().then(function(d){
  db=d;
  if(!db){
    bannerEl.append(h('div',{class:'banner'},'파이어베이스에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 열어 주세요. 지금은 입력해도 저장되지 않습니다.'));
    STEPS.forEach(function(s){data[s.key]=[];});refreshAll();return;
  }
  STEPS.forEach(function(s){
    db.collection('erp_'+s.key).onSnapshot(function(snap){
      data[s.key]=snap.docs.map(function(x){return Object.assign({id:x.id},x.data());});
      refreshAll();
    },function(){data[s.key]=data[s.key]||[];refreshAll();});
  });
});
})();
</script>
