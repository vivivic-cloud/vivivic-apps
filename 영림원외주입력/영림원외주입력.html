<!doctype html>
<!-- 영림원외주입력 — 판 번호는 머리띠 VIVIVIC 옆 배지와 같다. 고칠 때 둘을 같이 올린다: v197 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>외주자료 입력폼</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* v3 (10-30) 디자인을 에이엠티·조혼가구에 맞췄다 — 새로 지은 값은 없다.
   색·글꼴: 두 집의 body·머리띠(#37352f 글자, #787774 흐린 글자, #ededeb 테두리, #f1f1ef·#f5f5f4·#f7f6f3·#fbfbfa 채움, Inter)
   머리띠: 두 집의 <header> — 흰 바탕 · 아래 줄 · VIVIVIC 900 · 판 배지(9px #b0aeaa/#f1f0ef)
   단계 줄: .nav-link · 카드: 로그인 카드(rounded-2xl, #ededeb) · 단추: 로그인 단추(#37352f, 굵게, rounded-lg)
   표: 에이엠티 .tl-wo-table(머리 #f5f5f4 · 800 굵기 #787774 · 칸줄 #f0eeec) · 스크롤바: .custom-scrollbar(#d3d1cb)
   밝은 테마만 쓴다. 두 집 모두 어두운 테마가 없다. */
:root{
  --ink:#37352f; --muted:#787774; --faint:#b0aeaa; --line:#ededeb; --line2:#e3e2e0; --rowline:#f0eeec;
  --fill:#f1f1ef; --fill2:#f5f5f4; --fill3:#f7f6f3; --fill4:#fbfbfa; --thumb:#d3d1cb;
  --red:#dc2626; --red-bg:#fef2f2; --red-line:#fecaca;
  --amber:#92400e; --amber-bg:#fef3c7;
  --green:#166534; --green-bg:#f0fdf4;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:#ffffff;color:var(--ink);font:400 14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
/* 머리띠 — 에이엠티·조혼가구 <header> 와 같은 모양 */
.topbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;height:64px;display:flex;align-items:center;gap:8px;
  padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:900;font-size:20px;letter-spacing:-0.05em;color:var(--ink);line-height:1}
.ver{font-size:9px;font-weight:700;color:var(--faint);background:#f1f0ef;padding:1px 6px;border-radius:4px;letter-spacing:0.04em;font-family:var(--mono)}
.wrap{max-width:1180px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
h1{font-size:clamp(1.375rem,5vw,1.875rem);line-height:1.2;margin:0 0 6px;font-weight:900;letter-spacing:-0.03em;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:62ch;font-size:13px}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 22px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--muted);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.err{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.pill.ok{background:var(--green-bg);color:var(--green);border-color:#bbf7d0}
.banner{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line);padding:10px 14px;border-radius:12px;margin:0 0 16px;font-size:13px;font-weight:700}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);gap:24px;align-items:start}
/* 단계 줄 — .nav-link (활성: #f1f1ef + 안쪽 테두리 #ededeb) */
nav{display:flex;flex-direction:column;gap:4px;position:sticky;top:80px}
nav button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;
  padding:9px 12px;border-radius:8px;color:var(--muted);min-height:44px;transition:background .2s}
nav button:hover{background:var(--fill3)}
nav button[aria-current="step"]{background:var(--fill);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--mono);background:#fff;color:var(--muted);border:1px solid var(--line)}
nav button[aria-current="step"] .num{background:var(--ink);color:#fff;border-color:var(--ink)}
.nt{font-weight:800;font-size:13.5px;line-height:1.25;color:inherit}
.ns{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
/* 카드 — 로그인 카드(bg-white border #ededeb rounded-2xl) */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.stephead h2{font-size:clamp(1.125rem,4vw,1.375rem);margin:0 0 6px;font-weight:900;letter-spacing:-0.02em}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;font-weight:700;color:var(--muted);margin:0 0 8px}
.path code{font:700 11px var(--mono);background:var(--fill2);color:var(--ink);padding:2px 6px;border-radius:4px;border:1px solid #eeeeec}
.stephead .lead{font-size:13px;color:var(--muted);margin:4px 0 0;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.needs{font-size:12px;color:var(--muted);margin:10px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-weight:700}
.needs button{all:unset;cursor:pointer;color:var(--ink);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.needs button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.stepnote{margin:12px 0 0;font-size:13px;color:var(--ink);background:var(--fill4);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
form{margin-top:18px}
.bulk{margin-top:18px}   /* v7 일괄 업로드 목록 — 버튼은 기존 .btn 모양 */
.bulklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.btn.bulkbtn{justify-content:space-between;text-align:left;gap:10px;padding:10px 12px;min-height:52px;font-weight:500}
.btn.bulkbtn[aria-pressed="true"]{background:var(--fill);box-shadow:inset 0 0 0 1px var(--ink)}
.bulkbtn .rt small{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
label,.lab{font-size:11px;font-weight:700;color:var(--muted)}
.checks label,.f>label:has(input[type=checkbox]){color:var(--ink);font-size:13px;font-weight:500}
.req{color:var(--red);margin-left:2px}
/* 입력칸 — 로그인 입력칸(border #ededeb, rounded-lg, 초점 #37352f) */
input[type=text],input[type=url],input[type=date],input[type=number],input[type=password],input[type=email],select,textarea{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0;min-height:40px}
input[type=text]:focus,input[type=url]:focus,input[type=date]:focus,input[type=number]:focus,input[type=password]:focus,input[type=email]:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
input[type=checkbox]{accent-color:var(--ink);width:16px;height:16px}
input.bad,select.bad{border-color:var(--red)}
.hint{font-size:11px;color:var(--muted)}
.psparts{margin:6px 0 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}   /* v43 부속 BOM 한꺼번에 */
.cls3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:2px 0 6px}   /* v42 자재소분류 대·중·소 세 칸 */
.cls3 select{padding:9px 8px}
.hint.warn{background:var(--amber-bg);color:var(--amber);padding:3px 8px;border-radius:6px;font-weight:700}
.err{font-size:11px;color:var(--red);font-weight:700}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.checks label{display:flex;gap:6px;align-items:center;min-height:32px}
.sub{font-size:13px;font-weight:800;margin:22px 0 10px}
.rowcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--fill4)}
.rowtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font:800 11px var(--mono);color:var(--muted);letter-spacing:.02em}
/* 단추 — 로그인 단추(#37352f · 흰 글자 · 굵게 · rounded-lg) / 흰 단추(border #ededeb, hover #f7f6f3) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 13px var(--sans);border-radius:8px;padding:9px 14px;min-height:40px;
  border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s}
.btn:hover{background:var(--fill3)}
.btn:active{transform:scale(.97)}
.btn svg{flex:none}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);padding-inline:20px}
.btn.primary:hover{background:#000}
.btn.small{padding:5px 10px;font-size:11px;min-height:32px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.actions{display:flex;gap:8px;align-items:center;margin-top:20px;flex-wrap:wrap}
.card>.actions{margin-top:16px}
.gsrow{display:flex;gap:8px;align-items:center;flex-basis:100%}   /* 구글시트 링크 붙여넣는 줄 (v8) */
.gsrow[hidden]{display:none}
.pick{position:relative;display:inline-flex}   /* 단추 둘(양식 다운로드·일괄 업로드) → 누르면 엑셀/구글 고르는 작은 창 (v10) */
.pick>.btn{width:100%}
.pickmenu{position:absolute;top:calc(100% + 4px);left:0;z-index:20;display:flex;gap:4px;padding:4px;
  background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(15,15,15,.08)}
.pickmenu[hidden]{display:none}
.pickmenu .btn{border-color:transparent;justify-content:center;width:52px;height:52px;padding:0}   /* 글자 없이 로고만 (v11) */
.pickmenu .btn svg{width:32px;height:32px}
.msg{font-size:12px;font-weight:700;color:var(--muted)}
/* v23 영림원에서 불러오기 — 요청 상자(기존 .gsrow 자리처럼 단추 줄 아래 한 줄 전체) · 목록 표시 칩 */
.impbox{flex-basis:100%;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:var(--fill4);display:flex;flex-direction:column;gap:10px}
.impbox[hidden]{display:none}
.impbox p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.impbox .opts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700}
.impbox .opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.impbox .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.impbox .last{font:500 12px/1.5 var(--sans);white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0}
.chip.src{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.chip.diff{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}
.unreg{font-size:11px;color:#b45309;font-weight:700}
.chip.unreg{background:#fff7ed;color:#b45309;border-color:#fed7aa}
td.unreg>input,td.unreg>select{border-color:#f59e0b}
.chip.gone{background:#f3f4f6;color:#6b7280;border-color:#d1d5db}
details.gonebox{margin-top:10px;font-size:13px}details.gonebox>summary{cursor:pointer;font-weight:700;padding:6px 0;color:#6b7280}details.gonebox .delbar{margin:4px 0 8px}
.ylwdiff.ratediff{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.ylwdiff{background:var(--amber-bg);color:var(--amber);border:1px solid #fde68a;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:700;margin:10px 0 8px;word-break:break-word}
.msg.bad{color:var(--red)}
.list h3{font-size:15px;font-weight:900;margin:28px 0 10px;display:flex;gap:8px;align-items:baseline;letter-spacing:-0.02em}
.list h3 span{font-weight:700;font-size:11px;color:var(--muted)}
.list h3{flex-wrap:wrap}   /* v13 대기·오류 지우기 — 단추는 기존 .btn.small 모양, 목록 제목 줄 오른쪽 */
.lsearch{display:flex;margin:0 0 8px}
.lsearch>input{flex:1 1 auto;max-width:420px}   /* v37 4 품목 저장한 항목 검색 */
.lsinfo{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 10px}
.lsinfo .lscnt.need{color:var(--amber)}
.toast:not(:empty){position:fixed;left:16px;right:16px;bottom:16px;z-index:50;margin:0 auto;max-width:480px;padding:10px 14px;background:#fff;border:1px solid #e3e2e0;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.delbar{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;letter-spacing:0}
details.rec>summary .rt{flex:1}
details.rec>summary input.pk{flex:none;margin:0}
.empty{color:var(--muted);border:1px dashed var(--line2);border-radius:12px;padding:18px;font-size:13px;background:var(--fill4)}
details.rec{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
details.rec[open]{border-color:var(--line2)}
details.rec>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;min-height:44px}
details.rec>summary:hover{background:var(--fill4)}
details.rec>summary::-webkit-details-marker{display:none}
.rt{min-width:0}
.rt b{display:block;font-weight:800;font-size:13.5px;overflow-wrap:anywhere}
.rt small{color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.chip{flex:none;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:800;border:1px solid transparent;letter-spacing:.02em}
.chip.대기{background:var(--fill2);color:var(--ink);border-color:#eeeeec}
.chip.진행중{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}
.chip.완료{background:var(--green-bg);color:var(--green);border-color:#bbf7d0}
.chip.오류{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.chip.수정대기{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}   /* v34 4 품목 수정 */
.editbox{background:var(--amber-bg);color:var(--amber);border:1px solid #fde68a;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:700;margin:10px 0 8px;overflow-wrap:anywhere}
.editbox div+div{margin-top:3px}
dd.chg{font-weight:800}dd.chg s{color:var(--muted);font-weight:400;margin-right:6px}
.editlog{font-size:11.5px;color:var(--muted);margin:4px 0 10px;overflow-wrap:anywhere}
.editlog b{display:block;color:var(--ink);font-size:11px;margin-bottom:2px}
.editform{margin:12px 0 8px}
.editimpact{background:var(--fill2);border:1px solid var(--line);padding:8px 10px;border-radius:8px;font-size:12px;color:var(--muted);margin:4px 0 10px;overflow-wrap:anywhere}
.editimpact b{color:var(--ink)}.editimpact div{margin-top:3px}
.editimpact.bad{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}.editimpact.bad b{color:var(--red)}
.editform input:disabled{background:var(--fill2);color:var(--muted)}
.recbody{padding:2px 14px 14px;border-top:1px solid var(--line)}
dl{display:grid;grid-template-columns:minmax(100px,max-content) 1fr;gap:5px 14px;margin:12px 0;font-size:12.5px}
dt{color:var(--muted);font-weight:700;font-size:11px;padding-top:2px}dd{margin:0;overflow-wrap:anywhere}
/* 표 — 에이엠티 .tl-wo-table 모양. 가로 넘침은 표 상자 안에서만 스크롤한다.
   상자 높이를 화면 안으로 묶어 가로 스크롤바가 늘 화면에 보이게 한다. */
.tw{overflow:auto;max-height:60vh;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#fff;
  scrollbar-width:thin;scrollbar-color:var(--thumb) transparent;overscroll-behavior-x:contain}
.tw::-webkit-scrollbar,nav::-webkit-scrollbar{width:8px;height:8px}
.tw::-webkit-scrollbar-track,nav::-webkit-scrollbar-track{background:var(--fill4)}
.tw::-webkit-scrollbar-thumb,nav::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:10px}
table{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
th,td{padding:6px 10px;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--fill2);color:var(--muted);font-size:10.5px;font-weight:800;border-bottom:1px solid var(--line)}
td{border-top:1px solid var(--rowline)}
tbody tr:first-child td{border-top:0}
tbody tr:hover td{background:var(--fill4)}
td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.agentnote{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line);padding:8px 10px;border-radius:8px;font-size:12px;font-weight:700;margin:10px 0 8px}
.agentnote.ok{background:var(--green-bg);color:var(--green);border-color:#bbf7d0}
.recact{display:flex;gap:8px;flex-wrap:wrap}
  scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
/* v35 4 품목 「완료 품목 불러오기」 셀 표 — 상자는 .impbox 모양, 표는 .tw(가로 넘침은 표 상자 안에서만) */
.sheetbox{flex-basis:100%;min-width:0;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:var(--fill4);display:flex;flex-direction:column;gap:10px}
.sheetbox[hidden]{display:none}
.sheetbox p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.sheetbox .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheetbox .row>input[type=text]{flex:1 1 220px;width:auto;max-width:360px}
.sheetbox .tw{margin:0}
/* v53 제품 등록 점검표 — 표는 .tw(가로 넘침은 표 상자 안에서만). 단계 줄 맨 위 단추 · 6단계 빈 흐름 */
input[readonly]{background:var(--fill3)}   /* v78 */
nav .navck{background:#fff;box-shadow:inset 0 0 0 1px var(--line2);margin-bottom:6px}
nav .navck:hover{background:var(--fill3)}
nav .navck .num{background:var(--fill);color:var(--ink)}
/* v120 메뉴 박스 — 박스 단추(.navbox) 아래 펼친 목록(.navlist) */
nav button.navbox{grid-template-columns:28px 1fr auto;margin-bottom:0}
nav button.navbox.here{box-shadow:inset 0 0 0 1px var(--ink)}
nav .navarr{font-size:11px;color:var(--muted)}
nav .navlist{display:flex;flex-direction:column;gap:2px;margin:2px 0 8px 12px;padding-left:8px;border-left:2px solid var(--line)}
.ckbox{min-width:0;margin-top:12px}
.ckbox td{vertical-align:top;white-space:normal}
.ckbox td:nth-child(1),.ckbox td:nth-child(3){white-space:nowrap}
.ckbox td.nm{min-width:150px;max-width:240px;line-height:1.35}
.ckbox td.cv{min-width:84px;max-width:150px}
.ckbox small{display:block;font-size:11px;line-height:1.35;color:var(--muted);margin-top:3px;overflow-wrap:anywhere;word-break:keep-all}
.ckbox .ckno{color:var(--muted)}
.ckgo{all:unset;display:block;box-sizing:border-box;cursor:pointer;border-radius:6px;padding:2px;margin:-2px}
.ckgo:hover{background:var(--red-bg)}

  F('proc','공정','combo',{req:1,dl:'dl-procs',strictNew:1,newLab:'새 공정 추가',newPh:'새 공정 이름',newMemo:'새 공정 특이사항(선택)',hint:'이미 저장된 공정에서 고릅니다. 없으면 「새 공정 추가」 — 흐름을 저장할 때 공정으로도 대기로 쌓입니다.'}),

  F('last','최종공정여부','check',{auto:1})
 ],
 check:function(r){
  var a=(r.rows||[]).filter(function(x){return x&&!isEmpty(x.proc);});
  if(!a.length)return '공정이 하나도 없습니다';
  /* v22: 이름에서 나눈 조각(또는 엑셀 공정 칸)은 저장된 공정만. 「새 공정 추가」로 넣은 것(isNew)만 새 공정이 된다 */
  var known=LISTS['dl-procs']||[];
  var bad=a.filter(function(x){return !x.isNew&&known.indexOf(String(x.proc).trim())<0;}).map(function(x){return x.proc;});
  if(bad.length)return '미등록 공정: '+bad.join(', ');
  var dash=a.filter(function(x){return x.isNew&&/-/.test(x.proc);}).map(function(x){return x.proc;});
  return dash.length?'공정 이름에 「-」를 쓸 수 없습니다: '+dash.join(', '):'';
 },
 recTitle:function(r){return r.name;},
 subt:function(r){return (r.rows||[]).map(function(x){return x.proc;}).join(' → ');}},

 materials:{method:'화면 입력(건별)',note:'재공품(폼 v65): asset 재공품 문서는 폼 5단계 상품검색 표에서 공정 2개 이상 품목의 중간 공정마다 하나씩 쌓입니다. 폼 칸 외에 wipOf(제품번호)·wipSeq(공정순서)·wipProc(공정)가 있습니다. 자재번호 = wipOf_wipSeq, 자재명 = 부속 이름_공정명. 이 값들이 500299 공정품을 잇는 열쇠이고, 영림원 칸에 넣는 값이 아닙니다. 시험 건 T-al-p01_1(폼 v65 전)은 wip 칸이 없으며 자재번호가 같은 규칙입니다.',how:['small 은 「대분류 > 중분류 > 소분류」 경로(폼 v26). 코드도움에서는 소분류 이름으로 찾고 중·대분류가 경로와 같은 줄을 고릅니다.','small 자재소분류가 영림원 품목대중소분류정의(자재)에 있어야 합니다. 같은 이름의 erp_classes 문서가 대기·오류면 넣지 말고 오류로 두고 agentNote에 적습니다.','기본 > [기본] 품목정보 맵에서 자재등록을 엽니다.','조회로 같은 자재번호가 이미 있는지 확인합니다. 있으면 새로 만들지 않고 agentNote에 적습니다.','신규를 누르고 자재명, 자재번호 등 fieldMap 항목을 입력합니다. 기준단위·자재소분류는 코드도움(돋보기)으로 고릅니다. 자재소분류를 고르면 자재중분류·대분류가 저절로 채워집니다.','fieldMap 에 없는 칸(대표자재·오른쪽 구매정보·구매단가 표)은 비우거나 기본값 그대로 둡니다.','저장 전에 모든 칸을 문서 값과 대조하고, 저장 뒤 자재조회에서 다시 대조합니다. 화면 요령은 입력작업자/화면별-요령.md 「품목등록 (500215) · 자재등록 (500251)」.','(수정, 폼 v92) status 수정대기 문서: 자재등록(500251)에서 신규를 누르지 않습니다. 조회 조건 자재번호에 code를 넣고 조회해 그 자재를 불러옵니다(자재번호가 없으면 오류). 화면 값이 edit.before와 같은지 먼저 봅니다.','(수정) edit.changed 칸만 edit.after 값으로 고칩니다(내외자구분 = io 등 fieldMap 대응). 다른 칸·구매정보·구매단가 표는 손대지 않습니다. 저장 전에 모든 칸을 문서 값과 대조하고 저장, 자재조회에서 다시 대조합니다.','(수정, 폼 v96) 자재번호도 바뀔 수 있습니다. edit.changed 에 code 가 있으면 조회는 edit.before.code 로, 없으면 edit.after.code 로, ylwCode 가 있으면 그 자재코드로 같은 자재인지 봅니다. edit.ref = 따라 바뀐 문서 목록(docs)과 합친 불러온 문서(merged). 따라 바뀐 문서는 폼이 이미 고쳤으니 손대지 않습니다.','(수정, 폼 v96) 영림원 값이 이미 edit.after 와 같으면 저장하지 않고 대조만 한 뒤 완료로 둡니다(agentNote 「영림원 이미 같음(MM-DD): 대조만」). 불러온 문서를 작업자가 지우지 않습니다 — 합치기는 사장님이 폼에서 수정 저장을 누를 때만 일어납니다. 입력작업자/AGENTS.md 3-3-자재.','(수정) 수정 첫 건은 화면을 보며 한 칸씩 넣고 입력작업자/화면별-요령.md에 적습니다. 저장 뒤 내외자구분을 고칠 수 있는지 시험 전입니다. 안 되면 고치지 말고 오류 + agentNote(화면 문구 그대로). 입력작업자/AGENTS.md 3-3-자재.'],unverified:['저장 동작','구매단가 표를 비워 두고 저장되는지','(수정) 이미 저장된 자재의 내외자구분을 고쳐 저장할 수 있는지 — 시험 전']},
 processes:{method:'화면 입력(그리드 행)',note:'폼 v20부터 공정은 6단계 「공정등록·공정흐름유형등록」 화면에서 흐름을 저장할 때 목록에 없는 공정이 name·memo·inspect(false)로 함께 쌓인다.',how:['생산/외주 > [생산] 기본정보 맵의 공정관리에서 공정 아이콘을 눌러 공정등록을 엽니다.','조회로 기존 공정을 확인합니다. 같은 공정명이 있으면 새로 만들지 않고 agentNote에 적습니다.','빈 행에 공정명, 특이사항, 공정검사여부를 입력하고 저장합니다.'],unverified:['저장 동작']},
 flows:{method:'화면 입력(머리 행 + 상세 행)',how:['rows의 proc 공정이 모두 영림원 공정등록에 있어야 합니다. 같은 화면에서 함께 쌓인 erp_processes 대기 문서를 먼저 넣습니다(order 가 processes → flows). 없으면 오류로 두고 agentNote에 적습니다.','생산/외주 > [생산] 기본정보 맵의 공정관리에서 공정흐름유형 아이콘을 눌러 공정흐름유형등록을 엽니다.','조회로 같은 공정흐름유형이 이미 있는지 확인합니다. 있으면 새로 만들지 않고 agentNote에 적습니다.','왼쪽 표의 빈 행 공정흐름유형 칸에 name, 특이사항 칸에 memo를 넣고 저장합니다. 새 유형은 저장해야 오른쪽 상세 행이 생깁니다.','저장한 행의 행 번호를 더블클릭해 오른쪽 상세를 엽니다(한 번 누르면 안 열림).','상세 빈 행의 공정순서 칸을 누르고 rows 한 개마다 공정순서(seq), 공정(proc, 공정명), 후속공정순서(next)를 탭으로 이어 붙여 넣습니다. 공정은 이름으로 코드가 잡힙니다.','last가 true인 줄(마지막 줄)은 최종공정여부 체크를 켭니다. 공정검사여부는 회색이라 넣지 않습니다(공정등록 값 표시).','저장 전에 모든 줄·칸을 문서 값과 대조하고 저장한 뒤, 조회 후 행 번호를 더블클릭해 다시 대조합니다.','수정(폼 v53): status 수정대기 = 영림원에 이름만 있고 상세가 0줄인 흐름에 공정을 채우라는 요청입니다. edit.changed는 rows뿐이고 name은 바뀌지 않습니다. 왼쪽에 새로 만들지 않고, 같은 name 행을 더블클릭해 상세가 비어 있는지 본 뒤(이미 줄이 있으면 고치지 말고 오류) rows를 위와 같이 넣습니다.'],
  rowsNote:'name은 rows의 proc를 「-」로 이은 것(폼 v22, 예: T재단-T엣지-T보링). seq·next·last는 폼이 고른 순서로 채운다: seq 1,2,3… · next = 다음 seq, 마지막 줄은 자기 seq · 마지막 줄만 last true. 같은 공정이 두 번 나와도 된다(11-01 저장 시험 T중복시험).',
  unverified:['공정순서가 겹칠 때의 오류 문구(시험 안 함)','병렬공정(후속공정순서를 같게) — 폼은 일렬 흐름만 만든다']},
 boms:{method:'엑셀 업로드',how:['생산/외주 > [생산] 기본정보 맵의 BOM관리에서 BOM업로드(BOM등록업로드 500302)를 엽니다.','대기 문서로 영림원 양식 파일을 만듭니다: 입력작업자/스크립트/BOM업로드-엑셀만들기.py. 꼴(폼 v47, 11-03 영림원 양식다운로드로 확인) = 시트 BOM일괄업로드 · 1행 영어 칸 코드(ItemName·ItemNo… 영림원이 이것으로 열을 찾음) · 2행 한글 칸 이름 · 3행부터 rows 한 개 = 한 행(모품목 칸을 줄마다 되풀이) · A열 IDX_NO 순번 1부터 · 차수는 글자 00.','파일선택으로 그 파일을 고르고(화면 엑셀시트명 BOM일괄업로드 그대로) 데이터가져오기 → 표에 줄 수가 rows 합과 같은지, 모품목·하위품목이 잡혔는지 확인하고, 하위유무를 맞춘 뒤 저장합니다.','BOM등록(500145)에서 모품목마다 결과를 확인합니다.','수정대기 BOM(폼 v58 엣지필름 줄 추가): edit.added 줄만 영림원에 더합니다. 이미 있는 줄은 건드리지 않습니다. 넣는 길은 아직 화면으로 확인하지 않았습니다 — 입력작업자/AGENTS.md 3-4-엣지 를 먼저 합니다.'],
  note:'영림원 양식에는 하위유무(HaveChild) 칸이 없습니다(끝에 붙여도 안 읽힘) — 데이터가져오기 뒤 rows.hasSub 가 참인 줄은 표에서 하위유무를 켭니다(입력작업자 ylw.bomUp.subFix). 공정·투입단위 코드는 올린 직후 0 이고 저장 때 영림원이 이름으로 채웁니다(11-03 18건). rows.grain(결방향)은 폼 계산용이라 영림원에 보내지 않습니다(폼 양식 맨 끝 FormGrain 열은 영림원이 읽지 않음).',
  unverified:['(폼 v97 엣지필름 바꾸기) 500145·500299 에서 저장된 필름 줄의 품번을 고쳐 저장할 수 있는지 · 어느 화면을 먼저 저장해야 하는지 · 생산진행이 있는 품목을 고칠 수 있는지 — 입력작업자/AGENTS.md 3-4-필름','품목이 미등록일 때의 오류 동작','(폼 v58) 이미 등록된 BOM 에 줄을 더하는 길 — BOM등록(500145)에서 행 추가·저장, 또는 BOM등록업로드에 같은 모품목 줄만 올리기. 도움말은 「등록한 데이터는 변경할 수 없고 … [BOM등록]에서 변경」','(폼 v58) 500145 는 상위품목에 공정 칸 하나이고 하위 표에 공정 칸이 없다 — 한 BOM 에 T재단 줄과 T엣지 줄을 함께 둘 수 있는지, T엣지 공정이 어디에 남는지']},
 itemflows:{method:'화면 입력(그리드 행)',note:'한 문서 = 품목 하나 + 공정흐름 하나 = 영림원 표 한 줄(폼 v48). 한 품목에 흐름이 여러 개면 문서도 여러 개. 영림원 화면에 일괄업로드·양식다운로드가 없다(11-04 확인, 표 오른쪽 클릭은 엑셀로 내보내기만). 기본·대표·우선순위·적용일 칸이 없다. 어느 흐름을 쓸지는 제품별공정별소요자재의 공정차수로 나뉘는 것으로 보인다(도움말) — 이 화면에서 고르는 칸은 없다.',how:['code 품목(4단계)과 flow 공정흐름유형(6단계)이 영림원에 있어야 합니다. 없으면 오류로 두고 agentNote에 적습니다.','메뉴 검색 또는 Home.OpenPageSeq(500272)로 품목별공정흐름유형등록을 엽니다(생산/외주 > [생산] 기본정보, 도입 > STEP2 생산/원가 초기설정에도 있음).','품번 조회로 같은 품번 + 같은 공정흐름유형 줄이 이미 있는지 확인합니다. 있으면 새로 만들지 않고 agentNote에 적습니다(도움말: 같은 품목에 같은 흐름은 중복 등록 안 됨).','표의 빈 행 품명·공정흐름유형을 코드도움으로 고릅니다. 품번·규격은 품명을 고르면 잡히는지 확인합니다(코드는 시트 ItemSeq·ProcTypeSeq).','저장 전에 모든 줄의 모든 칸을 문서 값과 대조하고, 저장 뒤 조회로 다시 대조합니다.','(수정, 폼 v48) status 수정대기 문서: 새 줄을 만들지 않습니다. 품번으로 조회해 공정흐름유형이 edit.before.flow 인 줄을 찾고, 그 줄 공정흐름유형만 edit.after.flow 로 바꿔 저장합니다. 끝나면 protocol 의 수정 규칙대로 status 완료·edit null·editLog 를 적습니다.'],unverified:['표에 붙여넣기로 넣을 수 있는지(코드도움이 잡히는지) — 처음 넣을 때 화면별-요령.md 에 적습니다','저장 동작과 중복일 때 오류 문구','(수정) 이미 저장된 줄의 공정흐름유형을 바꿔 저장할 수 있는지(시트에 ProcTypeSeqOLD 칸이 있음)','자재(erp_materials)도 품명 코드도움에 나오는지 — 폼은 4단계 품목등록만 고릅니다']},
 itemmats:{method:'일괄등록 + 화면 확인',note:'한 문서 = 품목 하나 + 공정차수 하나(폼 v57). 공정차수는 MBOM 개정 차수로 이 등록에서 생기고, 제품별공정별워크센터등록(500865)·외주계약의 공정은 여기서 나온다. 폼 칸(name·code·spec·rev·bomRev·flow) 외에 폼이 앞 단계에서 만든 procs(공정 표: seq 공정순서·proc 공정·next 후속공정순서·last 최종공정여부)와 mats(소요자재 표: proc 투입공정·order 표시순서·cname 자재명·ccode 자재번호·cspec 규격·inunit 투입단위·qn 소요량(분자)·qd 소요량(분모)·supply 조달구분·srev 반제품공정차수)가 있다. 폼 v77: mats 는 BOM 줄 그대로이고, 앞 공정 재공품 줄은 wips 에 따로 있다(mats 칸에 pseq 투입 공정순서·wipSeq 앞 공정순서·wipProc 앞 공정을 더한 꼴. 공정이 하나인 품목·제품은 없음). 사람이 고친 값이 아니라 대조 기준이다. 저장 순서는 부속 → 제품(제품 소요자재의 반제품공정차수가 부속 공정차수를 가리킴). 기존 자료 예: 제품 A1-aw12a = 공정 조립 1줄·진아산업·분·1, 공정품 = 자기 자신, 소요자재 = 부속 14줄(제작·반제품·반제품공정차수 00·Loss 0). 기존 552품목은 공정이 품목마다 1개라 공정 여러 개짜리 예가 없다.',
  how:['code 품목·BOM·품목별 공정흐름이 영림원에 있어야 합니다. 없으면 오류로 두고 agentNote에 적습니다.',
   '제품별공정별소요자재일괄등록을 엽니다(Home.OpenPageSeq(525162)). 사업단위 본사, 제품번호를 넣고 조회합니다. ⚠ 조건 없이 스크립트로 조회했을 때 0줄이었습니다(11-04) — 제품번호를 넣고 화면 「조회」를 누릅니다.',
   '「일괄등록」 탭 표에 그 품번이 없으면 N건의 BOM차수 또는 N건의 공정차수로 이미 처리된 품목입니다(도움말) — 오류로 두고 agentNote에 적습니다. 등록여부가 켜져 있으면 이미 있으니 새로 넣지 말고 500299에서 대조만 합니다.',
   '⚠ 처음 한 번은 공정이 하나인 부속 1건(T-al-p11)만 선택해 「일괄등록」을 누르고, 500299를 조회해 공정·소요자재가 어떻게 들어갔는지 화면별-요령.md 에 적은 뒤 사장님께 보고하고 나머지를 진행합니다. 일괄등록이 공정을 어디서 가져오는지는 아직 저장 시험 전입니다.',
   '그 뒤 부속부터 제품 순서로(createdAt 순서) 처리합니다. 「일괄등록」 탭에서 선택 칸을 켜고 「일괄등록」을 누릅니다.',
   '확인: Home.OpenPageSeq(500299), 제품번호 → 공정차수 rev. 공정 표 SS1이 procs와, 소요자재 표 SS2가 mats와 줄마다 같은지 봅니다(공정순서·공정·후속공정순서 / 투입공정·자재번호·투입단위·소요량 분자·분모·조달구분·반제품공정차수).',
   '공정 표가 procs보다 모자라면(일괄등록이 BOM 공정만 넣는 경우 — 부속 BOM 공정은 T재단뿐이고 흐름은 T재단-T엣지-T보링일 수 있음) 500299에서 모자란 공정 줄을 procs 대로 넣습니다. 워크센터는 필수 칸이므로 erp_itemwcs 의 같은 code·proc·rank 1 문서의 wc, 시간단위 분, 표준작업시간 1 을 씁니다. 그 문서가 없으면 멈추고 오류 + agentNote 「10단계 워크센터 먼저」로 둡니다.',
   '⚠ 500299의 「BOM에서 가져오기」는 「기존에 등록된 자료는 삭제됩니다. 삭제하시겠습니까?」 확인창을 띄웁니다(등록 안 된 품목에서도, 11-04). 브라우저 확인창이라 탭이 멈춥니다. 사장님 허락 없이 누르지 않습니다.',
   '(재공품 줄, 폼 v77) 일괄등록은 BOM 줄만 넣습니다. wips 줄은 500299에서 따로 넣습니다. 그 줄 재공품 erp_materials(code = ccode)가 완료가 아니면 넣지 말고 대기로 두고 agentNote 「재공품 완료 먼저」. 소요자재전체보기를 켜서 ccode 가 이미 있는지 봅니다(있으면 넣지 않고 칸만 대조, T-al-p01 은 T-al-p01_1 이 이미 있음). 없으면 소요자재전체보기를 끄고 투입공정 proc 공정 줄을 고른 뒤 새 줄: 품번 ccode · 투입공정 proc · 표시순서 order · 소요량 qn/qd. 조달구분 제작·품목자산분류 재공품은 저절로 들어옵니다(11-06 T-al-p01 시험).',
   '저장 전에 모든 줄의 모든 칸을 문서 값과 대조하고, 저장 뒤 조회로 다시 대조합니다(소요자재전체보기를 켜고 mats + wips 줄 모두. 저장 뒤 원장·필름 줄 값이 그대로인지 봅니다). 끝나면 status 완료·agentNote.',
   '(수정, 폼 v57) status 수정대기 문서 중 edit.changed 에 flow 가 있으면 공정흐름유형을 바꾸는 요청입니다(flow·procs). 500299를 조회해 공정 표가 edit.before.procs 와 같은지 보고, 생산진행이 있는 공정차수(525162 일괄삭제 탭 생산진행 칸)면 고치지 말고 오류 + agentNote. 아니면 공정 표를 edit.after.procs 로 고칩니다. 소요자재 mats 는 건드리지 않습니다. 끝나면 protocol 의 수정 규칙대로 status 완료·edit null·editLog 를 적습니다.',
   '(수정, 폼 v77) edit.changed 에 wips 가 있으면 재공품 줄을 맞추는 요청입니다. edit.added 줄을 위 재공품 줄 순서로 넣고, edit.removed 줄이 있으면 멈추고 보고합니다(줄 지우기는 시험 전). 이미 있는 줄은 다시 넣지 않습니다. 저장이 막히면 오류 + 화면 문구. 끝나면 protocol 의 수정 규칙대로 적습니다.'],
  unverified:['재공품 줄의 반제품공정차수(srev) — 11-06 시험 기록에 값이 없어 폼은 비워 둠. 저장 뒤 화면 값을 agentNote 에 적습니다','공정 3개 품목의 재공품 줄(시험은 공정 2개 T-al-p01 한 건)','생산 계획·지시가 있는 품목에 재공품 줄을 더할 때 막히는지','일괄등록을 누르면 공정 표가 흐름에서 채워지는지, BOM 공정만 들어가는지, 워크센터가 비는지(화면 글: 일괄등록 후 제품별공정별워크센터일괄수정에서 공정/워크센터 정보를 추가 등록해야 합니다)','일괄등록 저장 동작과 오류 문구','500299 저장 동작 · 공정품명·공정품번을 비워 둬도 되는지(공정 여러 개일 때 중간 공정의 공정품)','「BOM에서 가져오기」 확인창을 확인으로 넘겼을 때의 동작(눌러 보지 않음)','「공정흐름유형에서 공정내역 가져오기」가 채우는 때 — 체크 켜짐·흐름이 잡혀 있어도 표는 비어 있었다','한 품목에 흐름 둘일 때 일괄등록이 어느 흐름을 쓰는지','같은 공정이 두 번 있는 흐름(T재단-T엣지-T재단-T엣지)의 투입공정 고르는 법']},
 itemwcs:{method:'화면 입력(그리드 행)',note:'한 문서 = 품목 + 공정 + 워크센터 = 영림원 가운데 표 한 줄(폼 v55). 한 공정에 업체 여러 개 = 문서 여러 개 + rank 우선순위(폼 v56 — 한 줄에서 여러 곳을 고름, 먼저 고른 곳이 1). 외주발주입력은 이 등록과 상관없이 거래처를 고를 수 있고(11-04 화면, 저장 전까지), 외주계약 미등록공정은 이 등록에서 온다 — 단가 계약을 할 업체는 모두 여기 있어야 한다. 영림원 기존 552줄 = 공정마다 워크센터 하나 · 시간단위 분 · 표준작업시간 1 · 우선순위 1. 일괄업로드·양식다운로드 없음(건별 500865, 표 고치기 525145). 외주계약등록 왼쪽 표의 등록대상공정건수 = 그 워크센터의 이 줄 수(11-04 AMT 499 = 일괄수정 가공/AMT 499) — 이 단계가 없으면 외주계약 미등록공정이 안 나온다. 공정품 품번(폼 v65)은 이 문서에 없고 5단계 재공품 문서에 있다: erp_materials 에서 code = 이 문서 code_seq 인 문서(새 문서는 wipOf·wipSeq 도 같음). 11-05 시험 순서: 재공품 자재등록 → 500299 그 공정 줄에 공정품 + rank 1 워크센터·tunit·time 함께 저장 → 500865 에 rank 1 줄이 저절로 생김 → 나머지 업체만 넣음.',how:['code 품목·proc 공정(그 품목 흐름)·wc 워크센터가 영림원에 있어야 합니다. 없으면 오류로 두고 agentNote에 적습니다.','중간 공정(그 품목 erp_itemmats procs 에서 last 가 아닌 seq)은 공정품이 먼저입니다. erp_materials 에서 code = 「code_seq」 문서를 찾습니다. 완료가 아니거나 없으면 넣지 말고 대기로 두고 agentNote에 「재공품 완료 먼저」라고 적습니다. 완료면 500299 그 공정 줄에 공정품(고르기 창 재공품 거르기, 그 품번) + rank 1 워크센터·시간단위·표준작업시간을 한 번에 저장합니다. rank 1 문서는 이것으로 끝입니다(500865 줄이 저절로 생김, 조회로 대조). 나머지 rank 만 아래대로 500865 에 넣습니다. 최종 공정은 공정품이 있어 아래대로 합니다.','먼저 공정차수를 봅니다: 제품별공정별소요자재일괄등록(525162) 조회에서 등록여부가 꺼져 있거나 500865 제품 코드도움(생산사업단위별 생산품번)에 품번이 안 나오면 공정차수가 없는 것입니다. 이때 넣지 말고 오류로 두고 agentNote에 「공정차수 없음 — 제품별공정별소요자재 먼저」라고 적습니다(11-04 T 18품목 모두 없음). 공정차수는 9단계 itemmats 문서를 처리하면 생깁니다.','Home.OpenPageSeq(500865)로 제품별공정별워크센터등록을 엽니다. 사업단위 본사, 제품번호를 넣고 Enter(코드도움이 뜨면 그 품번을 더블클릭), 공정차수 rev.','같은 줄이 있는지 봅니다. 위 표에서 proc 행을 더블클릭해 가운데 표를 엽니다. 같은 워크센터가 있으면 새로 만들지 않고 agentNote에 적습니다.','가운데 표 빈 행 A에 워크센터 wc(코드도움)를 넣습니다. 워크센터구분·외주거래처는 영림원이 채웁니다. 시간단위 tunit, 표준작업시간 time, 우선순위 rank.','저장 전에 모든 줄의 모든 칸을 문서 값과 대조하고, 저장 뒤 조회로 다시 대조합니다. 여러 품목은 제품별공정별워크센터일괄수정(525145)을 조회해 같은 칸을 고쳐도 됩니다(화면만 확인, 저장 시험 전).','(수정, 폼 v55) status 수정대기 문서: 새 줄을 만들지 않습니다. 품번·공정으로 조회해 워크센터가 edit.before.wc(없으면 문서 wc)인 줄을 찾고 edit.changed 칸만 edit.after 값으로 바꿔 저장합니다. 끝나면 protocol 의 수정 규칙대로 status 완료·edit null·editLog 를 적습니다.'],unverified:['저장 동작과 오류 문구(이 화면은 11-04 보기만 함)','제품별공정별소요자재일괄등록(525162) 저장 뒤 공정 표가 흐름에서 채워지는지 — 화면 안내는 「일괄등록 후 제품별공정별워크센터일괄수정 화면에서 공정/워크센터 정보를 추가 등록해야 합니다」','한 공정에 워크센터 둘 이상 저장(화면은 빈 행이 있고 도움말에 우선순위가 있음, 기존 자료에 예는 없음)','시간단위 드롭다운의 전체 선택지(분만 봄)','후속 차수가 생길 때 공정차수 고르는 법 — 폼은 00 만 만듭니다']},
 contracts:{method:'화면 입력(그리드 행)',note:'폼 v66: 문서 한 건 = 11단계 「모두 저장」 한 번 = 업체 하나 + 그때 단가를 넣은 줄들. 폼 v73: 동일 단가 업체를 고르면 「모두 저장」 한 번에 업체마다 문서가 하나씩 생깁니다(줄 꼴은 같고, 문서마다 따로 처리합니다). 같은 업체 문서가 여럿일 수 있습니다(단가를 나눠 넣으면). 줄 칸: prod 제품명 · pcode 제품번호 · seq 공정차수 · pseq 공정순서(폼 v66, erp_itemwcs seq 와 같음, 영림원 칸 아님) · proc 공정 · oname·ocode 공정품(대조용 — 재공품 공정은 재공품, 최종 공정은 자기 품목) · cur KRW · basis 수량 · vat false · price · from · calc(폼 v67, 재단 자동 단가의 계산식, 예 18T 2200÷9=244.44→244. 영림원 칸 아님, 손으로 고친 줄은 없음). 재단 자동 price 는 소수 첫째 자리에서 반올림한 원 단위이고, 사람이 넣은 줄만 소수가 있을 수 있습니다(4자리까지). 대상 줄은 erp_itemwcs(오류 뺌)에서 옵니다. 영림원 업체별 줄 수 = 500865 줄 수. 일괄 업로드는 없습니다. 소요자재는 넣지 않습니다(도움말상 외주발주가 제품별공정별소요자재 값을 씁니다, 저장 흐름은 확인 못 함).',how:['Home.OpenPageSeq(501605)로 외주계약등록을 엽니다. 사업단위 본사.','왼쪽 표에 그 업체(vendor) 줄이 없으면 빈 줄 외주거래처 칸을 더블클릭해 고르기 창에서 고르고 저장합니다(붙여넣기는 안 먹을 때가 있음). 조회하면 워크센터·등록대상공정건수가 나옵니다.','왼쪽 그 업체 줄을 열고 「미등록공정 가져오기」를 누릅니다. 줄 수가 그 업체 미등록공정건수와 맞는지 봅니다.','문서 rows 에 없는 줄은 행 머리 선택(Sheet.setSelection(행,-1,줄수,-1)) 후 「행삭제」로 지웁니다. 일부 줄만 저장됩니다.','남은 줄을 pcode·seq·proc 로 rows 와 맞춥니다. 외주품명·외주품번이 oname·ocode 와 같은지 대조합니다. 다르면 저장하지 않고 오류로 두고 agentNote 에 적습니다.','외주단가 price, 적용시작일 from(칸을 눌러 2026-11-05 꼴로 치고 Tab)을 넣습니다. 영림원 외주단가의 소수 자리는 확인 못 했습니다(표시는 2자리, 11-05 시험값은 1). 소수가 있는 price 는 그 첫 줄을 저장한 뒤 조회·501604 에서 저장값이 price 와 같은지 대조하고, 잘렸으면 멈춰 보고합니다. 통화·정산기준·부가세는 기본값(KRW·수량·꺼짐)이 문서와 같은지 봅니다.','저장(알림 없음) → 조회 대조 → 외주계약조회(501604) 대조. 왼쪽 미등록공정건수가 줄 수만큼 줍니다.','⛔ 가져오기에 안 나오는 줄 = 영림원에 이미 계약이 있는 줄입니다. 단가 변경 방법은 확인 못 했습니다. 고치지 말고 그 줄을 agentNote 에 적어 멈추고 보고합니다. T에이엠티 T-al-p01 T재단(11-05 시험 저장, 단가 1, 적용 2026-11-05)이 그런 줄입니다.'],unverified:['외주단가 소수 3·4자리 저장','단가 0 저장','같은 줄 단가 변경(새 적용일)','외주발주에서 이 계약이 잡히는지','소요자재가져오기가 저장까지 하는지','한 번에 여러 줄 저장(시험은 1줄)']},
 imporders:{method:'화면 입력(머리 + 표)',note:'폼 v93 첫 판(사장님 말씀 「이부분 폼으로 만들어 두세요 질문하지말고 지금 생각대로 만들어 두고 나중에 사용하면서 수정해 갑시다」). 한 문서 = P/O 하나. rows 한 줄 = 필름 하나. 폼 v95: 다음 단계는 erp_imppays(모든기능 「수입Payment」)입니다. 수입BL 은 Order 없이도 그대로 저장합니다. 폼에 없는 사업단위·수입구분·담당자·부서는 화면 기본값을 그대로 둡니다. 수입처번호·수입정보 24칸은 비워 둡니다(11-06 시험에서 비워도 저장됨). HSCode·P/O 관리번호·수입금액은 회색 칸이고, 금액은 화면이 계산합니다.',

 purdelvs:{method:'발주 조회에서 넘겨 화면 입력',note:'폼 v80. 화면은 「구매/수입 · [구매] 구매·입고」 입구의 「구매납품입력」 탭입니다. 한 문서 = 발주 하나의 납품 한 번. 나눠 납품은 문서가 여러 개입니다. purId = erp_purchases 문서 id(v121 purCol 이 erp_purords 면 그 컬렉션 문서 id). rows.poqty 는 폼 대조용이라 영림원 칸이 아닙니다. qty 는 이번에 온 수량입니다. dlvno 는 입력 작업자가 납품번호를 적습니다. 저장하면 입고까지 저절로 되고 재고가 바로 잡힙니다. 구매입고입력 501589 에는 넣지 않습니다. 전표·정산·세금계산서는 누르지 않습니다. rows 에는 남은 수량이 있는 줄만, qty 는 0 보다 크고 남은 수량 이하입니다.',

 prods:{method:'화면 입력(여러 화면 차례로)',note:'폼 v81. 화면은 1~11단계와 분리된 「생산/외주」 입구의 「주간생산계획입력·외주발주입력」 탭입니다. 설계안 = 설계안/생산외주-폼.md. 한 문서 = 생산 한 건. 폼이 저장 때 그 품목(제품이면 부속까지)의 앞 단계 완료를 봤으므로, 다른 품목의 대기·오류 때문에 건너뛰지 않습니다. rows = 공정마다 한 줄(제품이면 부속 줄 + 제품 줄). rows.qty 는 BOM 수량 그대로입니다(부속 재고로 줄이지 않음, 임시). wc = 사장님이 고른 업체, wcFirst = 우선순위 1 업체. (폼 v169) 양식 올리기로 생긴 문서는 fromSheet true 이고 wc = 우선순위 1 업체입니다. prodGap(배열)이 있으면 저장 때 그 품목 1~11단계가 덜 끝났던 문서이니, 영림원에서 품번·공정·외주거래처가 있는지 먼저 보고 없으면 넣지 말고 오류 + agentNote 로 둡니다. 입력 작업자가 쓰는 칸 = planNo · stage(계획·작업지시·외주발주) · rows.workNo · rows.orderNo. 폼은 stage 가 있는 문서를 못 지웁니다. 전표·정산·외주발주서출력·MAIL 은 누르지 않습니다.',
  how:['(폼 v100) dueEdit 가 있으면 사장님이 완료일을 고친 문서입니다. stage 까지 이미 영림원에 있으니 새로 만들지 말고 AGENTS.md 3-11 「완료일 고침」대로 합니다. dueEdit·dueLog·planNo·stage·rows.workNo 는 지우지 않습니다.','주간생산계획입력 500498: 사업단위 본사를 먼저 넣고 품번 itemNo · 생산계획수량 qty · 생산계획완료일 dueDate → 저장 → 일괄확정처리. stage 계획 · planNo.','kind 가 제품이면 줄 선택 + 반제품 생산계획 생성 → 저장. 나온 부속·수량을 rows 와 대조하고 다르면 멈춰 오류로 둡니다. 부속 줄을 확정합니다.','처리할 줄 선택 + 작업지시생성. 탭이 몇 분 멈출 수 있으니 다시 누르지 않습니다. rows.workNo. stage 작업지시.','외주계획 501608 → 외주발주입력 501617: rows 의 모든 공정을 한꺼번에 발주합니다(시험 전). 외주거래처가 wc 와 같은지 대조합니다. 저장 → 소요자재가져오기 → 저장. 다음 공정 소요자재에 재공품 줄이 있는지 봅니다. rows.orderNo. stage 외주발주. 막히면 멈추고 오류 + 화면 문구.','임시: 엣지 발주를 넣을 때 그 필름 소요수량을 자재이동 501125 외주불출로 본사 창고에서 엣지 업체 창고로 옮깁니다.','완료 + agentNote 에 번호.'],

 proddlvs:{method:'외주발주조회에서 넘겨 화면 입력(공정 차례대로) + 자재출고',note:'폼 v171. 화면은 「생산/외주」 입구의 「외주납품입력·자재출고입력」 탭입니다. 사장님 말씀 「아니다 그냥 발주된 제품만선택해서 각 단계가 남품된것으로 간주하는 입력하는 구조를 만들어줘」. 새 문서(all true): 폼 v172 부터 한 건 = 외주발주까지 등록된 생산(erp_prods, 모든 rows 에 orderNo) 하나의 공정 하나 납품(폼 v174 부터 rows = 같은 공정·같은 외주거래처 줄 모두(부속 여러 개), 머리에도 첫 줄 seq·proc·wc). 사장님 말씀 「입력폼 외주납품입력·자재출고입력 발주서를 클릭하면 저장목록이 생성되는데 이것을 각 공정별 분리 등록하게 나눠줄 수 있나요?」. 생산 하나를 고르면 남은 공정마다 한 건씩 createdAt 차례(부속 줄 다음 제품 줄)로 쌓입니다. 같은 prodId 의 앞 공정 문서가 완료된 뒤 처리합니다(임시 — 공정별 문서를 따로 넣는 것은 시험 전). v171 문서는 rows 가 여러 줄(전 공정 한 건)일 수 있고 처리는 같습니다. 공정마다 남은 발주 수량 전부를 납품한 것으로 봅니다. 사장님 값 = dlvDate 외주납품일(영림원 칸) · stmtNo·stmtAmt 명세서 번호·금액(폼 기록만, 영림원 칸 확인 전이니 넣지 않음). 머리 = prodId(erp_prods 문서 id) · planNo · kind · itemNo · itemName · qty. rows = 공정마다 한 줄(erp_prods rows 차례 = 부속 줄 다음 제품 줄): itemNo · itemName · seq · proc · wc · workNo · orderNo · dlvQty 납품수량 · last, 그리고 다음 공정 업체가 다를 때만 moveKind(재공품·완성 부속) · wipNo(보낼 품번) · toWc(받는 업체) · nextProc · toWorkNo(다음 공정 작업지시번호). moveKind 가 빈 줄은 출고가 없습니다(마지막 공정 또는 같은 업체). 입력 작업자가 쓰는 칸 = rows.dlvNo · rows.inNo · rows.outNo · rows.stock 과 agentNote. 원장은 구매납품 때 외주업체 창고에 들어와 있고 엣지필름은 외주발주 때 옮겼으니(사장님 11-10, 사장님-규칙.md 「원장·엣지필름 창고」) 여기서 출고하는 것은 재공품·완성 부속뿐입니다. 옛 문서(all 없음) = 공정 하나의 납품 한 번(v81~v170), 처리는 옛 how 그대로(AGENTS.md 3-11). 정산·전표는 하지 않습니다.',
  how:['prodId 의 erp_prods 문서가 완료(외주발주·필름 이동까지)여야 합니다. 대기·진행중이면 건너뜁니다. 문서가 없으면 오류.','rows 를 그 차례대로(품목마다 seq 순서, 부속 줄을 모두 끝낸 뒤 제품 줄) 처리합니다. dlvNo 가 이미 있는 줄은 건너뜁니다(멈췄다 다시 할 때). 줄마다 끝나면 그 줄 칸을 바로 문서에 적습니다(status 진행중 그대로).','줄마다 외주납품: 501614 로 같은 납품이 이미 있는지 봅니다 → 외주발주조회 501610 에서 orderNo 줄 선택 + 외주납품 → 501613 외주납품일 dlvDate · 납품수량 dlvQty → 모든 칸 대조 → 저장. 번호 칸으로 확인해 rows.dlvNo. 입고는 저장 때 저절로 됩니다(501614 입고완료 → rows.inNo). 시트 오류는 저장 전에 MutationObserver 로 모읍니다.','그 줄에 moveKind 가 있으면 다음 줄을 납품하기 전에 자재출고: 자재출고요청현황 500938 을 toWorkNo 로 조회 → nextProc 줄 선택 + 출고처리 → 자재출고입력 500940 · 출고유형 외주출고 · 입고창고 = toWc 대조 · wipNo 줄 출고창고 = wc · 금회출고수량 = dlvQty · 다른 자재 줄은 요청수량 그대로(0·행삭제 안 됨) → 저장 → rows.outNo. 원장·필름 줄 출고창고는 바꾸지 않습니다.','501186 재공재고 · 501179 창고별 재고로 앞 업체가 줄고 다음 업체에 생겼는지 대조해 rows.stock 에 짧게 적습니다.','「현재고가 부족하여」 등으로 막히면 그 줄에서 멈추고 오류 + agentNote 에 품번·공정·화면 문구 그대로. 다 되면 완료 + agentNote 에 번호.'],
  unverified:['한 생산의 전 공정을 이어서 납품·출고 — 공정 하나씩은 11-06 시험됨, 4제품 전체는 시험 전','완성 부속을 조립 업체로 출고(조립 작업지시로 500938 에 나오는지 · 다른 부속 줄이 함께 나올 때) — 시험 전','외주납품일이 외주발주일보다 앞일 때 막히는지 — 시험 전','명세서 번호·금액이 들어갈 영림원 칸','납품부서 · 납품담당자 · 납품구분 값']},
 prodmoves:{method:'자재출고요청현황에서 넘겨 화면 입력',note:'폼 v81, v84 완성 부속. 외주납품입력·자재출고입력 탭 카드의 [재공품 자재출고입력]·[완성 부속 자재출고입력] 한 번 = 문서 하나. kind = 재공품(옛 문서는 칸 없음) · 완성 부속. wipNo = 보낼 품번(재공품 품번 또는 부속 품번). fromWc 와 toWc 가 같으면 폼은 문서를 만들지 않습니다. 재공품을 실제로 보내는 날 사장님이 누릅니다. 외주발주·납품과 뗀 까닭 = 재공품은 다음 공정이 시작되기 전까지 현재 공정 창고에 보여야 합니다. fromWc = 앞 공정 업체 창고, toWc = 다음 공정 업체 창고, qty = 앞 공정 납품 합 - 이미 보낸 합, wipNo = 재공품 품번. 입력 작업자가 쓰는 칸 = outNo · stock. 임시: 재공품 이동은 자재출고로 합니다(자재이동 501125·이동입력 501096 에는 재공품이 안 잡힘). 폼 v171 부터 이 문서를 만드는 단추가 없습니다 — 자재출고는 erp_proddlvs 전 공정 납품 문서(all) 처리 안에서 합니다. 이 컬렉션에는 옛 문서만 있습니다.',

/* ---------- v33 4 품목 품명 = 조혼가구 상품검색(발주상품검색) ----------

/* ---------- v67 T재단 자동 단가 = 두께별 재단비 ÷ 원장 한 장당 수량(부속 BOM 원장 줄 소요량 1/n 의 n), v70 원 단위 반올림 ----------
   사장님 11-05: 소요된 원장 한 장당 재단비를 책정한다 · 원장 두께 18T 2200원, 2.7T 500원(부가세 별도). 두께 = BOM 원장 줄 하위품명의 「18T」 꼴.

var CUT_FEE={'18':2200,'2.7':500};
function conThick(n){

function conCut(c){

  var st=(d.rows||[]).filter(function(x){var cc=String(x.ccode||'').trim();return String(x.proc||'').trim()===c.proc&&(data.materials||[]).some(function(m){return String(m.code||'').trim()===cc&&m.status!=='오류'&&m.asset==='원자재';});});

/* ---------- v71 T엣지 자동 단가 = 500원/M × 그 부속 BOM 의 T엣지 필름 줄 소요량(M, 7단계에 저장된 값 그대로 — 다시 계산하지 않는다), v72 사용량 반올림 ----------
   사장님 11-05: 「엣지 사용량(소숫점 셋째자리에서 반올림값) 곱하기 500원 /미터당」. 사용량 M 을 먼저 소수 둘째 자리까지 반올림(6자리로 맞춘 뒤 정수 계산)하고 원/M 을 곱한다. 금액은 다시 반올림하지 않는다(부동소수 찌꺼기만 없앰).

/* ---------- v74 수입 = BL·입고(사장님 11-06, v93 Order 더함) ----------
   수입BL: 보통 입력 폼 + 필름 줄. 품명·규격·단위는 저장 때 5 자재에서 채운다(impblDoc). 수입처 = 완료된 해외매입거래처, 품번 = edgeFilms(자재분류 중분류 T엣지필름).
   수입입고: 입력 폼 없이 B/L 을 골라 입고일·입고창고·수량만 넣는다(impPickFn). B/L 하나에 입고 문서 하나 — 나눠 입고는 시험 전이라 만들지 않았다. */
/* v167 환율 = 영림원 기본 › [기본] 환율정보 › 환율정보등록/환율정보조회 표(erp_rates, 입력 작업자가 읽어 넣음) 매매기준율만.
   사장님 말씀(글자 그대로): 「정해진 환율외에 환율이 입력적용되어서는 안된다는 말이죠, 그렇다면 입력폼 에서도 영림원에 그 기준이 정해지는 곳이 있다면 관련 입력을 할때 이환율이 강제로 적용되도록 조치 해야 합니다」
   문서 날짜·통화로 찾는다. 그날 값만 — 없으면 막는다(⏳ 임시: 영림원 「환율선택」 창은 그 일자 등록이 없으면 0.00, 11-10 입력 작업자 기록). KRW 는 표에 없어 칸을 안 단다. */
function rateDoc(date,cur){date=purTrim(date);cur=purTrim(cur);return (data.rates||[]).filter(function(r){return purTrim(r.date)===date&&purTrim(r.cur)===cur&&impNum(r.base);})[0]||null;}

function rateErr(date,cur){

  return rateOf(date,cur)==null?'영림원 환율정보에 '+date+' '+cur+' 매매기준율이 없습니다 — 저장하지 않았습니다.':'';

function rateRowsErr(rows,date){return (rows||[]).map(function(o){return rateErr(date,o&&o.cur);}).filter(Boolean)[0]||'';}
function rateRowsSet(rows,date){(rows||[]).forEach(function(o){var c=purTrim(o.cur);if(c&&c!=='KRW')o.rate=rateOf(date,c);else delete o.rate;});}

  if(c==='erp-perm'||c==='invalid_argument'||c==='permission-denied'||c==='unauthenticated')return '권한이 없습니다. 담당자 관리에서 이 메뉴의 권한을 받아야 합니다.';   /* v115 */
  if(c==='quota_exceeded')return '저장 한도에 도달했습니다.';
  return '잠시 뒤 다시 시도해 주세요.';
}
var toast=null;
function flash(text,bad){
  var el=form&&document.body.contains(form.msg)?form.msg:null;
  if(!el){if(!toast){toast=h('div',{class:'msg toast',role:'status','aria-live':'polite'});document.body.append(toast);}el=toast;}   /* v103 입력 칸이 없는 화면(생산·불러오기 요청 등)의 알림 */
  el.textContent=text;el.className='msg'+(bad?' bad':'')+(el===toast?' toast':'');
  clearTimeout(msgTimer);if(!bad||el===toast)msgTimer=setTimeout(function(){el.textContent='';},bad?8000:3500);
}

/* v46 오래 열어 둔 화면(옛 판)으로 저장하지 않게: 저장 직전 배포판 판 번호를 읽어 더 새 판이면 막는다. 못 읽으면(오프라인·파일로 연 화면) 그냥 저장 */
var VER=+(String((document.querySelector('.ver')||{}).textContent||'').match(/\d+/)||[0])[0];
function freshCheck(){
  if(!/^https?:/.test(location.protocol))return Promise.resolve('');
  return fetch(location.href.split('#')[0],{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(t){
    var m=String(t).slice(0,400).match(/올린다:\s*v(\d+)/);
    return m&&+m[1]>VER?'새 판(v'+m[1]+')이 나왔습니다. 지금 화면은 v'+VER+' 입니다 — 새로고침(⌘R)한 뒤 다시 올려 주세요. 저장하지 않았습니다.':'';
  },function(){return '';});
}
function save(s){
  if(!db){flash('저장소에 연결되지 않아 저장할 수 없습니다.',true);return;}
  form.submit.disabled=true;
  freshCheck().then(function(old){form.submit.disabled=false;if(old){flash(old,true);return;}save2(s);});
}
function stepAdd(s,v){   /* v98 대기 문서 쌓기 — 입력 칸 저장과 공용 팝업이 같이 쓴다 */
  var doc=Object.assign({},v,{status:'대기',agentNote:'',createdAt:new Date().toISOString(),route:routeOf(s)});if(s.fillDoc)s.fillDoc(doc);
  return db.collection('erp_'+s.key).add(doc).then(function(ref){return {doc:doc,id:ref&&ref.id};});

/* ---------- v98 공용 등록 팝업 ----------
   사장님 말씀: 「그런 모든 액션을 이 입력폼에서 할 수 있게 해보자는거야」. 앞 단계가 비어 있을 때 그 단계로 옮겨 가지 않고 그 자리에서 등록한다.
   stepPopup(단계 키,{title,note,fill,check(값→막는 글자),onSaved(문서)}). 칸·검사 = 그 단계 buildForm, 저장 = stepAdd(입력 칸과 같은 길). 지금은 7 BOM 엣지필름 바꾸기만 쓴다. */
function stepPopup(key,o){
  var s=BYKEY[key],fm=buildForm(s),dlg=h('dialog',{class:'stepdlg','aria-label':o.title||s.title});
  var say=function(t,bad){fm.msg.textContent=t;fm.msg.className='msg'+(bad?' bad':'');};
  fm.submit.textContent='등록 저장';
  fm.submit.after(h('button',{type:'button',class:'btn',on:{click:function(){dlg.close();}}},'닫기'));
  fm.el.addEventListener('submit',function(e){
    e.preventDefault();
    if(!db){say('저장소에 연결되지 않아 저장할 수 없습니다.',true);return;}
    var res=fm.collect();
    if(!res.ok){say(res.fmt?res.fmt:'필수 항목 '+res.count+'곳이 비어 있습니다.',true);if(res.first)res.first.focus();return;}
    var why=(s.saveCheck?s.saveCheck(res.value):'')||(o.check?o.check(res.value):'');if(why){say(why,true);return;}
    fm.submit.disabled=true;
    freshCheck().then(function(old){
      if(old){fm.submit.disabled=false;say(old,true);return;}
      return stepAdd(s,res.value).then(function(x){
        var d=Object.assign({id:x.id},x.doc);
        if(data[key]&&!data[key].some(function(r){return r.id===d.id;}))data[key].push(d);   /* 스냅샷이 오기 전에도 바로 고를 수 있게 */
        dlg.close();if(o.onSaved)o.onSaved(d);
      },function(e){fm.submit.disabled=false;say('저장하지 못했습니다. '+errText(e),true);});
    });
  });
  dlg.addEventListener('close',function(){dlg.remove();});
  dlg.append(h('h3',{},o.title||s.title),fm.el);
  document.body.append(dlg);dlg.showModal();   /* 칸이 화면에 붙은 뒤 채운다 */
  if(o.fill)fm.fill(o.fill,[]);
  return dlg;
}
function save2(s){
  var res=form.collect();
  if(!res.ok){flash(res.fmt?res.fmt:'필수 항목 '+res.count+'곳이 비어 있습니다.',true);if(res.first)res.first.focus();return;}
  var blk=bulkBlock();if(blk){flash(blk,true);return;}
  var dupM=s.saveCheck?s.saveCheck(res.value):'';if(dupM){flash(dupM,true);return;}   /* v48 품번 + 흐름 겹침 */
  form.submit.disabled=true;
  var doc,np=[];
  /* v20 공정·공정흐름: 목록에 없는 공정을 먼저 erp_processes 에 대기로 쌓고(입력 작업자가 공정을 먼저 넣는다) 흐름을 쌓는다 */
  (s.flowCols?addNewProcs(res.value.rows,res.memos).then(function(a){np=a;}):Promise.resolve()).then(function(){
    return stepAdd(s,res.value).then(function(x){doc=x.doc;doc.id=doc.id||x.id;});
  }).then(function(){var fromBulk=bulk&&bulk.cur;if(fromBulk)dataPut(s.key,doc);bulkSaved();form.reset();
    var more=np.length?' 새 공정 '+np.length+'개('+np.map(function(x){return x.name;}).join(', ')+')도 공정으로 대기에 쌓였습니다.':'';
    flash((fromBulk?'저장했습니다. 일괄 업로드 목록에서 「저장됨」으로 바뀌었습니다.':'저장했습니다. 대기 상태로 쌓였습니다.')+more);})
   .catch(function(e){flash('저장하지 못했습니다. '+errText(e),true);})
   .then(function(){form.submit.disabled=false;});
}
/* v20: 흐름의 새 공정을 erp_processes 에 「대기」로 쌓는다. 같은 이름(오류 건 빼고)이 이미 있으면 안 쌓는다. 쌓은 것 = [{name,memo}] */
function addNewProcs(rows,memos){
  var todo=newProcsOf(rows,memos),P=BYKEY.processes;
  return todo.reduce(function(p,x){return p.then(function(){
    var d={name:x.name,memo:x.memo,inspect:false,status:'대기',agentNote:'',createdAt:new Date().toISOString(),route:routeOf(P)};
    return db.collection('erp_processes').add(d).then(function(){if(data.processes&&!data.processes.some(function(r){return r.name===d.name&&r.status!=='오류';}))data.processes.push(d);refreshLists();});   /* v53 스냅샷이 먼저 오면 같은 줄이 둘로 보였다 */

/* 공유 폴더 — 지정(저장)만 된다. 실제 드라이브 공유는 폼이 사장님 구글 드라이브 권한을 갖지 않아 못 한다(단추만 둠, 쓸지는 나중에 판단) */
function staffFolder(x){
  var f=x.folder||{},msg=h('p',{class:'msg','aria-live':'polite'});
  var url=h('input',{type:'url',value:f.url||'',placeholder:'https://drive.google.com/drive/folders/…'});
  var mail=h('input',{type:'email',value:f.email||'',placeholder:'구글 계정',autocomplete:'off'});
  var dlg=h('dialog',{class:'stepdlg','aria-label':'공유 폴더'});
  var save=h('button',{type:'button',class:'btn primary',on:{click:function(){
    var u=url.value.trim(),m=mail.value.trim();
    if(u&&!/^https:\/\/drive\.google\.com\/(drive\/(u\/\d+\/)?folders\/|open\?id=)[\w-]+/.test(u)){msg.textContent='드라이브 폴더 링크가 아닙니다.';msg.className='msg bad';return;}
    if(m&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){msg.textContent='구글 계정 꼴이 아닙니다.';msg.className='msg bad';return;}
    save.disabled=true;
    db.staffSet(x.uid,{folder:u||m?{url:u,email:m,at:new Date().toISOString(),state:'공유 전'}:null}).then(function(){dlg.close();},function(e){save.disabled=false;msg.textContent='저장하지 못했습니다. '+errText(e);msg.className='msg bad';});}}},'저장');
  var share=h('button',{type:'button',class:'btn',disabled:true},'공유하기');
  dlg.append(h('h3',{},'공유 폴더 · '+(x.name||x.vpId||'')),
    h('div',{class:'f'},h('label',{},'폴더 링크'),url),h('div',{class:'f'},h('label',{},'구글 계정'),mail),
    h('div',{class:'actions'},save,share,h('button',{type:'button',class:'btn',on:{click:function(){dlg.close();}}},'닫기')),
    h('p',{class:'msg bad'},'공유하기 불가: 폼에는 사장님 구글 드라이브 공유 권한이 없습니다(확인 못 함 · 차후 판단).'),msg);
  dlg.addEventListener('close',function(){dlg.remove();});
  document.body.append(dlg);dlg.showModal();
}

function go(k){if(BYKEY[k]&&BYKEY[k].shownIn)k=BYKEY[k].shownIn;if(k!==cur||k==='podocs')podSel='';cur=k;navOpen=NARROW()?'':null;try{history.replaceState(null,'','#'+k);}catch(e){location.hash=k;}renderNav();renderSum();renderStep();}
function refreshAll(){rateSyncAll();renderNav();renderSum();renderList();refreshLists();if(impDraw)impDraw();if(sheetDraw)sheetDraw();if(ifRefresh)ifRefresh();if(stkDraw)stkDraw();if(podDraw)podDraw();if(asmDraw)asmDraw();asmConvSync();asmBoxSync();podSync();podTokSync();podBoxSync();podShipInSync();podFlowSync();podModSync();}

/* ---------- boot ---------- */

var hash=location.hash.slice(1);if(BYKEY[hash])cur=BYKEY[hash].shownIn||hash;
var podHash=function(){var m=/^#podocs\/(.+)$/.exec(location.hash);if(!m)return false;try{podSel=decodeURIComponent(m[1]);}catch(e){podSel=m[1];}cur='podocs';return true;};   /* v126 발주서 문서 주소 = #podocs/발주번호 (QR) */
podHash();
window.addEventListener('hashchange',function(){if(podHash()){navOpen=null;renderNav();renderSum();renderStep();}});
dbP=connectDb();   /* v28: 발주 상품검색이 첫 화면부터 기다릴 수 있게 먼저 */
renderNav();renderSum();renderStep();refreshLists();

dbP.then(function(d){
  db=d;
  if(db){   /* v115 내 권한 → 화면, 담당자 목록(관리자·첫 관리자 지정) */
    db.staffSeen().catch(function(e){console.warn('담당자 기록 못 함',e);});
    db.staffMe(function(me){var was=ME?JSON.stringify([ME.admin,ME.perms]):null;ME=me||{};erpTop();
      if(was!==JSON.stringify([ME.admin,ME.perms])){erpFixCur();renderNav();renderSum();renderStep();}},function(e){console.warn('내 권한 못 읽음',e);ME={};erpTop();renderNav();renderStep();});
    db.staffAll(function(list){STAFF=list;renderNav();if(cur==='staff'&&staffDraw)staffDraw();else if(ME&&!canMenu(menuOf(cur),'r'))renderStep();},function(){STAFF=null;STAFF_ERR=true;});
  }
  if(!db){ME={admin:true};   /* 연결 못 함 — 예전처럼 화면은 보이고 저장은 안 됨 */
    renderNav();renderStep();
    bannerEl.append(h('div',{class:'banner'},'파이어베이스에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 열어 주세요. 지금은 입력해도 저장되지 않습니다.'));
    STEPS.forEach(function(s){data[s.key]=[];});data.asmpo=[];ASMBOX=[];PCONF={};IMPORTS=[];STOCKS=[];PODOCS=[];refreshAll();return;
  }
  STEPS.forEach(function(s){
    db.collection('erp_'+s.key).onSnapshot(function(snap){
      data[s.key]=snap.docs.map(function(x){return Object.assign({id:x.id},x.data());});
      refreshAll();
    },function(){data[s.key]=data[s.key]||[];refreshAll();});
  });
  /* v167 영림원 환율정보(기준정보 — T 거르기 없음) */
  db.collection('erp_rates').onSnapshot(function(snap){
    data.rates=snap.docs.map(function(x){return Object.assign({id:x.id},x.data());});refreshAll();
  },function(){data.rates=data.rates||[];refreshAll();});
  /* v23 불러오기 요청 */
  db.collection('erp_imports').onSnapshot(function(snap){
    IMPORTS=snap.docs.map(function(x){return Object.assign({id:x.id},x.data());});
    if(impDraw)impDraw();if(ifRefresh)ifRefresh();if(asmDraw)asmDraw();   /* v197 재고업데이트 · v98 엣지필름 바꾸기가 요청 상태를 보인다 */
  },function(){IMPORTS=IMPORTS||[];if(impDraw)impDraw();});
  /* v126 발주서관리 */
  db.collection('erp_podocs').onSnapshot(function(snap){
    PODOCS=snap.docs.map(function(x){return Object.assign({id:x.id},x.data());});refreshAll();
  },function(){PODOCS=PODOCS||[];refreshAll();});
  db.collection('erp_pobox').onSnapshot(function(snap){   /* v133 */
    POBOX=snap.docs.map(function(x){return Object.assign({id:x.id},x.data());});podBoxSync();podSync();   /* v153 공개 문서 inbox */if(podDraw)podDraw();
  },function(){POBOX=null;});
  [['erp_poship','POSHIP'],['erp_poin','POIN'],['erp_podlv','PODLV'],['erp_pointok','PTOK']].forEach(function(c){   /* v145 배송·입고 기록 */
    db.collection(c[0]).onSnapshot(function(snap){var a=snap.docs.map(function(x){return Object.assign({id:x.id},x.data());});
      if(c[1]==='POSHIP')POSHIP=a;else if(c[1]==='POIN')POIN=a;else if(c[1]==='PODLV')PODLV=a;else PTOK=a;podTokSync();podBoxSync();podShipInSync();podFlowSync();if(podDraw)podDraw();},function(){if(c[1]==='POSHIP'&&POSHIP==null){POSHIP=[];podBoxSync();}});   /* 못 읽어도 박스는 고침(배송 링크 없이) */
  });
  db.collection('erp_poconfirm').onSnapshot(function(snap){
    POCONF=snap.docs.map(function(x){return Object.assign({id:x.id},x.data());});renderNav();if(podDraw)podDraw();podBoxSync();   /* v143 확인되면 입고처 박스에 넣음(폼이 열려 있을 때 바로) */
  },function(){POCONF=null;});
  db.collection('erp_podocs_pub').onSnapshot(function(snap){   /* v128 */
    PODPUB=snap.docs.map(function(x){return Object.assign({id:x.id},x.data());});podSync();if(podDraw)podDraw();
  },function(){PODPUB=null;});
  /* v176 발주서(조립업체 발주 링크) */
  db.collection('erp_asmbox').onSnapshot(function(snap){ASMBOX=snap.docs.map(function(x){return Object.assign({id:x.id},x.data());});asmBoxSync();if(asmDraw)asmDraw();},function(){ASMBOX=null;});
  db.collection('erp_prodconfirm').onSnapshot(function(snap){var m={};snap.docs.forEach(function(x){m[x.id]=Object.assign({id:x.id},x.data());});PCONF=m;asmBoxSync();if(asmDraw)asmDraw();},function(){PCONF=PCONF||{};asmBoxSync();if(asmDraw)asmDraw();});   /* v195 납품확인 */
  db.collection('erp_asmpo').onSnapshot(function(snap){data.asmpo=snap.docs.map(function(x){return Object.assign({id:x.id},x.data());});asmConvSync();asmBoxSync();renderNav();if(asmDraw)asmDraw();},function(){data.asmpo=data.asmpo||[];renderNav();if(asmDraw)asmDraw();});
  /* v102 재고 조회 */
  db.collection('erp_stocks').onSnapshot(function(snap){
    STOCKS=snap.docs.map(function(x){return Object.assign({id:x.id},x.data());});renderNav();if(stkDraw)stkDraw();if(asmDraw)asmDraw();
  },function(){STOCKS=STOCKS||[];renderNav();if(stkDraw)stkDraw();if(asmDraw)asmDraw();});
});
})();
