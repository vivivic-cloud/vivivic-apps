<!DOCTYPE html>
<html lang="ko" data-layout="1">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>기계배치도</title>

<!-- 파이어베이스 — 배치만 담는다. 보링변환·에이엠티가 쓰는 그 자리, 그 방식이다.
     로그인 화면은 없다. 익명으로 들어가 배치만 읽고 쓴다.
     ⚠ 창고가 안 붙어도 프로그램은 그대로 돈다 — 옮기기와 저장(폰 안)은 창고와 상관없다. -->

      projectId: "vivivic-4b7ef",
      storageBucket: "vivivic-4b7ef.firebasestorage.app",

</script>
<style>
/* 색 토큰은 보링변환(--vg-*)에서 그대로 가져왔다. 새로 만든 색은 기계 판 하나뿐이다.
   이름은 전부 l- 로 시작한다 — 짧은 이름은 남의 규칙과 겹친다. */
:root{
  --vg-bg:#fff; --vg-ink:#111110; --vg-body:#1A1A19; --vg-soft:#6E6E6A;
  --vg-muted:#9C9C98; --vg-line:#EDEDEB; --vg-edge:#E2E2DF;
  --vg-fill:#F4F4F2; --vg-fill2:#EAEAE7; --vg-red:#FF3B30;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--vg-bg); color:var(--vg-body);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
/* ⚠ 100vh 를 쓰지 않는다 — 폰에서 그것은 보이는 높이가 아니다. 100dvh 를 쓰고,
   그것을 모르는 낡은 폰에는 자바스크립트가 재어서 넣는다.
   430px 고정 폭을 걷었다 — 그 폭에 막혀 넓은 화면에서도 바닥이 402px 였다. */
.lwrap{
  height:100dvh; display:flex; flex-direction:column;
  padding:0 env(safe-area-inset-right) calc(10px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
}
/* 바닥이 노는 자리 — 남은 세로를 다 받아 둔다. 바닥 크기는 자바스크립트가 넣는다 */
.lstage{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center;}

/* ── 보는 창 ────────────────────────────────────────────────────────
   사장님 말씀(10-07): 「스케치업처럼 축소 확대해서 전체 도는 일부를 볼 수 있게
   해주고 팬기능으로 잡고이동 하면서 볼 수 있게 해줘」.

   까닭이 있는 말씀이다 — 진짜 공장은 67.8m × 13.8m 다. 375px 폰에 통째로
   넣으면 재단기가 **19px** 이 되어 짚을 수가 없다(재어서 적는다). 그래서
   바닥을 이 창 **안쪽에서** 키우고, 창은 그대로 두고 바닥만 끌어 옮긴다.

   ⚠ 창에 overflow:auto(브라우저 굴림)를 쓰지 않았다. 두 손가락 벌리기와
      한 손가락 끌기를 내가 셈해야 하는데, 그 둘이 브라우저 굴림과 서로
      싸운다. touch-action:none 으로 다 받아서 내가 자리를 넣는다. */
.lview{
  position:relative; flex:1 1 auto; min-height:0; width:100%;
  overflow:hidden; touch-action:none;
  -webkit-user-select:none; user-select:none;
  cursor:grab;
}
.lview.끌림{cursor:grabbing;}

/* ── 확대판 ──────────────────────────────────────────────────────────
   ⚠ **바닥 위에 띄우지 않는다.** 처음에 지도처럼 창 오른쪽 가운데에 띄웠더니
      바닥의 **오른 변 손잡이를 꼭 덮었다** — 둘 다 「오른쪽 · 위아래 가운데」 라
      자리가 같다(375px 에서 x 325~369 로 겹쳤다. 10-07 에 시험이 잡아냈다).
      그래서 늘 자리를 차지하는 **크기 바의 오른쪽 끝**에 앉힌다. 바닥을 한
      점도 덮지 않고, 높이도 한 px 도 더 먹지 않는다.
   변을 끄는 동안에는 숨는다 — 그때 이 줄은 수를 보여 주는 일을 한다. */
.lzoom{flex:none; margin-left:auto; display:flex; gap:6px;}
.lbar2.켜짐 .lzoom{display:none;}
.lzb{width:44px; min-height:44px; padding:0; border:1px solid var(--vg-edge);
  border-radius:12px; background:rgba(255,255,255,.93); color:var(--vg-ink);
  font:inherit; font-size:20px; font-weight:700; line-height:1; cursor:pointer;
  box-shadow:0 1px 4px rgba(17,17,16,.12);
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;}
.lzb.글{font-size:12px; letter-spacing:-.4px;}
.lzb:active{transform:scale(.94);}
.lzb[disabled]{opacity:.38; cursor:default;}
/* 몇 배로 보고 있나 — 창 왼쪽 아래에 작게 */
.lmag{position:absolute; left:6px; bottom:4px; z-index:9800; font-size:11px;
  color:var(--vg-soft); background:rgba(255,255,255,.82); border-radius:6px;
  padding:1px 5px; pointer-events:none;}

/* 머리 — 한 줄이다 */
/* 줄바꿈을 열어 둔다 — 바닥 크기를 크게 넣으시면 그 글이 길어진다. 안 열어 두면
   크기 글이 눌려 「✎」 가 깎였다(10-06 에 재어서 잡았다). 넘치면 아랫줄로 간다. */
.lhead{display:flex; align-items:baseline; gap:9px; margin:0 0 12px; padding:14px 14px 0;
  flex-wrap:wrap;}
/* 이름은 한 줄로 둔다 — 두 손가락으로 벌려 320 까지 좁아지면 「기계배치 / 도」 로
   끊겨 보였다(10-05 에 그림을 보고 잡았다). 좁아지면 바닥 크기 쪽이 줄어든다. */
.lday{font-size:23px; line-height:1.06; letter-spacing:-.9px; font-weight:700; color:var(--vg-ink);
  white-space:nowrap; flex:none;}
.lrole{
  display:inline-flex; align-items:center; border:1px solid var(--vg-ink); border-radius:999px;
  padding:2px 8px; font-size:10px; font-weight:800; letter-spacing:1.1px; color:var(--vg-ink);
}
.lsub{margin-left:auto; font-size:12px; color:var(--vg-muted); min-width:0; text-align:right;}
/* 바닥 크기 — 눌러서 고치는 단추다. 글자 크기는 그대로 두고 닿는 자리만 넓힌다 */
.lsize{border:0; background:none; font:inherit; font-size:12px; color:var(--vg-muted);
  padding:0; cursor:pointer; position:relative; white-space:nowrap; flex:none;
  -webkit-tap-highlight-color:transparent;}
.lsize::after{content:''; position:absolute; inset:-15px -12px;}
.lsize .lpen{margin-left:4px; color:var(--vg-ink); font-weight:700;}

/* ── 바닥 크기 넣는 판 ─────────────────────────────────────────────
   사장님은 아이폰 엄지로 쓰신다. 칸도 단추도 44px 을 넘긴다.
   글자 16px 아래로 내리지 않는다 — 그 아래면 아이폰이 칸을 눌렀을 때 화면을 확대한다. */
.lsheet{position:fixed; inset:0; z-index:2147482000; background:rgba(17,17,16,.4);
  display:flex; align-items:flex-end;}
.lsheet[hidden]{display:none;}
.lcard{background:#fff; width:100%; border-radius:20px 20px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));}
.lch{font-size:16px; font-weight:700; color:var(--vg-ink); margin:0 0 12px;}
.lfield{display:flex; align-items:center; gap:10px; margin:0 0 10px;}
.lfield span{flex:none; width:86px; font-size:14px; color:var(--vg-soft);}
.lfield input{flex:1; min-width:0; min-height:48px; box-sizing:border-box;
  border:1px solid var(--vg-edge); border-radius:12px; padding:0 12px;
  font:inherit; font-size:16px; font-weight:700; color:var(--vg-ink); outline:none;}
.lfield input:focus{border-color:var(--vg-ink);}
.lcmsg{font-size:12px; color:var(--vg-soft); margin:2px 0 12px; min-height:16px;}
.lcmsg.나쁨{color:var(--vg-red); font-weight:700;}
.lcrow{display:flex; gap:8px;}
.lcbtn{flex:1; min-height:48px; border:1px solid var(--vg-edge); border-radius:12px;
  background:#fff; color:var(--vg-soft); font:inherit; font-size:15px; font-weight:700;
  cursor:pointer; -webkit-tap-highlight-color:transparent;}
.lcbtn.짙은{background:var(--vg-ink); color:#fff; border-color:var(--vg-ink);}
/* ── 속성 판 ─────────────────────────────────────────────────────────
   사장님 말씀(10-10): 「더블클릭 속성입력 창 기능 안 나타나」.
   그런 창이 없었다 — 바닥 크기 판 하나뿐이었다. 그래서 짓는다.
   네모를 **두 번 톡** 치면 이름·갈래·크기·자리·각을 한 판에서 넣는다.
   ⚠ 고르는 칸은 단추 줄로 둔다. 아이폰의 select 는 아래에서 바퀴가 올라와
      이 판을 가리고, 엄지로 돌리기가 사납다. 한 번 짚으면 끝나게 한다. */
.lpick{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px;}
.lpick button{flex:0 0 auto; min-height:44px; min-width:52px; padding:0 10px;
  border:1px solid var(--vg-edge); border-radius:12px; background:#fff;
  color:var(--vg-soft); font:inherit; font-size:14px; font-weight:700;
  cursor:pointer; -webkit-tap-highlight-color:transparent;}
.lpick button[aria-pressed="true"]{background:var(--vg-ink); color:#fff; border-color:var(--vg-ink);}
.lpick button[disabled]{opacity:.38; cursor:default;}
/* 글 칸 — 이름은 숫자가 아니라 글이다 */
.lfield input[type="text"]{font-weight:700;}
/* 판 이름줄에 지금 무엇을 고치는지 적는다 */
.lch .l작은{font-weight:400; font-size:13px; color:var(--vg-soft); margin-left:6px;}
/* 긴 판은 화면을 넘길 수 있다 — 굴러가게 둔다(폰 세로 480px 도 있다) */
.lcard.긴것{max-height:88dvh; overflow-y:auto;}

/* ── 기준 보드판 2,440×1,220 ───────────────────────────────────────
   기계가 아니다. 끌리지도 부딪히지도 않는다 — 바닥에 깔린 **자**다.
   그래서 손가락을 안 받고(pointer-events:none) 기계 위에 테만 얹는다. */
.lboard{position:absolute; border:2px dashed #FF3B30; border-radius:3px;
  pointer-events:none; z-index:9000; box-sizing:border-box;}
.lboard .lbnm{position:absolute; left:0; top:0; background:#FF3B30; color:#fff;
  font-size:9px; font-weight:700; line-height:1.2; padding:2px 4px;
  border-radius:3px 0 3px 0; white-space:nowrap;}

/* ── 공장 바닥 ───────────────────────────────────────────────────────
   가로·세로(mm)를 그대로 담는 판이다. 너비는 화면에 맞추고 높이는 바닥 비율대로
   자바스크립트가 재어 넣는다(aspect-ratio 를 안 쓴 까닭: 낡은 폰에서도 어긋나지 않게). */
.lfloor{
  /* 폭·높이는 자바스크립트가 넣는다. 가로로도 세로로도 들어가는 **가장 큰** 크기다.
     테두리를 안쪽 그림자로 둔 까닭: 진짜 테두리는 칸을 2px 먹어 10,000×8,000 비를 틀어 놓는다 */
  /* 보는 창 안에 **떠 있다** — 커져도 창의 높이를 밀지 않는다. 자리는 재기() 가 넣는다 */
  position:absolute; left:0; top:0; background:var(--vg-fill);
  box-shadow:inset 0 0 0 1px var(--vg-edge); border-radius:4px;
  /* 손잡이가 변 밖으로 나가 앉는다 — 자르면 못 잡으신다 */
  overflow:visible;
  /* 1m 눈금. 칸 크기는 자바스크립트가 넣는다 */
  background-image:
    linear-gradient(to right, rgba(17,17,16,.07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(17,17,16,.07) 1px, transparent 1px);
}
/* ── 기계 한 대 ──────────────────────────────────────────────────────
   자리와 크기는 바닥에 대한 % 다 — 화면이 넓어지거나 두 손가락으로 벌리셔도
   바닥과 같이 늘어난다. */
.lmc{
  position:absolute; background:var(--vg-ink); color:#fff;
  border-radius:3px; padding:2px 3px; overflow:visible;
  display:flex; flex-direction:column; justify-content:center;
  cursor:grab; transition:box-shadow .12s;
  /* ⚠ 이것이 있어야 끄는 동안 화면이 같이 안 밀린다. 바닥 바탕에는 안 걸어 두었다 —
     거기서는 평소처럼 화면을 굴릴 수 있어야 한다. */
  touch-action:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
/* 손가락이 닿는 자리를 사방 6px 넓힌다. 보이는 크기는 그대로 — 치수는 거짓이 되면 안 된다.
   얇은 기계(작업대 1200mm ≒ 42px)도 이것으로 44px 자를 넘긴다. */
.lmc::after{content:''; position:absolute; inset:-6px;}
/* 층(z-index)은 집을 때 자바스크립트가 넣는다 — 여기 두면 내려놓을 때 다시 깔린다 */
.lmc.잡힘{box-shadow:0 0 0 2px var(--vg-red); cursor:grabbing;}
/* ── 고른 기계 ──────────────────────────────────────────────────────
   기계가 스물이다. 손잡이를 다 내놓으면 60개가 서로 겹쳐 아무것도 못 짚는다
   (재단기가 맞춤에서 19px 인데 손잡이 하나가 28px 다). 그래서 **짚은 기계
   하나**에만 손잡이를 낸다 — 스케치업에서 고르는 것과 같은 버릇이다. */
.lmc.고름{box-shadow:0 0 0 2px var(--vg-red);}
/* ── 갈래 ───────────────────────────────────────────────────────────
   도면 벌에는 기계만 있는 것이 아니다 — 파레트 50, 기둥 50, 방 3, 문 2.
   다 까맣게 칠하면 도면이 먹판이 되어 아무것도 안 읽힌다. 갈래마다 달리 둔다.
   ⚠ 어느 네모가 무엇인지는 사장님이 하나씩 짚어 고쳐 주실 자리다. 지금 것은
      도면의 꼴과 자리로만 가른 것이다. */
.lmc.갈-파{background:#fff; color:var(--vg-ink); box-shadow:inset 0 0 0 1.5px #c9752b;}
.lmc.갈-둥{background:#9a9a96; color:#fff;}
.lmc.갈-방{background:transparent; color:var(--vg-ink);
  box-shadow:inset 0 0 0 1.5px var(--vg-ink);}
.lmc.갈-문{background:var(--vg-red); color:#fff;}
.lmc.갈-밖{background:#fff; color:var(--vg-ink);
  box-shadow:inset 0 0 0 1.5px var(--vg-ink);}
.lmc.갈-몰{background:#fff; color:var(--vg-soft); box-shadow:inset 0 0 0 1.5px #b9b9b4;}
/* ⚠ 10-07 에 갈래 코드를 ? → 몰 로 바꿨는데 **이 줄만 안 따라왔다**(.갈-\? 그대로).
   그래서 아직 모르는 네모가 갈래 빛을 못 받고 까맣게 칠해져 있었다. 10-10 에 잡았다. */
/* 도면에 둥글게 그려진 것 — 기둥이나 배관으로 보인다. 둥근 꼴 그대로 보인다 */
.lmc.갈-원{background:#efe6fa; color:var(--vg-ink); box-shadow:inset 0 0 0 1.5px #8d6bbd;
  border-radius:50%;}
.lmc.갈-원.모남{border-radius:50%;}
/* 고른 것은 갈래가 무엇이든 붉은 테가 이긴다 */
.lmc.고름{box-shadow:0 0 0 2px var(--vg-red) !important;}
/* 여럿 고를 때 — 센 것 하나와 함께 고른 것들 */
.lmc.여럿{box-shadow:0 0 0 2px var(--vg-red) !important;}
.lmc.여럿::before{content:''; position:absolute; inset:0; background:rgba(255,59,48,.16);
  pointer-events:none; border-radius:3px;}

/* ── 자로 재기 ───────────────────────────────────────────────────────
   사장님 말씀(10-10): 「배치도면 안에서 치수를 잴 수 있게 해줘」.
   두 점을 잡아 끌면 그 사이가 몇 m 인지 나온다. 기계 모서리·벽에 **붙는다** —
   안 붙으면 「기계와 벽 사이 몇 m」 를 손가락으로는 영영 못 맞춘다.
   ⚠ 금은 SVG 로 긋는다. 바닥은 가로세로가 따로 늘어나므로(폭·높이를 각각
      넣는다) 네모를 돌려 쓰면 금 굵기까지 찌그러진다. SVG 에 %로 넣으면
      굵기는 px 그대로 남는다. */
.ljaa{position:absolute; inset:0; width:100%; height:100%; z-index:9600;
  pointer-events:none; overflow:visible;}
.ljaa line.몸{stroke:var(--vg-red); stroke-width:2;}
.ljaa line.결{stroke:var(--vg-red); stroke-width:1; stroke-dasharray:3 3; opacity:.5;}
.ljaa circle{fill:#fff; stroke:var(--vg-red); stroke-width:2;}
/* 잰 수 — 금 한가운데에 붙인다. 손가락에 안 가리게 조금 위로 */
.ljab{position:absolute; z-index:9700; transform:translate(-50%,-50%);
  background:var(--vg-red); color:#fff; font-size:11px; font-weight:700;
  padding:2px 6px; border-radius:9px; white-space:nowrap; pointer-events:none;
  box-shadow:0 1px 3px rgba(17,17,16,.3);}
/* 재는 동안에는 바닥이 안 끌린다 — 손가락은 자를 잡고 있다 */
.lview.재는중{cursor:crosshair;}
.lview.재는중 .lmc{cursor:crosshair;}
.lturn[aria-pressed="true"].ljab단{background:var(--vg-red); border-color:var(--vg-red);}

/* 홀 벽선 — 객체가 아니라 **그어 둔 금**이다. 기계실·엣지집진기가 홀 밖에
   그려져 있어, 홀이 어디까지인지 보이지 않으면 도면을 읽을 수가 없다. */
.lhall{position:absolute; pointer-events:none; z-index:1;
  box-shadow:inset 0 0 0 1.5px rgba(17,17,16,.55); border-radius:2px;}
/* 바라보는 쪽 — 돌린 것이 눈에 보여야 한다. 네모난 기계는 크기가 안 바뀌니
   이 금이 없으면 돌렸는지 알 수가 없다.
   ⚠ **고른 기계에만** 띄운다. 스무 대에 다 띄웠더니 도면이 통째로 빨개지고,
      엣지밴더(7,000×600)처럼 납작한 기계에서는 이 금이 **이름을 가로질러**
      이름을 못 읽게 했다(10-07 에 그림을 눈으로 보고 잡았다. 자로는 안 걸린다). */
.lmc .lfr{display:none; position:absolute; background:var(--vg-red); border-radius:1px;}
.lmc.고름 .lfr{display:block;}
.lmc .lnm{font-size:10px; font-weight:700; line-height:1.15; letter-spacing:-.3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.lmc .lsz{font-size:9px; line-height:1.15; color:rgba(255,255,255,.62);
  white-space:nowrap; overflow:hidden;}
/* 낮은 기계는 크기 줄을 숨긴다 — 글자가 판을 넘어가면 아무것도 안 읽힌다 */
.lmc.납작 .lsz{display:none}
.lmc.아주납작 .lnm{font-size:9px}
/* 글줄보다 얇은 기계는 **패딩을 걷어** 한 줄이라도 더 들어가게 한다 */
.lmc.아주납작{padding:0 2px;}
/* ⚠ 그래도 안 들어가면 이름을 **뗀다.** 엣지밴더(7,000×600)는 2.6배에서 7px 인데
   글줄은 10px 이라, 글자의 아래 반이 판 밖으로 나가 **흰 바탕 위 흰 글씨**가 됐다
   — 반 잘린 이름은 없는 것만 못하다(10-07 에 그림을 눈으로 보고 잡았다).
   크게 보시면 다시 뜬다. 기계 자체는 그대로 짚고 끌 수 있다. */
.lmc.이름숨김 .lnm{display:none}
/* ⚠ 작은 네모는 **모나게** 둔다. 둥글기 3px 이 6px 짜리 파레트를 동그란 알약으로
   만들어, 도면에서는 네모인 것이 화면에서는 콩알로 보였다(10-07 에 그림을 눈으로
   보고 잡았다). 도면을 도면답게 보여야 사장님이 읽으신다. */
.lmc.모남{border-radius:0; padding:0;}
/* ── 합친 덩이 ───────────────────────────────────────────────────────
   사장님 말씀(10-07 07:53): 「객체 합치기 시 **각 객체모양 유지하며** 합쳐져야
   합니다」. 그래서 덩이는 **칠하지 않는다** — 품은 조각이 그대로 보여야 한다.
   덩이가 하는 일은 「이 조각들은 한 덩이다」 를 점선으로 알리는 것뿐이다.
   ⚠ pointer-events:none — 테가 손가락을 가로채면 그 안의 다른 네모를 못 짚는다.
      짚히는 것은 **조각**이고, 조각을 짚으면 덩이가 골라진다. */
.lgrp{position:absolute; pointer-events:none; z-index:2; border-radius:3px;
  box-shadow:inset 0 0 0 1.5px rgba(17,17,16,.30);}
.lgrp.고름, .lgrp.여럿{box-shadow:inset 0 0 0 2px var(--vg-red);}
.lgrp::before{content:''; position:absolute; inset:-3px; border:1.5px dashed rgba(17,17,16,.34);
  border-radius:5px;}
.lgrp.고름::before, .lgrp.여럿::before{border-color:var(--vg-red);}
/* ── 덩이에 든 조각 ─────────────────────────────────────────────────
   ⚠ 조각에는 **붉은 테도 앞금도 안 입힌다.** 고른 것은 조각이 아니라 덩이이고,
      조각마다 붉은 테를 두르면 점선 테와 겹쳐 도면이 어수선해진다 — 파레트가
      제 빛(주황 테)을 잃으면 그것도 「모양 유지」 가 아니다(10-07 에 그림을
      눈으로 보고 잡았다). 고른 표시는 **옅게 깔아** 주는 것으로 끝낸다. */
.lmc.조각{z-index:3;}
.lmc.조각 .lfr{display:none;}
.lmc.조각.덩이고름::after{content:''; position:absolute; inset:0; background:rgba(255,59,48,.15);
  pointer-events:none; border-radius:inherit;}

/* ── 변을 잡는 손잡이 ──────────────────────────────────────────────
   사장님 말씀(10-07): 「가로세로 변을 잡아 늘리고 늘리는 동작중 정확한 수치
   입력등으로 조절되게 해줘 공장바닥도 마찬가지야」.

   ⚠ **몸통 안을 잘라 쓰지 않는다.** 작업대가 90×45px 라 안에서 14px 를 떼면
      옮기는 자리가 31px 로 줄어 44px 자에 걸린다. 그래서 손잡이를 **변 밖에**
      붙인다 — 안쪽 4px · 바깥쪽 24px. 몸통 전체는 그대로 옮기는 자리다.
   보이는 것은 가늘게(3×20px), 닿는 자리는 28×44px. */
.lhd{position:absolute; z-index:9500; touch-action:none; cursor:grab;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;}
.lhd i{position:absolute; display:block; background:var(--vg-red); border-radius:2px;}
.lhd.잡힘 i{background:var(--vg-ink); box-shadow:0 0 0 2px rgba(255,59,48,.35);}
/* ⚠ 손잡이를 **변 밖으로 온전히** 뺀다(−28px). 전에는 4px 을 몸통 안으로
   물려 두었는데, 그러면 **몸통보다 큰 손잡이가 몸통 한가운데를 덮는다.**
   스키퍼 1(2,000×800mm)은 2.6배에서 25×10px 인데 손잡이는 28×44px 이라,
   가운데를 짚으면 몸통이 아니라 손잡이가 잡혀 **끌어 옮기면 기계가 0.1m 로
   쪼그라들었다**(10-07 에 그림을 눈으로 보고 잡았다 — 자로는 안 걸렸다).
   작은 기계일수록 옮길 일이 많다. 몸통이 먼저다. */
.lhd-오른{width:28px; height:44px; right:-28px; top:50%; margin-top:-22px;}
.lhd-오른 i{width:3px; height:20px; left:3px; top:12px;}
.lhd-왼{width:28px; height:44px; left:-28px; top:50%; margin-top:-22px;}
.lhd-왼 i{width:3px; height:20px; right:3px; top:12px;}
.lhd-아래{width:44px; height:28px; bottom:-28px; left:50%; margin-left:-22px;}
.lhd-아래 i{width:20px; height:3px; left:12px; top:3px;}
/* 바닥 손잡이 — 같은 꼴이되 조금 길게 (공장 벽이라 눈에 먼저 들어와야 한다) */
.lhd.바닥손잡이 i{background:var(--vg-ink);}
.lhd.바닥손잡이.lhd-오른 i, .lhd.바닥손잡이.lhd-왼 i{height:34px; top:5px;}
.lhd.바닥손잡이.lhd-아래 i{width:34px; left:5px;}

/* ── 크기 바 ───────────────────────────────────────────────────────
   ⚠ **바닥 위**에 둔다. 아래에 두면 아래 변을 끄실 때 손가락이 수를 덮어
      「동작중 수치가 보인다」 가 깨진다(관리자가 짚은 자리).
   ⚠ 늘 자리를 차지한다 — 끌 때만 나타나면 그 순간 바닥 높이가 바뀌어
      끌던 것이 어긋난다. 평소엔 안내말을 띄워 둔다. */
.lbar2{width:100%; padding:0 14px; margin:0 0 8px; min-height:52px;
  display:flex; align-items:center; gap:8px;}
.lbar2 .l2hint{font-size:12px; color:var(--vg-muted); min-width:0; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap;}
.lbar2 .l2나{display:none; align-items:center; gap:8px; width:100%;}
.lbar2.켜짐 .l2hint{display:none;}
.lbar2.켜짐 .l2나{display:flex;}
.l2누구{font-size:13px; font-weight:700; color:var(--vg-ink); white-space:nowrap;
  max-width:33%; overflow:hidden; text-overflow:ellipsis;}
.l2축{font-size:13px; color:var(--vg-soft); flex:none;}
.l2칸{flex:1; min-width:0; min-height:48px; box-sizing:border-box; border:1px solid var(--vg-edge);
  border-radius:12px; padding:0 10px; font:inherit; font-size:16px; font-weight:700;
  color:var(--vg-ink); outline:none; text-align:right;}
.l2칸:focus{border-color:var(--vg-ink);}
.l2단{flex:none; min-height:48px; min-width:52px; padding:0 12px; border:1px solid var(--vg-ink);
  border-radius:12px; background:var(--vg-ink); color:#fff; font:inherit; font-size:14px;
  font-weight:700; cursor:pointer; -webkit-tap-highlight-color:transparent;}

/* 발 — 지금 무슨 일이 됐는지 **한 줄**.
   ⚠ 두 줄이 되면 안 된다. 「저장했습니다」 가 뜨는 순간 발이 19 → 35px 로 커지고,
      보는 창이 그만큼 줄어드는데 바닥은 이미 큰 창에 맞춰 잰 뒤라 **바닥 아래
      손잡이가 창에 잘렸다**(돌려서 볼 때 아래 손잡이를 못 잡았다. 10-07 에
      시험이 잡아냈다). 그래서 쪽지는 넘치면 …로 줄이고 발은 한 줄로 못박는다. */
.lfoot{display:flex; align-items:baseline; gap:8px; margin:10px 0 0; min-height:19px;
  width:100%; padding:0 14px; flex-wrap:nowrap; overflow:hidden;}
/* 돌리기 단추 — 제 줄에 둔다. 알림줄에 끼우면 쪽지가 길어질 때 단추가 밀려
   한 줄이 두 줄이 되고, 그러면 끄는 도중에 바닥 높이가 흔들린다. */
.lbar{width:100%; padding:8px 14px 0; display:flex; justify-content:flex-end; gap:8px;}
.lturn{
  min-height:44px; min-width:44px; padding:0 16px; flex:none;
  border:1px solid var(--vg-edge); border-radius:12px; background:#fff; color:var(--vg-ink);
  font:inherit; font-size:14px; font-weight:700; white-space:nowrap; cursor:pointer;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
}
.lturn:active{transform:scale(.97);}
/* 물건 줄 단추 — 넷이 320px 에도 들어가야 한다. 글은 남기고 여백만 줄인다 */
.lsm{padding:0 12px; font-size:13px;}
.lturn[disabled]{opacity:.38; cursor:default;}
/* 물건 줄은 **늘 자리를 차지한다.** 고른 것이 있을 때만 뜨게 하면 그 순간
   보는 창 높이가 바뀌어 끌던 자리가 어긋난다(크기 바와 같은 까닭). */
.lbar-물건{justify-content:flex-start;}
/* 벌 고르기 — 「도면 그대로 ▸」 처럼 보인다. 누르면 다른 벌로 간다.
   ⚠ 머리줄에 뒀더니 머리가 두 줄이 되어 보는 창이 30px 줄었다. 아랫줄로 내렸다. */
.lsheet-btn{margin-right:auto; background:var(--vg-ink); color:#fff; border-color:var(--vg-ink);}
.lturn[aria-pressed="true"]{background:var(--vg-ink); color:#fff; border-color:var(--vg-ink);}
.lnote{font-size:12px; color:var(--vg-soft); min-width:0; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap;}
.lsave{margin-left:auto; font-size:11px; color:var(--vg-muted);
  flex:none; white-space:nowrap;}
</style>
</head>
<body>

<div class="lwrap">
  <header class="lhead" data-area="머리">
    <span class="lday">기계배치도</span>
    <span class="lrole">V0.1</span>
    <button class="lsub lsize" id="l-floor-size" type="button"
            data-area="바닥크기">—<span class="lpen">✎</span></button>
  </header>

  <div class="lstage" id="l-stage">
    <!-- 크기 바 — 변을 잡으면 여기에 수가 산다. 바닥 위라 손가락에 안 가린다 -->
    <div class="lbar2" id="l-bar2" data-area="크기바">
      <span class="l2hint">붉은 손잡이로 크기 조절</span>
      <span class="l2나">
        <span class="l2누구" id="l-b2who">—</span>
        <span class="l2축" id="l-b2ax">가로</span>
        <input class="l2칸" id="l-b2val" type="number" inputmode="decimal" step="0.01">
        <span class="l2축">m</span>
        <button class="l2단" id="l-b2ok" type="button">맞춤</button>
      </span>
      <!-- 확대판 — 바닥을 덮지 않는 자리다(까닭은 .lzoom 에 적어 두었다) -->
      <span class="lzoom" data-area="확대판">
        <button class="lzb" id="l-zout" type="button" data-area="축소" aria-label="작게 보기">−</button>
        <button class="lzb" id="l-zin"  type="button" data-area="확대" aria-label="크게 보기">＋</button>
        <button class="lzb 글" id="l-zall" type="button" data-area="전체보기">전체</button>
      </span>
    </div>

    <!-- 보는 창 — 바닥은 이 안에서만 움직인다. 잡고 끌면 바닥이 따라온다 -->
    <div class="lview" id="l-view" data-area="보는창">
      <!-- ⚠ data-area 는 사장님이 어디를 짚으셨는지 손잡이가 알아보게 달아 둔 것이다 -->
      <div class="lfloor" id="l-floor" data-area="바닥"></div>
      <span class="lmag" id="l-mag" data-area="배율"></span>
    </div>

    <div class="lfoot" data-area="알림">
      <span class="lnote" id="l-note" data-area="안내">빈 바닥을 끌면 이동, 두 손가락을 벌리면 확대</span>
      <span class="lsave" id="l-save" data-area="저장알림"></span>
    </div>

    <div class="lbar lbar-물건" data-area="물건줄">
      <button class="lturn lsm" id="l-many" type="button" aria-pressed="false"
              data-area="여럿고르기단추">여럿</button>
      <button class="lturn lsm" id="l-mturn" type="button"
              data-area="기계돌리기단추" disabled>돌리기</button>
      <button class="lturn lsm" id="l-join" type="button"
              data-area="합치기단추" disabled>합치기</button>
      <button class="lturn lsm" id="l-split" type="button"
              data-area="나누기단추" disabled>나누기</button>
    </div>
    <div class="lbar" data-area="보는줄">
      <button class="lturn lsheet-btn" id="l-sheet" type="button" data-area="벌고르기">—</button>
      <button class="lturn lsm ljab단" id="l-ruler" type="button" aria-pressed="false"
              data-area="자로재기">📐 재기</button>
      <button class="lturn" id="l-turn" type="button" aria-pressed="false"
              data-area="돌리기단추">⟲ 세로로</button>
    </div>
  </div>

  <!-- 바닥 크기를 넣는 판. 머리의 크기를 누르면 뜬다 -->
  <div class="lsheet" id="l-size-sheet" hidden data-area="바닥크기판">
    <div class="lcard">
      <div class="lch">공장 바닥 크기</div>
      <label class="lfield"><span>가로 (m)</span>
        <input id="l-w" type="number" inputmode="decimal" step="0.01" min="1" max="200"></label>
      <label class="lfield"><span>세로 (m)</span>
        <input id="l-h" type="number" inputmode="decimal" step="0.01" min="1" max="200"></label>
      <div class="lcmsg" id="l-size-msg">기계가 놓인 자리는 그대로 둡니다</div>
      <div class="lcrow">
        <button class="lcbtn" id="l-size-no" type="button">그만</button>
        <button class="lcbtn 짙은" id="l-size-ok" type="button">넣기</button>
      </div>
    </div>
  </div>

  <!-- 속성 판 — 네모를 두 번 톡 치면 뜬다 (사장님 말씀 10-10) -->
  <div class="lsheet" id="l-prop-sheet" hidden data-area="속성판">
    <div class="lcard 긴것">
      <div class="lch">속성<span class="l작은" id="l-prop-who">—</span></div>
      <label class="lfield"><span>이름</span>
        <input id="l-p-name" type="text" maxlength="40" placeholder="예: 재단기"></label>
      <div class="lpick" id="l-p-kind" data-area="갈래고르기"></div>
      <label class="lfield"><span>가로 (m)</span>
        <input id="l-p-w" type="number" inputmode="decimal" step="0.01" min="0.1"></label>
      <label class="lfield"><span>세로 (m)</span>
        <input id="l-p-h" type="number" inputmode="decimal" step="0.01" min="0.1"></label>
      <label class="lfield"><span>왼쪽벽 (m)</span>
        <input id="l-p-x" type="number" inputmode="decimal" step="0.01" min="0"></label>
      <label class="lfield"><span>위벽 (m)</span>
        <input id="l-p-y" type="number" inputmode="decimal" step="0.01" min="0"></label>
      <div class="lpick" id="l-p-ang" data-area="각고르기"></div>
      <div class="lcmsg" id="l-prop-msg"></div>
      <div class="lcrow">
        <button class="lcbtn" id="l-prop-no" type="button">그만</button>
        <button class="lcbtn 짙은" id="l-prop-ok" type="button">넣기</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   기계배치도 v0.1
   하는 일 넷

    let 벌 = 벌목록[0];

    /* 돌려서 보나 — 참이면 10,000 쪽이 세로로 선다.

    let 돌림 = false;
    let 잰때 = 0;                         // 이 배치가 바뀐 때(ms). 창고와 견줄 때 쓴다

    /* ── 보는 자리 ─────────────────────────────────────────────────────
       사장님 말씀(10-07): 「스케치업처럼 축소 확대해서 전체 도는 일부를 볼 수 있게

    let 맞춤배율 = 0;
    let 확대 = 1;
    let 팬x = 0, 팬y = 0;
    const 확대최대 = 24;
    /* 고른 것들. 손잡이는 **하나만 골랐을 때** 그 하나에만 난다 — 까닭은
       .lmc.고름 에 적어 두었다. 여럿 고르면 합치기/나누기만 된다. */
    let 고른들 = [];
    let 여럿모드 = false;

    const $ = id => document.getElementById(id);

    /* ── 기계를 돌리는 셈 ──────────────────────────────────────────────
       사장님 말씀(10-07): 「각 기기별 객체화 해서 회전 이동 등이 가능해야해」.

       기계마다 **각**(0·90·180·270)을 지닌다. 각은 가로·세로 값을 바꾸지 않는다 —
       재단기는 돌려도 4,000×4,000 이다. 바뀌는 것은 **바닥에서 차지하는 자리**다.
       그래서 자리·부딪힘·벽 막기는 모두 아래 폭()·높() 으로만 셈한다.

       ⚠ m.가로 · m.세로 를 자리 셈에 바로 쓰면 돌린 기계가 벽을 뚫는다. */
    const 각의 = m => ((m && +m['각']) | 0) % 360;
    const 폭 = m => (각의(m) % 180) ? m['세로'] : m['가로'];   // 바닥 가로(x) 쪽으로 차지하는 mm
    const 높 = m => (각의(m) % 180) ? m['가로'] : m['세로'];   // 바닥 세로(y) 쪽으로 차지하는 mm
    /* 그 축(가로/세로)을 키우면 모델의 어느 쪽으로 자라나.
       돌리지 않았으면 가로는 x 쪽, 90° 돌렸으면 가로는 y 쪽으로 자란다. */
    const 자라는쪽 = (것, 축) => ((축 === '가로') === (각의(것) % 180 === 0)) ? 'x+' : 'y+';
    /* ── 덩이가 품은 조각이 지금 어디에 앉아 있나 ──────────────────────
       사장님 말씀(10-07 07:53): 「객체 합치기 시 **각 객체모양 유지하며** 합쳐져야
       합니다」. 앞서 지은 합치기는 고른 것들을 **꼭 감싸는 한 네모**로 바꿨다 —
       파레트 넉 장이 큰 네모 한 장이 되어 도면이 뭉개졌다. 사장님이 물리셨다.

       그래서 덩이는 **제 모양을 삼키지 않는다.** 조각 하나하나의 자리·크기·각·
       갈래·이름을 그대로 품고, 함께 움직이고 함께 돈다.

       조각은 덩이의 **안 돌린 테**(m.가로 × m.세로)를 바탕으로 담아 둔다. 덩이를
       돌리면 그 각으로 조각 자리를 다시 셈해 돌려준다 — 담긴 값은 안 건드리므로
       네 번 돌리면 한 톨도 안 틀리고 제자리다.
       돌려주는 자리는 **덩이의 왼위 모서리 기준** mm 다. */
    function 조각자리(m) {
        const cs = m && m['조각'];
        if (!cs || !cs.length) return null;
        const W = m.가로, H = m.세로, 각 = 각의(m);
        return cs.map(c => {
            const cw = (각의(c) % 180) ? c.세로 : c.가로;   // 조각 제 각까지 먹인 꼴
            const ch = (각의(c) % 180) ? c.가로 : c.세로;
            let x, y, w, h;
            if (각 === 90)       { x = H - c.y - ch; y = c.x;          w = ch; h = cw; }
            else if (각 === 180) { x = W - c.x - cw; y = H - c.y - ch; w = cw; h = ch; }
            else if (각 === 270) { x = c.y;          y = W - c.x - cw; w = ch; h = cw; }
            else                 { x = c.x;          y = c.y;          w = cw; h = ch; }
            return { x, y, w, h, 이름: c.이름, 갈래: c['갈래'] || '기',
                     가로: c.가로, 세로: c.세로, 각: (각의(c) + 각) % 360 };
        });
    }

       덩이의 테로 세면 조각 사이 빈 자리까지 「차지한 것」 이 되어, 파레트 넉 장을
       합친 덩이가 제 옆을 못 지나간다. */
    function 칸들(m, x, y) {
        const 조 = 조각자리(m);
        if (!조) return [{ x, y, w: 폭(m), h: 높(m) }];
        return 조.map(c => ({ x: x + c.x, y: y + c.y, w: c.w, h: c.h }));
    }

    /* 기계가 바라보는 쪽(각 0 이면 아래쪽). 돌린 것이 눈에 보이게 금 하나를 긋는다 */
    const 앞쪽 = m => ['y+', 'x+', 'y-', 'x-'][각의(m) / 90 | 0];
    /* 모델의 쪽 → 화면의 변. 바닥 돌리기(돌림)까지 함께 셈한 뒤 돌려준다 */
    const 화면쪽 = 쪽 => 쪽 === 'x+' ? (돌림 ? '아래' : '오른')
                      : 쪽 === 'x-' ? (돌림 ? '위'   : '왼')
                      : 쪽 === 'y+' ? (돌림 ? '왼'   : '아래')

    const 보이는세로 = () => 돌림 ? 바닥.가로 : 바닥.세로;
    const 바닥판 = $('l-floor');
    const 뷰 = $('l-view');
    const 무대 = $('l-stage');
    const 감싼것 = document.querySelector('.lwrap');
    const 발 = document.querySelector('.lfoot');
    const 쪽지 = $('l-note');
    const 저장쪽지 = $('l-save');
    const 수 = n => Number(n).toLocaleString('en-US');
    /* ── 미터로 보여 주고 미터로 받는다 ────────────────────────────────

    const 미터 = mm => (Math.round(mm / 눈금) * 눈금 / 1000)
                        .toLocaleString('en-US', { maximumFractionDigits: 2 });
    const 미터칸값 = mm => String(Math.round(mm / 눈금) * 눈금 / 1000);
    const 미터읽기 = 글 => {
        const v = Number(String(글).trim());
        if (!String(글).trim() || !Number.isFinite(v)) return NaN;
        return Math.round(v * 1000 / 눈금) * 눈금;
    };

    /* ── 읽기 ──────────────────────────────────────────────────────── */
    const 갈래코드 = ['기', '파', '둥', '방', '문', '밖', '몰', '원'];
    /* 합친 것 속의 조각 하나. 깨졌으면 null 로 버린다 — 조각 하나가 깨졌다고
       합친 것을 통째로 버리면 사장님 배치가 날아간다. */
    const 조각씻기 = c => (c && typeof c['이름'] === 'string' && c['가로'] > 0 && c['세로'] > 0
                           && Number.isFinite(+c.x) && Number.isFinite(+c.y))
        ? { id: String(c.id || ''), 이름: String(c['이름']), 가로: +c['가로'], 세로: +c['세로'],
            x: +c.x, y: +c.y, 각: (+c['각'] | 0) % 360,
            갈래: 갈래코드.includes(c['갈래']) ? c['갈래'] : '기' }
        : null;
    function 받기(것) {
        if (!것 || typeof 것 !== 'object') return false;
        const b = 것['바닥'], ms = 것['기계들'];
        if (!b || !(b['가로'] > 0) || !(b['세로'] > 0)) return false;
        if (!Array.isArray(ms) || !ms.length) return false;
        /* 이름이 빈 네모가 있다 — 도면 벌에는 이름 없는 네모가 열일곱이다.

        const 성한것 = ms.filter(m => m && m.id && typeof m['이름'] === 'string'
            && m['가로'] > 0 && m['세로'] > 0
            && Number.isFinite(+m.x) && Number.isFinite(+m.y));
        if (성한것.length !== ms.length) return false;      // 하나라도 깨졌으면 통째로 안 받는다
        바닥 = { 가로: +b['가로'], 세로: +b['세로'] };
        기계들 = 성한것.map(m => ({
            id: String(m.id), 이름: String(m['이름']),

            // 각은 0·90·180·270 만 받는다. 깨진 값은 0 으로 — 그려지기는 해야 한다
            각: [0, 90, 180, 270].includes(((+m['각']) | 0) % 360) ? ((+m['각']) | 0) % 360 : 0,

            // 합친 것이면 조각을 품고 있다 — 그래야 다시 나눌 수 있다
            조각: Array.isArray(m['조각']) ? m['조각'].map(조각씻기).filter(Boolean) : null,

    function 폰에서읽기() {

    }

    /* ── 쓰기 ──────────────────────────────────────────────────────── */
    const 담을것 = () => ({ 바닥, 기계들, 잰때, 돌림 });
    function 폰에담기() {
        try { localStorage.setItem(폰열쇠(), JSON.stringify(담을것())); return true; }
        catch (e) { return false; }

            try {

            } catch (e) { /* 창고가 안 되어도 ③ 은 폰 안으로 이미 됐다 */ }

    function 저장(알릴까) {

        창고에담기();
        if (알릴까) {

            clearTimeout(저장시계);
            저장시계 = setTimeout(() => { 저장쪽지.textContent = ''; }, 1600);
        }

    }

        const F = window.fbFirestore, db = window.db;
        if (!F || !db) return;
        try {
            const s = await F.getDoc(F.doc(db, 'artifacts', 'vivivic-4b7ef', 'public', 'data', 창고칸, 창고문서()));
            if (!s.exists()) { 창고에담기(); return; }     // 창고가 비었으면 지금 것을 올려 둔다
            const 것 = s.data();
            if (!(+것['잰때'] > 잰때)) return;
            if (받기(것)) { 단추고치기(); 재기(); 그리기(); 쪽지.textContent = '다른 데서 옮긴 것을 받았습니다'; 폰에담기(); }
        } catch (e) { /* 못 읽어도 폰 안의 것으로 돈다 */ }
    };

    /* ── 재기 ──────────────────────────────────────────────────────────
       **맞춤배율** — 공장 전체가 보는 창에 가로로도 세로로도 들어가는 가장 큰 배율.
       가로세로 비는 그대로 지킨다(공장이 찌그러지면 안 된다). 둘 중 작은 쪽을 쓴다.
       **배율** = 맞춤배율 × 확대. 확대가 1 이면 전체, 키우면 일부만 크게 본다.

       ⚠ 바닥의 높이를 더는 재지 않는다. 바닥이 보는 창 **안에** 떠 있으므로
          (position:absolute) 바닥을 키워도 창 높이가 흔들리지 않는다. 전에는
          바닥이 줄의 하나였던 탓에, 끄는 도중에 바닥이 커지면 아래 단추줄이
          밀려 끌던 자리가 어긋났다. 이 틀에서는 그 일이 아예 안 난다. */
    function 재기() {
        // 100dvh 를 모르는 낡은 폰에만 자바스크립트가 보이는 높이를 넣어 준다
        if (!(window.CSS && CSS.supports && CSS.supports('height', '100dvh'))) {
            const 보임 = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
            감싼것.style.height = 보임 + 'px';
        }
        const 보기폭 = 뷰.clientWidth, 보기높 = 뷰.clientHeight;
        if (!(보기폭 > 0) || !(보기높 > 0)) return;
        /* 손잡이가 변 밖으로 28px 나가 앉는다. 네 변 모두 비워 둔다 —
           전에는 먼 쪽 둘만 비웠는데, 이제는 바닥을 끌어 옮기니 **가까운 쪽
           변도 창 가운데로 올 수 있다.** 그때 손잡이가 창에 잘리면 못 잡으신다. */
        맞춤배율 = Math.min((보기폭 - 여백 * 2) / 보이는가로(),
                            (보기높 - 여백 * 2) / 보이는세로());
        if (!(맞춤배율 > 0)) return;
        확대 = Math.max(1, Math.min(확대최대, 확대));
        배율 = 맞춤배율 * 확대;                                   // px / mm
        const 바닥폭 = 보이는가로() * 배율, 바닥높 = 보이는세로() * 배율;
        바닥판.style.width  = 바닥폭 + 'px';
        바닥판.style.height = 바닥높 + 'px';
        /* 바닥을 창 밖으로 날려 보내지 않는다. 창보다 작으면 가운데에 두고,
           크면 변이 창 안으로 들어오는 데까지만(손잡이 자리 26px 은 남긴다). */
        팬x = (바닥폭 + 여백 * 2 <= 보기폭) ? (보기폭 - 바닥폭) / 2
            : Math.max(보기폭 - 바닥폭 - 여백, Math.min(여백, 팬x));
        팬y = (바닥높 + 여백 * 2 <= 보기높) ? (보기높 - 바닥높) / 2
            : Math.max(보기높 - 바닥높 - 여백, Math.min(여백, 팬y));
        바닥판.style.left = 팬x + 'px';
        바닥판.style.top  = 팬y + 'px';
        const 한칸 = (칸 * 배율).toFixed(3) + 'px';
        바닥판.style.backgroundSize = 한칸 + ' ' + 한칸;
        $('l-floor-size').innerHTML = '';
        $('l-floor-size').append(미터(바닥.가로) + ' × ' + 미터(바닥.세로) + ' m');
        const 붓 = document.createElement('span'); 붓.className = 'lpen'; 붓.textContent = '✎';
        $('l-floor-size').append(붓);
        배율글고치기();
    }
    /* 몇 배로 보고 있나 — 전체인지 일부인지 사장님이 알 수 있어야 한다.
       1m 가 화면에서 몇 px 인지도 같이 적는다(그것이 진짜 자다). */
    function 배율글고치기() {
        const 글 = $('l-mag');
        if (!글) return;
        const 한칸px = 칸 * 배율;
        글.textContent = (확대 <= 1.005 ? '전체' : 확대.toFixed(1) + '배')
                       + ' · 1m = ' + 한칸px.toFixed(0) + 'px';
        $('l-zin').disabled  = 확대 >= 확대최대 - 1e-6;
        $('l-zout').disabled = 확대 <= 1 + 1e-6;
        $('l-zall').disabled = 확대 <= 1 + 1e-6;
    }

    /* ── 그리기 ────────────────────────────────────────────────────── */
    /* ── 참 자리(mm) → 화면 자리 ────────────────────────────────────────
       돌리기를 **CSS 로 판을 통째 돌리지 않았다.** 그러면 기계 이름까지 옆으로
       누워 못 읽는다. 대신 **화면의 가로축에 세로를, 세로축에 가로를** 끼운다
       — 글자는 그대로 서 있고, 그림만 시계 방향으로 90° 돈 것이 된다.

         돌림 꺼짐 : 왼 = x,                    위 = y
         돌림 켜짐 : 왼 = (바닥.세로 - y - 세로), 위 = x      (시계 방향 90°)

       ⚠ 바꾸는 것은 **그리는 자리뿐**이다. m.x·m.y 는 손도 안 댄다. */
    function 자리넣기(el, m) {
        const w = 폭(m), h = 높(m);            // 돌린 만큼 바뀐 **차지하는 자리**
        if (돌림) {
            el.style.left   = ((바닥.세로 - m.y - h) / 바닥.세로 * 100) + '%';
            el.style.top    = (m.x / 바닥.가로 * 100) + '%';
            el.style.width  = (h / 바닥.세로 * 100) + '%';
            el.style.height = (w / 바닥.가로 * 100) + '%';
            return;
        }
        el.style.left   = (m.x / 바닥.가로 * 100) + '%';
        el.style.top    = (m.y / 바닥.세로 * 100) + '%';
        el.style.width  = (w / 바닥.가로 * 100) + '%';
        el.style.height = (h / 바닥.세로 * 100) + '%';
    }
    /* 이름이 빈 네모가 있다 — 도면 벌에 열일곱이다. 사장님이 무엇인지 알려
       주시기 전까지는 **갈래와 크기로 부른다.** 빈 딱지보다 그 편이 읽힌다. */
    const 갈래이름 = { 기: '기계', 파: '파레트', 둥: '기둥', 방: '방', 문: '문',
                       밖: '홀 밖', 원: '원', '몰': '' };
    /* ⚠ 갈래 이름 뒤에 크기를 붙이면 「파레트 1.2×1.2」 가 되어 좁은 판에서
       「파레… 」 로 잘렸다. 크기는 바로 아랫줄(.lsz)이 이미 적고 있다.
       그래서 이름 줄에는 **갈래만** 적는다. 갈래도 모르면 그때만 크기를 적는다.
       (10-07 에 그림을 눈으로 보고 잡았다.) */
    const 부를이름 = m => m.이름 || 갈래이름[m['갈래']]
                        || (미터(m.가로) + '×' + 미터(m.세로));
    /* 네모 하나를 바닥에 만든다. 덩이의 조각도 이것으로 만든다 —
       그래서 조각도 제 갈래 빛, 제 이름, 제 크기, 납작 가림이 그대로 산다.
       ⚠ 조각의 data-id 는 **덩이의 id** 다. 조각을 짚으면 덩이가 잡힌다. */
    function 네모만들기(그릴것, 주인, 조각번호) {
        const el = document.createElement('div');
        el.className = 'lmc 갈-' + (그릴것['갈래'] || '기') + (조각번호 === undefined ? '' : ' 조각');
        el.dataset.id = 주인.id;
        if (조각번호 !== undefined) el.dataset.조각 = String(조각번호);
        el.dataset.area = '기계:' + (그릴것.이름 || 부를이름(그릴것));
        el.innerHTML = '<span class="lnm"></span><span class="lsz"></span><i class="lfr"></i>';
        el.querySelector('.lnm').textContent = 부를이름(그릴것);
        el.querySelector('.lsz').textContent = 미터(그릴것.가로) + '×' + 미터(그릴것.세로) + 'm';
        앞금넣기(el, 그릴것);
        el.addEventListener('pointerdown', 집기);
        el.addEventListener('pointermove', 끌기);
        el.addEventListener('pointerup', 놓기);
        el.addEventListener('pointercancel', 놓기);
        return el;
    }
    /* 조각이 바닥 어디에 앉나 — 자리넣기() 가 먹을 수 있는 꼴로 */
    const 조각네모 = (m, c) => ({ 가로: c.w, 세로: c.h, x: m.x + c.x, y: m.y + c.y, 각: 0 });
    const 납작입히기 = (el, 높이px) => {
        el.classList.toggle('납작', 높이px < 34);
        el.classList.toggle('아주납작', 높이px < 24);
        el.classList.toggle('이름숨김', 높이px < 11);
    };
    /* 그것에 딸린 **모든 조각**의 자리를 다시 넣는다. 덩이를 끌면 품은 조각이
       다 같이 그만큼 움직여야 한다 — 테 하나만 옮기면 조각은 제자리에 남는다. */
    function 자리다시(m) {
        const 조 = 조각자리(m);
        const 테 = 바닥판.querySelector('.lgrp[data-id="' + m.id + '"]');
        if (테) 자리넣기(테, m);
        바닥판.querySelectorAll('.lmc[data-id="' + m.id + '"]').forEach(el => {
            const i = el.dataset.조각;
            if (i === undefined || !조) { 자리넣기(el, m); return; }
            const c = 조[+i];
            if (c) 자리넣기(el, 조각네모(m, c));
        });
    }
    function 그리기() {
        바닥판.innerHTML = '';
        /* 건물 벽 — 객체가 아니라 그어 둔 금. 도면 벌에만 있다 */
        (벌.벽 || []).forEach(([w, h, x, y], i) => {
            const 금 = document.createElement('div');
            금.className = 'lhall';
            금.dataset.area = '건물벽' + (i + 1);
            자리넣기(금, { 가로: w, 세로: h, x, y, 각: 0 });
            바닥판.appendChild(금);
        });
        기계들.forEach(m => {
            const 하나만 = 고른들.length === 1 && 고른들[0] === m.id;
            const 조 = 조각자리(m);
            if (조) {
                /* ── 합친 덩이 — 품은 조각을 **그 모양 그대로** 그린다 ──────
                   사장님 말씀(10-07 07:53)대로다. 테는 점선으로만 두르고 칠하지
                   않는다. 손가락에 짚히는 것은 조각이고, 짚으면 덩이가 잡힌다. */
                const 테 = document.createElement('div');
                테.className = 'lgrp' + (하나만 ? ' 고름' : (고른들.includes(m.id) ? ' 여럿' : ''));
                테.dataset.id = m.id;
                테.dataset.area = '덩이:' + 부를이름(m);
                자리넣기(테, m);
                바닥판.appendChild(테);
                조.forEach((c, i) => {
                    const el = 네모만들기(c, m, i);
                    자리넣기(el, 조각네모(m, c));
                    const h = (돌림 ? c.w : c.h) * 배율, w = (돌림 ? c.h : c.w) * 배율;
                    납작입히기(el, h);
                    if (Math.min(w, h) < 16) el.classList.add('모남');
                    if (하나만 || 고른들.includes(m.id)) el.classList.add('덩이고름');
                    바닥판.appendChild(el);
                });
                return;                 // ⚠ 덩이에는 변 손잡이를 안 낸다 — 까닭은 합치기() 에
            }
            const el = 네모만들기(m, m);
            자리넣기(el, m);
            const 높이px = (돌림 ? 폭(m) : 높(m)) * 배율;   // 화면에 보이는 높이
            납작입히기(el, 높이px);
            const 폭px = (돌림 ? 높(m) : 폭(m)) * 배율;
            if (Math.min(폭px, 높이px) < 16) el.classList.add('모남');
            /* 손잡이는 **고른 기계에만** 낸다. 스무 대에 다 내면 예순 개가 서로
               겹쳐 아무것도 못 짚는다(까닭은 .lmc.고름 에 적어 두었다). */
            if (하나만) {
                el.classList.add('고름');
                el.style.zIndex = String(++맨위);
                if (!여럿모드) {        // 고르는 중에는 손잡이가 옆 네모를 덮는다
                    손잡이붙이기(el, '가로', m.id, false);
                    손잡이붙이기(el, '세로', m.id, false);
                }
            } else if (고른들.includes(m.id)) {
                el.classList.add('여럿');
            }
            바닥판.appendChild(el);
        });
        보드그리기();
        바닥손잡이그리기();
        글자맞추기();
        물건줄고치기();
        자그리기();              // 그리기() 가 바닥 속을 비우므로 금을 다시 긋는다
    }

    /* 바라보는 쪽에 붉은 금을 하나 긋는다. 네모난 기계(재단기 4,000×4,000)는
       돌려도 차지하는 자리가 안 바뀌니, 이 금이 없으면 돌았는지 알 수가 없다. */
    function 앞금넣기(el, m) {
        const 금 = el.querySelector('.lfr');
        if (!금) return;
        const 쪽 = 화면쪽(앞쪽(m));
        금.style.cssText = '';
        if (쪽 === '오른' || 쪽 === '왼') {
            금.style.width = '3px'; 금.style.top = '18%'; 금.style.bottom = '18%';
            금.style[쪽 === '오른' ? 'right' : 'left'] = '1px';
        } else {
            금.style.height = '3px'; 금.style.left = '18%'; 금.style.right = '18%';
            금.style[쪽 === '아래' ? 'bottom' : 'top'] = '1px';
        }
    }

    /* ── 손잡이가 어느 화면 변에 앉나 ──────────────────────────────────
       늘 **그 축이 자라는 쪽**이 놓인 화면 변이다. 기계를 90° 돌리면 가로가
       자라는 쪽이 x+ 에서 y+ 로 바뀌므로 손잡이도 그만큼 옮겨 앉는다.
         안 돌렸을 때 — x+가로 → 오른 · y+세로 → 아래
         돌렸을 때   — x+가로 → 아래 · y+세로 → **왼**
       이것을 안 맞추면 오른 변을 당길 때 기계가 **움직인다**(돌림에서 화면 오른은
       모델의 y 쪽이다). 10-07 에 짜기 전에 짚어 둔 자리다. */
    const 손잡이쪽 = (것, 축) => 화면쪽(자라는쪽(것, 축));
    function 손잡이붙이기(부모, 축, 누구, 바닥것) {
        const h = document.createElement('div');
        h.className = 'lhd lhd-' + 손잡이쪽(변주인(누구), 축) + (바닥것 ? ' 바닥손잡이' : '');
        h.dataset.축 = 축;
        h.dataset.누구 = 누구;
        h.dataset.area = (바닥것 ? '바닥' : '기계') + '손잡이:' + 축;
        h.innerHTML = '<i></i>';
        h.addEventListener('pointerdown', 변집기);
        h.addEventListener('pointermove', 변끌기);
        h.addEventListener('pointerup', 변놓기);
        h.addEventListener('pointercancel', 변놓기);
        부모.appendChild(h);
        return h;
    }
    function 바닥손잡이그리기() {
        손잡이붙이기(바닥판, '가로', '바닥', true);
        손잡이붙이기(바닥판, '세로', '바닥', true);
    }
    /* 기준 보드판 — 기계와 같은 자(mm)로, 같은 돌림 셈으로 그린다.
       바닥이 보드보다 작아지면 구석으로 붙고, 그래도 넘치면 바닥에 잘린다
       — 그것이 「이 바닥에는 보드가 안 들어간다」 는 참말이라 그대로 보인다. */
    /* 보드판을 **기계가 없는 자리**에 놓는다. 왼쪽 아래부터 훑어 처음 비는 데다.
       10-06 에 그림을 보고 잡았다 — 구석에 붙박이로 뒀더니 작업대 위에 겹쳐
       그 이름을 가렸다. 빈 자리에 놓이면 「보드 한 장 둘 자리가 있나」 까지
       눈으로 보인다. 어디에도 못 놓으면 왼쪽 아래 구석에 그대로 둔다. */
    function 보드자리() {
        const 구석 = { x: Math.max(0, Math.min(보드.띄움, 바닥.가로 - 보드.가로)),
                       y: Math.max(0, 바닥.세로 - 보드.세로 - 보드.띄움) };
        if (바닥.가로 < 보드.가로 || 바닥.세로 < 보드.세로) return 구석;
        const 걸리나 = (x, y) => 기계들.some(o => 칸들(o, o.x, o.y).some(B =>
            x < B.x + B.w && B.x < x + 보드.가로 && y < B.y + B.h && B.y < y + 보드.세로));
        const 칸수 = 24;
        const dx = (바닥.가로 - 보드.가로) / 칸수, dy = (바닥.세로 - 보드.세로) / 칸수;
        for (let j = 칸수; j >= 0; j--) {                 // 아래에서 위로
            for (let i = 0; i <= 칸수; i++) {             // 왼쪽에서 오른쪽으로
                const x = Math.round(i * dx / 눈금) * 눈금, y = Math.round(j * dy / 눈금) * 눈금;
                if (!걸리나(x, y)) return { x, y };
            }
        }
        return 구석;                                      // 바닥이 기계로 꽉 찼다
    }
    function 보드그리기() {
        /* 기준 보드판은 **내 배치 벌에만** 둔다. 도면 벌은 「도면 그대로」 이므로
           도면에 없는 금을 더 그리지 않는다(사장님 말씀을 그대로 따른다). */
        if (벌.코드 !== '내배치') return;
        const 놓을데 = 보드자리();
        const 자 = { 가로: 보드.가로, 세로: 보드.세로, x: 놓을데.x, y: 놓을데.y };
        const el = document.createElement('div');
        el.className = 'lboard';
        el.dataset.area = '기준보드판';
        el.innerHTML = '<span class="lbnm"></span>';
        const 이름 = el.querySelector('.lbnm');
        이름.textContent = '보드 ' + 미터(보드.가로) + '×' + 미터(보드.세로) + 'm';
        자리넣기(el, 자);
        바닥판.appendChild(el);
        /* 이름표가 보드보다 넓으면 밖으로 삐져나가 **기계 이름을 덮는다.**
           바닥을 키울수록 보드가 작아져서 더 그렇다. 안 들어가면 줄이고, 그래도
           안 들어가면 뗀다 — 붉은 점선 테만 남아도 자 노릇은 한다. */
        const 칸폭 = el.clientWidth;
        // 숫자가 이 보드판의 전부다. 숫자를 가장 늦게까지 붙들고, 맨 끝에만 뗀다

    /* ── 끌어 옮기기 ────────────────────────────────────────────────── */
    let 잡은것 = null;
    let 맨위 = 50;                        // 잡은 기계를 올려 두는 층. 잡을 때마다 하나 올라간다
    const 가두기 = (v, 끝) => Math.max(0, Math.min(끝, Math.round(v / 눈금) * 눈금));

    /* ── 기계끼리 겹쳐 놓지 않는다 ───────────────────────────────────────
       관리자에게: 이것은 **제가 정한 것**입니다. 공장 바닥에 기계 두 대가 같은
       자리를 차지할 수는 없으니 그대로 둔 것이기도 하지만, 참 까닭은 이것입니다 —
       겹치게 두면 큰 기계가 작은 기계를 **통째로 덮어** 그 기계를 다시 끌 수가
       없었습니다(10-05 에 집진기가 보링기 밑에 들어가 그렇게 됐습니다).

       막는 방식: **다른 기계 앞까지는 가고 거기서 선다.** 가로를 먼저 풀고 그
       가로에서 세로를 푼다 — 그래서 기계 옆을 지날 때는 벽을 따라 밀듯이

       아예 꼼짝을 안 해서, 붙여 놓을 수가 없었다 — 10-05 에 재어서 고쳤다.) */
    const 겹치나 = (m, x, y) => {
        const 내것 = 칸들(m, x, y);
        return 기계들.some(o => o !== m && 칸들(o, o.x, o.y).some(B =>
            내것.some(A => A.x < B.x + B.w && B.x < A.x + A.w
                        && A.y < B.y + B.h && B.y < A.y + A.h)));
    };

    /* 가려는 자리를 다른 기계에 막히는 데까지만 줄여 돌려준다.
       돌려주는 것: { x, y, 막혔나 } — 막혔나는 **기계에** 막혔을 때만 참이다(벽은 아니다) */
    function 풀기(m, 갈x, 갈y) {

        if (!벌.겹침막기) return { x: 갈x, y: 갈y, 막혔나: false };
        /* 내가 차지하는 네모들(덩이면 여럿)과 남들의 네모를 **낱낱이** 견준다.
           통짜끼리면 예전과 똑같은 셈이다(네모가 하나씩이니까). */
        const 내것 = 칸들(m, 0, 0);                 // m.x·m.y 에서의 치우침
        const 남 = [];

            const ay = m.y + A.y;

            if (ax + A.w <= B.x && x + A.x + A.w > B.x) { x = B.x - A.x - A.w; 막혔나 = true; }
            else if (ax >= B.x + B.w && x + A.x < B.x + B.w) { x = B.x + B.w - A.x; 막혔나 = true; }
        }));

        남.forEach(B => 내것.forEach(A => {         // ② 세로 — ① 로 정한 가로에서 걸리는 것만
            const ax = x + A.x;
            if (!(ax < B.x + B.w && B.x < ax + A.w)) return;
            const ay = m.y + A.y;
            if (ay + A.h <= B.y && y + A.y + A.h > B.y) { y = B.y - A.y - A.h; 막혔나 = true; }

    }

        /* ⚠ 여기서 e.preventDefault() 를 부르면 안 된다. 포인터 내림을 막으면
           뒤따르는 mousedown 이 안 나고, 손잡이(viggle)가 그것으로 0.5초를 세기에
           **길게 눌러도 지시판이 안 떴다**(10-05 에 재어서 잡았다).
           화면이 같이 밀리는 것은 .lmc 의 touch-action:none 이 막아 준다. */
    }

        if (document.querySelector('.vg-sheet')) return 놓기(e);
        const m = 잡은것.m;
        /* 손가락이 간 px → 참 자리(mm). 돌렸으면 축이 바뀐 만큼 되돌려 셈한다.
           돌림 켜짐: 손가락이 아래로 가면 x 가 늘고, 오른쪽으로 가면 y 가 준다.
           그래서 돌린 뒤에도 **손가락이 간 거리와 기계가 간 거리는 1:1 그대로**다. */

        /* ── 끌기 문턱 6px ────────────────────────────────────────────────
           진짜 손가락은 가만히 누른다고 해도 1~3px 씩 흔들린다. 그런데 이 자에서
           1px 은 27mm 라, 문턱이 없으면 **톡 누르려다 기계가 밀린다.**
           6px 을 넘기 전까지는 안 움직인다. 넘는 순간부터 끌기이고, 그때도 **처음

        }
        const 갈x = 가두기(잡은것.첫x + (돌림 ?  민py : 민px) / 배율, 바닥.가로 - 폭(m));
        const 갈y = 가두기(잡은것.첫y + (돌림 ? -민px : 민py) / 배율, 바닥.세로 - 높(m));

    /* 두 번 톡 — 같은 네모를 **400ms 안에 끌지 않고** 두 번 치면 속성 판이 뜬다.

        const 이제 = Date.now();

    function 알리기(m, 막혔나) {
        쪽지.textContent = 부를이름(m) + ' — 왼쪽벽 ' + 미터(m.x) + ' · 위벽 ' + 미터(m.y) + ' m'

    }

    /* ── 바닥 크기 고치기 ──────────────────────────────────────────────

    function 크기판열기() {

        크기쪽지.className = 'lcmsg';
        크기쪽지.textContent = '기계가 놓인 자리는 그대로 둡니다';
        크기판.hidden = false;
    }
    const 크기판닫기 = () => { 크기판.hidden = true; };

    function 크기넣기() {
        let 새가로 = 미터읽기(가로칸.value), 새세로 = 미터읽기(세로칸.value);
        if (!(새가로 >= 바닥최소) || !(새세로 >= 바닥최소)
            || 새가로 > 바닥최대 || 새세로 > 바닥최대) {
            크기쪽지.className = 'lcmsg 나쁨';
            /* 사장님이 버릇대로 mm 로 넣으시는 일이 있다 — 3800 이 3,800 m 가 되면 안 된다.

            const 밀리같은것 = [Number(가로칸.value), Number(세로칸.value)]
                .find(v => Number.isFinite(v) && v >= 1000);

                ? '미터로 넣어 주십시오 — ' + 수(밀리같은것) + ' mm 는 ' + 미터(밀리같은것) + ' m 입니다'
                : 미터(바닥최소) + ' 에서 ' + 미터(바닥최대) + ' m 사이로 넣어 주십시오';

        const 막는가로 = 기계끝가로(), 막는세로 = 기계끝세로();
        const 말 = [];
        if (새가로 < 막는가로) { 말.push('가로는 ' + 미터(막는가로)); 새가로 = 막는가로; }
        if (새세로 < 막는세로) { 말.push('세로는 ' + 미터(막는세로)); 새세로 = 막는세로; }

            크기쪽지.textContent = '기계가 거기까지 차 있어 ' + 말.join(' · ') + ' m 까지만 줄었습니다';
            가로칸.value = 미터칸값(바닥.가로); 세로칸.value = 미터칸값(바닥.세로);
            쪽지.textContent = '바닥 ' + 미터(바닥.가로) + ' × ' + 미터(바닥.세로) + ' m — 기계에 막혀 더는 안 줄었습니다';

    $('l-size-no').addEventListener('click', 크기판닫기);

    /* 이 기계가 **오른쪽으로** 얼마까지 커질 수 있나 — 벽과, 오른쪽에 있는 기계까지 */
    /* ── 그 축을 얼마까지 키울 수 있나(mm) ──────────────────────────────

          벽과 그 쪽에 선 기계까지만 센다. 이것을 안 맞추면 돌린 기계를 늘릴 때
          옆 기계를 뚫고 들어갔다. */
    function 클수있기(m, 축) {
        const w = 폭(m), h = 높(m);
        if (!벌.겹침막기) return 자라는쪽(m, 축) === 'x+' ? 바닥.가로 - m.x : 바닥.세로 - m.y;
        if (자라는쪽(m, 축) === 'x+') {                      // 바닥의 가로 쪽으로 자란다
            let 끝 = 바닥.가로 - m.x;

                if (o === m) return;
                칸들(o, o.x, o.y).forEach(B => {
                    if (!(m.y < B.y + B.h && B.y < m.y + h)) return;   // 세로로 안 겹치면 상관없다

        기계들.forEach(o => {
            if (o === m) return;

                if (!(m.x < B.x + B.w && B.x < m.x + w)) return;
                if (B.y >= m.y + h) 끝 = Math.min(끝, B.y - m.y);

    }

    /* ── 변을 잡아 늘리기 ──────────────────────────────────────────────

       ⚠ 10-07 에 **걷은 막음** — 전에는 「감싸는 테 안에 안 고른 네모가 들어가면
          안 합친다」 로 막았다. 그때는 테가 칠해져 그 네모를 **삼켜** 다시 못
          짚게 됐기 때문이다. 이제 테는 칠하지도, 손가락을 가로채지도 않는다
          (pointer-events:none). 테 안에 든 남의 네모도 그대로 보이고 그대로
          짚힌다. 막을 까닭이 없어져 걷었다. */
    function 합치기() {
        const 것들 = 고른것들();
        if (것들.length < 2) return;
        const x1 = Math.min(...것들.map(m => m.x)), y1 = Math.min(...것들.map(m => m.y));
        const x2 = Math.max(...것들.map(m => m.x + 폭(m))), y2 = Math.max(...것들.map(m => m.y + 높(m)));
        /* 덩이를 덩이에 넣으면 조각이 한 겹 더 깊어져 되돌리기가 헷갈린다.
           이미 덩이인 것은 **그 조각들을 꺼내 펴서** 담는다 — 한 번에 다 풀린다. */
        const 조각 = [];
        것들.forEach(m => {
            const 안 = 조각자리(m);
            if (안) { 안.forEach(c => 조각.push({ id: 새id(), 이름: c.이름, 가로: c.가로, 세로: c.세로,
                                                  x: m.x + c.x - x1, y: m.y + c.y - y1,
                                                  각: c['각'] | 0, 갈래: c['갈래'] || '기' })); return; }
            조각.push({ id: m.id, 이름: m.이름, 가로: m.가로, 세로: m.세로,
                        x: m.x - x1, y: m.y - y1, 각: m['각'] | 0, 갈래: m['갈래'] || '기' });
        });
        /* 합친 것의 이름 — 딱지가 좁으니 **짧고 읽히게** 짓는다.
           「파레트 1.2×1.2 외 3개」 는 판에서 「파레트 1.2…」 로 잘려 아무것도
           안 읽혔다(10-07 에 그림을 눈으로 보고 잡았다). */
        const 한갈래 = 조각.every(c => c['갈래'] === 조각[0]['갈래']);
        const 한크기 = 조각.every(c => c.가로 === 조각[0].가로 && c.세로 === 조각[0].세로);
        const 이름 = (한갈래 && 한크기 && 갈래이름[조각[0]['갈래']])
            ? 갈래이름[조각[0]['갈래']] + ' ' + 조각.length + '장'
            : (조각.length === 2 ? [부를이름(조각[0]), 부를이름(조각[1])].join(' + ')
                                 : 부를이름(조각[0]) + ' 외 ' + (조각.length - 1) + '개');
        const 새것 = { id: 새id(), 이름, 가로: x2 - x1, 세로: y2 - y1, x: x1, y: y1, 각: 0,
                       갈래: 한갈래 ? 조각[0]['갈래'] : '기', 조각 };
        기계들 = 기계들.filter(m => !고른들.includes(m.id)).concat([새것]);
        고른들 = [새것.id];
        여럿모드 = false;
        재기(); 그리기(); 저장(true);
        쪽지.textContent = 조각.length + '개를 한 덩이로 묶었습니다 — 모양은 그대로, 함께 움직입니다 ('
                         + 미터(새것.가로) + ' × ' + 미터(새것.세로) + ' m)';
    }
    /* ── 나누기 ────────────────────────────────────────────────────────
       합친 것이면 품고 있던 **조각 그대로** 되돌린다(한 톨도 안 틀린다).
       합친 적이 없는 것이면 **긴 쪽을 반으로** 가른다 — 반씩이 가장 짐작이 쉽다. */
    function 나누기() {
        const 것들 = 고른것들();
        if (것들.length !== 1) return;
        const m = 것들[0];
        if (m['조각'] && m['조각'].length) {
            /* ⚠ 덩이를 돌려 두셨으면 **돌린 자리 그대로** 풀어야 한다.
               담긴 값(c.x·c.y·c.각)은 안 돌린 테 기준이므로, 조각자리() 로 지금
               자리를 셈해 쓴다. 덩이 각이 0 이면 담긴 값과 똑같다. */
            const 되살림 = 조각자리(m).map(c => ({
                id: 새id(), 이름: c.이름, 가로: c.가로, 세로: c.세로,
                x: m.x + c.x, y: m.y + c.y, 각: c['각'] | 0, 갈래: c['갈래'] || '기', 조각: null }));
            기계들 = 기계들.filter(o => o.id !== m.id).concat(되살림);
            고른들 = [되살림[0].id];
            재기(); 그리기(); 저장(true);
            쪽지.textContent = '합치기 전 ' + 되살림.length + '개로 되돌렸습니다';
            return;
        }
        const 가로로 = m.가로 >= m.세로;                   // 긴 쪽을 가른다
        const 반 = Math.max(눈금, Math.round((가로로 ? m.가로 : m.세로) / 2 / 눈금) * 눈금);
        if ((가로로 ? m.가로 : m.세로) < 기계최소 * 2) {
            쪽지.textContent = 부를이름(m) + ' — 더 나눌 수 없습니다 (반쪽이 '
                             + 미터(기계최소) + ' m 보다 작아집니다)';
            return;
        }
        const 왼 = { ...m, id: 새id(), 조각: null,
                     가로: 가로로 ? 반 : m.가로, 세로: 가로로 ? m.세로 : 반 };
        const 오른 = { ...m, id: 새id(), 조각: null,
                       가로: 가로로 ? m.가로 - 반 : m.가로, 세로: 가로로 ? m.세로 : m.세로 - 반,
                       x: 가로로 ? m.x + 반 : m.x, y: 가로로 ? m.y : m.y + 반 };
        /* ⚠ 돌린 것을 나눌 때는 각을 0 으로 둔다 — 돌린 채로 가르면 어느 쪽이
           어느 쪽인지 사장님이 알 수가 없다. 차지하던 자리는 그대로 지킨다. */
        if ((m['각'] | 0) % 180) {
            왼.각 = 오른.각 = 0;
            왼.가로 = 가로로 ? 반 : 높(m); 왼.세로 = 가로로 ? 폭(m) : 반;
            오른.가로 = 가로로 ? 폭(m) - 반 : 높(m); 오른.세로 = 가로로 ? 폭(m) : 높(m) - 반;
        }
        기계들 = 기계들.filter(o => o.id !== m.id).concat([왼, 오른]);
        고른들 = [왼.id];
        재기(); 그리기(); 저장(true);
        쪽지.textContent = 부를이름(m) + ' 를 둘로 나눴습니다 — '
                         + 미터(왼.가로) + '×' + 미터(왼.세로) + ' · '
                         + 미터(오른.가로) + '×' + 미터(오른.세로) + ' m';
    }
    /* 겹치지 않는 새 id. 담긴 것과 부딪히면 안 된다 */
    let id씨 = 0;
    const 새id = () => { let v; do { v = 'n' + (++id씨) + '_' + (Date.now() % 100000); }
                         while (기계들.some(m => m.id === v)); return v; };
    $('l-join').addEventListener('click', 합치기);
    $('l-split').addEventListener('click', 나누기);

    /* ── 기계 돌리기 ───────────────────────────────────────────────────
       사장님 말씀(10-07): 「각 기기별 객체화 해서 회전 이동 등이 가능해야해」.
       한 번 누르면 90° 다. 왼위 모서리는 그대로 두고 그 자리에서 돈다.
       돌릴 자리가 없으면(벽이나 다른 기계에 걸리면) **안 돌리고 그렇게 알린다**
       — 몰래 옮겨 놓으면 사장님이 잡아 둔 배치가 어긋난다. */
    function 기계돌리기() {
        const 것들 = 고른것들();
        const m = 것들.length === 1 ? 것들[0] : null;
        if (!m) return;
        const 전각 = m['각'] | 0;
        m['각'] = (전각 + 90) % 360;
        /* ⚠ 여기서 가두기() 를 쓰면 안 된다 — 그것은 10mm 눈금에 떨어뜨리는데,
           캐드 도면의 참값은 눈금에 안 떨어지는 것이 있다(로버 골드 x=43,805).
           돌리기만 했는데 자리가 5mm 밀렸다(10-07 에 시험이 잡아냈다).
           **돌리기는 자리를 옮기는 일이 아니다.** 벽 안으로만 들인다. */
        const 들이기 = (v, 끝) => Math.max(0, Math.min(끝, v));
        const 갈x = 들이기(m.x, 바닥.가로 - 폭(m)), 갈y = 들이기(m.y, 바닥.세로 - 높(m));
        /* ⚠ 겹침을 안 막는 벌(도면 그대로)에서는 겹친다고 돌리기를 막으면 안 된다.
           도면에는 기둥이 방 벽 위에 앉은 자리가 열넷이라, 그 벌에서는 아무것도
           못 돌렸다(10-07 에 시험이 잡아냈다). 벽은 어느 벌에서나 막는다. */
        const 걸리나 = 벌.겹침막기 && 겹치나(m, 갈x, 갈y);
        if (바닥.가로 < 폭(m) || 바닥.세로 < 높(m) || 걸리나) {
            m['각'] = 전각;                  // 되돌린다
            쪽지.textContent = 부를이름(m) + ' — 돌릴 자리가 없습니다 (벽이나 다른 기계에 걸립니다)';
            return;
        }
        m.x = 갈x; m.y = 갈y;
        그리기(); 저장(true);
        쪽지.textContent = 부를이름(m) + ' ' + m['각'] + '° — 바닥에서 '
                         + 미터(폭(m)) + ' × ' + 미터(높(m)) + ' m 를 차지합니다';
    }
    $('l-mturn').addEventListener('click', 기계돌리기);

    /* ── 확대 ──────────────────────────────────────────────────────────
       창 안의 한 점(cx, cy)을 **붙든 채로** 배율을 바꾼다. 그 점이 가리키던
       공장의 자리가 손가락 밑에 그대로 남아야 「잡고 벌린다」 가 된다. */
    function 확대맞추기(새확대, cx, cy, 가볍게) {
        새확대 = Math.max(1, Math.min(확대최대, 새확대));
        if (Math.abs(새확대 - 확대) < 1e-9) return;
        const 전배율 = 배율 || 맞춤배율 || 1;
        const mmx = (cx - 팬x) / 전배율, mmy = (cy - 팬y) / 전배율;   // 그 점의 공장 자리(mm)
        확대 = 새확대;
        const 새배율 = 맞춤배율 * 확대;
        팬x = cx - mmx * 새배율;
        팬y = cy - mmy * 새배율;
        if (가볍게) 다시맞추기(); else { 재기(); 그리기(); }
    }
    const 창가운데 = () => [뷰.clientWidth / 2, 뷰.clientHeight / 2];
    $('l-zin').addEventListener('click',  () => { const [x, y] = 창가운데(); 확대맞추기(확대 * 1.6, x, y); });
    $('l-zout').addEventListener('click', () => { const [x, y] = 창가운데(); 확대맞추기(확대 / 1.6, x, y); });
    $('l-zall').addEventListener('click', () => { const [x, y] = 창가운데(); 확대맞추기(1, x, y);
                                                   쪽지.textContent = '공장 전체를 봅니다'; });
    뷰.addEventListener('wheel', e => {                   // 컴퓨터로 보실 때
        e.preventDefault();
        const 박 = 뷰.getBoundingClientRect();
        확대맞추기(확대 * (e.deltaY < 0 ? 1.12 : 1 / 1.12), e.clientX - 박.left, e.clientY - 박.top, true);
    }, { passive: false });

    /* ── 손가락 ────────────────────────────────────────────────────────
       ⚠ 창에 **거둠(capture) 단계**로 단다. 기계·손잡이가 제 일을 하기 **전에**
          손 수를 세어야 두 번째 손가락이 닿는 순간 끌기를 멈출 수 있다. */
    const 손들 = new Map();
    let 핀치 = null, 팬질 = null;
    const 사이 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    function 끌기그만() {
        if (잡은것) {                        // 끌던 기계를 **제자리로** 되돌린다
            const { m, el, pid, 첫x, 첫y } = 잡은것;

        }
        if (잡은변) {
            잡은변 = null;
            document.querySelectorAll('.lhd.잡힘').forEach(x => x.classList.remove('잡힘'));
        }
        팬질 = null;
        뷰.classList.remove('끌림');
    }
    function 핀치시작() {
        const [a, b] = [...손들.values()];
        const 박 = 뷰.getBoundingClientRect();
        const mx = (a.x + b.x) / 2 - 박.left, my = (a.y + b.y) / 2 - 박.top;
        const 쓸배율 = 배율 || 맞춤배율 || 1;
        핀치 = { 첫사이: Math.max(1, 사이(a, b)), 첫확대: 확대,
                 mmx: (mx - 팬x) / 쓸배율, mmy: (my - 팬y) / 쓸배율 };
    }
    /* 두 손가락 — 벌린 만큼 커지고, 두 손가락이 같이 움직이면 그만큼 끌린다.
       붙든 공장 자리를 늘 두 손가락 **사이**에 두는 것이 그 둘을 한꺼번에 낸다. */

        const [a, b] = [...손들.values()];
        const 박 = 뷰.getBoundingClientRect();
        const mx = (a.x + b.x) / 2 - 박.left, my = (a.y + b.y) / 2 - 박.top;
        확대 = Math.max(1, Math.min(확대최대, 핀치.첫확대 * 사이(a, b) / 핀치.첫사이));

        팬x = mx - 핀치.mmx * 새배율;
        팬y = my - 핀치.mmy * 새배율;
        다시맞추기();
    }

    뷰.addEventListener('pointerdown', e => {
        손들.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (손들.size === 2) { 끌기그만(); 자질 = null; 핀치시작(); return; }
        if (손들.size !== 1) return;
        /* ⚠ 자를 켜 두셨으면 **자가 먼저 받는다.** 거둠 단계라 기계·손잡이에
           닿기 전이다 — 재다가 기계가 밀리면 배치가 망가진다. */
        if (재는중) {
            if (e.target.closest && e.target.closest('.lzb')) return;   // 확대 단추는 제 일을
            e.stopPropagation();
            붙을자리모으기();          // 그새 기계를 옮기셨을 수 있다
            const 첫 = 붙이기(짚은점(e.clientX, e.clientY));
            자질 = { pid: e.pointerId, ax: 첫.x, ay: 첫.y, a붙음: 첫.붙었나, 끔: false };
            잰금 = { ax: 첫.x, ay: 첫.y, bx: 첫.x, by: 첫.y,
                     a붙음: 첫.붙었나, b붙음: 첫.붙었나 };
            try { 뷰.setPointerCapture(e.pointerId); } catch (err) {}

        if (e.target.closest && e.target.closest('.lmc, .lhd, .lzb')) return;
        팬질 = { pid: e.pointerId, 손x: e.clientX, 손y: e.clientY,
                 첫팬x: 팬x, 첫팬y: 팬y, 끔: false };
        try { 뷰.setPointerCapture(e.pointerId); } catch (err) {}
    }, true);

    뷰.addEventListener('pointermove', e => {

        if (자질 && e.pointerId === 자질.pid) {
            e.stopPropagation();
            자질.끔 = true;
            const 끝 = 붙이기(짚은점(e.clientX, e.clientY));
            잰금 = { ax: 자질.ax, ay: 자질.ay, bx: 끝.x, by: 끝.y,
                     a붙음: 자질.a붙음, b붙음: 끝.붙었나 };
            자그리기(); 잰것알리기();
            return;
        }

        const dx = e.clientX - 팬질.손x, dy = e.clientY - 팬질.손y;
        if (!팬질.끔) {                      // 6px 문턱 — 톡 치려다 화면이 밀리지 않게
            if (Math.abs(dx) <= 6 && Math.abs(dy) <= 6) return;
            팬질.끔 = true;
            뷰.classList.add('끌림');
        }
        팬x = 팬질.첫팬x + dx; 팬y = 팬질.첫팬y + dy;
        재기();                              // 자리(%)는 그대로다 — 다시 그릴 것이 없다
    }, true);

    const 손뗌 = e => {

            자질 = null;
            try { 뷰.releasePointerCapture(e.pointerId); } catch (err) {}
            if (!끔) { 잰금 = null; 자그리기(); 잰것알리기(); }   // 톡 치면 금을 지운다
            return;
        }
        if (손들.size < 2 && 핀치) { 핀치 = null; 그리기(); }   // 떼고 나서 온전히 다시 그린다
        if (!팬질 || e.pointerId !== 팬질.pid) return;
        const 끔 = 팬질.끔;
        팬질 = null;
        뷰.classList.remove('끌림');
        try { 뷰.releasePointerCapture(e.pointerId); } catch (err) {}

    뷰.addEventListener('pointercancel', 손뗌, true);

    /* ═══ 벌 바꾸기 ═══════════════════════════════════════════════════
       사장님 말씀(10-07): 「현재 편성된 도면은 그대로 두고 … 실제 사이즈를
       인지하고 있는 도면을 하나 더 그려줘」.

    const 벌단추 = $('l-sheet');

    }

    });

    /* ═══ 자로 재기 ═══════════════════════════════════════════════════
       사장님 말씀(10-10): 「배치도면 안에서 치수를 잴 수 있게 해줘」.

       쓰는 길 — 「📐 재기」 를 켜고 **두 점을 잡아 끈다.** 끄는 동안 수가 살아서
       바뀌고, 떼면 그 금이 남는다. 다시 끌면 새로 잰다. 끄면 금이 없어진다.

       ⚠ **모서리·벽에 붙는다.** 손가락 하나는 이 자에서 20mm 가 넘는다. 안 붙게
          두면 「기계와 벽 사이 2.0m」 를 영영 못 맞춘다. 가로는 가로끼리, 세로는
          세로끼리 따로 붙인다 — 그래야 「옆으로 몇 m · 위아래로 몇 m」 가 깔끔히
          떨어진다. 붙을 데가 없으면 10mm 눈금에 떨어뜨린다.
       ⚠ 재는 동안에는 기계가 안 잡힌다. 거둠(capture) 단계에서 손짓을 가로채
          기계·손잡이에 닿기 전에 자가 먼저 받는다 — 재다가 기계가 밀리면
          배치가 망가진다. */
    let 재는중 = false;
    let 잰금 = null;           // { ax, ay, bx, by } — **참 자리(mm)** 다
    let 자질 = null;           // 끄는 중
    const 붙는자리 = 14;        // 화면에서 이만큼 안이면 모서리에 붙는다(px)
    /* ⚠ 붙는 거리에 **천장을 둔다.** 전체 보기에서는 화면 14px 이 3m 라,
       3m 떨어진 모서리로 끌려가 잰 수가 몰래 몇 m 씩 달라졌다. 재는 자가
       그러면 안 된다. 600mm 를 넘겨 끌어가지 않는다(10-10 에 재어서 잡았다). */
    const 붙는끝 = 600;         // mm
    const 자판 = $('l-ruler');

    /* 참 자리(mm) → 바닥 안에서의 % 자리. 돌리기를 함께 셈한다
       (자리넣기() 가 네모에 하는 것과 같은 셈을 점 하나에 한다) */
    const 점퍼센트 = (x, y) => 돌림
        ? { 왼: (바닥.세로 - y) / 바닥.세로 * 100, 위: x / 바닥.가로 * 100 }
        : { 왼: x / 바닥.가로 * 100,               위: y / 바닥.세로 * 100 };
    /* 손가락이 짚은 화면 자리 → 참 자리(mm). 위의 거꾸로다 */
    function 짚은점(clientX, clientY) {
        const f = 바닥판.getBoundingClientRect();
        const fx = clientX - f.left, fy = clientY - f.top;
        const x = 돌림 ? fy / 배율 : fx / 배율;
        const y = 돌림 ? 바닥.세로 - fx / 배율 : fy / 배율;
        return { x: Math.max(0, Math.min(바닥.가로, x)), y: Math.max(0, Math.min(바닥.세로, y)) };
    }
    /* 붙을 자리 — 네모의 네 변과 바닥의 네 변.
       ⚠ **곁에 있는 것에만 붙는다.** 처음에는 도면 전체의 변을 모아 두고 썼더니,
          y 로 20m 떨어진 딴 기계의 변에 가로가 끌려갔다 — 사장님 눈에는 아무
          까닭 없이 수가 9cm 틀어진 것으로 보인다(10-10 에 시험이 잡아냈다).
          그래서 **짚은 자리를 가로지르는 네모의 변만** 본다. 벽처럼 길게 걸친
          것은 어디서나 걸리니 「기계와 벽 사이」 는 그대로 잘 붙는다. */
    let 붙을네모 = [];
    function 붙을자리모으기() {
        붙을네모 = [];
        기계들.forEach(m => 칸들(m, m.x, m.y).forEach(c => 붙을네모.push(c)));
        (벌.벽 || []).forEach(([w, h, x, y]) => 붙을네모.push({ x, y, w, h }));
        붙을네모.push({ x: 0, y: 0, w: 바닥.가로, h: 바닥.세로 });     // 바닥 네 변
    }
    function 붙이기(점) {
        const 틈 = Math.min(붙는끝, 붙는자리 / (배율 || 1));   // 화면 14px 과 600mm 중 작은 쪽
        let sx = null, sy = null, 짧x = 틈, 짧y = 틈;
        붙을네모.forEach(c => {
            // 가로 변은 **그 네모의 세로 자리를 짚었을 때만** 걸린다 (틈만큼 넉넉히)
            if (점.y >= c.y - 틈 && 점.y <= c.y + c.h + 틈) {
                [c.x, c.x + c.w].forEach(t => { const d = Math.abs(t - 점.x);
                    if (d < 짧x) { 짧x = d; sx = t; } });
            }
            if (점.x >= c.x - 틈 && 점.x <= c.x + c.w + 틈) {
                [c.y, c.y + c.h].forEach(t => { const d = Math.abs(t - 점.y);
                    if (d < 짧y) { 짧y = d; sy = t; } });
            }
        });
        return { x: sx === null ? Math.round(점.x / 눈금) * 눈금 : sx,
                 y: sy === null ? Math.round(점.y / 눈금) * 눈금 : sy,
                 붙었나: sx !== null || sy !== null };
    }
    /* 금을 긋는다 — 가로·세로 결까지 함께 그어 「옆으로 얼마 · 위아래로 얼마」 가 보인다 */
    function 자그리기() {
        바닥판.querySelectorAll('.ljaa, .ljab').forEach(e => e.remove());
        if (!잰금) return;
        const A = 점퍼센트(잰금.ax, 잰금.ay), B = 점퍼센트(잰금.bx, 잰금.by);
        const ns = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('class', 'ljaa');
        svg.dataset.area = '잰금';
        const 긋기 = (x1, y1, x2, y2, 갈) => {
            const l = document.createElementNS(ns, 'line');
            l.setAttribute('x1', x1 + '%'); l.setAttribute('y1', y1 + '%');
            l.setAttribute('x2', x2 + '%'); l.setAttribute('y2', y2 + '%');
            l.setAttribute('class', 갈); svg.appendChild(l);
        };
        긋기(A.왼, A.위, B.왼, A.위, '결');
        긋기(B.왼, A.위, B.왼, B.위, '결');
        긋기(A.왼, A.위, B.왼, B.위, '몸');
        [[A.왼, A.위], [B.왼, B.위]].forEach(([cx, cy]) => {
            const c = document.createElementNS(ns, 'circle');
            c.setAttribute('cx', cx + '%'); c.setAttribute('cy', cy + '%');
            c.setAttribute('r', '4'); svg.appendChild(c);
        });
        바닥판.appendChild(svg);
        const 딱지 = document.createElement('div');
        딱지.className = 'ljab';
        딱지.dataset.area = '잰수';
        딱지.style.left = (A.왼 + B.왼) / 2 + '%';
        딱지.style.top  = (A.위 + B.위) / 2 + '%';
        딱지.textContent = 미터(잰길이()) + ' m';
        바닥판.appendChild(딱지);
    }
    const 잰길이 = () => 잰금
        ? Math.round(Math.hypot(잰금.bx - 잰금.ax, 잰금.by - 잰금.ay)) : 0;
    function 잰것알리기() {
        if (!잰금) { 쪽지.textContent = '두 점을 잡아 끌면 그 사이를 잽니다'; return; }
        const dx = Math.abs(잰금.bx - 잰금.ax), dy = Math.abs(잰금.by - 잰금.ay);
        /* 모서리에 붙여 잰 것인지 적는다 — 붙었으면 그 수는 **딱 떨어지는 참값**이고,
           안 붙었으면 손가락이 짚은 자리라 10mm 눈금까지다. 사장님이 알고 보셔야 한다. */
        const 붙음 = (잰금.a붙음 ? 1 : 0) + (잰금.b붙음 ? 1 : 0);
        쪽지.textContent = '잰 길이 ' + 미터(잰길이()) + ' m'
            + ' — 옆으로 ' + 미터(dx) + ' · 위아래로 ' + 미터(dy) + ' m'
            /* 발은 한 줄이라 길면 …로 잘린다. 수가 먼저고 붙음 알림은 짧게 */
            + (붙음 === 2 ? ' · 모서리에 붙음' : 붙음 === 1 ? ' · 한쪽만 붙음' : '');
    }
    function 자켜기(켤까) {

        자판.setAttribute('aria-pressed', String(재는중));
        뷰.classList.toggle('재는중', 재는중);
        if (재는중) { 붙을자리모으기(); 잰것알리기(); }
        else { 잰금 = null; 자질 = null; 자그리기();
               쪽지.textContent = '자를 치웠습니다'; }
    }
    자판.addEventListener('click', () => 자켜기(!재는중));

    /* ═══ 속성 판 — 두 번 톡 치면 뜬다 ════════════════════════════════
       사장님 말씀(10-10): 「더블클릭 속성입력 창 기능 안 나타나」.
       그런 창은 없었다(바닥 크기 판 하나뿐이었다). 그래서 짓는다.

       여기서 고치는 것 — 이름 · 갈래 · 가로 · 세로 · 왼쪽벽에서 · 위벽에서 · 각.
       사장님이 「하나씩 지정해서 규칙을 알려줄게」 하셨으니, 이름 없는 네모
       아흔셋에 이름을 달고 갈래를 바로잡는 자리가 바로 이 판이다.

       ⚠ 두 번 짚기를 **손으로 센다.** 아이폰에서 dblclick 은 touch-action:none
          과 손가락 거둠(pointer capture)을 쓰면 안 나는 일이 있다. 그래서
          「같은 네모를 400ms 안에 두 번, 끌지 않고 톡」 으로 셈한다.
       ⚠ 덩이는 크기를 못 고친다 — 테만 늘리면 품은 조각은 그대로라 「모양 유지」
          가 깨진다(합치기() 에 적어 둔 그 까닭이다). 이름·갈래·자리·각만 연다. */
    const 속성판 = $('l-prop-sheet'), 속성쪽지 = $('l-prop-msg');
    const 속칸 = { 이름: $('l-p-name'), 가로: $('l-p-w'), 세로: $('l-p-h'),
                   x: $('l-p-x'), y: $('l-p-y') };
    let 속성대상 = null;          // 고치고 있는 것의 id
    let 첫글 = {};                // 판을 열었을 때 칸에 들어 있던 글
    let 고른갈래 = '기', 고른각 = 0;
    const 갈래단추 = [['기', '기계'], ['파', '파레트'], ['둥', '기둥'], ['방', '방'],
                      ['문', '문'], ['원', '원'], ['밖', '홀 밖'], ['몰', '모름']];

    function 고르개만들기(통, 들, 지금, 고름) {
        통.innerHTML = '';
        들.forEach(([값, 글]) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = 글;
            b.dataset.값 = String(값);
            b.dataset.area = 통.dataset.area + ':' + 글;
            b.setAttribute('aria-pressed', String(값 === 지금));
            b.addEventListener('click', () => {
                [...통.children].forEach(c => c.setAttribute('aria-pressed',
                    String(c.dataset.값 === String(값))));
                고름(값);
            });
            통.appendChild(b);
        });
    }

    function 속성판열기(id) {
        if (재는중) return;              // 자를 켜 두셨으면 지금은 재는 중이다
        const m = 기계들.find(x => x.id === id);
        if (!m) return;
        속성대상 = id;
        const 덩이냐 = !!(m['조각'] && m['조각'].length);
        $('l-prop-who').textContent = 덩이냐 ? '— 덩이 (조각 ' + m['조각'].length + '개)' : '';
        속칸.이름.value = m.이름 || '';
        속칸.이름.placeholder = 부를이름(m);
        속칸.가로.value = 미터칸값(m.가로);
        속칸.세로.value = 미터칸값(m.세로);
        속칸.x.value = 미터칸값(m.x);
        속칸.y.value = 미터칸값(m.y);
        /* ⚠ 열었을 때의 글을 적어 둔다. **손대지 않은 칸은 건드리지 않는다** —
           미터로 보이는 수는 10mm 눈금까지라, 그냥 다시 읽으면 캐드 참값
           734mm 가 730mm 로 밀린다. 이름만 고치셨는데 자리가 4mm 틀어지면
           「도면과 1:1」 이 깨진다(10-10 에 재어서 잡았다). */
        첫글 = { 가로: 속칸.가로.value, 세로: 속칸.세로.value,
                 x: 속칸.x.value, y: 속칸.y.value };
        속칸.가로.disabled = 속칸.세로.disabled = 덩이냐;
        고른갈래 = m['갈래'] || '기';
        고른각 = 각의(m);
        고르개만들기($('l-p-kind'), 갈래단추, 고른갈래, v => { 고른갈래 = v; });
        고르개만들기($('l-p-ang'), [[0, '0°'], [90, '90°'], [180, '180°'], [270, '270°']],
                     고른각, v => { 고른각 = v; });
        속성쪽지.className = 'lcmsg';
        속성쪽지.textContent = 덩이냐
            ? '덩이는 크기를 못 고칩니다 — 먼저 되돌리십시오'
            : '벽이나 다른 기계에 닿으면 거기서 섭니다';
        속성판.hidden = false;

    }
    const 속성판닫기 = () => { 속성판.hidden = true; 속성대상 = null; };

    function 속성넣기() {
        const m = 기계들.find(x => x.id === 속성대상);
        if (!m) { 속성판닫기(); return; }
        const 덩이냐 = !!(m['조각'] && m['조각'].length);
        /* 손대지 않은 칸은 **본래 mm 값 그대로** 쓴다(까닭은 속성판열기() 에) */
        const 읽기 = (칸, 본래) => 속칸[칸].value === 첫글[칸]
            ? 본래 : 미터읽기(속칸[칸].value);
        const 값 = { 가로: 읽기('가로', m.가로), 세로: 읽기('세로', m.세로),
                     x: 읽기('x', m.x), y: 읽기('y', m.y) };
        const 나쁜것 = Object.entries(값).filter(([k, v]) =>
            !Number.isFinite(v) || ((k === '가로' || k === '세로') && !덩이냐 && v < 기계최소));
        if (나쁜것.length) {
            속성쪽지.className = 'lcmsg 나쁨';
            속성쪽지.textContent = 나쁜것.map(([k]) => k).join('·') + ' 를 미터로 넣어 주십시오'
                + ' (가장 작은 크기 ' + 미터(기계최소) + ' m)';
            return;
        }
        const 전 = { 가로: m.가로, 세로: m.세로, x: m.x, y: m.y, 각: 각의(m), 갈래: m['갈래'] };
        m.이름 = 속칸.이름.value.trim();
        m['갈래'] = 고른갈래;
        m['각'] = 고른각;
        if (!덩이냐) { m.가로 = 값.가로; m.세로 = 값.세로; }
        /* 자리는 **벽 안으로만** 들인다. 눈금에 떨어뜨리지 않는다 — 캐드 참값은
           눈금에 안 떨어지는 것이 있어, 넣은 수가 몰래 밀리면 안 된다. */
        const 들이기 = (v, 끝) => Math.max(0, Math.min(Math.max(0, 끝), v));
        const 갈x = 들이기(값.x, 바닥.가로 - 폭(m)), 갈y = 들이기(값.y, 바닥.세로 - 높(m));
        const 푼것 = 풀기(m, 갈x, 갈y);
        m.x = 푼것.x; m.y = 푼것.y;
        /* 넣은 대로 못 간 데가 있으면 그렇게 알린다 — 몰래 다른 수가 되면 안 된다 */
        const 밀림 = Math.abs(m.x - 값.x) > 0.5 || Math.abs(m.y - 값.y) > 0.5;
        속성판닫기();
        재기(); 그리기(); 저장(true);
        고르기(m.id);
        쪽지.textContent = 부를이름(m) + ' — '
            + 미터(m.가로) + ' × ' + 미터(m.세로) + ' m · 왼쪽벽 ' + 미터(m.x)
            + ' · 위벽 ' + 미터(m.y) + ' m'
            + (고른각 ? ' · ' + 고른각 + '°' : '')
            + (밀림 ? ' (벽이나 다른 기계에 막혀 ' + 미터(값.x) + ',' + 미터(값.y)
                      + ' 까지는 못 갔습니다)' : '');
        if (전.가로 === m.가로 && 전.세로 === m.세로 && 전.x === m.x && 전.y === m.y
            && 전.각 === 각의(m) && 전.갈래 === m['갈래']) { /* 이름만 바뀐 것도 담긴다 */ }
    }
    $('l-prop-no').addEventListener('click', 속성판닫기);
    $('l-prop-ok').addEventListener('click', 속성넣기);
    속성판.addEventListener('click', e => { if (e.target === 속성판) 속성판닫기(); });

    /* ── 열기 ──────────────────────────────────────────────────────── */
    /* 보고 계시던 벌로 연다 */
    try {
        const 본벌 = 벌목록.find(v => v.코드 === localStorage.getItem(벌열쇠));
        if (본벌) { 벌 = 본벌; 바닥 = { ...벌.처음바닥 }; 기계들 = 벌.처음것.map(m => ({ ...m })); }
    } catch (e) {}
    폰에서읽기();                                   // 담긴 것이 있으면 그것으로, 없으면 처음 배치로
    벌단추고치기();
    단추고치기();
    재기();
    그리기();
    /* 화면이 돌아가거나 글자 크기가 바뀌면 다시 잰다. 자리(mm)는 그대로다 */
    let 다시시계 = null;
    const 다시 = () => {
        clearTimeout(다시시계);
        다시시계 = setTimeout(() => { 재기(); 그리기(); }, 120);
    };
    addEventListener('resize', 다시);
    addEventListener('orientationchange', 다시);
    /* ── 창이 바뀌면 스스로 다시 잰다 ──────────────────────────────────
       위의 발 한 줄 못박기로 지금은 창이 흔들리지 않는다. 그래도 지켜본다 —
       글자 크기를 바꾸시거나 손잡이 판이 떠서 창이 한 px 이라도 달라지면,
       바닥은 옛 창에 맞춰진 채로 남아 **변 손잡이가 창에 잘린다.** 그 탈이
       다시 날 수 없게 못을 하나 더 박는다(자리(%)는 그대로라 다시 맞추기만 한다). */
    if (window.ResizeObserver) {
        let 옛폭 = 0, 옛높 = 0;
        new ResizeObserver(() => {
            const w = 뷰.clientWidth, h = 뷰.clientHeight;
            if (!(w > 0) || !(h > 0)) return;
            if (Math.abs(w - 옛폭) < 1 && Math.abs(h - 옛높) < 1) return;
            옛폭 = w; 옛높 = h;
            다시맞추기();
        }).observe(뷰);
    }
    /* 창고가 우리보다 먼저 붙었을 수도 있다 — 그때는 위 모듈이 부르지 못했으니 여기서 부른다 */
    if (window.fbFirestore && window.db) window.layoutCloudSync();
})();
</script>
