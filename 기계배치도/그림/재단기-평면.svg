<?xml version="1.0" encoding="UTF-8"?>
<!-- 재단기 — 하늘에서 직각으로 내려다본 평면도 (정투상)
     바탕 없음 · 격자 없음 · 기계만.
     viewBox 가 곧 mm 다 — 6400 × 3800mm. 치수가 다르면 이 두 수만 고치면 된다.
     위쪽(y=0)이 기계 뒤, 아래쪽(y=3800)이 사람이 서는 앞이다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 6400 3800"
     width="6400" height="3800" role="img" aria-label="재단기 평면도">
  <title>재단기 평면도</title>
  <g fill="#FFFFFF" stroke="#111110" stroke-width="26"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- ── 뒤쪽 전장함 둘 ─────────────────────────────── -->
    <rect x="430"  y="40" width="1120" height="660" rx="18" fill="#F0F0EE"/>
    <rect x="4980" y="40" width="1120" height="660" rx="18" fill="#F0F0EE"/>

    <!-- ── 본체 베드(기계 몸통) ───────────────────────── -->
    <rect x="60" y="560" width="6280" height="1560" rx="24" fill="#FAFAF9"/>
    <!-- 좌우 레일 — 갠트리가 타고 다니는 길 -->
    <rect x="120" y="620" width="6160" height="150" fill="#EDEDEB"/>
    <rect x="120" y="1910" width="6160" height="150" fill="#EDEDEB"/>

    <!-- ── 슬랫 테이블(자르는 판) ─────────────────────── -->
    <rect x="1010" y="830" width="3890" height="1020" fill="#F6F6F4"/>
    <g stroke="#111110" stroke-width="14">
      <path d="M1010 950H4900M1010 1070H4900M1010 1190H4900M1010 1310H4900
               M1010 1430H4900M1010 1550H4900M1010 1670H4900M1010 1790H4900"/>
    </g>

    <!-- ── 갠트리 빔 — 테이블을 가로질러 앞뒤로 걸쳐 있다 ── -->
    <rect x="2850" y="580" width="700" height="1520" rx="14" fill="#DEDEDA"/>
    <rect x="2940" y="640" width="520" height="1400" rx="10" fill="#EFEFEC"/>
    <!-- 토치 헤드 -->
    <rect x="3040" y="1180" width="320" height="320" rx="36" fill="#FFFFFF"/>
    <circle cx="3200" cy="1340" r="78" fill="#111110" stroke="none"/>

    <!-- ── 오른쪽 경사 유닛(환기구 달린 것) ───────────── -->
    <rect x="5020" y="800" width="900" height="1080" rx="18" fill="#F0F0EE"/>
    <g stroke="#111110" stroke-width="14" fill="none">
      <path d="M5120 940H5560M5120 1030H5560M5120 1120H5560M5120 1210H5560"/>
    </g>

    <!-- ── 앞으로 나온 컨베이어 셋 + 수레 셋 ──────────── -->
    <g>
      <!-- 왼 -->
      <rect x="1340" y="2100" width="720" height="870" fill="#F6F6F4"/>
      <g stroke="#111110" stroke-width="14">
        <path d="M1340 2230H2060M1340 2360H2060M1340 2490H2060M1340 2620H2060M1340 2750H2060M1340 2880H2060"/>
      </g>
      <rect x="1230" y="2970" width="940" height="680" rx="16" fill="#F0F0EE"/>
      <circle cx="1330" cy="3070" r="52"/><circle cx="2070" cy="3070" r="52"/>
      <circle cx="1330" cy="3550" r="52"/><circle cx="2070" cy="3550" r="52"/>
      <!-- 가운데 -->
      <rect x="2840" y="2100" width="720" height="870" fill="#F6F6F4"/>
      <g stroke="#111110" stroke-width="14">
        <path d="M2840 2230H3560M2840 2360H3560M2840 2490H3560M2840 2620H3560M2840 2750H3560M2840 2880H3560"/>
      </g>
      <rect x="2730" y="2970" width="940" height="680" rx="16" fill="#F0F0EE"/>
      <circle cx="2830" cy="3070" r="52"/><circle cx="3570" cy="3070" r="52"/>
      <circle cx="2830" cy="3550" r="52"/><circle cx="3570" cy="3550" r="52"/>
      <!-- 오른 -->
      <rect x="4340" y="2100" width="720" height="870" fill="#F6F6F4"/>
      <g stroke="#111110" stroke-width="14">
        <path d="M4340 2230H5060M4340 2360H5060M4340 2490H5060M4340 2620H5060M4340 2750H5060M4340 2880H5060"/>
      </g>
      <rect x="4230" y="2970" width="940" height="680" rx="16" fill="#F0F0EE"/>
      <circle cx="4330" cy="3070" r="52"/><circle cx="5070" cy="3070" r="52"/>
      <circle cx="4330" cy="3550" r="52"/><circle cx="5070" cy="3550" r="52"/>
    </g>

    <!-- ── 조작반(HMI) — 팔에 달려 왼쪽 앞으로 나와 있다 ── -->
    <path d="M900 640 L 430 1500 L 650 2200" fill="none" stroke-width="150"
          stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M900 640 L 430 1500 L 650 2200" fill="none" stroke="#EDEDEB"
          stroke-width="96" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="430" cy="1500" r="86" fill="#FFFFFF"/>
    <rect x="200" y="2150" width="900" height="620" rx="40" fill="#F0F0EE"/>
    <rect x="300" y="2250" width="700" height="380" rx="16" fill="#FFFFFF"/>
    <g fill="#111110" stroke="none">
      <circle cx="400" cy="2690" r="34"/><circle cx="520" cy="2690" r="34"/>
      <circle cx="640" cy="2690" r="34"/><circle cx="760" cy="2690" r="34"/>
      <circle cx="880" cy="2690" r="34"/>
    </g>
  </g>
</svg>
