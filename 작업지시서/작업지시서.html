<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작업지시서 발행</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --ink:#111110; --body:#2E2E2C; --muted:#6E6E6A; --soft:#9B9B96;
  --line:#E3E2DF; --edge:#EDEDEA; --fill:#F4F4F2; --bg:#FAFAF8; --red:#D9342B;
  --bar:52px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--body);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}

/* ── 머리 ─────────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:8px;padding:8px 12px}
.top .row.two{padding-top:0;overflow-x:auto;scrollbar-width:none}
.top .row.two::-webkit-scrollbar{display:none}
.brand{font-weight:800;letter-spacing:-.3px;font-size:15px;white-space:nowrap;flex:none}
.docname{flex:1;min-width:0;border:1px solid var(--edge);border-radius:9px;padding:7px 10px;
  font-size:14px;font-weight:700;background:#fff}
.docname:focus{outline:none;border-color:var(--ink)}
.b{flex:none;border:1px solid var(--edge);background:#fff;border-radius:9px;padding:7px 11px;
  font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}
.b:active{background:var(--fill)}
.b.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.b.go{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}

/* ── 종이 ─────────────────────────────────────────────── */
/* 가운데 정렬을 flex 로 하면 종이가 칸보다 넓어지는 순간 왼쪽으로 밀려 잘린다.
   블록 + margin auto 로 두고, 넘칠 때만 가로로 밀어 본다. */
/* flex 가운데 정렬은 내용이 칸보다 넓어지면 왼쪽 넘침에 스크롤이 안 닿는다.
   왼쪽 붙이기로 두고 .wrap 의 auto 여백으로 가운데를 맞춘다 */
.stage{padding:14px 12px 120px;overflow-x:auto;display:flex;flex-direction:column;
  align-items:flex-start;gap:18px}
.wrap{position:relative;margin-inline:auto}
.wrap.now .sheet{border-color:var(--ink)}
.pageno{position:absolute;left:0;right:0;bottom:-15px;text-align:center;font-size:11px;
  color:var(--muted);pointer-events:none}
/* 장마다 지우는 단추 — 불러온 자료가 장을 여럿 만들면 그 장을 바로 지운다 */
.pagedel{position:absolute;right:0;bottom:-19px;border:1px solid var(--edge);background:#fff;
  color:var(--soft);border-radius:8px;padding:1px 7px;font:11px/1.7 inherit;cursor:pointer}
/* 줄여 보여 줄 때 자리가 밀리지 않게 왼쪽 위를 기준으로 줄인다 (가운데 기준이면
   줄인 만큼 오른쪽으로 밀려 종이가 화면 밖으로 나간다) */
.sheet{position:relative;background:#fff;border:1px solid var(--line);
  box-shadow:0 2px 14px rgba(0,0,0,.06);transform-origin:top left;overflow:hidden}
.sheet.p{width:210mm;height:297mm}
.sheet.l{width:297mm;height:210mm}

/* touch-action 이 없으면 손가락으로 끌 때 브라우저가 화면 스크롤로 가져간다.
   pointerdown 의 preventDefault 로는 못 막는다 — 아이폰에서 옮기기가 아예 안 됐다 */
.it{position:absolute;box-sizing:border-box;touch-action:none}
/* 빈 자리를 칸으로 나눠 둔다. 눈에는 안 보이고, 길게 눌러 짚으면
   "2장 위 왼쪽" 처럼 어느 자리인지가 지시에 함께 실린다.
   항목보다 아래(z-index 0)에 있어 항목을 짚는 데는 방해가 안 된다. */
.zone{position:absolute;z-index:0;background:transparent}
/* 격자는 늘 깔려 있지만 눈에는 없다. 손으로 짚은 그 칸만 드러난다 —
   손잡이(viggle.js)가 짚은 것에 vg-mark 를 붙이므로 그것을 기준으로 삼는다.
   인쇄·PDF 에는 아예 나오지 않는다(아래 @media print). */
.sheet.짚기 .zone.vg-mark::after{content:attr(data-nm);position:absolute;left:2mm;top:1.5mm;
  font-size:2.6mm;color:rgba(17,17,16,.55)}
.it.sel{outline:1.5px solid var(--ink);outline-offset:1px}
.it img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.it .tx{width:100%;height:100%;padding:2mm;border:0;background:transparent;resize:none;
  outline:none;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.it .cap{position:absolute;left:0;right:0;bottom:-4.6mm;font-size:2.6mm;color:var(--muted);
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grip{position:absolute;right:-9px;bottom:-9px;width:20px;height:20px;border-radius:50%;
  background:var(--ink);border:2px solid #fff;cursor:nwse-resize;touch-action:none;
  transform:scale(var(--되키움,1));transform-origin:center}
.del{position:absolute;left:-9px;top:-9px;width:20px;height:20px;border-radius:50%;
  background:#fff;border:1.5px solid var(--ink);color:var(--ink);font-size:12px;line-height:1;
  display:grid;place-items:center;cursor:pointer;touch-action:none;
  transform:scale(var(--되키움,1));transform-origin:center}
/* 종이 가장자리에 붙은 항목의 손잡이가 잘리지 않게 한 칸 물러선다 */
.it.sel .grip{right:2px;bottom:2px}
.it.sel .del{left:2px;top:2px}

/* ── 아래 도구 ─────────────────────────────────────────── */
.tools{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;
  border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools .b{min-height:40px}
.hint{padding:10px 14px;color:var(--muted);font-size:12.5px;text-align:center}
.warn{position:sticky;top:0;z-index:45;background:var(--red);color:#fff;font-size:13px;
  font-weight:700;padding:9px 14px;text-align:center;line-height:1.45}

/* ── 판 ───────────────────────────────────────────────── */
.sheetpad{position:fixed;inset:0;z-index:60;background:rgba(17,17,16,.35);display:none;
  align-items:flex-end}
.sheetpad.on{display:flex}
.card{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px 16px
  calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto}
.card h4{margin:0 0 10px;font-size:15px}
.card .line{display:flex;align-items:center;gap:8px;margin:8px 0}
.card label{flex:none;width:76px;font-size:13px;color:var(--muted)}
.card input[type=range]{flex:1}
.card .num{width:56px;text-align:right;font-size:13px;color:var(--muted)}
.docs{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.docs button{text-align:left;border:1px solid var(--edge);background:#fff;border-radius:10px;
  padding:10px 12px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.docs .when{color:var(--muted);font-size:12px;flex:none}

/* ── 인쇄 ─────────────────────────────────────────────── */
@page{size:A4 portrait;margin:0}
@media print{
  html,body{background:#fff}
  .top,.tools,.hint,.sheetpad,.grip,.del,.pageno,.pagedel,.zone,.warn{display:none !important}
  .stage{padding:0;display:block;gap:0}
  .wrap{width:auto !important;height:auto !important;margin:0}
  .sheet{border:0;box-shadow:none;transform:none !important;margin:0;break-after:page}
  .wrap:last-child .sheet{break-after:auto}
  .it.sel{outline:0}
}
</style>
</head>
<body>

<div class="top">
  <div class="row">
    <span class="brand">작업지시서</span>
    <input class="docname" id="docname" placeholder="지시서 이름" value="작업지시서">
    <button class="b go" id="print">인쇄 · PDF</button>
  </div>
  <div class="row two">
    <div class="seg" id="orient">
      <button data-o="p" class="on">세로</button>
      <button data-o="l">가로</button>
    </div>
    <button class="b" id="load">파일</button>
    <button class="b" id="loadimg">사진</button>
    <button class="b" id="addtext">글상자</button>
    <button class="b" id="addline">구분선</button>
    <button class="b" id="tidy">자동 정렬</button>
    <button class="b" id="addpage">장 추가</button>
    <button class="b" id="delpage">이 장 지우기</button>
    <button class="b" id="docs">문서</button>
  </div>
</div>

<div class="warn" id="warn" hidden></div>
<div class="stage" id="stage"></div>

<p class="hint">A4 흰 바탕입니다. 자료를 불러와 끌어 옮기고, 오른쪽 아래 손잡이로 크기를 바꿉니다.<br>
자료를 골라 <b>다른 장으로 끌면</b> 그 장으로 넘어갑니다. 자료끼리 겹쳐 놓아도 됩니다.
장은 <b>삭제 ×</b> 로 지웁니다.<br>
PDF·PPT 를 불러오면 <b>한 장이 한 쪽</b>이 됩니다. 비율은 원본 그대로 지킵니다.<br>
인쇄 · PDF 를 누른 뒤 대상에서 <b>PDF로 저장</b>을 고르면 전체가 한 파일이 됩니다.</p>

<div class="tools">
  <button class="b" data-z="-">축소</button>
  <button class="b" data-z="+">확대</button>
  <button class="b" id="front">맨 앞으로</button>
  <button class="b" id="back">맨 뒤로</button>
  <button class="b" id="fitw">폭 맞춤</button>
  <span class="seg" id="nudge">
    <button data-n="left">◀</button>
    <button data-n="up">▲</button>
    <button data-n="down">▼</button>
    <button data-n="right">▶</button>
  </span>
  <button class="b" id="step">1mm</button>
  <button class="b" id="clear">모두 지우기</button>
</div>

<!-- 아이폰은 accept 에 image/* 가 섞여 있으면 "사진 보관함 / 사진 찍기 / 파일 선택"
     을 먼저 묻는다. 그 물음을 거치면 파일 앱이 기억하던 폴더도 흐트러진다.
     그래서 파일과 사진을 갈라 둔다 — 파일은 곧장 파일 앱으로 간다. -->
<input type="file" id="file" multiple accept="application/pdf,.pdf,.ppt,.pptx" hidden>
<input type="file" id="fileimg" multiple accept="image/*" hidden>

<div class="sheetpad" id="pad"><div class="card" id="padbody"></div></div>

<script src="../shared/viggle.js"></script>
<script>
/* ══ 작업지시서 — A4 여러 장 ═════════════════════════════
   자리·크기는 모두 mm 로 둔다. 화면에서는 줄여 보여 주고 인쇄할 때만 1:1 이
   되므로, px 로 두면 종이에서 어긋난다.

   한 문서는 여러 장이다. 예전에는 A4 한 장뿐이라 PDF·PPT 를 불러오면 그
   한 장에 모두 쌓였고, 아래로 갈수록 자리가 없어 눌리면서 비율이 깨졌다.
   이제 불러온 쪽 하나가 종이 한 장이 된다. */
const $ = id => document.getElementById(id);
const 무대 = $('stage');
const A4 = { p: [210, 297], l: [297, 210] };
// 작업대에서 손잡이를 달고 연 경우에만 빈 자리 칸을 옅게 보여 준다
const 짚는중 = new URLSearchParams(location.search).get('viggle') === '1';
const 여백 = 10;                       // 불러온 쪽을 앉힐 때 두는 가장자리(mm)

let 문서 = 새문서();
let 고른것 = null, 지금장 = 0, 자리배율 = 1, 배율 = 1;

function 새문서(){ return { 이름: '작업지시서', 방향: 'p', 장들: [[]], 잰때: Date.now() }; }
function 지금크기(){ return A4[문서.방향]; }
const mm = v => v + 'mm';
const 새id = () => 'i' + Math.random().toString(36).slice(2, 9);
const px1mm = 96 / 25.4;

/* 옛 문서(한 장짜리)를 여러 장 모양으로 맞춘다 */
function 손질(d){
  if (!d) return 새문서();
  if (!d.장들) d.장들 = [d.것들 || []];
  delete d.것들;
  if (!Array.isArray(d.장들) || !d.장들.length) d.장들 = [[]];
  d.장들 = d.장들.map(z => Array.isArray(z) ? z : []);
  if (!A4[d.방향]) d.방향 = 'p';        // 방향이 없으면 지금크기() 가 터진다
  if (!d.이름) d.이름 = '작업지시서';
  return d;
}

/* ── 그리기 ─────────────────────────────────────────── */
function 그리기(){
  무대.innerHTML = '';
  문서.장들.forEach((것들, n) => {
    const wrap = document.createElement('div');
    wrap.className = 'wrap' + (n === 지금장 ? ' now' : '');
    const sh = document.createElement('div');
    sh.className = 'sheet ' + 문서.방향 + (짚는중 ? ' 짚기' : '');
    sh.dataset.p = n;
    칸나누기(sh, n);
    것들.forEach(it => sh.appendChild(만들기(it, n, sh)));
    sh.addEventListener('pointerdown', e => {
      지금장 = n;
      // 빈 자리를 누를 때 통째로 다시 그리면, 짚은 칸이 그 자리에서 사라진다.
      // 손잡이는 그 다음(mousedown)에 무엇을 짚었는지 읽으므로 자리를 잃는다.
      // 표시만 지운다.
      if (e.target === sh || e.target.classList.contains('zone')) 고름지우기();
      쪽표시();
    });
    const no = document.createElement('div');
    no.className = 'pageno';
    no.textContent = `${n + 1} / ${문서.장들.length}`;
    const 지움 = document.createElement('button');
    지움.type = 'button'; 지움.className = 'pagedel';
    지움.textContent = '삭제 ×';
    지움.addEventListener('click', e => { e.stopPropagation(); 장지우기(n); });
    wrap.appendChild(sh); wrap.appendChild(no); wrap.appendChild(지움);
    무대.appendChild(wrap);
  });
  맞추기();
}
/* 종이를 세로 넷 × 가로 셋으로 나눠 둔다. 자리 이름과 mm 자리를 함께 적어
   두어, 짚어서 지시할 때 "2장 위 왼쪽 35,37mm" 처럼 어디인지가 실린다. */
const 세로이름 = ['위', '중상', '중하', '아래'];
const 가로이름 = ['왼쪽', '가운데', '오른쪽'];
function 칸나누기(sh, 장번호){
  const [W, H] = 지금크기();
  const 칸W = W / 3, 칸H = H / 4;
  for (let r = 0; r < 4; r++){
    for (let c = 0; c < 3; c++){
      const z = document.createElement('div');
      z.className = 'zone';
      z.style.left = mm(c * 칸W); z.style.top = mm(r * 칸H);
      z.style.width = mm(칸W); z.style.height = mm(칸H);
      const 이름 = `${장번호 + 1}장 ${세로이름[r]} ${가로이름[c]}`;
      z.dataset.nm = 이름;
      // 손잡이(viggle.js)가 짚은 것의 글자를 그대로 읽어 간다
      z.textContent = `${이름} ${Math.round((c + .5) * 칸W)},${Math.round((r + .5) * 칸H)}mm`;
      z.style.color = 'transparent';
      z.style.fontSize = '1px';
      sh.appendChild(z);
    }
  }
}

function 쪽표시(){
  [...무대.children].forEach((w, n) => w.classList.toggle('now', n === 지금장));
}
/* 고른 것을 놓는다 — 무대를 다시 그리지 않고 표시와 손잡이만 뺀다 */
function 고름지우기(){
  고른것 = null;
  무대.querySelectorAll('.it.sel').forEach(el => {
    el.classList.remove('sel');
    el.querySelectorAll('.grip,.del').forEach(x => x.remove());
  });
}

function 만들기(it, 장번호, sh){
  const el = document.createElement('div');
  el.className = 'it' + (고른것 === it.id ? ' sel' : '');
  el.dataset.id = it.id;
  el.style.left = mm(it.x); el.style.top = mm(it.y);
  el.style.width = mm(it.w); el.style.height = mm(it.h);
  el.style.zIndex = it.z || 1;

  if (it.종류 === 'img'){
    const img = document.createElement('img');
    img.src = it.src; el.appendChild(img);
    if (it.이름){ const c = document.createElement('span'); c.className = 'cap'; c.textContent = it.이름; el.appendChild(c); }
  } else if (it.종류 === 'line'){
    el.style.borderTop = '0.4mm solid #111110';
    el.style.height = '0.4mm';
  } else {
    const t = document.createElement('div');
    t.className = 'tx'; t.contentEditable = 'true'; t.textContent = it.글 || '';
    t.style.fontSize = (it.크기 || 4) + 'mm';
    t.style.fontWeight = it.굵게 ? '800' : '400';
    t.style.textAlign = it.정렬 || 'left';
    t.addEventListener('input', () => { it.글 = t.innerText; 저장(); });
    t.addEventListener('focus', () => { 지금장 = 장번호; 고르기(it.id); });
    el.appendChild(t);
  }

  if (고른것 === it.id) 손잡이달기(el, it, 장번호, sh);
  끌기(el, it, 'move', sh);
  el.addEventListener('pointerdown', () => { 지금장 = 장번호; 고르기(it.id); });
  return el;
}

/* 예전에는 고를 때마다 무대를 통째로 다시 그려서, 방금 만진 요소가 그 자리에서
   사라졌다. 그래서 글상자는 두 번 눌러야 키보드가 뜨고, 처음 잡은 손가락으로는
   끌리지 않았다. 이제 표시만 바꾸고 손잡이만 끼웠다 뺀다. */
function 고르기(id){
  if (고른것 === id){ 쪽표시(); return; }
  const 전 = 고른것; 고른것 = id;
  무대.querySelectorAll('.it.sel').forEach(el => {
    if (el.dataset.id === id) return;
    el.classList.remove('sel');
    el.querySelectorAll('.grip,.del').forEach(x => x.remove());
  });
  const el = 무대.querySelector('.it[data-id="' + id + '"]');
  if (!el){ 그리기(); return; }
  const 장번호 = +el.closest('.sheet').dataset.p;
  const it = (문서.장들[장번호] || []).find(x => x.id === id);
  if (!it){ 그리기(); return; }
  el.classList.add('sel');
  if (!el.querySelector('.grip')) 손잡이달기(el, it, 장번호, el.closest('.sheet'));
  쪽표시();
}

function 손잡이달기(el, it, 장번호, sh){

/* ── 끌어 옮기기 · 크기 바꾸기 ───────────────────────── */
/* 손가락 밑에 있는 종이 — 자료를 잡고 장을 넘나들 때 어디에 놓을지 가른다 */
function 밑의종이(x, y){
  return [...무대.querySelectorAll('.sheet')].find(s => {
    const r = s.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  });
}
/* 잡은 자료를 다른 장으로 넘긴다. 그 장의 맨 앞에 놓아, 이미 있던 것 위에 얹힌다 */
function 장넘기기(it, el, 옛sh, 새sh){
  const 옛장 = +옛sh.dataset.p, 새장 = +새sh.dataset.p;
  if (옛장 === 새장) return false;
  const 옛것들 = 문서.장들[옛장], 새것들 = 문서.장들[새장];
  if (!옛것들 || !새것들) return false;
  const i = 옛것들.indexOf(it);
  if (i < 0) return false;
  옛것들.splice(i, 1);
  it.z = 새것들.reduce((n, x) => Math.max(n, x.z || 1), 0) + 1;
  새것들.push(it);
  el.style.zIndex = it.z;
  새sh.appendChild(el);
  지금장 = 새장; 쪽표시();
  return true;
}

/* 손가락 따라가기는 문서에 건다. 요소에만 걸면, 자료를 다른 종이로 옮기는 순간
   pointer capture 가 풀려 그 뒤 움직임이 오지 않는다 — 장을 하나 넘고 멈췄다. */
function 끌기(el, it, 무엇, sh){
  let 시작 = null, 현재sh = sh, 잡은틈 = null, 장바뀜 = false;
  el.addEventListener('pointerdown', e => {
    if (무엇 === 'move' && e.target.closest('.grip,.del,.tx')) return;
    if (무엇 === 'move' && 고른것 !== it.id) return;      // 한 번 골라야 옮긴다
    e.preventDefault(); e.stopPropagation();
    el.setPointerCapture(e.pointerId);
    현재sh = el.closest('.sheet') || sh;
    // 자료 안 어디를 잡았는지 — 장을 넘어가도 잡은 자리가 그대로 따라온다
    const r = 현재sh.getBoundingClientRect();
    잡은틈 = { x: (e.clientX - r.left) / 배율 / px1mm - it.x,
               y: (e.clientY - r.top) / 배율 / px1mm - it.y };
    시작 = { x: e.clientX, y: e.clientY, iw: it.w, ih: it.h, 비: it.h / it.w };
    document.addEventListener('pointermove', 움직임);
    document.addEventListener('pointerup', 끝);
    document.addEventListener('pointercancel', 끝);
  });
  const 움직임 = e => {
    if (!시작) return;
    const [W, H] = 지금크기();
    if (무엇 === 'move'){
      // 손가락이 다른 종이 위로 가면 그 장으로 넘긴다
      const 새sh = 밑의종이(e.clientX, e.clientY);
      if (새sh && 새sh !== 현재sh && 장넘기기(it, el, 현재sh, 새sh)){ 현재sh = 새sh; 장바뀜 = true; }
      // 넘어간 종이를 기준으로 다시 잰다. 자리를 델타로 쌓으면 장을 넘을 때 튄다
      const r = 현재sh.getBoundingClientRect();
      it.x = Math.max(0, Math.min(W - it.w, (e.clientX - r.left) / 배율 / px1mm - 잡은틈.x));
      it.y = Math.max(0, Math.min(H - it.h, (e.clientY - r.top) / 배율 / px1mm - 잡은틈.y));
    } else {
      const dx = (e.clientX - 시작.x) / 배율 / px1mm;
      const dy = (e.clientY - 시작.y) / 배율 / px1mm;
      it.w = Math.max(8, Math.min(W - it.x, 시작.iw + dx));
      // 그림은 비율을 지킨다 — 늘리면 찌그러진다
      it.h = it.종류 === 'img' ? Math.min(H - it.y, it.w * 시작.비)
                               : Math.max(6, Math.min(H - it.y, 시작.ih + dy));
    }
    const box = 현재sh.querySelector('[data-id="' + it.id + '"]');
    if (box){ box.style.left = mm(it.x); box.style.top = mm(it.y);
              box.style.width = mm(it.w); box.style.height = mm(it.h); }
  };
  // 장을 넘었으면 다시 그린다 — 요소가 쥐고 있던 옛 장 번호를 새것으로 바꾼다
  function 끝(){
    document.removeEventListener('pointermove', 움직임);
    document.removeEventListener('pointerup', 끝);
    document.removeEventListener('pointercancel', 끝);
    if (!시작) return;
    시작 = null; 저장();
    if (장바뀜){ 장바뀜 = false; 고른것 = it.id; 그리기(); }
  }
}

/* ── 화면에 맞춰 줄이기 ─────────────────────────────── */
function 맞추기(){
  const [W, H] = 지금크기();
  const 폭px = W * px1mm, 높px = H * px1mm;
  const 쓸수있는 = Math.min(무대.clientWidth - 24, 1100);
  배율 = Math.min(1, 쓸수있는 / 폭px) * 자리배율;

  document.documentElement.style.setProperty('--되키움', (1 / Math.max(배율, .2)).toFixed(2));
  [...무대.children].forEach(wrap => {
    const sh = wrap.querySelector('.sheet');
    sh.style.transform = 'scale(' + 배율 + ')';
    wrap.style.width = (폭px * 배율) + 'px';

async function 넣기(f, 단추){
  const 확장 = (f.name.split('.').pop() || '').toLowerCase();
  if (f.type === 'application/pdf' || 확장 === 'pdf'){
    const 쪽들 = await pdf쪽(f, (i, n) => { if (단추) 단추.textContent = `읽는 중… ${i}/${n}쪽`; });
    if (!쪽들.length) return 알림쪽(f.name + ' — 이 PDF 를 읽지 못했습니다');
    쪽들.forEach(({ src, 비, 못함 }) => {
      if (못함) 알림쪽(`${f.name} ${못함}쪽 — 그리지 못했습니다`);
      else 쪽으로넣기(src, f.name, 비);
    });
    return;
  }
  if (/^image\//.test(f.type)){
    const src = await 읽기(f);
    const 비 = await 그림비(src);
    return 쪽으로넣기(src, f.name, 비);
  }
  if (확장 === 'ppt' || 확장 === 'pptx'){
    // 파워포인트 원본은 브라우저가 그려 낼 수 없다. 감추지 않고 그대로 말한다.
    return 알림쪽(f.name + ' — 파워포인트는 그대로 읽지 못합니다.\n' +
                  '파워포인트에서 PDF 로 내보낸 뒤 그 파일을 불러오세요.\n' +
                  '(아이폰: 공유 → 파일에 저장 대신 "PDF로 내보내기")');
  }
  알림쪽('[' + f.name + ']');
}

const 읽기 = f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
const 그림비 = src => new Promise(r => { const i = new Image(); i.onload = () => r(i.naturalHeight / i.naturalWidth); i.onerror = () => r(1); i.src = src; });

/* PDF 는 pdf.js 로 쪽마다 그림을 떠서 넣는다. 쪽 수는 자르지 않는다 —
   예전에는 10쪽에서 끊어 뒤가 통째로 사라졌다.

   그리는 칸(canvas)은 화면 밖에라도 문서에 붙여 둔다. 떼어 놓은 칸에
   그리면 브라우저가 화면 그리기를 미루면서 영영 안 끝나는 일이 있다.
   그래도 안 끝나는 쪽은 30초에서 끊고, 거기까지 읽은 것은 살린다. */
async function pdf쪽(f, 알리기){
  if (!window.pdfjsLib) return [];
  const 숨은칸 = document.createElement('div');
  숨은칸.style.cssText = 'position:fixed;left:-99999px;top:0;width:1px;height:1px;overflow:hidden';
  document.body.appendChild(숨은칸);
  const 나온것 = [];
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const doc = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
    for (let i = 1; i <= doc.numPages; i++){
      알리기 && 알리기(i, doc.numPages);
      const page = await doc.getPage(i);
      const 재기 = page.getViewport({ scale: 1 });
      // 긴 변이 2000px 을 넘지 않게 — 쪽이 많으면 자리(저장 공간)가 금방 찬다.
      // 예전에는 Math.max(1, 배) 로 감싸는 바람에 큰 도면(A0·큰 스캔본)에서만
      // 제한이 풀려 한 쪽이 몇 MB 씩 나왔다. 줄이는 쪽은 막지 않는다.
      const 배 = Math.max(0.25, Math.min(2, 2000 / Math.max(재기.width, 재기.height)));
      const vp = page.getViewport({ scale: 배 });
      const cv = document.createElement('canvas');
      cv.width = vp.width; cv.height = vp.height;
      숨은칸.appendChild(cv);
      const 일 = page.render({ canvasContext: cv.getContext('2d'), viewport: vp });
      let 늦음 = false;
      await Promise.race([일.promise.catch(() => {}),
                          new Promise(r => setTimeout(() => { 늦음 = true; r(); }, 30000))]);
      if (늦음){                                  // 이 쪽만 건너뛴다. 뒤쪽까지 버리지 않는다
        try { 일.cancel(); } catch (e){}
        cv.remove();
        나온것.push({ 못함: i, 비: vp.height / vp.width });
        continue;
      }
      나온것.push({ src: cv.toDataURL('image/jpeg', 0.85), 비: vp.height / vp.width });
      cv.remove();
      await new Promise(r => setTimeout(r, 0));   // 한 숨 돌려 브라우저가 숨 쉬게
    }
  } catch (e){ console.warn('PDF 읽기 실패', e); }
  숨은칸.remove();
  return 나온것;
}

  적용된인쇄방향();
  const [W, H] = 지금크기();
  문서.장들.forEach(것들 => 것들.forEach(it => {       // 종이 밖으로 나간 것은 끌어들인다
    const 비 = it.h / it.w;
    if (it.w > W - 4){ it.w = W - 4; if (it.종류 === 'img') it.h = it.w * 비; }
    if (it.h > H - 4){ it.h = H - 4; if (it.종류 === 'img') it.w = it.h / 비; }
    it.x = Math.max(0, Math.min(W - it.w, it.x));
    it.y = Math.max(0, Math.min(H - it.h, it.y));
  }));
  저장(); 그리기();
});

/* @page 는 CSS 라 자바스크립트로 바꿔 끼운다 — 인쇄 용지 방향이 맞아야 한다 */
const 인쇄스타일 = document.createElement('style');
document.head.appendChild(인쇄스타일);
function 적용된인쇄방향(){
  인쇄스타일.textContent = '@page{size:A4 ' + (문서.방향 === 'l' ? 'landscape' : 'portrait') + ';margin:0}';
}

$('print').onclick = () => { 고른것 = null; 그리기(); setTimeout(() => window.print(), 80); };
/* oninput 으로 저장하면 글자 하나마다 문서 사본이 하나씩 쌓였다.
   다섯 글자만 고쳐도 사본 다섯 개 — 지울 방법도 없었다.
   옛 이름은 focus 에 기대지 않는다. 그건 안 뜰 때가 있다 —
   실제로 저장해 둔 이름(저장된이름)을 기준으로 삼는다. */
$('docname').onchange = e => {
  const 새 = (e.target.value || '').trim() || '이름없음';
  const 옛 = 저장된이름;
  문서.이름 = 새; e.target.value = 새;
  저장(true);
  if (옛 && 옛 !== 새) 문서지우기(옛);
};

function 문서지우기(이름){
  try {
    localStorage.removeItem(칸 + '문서.' + 이름);
    const m = 문서목록(); delete m[이름];
    localStorage.setItem(칸 + '목록', JSON.stringify(m));
  } catch (err){}
}

/* ── 저장 — 이 기계 안에 남는다 ─────────────────────── */
const 칸 = 'vv.workorder.';
const 이름칸 = () => 칸 + '문서.' + (문서.이름 || '이름없음');
let 저장된이름 = null;          // 지금 저장소에 들어 있는 이름

/* 본문은 한 곳(문서.<이름>)에만 둔다. 예전에는 '지금' 에도 같은 것을 통째로
   한 벌 더 써서 담을 수 있는 쪽 수가 정확히 절반이었고, 둘 중 하나만
   성공하면 다음에 열 때 말없이 옛 판으로 되돌아갔다. */
let 저장미룸 = null;
function 저장(바로){
  clearTimeout(저장미룸);
  if (!바로){ 저장미룸 = setTimeout(() => 저장(true), 600); return; }
  문서.잰때 = Date.now();
  try {
    localStorage.setItem(이름칸(), JSON.stringify(문서));
    localStorage.setItem(칸 + '지금이름', 문서.이름 || '이름없음');
    저장된이름 = 문서.이름 || '이름없음';
    const 목록 = 문서목록();
    목록[문서.이름 || '이름없음'] = { 잰때: 문서.잰때 };
    localStorage.setItem(칸 + '목록', JSON.stringify(목록));
    저장못함(false);
  } catch (e){
    // 그림이 많으면 자리가 모자란다. 한 번 알리고 마는 게 아니라
    // 고쳐질 때까지 머리에 띠를 띄워 둔다 — 모르고 닫으면 다 사라진다
    저장못함(true);
  }
}
function 저장못함(켬){
  const w = $('warn'); if (!w) return;
  w.hidden = !켬;
  if (켬) w.textContent = '저장 공간이 모자라 자동 저장이 멈췄습니다 · 인쇄 · PDF 로 먼저 내보내세요';
}
function 문서목록(){
  try { return JSON.parse(localStorage.getItem(칸 + '목록') || '{}'); } catch (e){ return {}; }
}

$('docs').onclick = () => {
  const 목록 = Object.entries(문서목록()).sort((a, b) => b[1].잰때 - a[1].잰때);
  $('padbody').innerHTML =
    '<h4>지시서</h4><div class="docs">' +
      '<button data-new="1"><span>+ 새 지시서</span></button>' +
      목록.map(([n, m]) => '<button data-open="' + n.replace(/"/g, '&quot;') + '"><span>' +
        n.replace(/</g, '&lt;') + '</span><span class="when">' + 언제(m.잰때) +
        ' <i data-del="' + n.replace(/"/g, '&quot;') + '" style="font-style:normal;padding:0 6px;color:var(--soft)">×</i></span></button>').join('') +
    '</div>';
  $('pad').classList.add('on');
};
$('pad').onclick = e => {
  if (e.target === $('pad')) return $('pad').classList.remove('on');
  const x = e.target.closest('[data-del]');
  if (x){
    e.stopPropagation();
    if (!confirm(`"${x.dataset.del}" 지시서를 지웁니다. 되돌릴 수 없습니다.`)) return;
    문서지우기(x.dataset.del);
    if (문서.이름 === x.dataset.del){ 문서 = 새문서(); 저장된이름 = null; 지금장 = 0;
                                     $('docname').value = 문서.이름; 그리기(); }
    $('docs').click();                       // 목록 다시 그리기
    return;
  }
  const n = e.target.closest('[data-new]'), o = e.target.closest('[data-open]');
  if (n){ 문서 = 새문서(); 지금장 = 0; 고른것 = null; 저장된이름 = null; $('docname').value = 문서.이름;
          적용된인쇄방향(); 저장(); 그리기(); $('pad').classList.remove('on'); }
  if (o){
    try { 문서 = 손질(JSON.parse(localStorage.getItem(칸 + '문서.' + o.dataset.open))); } catch (e){ return; }
    지금장 = 0; 고른것 = null; $('docname').value = 문서.이름; 저장된이름 = 문서.이름;
    저장못함(false);
    document.querySelectorAll('#orient button').forEach(x => x.classList.toggle('on', x.dataset.o === 문서.방향));
    적용된인쇄방향(); 그리기(); $('pad').classList.remove('on');
  }
};
function 언제(t){
  const d = new Date(t), z = n => String(n).padStart(2, '0');
  return z(d.getMonth() + 1) + '.' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}

/* ── 시작 ───────────────────────────────────────────── */
try {
  const 마지막 = localStorage.getItem(칸 + '지금이름')
              || (JSON.parse(localStorage.getItem(칸 + '지금') || 'null') || {}).이름;   // 옛 방식
  문서 = 손질(JSON.parse(localStorage.getItem(칸 + '문서.' + 마지막) || 'null')
             || JSON.parse(localStorage.getItem(칸 + '지금') || 'null'));
  localStorage.removeItem(칸 + '지금');                 // 두 벌 쓰던 옛 자리를 비운다
  저장된이름 = 문서.이름;
} catch (e){ 문서 = 새문서(); }
$('docname').value = 문서.이름 || '작업지시서';
document.querySelectorAll('#orient button').forEach(x => x.classList.toggle('on', x.dataset.o === 문서.방향));
적용된인쇄방향();
if (!문서.장들.some(장 => 장.length)){
  글넣기('작업지시서');
  const t = 문서.장들[0][0];
  t.크기 = 8; t.굵게 = true; t.정렬 = 'center'; t.y = 14; t.h = 14;
}
그리기();
</script>
</body>
</html>
