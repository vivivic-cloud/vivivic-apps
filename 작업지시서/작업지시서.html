<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작업지시서 발행</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --ink:#111110; --body:#2E2E2C; --muted:#6E6E6A; --soft:#9B9B96;
  --line:#E3E2DF; --edge:#EDEDEA; --fill:#F4F4F2; --bg:#FAFAF8; --red:#D9342B;
  --bar:52px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--body);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}

/* ── 머리 ─────────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:8px;padding:8px 12px}
.top .row.two{padding-top:0;overflow-x:auto;scrollbar-width:none}
.top .row.two::-webkit-scrollbar{display:none}
.brand{font-weight:800;letter-spacing:-.3px;font-size:15px;white-space:nowrap;flex:none}
.docname{flex:1;min-width:0;border:1px solid var(--edge);border-radius:9px;padding:7px 10px;
  font-size:14px;font-weight:700;background:#fff}
.docname:focus{outline:none;border-color:var(--ink)}
.b{flex:none;border:1px solid var(--edge);background:#fff;border-radius:9px;padding:7px 11px;
  font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}
.b:active{background:var(--fill)}
.b.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.b.go{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}

/* ── 종이 ─────────────────────────────────────────────── */
/* 가운데 정렬을 flex 로 하면 종이가 칸보다 넓어지는 순간 왼쪽으로 밀려 잘린다.
   블록 + margin auto 로 두고, 넘칠 때만 가로로 밀어 본다. */
.stage{padding:14px 12px 120px;overflow-x:auto}
.wrap{position:relative;margin:0 auto}
/* 줄여 보여 줄 때 자리가 밀리지 않게 왼쪽 위를 기준으로 줄인다 (가운데 기준이면
   줄인 만큼 오른쪽으로 밀려 종이가 화면 밖으로 나간다) */
.sheet{position:relative;background:#fff;border:1px solid var(--line);
  box-shadow:0 2px 14px rgba(0,0,0,.06);transform-origin:top left;overflow:hidden}
.sheet.p{width:210mm;height:297mm}
.sheet.l{width:297mm;height:210mm}

.it{position:absolute;box-sizing:border-box}
.it.sel{outline:1.5px solid var(--ink);outline-offset:1px}
.it img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.it .tx{width:100%;height:100%;padding:2mm;border:0;background:transparent;resize:none;
  outline:none;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.it .cap{position:absolute;left:0;right:0;bottom:-4.6mm;font-size:2.6mm;color:var(--muted);
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grip{position:absolute;right:-9px;bottom:-9px;width:20px;height:20px;border-radius:50%;
  background:var(--ink);border:2px solid #fff;cursor:nwse-resize;touch-action:none}
.del{position:absolute;left:-9px;top:-9px;width:20px;height:20px;border-radius:50%;
  background:#fff;border:1.5px solid var(--ink);color:var(--ink);font-size:12px;line-height:1;
  display:grid;place-items:center;cursor:pointer}

/* ── 아래 도구 ─────────────────────────────────────────── */
.tools{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;
  border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools .b{min-height:40px}
.hint{padding:10px 14px;color:var(--muted);font-size:12.5px;text-align:center}

/* ── 판 ───────────────────────────────────────────────── */
.sheetpad{position:fixed;inset:0;z-index:60;background:rgba(17,17,16,.35);display:none;
  align-items:flex-end}
.sheetpad.on{display:flex}
.card{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px 16px
  calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto}
.card h4{margin:0 0 10px;font-size:15px}
.card .line{display:flex;align-items:center;gap:8px;margin:8px 0}
.card label{flex:none;width:76px;font-size:13px;color:var(--muted)}
.card input[type=range]{flex:1}
.card .num{width:56px;text-align:right;font-size:13px;color:var(--muted)}
.docs{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.docs button{text-align:left;border:1px solid var(--edge);background:#fff;border-radius:10px;
  padding:10px 12px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.docs .when{color:var(--muted);font-size:12px;flex:none}

/* ── 인쇄 ─────────────────────────────────────────────── */
@page{size:A4 portrait;margin:0}
@media print{
  html,body{background:#fff}
  .top,.tools,.hint,.sheetpad,.grip,.del{display:none !important}
  .stage{padding:0}
  .sheet{border:0;box-shadow:none;transform:none !important;margin:0}
  .it.sel{outline:0}
}
</style>
</head>
<body>

<div class="top">
  <div class="row">
    <span class="brand">작업지시서</span>
    <input class="docname" id="docname" placeholder="지시서 이름" value="작업지시서">
    <button class="b go" id="print">인쇄 · PDF</button>
  </div>
  <div class="row two">
    <div class="seg" id="orient">
      <button data-o="p" class="on">세로</button>
      <button data-o="l">가로</button>
    </div>
    <button class="b" id="load">자료 불러오기</button>
    <button class="b" id="addtext">글상자</button>
    <button class="b" id="addline">구분선</button>
    <button class="b" id="tidy">자동 정렬</button>
    <button class="b" id="docs">문서</button>
  </div>
</div>

<div class="stage"><div class="wrap"><div class="sheet p" id="sheet"></div></div></div>

<p class="hint">A4 흰 바탕입니다. 자료를 불러와 끌어 옮기고, 오른쪽 아래 손잡이로 크기를 바꿉니다.<br>
인쇄 · PDF 를 누른 뒤 대상에서 <b>PDF로 저장</b>을 고르면 PDF가 됩니다.</p>

<div class="tools">
  <button class="b" data-z="-">축소</button>
  <button class="b" data-z="+">확대</button>
  <button class="b" id="front">맨 앞으로</button>
  <button class="b" id="back">맨 뒤로</button>
  <button class="b" id="fitw">폭 맞춤</button>
  <button class="b" id="clear">모두 지우기</button>
</div>

<input type="file" id="file" multiple accept="image/*,application/pdf" hidden>

<div class="sheetpad" id="pad"><div class="card" id="padbody"></div></div>

<script src="../shared/viggle.js"></script>
<script>
/* ══ 작업지시서 — A4 캔버스 ══════════════════════════════
   자리·크기는 모두 mm 로 둔다. 화면에서는 축소해 보여 주고 인쇄할 때만
   1:1 이 되므로, px 로 두면 종이에서 어긋난다. */
const $ = id => document.getElementById(id);
const sheet = $('sheet');
const A4 = { p: [210, 297], l: [297, 210] };

let 문서 = 새문서();
let 고른것 = null;
let 배율 = 1;

function 새문서(){
  return { 이름: '작업지시서', 방향: 'p', 것들: [], 잰때: Date.now() };
}
function 지금크기(){ return A4[문서.방향]; }
const mm = v => v + 'mm';

/* ── 그리기 ─────────────────────────────────────────── */
function 그리기(){
  sheet.className = 'sheet ' + 문서.방향;
  sheet.innerHTML = '';
  문서.것들.forEach(it => sheet.appendChild(만들기(it)));
  맞추기();
}

function 만들기(it){
  const el = document.createElement('div');
  el.className = 'it' + (고른것 === it.id ? ' sel' : '');
  el.dataset.id = it.id;
  el.style.left = mm(it.x); el.style.top = mm(it.y);
  el.style.width = mm(it.w); el.style.height = mm(it.h);
  el.style.zIndex = it.z || 1;

  if (it.종류 === 'img'){
    const img = document.createElement('img');
    img.src = it.src; el.appendChild(img);
    if (it.이름){ const c = document.createElement('span'); c.className='cap'; c.textContent=it.이름; el.appendChild(c); }
  } else if (it.종류 === 'line'){
    el.style.borderTop = '0.4mm solid #111110';
    el.style.height = '0.4mm';
  } else {
    const t = document.createElement('div');
    t.className = 'tx'; t.contentEditable = 'true'; t.textContent = it.글 || '';
    t.style.fontSize = (it.크기 || 4) + 'mm';
    t.style.fontWeight = it.굵게 ? '800' : '400';
    t.style.textAlign = it.정렬 || 'left';
    t.addEventListener('input', () => { it.글 = t.innerText; 저장(); });
    t.addEventListener('focus', () => 고르기(it.id, true));
    el.appendChild(t);
  }

  if (고른것 === it.id){
    const g = document.createElement('div'); g.className = 'grip'; el.appendChild(g);
    끌기(g, it, 'size');
    const d = document.createElement('button'); d.className = 'del'; d.textContent = '×';
    d.onclick = e => { e.stopPropagation(); 문서.것들 = 문서.것들.filter(x => x !== it); 고른것 = null; 저장(); 그리기(); };
    el.appendChild(d);
  }
  끌기(el, it, 'move');
  el.addEventListener('pointerdown', () => 고르기(it.id));
  return el;
}

function 고르기(id, 조용히){
  if (고른것 === id) return;
  고른것 = id;
  if (!조용히) 그리기();
  else 그리기();
}

/* ── 끌어 옮기기 · 크기 바꾸기 ───────────────────────── */
function 끌기(el, it, 무엇){
  let 시작 = null;
  el.addEventListener('pointerdown', e => {
    if (무엇 === 'move' && e.target.closest('.grip,.del,.tx')) return;
    if (무엇 === 'move' && 고른것 !== it.id) return;      // 한 번 골라야 옮긴다
    e.preventDefault(); e.stopPropagation();
    el.setPointerCapture(e.pointerId);
    시작 = { x: e.clientX, y: e.clientY, ix: it.x, iy: it.y, iw: it.w, ih: it.h };
  });
  el.addEventListener('pointermove', e => {
    if (!시작) return;
    const [W, H] = 지금크기();
    const dx = (e.clientX - 시작.x) / 배율 / (96 / 25.4);   // px → mm
    const dy = (e.clientY - 시작.y) / 배율 / (96 / 25.4);
    if (무엇 === 'move'){
      it.x = Math.max(0, Math.min(W - it.w, 시작.ix + dx));
      it.y = Math.max(0, Math.min(H - it.h, 시작.iy + dy));
    } else {
      it.w = Math.max(8, Math.min(W - it.x, 시작.iw + dx));
      it.h = Math.max(6, Math.min(H - it.y, 시작.ih + dy));
    }
    const box = sheet.querySelector('[data-id="' + it.id + '"]');
    if (box){ box.style.left = mm(it.x); box.style.top = mm(it.y);
              box.style.width = mm(it.w); box.style.height = mm(it.h); }
  });
  const 끝 = () => { if (시작){ 시작 = null; 저장(); } };
  el.addEventListener('pointerup', 끝);
  el.addEventListener('pointercancel', 끝);
}

/* ── 화면에 맞춰 축소 ───────────────────────────────── */
function 맞추기(){
  const [W] = 지금크기();
  const 폭px = W * (96 / 25.4);
  const 칸 = document.querySelector('.stage');
  const 쓸수있는 = Math.min((칸 ? 칸.clientWidth : window.innerWidth) - 24, 1100);
  배율 = Math.min(1, 쓸수있는 / 폭px) * 자리배율;
  sheet.style.transform = 'scale(' + 배율 + ')';
  const [, H] = 지금크기();
  sheet.parentElement.style.width = (폭px * 배율) + 'px';
  sheet.parentElement.style.height = (H * (96 / 25.4) * 배율) + 'px';
}
let 자리배율 = 1;
addEventListener('resize', 맞추기);
// 창 크기 말고 칸 크기가 바뀌어도(가로 세로 돌리기 등) 따라가게 한다
if (window.ResizeObserver) new ResizeObserver(() => 맞추기()).observe(document.querySelector('.stage'));

/* ── 자료 불러오기 ──────────────────────────────────── */
$('load').onclick = () => $('file').click();
$('file').onchange = async e => {
  const 파일들 = [...e.target.files];
  for (const f of 파일들) await 넣기(f);
  e.target.value = '';
  저장(); 그리기();
};

async function 넣기(f){
  if (f.type === 'application/pdf'){
    const 장들 = await pdf장(f);
    장들.forEach(src => 그림넣기(src, f.name));
    if (!장들.length) 글넣기('[' + f.name + '] — 이 PDF는 미리보기를 만들지 못했습니다');
    return;
  }
  if (/^image\//.test(f.type)){
    const src = await 읽기(f);
    return 그림넣기(src, f.name);
  }
  글넣기('[' + f.name + ']');
}

const 읽기 = f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });

/* PDF 는 pdf.js 로 장마다 그림을 떠서 넣는다. 라이브러리가 안 실려 있으면 건너뛴다 */
async function pdf장(f){
  if (!window.pdfjsLib) return [];
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf = await f.arrayBuffer();
    const doc = await pdfjsLib.getDocument({ data: buf }).promise;
    const 나온것 = [];
    for (let i = 1; i <= Math.min(doc.numPages, 10); i++){
      const page = await doc.getPage(i);
      const vp = page.getViewport({ scale: 2 });
      const cv = document.createElement('canvas');
      cv.width = vp.width; cv.height = vp.height;
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      나온것.push(cv.toDataURL('image/jpeg', 0.85));
    }
    return 나온것;
  } catch(e){ console.warn('PDF 읽기 실패', e); return []; }
}

function 그림넣기(src, 이름){
  const [W, H] = 지금크기();
  const it = { id: 새id(), 종류: 'img', src, 이름: 이름 || '',
               x: 12, y: 다음y(), w: Math.min(W - 24, 90), h: 60, z: 다음z() };
  const img = new Image();
  img.onload = () => {                                  // 비율은 원본 그대로
    const 비 = img.naturalHeight / img.naturalWidth;
    it.h = Math.min(H - it.y - 8, it.w * 비);
    저장(); 그리기();
  };
  img.src = src;
  문서.것들.push(it);
}

function 글넣기(글){
  const [W] = 지금크기();
  문서.것들.push({ id: 새id(), 종류: 'text', 글: 글 || '내용을 적으세요',
                   x: 12, y: 다음y(), w: W - 24, h: 16, 크기: 4, z: 다음z() });
}

function 다음y(){
  const 아래 = 문서.것들.reduce((n, it) => Math.max(n, it.y + it.h), 8);
  const [, H] = 지금크기();
  return Math.min(H - 20, 아래 + 5);
}
function 다음z(){ return 문서.것들.reduce((n, it) => Math.max(n, it.z || 1), 0) + 1; }
const 새id = () => 'i' + Math.random().toString(36).slice(2, 9);

$('addtext').onclick = () => { 글넣기(); 저장(); 그리기(); };
$('addline').onclick = () => {
  const [W] = 지금크기();
  문서.것들.push({ id: 새id(), 종류: 'line', x: 12, y: 다음y(), w: W - 24, h: 0.4, z: 다음z() });
  저장(); 그리기();
};

/* ── 자동 정렬 — 위에서부터 차곡차곡 ─────────────────── */
$('tidy').onclick = () => {
  const [W, H] = 지금크기();
  let y = 12;
  문서.것들.slice().sort((a, b) => (a.y - b.y) || (a.x - b.x)).forEach(it => {
    it.x = 12;
    if (it.종류 !== 'img') it.w = W - 24;
    else it.w = Math.min(it.w, W - 24);
    it.y = y;
    y += it.h + 5;
  });
  저장(); 그리기();
};

/* ── 앞뒤 · 크기 ────────────────────────────────────── */
$('front').onclick = () => { const it = 지금것(); if (it){ it.z = 다음z(); 저장(); 그리기(); } };
$('back').onclick  = () => { const it = 지금것(); if (it){ 문서.것들.forEach(x => x.z = (x.z || 1) + 1); it.z = 1; 저장(); 그리기(); } };
$('fitw').onclick  = () => { const it = 지금것(); if (!it) return; const [W] = 지금크기();
  const 비 = it.h / it.w; it.x = 12; it.w = W - 24; if (it.종류 === 'img') it.h = it.w * 비; 저장(); 그리기(); };
$('clear').onclick = () => { if (!confirm('이 지시서의 내용을 모두 지웁니다.')) return;
  문서.것들 = []; 고른것 = null; 저장(); 그리기(); };
const 지금것 = () => 문서.것들.find(x => x.id === 고른것);

document.querySelectorAll('[data-z]').forEach(b => b.onclick = () => {
  자리배율 = Math.max(.4, Math.min(2.5, 자리배율 + (b.dataset.z === '+' ? .15 : -.15)));
  맞추기();
});

/* ── 방향 ───────────────────────────────────────────── */
$('orient').addEventListener('click', e => {
  const b = e.target.closest('[data-o]'); if (!b) return;
  문서.방향 = b.dataset.o;
  document.querySelectorAll('#orient button').forEach(x => x.classList.toggle('on', x === b));
  적용된인쇄방향();
  const [W, H] = 지금크기();
  문서.것들.forEach(it => {                       // 종이 밖으로 나간 것은 끌어들인다
    it.w = Math.min(it.w, W - 4); it.h = Math.min(it.h, H - 4);
    it.x = Math.max(0, Math.min(W - it.w, it.x));
    it.y = Math.max(0, Math.min(H - it.h, it.y));
  });
  저장(); 그리기();
});

/* @page 는 CSS 라 자바스크립트로 바꿔 끼운다 — 인쇄 대화상자의 용지 방향이 맞아야 한다 */
let 인쇄스타일 = document.createElement('style');
document.head.appendChild(인쇄스타일);
function 적용된인쇄방향(){
  인쇄스타일.textContent = '@page{size:A4 ' + (문서.방향 === 'l' ? 'landscape' : 'portrait') + ';margin:0}';
}

$('print').onclick = () => { 고른것 = null; 그리기(); setTimeout(() => window.print(), 60); };
$('docname').oninput = e => { 문서.이름 = e.target.value; 저장(); };

/* ── 저장 — 이 기계 안에 남는다 ─────────────────────── */
const 칸 = 'vv.workorder.';
function 저장(){
  문서.잰때 = Date.now();
  try {
    localStorage.setItem(칸 + '지금', JSON.stringify(문서));
    const 목록 = 문서목록();
    목록[문서.이름 || '이름없음'] = { 잰때: 문서.잰때 };
    localStorage.setItem(칸 + '목록', JSON.stringify(목록));
    localStorage.setItem(칸 + '문서.' + (문서.이름 || '이름없음'), JSON.stringify(문서));
  } catch(e){ /* 자리가 모자라면 조용히 넘어간다 — 화면은 그대로 쓸 수 있다 */ }
}
function 문서목록(){
  try { return JSON.parse(localStorage.getItem(칸 + '목록') || '{}'); } catch(e){ return {}; }
}

$('docs').onclick = () => {
  const 목록 = Object.entries(문서목록()).sort((a, b) => b[1].잰때 - a[1].잰때);
  $('padbody').innerHTML =
    '<h4>지시서</h4>' +
    '<div class="docs">' +
      '<button data-new="1"><span>+ 새 지시서</span></button>' +
      목록.map(([n, m]) => '<button data-open="' + n.replace(/"/g,'&quot;') + '"><span>' +
        n.replace(/</g,'&lt;') + '</span><span class="when">' + 언제(m.잰때) + '</span></button>').join('') +
    '</div>';
  $('pad').classList.add('on');
};
$('pad').onclick = e => {
  if (e.target === $('pad')) return $('pad').classList.remove('on');
  const n = e.target.closest('[data-new]'), o = e.target.closest('[data-open]');
  if (n){ 문서 = 새문서(); 고른것 = null; $('docname').value = 문서.이름; 적용된인쇄방향(); 저장(); 그리기(); $('pad').classList.remove('on'); }
  if (o){
    try { 문서 = JSON.parse(localStorage.getItem(칸 + '문서.' + o.dataset.open)); } catch(e){ return; }
    고른것 = null; $('docname').value = 문서.이름;
    document.querySelectorAll('#orient button').forEach(x => x.classList.toggle('on', x.dataset.o === 문서.방향));
    적용된인쇄방향(); 그리기(); $('pad').classList.remove('on');
  }
};
function 언제(t){
  const d = new Date(t), z = n => String(n).padStart(2, '0');
  return z(d.getMonth() + 1) + '.' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}

/* ── 시작 ───────────────────────────────────────────── */
try {
  const 있던것 = JSON.parse(localStorage.getItem(칸 + '지금') || 'null');
  if (있던것 && 있던것.것들) 문서 = 있던것;
} catch(e){}
$('docname').value = 문서.이름 || '작업지시서';
document.querySelectorAll('#orient button').forEach(x => x.classList.toggle('on', x.dataset.o === 문서.방향));
적용된인쇄방향();
if (!문서.것들.length){
  글넣기('작업지시서');
  문서.것들[0].크기 = 8; 문서.것들[0].굵게 = true; 문서.것들[0].정렬 = 'center'; 문서.것들[0].y = 14; 문서.것들[0].h = 14;
}
그리기();
sheet.addEventListener('pointerdown', e => { if (e.target === sheet){ 고른것 = null; 그리기(); } });
</script>
</body>
</html>
