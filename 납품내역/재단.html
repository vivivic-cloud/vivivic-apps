<!DOCTYPE html>
<!-- 납품내역 / 재단 — 담당 폴더 「관리프로그램 / Amt양식 / 거래내역 / 재단」 의 파일만 정리해 보인다.
     사장님 10-22: 「폴더별로 … 각 페이지를 만들어서 … 해당 파일만 정리되어 보이는 페이지로」.
     거르는 알약(거래처·갈래)은 두지 않는다. 파일 목록 → 파일을 누르면 그 파일의 줄.
     판 번호는 머리의 배지와 같다. 고칠 때 둘을 같이 올린다: v6.1.0
     v6.1.0(10-22): 흰 바탕 · 표는 서류관리 제품관리 표 꼴(.dpr-t) — 납품내역/CLAUDE.md 「표 디자인」 을 따른다.

     ⚠ 창고는 **읽기만** 한다. Firebase 설정·익명 로그인·20초 안내·2,000줄 윗금·#표통 높이 묶기는
        납품내역.html 에서 그대로 가져왔다. 그 파일과 따로 놀지 않게 고칠 때 같이 본다. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재단 — 납품내역</title>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
    const app = initializeApp({
        apiKey: "AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",
        authDomain: "vivivic-4b7ef.firebaseapp.com",
        projectId: "vivivic-4b7ef",
        storageBucket: "vivivic-4b7ef.firebasestorage.app",
        messagingSenderId: "830175660542",
        appId: "1:830175660542:web:9054030480c8280af8d8af"
    });
    const auth = getAuth(app);
    window.db = getFirestore(app);
    window.fbRead = { collection, getDocs, query, where, doc, getDoc };
    onAuthStateChanged(auth, (u) => {
        if (!u) { signInAnonymously(auth).catch(e => window.목록못읽음('창고에 들어가지 못했습니다', (e&&(e.code||e.message))||'')); return; }
        window.목록읽기();
    });
</script>

<style>
/* v6.1.0 (10-22) — 사장님: 「다크화면 컨셉은 삭제해줘」 → 흰 바탕.
   표는 서류관리(vivivic-docs index.html) 「제품관리」 표와 같은 꼴 — 납품내역/CLAUDE.md 「표 디자인」 을 따른다.
   색 낱말은 그 파일 --vg-* 와 같은 값이다. 값을 새로 짓지 마라. */
:root{
  --vg-bg:#fff; --vg-ink:#111110; --vg-body:#1A1A19;
  --vg-muted:#9C9C98; --vg-edge:#E2E2DF; --vg-fill:#F4F4F2; --vg-red:#FF3B30;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--vg-bg);color:var(--vg-body);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

.back{display:inline-block;font-size:13px;font-weight:600;color:var(--vg-muted);text-decoration:none;padding:16px 0 0}
.back:hover{color:var(--vg-ink)}
header{padding:10px 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:13px;color:var(--vg-muted)}
.logo b{font-size:15px;font-weight:800;letter-spacing:3.2px;color:var(--vg-ink);margin-right:4px}
.badge{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--vg-ink);
  border:1px solid var(--vg-ink);border-radius:999px;padding:3px 9px}
h1{font-size:30px;line-height:1.1;letter-spacing:-1.2px;font-weight:700;color:var(--vg-ink);padding:8px 0 10px}
.where{font-size:12.5px;color:var(--vg-muted);line-height:1.85;padding-bottom:14px;border-bottom:1px solid var(--vg-edge)}
.where code{color:var(--vg-body);font-size:12px}
.where b{color:var(--vg-body);font-weight:600}
.where .q{color:var(--vg-muted)}

h2{font-size:19px;font-weight:700;letter-spacing:-.4px;color:var(--vg-ink);padding:26px 0 12px;word-break:break-all}
.how{font-size:12.5px;color:var(--vg-muted);line-height:1.8;padding:0 0 10px}
.how b{color:var(--vg-body);font-weight:600}

/* 파일 목록 — 박스 하나가 파일 하나 (바이글 .abox 꼴) */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.file{border:1px solid var(--vg-edge);border-radius:20px;background:#fff;padding:14px;cursor:pointer;transition:transform .12s}
.file:active{transform:scale(.975)}
.file.on{background:var(--vg-ink);border-color:var(--vg-ink)}
.file.on .fn{color:#fff}
.file.on .fs{color:rgba(255,255,255,.5)}
.file .fn{font-size:15px;font-weight:600;color:var(--vg-ink);line-height:1.25;word-break:break-all}
.file .fs{font-size:12px;color:var(--vg-muted);padding-top:8px;font-variant-numeric:tabular-nums}
.file.zero{border-style:dashed}
.file.zero .fn{color:var(--vg-muted)}

/* 표 묶음 머리 = 제품관리 .dpr-gh / .dpr-gn / .dpr-gc */
.dpr-gh{display:flex;align-items:baseline;gap:8px;margin:18px 0 4px;flex-wrap:wrap}
.dpr-gh .dpr-gn{font-size:17px;font-weight:700;color:var(--vg-ink)}
.dpr-gh .dpr-gc{font-size:12px;color:var(--vg-muted)}
/* 사장님 10-20: 가로 스크롤이 표 맨 아래에 있어 위쪽을 볼 때 못 쓴다 → 표 상자를 화면 높이로 묶어 스크롤 막대가 늘 보는 화면 아래에 오게 한다 */
.표통{overflow:auto;max-height:calc(100vh - 24px);-webkit-overflow-scrolling:touch;background:var(--vg-bg)}
/* 표 — 서류관리 제품관리(.dpr-t)와 같은 꼴: 굵은 머리줄, 그 아래 굵은 선 하나, 줄마다 옅은 선, 숫자는 가운데, 첫 칸은 붙어 선다. */
.dpr-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.dpr-t th{font-size:13px;font-weight:800;color:var(--vg-ink);text-align:left;vertical-align:bottom;
  padding:10px 12px;border-bottom:2px solid var(--vg-ink);background:var(--vg-bg);white-space:nowrap}
.dpr-t th.num{min-width:84px}
.dpr-t td{font-size:14px;color:var(--vg-body);padding:13px 12px;
  border-bottom:1px solid #D6D6D3;vertical-align:top;white-space:nowrap}
.dpr-t .num{text-align:center}
.dpr-t td.d{color:var(--vg-muted)}
.dpr-t .dpr-k{position:sticky;left:0;z-index:1;background:var(--vg-bg);font-weight:700;color:var(--vg-ink)}
/* 날짜 가름줄 = 제품관리의 묶음 머리(.dpr-gh / .dpr-gn) 꼴 */
.dpr-t tr.daysep td{font-size:17px;font-weight:700;color:var(--vg-ink);padding:18px 2px 4px;border-bottom:0;background:var(--vg-bg)}
.dpr-t tr.daysep td .dpr-gn{display:inline-block;position:sticky;left:2px}
.dpr-t td.dpr-none{font-size:12px;color:var(--vg-muted);padding:6px 2px;white-space:normal}
.empty{font-size:12px;color:var(--vg-muted);padding:6px 2px}
.state{background:var(--vg-fill);border-radius:14px;padding:22px 16px;text-align:center}
.state .big{font-size:14px;font-weight:600;color:var(--vg-ink);padding-bottom:6px}
.state .sub{font-size:12.5px;color:var(--vg-muted);line-height:1.85}
.state .why{font-size:11.5px;color:var(--vg-red);padding-top:6px;font-family:ui-monospace,monospace}
footer{font-size:11px;color:var(--vg-muted);padding:26px 0 24px;border-top:1px solid var(--vg-edge);margin-top:30px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">

<a class="back" href="납품내역.html">← 납품내역</a>
<header>
  <div class="logo"><b>VIVIVIC</b> — 재단</div>
  <div class="badge">v6.1.0</div>
</header>
<h1>재단</h1>
<div class="where">
  구글드라이브 <code>관리프로그램 / Amt양식 / 거래내역 / 재단 / TalkFile_재단4월~9월</code><br>
  2026년 것만 보입니다. 값은 <b>창고</b>에서 받습니다 — 이 파일 안에는 없습니다.
</div>

<h2>파일</h2>
<div class="how" id="잣대"></div>
<div class="files" id="파일들"></div>
<div class="state" id="목상태"><div class="big">창고를 읽는 중입니다…</div></div>

<div id="속"></div>

  읽기만 합니다. 드라이브에도 창고에도 아무것도 쓰지 않습니다.<br>
  폴더의 <code>~$</code> 로 시작하는 파일과 <code>.DS_Store</code> 는 엑셀·맥이 혼자 만든 빈 파일이라 목록에서 뺐습니다.
</footer>
</div>

<!-- 짚어서 지시하는 손잡이 — 바이글 박스에서 열면 켜진다. 화면을 갈아엎을 때도 이 줄은 남긴다. -->
<script src="../shared/viggle.js"></script>

<script>/* ════ 값은 **창고에서 받는다.** 읽기만 한다 — 들여온 것은 읽는 함수 여섯뿐이다. ════ */
const 창고자리 = ['artifacts','vivivic-4b7ef','public','data','납품내역'];
const 목칸 = {
 '재단':['일','순번','제품명','PO','원장종류','원장색상','원장모델명','원장출고처','원장입고일','품목','사이즈','재단수량','원장수량','재단금액','출고예정일','비고'],
 '원장소요량':['일','원장출고처','원장종류','원장모델명','원장색상','전일소요량','금일소요량','총소요량']
};
/* 담당 폴더의 파일 — 폴더에 적힌 이름 그대로(10-22 드라이브를 읽어 적음). 파일이 달별이다. */
const 폴더파일 = {
 '2026-04':'AMT 재단거래명세표(26년 4월분).xlsx',
 '2026-05':'AMT 재단거래명세표(26년 5월분).xlsx',
 '2026-06':'AMT 재단거래명세표(26년 6월분).xlsx',
 '2026-07':'AMT 재단거래명세표(26년 7월분).xlsx',
 '2026-08':'AMT 재단거래명세표(26년 8월분).xlsx',
 '2026-09':'AMT 재단거래명세표(26년 9월분).xlsx'
};
const 보는해 = '2026';
const 많으면 = 2000;          /* 폰에서 줄을 그리다 멎지 않게 한 번에 그리는 윗금 */
const 숫자칸 = new Set(['전일소요량','금일소요량','총소요량','재단수량','원장수량','재단금액']);
let 줄들 = [], 묶음 = {}, 고른 = '', 답했나 = false, 서류로 = 0;

const 글 = v => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function 목상태(큰,작,까닭){
  const el=document.getElementById('목상태'); el.style.display='block';
  el.innerHTML = `<div class="big">${큰}</div>` + (작?`<div class="sub">${작}</div>`:'') + (까닭?`<div class="why">${까닭}</div>`:'');
}
window.목록못읽음 = (큰,까닭) => { 답했나=true; 목상태(큰,'관리자에게 알려 주십시오.',까닭||''); };

/* ⚠ 창고 꾸러미를 못 받아 오면 「읽는 중」 에서 영영 멈춘다 — 20초 안에 답이 없으면 그렇다고 적는다. */
setTimeout(() => { if(!답했나) 목상태('창고에 닿지 못했습니다',
  '인터넷이 끊겼거나 창고가 막혀 있습니다. 새로고침해 보십시오.'); }, 20000);

/* 줄이 어느 파일에서 나왔나 — 줄에 「서류」 칸이 있으면 그것, 없으면 달(파일이 달별이다). */
const 파일이름 = r => (r.서류 != null && String(r.서류).trim()) ? String(r.서류).trim()
                   : (폴더파일[r.달] || ('(폴더에 파일 없음) ' + (r.달||'?')));

window.목록읽기 = async function(){
  try{
    const { doc, getDoc, collection, getDocs, query, where } = window.fbRead;
    const 목 = await getDoc(doc(window.db, ...창고자리, '_달목록'));
    답했나 = true;
    if(!목.exists()){ 목상태('목록이 아직 창고에 안 들어왔습니다'); return; }
    const 달목 = (목.data().달들||[]).filter(d => String(d).startsWith(보는해+'-')).sort();
    if(!달목.length){ 목상태('2026년 자료가 창고에 없습니다'); return; }
    /* 창고는 달로 갈라 두었다 — 달마다 받아 잇는다(납품내역.html 과 같은 길).
       하나씩 받으면 10달에 25초가 걸려(10-22 잼) 달들을 한꺼번에 받는다. */
    let 받은 = 0;
    목상태('창고를 읽는 중입니다…', '0 / ' + 달목.length + ' 달');
    const 눈들 = await Promise.all(달목.map(m =>
      getDocs(query(collection(window.db, ...창고자리), where('달','==',m)))
        .then(눈 => { 목상태('창고를 읽는 중입니다…', (++받은) + ' / ' + 달목.length + ' 달'); return 눈; })));
    for(const 눈 of 눈들){
      눈.forEach(d => { const r = d.data();
        if(r.갈!=='재단' && r.갈!=='원장소요량') return;
        /* 사장님 10-20: 원장소요량에서 전일·금일·총소요량이 다 「-」 인 줄은 안 보인다(창고에는 그대로 있다). */
        if(r.갈==='원장소요량' && !['전일소요량','금일소요량','총소요량'].some(c => r[c] && r[c]!=='-')) return;
        줄들.push(r); });
    }
    document.getElementById('목상태').style.display='none';
    묶기();
  }catch(e){ 답했나=true; window.목록못읽음('창고를 읽지 못했습니다',(e&&(e.code||e.message))||''); }
};

function 묶기(){
  묶음 = {};
  Object.values(폴더파일).forEach(f => 묶음[f] = []);
  줄들.forEach(r => { const f = 파일이름(r); (묶음[f] = 묶음[f] || []).push(r); });
  서류로 = 줄들.filter(r => r.서류 != null && String(r.서류).trim()).length;
  document.getElementById('잣대').innerHTML =
    (서류로 === 줄들.length
      ? '<b>묶은 잣대: 줄마다 적힌 서류 이름</b>으로 파일을 나눴습니다.'
      : '<b>묶은 잣대: 달</b> — 창고 줄에 어느 파일인지 적힌 칸(서류)이 ' +
        (서류로 ? `${줄들.length}줄 가운데 ${서류로}줄에만 있어` : '없어') +
        ', 나머지는 <b>달</b>로 묶었습니다(파일이 달별입니다 — 4월분 파일 = 2026-04 줄).') +
    ` 2026년 재단·원장소요량 <b>${줄들.length}</b>줄. 파일을 누르십시오.`;
  파일그리기();
}

function 파일그리기(){
  const 이름들 = Object.keys(묶음).sort((a,b)=> a.localeCompare(b,'ko',{numeric:true}));
  document.getElementById('파일들').innerHTML = 이름들.map(f => {
    const 것 = 묶음[f];
    const 재 = 것.filter(r=>r.갈==='재단').length, 원 = 것.length - 재;
    return `<div class="file ${f===고른?'on':''} ${것.length?'':'zero'}" data-f="${글(f)}">` +
      `<div class="fn">${글(f)}</div><div class="fs">재단 내역 ${재}줄 · 원장소요량 ${원}줄</div></div>`;
  }).join('');
}

function 표(갈, 것){
  const C = 목칸[갈];
  if(!것.length) return `<div class="empty">이 파일에 <b>${갈==='재단'?'재단 내역':'원장소요량'}</b> 줄은 없습니다.</div>`;
  것 = 것.slice().sort((a,b)=> String(a.달||'').localeCompare(String(b.달||'')) || (a.일||0)-(b.일||0));
  /* 폰에서 줄을 몇 천 개씩 그리면 멎는다. 그린 수를 숨기지 않고 적는다. */
  const 그릴 = 것.length > 많으면 ? 것.slice(0, 많으면) : 것;
  let t = '<div class="표통"><table class="dpr-t"><thead><tr>' + C.map((c,i)=>`<th class="${i?(숫자칸.has(c)?'num':''):'dpr-k'}">${c}</th>`).join('') + '</tr></thead><tbody>';
  if(그릴.length < 것.length)
    t += `<tr class="daysep"><td colspan="${C.length}"><span class="dpr-gn">${것.length}줄 가운데 <b>앞 ${많으면}줄</b>만 그렸습니다.</span></td></tr>`;
  let 앞 = null;
  for(const r of 그릴){
    const 때 = (r.달 ? +String(r.달).slice(5,7)+'월 ' : '') + (r.일||'?') + '일';
    if(때!==앞){ t += `<tr class="daysep"><td colspan="${C.length}"><span class="dpr-gn">${때}</span></td></tr>`; 앞=때; }
    t += '<tr>' + C.map((c,i)=>{
      const v = (r[c]==null)?'':String(r[c]);
      return `<td class="${i?'':'dpr-k '}${v===''?'d':(숫자칸.has(c)?'num':'')}">${v===''?'·':글(v).replace(/\n/g,' ')}</td>`;
    }).join('') + '</tr>';
  }
  return t + '</tbody></table></div>';
}

function 속그리기(){
  const 것 = 묶음[고른] || [];
  const 재 = 것.filter(r=>r.갈==='재단'), 원 = 것.filter(r=>r.갈==='원장소요량');
  document.getElementById('속').innerHTML =
    `<h2>${글(고른)}</h2>` +
    `<div class="dpr-gh"><span class="dpr-gn">재단 내역</span><span class="dpr-gc">${재.length}줄</span></div>` + 표('재단', 재) +
    `<div class="dpr-gh"><span class="dpr-gn">원장소요량</span><span class="dpr-gc">${원.length}줄 · 전일·금일·총소요량이 다 「-」 인 줄은 뺐습니다</span></div>` + 표('원장소요량', 원);
}

document.addEventListener('click', e=>{
  const p = e.target.closest('.file'); if(!p) return;
  고른 = p.dataset.f; 파일그리기(); 속그리기();
  document.getElementById('속').scrollIntoView({behavior:'smooth'});
});
</script>
