<!DOCTYPE html>
<!-- 납품내역 / 제품목록 — 재단 명세서 전부(4~9월, 날짜 시트 + 세부내역 시트)에서 모은 제품명별 품목 정보.
     사장님 10-28: 「재단의 모든 명세서를 확인하여 제품명,품목,사이즈,원장종류,원장색상,원장모델명,원장출고처,출고예정일 …
     제품명의 중복없는 목록만 보여주는 제품목록 페이지」. 발주와 상관없는 단순 제품 정보 — PO·수량·금액은 없다.
     판 번호는 머리의 배지와 같다. 고칠 때 둘을 같이 올린다: v6.6.5
     v6.4.1(10-28): 제품명 묶음 머리를 걷고 품목 줄마다 제품명을 적은 한 표로 폈다. 머리 칸을 누르면 그 열로 오름 → 내림.
     v6.5.0(10-29): 제품명 옆 「벤더피아 단품」 칸 — 단품을 검색해 고르면 제품명이 같은 모든 줄에 같이 붙는다.
       단품 목록은 창고 `납품내역_단품목록`(벤더피아 단품관리 엑셀을 올려 채움), 고른 것은 `납품내역_단품연결`(문서 = 제품명).
     v6.6.0(10-29): 제품명을 누르면 그 제품이 든 가장 최근 발주서 한 장을 팝업으로.
     v6.6.1(10-29): 발주서를 에이엠티 발주에서 **납품내역 재단 줄**(창고 `납품내역`, 갈=재단, 읽기만)로 바꿨다 — 가장 최근 PO 의 재단 줄 전부.
     v6.6.2(10-30): 발주서 팝업에서 고른 제품 줄(tr.hit)을 바탕색 대신 **붉은 글씨**(--vg-red #FF3B30, 굵게)로.
     v6.6.3(10-30): 판매상태가 「중지」인 벤더피아 단품에 붉은 테 「판매중지」 딱지 — 검색 판 목록과 표의 고른 단품 칸 둘 다.
     v6.6.4(10-30): 원장색상 열을 「벤더피아 단품」 칸 바로 앞(둘째 칸)으로 옮겼다. 다른 칸 차례는 그대로.
     v6.6.5(10-30): 폰(600px 이하)에서 붙어 선 제품명 칸을 140px 로 묶고 긴 이름은 줄을 접는다 — 원장색상이 가리지 않게. PC 는 그대로.

     ⚠ 이 파일에는 업무 값이 없다. 목록은 창고 `납품내역_제품목록` 에 있고 이 쪽은 **읽기만** 한다.
        창고에 담는 것은 `tools/제품목록모으기.py`(부를 때만 돈다). 자세한 것은 납품내역/CLAUDE.md 「제품목록 v6.4.0」.
     ⚠ 설명 문구를 넣지 마라(v6.3.0). 화면 전체 막대 없음 — 표 상자 안에서만 민다(v6.2.1, 재단.html 과 같은 꼴). -->

    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
    const app = initializeApp({
        apiKey: "AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",
        authDomain: "vivivic-4b7ef.firebaseapp.com",
        projectId: "vivivic-4b7ef",

    window.fbRead = { collection, getDocs, doc, setDoc, deleteDoc, query, where };
    onAuthStateChanged(auth, (u) => {
        if (!u) { signInAnonymously(auth).catch(e => window.목록못읽음('창고에 들어가지 못했습니다', (e&&(e.code||e.message))||'')); return; }

<style>
/* 흰 바탕 · 표는 서류관리(vivivic-docs index.html) 「제품관리」 표와 같은 꼴 — 납품내역/CLAUDE.md 「표 디자인」. 다크 금지.
   겉꼴은 재단.html 에서 그대로 옮겼다. 값을 새로 짓지 마라. */
:root{

}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--vg-bg);color:var(--vg-body);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

.back{display:inline-block;font-size:13px;font-weight:600;color:var(--vg-muted);text-decoration:none;padding:10px 0 0}
.back:hover{color:var(--vg-ink)}

.logo b{font-size:15px;font-weight:800;letter-spacing:3.2px;color:var(--vg-ink);margin-right:4px}

  border:1px solid var(--vg-ink);border-radius:999px;padding:3px 9px}

/* 표 상자를 화면 높이로 묶어 가로 막대가 늘 보는 화면 아래에 오게 한다(납품내역/CLAUDE.md 「알아낸 것」 — 풀지 마라) */
.표통{overflow:auto;max-height:calc(100vh - 24px);-webkit-overflow-scrolling:touch;background:var(--vg-bg)}
/* 쪽은 화면 높이에 서고, 표 상자(.표통)가 남은 높이를 채워 그 안에서만 민다(v6.2.1 재단.html 과 같다). */
html,body{height:100%;overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;position:relative}
.wrap::-webkit-scrollbar{display:none}
.wrap>*{flex-shrink:0}
.wrap>#속{flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-top:4px}
#속>*{flex-shrink:0}
#속>.표통{flex:1 1 auto;min-height:0}
@media (max-width:600px),(max-height:600px){.wrap>#속{flex:1 0 auto} #속>.표통{flex:1 0 240px}}
/* 표 — 서류관리 제품관리(.dpr-t)와 같은 꼴 */
.dpr-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.dpr-t th{font-size:13px;font-weight:800;color:var(--vg-ink);text-align:left;vertical-align:bottom;
  padding:10px 12px;border-bottom:2px solid var(--vg-ink);background:var(--vg-bg);white-space:nowrap}
.dpr-t td{font-size:14px;color:var(--vg-body);padding:13px 12px;
  border-bottom:1px solid #D6D6D3;vertical-align:top;white-space:nowrap}
.dpr-t td.d{color:var(--vg-muted)}
.dpr-t .dpr-k{position:sticky;left:0;z-index:1;background:var(--vg-bg);font-weight:700;color:var(--vg-ink)}
/* 머리 칸 = 정렬 단추. 꼴은 th 그대로(13px/800/ink), 누르는 자리만 44px 로 키웠다. 머리줄은 위에 붙이지 않는다(「표 디자인」 — 제품관리도 안 붙는다). */
.dpr-t th.srt{padding:0}
.dpr-t th.srt button{display:block;width:100%;min-height:44px;padding:10px 12px;border:0;background:none;
  font:inherit;color:inherit;text-align:left;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dpr-t th.srt .ar{display:inline-block;width:10px;margin-left:4px;font-size:10px}
.empty{font-size:12px;color:var(--vg-muted);padding:6px 2px}
.state{background:var(--vg-fill);border-radius:14px;padding:22px 16px;text-align:center}
.state .big{font-size:14px;font-weight:600;color:var(--vg-ink);padding-bottom:6px}
.state .sub{font-size:12.5px;color:var(--vg-muted);line-height:1.85}
.state .why{font-size:11.5px;color:var(--vg-red);padding-top:6px;font-family:ui-monospace,monospace}
/* 벤더피아 단품 칸 — 칸 전체가 누르는 단추(44px). 고른 것은 단품명 + 작은 코드, 없으면 흐린 「단품 검색」 */
.dpr-t td.vpc{padding:0}
.vpc button{display:block;width:100%;min-height:46px;padding:13px 12px;border:0;background:none;font:inherit;font-size:14px;
  color:var(--vg-body);text-align:left;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
.vpc button.no{color:var(--vg-muted);font-size:13px}
.vpc .cd,.vpp .cd{font-size:12px;color:var(--vg-muted);margin-left:6px}
/* 단품 검색 판 — 화면에 붙어 서서(fixed) 표 상자 밖으로 잘리지 않는다 */
.vpp{position:fixed;z-index:50;background:var(--vg-bg);border:1px solid var(--vg-edge);border-radius:14px;
  box-shadow:0 8px 28px rgba(0,0,0,.14);display:flex;flex-direction:column;overflow:hidden}
.vpp .hd{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 14px}
.vpp .pn{flex:1;min-width:0;font-size:13px;font-weight:800;color:var(--vg-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vpp .x{width:44px;height:36px;border:0;background:none;font-size:20px;color:var(--vg-muted);cursor:pointer}
.vpp input[type=search]{margin:0 10px 8px;padding:10px 12px;font:inherit;font-size:16px;color:var(--vg-body);
  border:1px solid var(--vg-edge);border-radius:10px;background:var(--vg-fill);outline:none;-webkit-appearance:none}
.vpp input[type=search]:focus{border-color:var(--vg-ink);background:var(--vg-bg)}
.vpp .ls{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--vg-edge)}
.vpp .ls button{display:block;width:100%;min-height:44px;padding:11px 14px;border:0;border-bottom:1px solid #D6D6D3;
  background:none;font:inherit;font-size:14px;color:var(--vg-body);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.vpp .ls button.on{font-weight:700;color:var(--vg-ink);background:var(--vg-fill)}
.vpp .ls button.del{color:var(--vg-red)}
.vpp .ls .st{font-size:11px;color:var(--vg-muted);margin-left:6px}
/* 판매상태 「중지」 단품 딱지 — 단품명(14px)보다 작게, 붉은 테 */
.vpc .jj,.vpp .jj{display:inline-block;font-size:11px;font-weight:700;line-height:16px;color:var(--vg-red);
  border:1px solid var(--vg-red);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.vpp .ft{display:flex;justify-content:flex-end;padding:6px 10px;border-top:1px solid var(--vg-edge)}
.vpp .ft label{font-size:12px;font-weight:600;color:var(--vg-muted);padding:8px 6px;cursor:pointer}
.vpp .ft input{display:none}
.vpp .msg{font-size:12px;color:var(--vg-muted);padding:10px 14px}
.vpp .msg.bad{color:var(--vg-red)}
/* 제품명 칸 — 칸 전체가 누르는 단추(발주서 팝업). 글꼴·색은 첫 칸(.dpr-k) 그대로 */
.dpr-t td.pnc{padding:0}
.pnc button{display:block;width:100%;min-height:46px;padding:13px 12px;border:0;background:none;font:inherit;font-size:14px;
  font-weight:700;color:var(--vg-ink);text-align:left;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* 폰: 붙어 선 제품명 칸을 140px 로 묶고 긴 이름은 접는다 — 그 뒤 원장색상·벤더피아 단품 칸이 가리지 않게(v6.6.5). PC 는 그대로 */
@media (max-width:600px){.pnc button{width:140px;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}}
/* 발주서 팝업 — 화면 위에 뜬다. 길면 팝업 안에서만 민다 */
.pob{position:fixed;inset:0;z-index:60;background:rgba(17,17,16,.18)}
.pop{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1100px,calc(100% - 16px));
  max-height:calc(100% - 16px);background:var(--vg-bg);border:1px solid var(--vg-edge);border-radius:14px;
  box-shadow:0 8px 28px rgba(0,0,0,.14);display:flex;flex-direction:column;overflow:hidden}
.pop .hd{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 14px;border-bottom:1px solid var(--vg-edge)}
.pop .tt{flex:1;min-width:0}
.pop .pn{font-size:13px;font-weight:800;color:var(--vg-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .ps{font-size:12px;color:var(--vg-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .x{width:44px;height:36px;border:0;background:none;font-size:20px;color:var(--vg-muted);cursor:pointer}
.pop .bd{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 0 8px}
.pop .num{text-align:center}
.pop th.num{min-width:84px}
/* 날짜 가름줄 — 재단.html 과 같은 꼴 */
.pop .dpr-t tr.daysep td{font-size:17px;font-weight:700;color:var(--vg-ink);padding:18px 2px 4px;border-bottom:0;background:var(--vg-bg)}
.pop .dpr-t tr.daysep td .dpr-gn{display:inline-block;position:sticky;left:2px}
.pop tr.hit td,.pop tr.hit td.dpr-k,.pop tr.hit td.d{background:var(--vg-bg);font-weight:700;color:var(--vg-red)}

.pop .msg.bad{color:var(--vg-red);font-size:12px}
</style>

<body>
<div class="wrap">

<a class="back" href="납품내역.html">← 납품내역</a>
<header>
  <div class="logo"><b>VIVIVIC</b> — 제품목록</div>
  <div class="badge">v6.6.5</div>
</header>
<h1>제품목록</h1>
<div class="state" id="목상태"><div class="big">창고를 읽는 중입니다…</div></div>

<div id="속"></div>
</div>

<!-- 짚어서 지시하는 손잡이 — 바이글 박스에서 열면 켜진다. 화면을 갈아엎을 때도 이 줄은 남긴다. -->
<script src="../shared/viggle.js"></script>

<script>/* ════ 값은 **창고에서 받는다.** 읽기만 한다. ════ */
const 창고자리 = ['artifacts','vivivic-4b7ef','public','data','납품내역_제품목록'];
const 단품칸 = '벤더피아 단품';
const 칸 = ['제품명','원장색상',단품칸,'품목','사이즈','원장종류','원장모델명','원장출고처','출고예정일'];
let 줄들 = [];              /* 품목 줄마다 제품명을 붙인 한 줄 — 처음 차례(제품 순번 → 품목 차례)는 .차 */
let 정렬 = null;            /* {칸, 오름:true|false} — 처음엔 null(처음 차례) */
let 답했나 = false;

const 글 = v => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function 목상태(큰,작,까닭){
  const el=document.getElementById('목상태'); el.style.display='block';
  el.innerHTML = `<div class="big">${큰}</div>` + (작?`<div class="sub">${작}</div>`:'') + (까닭?`<div class="why">${까닭}</div>`:'');
}
window.목록못읽음 = (큰,까닭) => { 답했나=true; 목상태(큰,'관리자에게 알려 주십시오.',까닭||''); };

/* ⚠ 창고 꾸러미를 못 받아 오면 「읽는 중」 에서 영영 멈춘다 — 20초 안에 답이 없으면 그렇다고 적는다. */
setTimeout(() => { if(!답했나) 목상태('창고에 닿지 못했습니다',
  '인터넷이 끊겼거나 창고가 막혀 있습니다. 새로고침해 보십시오.'); }, 20000);

window.목록읽기 = async function(){
  try{
    const { collection, getDocs } = window.fbRead;
    const [눈] = await Promise.all([getDocs(collection(window.db, ...창고자리)), 연결읽기().catch(()=>{})]);   /* 고른 단품을 못 읽어도 표는 선다 */
    답했나 = true;
    const 제품들 = [];
    눈.forEach(d => { if(!d.id.startsWith('_')) 제품들.push(d.data()); });   /* _정보 = 모은때·셈(화면에 안 적는다) */
    document.getElementById('목상태').style.display='none';
    if(!제품들.length){ document.getElementById('속').innerHTML = '<div class="empty">줄 없음 — 창고에 제품목록이 아직 없습니다</div>'; return; }
    제품들.sort((a,b) => (a.순번||0)-(b.순번||0));
    줄들 = [];
    for(const p of 제품들) for(const q of (p.품목들||[])) 줄들.push({...q, 제품명:p.제품명||'', 차:줄들.length});
    정렬 = null;
    그리기();
    단품받기 = 단품읽기().then(() => { for(const p in 연결) 같은칸바꾸기(p); });   /* 판매중지 딱지 — 못 읽어도 표는 그대로 */
    단품받기.catch(() => { 단품받기 = null; });
  }catch(e){ 답했나=true; window.목록못읽음('창고를 읽지 못했습니다',(e&&(e.code||e.message))||''); }
};

/* 빈 칸은 오름·내림 어느 쪽이든 맨 아래. 숫자가 섞인 값(사이즈 등)은 숫자 순(numeric). 같으면 처음 차례. */
const 값 = (r,c) => c===단품칸 ? ((연결[r.제품명]||{}).단품명||'') : (r[c]==null)?'':String(r[c]).trim();
function 정렬하기(){

/* ════ 벤더피아 단품 ════

const 단품자리 = ['artifacts','vivivic-4b7ef','public','data','납품내역_단품목록'];

/* 낱말을 띄어 쓰면 낱말마다 다 들어 있는 단품만(띄어쓰기·대소문자 무시). 판매중이 먼저(목록 차례). 100개까지. */
function 목그리기(p, 물음, 목){

  if(!맞.length) t += '<div class="msg">맞는 단품 없음</div>';

async function 고르기(p, x, 목){

/* 벤더피아 단품관리 엑셀 → 단품코드·단품명·판매상태만 뽑아 `납품내역_단품목록` 을 통째로 갈아 끼운다(다른 칸은 안 담는다). */

async function 올리기(파일, p, 목, 칸글){

    await setDoc(doc(window.db, ...단품자리, '_정보'), {올린때:new Date().toISOString(), 단품수:다.length, 문서수:n, 파일:파일.name});

/* ════ 발주서 팝업 ════
   발주서 = 납품내역 **재단 줄**(창고 `납품내역`, `갈`='재단' — 재단.html 이 보이는 그 줄). **읽기만** 한다. 팝업을 처음 열 때 한 번 받는다.

     열쇠가 같은 재단 줄이 없으면(엑셀 세부내역 시트에만 있는 이름) 끝 괄호를 뗀 이름으로 **시작**하는 재단 줄 가운데
     그 제품의 품목·사이즈(·원장색상)가 같은 줄로 찾는다.
   발주서 한 장 = 그 제품 줄 가운데 **PO 가 코드(`아인2605-26-07` 꼴)인 가장 최근 줄**(달 → 일 → 순번 → PO)의 PO 로 된 재단 줄 전부
     (그 PO 가 여러 날에 걸치면 날마다 가름줄로 다 보인다). PO 가 코드인 줄이 없으면(빈 칸·샘플·과재고·당사포장출고 …)
     그 제품의 가장 최근 날 줄만 보인다. 고른 제품의 줄은 tr.hit(붉은 글씨). */
const 재단자리 = ['artifacts','vivivic-4b7ef','public','data','납품내역'];
const 재단칸 = ['PO','순번','제품명','품목','사이즈','재단수량','원장수량','원장종류','원장색상','원장모델명','원장출고처','원장입고일','재단금액','출고예정일','비고'];   /* 재단.html 목칸['재단'] 과 같다 */
const 수칸들 = new Set(['재단수량','원장수량','재단금액']);
let 재단들 = null;
async function 재단읽기(){
  const { collection, getDocs, query, where } = window.fbRead;
  const 눈 = await getDocs(query(collection(window.db, ...재단자리), where('갈','==','재단')));
  재단들 = [];
  눈.forEach(d => 재단들.push({...d.data(), _id:d.id}));
  재단들.forEach(r => { r._키 = 열쇠(r.제품명); r._po = 붙(r.PO); });
}
const 붙 = s => String(s==null?'':s).normalize('NFC').replace(/\s+/g,'');
const 열쇠 = s => 붙(s).replace(/\d+조$/,'');
const 코드 = po => /^[가-힣A-Za-z]+\d{4}-/.test(po);
const 수 = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const 늦은 = (a,b) => String(a.달||'').localeCompare(String(b.달||'')) || 수(a.일)-수(b.일) || 수(a.순번)-수(b.순번) || a._po.localeCompare(b._po);
function 찾기(p){
  const k = 열쇠(p);
  let 맞 = 재단들.filter(r => r._키 === k);
  if(!맞.length){
    const 밑 = k.replace(/\([^()]*\)$/,''), 품 = 줄들.filter(r => r.제품명 === p);
    const 같 = (r,q) => 붙(r.품목)===붙(q.품목) && String(q.사이즈||'').split(' / ').some(v=>붙(v)===붙(r.사이즈))
      && (!q.원장색상 || String(q.원장색상).split(' / ').some(v=>붙(v)===붙(r.원장색상)));
    if(밑) 맞 = 재단들.filter(r => r._키.startsWith(밑) && 품.some(q => 같(r,q)));
  }
  if(!맞.length) return null;
  const 끝 = (줄) => 줄.reduce((x,r) => !x || 늦은(r,x) > 0 ? r : x, null);
  const 코드줄 = 맞.filter(r => 코드(r._po));
  if(코드줄.length){
    const po = 끝(코드줄)._po;
    return { po: 끝(코드줄).PO, 장: 재단들.filter(r => r._po === po), 맞: new Set(맞) };
  }
  const x = 끝(맞);
  return { po: '', 장: 맞.filter(r => r.달===x.달 && 수(r.일)===수(x.일)), 맞: new Set(맞) };
}
const 날글 = r => (r.달 ? +String(r.달).slice(5,7)+'월 ' : '') + (r.일||'?') + '일';
function 발주서글(답){
  const 장 = 답.장.slice().sort((a,b) => 늦은(a,b) || a._id.localeCompare(b._id));
  let t = '<table class="dpr-t"><thead><tr>' + 재단칸.map((c,i)=>`<th class="${i?(수칸들.has(c)?'num':''):'dpr-k'}">${c}</th>`).join('') + '</tr></thead><tbody>';
  let 앞 = null;
  for(const r of 장){
    const 때 = 날글(r);
    if(때!==앞){ t += `<tr class="daysep"><td colspan="${재단칸.length}"><span class="dpr-gn">${때}</span></td></tr>`; 앞=때; }
    t += `<tr${답.맞.has(r)?' class="hit"':''}>` + 재단칸.map((c,i)=>{
      const v = (r[c]==null)?'':String(r[c]);
      return `<td class="${i?'':'dpr-k '}${v===''?'d':(수칸들.has(c)?'num':'')}">${v===''?'·':글(v).replace(/\n/g,' ')}</td>`;
    }).join('') + '</tr>';
  }
  return t + '</tbody></table>';
}
function 머리글(답){
  const 장 = 답.장.slice().sort(늦은), 날들 = [...new Set(장.map(날글))], 서류들 = [...new Set(장.map(r=>r.서류).filter(Boolean))];
  return [답.po ? String(답.po).replace(/\s+/g,' ').trim() : 'PO 없음', 날들.join(', '), 서류들.join(', ')].filter(Boolean).map(글).join(' · ');
}
let 팝 = null;
function 팝닫기(){ if(팝){ 팝.forEach(e=>e.remove()); 팝=null; } }
async function 팝열기(p){
  판닫기(); 팝닫기();
  const 뒤 = document.createElement('div'); 뒤.className='pob';
  const 창 = document.createElement('div'); 창.className='pop';
  창.innerHTML = '<div class="hd"><div class="tt"><div class="pn"></div><div class="ps"></div></div><button type="button" class="x" aria-label="닫기">✕</button></div><div class="bd"><div class="msg">읽는 중…</div></div>';
  창.querySelector('.pn').textContent = p;
  뒤.addEventListener('click', 팝닫기);
  창.querySelector('.x').addEventListener('click', 팝닫기);
  document.body.append(뒤, 창); 팝 = [뒤, 창];
  const 몸 = 창.querySelector('.bd');
  try{ if(!재단들) await 재단읽기(); }
  catch(e){ 몸.innerHTML = `<div class="msg bad">발주서를 읽지 못했습니다 ${글((e&&(e.code||e.message))||'')}</div>`; return; }
  if(!팝 || 팝[1]!==창) return;
  const 답 = 찾기(p);
  if(!답){ 몸.innerHTML = '<div class="msg">발주서 없음</div>'; return; }
  창.querySelector('.ps').innerHTML = 머리글(답);
  몸.innerHTML = 발주서글(답);
}
document.getElementById('속').addEventListener('click', e => {
  const b = e.target.closest('td.pnc button'); if(!b) return;
  팝열기(b.dataset.p);
});
document.addEventListener('keydown', e => { if(e.key==='Escape') 팝닫기(); });

/* 머리 칸 누름: 다른 열 → 그 열 오름, 같은 열 → 오름 ↔ 내림 */
document.getElementById('속').addEventListener('click', e => {
  const b = e.target.closest('th.srt button'); if(!b) return;
  const c = b.dataset.c;
  정렬 = (정렬&&정렬.칸===c) ? {칸:c, 오름:!정렬.오름} : {칸:c, 오름:true};
  그리기();
});
