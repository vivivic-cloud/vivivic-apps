<style>
/* v6.1.0 (10-22) — 사장님: 「다크화면 컨셉은 삭제해줘」 → 흰 바탕.
   표는 서류관리(vivivic-docs index.html) 「제품관리」 표와 같은 꼴 — 납품내역/CLAUDE.md 「표 디자인」 을 따른다.
   색 낱말은 그 파일 --vg-* 와 같은 값이다. 값을 새로 짓지 마라. */
:root{
  --vg-bg:#fff; --vg-ink:#111110; --vg-body:#1A1A19;
  --vg-muted:#9C9C98; --vg-edge:#E2E2DF; --vg-fill:#F4F4F2; --vg-red:#FF3B30;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--vg-bg);color:var(--vg-body);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

.back{display:inline-block;font-size:13px;font-weight:600;color:var(--vg-muted);text-decoration:none;padding:10px 0 0}
.back:hover{color:var(--vg-ink)}
header{padding:6px 0 2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:13px;color:var(--vg-muted)}
.logo b{font-size:15px;font-weight:800;letter-spacing:3.2px;color:var(--vg-ink);margin-right:4px}
.badge{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--vg-ink);
  border:1px solid var(--vg-ink);border-radius:999px;padding:3px 9px}
h1{font-size:30px;line-height:1.1;letter-spacing:-1.2px;font-weight:700;color:var(--vg-ink);padding:4px 0 12px}
/* v6.2.0 — 월 버튼: 서류관리(vivivic-docs index.html) .chip 꼴(둥근 알, 12px/600, 5px 12px). 색은 --vg-* 낱말. */
.months{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;font-family:inherit;font-size:12px;font-weight:600;line-height:1.45;padding:5px 12px;background:#fff;
  border:1px solid var(--vg-edge);color:var(--vg-body);cursor:pointer;font-variant-numeric:tabular-nums;transition:all .12s}
.chip:hover{background:var(--vg-fill)}
.chip.on{background:var(--vg-ink);border-color:var(--vg-ink);color:#fff}
/* 사장님 10-20: 가로 스크롤이 표 맨 아래에 있어 위쪽을 볼 때 못 쓴다 → 표 상자를 화면 높이로 묶어 스크롤 막대가 늘 보는 화면 아래에 오게 한다 */
#표통{overflow:auto;max-height:calc(100vh - 24px);-webkit-overflow-scrolling:touch;background:var(--vg-bg)}
/* v6.2.1 사장님 10-26 「화면전체를 스크롤 하는 스크롤바를 삭제 해줘」 → 쪽은 화면 높이에 서고, 표 상자(#표통)가 남은 높이를 채워 그 안에서만 민다.
   PC 에선 꼬리(footer)가 화면 바로 아래에 있어 .wrap 을 끝까지 밀면 보인다. #표틀 은 JS 가 display:flex 로 켠다(폴더쪽.js).
   v6.3.0: 꼬리·설명 글을 걷어 머리는 ← 납품내역 · 제목 · 월 버튼뿐 — 표 상자가 그만큼 길다. */
html,body{height:100%;overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;position:relative}
.wrap::-webkit-scrollbar{display:none}
.wrap>*{flex-shrink:0}
.wrap>#표틀{flex:1 1 0;min-height:0;flex-direction:column;margin-top:12px}
#표틀>*{flex-shrink:0}
#표틀>#표통{flex:1 1 auto;min-height:0}
/* 낮은 창·폰: 표 상자는 240px 아래로 안 줄고, 넘친 만큼 .wrap 이 막대 없이 밀린다. */
@media (max-width:600px),(max-height:600px){.wrap>#표틀{flex:1 0 auto} #표틀>#표통{flex:1 0 240px}}
/* 표 — 서류관리 제품관리(.dpr-t)와 같은 꼴: 굵은 머리줄, 그 아래 굵은 선 하나, 줄마다 옅은 선, 숫자는 가운데, 첫 칸은 붙어 선다. */
.dpr-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.dpr-t th{font-size:13px;font-weight:800;color:var(--vg-ink);text-align:left;vertical-align:bottom;
  padding:10px 12px;border-bottom:2px solid var(--vg-ink);background:var(--vg-bg);white-space:nowrap}
.dpr-t th.num{min-width:84px}
.dpr-t td{font-size:14px;color:var(--vg-body);padding:13px 12px;
  border-bottom:1px solid #D6D6D3;vertical-align:top;white-space:nowrap}
.dpr-t .num{text-align:center}
.dpr-t td.d{color:var(--vg-muted)}
.dpr-t .dpr-k{position:sticky;left:0;z-index:1;background:var(--vg-bg);font-weight:700;color:var(--vg-ink)}
/* 날짜 가름줄 = 제품관리의 묶음 머리(.dpr-gh / .dpr-gn) 꼴 */
.dpr-t tr.daysep td{font-size:17px;font-weight:700;color:var(--vg-ink);padding:18px 2px 4px;border-bottom:0;background:var(--vg-bg)}
.dpr-t tr.daysep td .dpr-gn{display:inline-block;position:sticky;left:2px}
.dpr-t td.dpr-none{font-size:12px;color:var(--vg-muted);padding:6px 2px;white-space:normal}
.state{background:var(--vg-fill);border-radius:14px;padding:22px 16px;text-align:center;margin-top:10px}
.state .big{font-size:14px;font-weight:600;color:var(--vg-ink);padding-bottom:6px}
.state .sub{font-size:12.5px;color:var(--vg-muted);line-height:1.85}
.state .why{font-size:11.5px;color:var(--vg-red);padding-top:6px;font-family:ui-monospace,monospace}
</style>
