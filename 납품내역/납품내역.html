  '<b>실제청구명세서만 PDF</b>입니다. 나머지는 다 엑셀입니다. PDF는 글자를 긁어내야 해서 <b class="warn">속을 세기 어렵습니다.</b>',
  '<b>파일 이름이 겹쳐 붙어 있습니다</b> — <code>.xlsx.xlsx</code> · <code>.pdf.pdf</code> · <code>.zip.zip</code>. 카톡으로 받으면 그렇게 됩니다.',
  '<b>이 화면은 「무엇이 몇 개 있나」 까지입니다.</b> 파일 <b>속</b>은 세지 않았습니다 — 여쭙고 하겠습니다.',
];

document.getElementById('셈').innerHTML =
  `<div class="c"><div class="k">폴더</div><div class="v">8<small>개</small></div></div>` +
  `<div class="c"><div class="k">파일</div><div class="v">62<small>개</small></div></div>` +
  `<div class="c"><div class="k">엑셀</div><div class="v">13<small>개</small></div></div>` +
  `<div class="c"><div class="k">PDF</div><div class="v">47<small>장</small></div></div>` +
  `<div class="c"><div class="k">묶음</div><div class="v">2<small>개</small></div></div>` +
  `<div class="c"><div class="k">빈 폴더</div><div class="v">1<small>개</small></div></div>`;

document.getElementById('나무').innerHTML = 나무.map((n, i) => {
  const 들 = n.깊이 === 0 ? '' : '　'.repeat(n.깊이 - 1) + '└ ';
  const 수 = n.수 ? `<span class="num ${n.빔 ? 'empty' : ''}">${n.수}</span>` : '';
  const 새 = n.새 ? `<span class="kind nw">새로 생김</span>` : '';
  return `<div class="node">` +
    `<button class="row" type="button" data-i="${i}">` +
      `<span class="ind">${들}</span>` +
      `<span class="nm ${n.꼴 === '폴더' ? '' : 'f'}">${n.이름}</span>` +
      새 + `<span class="kind">${n.꼴}</span>` + 수 +
    `</button>` +
    `<div class="sub hide" id="s${i}">${n.속}</div>` +
  `</div>`;
}).join('');

document.getElementById('쪽지').innerHTML =
  쪽지들.map(t => `<div class="note">· ${t}</div>`).join('');

/* ── 폴더를 누르면 그 안 파일에서 **읽어낸 것**을 편다. 값이 아니라 꼴이다. ── */
function 속표(키){
  const v = 속[키]; if(!v) return '';
  let h = '<div class="dig">';

  // 달마다 장 몇 개 · 줄 몇 개
  if(v.달){
    const ms = Object.keys(v.달);
    const 날꼴 = ms.length && typeof v.달[ms[0]] === 'object';
    h += '<div class="dt">달마다 읽어낸 줄</div><div class="tbox"><table><thead><tr>' +
         (날꼴 ? '<th>달</th><th>장</th><th>줄</th><th>쪽지</th>' : '<th>달</th><th>줄</th>') +
         '</tr></thead><tbody>';
    let 합=0;
    for(const m of ms){
      const o = v.달[m];
      if(날꼴){
        const 줄 = o.줄; 합 += 줄;
        const 쪽 = o.날장 === 0 ? '<span class="warn">날짜별 장이 없음 — 한 장에 몰려 있음</span>'
                 : (o.총장 > 1 ? '<span class="q">총괄 장 ' + o.총장 + '개</span>' : '');
        h += `<tr><td>${m}</td><td class="num">${o.장}</td><td class="num"><b>${줄}</b></td><td class="sm">${쪽}</td></tr>`;
      } else { 합 += o; h += `<tr><td>${m}</td><td class="num"><b>${o}</b></td></tr>`; }
    }
    h += `<tr class="tot"><td>합</td>${날꼴?'<td></td>':''}<td class="num"><b>${합}</b></td>${날꼴?'<td></td>':''}</tr>`;
    h += '</tbody></table></div>';
  }

  // 칸 이름
  if(v.칸) h += '<div class="dt">칸 이름 — 나온 것 전부 ' + v.칸.length + '가지</div>' +
                '<div class="cols">' + v.칸.map(c=>`<span class="col">${c}</span>`).join('') + '</div>';

  // 꼴 몇 가지
  if(v.꼴){
    h += '<div class="dt">머리줄 꼴 — <b>' + v.꼴.length + '가지</b>' +
         (v.꼴.length>1 ? ' <span class="warn">장마다 같지 않습니다</span>' : '') + '</div>';
    for(const [꼴,n] of v.꼴) h += `<div class="shape"><span class="q">[${n}장]</span> ${꼴}</div>`;
  }

  // 총괄 장 이름
  if(v.총괄장 && v.총괄장.length)
    h += '<div class="dt">총괄 장 이름 — <b>' + v.총괄장.length + '가지</b></div>' +
         '<div class="cols">' + v.총괄장.map(c=>`<span class="col">${c}</span>`).join('') + '</div>';

  // 납품만 — 표가 아닌 장
  if(v.딴장 && v.딴장.length){
    h += '<div class="dt">표가 아닌 장</div><div class="cols">' +
         v.딴장.map(([t,n])=>`<span class="col">${t} <span class="q">${n}</span></span>`).join('') + '</div>';
  }
  if(v.목록장) h += '<div class="shape"><span class="warn">거래처별 출고목록 ' + v.목록장.수 +
         '개 가운데 <b>' + v.목록장.쉼표 + '개</b>에 쉼표가 들어 있고, <b>' + v.목록장.딴이름 +
         '개</b>는 거래처 이름 대신 다른 말로 적혀 있습니다.</span></div>';

  return h + '</div>';
}

document.querySelectorAll('.node').forEach((nd,i) => {
  const 이름 = (나무[i]||{}).이름;
  const 키 = {'재단':'재단','납품':'납품','보링':'보링','엣지':'엣지'}[이름];
  if(!키) return;
  nd.querySelector('.sub').insertAdjacentHTML('beforeend', 속표(키));
  nd.querySelector('.row').insertAdjacentHTML('beforeend',
    '<span class="kind dig-t">읽어낸 것</span>');
});

document.getElementById('나무').addEventListener('click', e => {
  const b = e.target.closest('.row');
  if (!b) return;
  document.getElementById('s' + b.dataset.i).classList.toggle('hide');
});
</script>
