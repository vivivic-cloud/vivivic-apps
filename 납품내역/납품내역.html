  `<div class="v">${D.센것[g]}<small>줄</small></div>`+
  `<div class="d">${D.날[g].join('·')}일</div></div>`
).join('');

  let h='';
  for(const g of 갈래들){
    const v = D.꼴[g]||{};
    const 묶음 = {};
    for(const sh in v){ const k=v[sh].join(' · '); (묶음[k]=묶음[k]||[]).push(sh); }

    h += `<div class="shape"><b>${g}</b>`;

      h += `<div class="shape">　<span class="cols">[${묶음[k].join(', ')}]</span></div>`;

    h += '<div class="gap"></div>';
  }
  document.getElementById('꼴').innerHTML = h;
