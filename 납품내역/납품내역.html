<!DOCTYPE html>
<!-- 납품내역 — 사장님 드라이브 「관리프로그램 / Amt양식」 **폴더 구조 그대로** 보인다.
     판 번호는 머리의 배지와 같다. 고칠 때 둘을 같이 올린다: v4.0.0

     ⚠ 이 화면에는 **업무 값이 한 톨도 없다.** 금액·단가·거래처·제품 이름·크기·PO 번호
        어느 것도 넣지 않는다. 이 저장소는 누구나 보는 곳이다.
     ⚠ 창고(화베)에 **닿지 않는다.** 읽지도 쓰지도 않는다. 이 파일에는 화베가 없다.
     ⚠ 거래처 이름은 **한 곳도 적지 않는다.** 실제청구명세서는 「재단 쪽·보링 쪽·엣지 쪽」
        으로만 갈라 센다. 파일 이름은 폴더에 적힌 그대로 둔다(그 안의 `AMT` 는 담당 폴더
        이름 `Amt양식` 과 같은 말이고 이 저장소에 이미 앱 폴더로 있다).
     ⚠ 센 값은 2026-10-14 에 드라이브를 읽어 적은 것이다. 짐작이 아니다. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>납품내역</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1a1a1a;color:#c8c8c8;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}

header{padding:18px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.logo{font-size:12px;color:#444;letter-spacing:.16em;text-transform:uppercase}
.logo b{color:#fff;font-weight:600}
.badge{font-size:10px;color:#2e2e2e;border:1px solid #262626;padding:2px 6px;border-radius:3px;letter-spacing:.06em}
h1{font-size:15px;color:#d8d8d8;font-weight:500;padding:2px 0 12px}
.where{font-size:11.5px;color:#555;line-height:1.9;padding-bottom:14px;border-bottom:1px solid #222}
.where code{color:#7a7a7a;font-size:10.5px}
.where b{color:#9a9a9a}
.lock{color:#c9a227}

.cnt{display:flex;gap:6px;flex-wrap:wrap;padding:16px 0 4px}
.c{border:1px solid #262626;background:#1f1f1f;padding:8px 11px;min-width:88px}
.c .k{font-size:10.5px;color:#5f5f5f}
.c .v{font-size:17px;color:#d8d8d8;font-variant-numeric:tabular-nums;padding-top:2px}
.c .v small{font-size:10px;color:#4a4a4a;margin-left:2px}

h2{font-size:12px;color:#8a8a8a;font-weight:600;letter-spacing:.04em;padding:28px 0 8px;border-bottom:1px solid #222;margin-bottom:12px}

/* 나무 */
.tree{border:1px solid #242424;background:#1c1c1c}
.node{border-bottom:1px solid #222}
.node:last-child{border-bottom:none}
.row{display:flex;align-items:baseline;gap:8px;padding:10px 12px;width:100%;text-align:left;
     background:none;border:none;font-family:inherit;cursor:pointer;color:inherit}
.row:hover{background:#212121}
.row.plain{cursor:default}
.row.plain:hover{background:none}
.ind{color:#333;font-size:11px;white-space:pre;flex-shrink:0}
.nm{font-size:13px;color:#d0d0d0;flex:1;min-width:0;word-break:break-all}
.nm.f{color:#9a9a9a;font-size:12px}
.kind{font-size:10px;color:#5f5f5f;border:1px solid #2a2a2a;padding:1px 6px;border-radius:3px;flex-shrink:0}
.num{font-size:11px;color:#6f6f6f;font-variant-numeric:tabular-nums;flex-shrink:0}
.num b{color:#c8c8c8;font-weight:600}
.empty{color:#8c5a5a}
.nw{color:#8aa87a}
.sub{padding:0 12px 11px 12px;font-size:11.5px;color:#6a6a6a;line-height:1.95}
.sub b{color:#bdbdbd;font-weight:600}
.sub .q{color:#5f5f5f}
.sub.hide{display:none}

.note{font-size:11.5px;color:#6a6a6a;line-height:1.95;padding:2px 0 2px 13px;text-indent:-13px}
.note b{color:#bdbdbd;font-weight:600}
.note .warn{color:#c9a227}

footer{font-size:10px;color:#2a2a2a;padding:30px 0 24px;border-top:1px solid #1e1e1e;margin-top:30px;line-height:2}
@media(max-width:560px){.wrap{padding:0 14px}.nm{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo"><b>VIVIVIC</b> — 납품내역</div>
  <div class="badge">v4.0.0</div>
</header>
<h1>담당 폴더에 들어 있는 것</h1>
<div class="where">
  구글드라이브 <code>관리프로그램 / Amt양식</code><br>
  <b>2026-10-14</b> 에 읽어 센 값입니다.<br>
  <span class="lock">⚠ 이 화면에는 금액·단가·거래처·제품 이름이 <b>없습니다.</b> 이 저장소는 누구나 보는 곳입니다.</span>
</div>

<div class="cnt" id="셈"></div>

<h2>폴더 구조 그대로</h2>
<div class="tree" id="나무"></div>

<h2>못 본 것 · 적어 둘 것</h2>
<div id="쪽지"></div>

<footer>
  읽기만 합니다. 드라이브에 아무것도 쓰지 않습니다.<br>
  거래처 이름은 적지 않았습니다 — 실제청구명세서는 「재단 쪽·보링 쪽·엣지 쪽」 으로만 갈라 세었습니다.<br>
  파일 이름은 폴더에 적힌 그대로입니다.
</footer>
</div>

<script>
/* 드라이브를 읽어 적은 것. 값이 아니라 **무엇이 몇 개 있는지**다. */
const 나무 = [
  { 깊이:0, 이름:'Amt양식', 꼴:'폴더', 수:'', 속:
    '사장님이 올려 주신 담당 폴더입니다. 이 안에서만 일합니다.' },

  { 깊이:1, 이름:'TalkFile_AMT 재단거래명세표(26년 10월분).xlsx.xlsx', 꼴:'엑셀', 수:'', 속:
    '이 달(10월) 재단 치입니다. 아래 <b>거래내역/재단</b> 의 4~9월과 같은 꼴인데 <b>여기 따로</b> 놓여 있습니다.' },
  { 깊이:1, 이름:'TalkFile_26년 10월 엣지출고내역.xlsx.xlsx', 꼴:'엑셀', 수:'', 속:
    '이 달(10월) 엣지 치입니다. <b>거래내역/엣지</b> 의 묶음은 4~9월까지라 10월만 여기 있습니다.' },
  { 깊이:1, 이름:'TalkFile_AMT 10월 7일 재단거래명세표.pdf.pdf', 꼴:'PDF', 수:'', 속:
    '10월 7일 <b>하루치</b>입니다. 다른 것들은 다 달치인데 이것만 날짜 하나입니다.' },

  { 깊이:1, 이름:'거래내역', 꼴:'폴더', 수:'', 속:
    '아래 여섯 폴더로 갈라져 있습니다. 파일은 바로 들어 있지 않습니다.' },

  { 깊이:2, 이름:'재단', 꼴:'폴더', 수:'엑셀 6', 속:
    '바로 밑에 파일이 없고 <b>TalkFile_재단4월~9월</b> 폴더가 한 겹 더 있습니다.<br>' +
    '그 안에 <b>4·5·6·7·8·9월</b> 한 달에 하나씩 엑셀 6개.<br>' +
    '<span class="q">※ 10월분은 여기 없고 맨 위에 따로 있습니다.</span>' },
  { 깊이:3, 이름:'TalkFile_재단4월~9월', 꼴:'폴더', 수:'엑셀 6', 속:
    'AMT 재단거래명세표(26년 <b>4·5·6·7·8·9</b>월분).xlsx — 여섯 개입니다.' },

  { 깊이:2, 이름:'납품', 꼴:'폴더', 수:'엑셀 5', 속:
    '거래처 <b>다섯 곳</b>, 한 곳에 <b>한 해치</b> 엑셀 하나씩입니다.<br>' +
    '달마다 나누지 않고 <b>해마다</b> 나눕니다 — 재단·보링·엣지와 <b>가르는 잣대가 다릅니다.</b>' },

  { 깊이:2, 이름:'보링', 꼴:'폴더', 수:'묶음 1', 속:
    'TalkFile_보링4월~9월.zip.zip <b>묶음 하나</b>뿐입니다. 안에 달치 엑셀 <b>6개</b>(4~9월).<br>' +
    '<span class="q">※ 10월분이 <b>없습니다.</b></span>' },
  { 깊이:2, 이름:'엣지', 꼴:'폴더', 수:'묶음 1', 속:
    'TalkFile_엣지4월~9월.zip.zip <b>묶음 하나</b>뿐입니다. 안에 달치 엑셀 <b>6개</b>(4~9월).<br>' +
    '<span class="q">※ 10월분은 맨 위에 풀린 채로 따로 있습니다.</span>' },
  { 깊이:2, 이름:'nc', 꼴:'폴더', 수:'비었음', 빔:true, 속:
    '<b>아무것도 없습니다. 0개입니다.</b> 만들어 두고 아직 안 넣으신 것으로 보입니다.' },

  { 깊이:2, 이름:'실제청구명세서', 꼴:'폴더', 수:'PDF 46', 새:true, 속:
    '<b>10-13 에 새로 만드신 폴더</b>입니다. 다른 폴더는 엑셀인데 <b>여기만 PDF</b>입니다.<br><br>' +
    '<b>달로 나누면</b> — 4월 8 · 5월 8 · 6월 8 · 7월 8 · 8월 7 · 9월 7 &nbsp;= <b>46장</b><br>' +
    '<b>낸 곳으로 나누면</b> — 재단 쪽 <b>22</b> · 보링 쪽 <b>12</b> · 엣지 쪽 <b>12</b><br>' +
    '<b>서류 이름으로 나누면</b> — 거래명세표 <b>28</b> · 총출고내역 <b>12</b> · 상세내역서 <b>5</b> · 상세내역세 <b>1</b><br><br>' +
    '<span class="q">※ 「상세내역<b>세</b>」 한 장은 「상세내역<b>서</b>」 의 오타로 보입니다(5월분).</span><br>' +
    '<span class="q">※ 9월 한 장은 낸 곳 이름이 <b>다른 글자</b>로 적혀 있습니다.</span>' },
];

const 쪽지들 = [
  '<b>층</b> — Amt양식 밑으로 <b>4층</b>까지 내려갑니다 (거래내역 → 재단 → TalkFile_재단4월~9월 → 파일).',
  '<b>묶음 둘은 안 풀려 있습니다</b> — 보링·엣지. 묶음 속 엑셀 12개는 드라이브에서 따로 세어지지 않습니다.',
  '<b>10월이 흩어져 있습니다</b> — 재단 10월·엣지 10월은 <b>맨 위</b>에, 4~9월은 <b>거래내역 안</b>에 있습니다. 보링 10월은 <b class="warn">아예 없습니다.</b>',
  '<b>가르는 잣대가 둘입니다</b> — 재단·보링·엣지는 <b>달</b>로 가르고, 납품은 <b>거래처</b>로 가릅니다.',
  '<b>실제청구명세서만 PDF</b>입니다. 나머지는 다 엑셀입니다. PDF는 글자를 긁어내야 해서 <b class="warn">속을 세기 어렵습니다.</b>',
  '<b>파일 이름이 겹쳐 붙어 있습니다</b> — <code>.xlsx.xlsx</code> · <code>.pdf.pdf</code> · <code>.zip.zip</code>. 카톡으로 받으면 그렇게 됩니다.',
  '<b>이 화면은 「무엇이 몇 개 있나」 까지입니다.</b> 파일 <b>속</b>은 세지 않았습니다 — 여쭙고 하겠습니다.',
];

document.getElementById('셈').innerHTML =
  `<div class="c"><div class="k">폴더</div><div class="v">8<small>개</small></div></div>` +
  `<div class="c"><div class="k">파일</div><div class="v">62<small>개</small></div></div>` +
  `<div class="c"><div class="k">엑셀</div><div class="v">13<small>개</small></div></div>` +
  `<div class="c"><div class="k">PDF</div><div class="v">47<small>장</small></div></div>` +
  `<div class="c"><div class="k">묶음</div><div class="v">2<small>개</small></div></div>` +
  `<div class="c"><div class="k">빈 폴더</div><div class="v">1<small>개</small></div></div>`;

document.getElementById('나무').innerHTML = 나무.map((n, i) => {
  const 들 = n.깊이 === 0 ? '' : '　'.repeat(n.깊이 - 1) + '└ ';
  const 수 = n.수 ? `<span class="num ${n.빔 ? 'empty' : ''}">${n.수}</span>` : '';
  const 새 = n.새 ? `<span class="kind nw">새로 생김</span>` : '';
  return `<div class="node">` +
    `<button class="row" type="button" data-i="${i}">` +
      `<span class="ind">${들}</span>` +
      `<span class="nm ${n.꼴 === '폴더' ? '' : 'f'}">${n.이름}</span>` +
      새 + `<span class="kind">${n.꼴}</span>` + 수 +
    `</button>` +
    `<div class="sub hide" id="s${i}">${n.속}</div>` +
  `</div>`;
}).join('');

document.getElementById('쪽지').innerHTML =
  쪽지들.map(t => `<div class="note">· ${t}</div>`).join('');

document.getElementById('나무').addEventListener('click', e => {
  const b = e.target.closest('.row');
  if (!b) return;
  document.getElementById('s' + b.dataset.i).classList.toggle('hide');
});
</script>
</body>
</html>
