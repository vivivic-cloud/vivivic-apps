<!DOCTYPE html>
<!-- 납품내역 — 메뉴. 사장님 드라이브 「관리프로그램 / Amt양식 / 거래내역」 의 폴더마다 박스 하나.
     ⚠ 10-22 사장님 분부: 「현재 한페이지에서 필터링으로 보이는 화면을 없애고 각 폴더별 메뉴를 만들어서
        해당 파일만 정리되어 되어 보이는 페이지로 구성」 「메뉴디자인은 바이글의 박스형식 일관성을 유지」
        → v6.0.0 에서 달·갈래·거래처·며칠 알약과 표를 걷어내고, 폴더 박스 메뉴를 놓았다.
        박스를 누르면 그 폴더 페이지(재단.html · 보링.html · 엣지.html · 납품.html · 실제청구명세서.html)로 간다.
        그 다섯 파일은 **다른 작업자 몫**이다. 이 파일에서는 이름만 잇는다.
     ⚠ 박스 꼴은 바이글 첫 화면(viggle/index.html)의 `.abox` 그대로다 — 값을 새로 짓지 않는다.
     ⚠ 10-14 사장님 분부: 「폴더구조는 안보여도되니 삭제해줘」 — 폴더 **나무**는 다시 붙이지 않는다.
        박스는 나무가 아니라 메뉴다(한 층만).
     판 번호는 머리의 배지와 같다. 고칠 때 둘을 같이 올린다: v6.0.0

     ⚠ 이 화면에는 **업무 값이 한 톨도 없다.** 금액·단가·거래처·제품 이름·크기·PO 번호
        어느 것도 넣지 않는다. 이 저장소는 누구나 보는 곳이다.
     ⚠ 이 메뉴는 창고(화베)에 **닿지 않는다.** 줄은 폴더 페이지가 읽는다.
     ⚠ 파일 수는 2026-10-22 에 바이글이 드라이브를 세어 적은 것이다. 짐작이 아니다. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>납품내역</title>
<style>
/* 바이글 첫 화면의 낱값 그대로 */
:root{
  --bg:#fff; --ink:#111110; --body:#1A1A19; --soft:#6E6E6A; --muted:#9C9C98;
  --line:#EDEDEB; --edge:#E2E2DF; --fill:#F4F4F2; --fill2:#EAEAE7; --red:#FF3B30;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--body);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

header{padding:18px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand b{font-size:15px;font-weight:800;letter-spacing:3.2px;color:var(--ink)}
.brand span{font-size:13px;color:var(--soft);margin-left:6px}
.badge{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--ink);
  border:1px solid var(--ink);border-radius:999px;padding:3px 9px}
h1{font-size:30px;line-height:1.1;letter-spacing:-1.2px;font-weight:700;color:var(--ink);padding:10px 0 4px}
.sub{color:var(--muted);font-size:14px;padding-bottom:18px}

/* ── 폴더 박스 — viggle/index.html 의 .abox 그대로 ── */
.allgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.abox{position:relative;border-radius:20px;border:1px solid var(--edge);background:#fff;
  padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;
  color:inherit;text-decoration:none;min-height:104px;transition:transform .12s}
.abox:active{transform:scale(.975)}
.abox.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.abox.light{background:var(--fill);border-color:transparent}
.abox .nm{font-size:15px;font-weight:600;line-height:1.25;word-break:keep-all}
.abox .mt{font-size:12px;color:var(--muted)}
.abox.dark .mt{color:rgba(255,255,255,.5)}
/* 빈 폴더 — 박스는 두되 누를 곳이 없다 */
.abox.empty{border-style:dashed;cursor:default;color:var(--soft)}
.abox.empty:active{transform:none}

.sec{font-size:19px;font-weight:700;letter-spacing:-.4px;color:var(--ink);margin:30px 0 12px}
.cnt{display:flex;gap:6px;flex-wrap:wrap}
.c{background:var(--fill);border-radius:14px;padding:8px 12px;min-width:84px}
.c .k{font-size:11px;color:var(--muted)}
.c .v{font-size:17px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.c .v small{font-size:10px;color:var(--muted);margin-left:2px;font-weight:400}
.note{font-size:12.5px;color:var(--soft);line-height:1.85;padding:2px 0 2px 13px;text-indent:-13px}
.note b{color:var(--body);font-weight:600}
.note .warn{color:#B8860B}
footer{font-size:11px;color:var(--muted);padding:26px 0 24px;border-top:1px solid var(--line);margin-top:30px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand"><b>VIVIVIC</b><span>납품내역</span></div>
  <div class="badge">v6.0.0</div>
</header>
<h1>거래내역</h1>
<div class="sub">폴더를 누르면 그 폴더 파일만 봅니다.</div>

<div class="allgrid" id="메뉴"></div>

<div class="sec">갯수</div>
<div class="cnt" id="셈"></div>

<div class="sec">못 본 것 · 적어 둘 것</div>
<div id="쪽지"></div>

<footer>
  읽기만 합니다. 드라이브에 아무것도 쓰지 않습니다.<br>
  실제청구명세서는 PDF 46장을 열어 7,840줄을 창고에 담았습니다 — 사람 이름·전화·주소·등록번호는 담지 않았고, 업체 이름은 서류에 적힌 그대로입니다.<br>
  파일 이름은 폴더에 적힌 그대로입니다.
</footer>
</div>

<script>
/* 폴더 하나 = 박스 하나. 파일 수는 10-22 바이글이 드라이브에서 센 값이다.
   쪽 = 그 폴더 페이지. 다른 작업자가 같은 이름으로 만든다. nc 는 빈 폴더라 쪽이 없다. */
const 폴더들 = [
  { 이름:'재단',           쪽:'재단.html',           수:8,  꼴:'dark',  덧:'원장소요량 포함' },
  { 이름:'보링',           쪽:'보링.html',           수:1,  꼴:'light' },
  { 이름:'엣지',           쪽:'엣지.html',           수:1,  꼴:'light' },
  { 이름:'납품',           쪽:'납품.html',           수:7,  꼴:'' },
  { 이름:'실제청구명세서', 쪽:'실제청구명세서.html', 수:47, 꼴:'dark' },
  { 이름:'nc',             쪽:'',                    수:0,  꼴:'empty' },
];
const 폴더그림 = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

document.getElementById('메뉴').innerHTML = 폴더들.map(f => {
  const 속 = `<span>${폴더그림}</span><span class="nm">${f.이름}</span>` +
    `<span class="mt">${f.수 ? '파일 ' + f.수 + '개' + (f.덧 ? ' · ' + f.덧 : '') : '비어 있음'}</span>`;
  return f.쪽 ? `<a class="abox ${f.꼴}" href="${f.쪽}">${속}</a>`
              : `<div class="abox ${f.꼴}" aria-disabled="true">${속}</div>`;
}).join('');

/* 드라이브를 읽어 적은 것. 값이 아니라 **무엇이 몇 개 있는지**다. (v5 에서 그대로 옮김) */
const 쪽지들 = [
  '<b>층</b> — Amt양식 밑으로 <b>4층</b>까지 내려갑니다 (거래내역 → 재단 → TalkFile_재단4월~9월 → 파일).',
  '<b>묶음 둘은 안 풀려 있습니다</b> — 보링·엣지. 묶음 속 엑셀 12개는 드라이브에서 따로 세어지지 않습니다.',
  '<b>재단·보링·엣지는 4~9월뿐입니다</b> — 모두 <b>거래내역 안</b>에 있습니다. 10월 것은 <b class="warn">없습니다.</b> 10월 납품 줄은 거래처 장부에서 나온 것입니다.',
  '<b>가르는 잣대가 둘입니다</b> — 재단·보링·엣지는 <b>달</b>로 가르고, 납품은 <b>거래처</b>로 가릅니다.',
  '<b>PDF 46장은 모두 실제청구명세서</b>입니다(나머지 파일은 엑셀 11개·묶음 2개). <b>46장을 다 열었고</b> 그 가운데 <b>34장</b>에서 <b>7,840줄</b>을 긁어 창고에 담았습니다. 남은 12장은 — 로앤 거래명세표 6장은 <b class="warn">표가 그림으로 붙어</b> 있어 긁을 글자가 없고, 이룸 거래명세표 6장은 <b class="warn">날짜와 돈만</b> 적혀 있어 이름 칸이 없습니다.',
  '<b>파일 이름이 겹쳐 붙어 있습니다</b> — <code>.xlsx.xlsx</code> · <code>.pdf.pdf</code> · <code>.zip.zip</code>. 카톡으로 받으면 그렇게 됩니다.',
  '<b>이 화면은 「무엇이 몇 개 있나」 까지입니다.</b> 파일 <b>속</b>은 세지 않았습니다 — 여쭙고 하겠습니다.',
];

document.getElementById('셈').innerHTML =
  `<div class="c"><div class="k">폴더</div><div class="v">8<small>개</small></div></div>` +
  `<div class="c"><div class="k">파일</div><div class="v">59<small>개</small></div></div>` +
  `<div class="c"><div class="k">엑셀</div><div class="v">11<small>개</small></div></div>` +
  `<div class="c"><div class="k">PDF</div><div class="v">46<small>장</small></div></div>` +
  `<div class="c"><div class="k">묶음</div><div class="v">2<small>개</small></div></div>` +
  `<div class="c"><div class="k">빈 폴더</div><div class="v">1<small>개</small></div></div>`;

document.getElementById('쪽지').innerHTML =
  쪽지들.map(t => `<div class="note">· ${t}</div>`).join('');
</script>
<!-- 짚어서 지시하는 손잡이 — 바이글 박스에서 열면 켜진다.
     ⚠ v4.0.0 에서 화면을 다시 쓰면서 이 줄이 빠졌다(10-14). 사장님이 짚으실 수가 없었다.
     화면을 갈아엎을 때도 **이 줄은 남긴다.** shared/viggle.js 는 열넷이 같이 쓰는 한 벌이라 손대지 않는다. -->
<script src="../shared/viggle.js"></script>
</body>
</html>
