td.d{color:#5a5a5a}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.daysep td{background:#191919;color:#555;font-size:10px;letter-spacing:.1em;padding:4px 9px}
.empty{color:#4a4a4a;font-size:12px;padding:22px 10px;text-align:center}

.warn{color:#c9a227}

  '원장소요량': ['일','출고처','종류','모델명','색상','전일소요량','금일소요량','총소요량']
};
const 숫자칸 = new Set(['재단수량','원장수량','재단금액','수량','단가','합계','필름소요량','전일소요량','금일소요량','총소요량']);
const 갈래들 = ['재단','보링','엣지','납품','원장소요량'];

let 고른갈래 = '재단';
let 고른날 = 0;   // 0 = 전부

function 날짜목록(g){
  const s = new Set(줄[g].map(r=>r.일));
  return [...s].sort((a,b)=>a-b);
}

function 그리기(){
  // 갈래 알약
  document.getElementById('갈래').innerHTML = 갈래들.map(g=>
    `<div class="pill ${g===고른갈래?'on':''}" data-g="${g}">${g}<span class="n">${줄[g].length}</span></div>`
  ).join('');

  // 날짜 알약 — 그 갈래에 있는 날만 누를 수 있다
  const 있는날 = 날짜목록(고른갈래);
  let h = `<div class="pill ${고른날===0?'on':''}" data-d="0">전부</div>`;
  for(let i=1;i<=15;i++){
    const 있 = 있는날.includes(i);
    const n = 줄[고른갈래].filter(r=>r.일===i).length;
    h += `<div class="pill ${!있?'off':''} ${고른날===i?'on':''}" data-d="${있?i:''}">${i}일${있?`<span class="n">${n}</span>`:''}</div>`;
  }
  document.getElementById('날짜').innerHTML = h;

  // 표
  const 칸 = 갈래칸[고른갈래];
  let 줄들 = 줄[고른갈래];
  if(고른날) 줄들 = 줄들.filter(r=>r.일===고른날);

  document.getElementById('셈').innerHTML =
    `<b>${고른갈래}</b> · ${고른날?고른날+'일':'5월 1~15일 전부'} · <b>${줄들.length}</b>줄`;

  const 표 = document.getElementById('표'), 빔 = document.getElementById('빔');
  if(!줄들.length){
    표.innerHTML=''; 표.parentElement.style.display='none';
    빔.style.display='block'; 빔.textContent='이 날은 적힌 것이 없습니다.';
    return;
  }
  표.parentElement.style.display='block'; 빔.style.display='none';

  let t = '<thead><tr>' + 칸.map(c=>`<th>${c}</th>`).join('') + '</tr></thead><tbody>';
  let 앞날 = null;
  줄들.forEach(r=>{
    if(!고른날 && r.일!==앞날){
      t += `<tr class="daysep"><td colspan="${칸.length}">5월 ${r.일}일</td></tr>`;
      앞날 = r.일;
    }
    t += '<tr>' + 칸.map(c=>{
      const v = (r[c]===undefined||r[c]===null)?'':String(r[c]);
      const cls = v===''?'d':(숫자칸.has(c)?'num':'');
      return `<td class="${cls}">${v===''?'·':v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,' ')}</td>`;
    }).join('') + '</tr>';
  });
  표.innerHTML = t + '</tbody>';
}

// 꼴 — 엑셀에 적힌 머리줄 그대로
(function(){
  let h='';
  for(const g of 갈래들){
    const v = 꼴[g]||{};
    const 묶음 = {};
    for(const sh in v){ const k=v[sh].join(' · '); (묶음[k]=묶음[k]||[]).push(sh); }
    const ks = Object.keys(묶음);
    h += `<div class="shape"><b>${g}</b>`;
    if(ks.length>1) h += ` <span class="warn">— 꼴이 ${ks.length}가지입니다</span>`;
    h += `</div>`;
    for(const k of ks){
      h += `<div class="shape">　<span class="cols">[${묶음[k].join(', ')}]</span></div>`;
      h += `<div class="shape">　　${k.replace(/▸/g,'<span class="cols">▸</span>')}</div>`;
    }
    h += '<div class="gap"></div>';
  }
  document.getElementById('꼴').innerHTML = h;
})();

document.addEventListener('click', e=>{
  const p = e.target.closest('.pill');
  if(!p) return;
  if(p.dataset.g){ 고른갈래 = p.dataset.g; 고른날 = 0; 그리기(); return; }
  if(p.dataset.d!==undefined && p.dataset.d!==''){ 고른날 = +p.dataset.d; 그리기(); }
});
