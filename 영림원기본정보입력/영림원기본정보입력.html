<!doctype html>
<!-- 영림원 기본정보 입력 — 판 번호는 머리띠 VIVIVIC 옆 배지와 같다. 고칠 때 둘을 같이 올린다: v3 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영림원 기본정보 입력</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* 디자인 = 영림원외주입력 폼(에이엠티·조혼가구와 같은 값)을 그대로 옮김. 새로 지은 색 없음. */
:root{
  --ink:#37352f; --muted:#787774; --faint:#b0aeaa; --line:#ededeb; --line2:#e3e2e0; --rowline:#f0eeec;
  --fill:#f1f1ef; --fill2:#f5f5f4; --fill3:#f7f6f3; --fill4:#fbfbfa; --thumb:#d3d1cb;
  --red:#dc2626; --red-bg:#fef2f2; --red-line:#fecaca;
  --amber:#92400e; --amber-bg:#fef3c7;
  --green:#166534; --green-bg:#f0fdf4;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:#ffffff;color:var(--ink);font:400 14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;height:64px;display:flex;align-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:900;font-size:20px;letter-spacing:-0.05em;color:var(--ink);line-height:1}
.ver{font-size:9px;font-weight:700;color:var(--faint);background:#f1f0ef;padding:1px 6px;border-radius:4px;letter-spacing:0.04em;font-family:var(--mono)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
h1{font-size:clamp(1.375rem,5vw,1.875rem);line-height:1.2;margin:0 0 6px;font-weight:900;letter-spacing:-0.03em;text-wrap:balance}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 22px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--muted);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.warn{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}
.pill.ok{background:var(--green-bg);color:var(--green);border-color:#bbf7d0}
.banner{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line);padding:10px 14px;border-radius:12px;margin:0 0 16px;font-size:13px;font-weight:700}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
nav{display:flex;flex-direction:column;gap:4px;position:sticky;top:80px}
nav button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;color:var(--muted);min-height:44px;transition:background .2s}
nav button:hover{background:var(--fill3)}
nav button[aria-current="page"]{background:var(--fill);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.nt{font-weight:800;font-size:13.5px;line-height:1.25;color:inherit}
.ns{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.stephead h2{font-size:clamp(1.125rem,4vw,1.375rem);margin:0 0 6px;font-weight:900;letter-spacing:-0.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label,.lab{font-size:11px;font-weight:700;color:var(--muted)}
.req{color:var(--red);margin-left:2px}
input[type=text],input[type=date],input[type=number],input[type=password],select{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0;min-height:40px}
input[type=text]:focus,input[type=date]:focus,input[type=number]:focus,input[type=password]:focus,select:focus{outline:none;border-color:var(--ink)}
input[type=checkbox]{accent-color:var(--ink);width:16px;height:16px}
.f.test input[type=text],.f.test input[type=date],td.test{background:var(--amber-bg)}
.f.test>label::after,.tlab{content:'테스트값';margin-left:6px;font-size:9.5px;font-weight:800;color:var(--amber);background:var(--amber-bg);border:1px solid #fde68a;border-radius:4px;padding:0 5px}
.unreg{font-size:11px;color:#b45309;font-weight:700}
.err{font-size:11px;color:var(--red);font-weight:700}
.sub{font-size:13px;font-weight:900;margin:22px 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub:first-child{margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 13px var(--sans);border-radius:8px;padding:9px 14px;min-height:40px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s}
.btn:hover{background:var(--fill3)}
.btn:active{transform:scale(.97)}
.btn svg{flex:none}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);padding-inline:20px}
.btn.primary:hover{background:#000}
.btn.small{padding:5px 10px;font-size:11px;min-height:32px}
.btn.danger{color:var(--red);border-color:var(--red-line)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.actions{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.pick{position:relative;display:inline-flex}
.pick>.btn{width:100%}
.pickmenu{position:absolute;top:calc(100% + 4px);left:0;z-index:20;display:flex;flex-direction:column;gap:2px;padding:4px;min-width:170px;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(15,15,15,.08)}
.pickmenu .btn{border-color:transparent;justify-content:flex-start}
.box{flex-basis:100%;min-width:0;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:var(--fill4);display:flex;flex-direction:column;gap:10px}
.box .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.box .row>input[type=text]{flex:1 1 220px;width:auto}
.box h3{font-size:14px;font-weight:900;margin:0}
.msg{font-size:12px;font-weight:700;color:var(--muted)}
.msg.bad{color:var(--red)}
.list h3{font-size:15px;font-weight:900;margin:24px 0 10px;display:flex;gap:8px;align-items:baseline;letter-spacing:-0.02em;flex-wrap:wrap}
.list h3 span{font-weight:700;font-size:11px;color:var(--muted)}
.delbar{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;letter-spacing:0}
.lsearch{display:flex;margin:0 0 8px}.lsearch>input{max-width:420px}
.empty{color:var(--muted);border:1px dashed var(--line2);border-radius:12px;padding:18px;font-size:13px;background:var(--fill4)}
details.rec{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
details.rec[open]{border-color:var(--line2)}
details.rec>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;min-height:44px}
details.rec>summary:hover{background:var(--fill4)}
details.rec>summary::-webkit-details-marker{display:none}
details.rec>summary input.pk{flex:none;margin:0}
.rt{min-width:0;flex:1}
.rt b{display:block;font-weight:800;font-size:13.5px;overflow-wrap:anywhere}
.rt small{color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip{flex:none;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:800;border:1px solid transparent;letter-spacing:.02em}
.chip.대기{background:var(--fill2);color:var(--ink);border-color:#eeeeec}
.chip.넘김{background:var(--green-bg);color:var(--green);border-color:#bbf7d0}
.chip.test{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}
.chip.bad{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.recbody{padding:2px 14px 14px;border-top:1px solid var(--line)}
.tw{overflow:auto;max-height:60vh;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#fff;scrollbar-width:thin;scrollbar-color:var(--thumb) transparent;overscroll-behavior-x:contain}
.tw::-webkit-scrollbar,nav::-webkit-scrollbar{width:8px;height:8px}
.tw::-webkit-scrollbar-track,nav::-webkit-scrollbar-track{background:var(--fill4)}
.tw::-webkit-scrollbar-thumb,nav::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:10px}
table{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
th,td{padding:6px 10px;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--fill2);color:var(--muted);font-size:10.5px;font-weight:800;border-bottom:1px solid var(--line);z-index:1}
td{border-top:1px solid var(--rowline)}
tbody tr:first-child td{border-top:0}
td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
table.sheet td{padding:0;border-left:1px solid var(--rowline)}
table.sheet td:first-child{border-left:0}
table.sheet td input[type=text],table.sheet td input[type=date]{border:0;border-radius:0;min-height:34px;padding:6px 8px;font-size:12.5px;background:transparent;min-width:90px}
table.sheet td input[type=text]:focus{outline:2px solid var(--ink);outline-offset:-2px}
table.sheet td input[type=checkbox]{margin:0 10px}
table.sheet td.lock{padding:6px 10px;color:var(--muted);background:var(--fill4)}
table.sheet td.bad{box-shadow:inset 0 0 0 2px var(--red);background:var(--red-bg)}
table.sheet td.un{box-shadow:inset 0 0 0 2px #f59e0b}
.plan td{white-space:normal;vertical-align:top}
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 6px}
.stp{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:6px 12px;min-height:36px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--muted)}
.stp b{font-family:var(--mono);font-size:11px}
.stp:hover{background:var(--fill3)}
.stp[aria-current="step"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.stp:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wiz .box{margin-top:12px}
.wiz .box .row h3{margin:0}
.setrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.setbtn{display:flex;gap:6px}
.wiznav{border-top:1px solid var(--line);padding-top:14px;margin-top:22px}
.toast:not(:empty){position:fixed;left:16px;right:16px;bottom:16px;z-index:50;margin:0 auto;max-width:480px;padding:10px 14px;background:#fff;border:1px solid #e3e2e0;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
#erp-login{position:fixed;inset:0;z-index:300;background:#fff;display:grid;place-items:center;padding:16px}
#erp-login form{width:min(360px,100%);display:grid;gap:10px}#erp-login h2{margin:0 0 4px;font-size:18px;font-weight:900;letter-spacing:-0.02em}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px}
  nav{flex-direction:row;overflow-x:auto;position:static;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
  nav button{flex:none;padding:8px 12px}
  .card{padding:16px}
  .wrap{padding-top:16px}
}
@media (max-width:480px){
  .btn{min-height:44px}
  .btn.small{min-height:36px}
  .card>.actions>.pick,.card>.actions>.btn{flex:1 1 calc(50% - 4px)}
  .who span{display:none}
  details.rec>summary{flex-wrap:wrap}
  .chips{flex-basis:100%;justify-content:flex-start;padding-left:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function editor(r0){

/* 확인 거리 — 값은 막지 않고 글로만 */
function bomProcBad(r,row){if(r.kind!=='품목'||!s(row.proc))return false;var ps=(r.procs||[]).map(function(p){return s(p.proc);}).filter(Boolean);return ps.length&&ps.indexOf(s(row.proc))<0;}
function codeKnown(c){c=s(c);if(!c)return true;return rows().some(function(x){return s(x.code)===c;})||okDocs('erp_items').some(function(d){return s(d.code)===c;})||okDocs('erp_materials').some(function(d){return s(d.code)===c;});}
function checks(r){
  var out=[];if(!s(r.code))out.push((r.kind==='자재'?'자재번호':'품번')+' 없음');if(!s(r.name))out.push((r.kind==='자재'?'자재명':'품명')+' 없음');
  if(r.kind==='품목'){
    var bad=uniq((r.bom||[]).filter(function(b){return bomProcBad(r,b);}).map(function(b){return s(b.proc);}));
    if(bad.length)out.push('BOM 공정 「'+bad.join('·')+'」 이(가) 공정순서('+(r.procs||[]).map(function(p){return s(p.proc);}).join('-')+')에 없음');
    var miss=uniq((r.bom||[]).filter(function(b){return !codeKnown(b.ccode);}).map(function(b){return s(b.ccode);}));
    if(miss.length)out.push('하위품번 미등록: '+miss.join(', '));
    if(!s(r.flow))out.push('공정흐름유형 없음');
  }
  return out;
}

  return o;}
