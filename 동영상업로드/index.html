<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동영상 업로드</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1a1a1a;color:#c8c8c8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
body{display:flex;align-items:center;justify-content:center}
input[type=file]{display:none}
label{display:inline-block;padding:16px 32px;border:1px solid #444;border-radius:6px;background:#222;color:#fff;font-size:15px;cursor:pointer;transition:background .15s}
label:hover{background:#2a2a2a}
</style>
</head>
<body>
<input type="file" id="video" accept="video/*">
<label for="video">동영상 업로드</label>
</body>
</html>
