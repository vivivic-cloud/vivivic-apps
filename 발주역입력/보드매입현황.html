<!DOCTYPE html>
<!-- 발주역입력 / 보드매입현황 — 「2026년 국내거래처 구매내역서」 엑셀(6개 업체, 1~10월)을 거래처 시트마다 표로 본다.
     사장님 11-16: 「각 거래처별 시트를 분석해서 목록으로 나타나는 페이지를 현재 페이지에 추가해 줘. 페이지 제목은 보드매입현황.」
     판 번호는 머리의 배지와 같다. 고칠 때 둘을 같이 올린다: v1.8.1
     v1.0.0(11-16): 첫 판. 거래처(시트) 버튼 → 그 시트의 표. 거래처 시트는 「전체 · 1월~10월 · 1~10월 누계 · 1~10월 매입품목」 으로 고른다.
       칸 이름·값은 엑셀 글자(셀 표시 꼴) 그대로. 표 꼴은 재단.html v1.1.0 셀 모양(칸 선 · 11.5px · 여백 2px 5px · 숫자 오른쪽)과 같다.
     v1.1.0(11-16): 거래처 메뉴 끝에 「영림원등록」 — 월별 표에서 납품제품명(품목)을 겹치지 않게 한 줄씩, 칸은 품목 · 규격 · 단가만.
       사장님 11-16: 「각 거래처별 페이지 메뉴에 영림원등록을 만들어서, 납품제품명이 중복되지 않는 목록을 만들어 규격과 단가만 나타나게.」
       (임시) 같은 품목이라도 규격 글자가 다르면 다른 줄 · 단가가 여러 가지면 나온 차례대로 모두 적고 「※」 표시(하나를 고르지 않음) ·
       현진산업·현준보드(서광)는 「별도 단가(원)」(부가세 별도 — 다른 거래처 단가와 같은 공급가 기준) · 「(구매내역 없음)」·소계 줄 뺌 · 0원 단가도 그대로 적음.
     v1.2.0(11-16): 영림원등록 — 사장님: 「판매량순으로 나타나게 해 주고, 단가가 변한 시점을 표기해서 알려 줘.」
       줄 차례 = 1~10월 매입 수량 합계 많은 순(임시, 수량 칸은 안 보임) · 단가 칸 「19,500(1~4월) → 21,500(4~10월)」 · 0원 줄은 「무상(N월)」 따로.

     v1.3.0(11-16): 영림원등록 — 사장님: 「제품별 전체 합계금액도 나타나게 해 줘.」
       단가 칸 오른쪽에 그 줄(품목+규격)의 1~10월 공급가액 합(엑셀 칸 이름 그대로 — 현진산업·현준보드(서광)는 「별도 공급가액(원)」, 부가세 별도 — 임시).
       반품(음수)·무상 줄도 엑셀 값 그대로 더함 · 표 맨 아래 「[1~10월 총계]」 줄 = 거래처 전체 합.

     v1.4.0(11-16): 거래처 메뉴 끝에 「영림원 입력폼」 — 사장님: 「보드매입현황 영림원등록에 영림원 입력폼을 분석해서 관련 자료를 입력할 수 있는 폼으로 만들어서 새로운 시트에 표기해 봐.」
       영림원등록 줄(품목+규격) 하나 = 한 줄, 칸 = 영림원 자재등록(500251) 10칸 + 구매단가등록(501868) 표 칸(적용종료일 잠김 칸 뺌) — 칸 이름·선택지는
       영림원외주입력/erp-spec.json(materials·purprices)·영림원기본정보입력/칸.json 의 실제 화면 기록 그대로(11-01·11-03·11-06 화면).
       미리 채운 값 + 고친 값 → 창고 발주역입력_영림원폼(거래처마다 문서, 고친 칸만). 원본 발주역입력_보드매입 은 읽기만. 양식 다운로드·양식 올리기(엑셀). 영림원 등록 기능 없음.

     v1.4.1(11-16): 자재상태 「사용」 확정 — 사장님 「사용으로 하고」(「임시」 표시 뗌).

     v1.5.0(11-16): 영림원 입력폼 완성판 — 사장님 결정 1~8(기준정보까지: 거래처등록 → 품목대중소분류정의 → 자재등록 → 구매단가등록).
       (거래처등록·사업자등록증 읽기는 v1.6.0 에서 걷어냄) ·
       입력폼에 「삭제(등록 안 함)」 체크 · 자재대·중·소분류(한 번 넣은 값은 드롭다운) · 자재번호 겹침 경고 · 기준단위 EA/양지데코 M(롤 단가 ÷ 길이) ·
       「단가이력(적용시작일)」 칸(단가 묶음마다 산 달·달 첫날) · 적용시작일 미리 채움 · 양식에 분류·단가이력 시트.

     v1.6.0(11-16): 사장님 정정 — 「영림원 기존 거래처를 그대로 쓰기로 했습니다. … 기존 영림원에 입력된 실제 거래처를 불러와서 연결시키는 방식으로」.
       거래처등록(칸 입력·사업자등록증 읽기·거래처 추가)을 걷어내고 첫 줄 끝 「거래처 연결」: 영림원 거래처 목록(창고 _영림원거래처, 입력 작업자가 올림)에서 골라 잇는다.
       「불러오기」 = 입력 작업자에게 목록 요청(_거래처불러오기). 구매거래처 = 이은 영림원 거래처 표기 그대로.

     v1.7.0(11-17): 명세서 대조 기준 — 사장님: 「이 부분 실제 명세서와 동일하게 금액이 적혀 있는데, 차후 명세서 영림원 등록 시 확인될 수 있도록 해 줄 수 있나요?」
       화면은 그대로. 입력폼을 열면(폼준비) 거래처마다 창고 발주역입력_영림원폼/{거래처} 에 `기준`(모든 품목의 단가 묶음 — 바뀌지 않은 품목도)·`기준글`·`영림원거래처` 를 함께 저장(바뀌었을 때만).
       고친 단가·적용시작일 우선(임시). 대조 규칙 = 영림원외주입력/입력작업자/전달-보드매입현황-기준정보폼.md 「6. 명세서 대조」. 대조 화면은 안 만듦.

     v1.8.1(11-17): 거래처 메뉴 「영림원 입력폼」 → 「영림원보내기」 — 사장님: 「이름이 헷갈린다. 현재 매입현황의 영림원입력폼 메뉴 이름을 영림원보내기라고 하자.」
       단추 글자 · 거래처 연결 안내 글 · 양식 파일 이름(보드매입현황_영림원보내기_양식.xlsx — 올리기는 파일 이름을 안 봄). 창고 이름·저장 값(기준글·연결글)·코드 이름·지난 판 주석은 그대로.

     v1.8.0(11-17): 제목 「보드/엣지 매입현황」(화면 제목·<title>·쪽 이동 탭·양식 1행 — 파일 이름·주소·창고 이름은 그대로).
       명세서 → 영림원 자재 연결표 — 사장님: 「차후 명세서를 올릴 때 명세서의 납품제품명+규격으로 영림원 입력 자재명을 연결하여 … 연결되어 처리되도록」.
       창고 {거래처} 문서에 `연결`(명세서 표기 → 입력폼 줄 → 자재번호·자재명, 삭제 줄 뺌)을 기준과 함께 저장. 새 표기는 `더한표기`(입력 작업자가 사장님 고른 대로 더함 — 페이지는 지우지 않음).
       열쇠 정규화(임시) = NFKC(전각→반각) · 빈칸 모두 뺌 · 영문 소문자. 입력폼 맨 앞 회색 두 칸 머리에 「명세서 연결 열쇠」 표시만. 26년 1~10월 실제 기록(영림원 구축 중 지난 자료를 다 넣어 돌려 보는 용도).

     ⚠ 값은 창고(artifacts/vivivic-4b7ef/public/data/발주역입력_보드매입)에서 **읽기만** 한다.
        창고에 넣는 것은 tools/보드매입읽기.py(드라이브 엑셀 → 창고). 공개 저장소라 업무 값은 이 파일에 없다. -->

<style>
/* 재단.html 과 같은 값 — 색 낱말은 서류관리 --vg-* 와 같다. 값을 새로 짓지 마라. */
:root{
  --vg-bg:#fff; --vg-ink:#111110; --vg-body:#1A1A19;
  --vg-muted:#9C9C98; --vg-edge:#E2E2DF; --vg-fill:#F4F4F2; --vg-red:#FF3B30;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--vg-bg);color:var(--vg-body);

html,body{height:100%;overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none}
.wrap::-webkit-scrollbar{display:none}
.wrap>*{flex-shrink:0}

.표통{overflow:auto;-webkit-overflow-scrolling:touch;background:var(--vg-bg)}
/* 맥 Chrome 오버레이 막대는 평소 숨는다 → ::-webkit-scrollbar 로 늘 보이게(재단.html·영림원외주입력 v276 과 같은 까닭).
   scrollbar-width·scrollbar-color 를 여기 넣으면 Chrome 이 아래를 무시한다 — 파이어폭스에만 준다. */

.폼표 input,.폼표 select{font:inherit;font-size:11.5px;line-height:1.3;color:var(--vg-body);border:0;border-radius:0;background:transparent;
  padding:2px 5px;margin:0;outline:none;min-width:0}
.폼표 input.num{text-align:right}
.폼표 select{padding:2px 2px;cursor:pointer}
.폼표 input[type=date]{width:11em}
/* v1.5.0 삭제(등록 안 함) 줄 · 자재번호 겹침 · 줄마다 임시 칸 */
.폼표 tr.뺌 td{background:var(--vg-fill)}
.폼표 tr.뺌 td:not(:nth-child(3)){opacity:.45}
.폼표 tr.뺌 td.dpr-k,.폼표 tr.뺌 td:nth-child(2){text-decoration:line-through}
.폼표 td.가운데{text-align:center;padding:0 5px}
.폼표 input[type=checkbox]{width:auto;margin:3px 2px;vertical-align:middle;cursor:pointer}
.폼표 td.겹{background:#FFE9E7;box-shadow:inset 0 0 0 1px var(--vg-red)}
.폼표 td.임칸{box-shadow:inset 0 0 0 1px var(--vg-red)}
.state{background:var(--vg-fill);border-radius:14px;padding:22px 16px;text-align:center;margin-top:12px}
.state .big{font-size:14px;font-weight:600;color:var(--vg-ink);padding-bottom:6px}
.state .sub{font-size:12.5px;color:var(--vg-muted);line-height:1.85}
.state .why{font-size:11.5px;color:var(--vg-red);padding-top:6px;font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><b>VIVIVIC</b> — 발주역입력</div>
  <div class="badge">v1.8.1</div>
</header>
<nav class="쪽길"><a href="재단.html">재단 세부내역</a><a href="보드매입현황.html" class="on">보드/엣지 매입현황</a></nav>
<h1>보드/엣지 매입현황</h1>
<div class="months" id="거래처"></div>
<div class="months" id="볼것"></div>
<div class="state" id="목상태"><div class="big">창고를 읽는 중입니다…</div></div>
<div id="속"></div>
</div>

<!-- 짚어서 지시하는 손잡이 — 바이글 박스에서 열면 켜진다. -->
<script src="../shared/viggle.js"></script>

<script>
const 창고자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_보드매입'];
/* 창고 꼴(tools/보드매입읽기.py):
   _목록 = {시트들:[시트 이름…], 파일, 읽은날}
   시트 문서(이름 = 엑셀 시트 이름) = {시트, 제목(1행), 표:[{이름?, 제목?, 칸:[…], 수:[칸마다 숫자칸 1/0], 줄:[{v:[…], 월?, 소?}]}], 글?:[…]}
     거래처 시트의 표 = [월별, 누계, 매입품목] · 총괄요약의 표 = [구매내역 총괄, 월별 비율] + 글(「※」 줄) */
let 시트들 = [], 받은 = {}, 고른 = '', 볼것 = '전체', 답했나 = false;

const 글 = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function 목상태(큰,작,까닭){
  const el=document.getElementById('목상태'); el.style.display='block';
  el.innerHTML = `<div class="big">${큰}</div>` + (작?`<div class="sub">${작}</div>`:'') + (까닭?`<div class="why">${까닭}</div>`:'');
}
window.목록못읽음 = (큰,까닭) => { 답했나=true; 목상태(큰,'관리자에게 알려 주십시오.',까닭||''); };
setTimeout(() => { if(!답했나) 목상태('창고에 닿지 못했습니다','인터넷이 끊겼거나 창고가 막혀 있습니다. 새로고침해 보십시오.'); }, 20000);

window.목록읽기 = async function(){
  try{
    const { doc, getDoc } = window.fbRead;
    const 목 = await getDoc(doc(window.db, ...창고자리, '_목록'));
    답했나 = true;
    시트들 = (목.exists() && 목.data().시트들) || [];
    if(!시트들.length){ 목상태('창고에 보드매입 자료가 없습니다'); return; }
    document.getElementById('목상태').style.display='none';
    document.getElementById('거래처').innerHTML = 시트들.map(s => `<button class="chip" data-s="${글(s)}">${글(s)}</button>`).join('') +
      `<button class="chip" data-s="__거래처">거래처 연결</button>`;   /* v1.6.0 — 영림원 기존 거래처와 연결(지은 이름) */
    document.querySelectorAll('#거래처 .chip').forEach(b => b.onclick = () => 시트고름(b.dataset.s));
    시트고름(시트들[0]);
  }catch(e){ window.목록못읽음('창고를 읽지 못했습니다', (e&&(e.code||e.message))||''); }
};

async function 시트고름(s){
  고른 = s; 볼것 = '전체';
  document.querySelectorAll('#거래처 .chip').forEach(b => b.classList.toggle('on', b.dataset.s===s));
  document.getElementById('볼것').innerHTML = '';
  if(s==='__거래처'){ 연결그리기(); return; }
  const 속 = document.getElementById('속');
  if(!받은[s]){
    속.innerHTML = '<div class="state"><div class="big">읽는 중입니다…</div></div>';
    try{
      const { doc, getDoc } = window.fbRead;
      const d = await getDoc(doc(window.db, ...창고자리, s));
      받은[s] = d.exists() ? d.data() : { 표:[] };
    }catch(e){ 속.innerHTML = `<div class="state"><div class="big">창고를 읽지 못했습니다</div><div class="why">${글((e&&(e.code||e.message))||'')}</div></div>`; return; }
  }
  if(고른 !== s) return;
  볼것그리기(); 그리기();
}

/* 거래처 시트: 전체(월별 표 통째) · 달마다 · 누계 · 매입품목. 버튼 글은 엑셀 글자(「1월」, 누계 제목의 「1~10월 누계」, 목록 머리 「1~10월 매입품목」). 「전체」 만 지은 말(임시). */
function 볼것그리기(){
  const d = 받은[고른], el = document.getElementById('볼것');
  const 월표 = (d.표||[]).find(t => t.이름==='월별');
  if(!월표){ el.innerHTML=''; return; }
  const 달들 = [...new Set((월표.줄||[]).map(z => z.월).filter(Boolean))];
  const 누표 = d.표.find(t => t.이름==='누계'), 목표 = d.표.find(t => t.이름==='매입품목');
  const 버튼 = [['전체','전체'], ...달들.map(m => ['m:'+m, m])];
  if(누표) 버튼.push(['누계', (String(누표.제목).match(/\d+~\d+월\s*누계/)||['누계'])[0]]);
  if(목표) 버튼.push(['매입품목', 목표.칸[0] || '매입품목']);
  버튼.push(['영림원', '영림원등록']);
  버튼.push(['폼', '영림원보내기']);   /* v1.4.0 「영림원 입력폼」 → v1.8.1 「영림원보내기」 */
  el.innerHTML = 버튼.map(([k,t]) => `<button class="chip${k===볼것?' on':''}" data-k="${글(k)}">${글(t)}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    볼것 = b.dataset.k; el.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x===b)); 그리기();
  });
}

function 표글(t, 줄, 제목){
  const 칸 = t.칸||[], 수 = t.수||[];
  let h = `<div class="표">${제목?`<div class="표제목">${글(제목)}</div>`:''}<table class="dpr-t"><thead><tr>` +
    칸.map((k,i) => `<th class="${i===0?'dpr-k':''}">${글(k)}</th>`).join('') + '</tr></thead><tbody>';
  for(const z of 줄){
    h += `<tr${z.소?' class="sub"':''}>` + 칸.map((k,i) => {
      const cls = (i===0?'dpr-k':'') + (수[i]?' num':'');
      return `<td${cls.trim()?` class="${cls.trim()}"`:''}>${글((z.v||[])[i])}</td>`;
    }).join('') + '</tr>';
  }
  return h + '</tbody></table></div>';
}

/* 영림원등록(v1.1.0) — 월별 표의 품목 줄에서 납품제품명(품목)을 겹치지 않게. 칸 = 품목 · 규격 · 단가(엑셀 칸 이름 그대로).
   규격 글자가 다르면 다른 줄(임시). 현진산업·현준보드(서광)는 「별도 단가(원)」(부가세 별도) 를 보인다(임시). 「(구매내역 없음)」·소계 줄은 뺀다.
   v1.2.0: 줄 차례 = 1~10월 매입 수량 합계가 많은 차례(반품 음수 줄 포함, 같으면 월별 표에 처음 나온 차례 — 임시. 수량 칸은 보이지 않는다).
     단가가 바뀐 줄은 월별 표 줄 차례대로 「단가(그 단가로 산 달) → 다음 단가(…)」. 같은 달 안의 앞뒤는 엑셀 줄 차례.
     0원(무상) 줄은 변동으로 치지 않고 끝에 「무상(N월)」 으로 따로 적는다. 0원만 있는 줄은 그대로 0. */
const 수 = s => { s = String(s??'').trim().replace(/,/g,''); if(s===''||s==='-') return 0;
  const m = s.match(/^\((.*)\)$/); return m ? -Number(m[1])||0 : Number(s)||0; };
const 무상 = 값 => 값==='0' || 값==='-';
const 달들글 = 달 => { const n = 달.map(m => parseInt(m)); return n.length===1 || n[0]===n[n.length-1] ? `${n[0]}월` : `${n[0]}~${n[n.length-1]}월`; };
function 품목모으기(t){
  const 칸 = t.칸||[], 품 = 칸.indexOf('납품제품명(품목)'), 규 = 칸.indexOf('규격'), 량 = 칸.indexOf('수량');
  const 단 = 칸.includes('별도 단가(원)') ? 칸.indexOf('별도 단가(원)') : 칸.indexOf('단가(원)');
  const 포 = 칸.includes('별도 단가(원)') ? 칸.indexOf('단가(원)') : -1;   /* v1.7.0 현진·현준 엑셀 「단가(원)」(부가세 포함 원장) — 대조 기준에만 */
  /* v1.3.0 합계금액 = 공급가액(부가세 별도) — 단가 칸과 같은 기준. 현진·현준은 「별도 공급가액(원)」(임시) */
  const 금 = 칸.includes('별도 공급가액(원)') ? 칸.indexOf('별도 공급가액(원)') : 칸.indexOf('공급가액(원)');
  const 모 = new Map();
  for(const z of (t.줄||[])){
    if(z.소) continue;
    const v = z.v||[], 이름 = String(v[품]??'').trim();
    if(!이름 || 이름==='(구매내역 없음)' || /^\[.*(소계|총계)\]$/.test(이름)) continue;
    const 규격 = String(v[규]??'').trim(), 키 = 이름+'\t'+규격, 값 = String(v[단]??'').trim();
    if(!모.has(키)) 모.set(키, { 이름, 규격, 량:0, 금:0, 흐름:[], 무:[], 반품:[] });
    const m = 모.get(키); m.량 += 수(v[량]); m.금 += 수(v[금]);
    if(수(v[량]) < 0 && !m.반품.includes(z.월)) m.반품.push(z.월);   /* v1.7.0 반품(수량 음수) 달 — 대조 기준에만 */
    if(!값) continue;
    if(무상(값)){ if(!m.무.includes(z.월)) m.무.push(z.월); continue; }
    const 끝 = m.흐름[m.흐름.length-1], 포값 = 포 >= 0 ? 숫자글(v[포]) : '';
    if(끝 && 끝.값===값){ if(!끝.달.includes(z.월)) 끝.달.push(z.월); if(포값 && !끝.포.includes(포값)) 끝.포.push(포값); }
    else m.흐름.push({ 값, 달:[z.월], 포:포값 ? [포값] : [] });
  }
  return { 칸, 품, 규, 단, 금, 줄:[...모.values()].sort((a,b) => b.량-a.량) };
}
const 바뀜 = m => new Set(m.흐름.map(x => x.값)).size > 1;
const 단가글 = m => {
  let h = 바뀜(m) ? '※ ' + m.흐름.map(x => `${글(x.값)}(${달들글(x.달)})`).join(' → ')
                  : 글(m.흐름.length ? m.흐름[0].값 : (m.무.length ? '0' : ''));
  if(m.무.length && m.흐름.length) h += ` · 무상(${m.무.map(x => parseInt(x)).join('·')}월)`;
  return h;
};
function 영림원목록(t, 제목){
  const { 칸, 품, 규, 단, 금, 줄 } = 품목모으기(t);
  const 여러 = 줄.filter(바뀜).length;
  /* 엑셀 표시 꼴 #,##0;(#,##0);- 와 같게(음수 괄호 · 0 은 「-」) */
  const 원 = n => { n = Math.round(n); return n===0 ? '-' : n<0 ? `(${(-n).toLocaleString('ko-KR')})` : n.toLocaleString('ko-KR'); };
  const 총 = 줄.reduce((a,m) => a+m.금, 0);
  let h = `<div class="표">${제목?`<div class="표제목">${글(제목)}</div>`:''}<table class="dpr-t"><thead><tr>` +
    `<th class="dpr-k">${글(칸[품])}</th><th>${글(칸[규])}</th><th>${글(칸[단])}</th><th>${글(칸[금])}</th></tr></thead><tbody>`;
  for(const m of 줄){
    h += `<tr><td class="dpr-k">${글(m.이름)}</td><td>${글(m.규격)}</td><td class="num">${단가글(m)}</td><td class="num">${원(m.금)}</td></tr>`;
  }
  h += `<tr class="sub"><td class="dpr-k">[1~10월 총계]</td><td></td><td></td><td class="num">${원(총)}</td></tr>`;
  h += '</tbody></table></div>';
  h += `<div class="글">${줄.length}줄 · 차례: 1~10월 매입 수량 합계가 많은 순(임시) · ※ 단가가 바뀐 품목 ${여러}개 — ( ) 안은 그 단가로 산 달 · 무상 = 0원 줄.</div>`;
  return h;
}

/* ---------- v1.4.0 영림원 입력폼 · v1.5.0 거래처등록·분류·삭제(등록 안 함)·단가이력 ----------
   영림원등록 줄(품목+규격) 하나 = 한 줄. 칸 = 영림원 두 화면의 칸 이름·선택지 그대로(실제 화면 기록):
     자재등록(500251) — erp-spec.json materials fieldMap · 칸.json 「5 자재등록」(11-01 화면 확인, 11-03 실제 저장 2건)
     구매단가등록(501868) — erp-spec.json purprices fieldMap · 조사-원장-수입-구매.md 「구매단가등록 (501868) — 11-06 실제 화면」(적용종료일은 잠긴 칸이라 뺌)
   구매단가등록의 품명·품번·규격·단위는 영림원에서 품번을 고르면 자재등록 값이 저절로 들어오는 칸이라, 여기서도 자재등록 칸을 따라 보이기만 한다.
   창고 발주역입력_영림원폼/{거래처} = {거래처, 줄:[{품목, 규격, 값:{칸키:값}}], 이력:[…], 고친때} — 값 = 미리 채운 값과 다르게 고친 칸만.
     값.x_del = '1' → 「삭제(등록 안 함)」(원본은 그대로, 체크를 풀면 살아남).
   v1.5.0: 발주역입력_영림원폼/_분류 = {줄:[{kind,big,mid,name,use}](지금 쓰는 분류 — 품목대중소분류정의로 넘길 꼴), 기억:[[대,중,소]…](한 번 넣은 분류 — 드롭다운)}
   v1.6.0: 거래처는 영림원 기존 거래처를 잇는다 — 아래 「거래처 연결」 주석(_영림원거래처 · _거래처연결 · _거래처불러오기). 발주역입력_영림원거래처 는 v1.5.0 시험 자국(안 씀).
   임시 = 미리 채운 값의 대응 근거가 확실하지 않은 칸(머리 또는 칸에 「임시」). */
const 폼자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_영림원폼'];
const 거래처자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_영림원거래처'];
const 폼칸 = [
  {g:'자재등록', k:'m_name', l:'자재명', req:1},
  {g:'자재등록', k:'m_code', l:'자재번호', req:1},
  {g:'자재등록', k:'m_spec', l:'규격', 임시:1},
  {g:'자재등록', k:'m_eng', l:'영문명'},
  {g:'자재등록', k:'m_asset', l:'품목자산분류', req:1, o:['원자재','부자재','재공품','저장품','소모품']},

function 지금분류(){   // 모든 거래처 줄(삭제 뺌)에서 대·중·소가 다 찬 것

      const 월표 = 받은[s].표.find(t => t.이름==='월별'), { 줄 } = 품목모으기(월표);
      const 머리1 = ['보드/엣지 매입현황','', '삭제'], 합칠 = [{s:{r:0,c:0},e:{r:0,c:1}}];
      let c = 3;
      for(const g of 폼묶음){ const n = 폼칸.filter(f => f.g===g).length; 머리1.push(g, ...Array(n-1).fill('')); 합칠.push({s:{r:0,c},e:{r:0,c:c+n-1}}); c += n; }
      머리1.push('단가이력');
      const 줄들 = 줄.map(m => [m.이름, m.규격, 뺀줄(s, m) ? '1' : '', ...폼칸.map(f => 칸값(f, m, s)), 이력보기(s, m)]);
      const ws = X.utils.aoa_to_sheet([머리1, 머리2(), ...줄들]);
      ws['!merges'] = 합칠;
      ws['!cols'] = 머리2().map((t,i) => ({ wch: Math.min(40, Math.max(글너비(t)+2, ...줄들.map(r => 글너비(r[i])+2))) }));
      X.utils.book_append_sheet(wb, ws, s.slice(0,31));
      for(const m of 줄){
        const 이 = 이력(s, m);
        이.forEach((x,i) => 이력aoa.push([s, m.이름, m.규격, 칸값({k:'m_code'}, m, s), 칸값({k:'p_vendor'}, m, s), i+1, Number(x.단가),
          x.첫달===x.끝달 ? `${x.첫달}월` : `${x.첫달}~${x.끝달}월`, x.적용시작일, i===이.length-1 ? '1' : '', x.롤, 뺀줄(s, m) ? '1' : '']));
      }
    }
    const 분aoa = [['품목구분','대분류','중분류','소분류','사용여부'], ...지금분류().map(([b,mi,n]) => ['자재', b, mi, n, '사용'])];
    const 분ws = X.utils.aoa_to_sheet(분aoa); 분ws['!cols'] = 너비들(분aoa); X.utils.book_append_sheet(wb, 분ws, '분류');
    const 이ws = X.utils.aoa_to_sheet(이력aoa); 이ws['!cols'] = 너비들(이력aoa); X.utils.book_append_sheet(wb, 이ws, '단가이력');
    const bytes = X.write(wb, {type:'array', bookType:'xlsx'});
    const u = URL.createObjectURL(new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a = document.createElement('a'); a.href = u; a.download = '보드매입현황_영림원보내기_양식.xlsx'; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
    폼상태('양식을 받았습니다(거래처 연결 · 거래처마다 · 분류 · 단가이력 시트).');
  }catch(e){ 폼상태('양식을 만들지 못했습니다 ' + ((e&&(e.code||e.message))||''), true); }
}
function 날짜글(v){
  v = String(v ?? '').trim(); if(!v) return '';
  let m = v.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(m){ const y = m[3].length===2 ? '20'+m[3] : m[3]; return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`; }
  m = v.match(/^(\d{8})$/); if(m) return `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6)}`;
  return v;
}
async function 양식올리기(file){
  폼상태('양식을 읽는 중…');
  try{
    const X = await loadXlsx(); await 폼준비();
    const wb = X.read(await file.arrayBuffer(), {type:'array'});
    const 머리 = 머리2(), 알림 = [], 고친시트 = [];
    for(const s of 거래처시트들()){
      const ws = wb.Sheets[s.slice(0,31)]; if(!ws) continue;
      const aoa = X.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
      const hi = aoa.slice(0,6).findIndex(r => String(r[0]).trim()==='납품제품명(품목)');
      if(hi<0 || 머리.slice(0, -1).some((t,i) => String(aoa[hi][i]??'').trim()!==t)){ 알림.push(`${s}: 칸 차례가 양식과 다릅니다(안 읽음)`); continue; }
      const 월표 = 받은[s].표.find(t => t.이름==='월별'), { 줄 } = 품목모으기(월표);
      const 찾 = new Map(줄.map(m => [줄키(m), m]));
      let 맞 = 0, 없 = 0;
      for(const r of aoa.slice(hi+1)){
        const 이름 = String(r[0]??'').trim(), 규격 = String(r[1]??'').trim(); if(!이름) continue;
        const m = 찾.get(이름+'\t'+규격); if(!m){ 없++; continue; }
        const 고친 = {};
        if(예(r[2])) 고친.x_del = '1';
        폼칸.forEach((f,i) => {
          if(f.따라) return;
          let v = String(r[i+3]??'').trim();
          if(f.n) v = 숫자글(v); if(f.d) v = 날짜글(v);
          if(v !== 기본값(f.k, m, s)) 고친[f.k] = v;
        });
        폼값[s].set(줄키(m), 고친); 맞++;
      }
      await 폼저장(s); 고친시트.push(s);
      알림.push(`${s} ${맞}줄` + (없?` · 못 찾은 줄 ${없}`:''));
    }
    if(고친시트.length) await 분류저장();
    if(!고친시트.length && !알림.length) 알림.push('거래처 이름과 같은 시트가 없습니다');
    if(볼것==='폼' && 고른!=='__거래처') await 폼그리기();
    폼상태((고친시트.length ? '올려서 저장했습니다 — ' : '') + 알림.join(' · '), !고친시트.length);
  }catch(e){ 폼상태('양식을 읽지 못했습니다 ' + ((e&&(e.code||e.message))||''), true); }
}

function 그리기(){
  const d = 받은[고른], 속 = document.getElementById('속');
  const 표들 = d.표||[];
  if(!표들.length){ 속.innerHTML = '<div class="state"><div class="big">표 없음</div></div>'; return; }
  let h = '';
  const 월표 = 표들.find(t => t.이름==='월별');
  if(!월표){                                   /* 총괄요약: 표 둘 + 「※」 글 */
    h = 표들.map(t => 표글(t, t.줄||[], t.제목)).join('');
    if((d.글||[]).length) h += `<div class="글">${d.글.map(글).join('<br>')}</div>`;
  }else if(볼것==='누계'){
    const t = 표들.find(t => t.이름==='누계'); h = 표글(t, t.줄||[], t.제목);
  }else if(볼것==='영림원'){
    h = 영림원목록(월표, d.제목);
  }else if(볼것==='폼'){
    폼그리기(); return;
  }else if(볼것==='매입품목'){
    const t = 표들.find(t => t.이름==='매입품목'); h = 표글(t, t.줄||[], d.제목);
  }else{
    const 달 = 볼것.startsWith('m:') ? 볼것.slice(2) : '';
    h = 표글(월표, (월표.줄||[]).filter(z => !달 || z.월===달), d.제목);
  }
  속.innerHTML = '<div class="표통">' + h + '</div>';
}
