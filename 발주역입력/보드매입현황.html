<script>
const 창고자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_보드매입'];
/* 창고 꼴(tools/보드매입읽기.py):
   _목록 = {시트들:[시트 이름…], 파일, 읽은날}
   시트 문서(이름 = 엑셀 시트 이름) = {시트, 제목(1행), 표:[{이름?, 제목?, 칸:[…], 수:[칸마다 숫자칸 1/0], 줄:[{v:[…], 월?, 소?}]}], 글?:[…]}
     거래처 시트의 표 = [월별, 누계, 매입품목] · 총괄요약의 표 = [구매내역 총괄, 월별 비율] + 글(「※」 줄) */
let 시트들 = [], 받은 = {}, 고른 = '', 볼것 = '전체', 답했나 = false, 목록정보 = {};

const 글 = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function 목상태(큰,작,까닭){
  const el=document.getElementById('목상태'); el.style.display='block';
  el.innerHTML = `<div class="big">${큰}</div>` + (작?`<div class="sub">${작}</div>`:'') + (까닭?`<div class="why">${까닭}</div>`:'');
}
window.목록못읽음 = (큰,까닭) => { 답했나=true; 목상태(큰,'관리자에게 알려 주십시오.',까닭||''); };
setTimeout(() => { if(!답했나) 목상태('창고에 닿지 못했습니다','인터넷이 끊겼거나 창고가 막혀 있습니다. 새로고침해 보십시오.'); }, 20000);

window.목록읽기 = async function(){
  try{
    const { doc, getDoc } = window.fbRead;
    const 목 = await getDoc(doc(window.db, ...창고자리, '_목록'));
    답했나 = true;
    목록정보 = 목.exists() ? 목.data() : {};
    시트들 = 목록정보.시트들 || [];
    if(!시트들.length){ 목상태('창고에 보드매입 자료가 없습니다'); return; }
    document.getElementById('목상태').style.display='none';
    거래처단추();
    시트고름(시트들[0]);
  }catch(e){ window.목록못읽음('창고를 읽지 못했습니다', (e&&(e.code||e.message))||''); }
};

function 거래처단추(){
  document.getElementById('거래처').innerHTML = 시트들.map(s => `<button class="chip" data-s="${글(s)}">${글(s)}</button>`).join('') +
    `<button class="chip" data-s="해피코">해피코</button>` +   /* v1.16.0 「중국엣지필름」 → v1.19.0 「해피코」(사장님) — 거래처 하나로 */
    `<button class="chip" data-s="__거래처">거래처 연결</button>` +   /* v1.6.0 — 영림원 기존 거래처와 연결(지은 이름) */
    `<button class="chip" data-s="__엑셀">엑셀 새로 불러오기</button>`;   /* v1.9.0 — 새 판 엑셀(지은 이름) */
  document.querySelectorAll('#거래처 .chip').forEach(b => { b.onclick = () => 시트고름(b.dataset.s); b.classList.toggle('on', b.dataset.s===고른); });
}
async function 시트고름(s){
  고른 = s; 볼것 = '전체';
  document.querySelectorAll('#거래처 .chip').forEach(b => b.classList.toggle('on', b.dataset.s===s));
  document.getElementById('볼것').innerHTML = '';
  if(s==='__거래처'){ 연결그리기(); return; }
  if(s==='__엑셀'){ 엑셀그리기(); return; }
  if(s===해피코){ 중국고름(); return; }
  const 속 = document.getElementById('속');
  if(!받은[s]){
    속.innerHTML = '<div class="state"><div class="big">읽는 중입니다…</div></div>';
    try{
      const { doc, getDoc } = window.fbRead;
      const d = await getDoc(doc(window.db, ...창고자리, s));
      받은[s] = d.exists() ? d.data() : { 표:[] };
    }catch(e){ 속.innerHTML = `<div class="state"><div class="big">창고를 읽지 못했습니다</div><div class="why">${글((e&&(e.code||e.message))||'')}</div></div>`; return; }
  }
  if(고른 !== s) return;
  볼것그리기(); 그리기();
}

/* 거래처 시트: 전체(월별 표 통째) · 달마다 · 누계 · 매입품목. 버튼 글은 엑셀 글자(「1월」, 누계 제목의 「1~10월 누계」, 목록 머리 「1~10월 매입품목」). 「전체」 만 지은 말(임시). */
function 볼것그리기(){
  const d = 받은[고른], el = document.getElementById('볼것');
  const 월표 = (d.표||[]).find(t => t.이름==='월별');
  if(!월표){ el.innerHTML=''; return; }
  const 달들 = [...new Set((월표.줄||[]).map(z => z.월).filter(Boolean))];
  const 누표 = d.표.find(t => t.이름==='누계'), 목표 = d.표.find(t => t.이름==='매입품목');
  const 버튼 = [['전체','전체'], ...달들.map(m => ['m:'+m, m])];
  if(누표) 버튼.push(['누계', (String(누표.제목).match(/\d+~\d+월\s*누계/)||['누계'])[0]]);
  if(목표) 버튼.push(['매입품목', 목표.칸[0] || '매입품목']);
  버튼.push(['영림원', '영림원등록']);
  버튼.push(['폼', '영림원보내기']);   /* v1.4.0 「영림원 입력폼」 → v1.8.1 「영림원보내기」 */
  버튼.push(['가공품목', 가공품목메뉴]);
  버튼.push(['완료건', 완료건메뉴]);   /* v1.54.0 */   /* v1.42.0 현진 「가공품목등록」 → v1.44.0 모든 거래처 「구매+가공품목」 */
  el.innerHTML = 버튼.map(([k,t]) => `<button class="chip${k===볼것?' on':''}" data-k="${글(k)}">${글(t)}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    볼것 = b.dataset.k; el.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x===b)); 그리기();
  });
}

function 표글(t, 줄, 제목){
  const 칸 = t.칸||[], 수 = t.수||[];
  let h = `<div class="표">${제목?`<div class="표제목">${글(제목)}</div>`:''}<table class="dpr-t"><thead><tr>` +
    칸.map((k,i) => `<th class="${i===0?'dpr-k':''}">${글(k)}</th>`).join('') + '</tr></thead><tbody>';
  for(const z of 줄){
    h += `<tr${z.소?' class="sub"':''}>` + 칸.map((k,i) => {
      const cls = (i===0?'dpr-k':'') + (수[i]?' num':'');
      return `<td${cls.trim()?` class="${cls.trim()}"`:''}>${글((z.v||[])[i])}</td>`;
    }).join('') + '</tr>';
  }
  return h + '</tbody></table></div>';
}
/* v1.36.0 월별 명세서 「자재명·자재번호」 — 사장님 11-20 「기존 월별명세서에 등록된 영림원 자재명/자재번호가 납품제품명 옆에 오게하면 되겠지? 이곳이 빈칸이면 아직 등록안되었다는 표시도되고」.
   명세서 줄 납품제품명+규격 → 표기열쇠 → 연결표(연결모으기: 26년 기록 · 더한 표기(납품제품명연결) · 해피코 동일품) → 이어진 영림원보내기 줄의 결과.자재 가 완료일 때만
   자재명(그 줄 값) · 자재번호(결과 자재번호 우선). 아니면 빈칸 = 아직 등록 안 됨. 보여 주기만(명세서·창고 안 바꿈). */
function 등록자재표(s){
  const 표 = new Map(); if(!폼값[s]) return 표;
  const 결 = ((창고본[s] || {}).결과) || {};
  for(const x of 연결모으기(s)){
    const 키 = x.줄품목 + '\t' + x.줄규격, 자 = (결[키] || {}).자재;
    if(표.has(x.열쇠)) continue;
    if(자 && 자.상태==='완료'){ 표.set(x.열쇠, [x.자재명, 자.자재번호 || x.자재번호]); continue; }
    let r = null; try{ r = 등록상태(s, 키); }catch(e){}   /* v1.53.1 영림원보내기 「등록완료」 와 같은 셈(입력폼 완료 · 완료보관 · 구매+가공) */
    if(!r || r.상태!=='완료') continue;
    const 번 = r.자재번호 || x.자재번호, 폼 = 가공키(s, 키) && (완료.자재 || 폼완료.자재 || []).find(z => z.자재번호===번);
    표.set(x.열쇠, [폼 ? 폼.자재명 : x.자재명, 번]);
  }
  return 표;
}
function 명세칠(s){
  if(고른!==s) return;
  const 줄들 = document.querySelectorAll('#속 tr[data-열]'); if(!줄들.length) return;
  const 표 = 등록자재표(s);
  줄들.forEach(tr => { const v = 표.get(tr.dataset.열) || ['', ''];
    tr.querySelectorAll('td.영자').forEach((td, i) => { if(td.textContent !== (v[i] || '')) td.textContent = v[i] || ''; }); });
}
function 명세준비(s){ if(폼값[s]) 명세칠(s); else 폼받기(s).then(() => 명세칠(s), e => console.warn('영림원폼 못 읽음', e)); }
function 월명세표(s, t, 줄, 제목){
  const 칸 = t.칸||[], 수 = t.수||[], 찾 = (...a) => a.map(k => 칸.indexOf(k)).find(i => i >= 0) ?? -1;
  const 품 = 찾('납품제품명(품목)','제품명'), 규 = 찾('규격','옵션');
  if(품 < 0) return 표글(t, 줄, 제목);
  let h = `<div class="표">${제목?`<div class="표제목">${글(제목)}</div>`:''}<table class="dpr-t"><thead><tr>` +
    칸.map((k,i) => `<th class="${i===0?'dpr-k':''}">${글(k)}</th>` + (i===품 ? '<th>자재명</th><th>자재번호</th>' : '')).join('') + '</tr></thead><tbody>';
  for(const z of 줄){
    const v = z.v||[], 이름 = String(v[품]??'').trim(), 품목줄 = !z.소 && 이름 && 이름!=='(구매내역 없음)' && !/^\[.*(소계|총계)\]$/.test(이름);
    h += `<tr${z.소?' class="sub"':''}${품목줄?` data-열="${글(표기열쇠(이름, 규 >= 0 ? String(v[규]??'').trim() : ''))}"`:''}>` + 칸.map((k,i) => {
      const cls = (i===0?'dpr-k':'') + (수[i]?' num':'');
      return `<td${cls.trim()?` class="${cls.trim()}"`:''}>${글(v[i])}</td>` + (i===품 ? '<td class="영자"></td><td class="영자"></td>' : '');
    }).join('') + '</tr>';
  }
  return h + '</tbody></table></div>';
}

/* 영림원등록(v1.1.0) — 월별 표의 품목 줄에서 납품제품명(품목)을 겹치지 않게. 칸 = 품목 · 규격 · 단가(엑셀 칸 이름 그대로).
   규격 글자가 다르면 다른 줄(임시). 현진산업·현준보드(서광)는 「별도 단가(원)」(부가세 별도) 를 보인다(임시). 「(구매내역 없음)」·소계 줄은 뺀다.
   v1.2.0: 줄 차례 = 1~10월 매입 수량 합계가 많은 차례(반품 음수 줄 포함, 같으면 월별 표에 처음 나온 차례 — 임시. 수량 칸은 보이지 않는다).
     단가가 바뀐 줄은 월별 표 줄 차례대로 「단가(그 단가로 산 달) → 다음 단가(…)」. 같은 달 안의 앞뒤는 엑셀 줄 차례.
     0원(무상) 줄은 변동으로 치지 않고 끝에 「무상(N월)」 으로 따로 적는다. 0원만 있는 줄은 그대로 0. */
const 수 = s => { s = String(s??'').trim().replace(/,/g,''); if(s===''||s==='-') return 0;
