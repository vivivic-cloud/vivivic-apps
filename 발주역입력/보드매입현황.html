<!DOCTYPE html>
<!-- 발주역입력 / 보드매입현황 — 「2026년 국내거래처 구매내역서」 엑셀(6개 업체, 1~10월)을 거래처 시트마다 표로 본다.
     사장님 11-16: 「각 거래처별 시트를 분석해서 목록으로 나타나는 페이지를 현재 페이지에 추가해 줘. 페이지 제목은 보드매입현황.」
     판 번호는 머리의 배지와 같다. 고칠 때 둘을 같이 올린다: v1.5.0
     v1.0.0(11-16): 첫 판. 거래처(시트) 버튼 → 그 시트의 표. 거래처 시트는 「전체 · 1월~10월 · 1~10월 누계 · 1~10월 매입품목」 으로 고른다.
       칸 이름·값은 엑셀 글자(셀 표시 꼴) 그대로. 표 꼴은 재단.html v1.1.0 셀 모양(칸 선 · 11.5px · 여백 2px 5px · 숫자 오른쪽)과 같다.
     v1.1.0(11-16): 거래처 메뉴 끝에 「영림원등록」 — 월별 표에서 납품제품명(품목)을 겹치지 않게 한 줄씩, 칸은 품목 · 규격 · 단가만.
       사장님 11-16: 「각 거래처별 페이지 메뉴에 영림원등록을 만들어서, 납품제품명이 중복되지 않는 목록을 만들어 규격과 단가만 나타나게.」
       (임시) 같은 품목이라도 규격 글자가 다르면 다른 줄 · 단가가 여러 가지면 나온 차례대로 모두 적고 「※」 표시(하나를 고르지 않음) ·
       현진산업·현준보드(서광)는 「별도 단가(원)」(부가세 별도 — 다른 거래처 단가와 같은 공급가 기준) · 「(구매내역 없음)」·소계 줄 뺌 · 0원 단가도 그대로 적음.
     v1.2.0(11-16): 영림원등록 — 사장님: 「판매량순으로 나타나게 해 주고, 단가가 변한 시점을 표기해서 알려 줘.」
       줄 차례 = 1~10월 매입 수량 합계 많은 순(임시, 수량 칸은 안 보임) · 단가 칸 「19,500(1~4월) → 21,500(4~10월)」 · 0원 줄은 「무상(N월)」 따로.

     v1.3.0(11-16): 영림원등록 — 사장님: 「제품별 전체 합계금액도 나타나게 해 줘.」
       단가 칸 오른쪽에 그 줄(품목+규격)의 1~10월 공급가액 합(엑셀 칸 이름 그대로 — 현진산업·현준보드(서광)는 「별도 공급가액(원)」, 부가세 별도 — 임시).
       반품(음수)·무상 줄도 엑셀 값 그대로 더함 · 표 맨 아래 「[1~10월 총계]」 줄 = 거래처 전체 합.

     v1.4.0(11-16): 거래처 메뉴 끝에 「영림원 입력폼」 — 사장님: 「보드매입현황 영림원등록에 영림원 입력폼을 분석해서 관련 자료를 입력할 수 있는 폼으로 만들어서 새로운 시트에 표기해 봐.」
       영림원등록 줄(품목+규격) 하나 = 한 줄, 칸 = 영림원 자재등록(500251) 10칸 + 구매단가등록(501868) 표 칸(적용종료일 잠김 칸 뺌) — 칸 이름·선택지는
       영림원외주입력/erp-spec.json(materials·purprices)·영림원기본정보입력/칸.json 의 실제 화면 기록 그대로(11-01·11-03·11-06 화면).
       미리 채운 값 + 고친 값 → 창고 발주역입력_영림원폼(거래처마다 문서, 고친 칸만). 원본 발주역입력_보드매입 은 읽기만. 양식 다운로드·양식 올리기(엑셀). 영림원 등록 기능 없음.

     v1.4.1(11-16): 자재상태 「사용」 확정 — 사장님 「사용으로 하고」(「임시」 표시 뗌).

     v1.5.0(11-16): 영림원 입력폼 완성판 — 사장님 결정 1~8(기준정보까지: 거래처등록 → 품목대중소분류정의 → 자재등록 → 구매단가등록).
       첫 줄 끝 「거래처등록」(영림원 500347 칸, 거래처 추가 · 사업자등록증 올리기 → 브라우저 안에서 읽어 채움, 파일은 저장 안 함) ·
       입력폼에 「삭제(등록 안 함)」 체크 · 자재대·중·소분류(한 번 넣은 값은 드롭다운) · 자재번호 겹침 경고 · 기준단위 EA/양지데코 M(롤 단가 ÷ 길이) ·
       「단가이력(적용시작일)」 칸(단가 묶음마다 산 달·달 첫날) · 적용시작일 미리 채움 · 양식에 거래처등록·분류·단가이력 시트.

     ⚠ 값은 창고(artifacts/vivivic-4b7ef/public/data/발주역입력_보드매입)에서 **읽기만** 한다.
        창고에 넣는 것은 tools/보드매입읽기.py(드라이브 엑셀 → 창고). 공개 저장소라 업무 값은 이 파일에 없다. -->

    import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
    const app = initializeApp({
        apiKey: "AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",
        authDomain: "vivivic-4b7ef.firebaseapp.com",
        projectId: "vivivic-4b7ef",
        storageBucket: "vivivic-4b7ef.firebasestorage.app",
        messagingSenderId: "830175660542",
        appId: "1:830175660542:web:9054030480c8280af8d8af"
    });
    const auth = getAuth(app);
    window.db = getFirestore(app);
    window.fbRead = { doc, getDoc, setDoc, collection, getDocs };
    onAuthStateChanged(auth, (u) => {
        if (!u) { signInAnonymously(auth).catch(e => window.목록못읽음('창고에 들어가지 못했습니다', (e&&(e.code||e.message))||'')); return; }

<style>

<script>
const 창고자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_보드매입'];
/* 창고 꼴(tools/보드매입읽기.py):
   _목록 = {시트들:[시트 이름…], 파일, 읽은날}
   시트 문서(이름 = 엑셀 시트 이름) = {시트, 제목(1행), 표:[{이름?, 제목?, 칸:[…], 수:[칸마다 숫자칸 1/0], 줄:[{v:[…], 월?, 소?}]}], 글?:[…]}
     거래처 시트의 표 = [월별, 누계, 매입품목] · 총괄요약의 표 = [구매내역 총괄, 월별 비율] + 글(「※」 줄) */
let 시트들 = [], 받은 = {}, 고른 = '', 볼것 = '전체', 답했나 = false;

const 글 = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function 목상태(큰,작,까닭){
  const el=document.getElementById('목상태'); el.style.display='block';
  el.innerHTML = `<div class="big">${큰}</div>` + (작?`<div class="sub">${작}</div>`:'') + (까닭?`<div class="why">${까닭}</div>`:'');

/* 영림원등록(v1.1.0) — 월별 표의 품목 줄에서 납품제품명(품목)을 겹치지 않게. 칸 = 품목 · 규격 · 단가(엑셀 칸 이름 그대로).

const 수 = s => { s = String(s??'').trim().replace(/,/g,''); if(s===''||s==='-') return 0;

  if(!M거래처(s) || !n) return { 값:숫자글(값) };
  const L = 롤길이(m);
  if(L && n / L >= 20) return { 값:소수2(n / L), 롤:`롤 단가 ${n.toLocaleString('ko-KR')}원 ÷ ${L}m` };
  return { 값:숫자글(값) };
}
/* 기준단위 — 보드 원장은 EA(매), 양지데코는 M. 현진산업 시트·엣지·필름처럼 m 로 보이는 줄은 M 이되 「임시」. */
const m로보임 = m => /\((시트|엣지|필름)\)/.test(m.이름) || /^0\.\d+$/.test(m.규격);
function 단위(s, m){ return M거래처(s) || m로보임(m) ? 'M' : 'EA'; }

/* 단가이력 — 단가가 같은 묶음마다 {단가, 첫 달, 끝 달, 적용시작일(그 묶음 첫 달 1일 — 날짜 칸이 없어 달 첫날, 임시)}.
   이력으로 넣을 때 = 이 줄들을 차례대로(적용종료일은 영림원이 다음 시작일 전날로 저절로) · 마지막 단가 하나만 넣을 때 = 맨 끝 줄. */
function 이력(s, m){
  const 줄 = m.흐름.map(x => {
    const r = M단가(s, m, x.값);
    return { 단가:r.값, 롤:r.롤||'', 첫달:parseInt(x.달[0]), 끝달:parseInt(x.달[x.달.length-1]), 적용시작일:달첫날(s, x.달[0]) };
  });
  if(!줄.length && m.무.length) 줄.push({ 단가:'0', 롤:'', 첫달:parseInt(m.무[0]), 끝달:parseInt(m.무[m.무.length-1]), 적용시작일:달첫날(s, m.무[0]) });
  줄.forEach((x,i) => { x.겹침 = 줄.some((y,j) => j!==i && y.적용시작일===x.적용시작일); });
  return 줄;
}
const 이력보기 = (s, m) => {
  const 줄 = 이력(s, m);
  if(!줄.length) return '';
  const 한 = x => `${Number(x.단가).toLocaleString('ko-KR',{maximumFractionDigits:2})}(${x.첫달===x.끝달?x.첫달:x.첫달+'~'+x.끝달}월, ${x.적용시작일.slice(5)}~)${x.겹침?' ⚠같은 시작일':''}`;
  return 줄.length===1 ? 한(줄[0]) : '※ ' + 줄.map(한).join(' → ');
};

/* 미리 채우는 값 — 근거는 CLAUDE.md 「영림원 입력폼」 대응표 */
function 기본값(k, m, 거래처){
  switch(k){
    case 'm_name': return m.이름;                 // 납품제품명(품목) — 사장님 결정 4(직접 고칠 수 있음)
    case 'm_spec': return m.규격;                 // 엑셀 규격 — 임시(영림원 원장 규격 꼴 「2440*1220」)
    case 'm_asset': return '원자재';              // 원장·엣지필름 = 자재등록 원자재(11-01 화면 기록)
    case 'm_state': return '사용';                // 사장님 11-16 「사용으로 하고」
    case 'm_io': return '내자';                   // 국내거래처
    case 'm_unit': return 단위(거래처, m);         // 사장님 결정 4 — 원장 EA · 양지데코 M
    case 'p_vendor': return 거래처칸값(거래처, 'name');   // 거래처등록의 거래처명(처음 = 시트 이름)
    case 'p_io': return '내수';                   // 국내 매입(도움말: 내수 = 품의 → 구매발주·납품·입고)
    case 'p_cur': return 'KRW';
    case 'p_price': { const 줄 = 이력(거래처, m); return 줄.length ? 줄[줄.length-1].단가 : ''; }        // 마지막 단가 — 임시
    case 'p_from': { const 줄 = 이력(거래처, m); return 줄.length ? 줄[줄.length-1].적용시작일 : ''; }  // 마지막 단가의 첫 달 1일 — 임시
  }
  return '';
}
/* 줄마다 「임시」 까닭(칸 테두리 빨강 + 손을 대면 글) */
function 칸임시(k, m, s){
  if(k==='m_unit' && !M거래처(s) && m로보임(m)) return '시트·엣지·필름(m 로 보임) — 기준단위 M 은 임시';
  if(k==='p_price'){ const 줄 = 이력(s, m), 끝 = 줄[줄.length-1]; if(끝 && 끝.롤) return 끝.롤 + ' = M 단가(임시)'; }
  return '';
}
function 칸값(f, m, 거래처){
  if(f.따라) return 칸값(폼칸.find(x => x.k===f.따라), m, 거래처);
  const 고친 = (폼값[거래처] && 폼값[거래처].get(줄키(m))) || {};
  return f.k in 고친 ? 고친[f.k] : 기본값(f.k, m, 거래처);
}
const 뺀줄 = (s, m) => !!(((폼값[s] && 폼값[s].get(줄키(m))) || {}).x_del);
const 글너비 = t => [...String(t||'')].reduce((a,c) => a + (c.charCodeAt(0) > 0x2000 ? 2 : 1), 0);

async function 폼받기(s){
  if(폼값[s]) return;
  const { doc, getDoc } = window.fbRead;
  const d = await getDoc(doc(window.db, ...폼자리, s));
  const 모 = new Map();
  for(const z of ((d.exists() && d.data().줄) || [])) 모.set(z.품목 + '\t' + z.규격, z.값 || {});
  폼값[s] = 모;
  폼이력[s] = JSON.stringify((d.exists() && d.data().이력) || []);
}
let 준비됨 = false;
const 저장틀 = {};
function 폼상태(t, 나쁨){ const el = document.getElementById('폼상태'); if(el){ el.textContent = t; el.classList.toggle('bad', !!나쁨); } }
/* 창고에 남기는 단가이력 — 단가가 바뀐 품목만(입력작업자가 이력으로 넣을 때 쓰는 꼴) */
function 이력모으기(s){
  const 월표 = ((받은[s]||{}).표||[]).find(t => t.이름==='월별'); if(!월표) return [];
  return 품목모으기(월표).줄.filter(m => 이력(s, m).length > 1)
    .map(m => ({ 품목:m.이름, 규격:m.규격, 줄:이력(s, m).map(({단가,첫달,끝달,적용시작일,롤}) => ({단가,첫달,끝달,적용시작일,...(롤?{롤}:{})})) }));
}
async function 폼저장(s){
  const { doc, setDoc } = window.fbRead;
  const 줄 = [...폼값[s].entries()].filter(([,v]) => Object.keys(v).length)
    .map(([키, 값]) => { const [품목, 규격] = 키.split('\t'); return { 품목, 규격, 값 }; });
  const 이력들 = 이력모으기(s);
  await setDoc(doc(window.db, ...폼자리, s), { 거래처:s, 줄, 이력:이력들, 고친때:new Date().toISOString() });
  폼이력[s] = JSON.stringify(이력들);
}
const 저장알림 = () => 폼상태('저장됨 ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
const 못저장 = e => 폼상태('저장하지 못했습니다 ' + ((e&&(e.code||e.message))||''), true);
function 저장예약(s){
  폼상태('저장 중…');
  clearTimeout(저장틀[s]);
  저장틀[s] = setTimeout(() => 폼저장(s).then(() => 분류저장()).then(저장알림, 못저장), 500);
}

/* ---- 분류(대·중·소) — 한 번 넣은 값은 드롭다운에 저절로(대 → 중 → 소 이어서) ---- */
let 분류 = null;   // {줄:[…], 기억:[[대,중,소]…]}
async function 분류받기(){
  if(분류) return;
  const { doc, getDoc } = window.fbRead;
  const d = await getDoc(doc(window.db, ...폼자리, '_분류'));
  const v = d.exists() ? d.data() : {};
  분류 = { 줄:v.줄||[], 기억:(v.기억||[]).map(x => [x.big||'', x.mid||'', x.name||'']) };
}
function 지금분류(){   // 모든 거래처 줄(삭제 뺌)에서 대·중·소가 다 찬 것
  const 모 = new Map();
  for(const s of 거래처시트들()){
    if(!폼값[s]) continue;
    const 월표 = 받은[s].표.find(t => t.이름==='월별');
    for(const m of 품목모으기(월표).줄){
      if(뺀줄(s, m)) continue;
      const b = 칸값({k:'m_big'}, m, s), mi = 칸값({k:'m_mid'}, m, s), n = 칸값({k:'m_small'}, m, s);
      if(b && mi && n) 모.set([b,mi,n].join('\t'), [b,mi,n]);
    }
  }
  return [...모.values()];
}
function 분류기억(b, mi, n){
  if(!b && !mi && !n) return false;
  if(분류.기억.some(x => x[0]===b && x[1]===mi && x[2]===n)) return false;
  분류.기억.push([b, mi, n]); return true;
}
async function 분류저장(){
  if(!분류) return;
  const 지금 = 지금분류();
  지금.forEach(x => 분류기억(...x));
  const 줄 = 지금.map(([big,mid,name]) => ({ kind:'자재', big, mid, name, use:true }));
  const { doc, setDoc } = window.fbRead;
  await setDoc(doc(window.db, ...폼자리, '_분류'), { 줄, 기억:분류.기억.map(([big,mid,name]) => ({big,mid,name})), 고친때:new Date().toISOString() });
  분류.줄 = 줄;
}
function 분류고를것(칸, tr){
  const 값 = k => { const el = tr.querySelector(`input[data-k="${k}"]`); return el ? el.value.trim() : ''; };
  const 다 = 분류.기억.concat(지금분류());
  let 목;
  if(칸==='big') 목 = 다.map(x => x[0]);
  else if(칸==='mid'){ const b = 값('m_big'); 목 = 다.filter(x => !b || x[0]===b).map(x => x[1]); }
  else { const b = 값('m_big'), mi = 값('m_mid'); 목 = 다.filter(x => (!b || x[0]===b) && (!mi || x[1]===mi)).map(x => x[2]); }
  return [...new Set(목.filter(Boolean))].sort((a,b) => a.localeCompare(b,'ko'));
}

/* ---- 자재번호 겹침 — 모든 거래처(삭제 줄 뺌)에서 같은 자재번호 ---- */
function 번호겹침(){
  const 모 = new Map();
  for(const s of 거래처시트들()){
    if(!폼값[s]) continue;
    const 월표 = 받은[s].표.find(t => t.이름==='월별');
    for(const m of 품목모으기(월표).줄){
      if(뺀줄(s, m)) continue;
      const c = 칸값({k:'m_code'}, m, s).trim(); if(!c) continue;
      const k = c.toLowerCase();
      if(!모.has(k)) 모.set(k, []);
      모.get(k).push({ s, m, c });
    }
  }
  return new Map([...모].filter(([,v]) => v.length > 1));
}
function 겹침그리기(표, s){
  const 겹 = 번호겹침(), 여기 = new Set();
  for(const [k, v] of 겹) for(const x of v) if(x.s===s) 여기.add(줄키(x.m));
  표.querySelectorAll('tbody tr').forEach(tr => {
    const td = tr.querySelector('input[data-k="m_code"]')?.closest('td'); if(!td) return;
    const 이 = 여기.has(tr.dataset.key);
    td.classList.toggle('겹', 이);
    if(이){
      const c = td.querySelector('input').value.trim().toLowerCase();
      td.title = '자재번호 겹침: ' + 겹.get(c).map(x => `${x.s} ${x.m.이름}${x.m.규격?' '+x.m.규격:''}`).join(' / ');
    }else td.removeAttribute('title');
  });
  const el = document.getElementById('겹침');
  if(el) el.textContent = 겹.size ? `⚠ 자재번호 겹침 ${겹.size}개: ` + [...겹].map(([,v]) => `${v[0].c}(${v.map(x => x.s+' '+x.m.이름).join(' · ')})`).join(' / ') : '';
}

async function 폼준비(){ await 모두받기(); await 거래처받기(); await 분류받기(); 준비됨 = true; }

async function 폼그리기(){
  const s = 고른, 속 = document.getElementById('속');
  if(!준비됨){
    속.innerHTML = '<div class="state"><div class="big">읽는 중입니다…</div></div>';
    try{ await 폼준비(); }
    catch(e){ 속.innerHTML = `<div class="state"><div class="big">창고를 읽지 못했습니다</div><div class="why">${글((e&&(e.code||e.message))||'')}</div></div>`; return; }
    if(고른!==s || 볼것!=='폼') return;
  }
  const 월표 = (받은[s].표||[]).find(t => t.이름==='월별');
  const { 칸, 품, 규, 줄 } = 품목모으기(월표);
  /* 칸 너비 = 머리·값 중 긴 것(글자 수) */
  const 너비 = {};
  for(const f of 폼칸){
    if(f.따라 || f.o || f.d) continue;
    let w = Math.max(글너비(f.l) + 2, f.n ? 7 : 8);
    for(const m of 줄) w = Math.max(w, 글너비(칸값(f, m, s)) + 2);
    너비[f.k] = Math.min(w, 44);
  }
  let h = `<table class="dpr-t 폼표"><thead><tr><th class="dpr-k" rowspan="2">${글(칸[품])}</th><th rowspan="2">${글(칸[규])}</th>` +
    `<th rowspan="2" class="묶">${글(삭제글)}</th>` +
    폼묶음.map(g => `<th class="묶" colspan="${폼칸.filter(f => f.g===g).length}">${글(g)}</th>`).join('') +
    `<th class="묶" rowspan="2">${글(이력글머리)}<span class="임">임시</span></th></tr><tr>` +
    폼칸.map((f,i) => `<th class="${i===0||폼칸[i-1].g!==f.g?'묶':''}">${글(f.l)}${f.req?'<span class="별">*</span>':''}${f.임시?'<span class="임">임시</span>':''}</th>`).join('') +
    '</tr></thead><tbody>';
  for(const m of 줄){
    const 키 = 줄키(m), 뺌 = 뺀줄(s, m);
    h += `<tr data-key="${글(키)}"${뺌?' class="뺌"':''}><td class="dpr-k 참">${글(m.이름)}</td><td class="참">${글(m.규격)}</td>` +
      `<td class="입 묶 가운데"><input type="checkbox" data-k="x_del"${뺌?' checked':''} title="체크 = 이번 등록에서 뺌(원본은 그대로, 풀면 살아남)"></td>`;
    폼칸.forEach((f,i) => {
      const 묶 = i===0||폼칸[i-1].g!==f.g ? ' 묶' : '', v = 칸값(f, m, s);
      if(f.따라){ h += `<td class="따${묶}" data-따라="${f.따라}">${글(v)}</td>`; return; }
      let 칸글;
      if(f.o){
        const 고를 = [''].concat(f.o); if(v && !고를.includes(v)) 고를.push(v);
        칸글 = `<select data-k="${f.k}">` + 고를.map(o => `<option${o===v?' selected':''}>${글(o)}</option>`).join('') + '</select>';
      }else if(f.d){
        칸글 = `<input type="date" data-k="${f.k}" value="${글(v)}">`;
      }else{
        칸글 = `<input data-k="${f.k}" value="${글(v)}" style="width:${너비[f.k]}ch"${f.n?' inputmode="decimal" class="num"':''}${f.분류?` data-분류="${f.분류}" autocomplete="off"`:''}>`;
      }
      const 여러 = f.k==='p_price' && (바뀜(m) || (!m.흐름.length && m.무.length));
      const 임 = 칸임시(f.k, m, s);
      const 제목 = [여러 ? 단가글(m).replace(/<[^>]*>/g,'') : '', 임 ? '임시: ' + 임 : ''].filter(Boolean).join(' · ');
      h += `<td class="입${묶}${임?' 임칸':''}"${제목?` title="${글(제목)}"`:''}>${여러?'<span class="표시">※</span>':''}${칸글}</td>`;
    });
    h += `<td class="참 묶">${글(이력보기(s, m))}</td></tr>`;
  }
  h += '</tbody></table><datalist id="분류목록"></datalist>';
  const 뺀수 = 줄.filter(m => 뺀줄(s, m)).length;
  h += `<div class="글">${줄.length}줄(영림원등록 줄과 같음)${뺀수?` · ${삭제글} ${뺀수}줄`:''} · <span class="별">*</span> = 영림원 필수(빨강) 칸 · 「임시」 = 미리 채운 값의 근거가 확실하지 않은 칸(빨간 테 칸은 그 줄만 — 손을 대면 까닭) — 확인해 고쳐 주십시오.<br>` +

function 날짜글(v){

  m = v.match(/^(\d{8})$/); if(m) return `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6)}`;
  return v;
}
