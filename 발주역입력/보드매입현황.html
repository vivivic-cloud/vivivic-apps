<!DOCTYPE html>
<!-- 발주역입력 / 보드매입현황 — 「2026년 국내거래처 구매내역서」 엑셀(6개 업체, 1~10월)을 거래처 시트마다 표로 본다.
     사장님 11-16: 「각 거래처별 시트를 분석해서 목록으로 나타나는 페이지를 현재 페이지에 추가해 줘. 페이지 제목은 보드매입현황.」
     판 번호는 머리의 배지와 같다. 고칠 때 둘을 같이 올린다: v1.20.0
     v1.0.0(11-16): 첫 판. 거래처(시트) 버튼 → 그 시트의 표. 거래처 시트는 「전체 · 1월~10월 · 1~10월 누계 · 1~10월 매입품목」 으로 고른다.
       칸 이름·값은 엑셀 글자(셀 표시 꼴) 그대로. 표 꼴은 재단.html v1.1.0 셀 모양(칸 선 · 11.5px · 여백 2px 5px · 숫자 오른쪽)과 같다.
     v1.1.0(11-16): 거래처 메뉴 끝에 「영림원등록」 — 월별 표에서 납품제품명(품목)을 겹치지 않게 한 줄씩, 칸은 품목 · 규격 · 단가만.
       사장님 11-16: 「각 거래처별 페이지 메뉴에 영림원등록을 만들어서, 납품제품명이 중복되지 않는 목록을 만들어 규격과 단가만 나타나게.」
       (임시) 같은 품목이라도 규격 글자가 다르면 다른 줄 · 단가가 여러 가지면 나온 차례대로 모두 적고 「※」 표시(하나를 고르지 않음) ·
       현진산업·현준보드(서광)는 「별도 단가(원)」(부가세 별도 — 다른 거래처 단가와 같은 공급가 기준) · 「(구매내역 없음)」·소계 줄 뺌 · 0원 단가도 그대로 적음.
     v1.2.0(11-16): 영림원등록 — 사장님: 「판매량순으로 나타나게 해 주고, 단가가 변한 시점을 표기해서 알려 줘.」
       줄 차례 = 1~10월 매입 수량 합계 많은 순(임시, 수량 칸은 안 보임) · 단가 칸 「19,500(1~4월) → 21,500(4~10월)」 · 0원 줄은 「무상(N월)」 따로.

     v1.3.0(11-16): 영림원등록 — 사장님: 「제품별 전체 합계금액도 나타나게 해 줘.」
       단가 칸 오른쪽에 그 줄(품목+규격)의 1~10월 공급가액 합(엑셀 칸 이름 그대로 — 현진산업·현준보드(서광)는 「별도 공급가액(원)」, 부가세 별도 — 임시).
       반품(음수)·무상 줄도 엑셀 값 그대로 더함 · 표 맨 아래 「[1~10월 총계]」 줄 = 거래처 전체 합.

     v1.4.0(11-16): 거래처 메뉴 끝에 「영림원 입력폼」 — 사장님: 「보드매입현황 영림원등록에 영림원 입력폼을 분석해서 관련 자료를 입력할 수 있는 폼으로 만들어서 새로운 시트에 표기해 봐.」
       영림원등록 줄(품목+규격) 하나 = 한 줄, 칸 = 영림원 자재등록(500251) 10칸 + 구매단가등록(501868) 표 칸(적용종료일 잠김 칸 뺌) — 칸 이름·선택지는
       영림원외주입력/erp-spec.json(materials·purprices)·영림원기본정보입력/칸.json 의 실제 화면 기록 그대로(11-01·11-03·11-06 화면).
       미리 채운 값 + 고친 값 → 창고 발주역입력_영림원폼(거래처마다 문서, 고친 칸만). 원본 발주역입력_보드매입 은 읽기만. 양식 다운로드·양식 올리기(엑셀). 영림원 등록 기능 없음.

     v1.4.1(11-16): 자재상태 「사용」 확정 — 사장님 「사용으로 하고」(「임시」 표시 뗌).

     v1.5.0(11-16): 영림원 입력폼 완성판 — 사장님 결정 1~8(기준정보까지: 거래처등록 → 품목대중소분류정의 → 자재등록 → 구매단가등록).
       (거래처등록·사업자등록증 읽기는 v1.6.0 에서 걷어냄) ·
       입력폼에 「삭제(등록 안 함)」 체크 · 자재대·중·소분류(한 번 넣은 값은 드롭다운) · 자재번호 겹침 경고 · 기준단위 EA/양지데코 M(롤 단가 ÷ 길이) ·
       「단가이력(적용시작일)」 칸(단가 묶음마다 산 달·달 첫날) · 적용시작일 미리 채움 · 양식에 분류·단가이력 시트.

     v1.6.0(11-16): 사장님 정정 — 「영림원 기존 거래처를 그대로 쓰기로 했습니다. … 기존 영림원에 입력된 실제 거래처를 불러와서 연결시키는 방식으로」.
       거래처등록(칸 입력·사업자등록증 읽기·거래처 추가)을 걷어내고 첫 줄 끝 「거래처 연결」: 영림원 거래처 목록(창고 _영림원거래처, 입력 작업자가 올림)에서 골라 잇는다.
       「불러오기」 = 입력 작업자에게 목록 요청(_거래처불러오기). 구매거래처 = 이은 영림원 거래처 표기 그대로.

     v1.7.0(11-17): 명세서 대조 기준 — 사장님: 「이 부분 실제 명세서와 동일하게 금액이 적혀 있는데, 차후 명세서 영림원 등록 시 확인될 수 있도록 해 줄 수 있나요?」
       화면은 그대로. 입력폼을 열면(폼준비) 거래처마다 창고 발주역입력_영림원폼/{거래처} 에 `기준`(모든 품목의 단가 묶음 — 바뀌지 않은 품목도)·`기준글`·`영림원거래처` 를 함께 저장(바뀌었을 때만).
       고친 단가·적용시작일 우선(임시). 대조 규칙 = 영림원외주입력/입력작업자/전달-보드매입현황-기준정보폼.md 「6. 명세서 대조」. 대조 화면은 안 만듦.

     v1.8.1(11-17): 거래처 메뉴 「영림원 입력폼」 → 「영림원보내기」 — 사장님: 「이름이 헷갈린다. 현재 매입현황의 영림원입력폼 메뉴 이름을 영림원보내기라고 하자.」
       단추 글자 · 거래처 연결 안내 글 · 양식 파일 이름(보드매입현황_영림원보내기_양식.xlsx — 올리기는 파일 이름을 안 봄). 창고 이름·저장 값(기준글·연결글)·코드 이름·지난 판 주석은 그대로.

     v1.8.0(11-17): 제목 「보드/엣지 매입현황」(화면 제목·<title>·쪽 이동 탭·양식 1행 — 파일 이름·주소·창고 이름은 그대로).
       명세서 → 영림원 자재 연결표 — 사장님: 「차후 명세서를 올릴 때 명세서의 납품제품명+규격으로 영림원 입력 자재명을 연결하여 … 연결되어 처리되도록」.
       창고 {거래처} 문서에 `연결`(명세서 표기 → 입력폼 줄 → 자재번호·자재명, 삭제 줄 뺌)을 기준과 함께 저장. 새 표기는 `더한표기`(입력 작업자가 사장님 고른 대로 더함 — 페이지는 지우지 않음).
       열쇠 정규화(임시) = NFKC(전각→반각) · 빈칸 모두 뺌 · 영문 소문자. 입력폼 맨 앞 회색 두 칸 머리에 「명세서 연결 열쇠」 표시만. 26년 1~10월 실제 기록(영림원 구축 중 지난 자료를 다 넣어 돌려 보는 용도).

     v1.9.0(11-17): 엑셀 새로 불러오기 · 영림원보내기 최종값 `보내기` — 사장님: 「해당 불러온 파일을 새로고침으로 불러올 수 있게 해 줘. 새로 불러온 파일에 새로운 명세가 있다면
       지금과 같은 논리로 영림원 입력폼 자리에 추가되는 경우가 생길 텐데, 이를 입력폼 쪽에서 감지하여 새로운 등록이 준비되도록 해야 해.」
       거래처 첫 줄 끝 「엑셀 새로 불러오기」(지은 이름): 새 판 엑셀을 브라우저에서 읽어(tools/보드매입읽기.py 와 같은 셈) 바뀐 것 요약 → 「바꾸기」 를 눌러야 창고 발주역입력_보드매입 에 씀 → 합계 대조.
       고친 칸·분류·거래처 연결·삭제 체크·연결표는 품목+규격 열쇠로 그대로 이어진다(지우지 않음). 꼴이 다른 시트는 안 읽음 · 새 파일에 없는 시트는 그대로 둠(임시).
       창고 {거래처} 문서에 `보내기` = 화면에 보이는 최종값 전체(판·지문) — 영림원 입력폼이 그대로 읽어 새 줄·바뀐 줄을 감지. 꼴 = 전달 글 7절.
     v1.10.0(11-17): 영림원보내기 채우기 손잡이 — 사장님: 「보드매입현황에 영림원 입력폼 입력부를 엑셀처럼 드래그로 아래로 내려 복사 붙여넣게 되게 해 줘.」
       입력 칸(글·드롭다운·날짜·분류)을 고르면 오른쪽 아래 작은 네모 → 아래로 끌면 범위 표시 → 놓으면 그 아래 줄 같은 칸에 같은 값.
       회색(따라·참고) 칸·「삭제(등록 안 함)」 체크 칸은 손잡이 없음. 채운 칸은 하나씩 고친 것과 같은 길(칸적용) — 숫자 검사·따라 칸·분류 기억·자재번호 겹침 · 저장은 한 번에(저장예약).
       「되돌리기」 단추 · Ctrl/⌘+Z = 방금 채우기 한 번만 되돌림(그 뒤 다른 칸을 고치면 사라짐). 여러 칸 묶음 되풀이는 안 함(한 칸 값 복사).
     v1.11.0(11-17): 엘데코 자재번호 기본값 — 사장님: 「엘데코 자재번호에 자재명의 T 포함한 T의 앞 모든 글자가 기본적으로 나타나게 해줘」.
       거래처 엘데코만, 자재번호 기본값 = 자재명(고친 값 우선)에서 첫 대문자 「T」 까지(T 포함) · T 없으면 빈칸. 자재번호를 고친 줄은 그대로.
       자재명을 고치면 자재번호(·품번)도 따라 바뀜. 겹치는 자재번호는 기존 빨간 겹침 표시 그대로. `보내기` 꼴 그대로(값만 들어감).
     v1.12.0(11-17): 마지막 단가로 통일 — 사장님: 「마지막 단가로 통일」. 적용시작일 기본값 = 2026-01-01(모든 거래처, 단가 있는 줄) · 단가 = 마지막 단가(그대로).
       `보내기` 단가이력 = 한 줄(구매단가등록 단가·적용시작일, 고친 값 우선) — 꼴 그대로. 「단가이력(참고)」 열은 묶음 「단가(산 달)」 보기만(⚠같은 시작일 뺌).
       명세서 대조 `기준` 의 묶음(산 달별 단가)은 그대로.
     v1.13.0(11-17): 저장이 남의 입력을 지우지 않게 — 사장님: 「새로고침 했더니 엘데코 자재번호 입력해 놓은 거 다 사라지네. 0.5초 자동저장이라며」.
       폼저장 = 창고의 지금 `줄` 을 읽고 이 화면에서 고친 칸만 얹어 씀(먼저 열어 둔 다른 창·기기가 옛 기억으로 덮어쓰던 길 막음) · `보내기` 판은 창고 판 +1.
       자재번호는 손으로 넣으면 기본값과 같아도 남김 · 저장 실패 = 화면 맨 위 빨간 띠 · 저장 전·칸에 치는 중 새로고침/닫기 = 브라우저가 물음.
     v1.14.0(11-17): 저장 빠르게 — 사장님: 「영림원보내기 저장중 왜 이리 오래 걸리냐」.
       ① 창고 값과 견줄 때 칸 차례 무관(고른값) — 전엔 창고가 칸 차례를 바꿔 늘 「바뀜」 이라 열 때마다 6곳을 차례로 다시 씀.
       ② 창고 문서를 onSnapshot 으로 받아 두고 저장 때 다시 읽지 않음(v1.13.0 보호 그대로) ③ _분류 는 바뀌었을 때만 씀.
     v1.14.1(11-17): 자동저장 기다림 0.5 → 0.3초 · _분류 처음 값도 창고 값으로(첫 저장 때 괜히 안 씀).
     v1.15.0(11-17): 저장된 값 파랑 · 바뀐 것 없으면 저장 안 함 — 사장님: 「저장되었을 때 입력값 파란색으로 변하게 해줘」 · 「한번 저장한 걸 또 저장하나?? 수정이나 삭제도 없었는데?」
       창고에 저장된 고친 칸 글자 = 파랑(#1565c0, 새로고침 뒤에도) · 고치면 저장 끝날 때까지 원래 색 · 실패 칸은 파랑 아님.
       칸 값이 저장된 값과 같으면(같은 값 다시 고름 등) 저장 0번 · 폼저장도 창고와 줄·이력·기준·연결·보내기가 모두 같으면 쓰지 않음.
     v1.16.0(11-17): 「중국엣지필름」 메뉴 — 사장님: 「지금 작업과 연결된 폴더에 해피코가 추가되었어요, 해당 파일을 중국엣지필름 메뉴를 만들어 추가해 주세요」.

.폼줄{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 0 8px;flex-shrink:0}
.폼상태{font-size:11.5px;color:var(--vg-muted)}
.폼상태.bad{color:var(--vg-red)}
.폼표 th.묶,.폼표 td.묶{border-left:1px solid #9C9C98}

.폼표 th .임{margin-left:3px;font-size:9.5px;font-weight:700;color:var(--vg-red);border:1px solid var(--vg-red);border-radius:3px;padding:0 2px}
.폼표 td.참{color:var(--vg-muted)}
.폼표 th .열쇠{display:block;font-size:9.5px;font-weight:400;color:var(--vg-muted)}
.폼표 td .덧표기{margin-left:4px;font-size:9.5px;color:var(--vg-muted);border:1px solid var(--vg-edge);border-radius:3px;padding:0 2px}
.폼표 td.dpr-k.참{color:var(--vg-ink)}
.폼표 .열쇠2{position:sticky;left:var(--열쇠1, 0px);z-index:1}   /* v1.18.3 명세서 열쇠 둘째 칸(규격)도 왼쪽 고정 */
.폼표 th.열쇠2{background:var(--vg-fill)}
@media (max-width:600px){.폼표 .열쇠2{position:static}}   /* 폰은 두 칸 고정이면 화면 대부분을 덮어 첫 칸만 */
.폼표 td.따{color:var(--vg-muted);background:var(--vg-fill)}
.폼표 td.입{padding:0;white-space:nowrap}
.폼표 td.입:focus-within{outline:2px solid var(--vg-ink);outline-offset:-2px}
.폼표 td.참 .표시,.폼표 td.입 .표시{font-size:11px;font-weight:700;color:var(--vg-red);padding-left:4px}
.폼표 input,.폼표 select{font:inherit;font-size:11.5px;line-height:1.3;color:var(--vg-body);border:0;border-radius:0;background:transparent;
  padding:2px 5px;margin:0;outline:none;min-width:0}
.폼표 input.num{text-align:right}
.폼표 td.입 .저장값{color:#1565c0}   /* v1.15.0 창고에 저장된 고친 값 = 파랑 */
.폼표 select{padding:2px 2px;cursor:pointer}
.폼표 input[type=date]{width:11em}
/* v1.5.0 삭제(등록 안 함) 줄 · 자재번호 겹침 · 줄마다 임시 칸 */
.폼표 tr.뺌 td{background:var(--vg-fill)}
.폼표 tr.뺌 td:not(:nth-child(3)){opacity:.45}
.폼표 tr.뺌 td.dpr-k,.폼표 tr.뺌 td:nth-child(2){text-decoration:line-through}
.폼표 td.가운데{text-align:center;padding:0 5px}
.폼표 input[type=checkbox]{width:auto;margin:3px 2px;vertical-align:middle;cursor:pointer}
.폼표 td.겹{background:#FFE9E7;box-shadow:inset 0 0 0 1px var(--vg-red)}
.폼표 td.임칸{box-shadow:inset 0 0 0 1px var(--vg-red)}
/* v1.10.0 채우기 손잡이(엑셀처럼 아래로 끌어 같은 값) — 고른 칸 오른쪽 아래 작은 네모 · 끄는 동안 범위 점선 */
.폼표 td.손자리{position:relative}
.채움손{position:absolute;right:-4px;bottom:-4px;width:7px;height:7px;box-sizing:border-box;background:var(--vg-ink);border:1px solid var(--vg-bg);
  z-index:0;cursor:crosshair;touch-action:none}
@media (pointer:coarse){.채움손{width:14px;height:14px;right:-7px;bottom:-7px}}
.폼표 td.채움범위{outline:1px dashed var(--vg-ink);outline-offset:-2px;background:var(--vg-fill)}
/* v1.17.0 영림원 등록 결과 — 완료 줄 초록 · 오류 줄 빨강 · 대기·진행중 작게 */
.폼표 tr.완료 td{background:#EDF7EE}
.폼표 tr.완료 td.dpr-k{box-shadow:inset 4px 0 0 #2e7d32}
.폼표 tr.오류 td{background:#FFF1F0}
.폼표 tr.오류 td.dpr-k{box-shadow:inset 4px 0 0 var(--vg-red)}
.폼표 td.등록{font-size:11px;white-space:nowrap;max-width:26em;overflow:hidden;text-overflow:ellipsis}
.폼표 td.등록 .완{color:#2e7d32;font-weight:700}
.폼표 td.등록 .오{color:var(--vg-red);font-weight:700}
.폼표 td.등록 .이유{color:var(--vg-red)}
.폼표 td.등록 .작{color:var(--vg-muted);font-size:10.5px}
.폼표 td.등록{text-align:center}
.폼표 td.등록 .점{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle}   /* v1.18.1 글 없이 색 점 */
.폼표 td.등록 .고치기{font:inherit;font-size:10.5px;padding:0 4px;border:1px solid var(--vg-edge);border-radius:3px;background:var(--vg-bg);color:var(--vg-ink);cursor:pointer}
.폼표 [data-k]:disabled{opacity:1;cursor:default}
.폼표 td.분류틀,.폼표 td.고칠칸{background:#FFE9E7;box-shadow:inset 0 0 0 2px var(--vg-red)}   /* v1.17.1 분류 규칙 어긋남 · v1.18.0 오류 단계의 고칠 칸 */
.폼표 td.입:has([data-k]:disabled){background:var(--vg-fill)}   /* v1.18.0 완료 단계 칸 = 잠금 */

#오류목록{flex-shrink:0;max-height:30vh;overflow:auto;margin:0 0 8px}
#오류목록 .chip{margin-left:6px}
.state{background:var(--vg-fill);border-radius:14px;padding:22px 16px;text-align:center;margin-top:12px}
.state .big{font-size:14px;font-weight:600;color:var(--vg-ink);padding-bottom:6px}
.state .sub{font-size:12.5px;color:var(--vg-muted);line-height:1.85}
.state .why{font-size:11.5px;color:var(--vg-red);padding-top:6px;font-family:ui-monospace,monospace}

<body>
<div class="wrap">
<header>
  <div class="logo"><b>VIVIVIC</b> — 발주역입력</div>
  <div class="badge">v1.20.0</div>
</header>
<nav class="쪽길"><a href="재단.html">재단 세부내역</a><a href="보드매입현황.html" class="on">보드/엣지 매입현황</a><a href="이룸산업.html">이룸산업 출고내역</a><a href="로앤.html">로앤 출고내역</a></nav>
<h1>보드/엣지 매입현황</h1>
<div class="months" id="거래처"></div>
<div class="months" id="볼것"></div>
<div class="state" id="목상태"><div class="big">창고를 읽는 중입니다…</div></div>
<div id="속"></div>
</div>

<!-- 짚어서 지시하는 손잡이 — 바이글 박스에서 열면 켜진다. -->
<script src="../shared/viggle.js"></script>

<script>
const 창고자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_보드매입'];
/* 창고 꼴(tools/보드매입읽기.py):
   _목록 = {시트들:[시트 이름…], 파일, 읽은날}
   시트 문서(이름 = 엑셀 시트 이름) = {시트, 제목(1행), 표:[{이름?, 제목?, 칸:[…], 수:[칸마다 숫자칸 1/0], 줄:[{v:[…], 월?, 소?}]}], 글?:[…]}
     거래처 시트의 표 = [월별, 누계, 매입품목] · 총괄요약의 표 = [구매내역 총괄, 월별 비율] + 글(「※」 줄) */
let 시트들 = [], 받은 = {}, 고른 = '', 볼것 = '전체', 답했나 = false, 목록정보 = {};

const 글 = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function 목상태(큰,작,까닭){
  const el=document.getElementById('목상태'); el.style.display='block';
  el.innerHTML = `<div class="big">${큰}</div>` + (작?`<div class="sub">${작}</div>`:'') + (까닭?`<div class="why">${까닭}</div>`:'');
}
window.목록못읽음 = (큰,까닭) => { 답했나=true; 목상태(큰,'관리자에게 알려 주십시오.',까닭||''); };
setTimeout(() => { if(!답했나) 목상태('창고에 닿지 못했습니다','인터넷이 끊겼거나 창고가 막혀 있습니다. 새로고침해 보십시오.'); }, 20000);

window.목록읽기 = async function(){
  try{
    const { doc, getDoc } = window.fbRead;
    const 목 = await getDoc(doc(window.db, ...창고자리, '_목록'));
    답했나 = true;
    목록정보 = 목.exists() ? 목.data() : {};
    시트들 = 목록정보.시트들 || [];
    if(!시트들.length){ 목상태('창고에 보드매입 자료가 없습니다'); return; }
    document.getElementById('목상태').style.display='none';
    거래처단추();
    시트고름(시트들[0]);
  }catch(e){ window.목록못읽음('창고를 읽지 못했습니다', (e&&(e.code||e.message))||''); }
};

function 거래처단추(){
  document.getElementById('거래처').innerHTML = 시트들.map(s => `<button class="chip" data-s="${글(s)}">${글(s)}</button>`).join('') +
    `<button class="chip" data-s="해피코">해피코</button>` +   /* v1.16.0 「중국엣지필름」 → v1.19.0 「해피코」(사장님) — 거래처 하나로 */
    `<button class="chip" data-s="__거래처">거래처 연결</button>` +   /* v1.6.0 — 영림원 기존 거래처와 연결(지은 이름) */
    `<button class="chip" data-s="__엑셀">엑셀 새로 불러오기</button>`;   /* v1.9.0 — 새 판 엑셀(지은 이름) */
  document.querySelectorAll('#거래처 .chip').forEach(b => { b.onclick = () => 시트고름(b.dataset.s); b.classList.toggle('on', b.dataset.s===고른); });
}
async function 시트고름(s){
  고른 = s; 볼것 = '전체';
  document.querySelectorAll('#거래처 .chip').forEach(b => b.classList.toggle('on', b.dataset.s===s));
  document.getElementById('볼것').innerHTML = '';
  if(s==='__거래처'){ 연결그리기(); return; }
  if(s==='__엑셀'){ 엑셀그리기(); return; }
  if(s===해피코){ 중국고름(); return; }
  const 속 = document.getElementById('속');
  if(!받은[s]){
    속.innerHTML = '<div class="state"><div class="big">읽는 중입니다…</div></div>';
    try{
      const { doc, getDoc } = window.fbRead;
      const d = await getDoc(doc(window.db, ...창고자리, s));
      받은[s] = d.exists() ? d.data() : { 표:[] };
    }catch(e){ 속.innerHTML = `<div class="state"><div class="big">창고를 읽지 못했습니다</div><div class="why">${글((e&&(e.code||e.message))||'')}</div></div>`; return; }
  }
  if(고른 !== s) return;
  볼것그리기(); 그리기();
}

/* 거래처 시트: 전체(월별 표 통째) · 달마다 · 누계 · 매입품목. 버튼 글은 엑셀 글자(「1월」, 누계 제목의 「1~10월 누계」, 목록 머리 「1~10월 매입품목」). 「전체」 만 지은 말(임시). */
function 볼것그리기(){
  const d = 받은[고른], el = document.getElementById('볼것');
  const 월표 = (d.표||[]).find(t => t.이름==='월별');
  if(!월표){ el.innerHTML=''; return; }
  const 달들 = [...new Set((월표.줄||[]).map(z => z.월).filter(Boolean))];
  const 누표 = d.표.find(t => t.이름==='누계'), 목표 = d.표.find(t => t.이름==='매입품목');
  const 버튼 = [['전체','전체'], ...달들.map(m => ['m:'+m, m])];
  if(누표) 버튼.push(['누계', (String(누표.제목).match(/\d+~\d+월\s*누계/)||['누계'])[0]]);
  if(목표) 버튼.push(['매입품목', 목표.칸[0] || '매입품목']);
  버튼.push(['영림원', '영림원등록']);
  버튼.push(['폼', '영림원보내기']);   /* v1.4.0 「영림원 입력폼」 → v1.8.1 「영림원보내기」 */
  el.innerHTML = 버튼.map(([k,t]) => `<button class="chip${k===볼것?' on':''}" data-k="${글(k)}">${글(t)}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    볼것 = b.dataset.k; el.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x===b)); 그리기();
  });
}

function 표글(t, 줄, 제목){
  const 칸 = t.칸||[], 수 = t.수||[];
  let h = `<div class="표">${제목?`<div class="표제목">${글(제목)}</div>`:''}<table class="dpr-t"><thead><tr>` +
    칸.map((k,i) => `<th class="${i===0?'dpr-k':''}">${글(k)}</th>`).join('') + '</tr></thead><tbody>';
  for(const z of 줄){
    h += `<tr${z.소?' class="sub"':''}>` + 칸.map((k,i) => {
      const cls = (i===0?'dpr-k':'') + (수[i]?' num':'');
      return `<td${cls.trim()?` class="${cls.trim()}"`:''}>${글((z.v||[])[i])}</td>`;
    }).join('') + '</tr>';
  }
  return h + '</tbody></table></div>';
}

/* 영림원등록(v1.1.0) — 월별 표의 품목 줄에서 납품제품명(품목)을 겹치지 않게. 칸 = 품목 · 규격 · 단가(엑셀 칸 이름 그대로).
   규격 글자가 다르면 다른 줄(임시). 현진산업·현준보드(서광)는 「별도 단가(원)」(부가세 별도) 를 보인다(임시). 「(구매내역 없음)」·소계 줄은 뺀다.
   v1.2.0: 줄 차례 = 1~10월 매입 수량 합계가 많은 차례(반품 음수 줄 포함, 같으면 월별 표에 처음 나온 차례 — 임시. 수량 칸은 보이지 않는다).
     단가가 바뀐 줄은 월별 표 줄 차례대로 「단가(그 단가로 산 달) → 다음 단가(…)」. 같은 달 안의 앞뒤는 엑셀 줄 차례.
     0원(무상) 줄은 변동으로 치지 않고 끝에 「무상(N월)」 으로 따로 적는다. 0원만 있는 줄은 그대로 0. */
const 수 = s => { s = String(s??'').trim().replace(/,/g,''); if(s===''||s==='-') return 0;
  const m = s.match(/^\((.*)\)$/); return m ? -Number(m[1])||0 : Number(s)||0; };
const 무상 = 값 => 값==='0' || 값==='-';
const 달들글 = 달 => { const n = 달.map(m => parseInt(m)); return n.length===1 || n[0]===n[n.length-1] ? `${n[0]}월` : `${n[0]}~${n[n.length-1]}월`; };
function 품목모으기(t){
  const 칸 = t.칸||[], 찾 = (...a) => a.map(k => 칸.indexOf(k)).find(i => i >= 0) ?? -1;
  const 품 = 찾('납품제품명(품목)','제품명'), 규 = 찾('규격','옵션'), 량 = 찾('수량','수량(M)');   /* v1.19.0 해피코 = 제품명·옵션·수량(M) */
  const 단 = 칸.includes('별도 단가(원)') ? 칸.indexOf('별도 단가(원)') : 찾('단가(원)','단가');
  const 포 = 칸.includes('별도 단가(원)') ? 칸.indexOf('단가(원)') : -1;   /* v1.7.0 현진·현준 엑셀 「단가(원)」(부가세 포함 원장) — 대조 기준에만 */
  /* v1.3.0 합계금액 = 공급가액(부가세 별도) — 단가 칸과 같은 기준. 현진·현준은 「별도 공급가액(원)」(임시) */
  const 금 = 칸.includes('별도 공급가액(원)') ? 칸.indexOf('별도 공급가액(원)') : 칸.indexOf('공급가액(원)');
  const 모 = new Map();
  for(const z of (t.줄||[])){
    if(z.소) continue;
    const v = z.v||[], 이름 = String(v[품]??'').trim();
    if(!이름 || 이름==='(구매내역 없음)' || /^\[.*(소계|총계)\]$/.test(이름)) continue;
    const 규격 = String(v[규]??'').trim(), 키 = 이름+'\t'+규격, 값 = String(v[단]??'').trim();
    if(!모.has(키)) 모.set(키, { 이름, 규격, 량:0, 금:0, 흐름:[], 무:[], 반품:[] });
    const m = 모.get(키); m.량 += 수(v[량]); m.금 += 수(v[금]);
    if(수(v[량]) < 0 && !m.반품.includes(z.월)) m.반품.push(z.월);   /* v1.7.0 반품(수량 음수) 달 — 대조 기준에만 */
    if(!값) continue;
    if(무상(값)){ if(!m.무.includes(z.월)) m.무.push(z.월); continue; }
    const 끝 = m.흐름[m.흐름.length-1], 포값 = 포 >= 0 ? 숫자글(v[포]) : '';
    if(끝 && 끝.값===값){ if(!끝.달.includes(z.월)) 끝.달.push(z.월); if(포값 && !끝.포.includes(포값)) 끝.포.push(포값); }

/* 창고 보내기와 견줘 바뀌었으면 새 보내기(판 +1), 같으면 null */

    줄:새.map(z => { const o = 옛줄.get(z.열쇠); const { 열쇠, 상태, 지문, ...나 } = z; return { 열쇠, 상태, 지문, 고친때:o && o.지문===지문 && o.고친때 ? o.고친때 : 지금, ...나 }; }) };

let 새엑셀 = null;   // {파일, 읽음, 요약:[…], 대조, 쓸:[이름…]} 또는 {바꾼때, 대조}

/* ==== 엑셀읽기 시작 (v1.9.0) — tools/보드매입읽기.py 를 그대로 옮긴 것(같은 엑셀이면 같은 창고 값). 시험: 노드에서 이 덩이만 떼어 돌린다 ==== */
function 엑셀읽기(X, buf){
  const wb = X.read(buf, { type:'array', cellNF:true });
  const 시트숨김 = ((wb.Workbook||{}).Sheets||[]).reduce((a,x) => (a[x.name] = x.Hidden, a), {});
  const 셀 = (ws, r, c) => ws[X.utils.encode_cell({ r:r-1, c:c-1 })];
  const 꼴 = c => (c && c.z) || 'General';
  const 날짜인가 = c => c && c.t==='n' && 꼴(c)!=='General' && X.SSF.is_date(꼴(c));
  const 값 = (ws, r, c) => { const x = 셀(ws, r, c); if(!x || x.t==='z') return null; if(x.t==='e') return x.w || '#ERR'; return x.v===undefined ? null : x.v; };
  const 빈 = v => v===null || v===undefined || v==='';
  const 파이글 = v => typeof v==='boolean' ? (v?'True':'False') : (typeof v==='number' && Number.isInteger(v) && !Object.is(v,-0) ? String(v) : String(v));
  /* 파이썬 Decimal(repr(x)).quantize(…, ROUND_HALF_UP) 와 같게 — 글자로 반올림 */
  function 반올림(x, n){
    let s = String(x);

  속.innerHTML = '<div class="표통">' + 표글(d, 줄, `${d.업체||'해피코'} · ${d.시트||''}`) +
    `<div class="글">${줄.length}줄 · ${글(d.파일||'')} · ${글(d.읽은날||'')} 읽음${달 ? ' · 달 = 입고일 기준(임시)' : ''}</div></div>`;
}

/* ---- 엑셀 새로 불러오기(중국엣지필름) — 고른 엑셀을 브라우저에서 읽어 지금 창고와 견주고, 「바꾸기」 를 눌러야(바뀐 것 있을 때만) 창고에 쓴다 ---- */
function 중국엑셀그리기(){
  const 속 = document.getElementById('속'), d = 중국||{}, 새 = 중국새;
  let h = `<div class="글" style="margin-top:0">지금 창고 = ${글(d.파일||'없음')}${d.읽은날 ? ' · ' + 글(d.읽은날) + ' 읽음' : ''} · ${(d.줄||[]).length}줄.<br>` +
    `새 판 엑셀(같은 꼴 「해피코 엣지 입고리스트」)을 고르면 먼저 바뀐 것만 보여 드립니다. 「바꾸기」 를 눌러야 창고가 바뀝니다. 국내 6곳 자료는 그대로입니다.</div>`;
  if(새 && 새.문서){
    const 옛 = (d.줄||[]).map(z => JSON.stringify(z.v)), 신 = 새.문서.줄.map(z => JSON.stringify(z.v));
    const 칸같음 = !(d.칸||[]).length || 고른값(d.칸)===고른값(새.문서.칸);
    새.같음 = 칸같음 && 고른값(옛)===고른값(신);
    h += `<div class="표"><div class="표제목">${글(새.문서.파일)} — 바꾸기 전 확인(아직 창고에 안 씀)</div><table class="dpr-t"><thead><tr><th class="dpr-k">시트</th><th>줄(지금 → 새)</th><th>새로 생긴 줄</th><th>사라진 줄</th><th>알림</th></tr></thead><tbody>` +
      `<tr><td class="dpr-k">${글(새.문서.시트)}</td><td class="num">${옛.length} → ${신.length}</td><td class="num">${빼기(신, 옛).length}</td><td class="num">${빼기(옛, 신).length}</td>` +
      `<td>${[칸같음 ? '' : `<span class="별">칸이 지금 창고와 다름(${글(새.문서.칸.join(' · '))})</span>`, 새.같음 ? '지금 창고와 같음 — 쓸 것 없음' : ''].filter(Boolean).join(' · ')}</td></tr></tbody></table></div>`;
  }else if(새 && 새.바꾼때){
    h += `<div class="글">${글(새.파일)} — 창고에 썼습니다(${때글(새.바꾼때)}) · 창고에서 다시 읽음 ${(d.줄||[]).length}줄.</div>`;
  }
  속.innerHTML = `<div class="폼줄"><button class="chip" id="중국고르기">엑셀 고르기</button>` +
    (새 && 새.문서 && !새.같음 ? `<button class="chip on" id="중국바꾸기">바꾸기</button><button class="chip" id="중국그만">그만두기</button>` : '') +
    `<input type="file" id="중국파일" accept=".xlsx,.xls" hidden><span id="중국상태" class="폼상태"></span></div><div class="표통">${h}</div>`;
  const 파일 = document.getElementById('중국파일');
  document.getElementById('중국고르기').onclick = () => 파일.click();
  파일.onchange = () => { const f = 파일.files[0]; 파일.value = ''; if(f) 중국엑셀고름(f); };
  const 바 = document.getElementById('중국바꾸기'); if(바) 바.onclick = 중국바꾸기;
  const 그 = document.getElementById('중국그만'); if(그) 그.onclick = () => { 중국새 = null; 중국엑셀그리기(); };
}
function 중국상태(t, 나쁨){ const el = document.getElementById('중국상태'); if(el){ el.textContent = t; el.classList.toggle('bad', !!나쁨); } }
async function 중국엑셀고름(file){
  중국새 = null; 중국상태('엑셀을 읽는 중…');
  try{
    const X = await loadXlsx();
    const 문서 = 중국엑셀읽기(X, await file.arrayBuffer());
    문서.파일 = file.name; 문서.읽은날 = new Date().toLocaleDateString('sv-SE');
    중국새 = { 문서 }; 중국엑셀그리기();
  }catch(e){ 중국상태('엑셀을 읽지 못했습니다 ' + ((e&&(e.code||e.message))||''), true); }
}
async function 중국바꾸기(){
  const 새 = 중국새; if(!새 || !새.문서 || 새.같음) return;
  중국상태('창고에 쓰는 중…');
  try{
    const { doc, setDoc, getDoc } = window.fbRead;
    await setDoc(doc(window.db, ...중국자리, 중국문서), 새.문서);
    const d = await getDoc(doc(window.db, ...중국자리, 중국문서));
    중국 = d.exists() ? d.data() : { 줄:[] };
    if((중국.줄 || []).length) 받은[해피코] = 해피코월표(중국);   /* v1.19.0 영림원보내기 줄도 새 값으로(고친 칸은 열쇠로 이어짐) */
    중국새 = { 바꾼때:new Date().toISOString(), 파일:새.문서.파일 };
    중국볼것그리기(); 중국엑셀그리기();
  }catch(e){ 중국상태('창고에 쓰지 못했습니다 ' + ((e&&(e.code||e.message))||''), true); }
}

/* ==== 중국엑셀읽기 시작 (v1.16.0) — tools/중국엣지읽기.py 와 같은 셈(같은 엑셀이면 같은 창고 값). 시험: 노드에서 이 덩이만 떼어 돌린다 ====
   시트 = 1행에 「제품명」·「입고일」 이 있는 첫 시트. 칸 = 1행 글자 그대로(빈 머리 칸은 끝에서 자름). 줄 = 2행부터 마지막 글이 있는 행까지, 다 빈 행은 뺌.
   값 = 셀 표시: 글 그대로 · 날짜 = YYYY-MM-DD · 숫자 = 표시 꼴의 [$¥] 같은 통화 글자 + #,##0(.00) 쉼표·소수, 일반은 그대로. */
function 중국엑셀읽기(X, buf){
  const wb = X.read(buf, { type:'array', cellNF:true });
  const 셀 = (ws, r, c) => ws[X.utils.encode_cell({ r:r-1, c:c-1 })];
  const 꼴 = c => (c && c.z) || 'General';
  const 날짜인가 = c => c && c.t==='n' && 꼴(c)!=='General' && X.SSF.is_date(꼴(c));
  const 값 = c => { if(!c || c.t==='z') return null; if(c.t==='e') return c.w || '#ERR'; return c.v===undefined ? null : c.v; };
  const 반올림 = (v, n) => { const k = 10 ** n, x = Math.round(Math.abs(v) * k + 1e-9) / k; return (v < 0 && x ? '-' : '') + x.toFixed(n); };
  const 쉼표 = s => { const [i, f] = s.split('.'); return i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f !== undefined ? '.' + f : ''); };
  function 표시(c){
    const v = 값(c); if(v===null || v==='') return '';
    if(typeof v==='string') return v;
    if(typeof v==='boolean') return v ? 'True' : 'False';
    if(날짜인가(c)){ const d = X.SSF.parse_date_code(v); return `${String(d.y).padStart(4,'0')}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
    let f = 꼴(c).split(';')[0], 앞 = '';
    const m = f.match(/^\[\$([^\]-]*)[^\]]*\]/); if(m){ 앞 = m[1]; f = f.slice(m[0].length); }
    const 꼴맞음 = f.match(/^(#,##)?0(?:\.(0+))?$/);
    if(꼴맞음){ const s = 반올림(v, (꼴맞음[2]||'').length); return 앞 + (꼴맞음[1] ? 쉼표(s) : s); }
    return String(v);
  }
  let ws = null, 이름 = '';
  for(const n of wb.SheetNames){
    const w = wb.Sheets[n], r = w['!ref'] && X.utils.decode_range(w['!ref']); if(!r) continue;
    const 머리 = []; for(let c = 1; c <= r.e.c + 1; c++) 머리.push(String(값(셀(w, 1, c)) ?? '').trim());
    if(머리.includes('제품명') && 머리.includes('입고일')){ ws = w; 이름 = n; break; }
  }
  if(!ws) throw new Error('1행에 「제품명」·「입고일」 이 있는 시트가 없습니다');
  const 범 = X.utils.decode_range(ws['!ref']);
  let 끝칸 = 범.e.c + 1; while(끝칸 > 0 && 표시(셀(ws, 1, 끝칸))==='') 끝칸--;
  const 칸 = []; for(let c = 1; c <= 끝칸; c++) 칸.push(표시(셀(ws, 1, c)));
  const 수 = 칸.map(() => 0), 입 = 칸.indexOf('입고일'), 줄 = [];
  for(let r = 2; r <= 범.e.r + 1; r++){
    const cs = 칸.map((_, i) => 셀(ws, r, i + 1)), v = cs.map(표시);
    if(v.every(x => x==='')) continue;
    cs.forEach((c, i) => { if(c && c.t==='n' && !날짜인가(c)) 수[i] = 1; });
    const 월 = /^\d{4}-\d{2}-\d{2}$/.test(v[입]||'') ? v[입].slice(0, 7) : '';
    줄.push({ v, 월, r });
  }
  return { 업체:'해피코', 시트:이름, 칸, 수, 줄 };
}
/* ==== 중국엑셀읽기 끝 ==== */


function 그리기(){
  const d = 받은[고른], 속 = document.getElementById('속');
  const 표들 = d.표||[];
  if(!표들.length){ 속.innerHTML = '<div class="state"><div class="big">표 없음</div></div>'; return; }
  let h = '';
  const 월표 = 표들.find(t => t.이름==='월별');
  if(!월표){                                   /* 총괄요약: 표 둘 + 「※」 글 */
    h = 표들.map(t => 표글(t, t.줄||[], t.제목)).join('');
    if((d.글||[]).length) h += `<div class="글">${d.글.map(글).join('<br>')}</div>`;
  }else if(볼것==='누계'){
    const t = 표들.find(t => t.이름==='누계'); h = 표글(t, t.줄||[], t.제목);
  }else if(볼것==='영림원'){
    h = 영림원목록(월표, d.제목);
  }else if(볼것==='폼'){
    폼그리기(); return;
  }else if(볼것==='매입품목'){
    const t = 표들.find(t => t.이름==='매입품목'); h = 표글(t, t.줄||[], d.제목);
  }else{
    const 달 = 볼것.startsWith('m:') ? 볼것.slice(2) : '';
    h = 표글(월표, (월표.줄||[]).filter(z => !달 || z.월===달), d.제목);
  }
  속.innerHTML = '<div class="표통">' + h + '</div>';
}
