<script>칸넓이.달기(document.getElementById('속'), { 열쇠:'영림원품목등록_칸넓이', 묶음: () => { const b = document.querySelector('.탭단추 .chip.on:not([data-t])'); return b ? b.dataset.u : ''; } });</script>

<script>
const 창고자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_영림원품목등록'];
/* vv2.5.2 사장님 11-19 「유한가구로 되어 있는 모든 거래처를 진아산업으로 바꿔 줘. 유한가구 = 진아산업이야.」 — 보이는 글만 바꿈(창고·원본 엑셀 사본은 그대로, 비교·열쇠는 원래 글자) */
const 별명 = v => typeof v==='string' ? v.replace(/유한가구/g,'진아산업') : v;
let 시트들 = [], 받은 = {}, 고른 = '', 답했나 = false;

const 글 = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');
function 목상태(큰,작,까닭){
  const el=document.getElementById('목상태'); el.style.display='block';
  el.innerHTML = `<div class="big">${큰}</div>` + (작?`<div class="sub">${작}</div>`:'') + (까닭?`<div class="why">${까닭}</div>`:'');
}
window.목록못읽음 = (큰,까닭) => { 답했나=true; 목상태(큰,'',까닭||''); };
setTimeout(() => { if(!답했나) 목상태('창고에 닿지 못했습니다'); }, 20000);

const 문서이름 = u => String(u).replace(/\//g,'／');

/* ── v2.32.0 빈 열 접기 — 사장님 11-21 「모든표에 필수입력이 아니며 모든열이 비워져 있다면 기본보기 상태가 모두 접혀져 있게 해주세요. 보기옵션에 펼쳐보기 상태일때만 모든열이 보이게」
   #속 안 모든 .dpr-t: 머리가 필수(th.필수 빨강)가 아니고, 그 열 모든 줄 칸이 빈 글자면 th·td 에 .접힘(화면에서만 숨김 — 표·값·복사·저장은 그대로).
   남기는 열: 필수 · 값 있는 칸 · 입력 칸(td.편 — 숨기면 입력을 못 함) · 모자람 칸(주황 = 채울 자리 표시). 펼쳐보기(body.펼침) = 모두 보임.
   #속 이 바뀌면(시트 바꿈·입력·편집·자료 갱신) 다시 셈 → 값이 생긴 열은 저절로 풀림. */
function 열접기(){
  const 속 = document.getElementById('속'); if(!속) return;
  for(const t of 속.querySelectorAll('table.dpr-t')){
    const 머 = t.tHead && t.tHead.rows[t.tHead.rows.length-1]; if(!머) continue;
    const n = 머.cells.length, 둠 = new Array(n).fill(false), 줄 = [...t.tBodies].flatMap(b => [...b.rows]);
    if(줄.some(r => r.cells.length !== n)) continue;   /* 칸 수가 다른 표(합친 칸)는 안 건드림 */
    for(let i=0;i<n;i++) if(머.cells[i].classList.contains('필수')) 둠[i] = true;
    for(const r of 줄) for(let i=0;i<n;i++){ if(둠[i]) continue; const c = r.cells[i];
      if(c.textContent.trim() || c.querySelector('input,select,textarea') || c.classList.contains('편') || c.classList.contains('모자람')) 둠[i] = true; }
    for(let i=0;i<n;i++){ const 접 = !둠[i];
      if(머.cells[i].classList.contains('접힘') !== 접){ 머.cells[i].classList.toggle('접힘', 접); for(const r of 줄) r.cells[i].classList.toggle('접힘', 접); } }
  }
}
let 접기틀 = 0;
new MutationObserver(() => { if(!접기틀) 접기틀 = requestAnimationFrame(() => { 접기틀 = 0; 열접기(); }); })
  .observe(document.getElementById('속'), { childList:true, subtree:true, characterData:true });

window.목록읽기 = async function(){
  try{
    const { doc, getDoc } = window.fbRead;
    const 목 = await getDoc(doc(window.db, ...창고자리, '_시트목록'));
    답했나 = true;
    시트들 = (목.exists() && 목.data().시트들) || [];
    if(!시트들.length){ 목상태('창고에 영림원품목등록이 없습니다'); return; }
    document.getElementById('목상태').style.display='none';
    /* v2.49.0 탭 차례 = 앞 단계 등록이 끝나야 다음 단계를 등록할 수 있는 차례(사장님 11-23) — 재공품이 BOM 모품목이라 BOM 앞 · 원부자재(참고)는 뒤 */
    const 차례 = [품목시트, '자재등록(재공품)', BOM시트, '품목별공정흐름유형등록', 공소시트, '제품별공정별워크센터등록', '외주계약등록', '공정별 워크센터 기본값', '본사창고관리', '가공단가관리'];   /* v2.60.0 설정 탭 = 등록 탭 뒤 · 원부자재 앞 */
    const 창이름 = 시트들.map(t => t.이름), 뒤 = 창이름.filter(n => !차례.includes(n) && n!=='원부자재').concat(['원부자재']);
    const 탭들 = 차례.concat(뒤).filter((n, k, a) => a.indexOf(n)===k && (창이름.includes(n) || 계산시트[n]));
    const 흐름탭 = 차례.slice(0, 차례.indexOf('외주계약등록') + 1), 단추 = u => `<button class="chip" data-u="${글(u)}">${글(u)}</button>`;   /* v2.73.0 등록 흐름 한 줄(→ 차례) · 기타 메뉴 다음 줄 */
    const 흐름단추 = u => { const 갈 = 계산시트[u] && Object.keys(계산시트[u].탭); return 갈 && 갈.length > 1 ? `<span class="갈래">${단추(u)}<span class="갈래선"></span><span class="갈래목">${갈.map(t => `<button class="chip" data-u="${글(u)}" data-t="${글(t)}">${글(t)}</button>`).join('')}</span></span>` : 단추(u); };   /* v2.84.0 하위 탭 = 흐름 안 두 갈래 */
