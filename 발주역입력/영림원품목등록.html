<!DOCTYPE html>
<!-- 발주역입력 / 영림원품목등록 — 「품목등록test서버용」 엑셀의 시트 셋(품목등록업로드 · BOM등록업로드 · 원부자재) 목록.
     시트 단추(업체별단품.html 의 업체 단추와 같은 꼴) → 그 시트 표(머리 줄 칸 그대로, 모든 줄).
     사장님 11-18: 「이 파일 시트 모두 표기해야겠다. 영림원품목등록 이라는 메뉴를 만들어서 세 가지 시트가 모두 나오는 페이지로 만들어줘」
     판 번호는 머리의 배지와 같다. 고칠 때 둘을 같이 올린다: v2.18.0
     v2.18.0(11-20): 사장님 — BOM 이 품목등록업로드 화면에 보이는 값만 쓰게. 원본 시트 값을 읽던 곳: 반제품값() 합판코드·필름코드·재단률, 조립짜기() 투입수량.
       이제 합판·필름코드·투입수량 = 사람 입력값(_입력) · 재단률 = 화면 재단률 칸 값(에이엠티 셈, 못 셈이면 엑셀 값). 빈 입력이면 BOM 그 칸 빈칸(v2.17 규칙).
       입력·재단률 셈이 바뀌면 BOM 표를 다시 만듦(연동칠·재단칠 앞에서 BOM다시). 화면만 — 창고 그대로.
     v2.17.0(11-20): 사장님 「BOM등록업로드는 자동으로 된 부분만 표기하고, 자동으로 되지 못한 곳은 일단 빈칸으로 보이게 해봐」 —
       BOM 표 칸 = 프로그램이 만든 값만: 조립 줄(v2.14 품목등록업로드로 짠 줄) = 모두 · 가공 줄 = 모품목번호·공정(공정흐름)·품목등록업로드 값으로 정해진 칸
       (모품목명·규격·단위 · 하위품번 = 합판/필름코드 · 하위품명 = 그 코드/자재 이름 · 필름 하위규격 · 합판 분모 = 재단률 · 비고 「원장 1매에서 N개」 · 필름 분자 = 필름 소요량).
       원본 BOM 값이 그대로인 칸 = 빈칸. 줄 수·차례는 그대로(가공 줄 수는 원본 BOM 에서 옴). 화면만 — 창고·_입력·계산은 원래 값 그대로.
     v2.16.0(11-20): 사장님 「처음부터 복잡하게 품목업로드 품명을 다 넣어놓고 작업하지 말고, 방금 테스트한 제품 하나만 이 프로그램에 나타나게 하고 작업해보자. 이 상태부터 먼저 만들어줘」 —
       품목등록업로드 표 = 「(KRW) 알렉스 1200 높은 수납장 올화이트」 제품 줄 + 모품목(상위 품번)이 그 제품인 반제품 줄만 · BOM등록업로드 표 = 모품목번호가 그 품번들인 줄만.
       화면만 거름(표 그리기 직전) — 창고 시트·_입력·다른 품목 값은 그대로, 계산(공정흐름 자동·조립/가공 짜기·재단률)은 전체 줄로 예전대로. 원부자재·추가할 제품은 그대로.
     v2.15.0(11-20): 사장님 「품목등록 업로드에 이미 있는 정보는 무조건 품목등록의 정보 우선으로 처리해줘」 —
       BOM 가공 줄(반제품 → 합판·필름)도 품목등록업로드 그 반제품 줄 값으로: 모품목명·규격·단위 · 합판 줄 하위품번 = 합판코드 · 분모 = 재단률 · 비고 「원장 1매에서 N개」 ·
       필름 줄 하위품번 = 필름코드 · 하위규격 = 필름코드 폭(ed_…_31_… → 31mm) · 분자 = 필름 소요량(M). 코드가 바뀌면 하위품명 = 코드(원래 품명이 자재 이름이면 원부자재 탭 이름).
       품목 칸이 빈칸이면 원본 값 그대로. 바뀐 칸 = 옅은 노랑(마우스 = 원본 값). 저장 없음.
     v2.14.0(11-20): 사장님 「자동으로 고」 — BOM 조립 줄(제품 → 반제품)을 원본 BOM 시트 대신 품목등록업로드 반제품 줄(모품목(상위 품번)·투입수량)로 짬.
       모품목명·규격·단위 = 품목등록업로드 그 제품 줄 · 하위 = 반제품 줄 · 표시순서 = 제품마다 품목 차례 · 소요량 = 투입수량(소수면 분수 1/9 꼴) · 비고 「반제품 투입」.
       원본 조립 줄과 다른 칸 = 옅은 노랑 바탕(마우스 = 원본 값) · 원본에 없던 줄 = 하위품번 칸 노랑. 가공 줄은 그대로. 저장 없음 · 품목이 바뀌면 다시 짬.
     v2.13.0(11-20): 사장님 「품목등록업로드에 없는 BOM등록업로드 빨간글씨 모두 삭제 해줘」 —
       BOM 표에서 모품목명(앞뒤 빈칸 뺀 글자)이 품목등록업로드 품명에 없는 모품목의 줄을 모두 뺌(화면만 · 창고 시트·원본 엑셀은 그대로).
       품목 시트를 다 받은 뒤에만 거름 · 품목 품명·반제품이 바뀌면 BOM 표를 다시 만듦(그 품명이 생기면 줄이 돌아옴).
     v2.12.0(11-19): 사장님 「품목등록업로드 품명이 BOM등록업로드의 모품목명에 없다면 해당 모품목명이 붉게 보이게 해주세요」 —
       BOM 표 모품목명(앞뒤 빈칸 뺀 글자)이 품목등록업로드 품명에 없으면 그 칸 빨간 글자(마우스 「품목등록업로드에 없음」). 품목이 바뀌면 바로 다시 따짐. 저장 없음.
     v2.11.0(11-19): 사장님 「사실 현재 비오엠업로드등록에서 공정이 가공인것들은 다 삭제하고 현 공정흐름에 맞게 재배치 해야함」 · 「공정 순서가 이미 공정흐름으로 보이잖아」 —
       BOM 「가공」 줄 = 품목등록업로드 반제품 것만 남기고(나머지 가공 줄은 표에서 뺌) 공정 칸 = 그 반제품 공정흐름(보이는 값 — 사람·자동)의 공정:
       합판 줄 = 흐름에서 「재단」 든 첫 공정(없으면 첫 공정) · 필름 줄 = 「엣지」(없으면 엣지 든 공정, 그것도 없으면 첫 공정 + 주황). 흐름 없음 = 빈칸 빨강 바탕. 저장 안 함 · 늘 셈.
     v2.10.0(11-19): 사장님 「아니 왜냐면 기본입력된 재단도가 어떤건지 확인이 되어야 해서」 — 재단률 칸 누름 = 재단도 창(오른쪽):
       기본 재단도(재단률을 셈한 4X8 바둑판 그림·배치·결보호·원장 행·원장명/마감/색) + 그 원장 행의 에이엠티 재단도(cutting_plans, 자동=기본 · 재단편집, boardParts 그림). 마우스 = 가로×세로·재단도 수.
     v2.9.0(11-19): 사장님 「품목등록업로드의 재단율 계산을 깃에 배포된 에이엠티 재단편집의 논리로 계산되게 그부분을 이 입력부와 연결해줄 수 있겠니」 —
       반제품 「재단률」 = shared/원장재단수량.js 원장당(규격 W*D, 결보호) — 에이엠티 재단 편집 기본규칙(4X8 · 전단컷 5 · 톱날 4.5 · 결보호 X 면 돌림) 한 벌.
       결보호 = 원장 엑셀(조혼가구·에이엠티 원장, 읽기만)에서 부속코드2 = 품번 → L·R 뗀 품번 → 단품코드+재단W×D. 저장 안 함. 못 셈 = 엑셀 원래 값 + 주황 바탕, 이유는 마우스.
     v2.8.0(11-19): 사장님 「영림원품목등록의 공정흐름값을 보면 옆쪽 품명 끝에 _상판 _지판 이런식으로 쓰인 부속명에 따라 공정흐름이 일정한 규칙이 있다는게 보일꺼야 이를 단서로 나머지 자동으로 채워지도록 해줘」 —
       반제품 공정흐름 빈 칸 = 같은 부속명(없으면 끝 영문 뺀 바탕)의 사람 값이 하나로 모이면 그 값을 옅은 글자로(저장 안 함 · 마우스 = 근거). 갈리면 안 채움. 규칙은 늘 지금 입력값에서 셈.
     v2.7.0(11-19): 사장님 「공정흐름 드롭 목록에 들어갈 항목을 추가·삭제하는 창이, 공정흐름 제목(머리)을 누르면 나타나게 해 줘. 거기서 추가·삭제하게.」 —
       공정흐름 머리 누름 = 작은 창(목록·항목마다 삭제·새 이름 + 추가·닫기, 같은 이름 막음, 「조립」 삭제 막음). 목록 = 창고 _공정목록 {목록[], 고친때}(없으면 처음 9개) · onSnapshot.
       목록에서 지운 흐름이 저장된 칸 = 값은 그대로, 빨간 글자 + 마우스 「목록에 없는 흐름」(다시 넣으면 풀림).
     v2.6.2(11-19): 사장님 「공정흐름 칸에서 드래그·복사·붙여넣기가 안 되는 것 같다 … 흐름을 고르는 동작과 드래그하려는 커서 이동이 겹쳐서 조작이 어렵다」 — 모든 입력 칸 조작 통일:
       PC 누름 = 고르기만(고른 칸을 다시 눌러도 안 열림 — 예전엔 열려서 그 칸에서 끌기를 시작하면 편집이 열렸음) · 끌기 = 여러 칸 · 열기 = 두 번 누름·Enter/F2·글 치기·고른 칸 오른쪽 ▾ 누름.
       복사·붙여넣기 = 문서에서 받음(예전엔 이벤트 대상이 표 상자일 때만 받아, 다른 데 글이 골라져 있으면 브라우저 기본 복사로 새 버림). 폰 = 누름 고르기 · 다시 누름/▾/길게 누름 = 열기.
     v2.6.1(11-19): 사장님 「품목자산분류가 제품인 것은 모두 조립.」 — 제품 줄 공정흐름 = 「조립」 고정(td.막음, 「제품 — 조립」 쪽지, 저장 안 함 · 늘 셈). 반제품 줄은 예전대로 드롭 9개.
     v2.6.0(11-19): 사장님 「품목등록업로드의 품명 앞 열에, 영림원 입력 정보와는 관계없지만 BOM등록업로드에 연동 적용될 단서를 입력하는 칸 … 공정흐름 … 드롭다운으로 선택 … 드래그·복사·삭제가 되는 칸」 —
       품명 앞 「공정흐름」 열(영림원 칸 아님, 머리 옅은 초록 · 마우스 「영림원 칸 아님 — BOM 연동용」). 제품·반제품 모든 줄 td.편, 열쇠 _입력.값[품번].공정흐름. 목록 9개 밖 값은 안 들어가고 쪽지. BOM 연동은 아직 없음(값만 저장).
     v2.5.2(11-19): 사장님 「유한가구로 되어 있는 모든 거래처를 진아산업으로 바꿔 줘. 유한가구 = 진아산업이야.」 — 표·추가할 제품 단추·제품 기본구매처의 「유한가구」 를 「진아산업」 으로 보임(창고·엑셀은 그대로). 진아산업은 영림원 거래처라 임시 풀림.
     v2.5.1(11-19): 사장님 「T 거래처 빼 줘.」 — 반제품 기본구매처 드롭에서 이름이 T 로 시작하는 거래처를 뺌(로그인·공개 사본 둘 다). 이미 넣은 값은 그대로.
     v2.5.0(11-19): 품목등록업로드 「기본구매처」 — 제품 줄 = 업체별 단품명(단품코드 = 품번) 업체 이름(입력폼 거래처 완료에서 같은 이름, 없으면 업체 이름 그대로), 고칠 수 없음(td.막음, 「제품 — 업체별 단품명 업체」).
       반제품 줄 = 빈 입력 칸(합판·필름과 같은 길), 드롭 = 입력폼 거래처 완료 중 외주가공거래처. 업체별 단품명에 없는 제품 + 그 반제품 줄 = 표 맨 아래 · 품명 빨강(마우스 「업체별 단품명에 없음」), 열 때마다·자료가 바뀔 때마다 다시 따짐.
     v2.4.0(11-19): 사장님 「BOM등록업로드도 필수 입력 칸을 찾아서 표기해 줘.」 — 품목등록업로드·BOM등록업로드 표 머리에서 영림원 필수 칸(500259·500302 시트 ControlKey NOS = 화면 빨간 머리)을 빨간 글자, 마우스 = 「영림원 필수」.
     v2.3.1(11-19): 사장님 「모든 표의 첫 행을 고정해서 스크롤해도 사라지지 않게 해 줘.」 — 머리 줄(thead) 고정, 붙박이 첫 칸 모서리는 맨 위. 폰·낮은 화면은 표 상자 높이를 화면까지(상자 안에서 밀어야 머리가 남음).
     v2.3.0(11-19): 사장님 「반제품에만 합판코드, 필름코드, 투입수량을 입력할 수 있게 해 줘. 제품의 해당 칸에 입력을 시도하면 제품이라고 경고가 뜨게 해 줘.」 —
       세 칸은 품목자산분류=반제품 줄만 입력 칸(td.편) · 제품 줄은 td.막음(누름·치기·붙여넣기·지우기 = 「제품」 경고, 섞인 붙여넣기는 반제품 줄만 들어감).
       투입수량도 입력 칸 — 열쇠는 품번 안 「투입수량@모품목」(같은 반제품도 제품마다 수량이 다름) · BOM 조립 줄(모품목 → 그 반제품) 소요량(분자)=입력값, 분모=1.

<h1>영림원품목등록</h1>
<div class="months" id="고름"></div>
<div class="state" id="목상태"><div class="big">창고를 읽는 중입니다…</div></div>
<div id="속"></div>
</div>

<!-- 짚어서 지시하는 손잡이 — 바이글 박스에서 열면 켜진다. -->
<script src="../shared/viggle.js"></script>

<script>
const 창고자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_영림원품목등록'];
/* vv2.5.2 사장님 11-19 「유한가구로 되어 있는 모든 거래처를 진아산업으로 바꿔 줘. 유한가구 = 진아산업이야.」 — 보이는 글만 바꿈(창고·원본 엑셀 사본은 그대로, 비교·열쇠는 원래 글자) */
const 별명 = v => typeof v==='string' ? v.replace(/유한가구/g,'진아산업') : v;
let 시트들 = [], 받은 = {}, 고른 = '', 답했나 = false;

const 글 = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');
function 목상태(큰,작,까닭){
  const el=document.getElementById('목상태'); el.style.display='block';
  el.innerHTML = `<div class="big">${큰}</div>` + (작?`<div class="sub">${작}</div>`:'') + (까닭?`<div class="why">${까닭}</div>`:'');
}
window.목록못읽음 = (큰,까닭) => { 답했나=true; 목상태(큰,'',까닭||''); };
setTimeout(() => { if(!답했나) 목상태('창고에 닿지 못했습니다'); }, 20000);

const 문서이름 = u => String(u).replace(/\//g,'／');

window.목록읽기 = async function(){
  try{
    const { doc, getDoc } = window.fbRead;
    const 목 = await getDoc(doc(window.db, ...창고자리, '_시트목록'));
    답했나 = true;
    시트들 = (목.exists() && 목.data().시트들) || [];
    if(!시트들.length){ 목상태('창고에 영림원품목등록이 없습니다'); return; }
    document.getElementById('목상태').style.display='none';
    document.getElementById('고름').innerHTML = 시트들.map(t => `<button class="chip" data-u="${글(t.이름)}">${글(t.이름)}</button>`).join('')
      + `<button class="chip" data-u="${추가}" hidden>${추가}</button><span id="폼상태" class="폼상태"></span>`;
    document.querySelectorAll('#고름 .chip').forEach(b => b.onclick = () => 시트고름(b.dataset.u));
    시트고름(시트들[0].이름);
    대조구독();
    입력구독();
    자재이름받기();   /* v2.15.0 */
  }catch(e){ window.목록못읽음('창고를 읽지 못했습니다', (e&&(e.code||e.message))||''); }
};

/* 시트마다 표를 한 번만 만들어 두고(받은[이름] = 표통 요소), 단추를 누르면 바꿔 끼우기만 한다. */
async function 시트고름(u){
  고른 = u;
  document.querySelectorAll('#고름 .chip').forEach(b => b.classList.toggle('on', b.dataset.u===u));
  const 속 = document.getElementById('속');
  if(u===추가){ 추가그리기(); return; }
  if(!받은[u]){
    속.innerHTML = '<div class="state"><div class="big">읽는 중입니다…</div></div>';
    try{
      const t = 시트들.find(x => x.이름===u);
      const { doc, getDoc } = window.fbRead;
      const 조각 = await Promise.all(Array.from({length:t.조각||1}, (_,k) => getDoc(doc(window.db, ...창고자리, `${문서이름(u)}_${k+1}`))));
      const 줄 = [].concat(...조각.map(s => s.exists() ? (s.data().줄||[]) : []));
      받은[u] = 표만들기(t.칸||[], 줄, u);
    }catch(e){ if(고른===u) 속.innerHTML = `<div class="state"><div class="big">창고를 읽지 못했습니다</div><div class="why">${글((e&&(e.code||e.message))||'')}</div></div>`; return; }
  }
  if(고른 !== u) return;
  속.replaceChildren(받은[u]);
}

/* ── 업체별 단품명 ↔ 품목등록업로드 대조(실시간) ──
   추가할 제품 = 업체별 단품명 줄 중 단품코드(앞뒤 빈칸 뺌)가 품목등록업로드 「품목자산분류=제품」 줄의 품번에 없는 것. */
const 추가 = '추가할 제품';
const 업체자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_업체별단품'];
const 품목시트 = '품목등록업로드';
let 품목조각 = [], 품목끊기 = [], 품목칸 = null, 업체순 = [], 업체값 = {}, 업체끊기 = {}, 고른업체 = '', 추가자리 = null;
function 대조구독(){
  const { doc, onSnapshot } = window.fbRead;
  onSnapshot(doc(window.db, ...창고자리, '_시트목록'), m => {
    const t = ((m.exists() && m.data().시트들) || []).find(x => x.이름===품목시트);
    품목끊기.forEach(f => f()); 품목끊기 = []; 품목칸 = t ? (t.칸||[]) : [];
    const n = t ? (t.조각||1) : 0; 품목조각 = Array(n).fill(null);
    if(!n){ 대조(); return; }
    for(let k=0;k<n;k++) 품목끊기.push(onSnapshot(doc(window.db, ...창고자리, `${문서이름(품목시트)}_${k+1}`), s => {
      const 바뀜 = 품목조각.every(x => x);
      품목조각[k] = s.exists() ? (s.data().줄||[]) : [];
      if(!품목조각.every(x => x)) return;
      if(바뀜 && 받은[품목시트]){ 받은[품목시트] = 표만들기(품목칸, [].concat(...품목조각), 품목시트); if(고른===품목시트) document.getElementById('속').replaceChildren(받은[품목시트]); }
      대조(); BOM다시(); 연동칠();
    }, () => {}));
  }, () => {});
  onSnapshot(doc(window.db, ...업체자리, '_업체목록'), m => {
    업체순 = (m.exists() && m.data().업체들) || [];
    for(const u of Object.keys(업체끊기)) if(!업체순.includes(u)){ 업체끊기[u](); delete 업체끊기[u]; delete 업체값[u]; }
    for(const u of 업체순) if(!업체끊기[u]) 업체끊기[u] = onSnapshot(doc(window.db, ...업체자리, 문서이름(u)), s => {
      업체값[u] = s.exists() ? s.data() : { 칸:[], 줄:[] }; 대조();
    }, () => {});
    대조();
  }, () => {});
}
let 추가줄 = null, 추가칸 = [];
function 대조(){
  if(품목칸===null || 품목조각.some(x => !x) || !업체순.length || 업체순.some(u => !업체값[u])) return;
  const pi = 품목칸.indexOf('품번'), ai = 품목칸.indexOf('품목자산분류'), 있음 = new Set();
  if(pi>=0 && ai>=0) for(const r of [].concat(...품목조각)) if(String(r.v[ai]??'').trim()==='제품'){ const c = String(r.v[pi]??'').trim(); if(c) 있음.add(c); }
  추가칸 = []; 추가줄 = [];
  const 새단품 = new Map();   /* v2.5.0 단품코드 → 업체(앞 업체 먼저) */
  for(const u of 업체순){ const 칸 = 업체값[u].칸||[], ci = 칸.indexOf('단품코드'); if(ci<0) continue;
    for(const r of (업체값[u].줄||[])){ const c = String(r.v[ci]??'').trim(); if(c && !새단품.has(c)) 새단품.set(c, u); } }
  단품업체 = 새단품; 품목다시();
  for(const u of 업체순){ for(const k of (업체값[u].칸||[])) if(!추가칸.includes(k)) 추가칸.push(k); }
  for(const u of 업체순){
    const 칸 = 업체값[u].칸||[], ci = 칸.indexOf('단품코드');
    for(const r of (업체값[u].줄||[])){
      if(ci>=0 && 있음.has(String(r.v[ci]??'').trim())) continue;
      추가줄.push({ 업체:u, v: 추가칸.map(k => { const i = 칸.indexOf(k); return i>=0 ? r.v[i] : ''; }) });
    }
  }
  const b = document.querySelector(`#고름 .chip[data-u="${추가}"]`);
  if(b){ b.hidden = false; b.textContent = `${추가} ${추가줄.length.toLocaleString()}`; }
  if(고른===추가) 추가그리기();
}
function 추가그리기(){
  const 속 = document.getElementById('속');
  if(!추가줄){ 속.innerHTML = '<div class="state"><div class="big">읽는 중입니다…</div></div>'; return; }
  if(고른업체 && !업체순.includes(고른업체)) 고른업체 = '';
  const 수 = u => 추가줄.filter(r => r.업체===u).length;
  const 단추 = [['', `전체 ${추가줄.length}`]].concat(업체순.map(u => [u, `${별명(u)} ${수(u)}`]))
    .map(([u,t]) => `<button class="chip${u===고른업체?' on':''}" data-e="${글(u)}">${글(t)}</button>`).join('');
  const 줄 = 고른업체 ? 추가줄.filter(r => r.업체===고른업체) : 추가줄;
  const 옛통 = 속.querySelector('.표통[data-추가]'), 옛자리 = 옛통 && 추가자리===고른업체 ? [옛통.scrollLeft, 옛통.scrollTop] : null;
  let h = '<table class="dpr-t"><thead><tr><th class="dpr-k">업체</th>' + 추가칸.map(k => `<th>${글(k)}</th>`).join('') + '</tr></thead><tbody>';
  for(const r of 줄) h += `<tr><td class="dpr-k">${글(별명(r.업체))}</td>` + r.v.map(v => `<td${typeof v==='number'?' class="num"':''}>${글(별명(v))}</td>`).join('') + '</tr>';
  h += '</tbody></table>';
  속.innerHTML = `<div class="months">${단추}</div>` + (줄.length ? `<div class="표통" data-추가="1">${h}</div>` : '<div class="state"><div class="big">줄 없음</div></div>');
  추가자리 = 고른업체;
  const 통 = 속.querySelector('.표통'); if(통 && 옛자리){ 통.scrollLeft = 옛자리[0]; 통.scrollTop = 옛자리[1]; }
  속.querySelectorAll('.months .chip').forEach(b => b.onclick = () => { 고른업체 = b.dataset.e; 추가그리기(); });
}

/* ── v2.2.0 품목등록업로드 입력 칸 · BOM등록업로드 연동 ──
   사장님 11-19: 「품목업로드 — 품목설명, 합판코드, 필름코드 빈칸(텍스트 쓰고 복사·드래그·붙여넣기·삭제 가능한 칸으로)으로 해줘.
     합판코드, 필름코드는 입력폼에 등록 완료된 해당 목록 드롭다운으로 선택 가능하게 … 이 변경으로 BOM등록업로드 등 동일제품, 동일반자재 같은 표기가 되게 연동」
   · 세 칸은 창고 시트 값(원본 엑셀 값)을 보이지 않고 입력값만 보인다. 입력값 = 창고 `_입력` {값:{품번:{칸:값}}, 고친때} — 품번이 열쇠라 같은 품번 줄은 모두 같은 값.
   · 저장 = 바뀐 칸만 setDoc merge(0.3초 뒤) · 저장된 값 파랑 · 실패 = 맨 위 빨간 띠(보드매입현황 v1.13 과 같음).
   · 연동 = BOM등록업로드 「가공」 줄: 모품목번호 X 의 하위품번이 품목등록업로드 X 줄의 **원래** 합판코드(또는 필름코드)와 같은 줄
     → X 의 입력 합판코드(필름코드)가 있으면 하위품번 = 입력값, 하위품명 = (원래 하위품명이 품번과 같으면) 입력값 / (아니면) 자재명, 하위규격 = 자재 규격(목록에 없으면 원래 값).
     입력값이 빈칸이면 원래 BOM 값 그대로(임시). 원래 필름 줄이 없는 반제품(합판 줄만)에 필름코드를 넣어도 BOM 줄은 생기지 않는다(임시). */
const 편칸 = ['품목설명','합판코드','필름코드','투입수량','기본구매처'], 고를칸 = { 합판코드:'합판', 필름코드:'필름', 기본구매처:'외주', 공정흐름:'공정' };
/* v2.6.0 공정흐름 — 품명 앞 덧칸(영림원 시트 칸 아님, 창고 시트에도 없음). 이 9개만 들어감(차례·표기 사장님 그대로). v2.11.0 BOM 가공 줄 공정 = 이 흐름(BOM공정칠) */
const 기본공정 = ['조립','재단-엣지-보링','재단-엣지','재단','재단-NC-곡면엣지','NC','NC멤브레인','오버레이','라미날접착'];
/* v2.7.0 목록은 창고 _공정목록 {목록[], 고친때} — 없으면 기본공정 9개. 머리 누름 창에서 추가·삭제(모든 기기 같음). 「조립」 = 제품 고정값이라 삭제 막음 */
let 공정목록 = 기본공정.slice();
/* v2.3.0 반제품만 입력 — 제품 줄의 이 칸은 td.막음(경고만). 투입수량 열쇠 = 「투입수량@모품목」(BOM 조립 줄 짝) */
const 반제품칸 = new Set(['합판코드','필름코드','투입수량','기본구매처']);
let 막음틀 = null;
function 막음알림(td, 따로){   /* v2.5.0 칸마다 글(td data-알림) — 없으면 반제품 글 · v2.6.0 따로 = 그 글 */
  let el = document.querySelector('.막음알림');
  if(!el){ el = document.createElement('div'); el.className = '막음알림'; document.body.appendChild(el); }
  el.textContent = 따로 || (td && td.dataset && td.dataset.알림) || '제품 — 반제품만 입력됩니다';
  const r = td ? td.getBoundingClientRect() : { left:innerWidth/2-90, bottom:innerHeight/2 };
  el.style.left = Math.max(4, Math.min(r.left, innerWidth - 200)) + 'px';
  el.style.top = Math.min(r.bottom + 2, innerHeight - 30) + 'px';
  el.hidden = false; clearTimeout(막음틀); 막음틀 = setTimeout(() => { el.hidden = true; }, 1500);
}
const BOM시트 = 'BOM등록업로드';
/* v2.4.0 영림원 필수 칸 — 11-19 영림원 테스트서버 조회: 품목등록업로드 500259 SS1 · BOM등록업로드 500302 SSNew 칸 ControlKey 에 NOS(= 화면 빨간 머리) */
const 필수칸 = {
  [품목시트]: new Set(['품명','품번','품목자산분류','기준단위','품목소분류','품목상태']),
  [BOM시트]: new Set(['모품목명','모품목번호','모품목BOM차수','하위품명','하위품번','투입단위','소요량(분자)','소요량(분모)'])
};
let 입력 = {}, 더럽 = new Map(), 연동줄 = [], 조립줄 = [], 모줄 = [];
let 자재목록 = { 합판:[], 필름:[] }, 폼자재 = null, 공개자재 = [];
const 열쇠 = (p,k) => p + '\t' + k;
const 값 = (p,k) => { const x = 열쇠(p,k); return 더럽.has(x) ? 더럽.get(x) : String(((입력[p]||{})[k]) ?? ''); };
const 파랑 = (p,k) => !더럽.has(열쇠(p,k)) && String(((입력[p]||{})[k]) ?? '') !== '';
function 폼상태(t, 나쁨){ const el = document.getElementById('폼상태'); if(el){ el.textContent = t; el.classList.toggle('bad', !!나쁨); } }

/* 자재 목록 — 입력폼 자재등록 완료(로그인 때) 또는 공개 사본. 합판 = 대분류 pb·md(보드) · 필름 = 대분류 엣지필름 (시트지 등 그 밖은 뺌 — 임시) */
const 자재종류 = big => /엣지|필름/.test(big) ? '필름' : (/^(pb|md)/i.test(big) || /합판|보드|mdf/i.test(big)) ? '합판' : '';
