<script>
const 창고자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_영림원품목등록'];
const 품목시트 = '품목등록업로드';
const 기본제품명 = '(KRW) 알렉스 1200 높은 수납장 올화이트';   /* 영림원품목등록 v2.16.0 한제품명 — _고른제품 문서가 없을 때 처음 값 */
let 칸 = null, 조각 = [], 끊기 = [], 고른 = null, 열림 = new Set(), 답했나 = false;
const 글 = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const 문서이름 = s => String(s).replace(/\//g, '／');
function 목상태(큰, 까닭){ const el = document.getElementById('목상태'); el.style.display = 'block'; el.innerHTML = `<div class="big">${큰}</div>` + (까닭 ? `<div class="why">${글(까닭)}</div>` : ''); }
window.목록못읽음 = (큰, 까닭) => { 답했나 = true; 목상태(큰, 까닭); };
setTimeout(() => { if(!답했나) 목상태('창고에 닿지 못했습니다'); }, 20000);
function 띠(말){ const el = document.getElementById('띠'); el.textContent = 말; el.hidden = !말; }

window.목록읽기 = function(){
  const { doc, onSnapshot } = window.fbRead;
  onSnapshot(doc(window.db, ...창고자리, '_시트목록'), m => {
    답했나 = true;
    const s = ((m.exists() && m.data().시트들) || []).find(x => x.이름 === 품목시트);
    if(!s){ 목상태('창고에 품목등록업로드가 없습니다'); return; }
    칸 = s.칸 || []; 끊기.forEach(f => f()); 끊기 = []; 조각 = new Array(s.조각 || 1).fill(null);
    for(let k = 0; k < 조각.length; k++) 끊기.push(onSnapshot(doc(window.db, ...창고자리, `${문서이름(품목시트)}_${k+1}`), d => { 조각[k] = (d.exists() && d.data().줄) || []; 그리기(); }, e => 목록못읽음('창고를 읽지 못했습니다', e && (e.code || e.message))));
  }, e => 목록못읽음('창고를 읽지 못했습니다', e && (e.code || e.message)));
  onSnapshot(doc(window.db, ...창고자리, '_고른제품'), d => { 고른 = d.exists() && Array.isArray(d.data().제품) ? new Set(d.data().제품.map(String)) : null; 그리기(); }, () => {});
};

function 묶음(){   /* 제품마다 [제품 줄, 하위 줄…] — 엑셀 차례 · 제품 없는 하위 줄은 끝에 */
  const I = k => 칸.indexOf(k), pi = I('품번'), ai = I('품목자산분류'), mi = I('모품목(상위 품번)'), ni = I('품명');
  const 트 = (r, i) => i < 0 ? '' : String(r.v[i] ?? '').trim();
  const 줄 = [].concat(...조각), 제 = [], 아래 = new Map(), 붙음 = new Set();
  for(const r of 줄) if(트(r, ai) === '제품'){ 제.push(r); 아래.set(트(r, pi), []); }
  const 남 = [];
  for(const r of 줄){ if(트(r, ai) === '제품') continue; const m = 트(r, mi); if(아래.has(m)) 아래.get(m).push(r); else 남.push(r); }
  return { 제, 아래, 남, 트, pi, ni };
}
function 처음고른(b){ return new Set(b.제.filter(r => b.트(r, b.ni) === 기본제품명).map(r => b.트(r, b.pi))); }
function 그리기(){
  if(!칸 || !조각.length || 조각.some(x => !x)) return;
  document.getElementById('목상태').style.display = 'none';
  const b = 묶음(), 켠 = 고른 || 처음고른(b);
  let h = '<table class="dpr-t"><thead><tr>' + 칸.map((k, i) => `<th class="${i===0?'dpr-k':''}">${글(k)}</th>`).join('') + '</tr></thead><tbody>';
  const 칸들 = (r, 첫) => 칸.map((k, i) => i === 0 ? 첫 : `<td${typeof r.v[i]==='number'?' class="num"':''}>${글(r.v[i])}</td>`).join('');
  for(const r of b.제){
    const p = b.트(r, b.pi), 하 = b.아래.get(p) || [], 열 = 열림.has(p), 체 = 켠.has(p);
    h += `<tr class="제품${체?' 켬':''}" data-p="${글(p)}">` + 칸들(r, `<td class="dpr-k 고름칸"><input type="checkbox" data-p="${글(p)}"${체?' checked':''}>${하.length ? `<button type="button" class="토글" data-p="${글(p)}" title="반제품 ${하.length}">${열?'▾':'▸'}</button>` : ''}${글(r.v[0])}</td>`) + '</tr>';
    for(const x of 하) h += `<tr class="하위" data-m="${글(p)}"${열?'':' hidden'}>` + 칸들(x, `<td class="dpr-k">${글(x.v[0])}</td>`) + '</tr>';
  }
  for(const x of b.남) h += '<tr class="하위">' + 칸들(x, `<td class="dpr-k">${글(x.v[0])}</td>`) + '</tr>';
  h += '</tbody></table>';
  const 속 = document.getElementById('속'), 옛 = 속.querySelector('.표통'), 자 = 옛 ? [옛.scrollLeft, 옛.scrollTop] : null;
  속.innerHTML = '<div class="표통">' + h + '</div>';
  const 통 = 속.querySelector('.표통'); if(자){ 통.scrollLeft = 자[0]; 통.scrollTop = 자[1]; }
}
document.addEventListener('click', e => {
  const t = e.target.closest('#속 .토글'); if(!t) return;
  const p = t.dataset.p, 열 = !열림.has(p); if(열) 열림.add(p); else 열림.delete(p);
  t.textContent = 열 ? '▾' : '▸';
  document.querySelectorAll('#속 tr.하위').forEach(tr => { if(tr.dataset.m === p) tr.hidden = !열; });
});
document.addEventListener('change', e => {
  const c = e.target.closest('#속 input[type=checkbox][data-p]'); if(!c) return;
  const b = 묶음(), 새 = new Set(고른 || 처음고른(b));
  if(c.checked) 새.add(c.dataset.p); else 새.delete(c.dataset.p);
  고른 = 새; c.closest('tr').classList.toggle('켬', c.checked);
  const 차례 = b.제.map(r => b.트(r, b.pi)).filter(p => 새.has(p));
  const { doc, setDoc } = window.fbRead;
  setDoc(doc(window.db, ...창고자리, '_고른제품'), { 제품:차례, 고친때:new Date().toISOString() })

});
