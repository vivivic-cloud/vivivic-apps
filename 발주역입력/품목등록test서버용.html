<!DOCTYPE html>
<!-- 발주역입력 / 품목등록test서버용 — 영림원품목등록 「품목등록업로드」 의 기본 자료(엑셀 「품목등록test서버용」 의 품목등록업로드 줄, 창고 발주역입력_영림원품목등록 그대로)를 제품마다 묶어 본다.
     사장님 11-25(그대로): 「품목등록업로드의 기본자료가되는 엑셀자료를 새페이지로 만들어 주세요 해주세요. 각제품 이하 반제품들은 제품의 하위 토글로 접혀있게 만들어 주세요 제품명 앞에 체크표시를 두어 체크시 해당 제품에대한 반제품 등의 정보가 품목등록업로드에 나타나게 해주세요. 품목등록업로드에 매칭시 불필요한 자료는 임의로 참고 하지 않습니다.」
     판 번호는 머리의 배지와 같다. 고칠 때 둘을 같이 올린다: v1.7.5
     v1.7.5(11-28): 사장님(11-28) 「로그인이 될 때까지 안 나오게 하면 되잖아」 → 「바꿔」 — 로그인 전 = 잠금·칩 없음(공개 결과 사본 안 씀) · 쓰기 안 함(쓰기지킴 로그인필요).
     v1.7.4(11-28): 사장님 「입력폼 등록대기 저장 안 한 건은 일반 상황이나 마찬가지잖아」 — 입력폼 문서 없는 제품 = 칩 없음(넘길·못 넘김 걷음).
     v1.7.3(11-28): 질문.js v6 받기(사장님 「질문 트리에 해당 영역에 대한 지시 요청을 제가 적을 수 있게 해 주세요」 — 페이지 위 「지시」 칸 · 머리 「· 지시 N」).
     v1.7.2(11-28): 칸넓이.js v4 받기(사장님 「모바일에서는 셀 넓이 조절이 안 되네요?」 → 「고치세요」 — 손가락 넓이 조절).
     v1.7.1(11-28): 상태 칩 = 체크한 제품만(체크 푼 제품의 옛 보내기 조각은 안 봄).
     v1.7.0(11-28): 사장님 「모든 부분에서 실제 완료 상황 좀 보게 만들어」 — 제품 줄 맨 앞 상태 칩(입력폼 품목 대기·진행중·완료·오류 · 넘길 · 못 넘김, 까닭 마우스) · 잠금·칩 = 로그인 기기는 입력폼 문서에서 바로 셈(../shared/폼결과.js), 없으면 공개 결과 사본.
     v1.6.7(11-28): 사장님 「질문 트리는 새 페이지로 열리게 하고, 실제로 트리 구조가 보여야지」 — 머리 「질문 트리」 = 새 탭 질문트리.html(질문.js v5) · 탭 단추 기억(자리주소.js v2).
     v1.6.6(11-28): 사장님 「나중에 확인할 질문 트리가 필요한데?」 — 머리 「질문 트리」(질문.js v4) = 입력폼 #질문트리.
     v1.6.5(11-28): 사장님 「이거 입력폼뿐만 아니라 발주역입력에서도 보여야지」 — 머리 줄 「답 없는 질문 N」(질문.js v3, 입력폼 로그인 기기) · 누르면 모든 대기 모음.
     v1.6.4(11-28): 사장님 「질문에 해당 부분 링크도 걸어 줄 수 있냐. 지금은 새로고침하면 메인 페이지로 돌아와서…」 — 질문 카드 = 그 자리 링크(질문.js v2).
     v1.6.3(11-28): 질문 — 이 페이지 질문 칸(공용 ../shared/질문.js, 입력폼 v369 · 입력폼 로그인 기기만).
     v1.6.2(11-27): 사장님 「영림원품목등록 등록대기 또는 입력중인데 공통반자재 풀기 단추가 눌리고 왜 이러냐」(분배 방: 잠긴 품번 값을 바꿀 수 있는 다른 단추도) — 입력폼 등록대기(결과 대기·진행중·완료, 영림원품목등록 v2.167 과 같은 근거: 보내기 조각 문서 결과) 제품 = 동일속성 단추 막음(회색 · 까닭 마우스) · 잠긴 제품이 든 묶음 = 그 묶음 제품 단추도 막음 · 목록에서 그 묶음 고르기 막음.
     v1.6.1(11-27): 중측판 공정흐름이 영림원품목등록 중측판 규칙(v2.140 — 같은 제품 측판R·측판L과 같은 규격 = 재단-엣지-우라홈-보링, 동일속성보다 먼저)으로 보이는 줄은 남기지 않음(남기면 손 값이 규칙을 덮음).
     v1.6.0(11-27): 사장님 「테스트서버용에서 동일품으로 묶인것 해제시 동일품 속성으로 입력된 기 입력이 삭제 되지 않게 해주세요.」 — 묶음을 풀거나(×) 다른 묶음으로 바꿀 때, 먼저 그 제품 반제품 줄에 지금 보이는 동일속성 받은 값(영림원품목등록 동일값과 같은 셈 — 같은 묶음 다른 제품 같은 부속명 짝 손 값, 여럿이면 가장 많은 값)을 그 품번 손 값으로 저장(발주역입력_영림원품목등록_입력, 손 값 있는 칸·조혼생산제품정보 값 있는 칸은 그대로 · 동일칸 8개만) → 그 뒤 묶음 풂. 저장 못 하면 묶음 안 풂.
     v1.5.2(11-27): 칸넓이.js v3 — 사장님 「아이 표 넓히고 줄이는 게 어디 듣도 보도 못한 방식이야. 그냥 잡은 쪽이 늘어나고 줄어들면 되지 뭐야. 이게 그냥 엑셀이랑 구글시트처럼 해. 특이하게 하려고 그러지 말고」 → 엑셀·구글시트처럼(잡은 경계선이 마우스를 따라감 · 그 열만 · 옆 열 그대로 · 끄는 동안 파란 세로선).
     v1.5.1(11-27): 사장님 「모든표 가로넓이 조절 가능하게 해. 이걸 꼭 그때그때 말해야만 해주냐?」 — 공용 칸넓이.js v2 를 모든 표에(머리 칸 오른쪽 끝 끌기 · 두 번 누르면 원래대로 · 이 기기 기억). 다른 것은 안 바꿈.
     v1.5.0(11-26): 사장님 「품목등록test서버용 제품 맨 앞 열에 연결된 업체별단품명 조립업체 나타나게 해줘」 — 맨 앞 열 「조립업체」 = 제품 품번(단품코드)·품명(단품명)이 든 업체별 단품명 업체(별명 그대로) · 없으면 빈칸 · 하위 줄 빈칸.
     v1.3.0(11-25): 사장님 「품목등록test서버용 에서 동일품으로 묶은 제품이 목록에서 모여있게 해주세요. 해제시 제자리로 돌아갑니다」 — 화면 차례만: 같은 동일속성 묶음 제품 = 그 묶음 첫 제품(엑셀 차례) 자리에 엑셀 차례대로 모임(하위 줄 함께) · 풀면 엑셀 자리 · 저장 값·체크 저장 차례 그대로.
     v1.2.0(11-25): 사장님 「품목등록test서버용 체크앞에 동일속성을 설정 할 수 있게 해주세요 - 동일속성이란 같은 시리즈의 제품으로 동일속성이 된 그룹의 제품들은 원장,엣지필름, 보드두께,엣지두께,엣지W,엣지D,공정흐름,합판코드,필름코드 등이 품목등록업로드에서 자동으로 입력됩니다.」 — 제품 줄 체크 앞 「동일속성」 단추(묶음 이름, 비면 ▾) · 누르면 칸 옆 10px 목록(있는 묶음 · 새 묶음 이름 · × 풀기) · 저장 창고 _동일속성 {묶음:{제품 품번: 묶음 이름}} merge · onSnapshot.
     v1.1.0(11-25): 사장님 「테스트서버용에 나타나는 제품명이 업체별단품명과 연결되어 일치성을 확인해 주어야 합니다. 단품명(품명),단품코드(품번)의 일치여부를 실시간 확인하여 해당 품명과 품번이 파랑헤 변하게 해주세요, 둘중 하나만 일치하면 일치하는 속성만 파랑게 변합니다」 — 제품 줄 품명 = 업체별 단품명 단품명과 같으면 · 품번 = 단품코드와 같으면 파랑(td.맞음, 조혼가구부속명 v1.2 와 같은 색) · 마우스 = 짝 업체·단품 · 업체별 단품명 onSnapshot.
     줄 = 창고 품목등록업로드 조각(읽기만) · 제품 줄 아래 「모품목(상위 품번)」 = 그 제품 품번인 줄(반제품)을 접어 둠(▸ 누르면 펼침, 이 화면만) ·
     체크 = 창고 발주역입력_영림원품목등록/_고른제품 {제품:[제품 품번…], 고친때} 통째 setDoc · onSnapshot(영림원품목등록이 같이 읽어 품목등록업로드·BOM·계산 탭을 이 제품들로 거름).
     문서가 없으면 처음 값 = 영림원품목등록 v2.16.0 한 제품(품명 「(KRW) 알렉스 1200 높은 수납장 올화이트」). -->

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, getDocs, collection, setDoc, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

        authDomain: "vivivic-4b7ef.firebaseapp.com",

        storageBucket: "vivivic-4b7ef.firebasestorage.app",

    });
    const auth = getAuth(app);
    window.db = getFirestore(app);
    window.fbRead = { doc, getDoc, getDocs, collection, setDoc, onSnapshot, deleteField };

const 보내기자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_영림원품목등록_보내기'], 잠김이름 = ['품목','재공품','BOM','품목별공정흐름','소요자재','워크센터'], 막힘상태 = new Set(['대기','진행중','완료']);
