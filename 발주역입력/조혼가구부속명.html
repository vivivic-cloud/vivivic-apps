/* v1.2.0 사장님 「조혼가구부속명의 모든 단품코드, 단품명이 업체별단품명의 그것과 일치하는지를 보여주는 표시 — 해당 단품코드와 단품명이 파랗게 변하게 해줘」

   칸 = 머리 「…벤더 단품코드」·「…단품명」 · 머리 없는 시트(킨포크) = 값 모양으로: 업체별 단품코드와 맞는 값이 가장 많은 칸 = 단품코드, 그 오른쪽 칸 = 단품명(맞는 값 0 이면 표시 안 함). */
/* v1.3.0 사장님 「조혼가구부속명 단품코드가 일치하다면 업체별단품명의 해당 단품명이 조혼가구부속명의 기작성된 단품명 아래에 나타나게 해주세요」 — 단품명 칸 둘째 줄(작은 회색) = 업체별 단품명 단품명(같아도 보임) · 보이는 글만 유한가구 → 진아산업(업체별단품.html 별명과 같은 규칙, 비교는 원래 글자). */
const 별명 = v => typeof v==='string' ? v.replace(/유한가구/g,'진아산업') : v;
const 업자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_업체별단품'];
let 업단품 = new Map(), 업값 = {}, 업끊기 = {};
function 업단품구독(){
  const { doc, onSnapshot } = window.fbRead;
  onSnapshot(doc(window.db, ...업자리, '_업체목록'), m => {
    const 들 = (m.exists() && m.data().업체들) || [];
    for(const u of Object.keys(업끊기)) if(!들.includes(u)){ 업끊기[u](); delete 업끊기[u]; delete 업값[u]; }
    for(const u of 들) if(!업끊기[u]) 업끊기[u] = onSnapshot(doc(window.db, ...업자리, 문서이름(u)), s => { 업값[u] = s.exists() ? s.data() : { 칸:[], 줄:[] }; 업셈(); }, () => {});
    업셈();
  }, () => {});
}
function 업셈(){
  const 새 = new Map();
  for(const [u, d] of Object.entries(업값)){ const 칸 = d.칸 || [], ci = 칸.indexOf('단품코드'), ni = 칸.indexOf('단품명'); if(ci < 0) continue;
    for(const r of d.줄 || []){ const c = String(r.v[ci] ?? '').trim(); if(c && !새.has(c)) 새.set(c, { 이름:ni >= 0 ? String(r.v[ni] ?? '').trim() : '', 업체:u }); } }
  업단품 = 새;
  if(받은[고른]){ const 통 = document.querySelector('#속 .표통'), 자 = 통 ? [통.scrollLeft, 통.scrollTop] : null; 그리기(받은[고른]); const 새통 = document.querySelector('#속 .표통'); if(새통 && 자){ 새통.scrollLeft = 자[0]; 새통.scrollTop = 자[1]; } }
}
function 단품칸찾기(d){
  const 칸 = d.칸 || [];
  if(!d.머리없음){ const ci = 칸.findIndex(k => String(k).split('\n').map(x => x.trim()).includes('벤더 단품코드')), ni = 칸.findIndex(k => String(k).split('\n').map(x => x.trim()).includes('단품명')); return [ci, ni]; }
  if(!업단품.size) return [-1, -1];
  let 최 = -1, 최수 = 0;
  칸.forEach((_, i) => { const n = (d.줄 || []).filter(r => 업단품.has(String(r.v[i] ?? '').trim())).length; if(n > 최수){ 최수 = n; 최 = i; } });
  return 최 < 0 ? [-1, -1] : [최, 최 + 1 < 칸.length ? 최 + 1 : -1];
}
function 그리기(d){
  const 칸 = d.칸 || [], 줄 = d.줄 || [], 속 = document.getElementById('속'), 덧 = document.getElementById('덧');
  덧.hidden = !(d.발주날짜 || d.업체); 덧.textContent = [d.발주날짜 ? '발주날짜 ' + d.발주날짜 : '', d.업체 ? '업체 ' + d.업체 : ''].filter(Boolean).join(' · ');
  if(!줄.length){ 속.innerHTML = '<div class="state"><div class="big">줄 없음</div></div>'; return; }
  const 없 = !!d.머리없음;
  let h = '<table class="dpr-t"><thead><tr>' + 칸.map((k,i) => `<th class="${[i===0?'dpr-k':'', 없?'머리없음':''].join(' ').trim()}"${없?' title="이 시트엔 머리 줄이 없음 — 엑셀 열 글자"':''}>${글(k)}</th>`).join('') + '</tr></thead><tbody>';
  const 품i = 칸.indexOf(없 ? 'J' : '품목'), 수i = 칸.indexOf(없 ? 'K' : '품목수량'), [ci, ni] = 단품칸찾기(d);
  for(const r of 줄){ const 코 = ci >= 0 ? String(r.v[ci] ?? '').trim() : '', 짝 = 코 && 업단품.get(코);
   h += '<tr>' + 칸.map((k,i) => { const v = r.v[i];
    if(i===ci && 코) return 짝 ? `<td class="맞음${i===0?' dpr-k':''}" title="${글('업체별 단품명 ' + 짝.업체 + ' 에 있음')}">${글(v)}</td>` : `<td${i===0?' class="dpr-k"':''} title="업체별 단품명에 없는 단품코드">${글(v)}</td>`;
    if(i===ni && 코 && (String(v ?? '').trim() || 짝)){ const 같 = 짝 && 짝.이름 === String(v ?? '').trim(); return `<td class="${[같?'맞음':'', i===0?'dpr-k':''].join(' ').trim()}" title="${글(같 ? '업체별 단품명 단품명과 같음' : 짝 ? '업체별 단품명 단품명: ' + 별명(짝.이름) : '업체별 단품명에 없는 단품코드')}">${글(v)}${짝 ? `<div class="업이름">${글(별명(짝.이름))}</div>` : ''}</td>`; }   /* v1.3.0 아래 줄 = 업체별 단품명 단품명 */
    if(i===품i && String(v ?? '').trim()) return 부통.품목칸(String(v).trim(), i===0 ? 'dpr-k' : '');
    if(i===수i && typeof v==='number' && 품i >= 0 && String(r.v[품i] ?? '').trim()) return 부통.수량칸(String(r.v[품i]).trim(), v, x => x.toLocaleString('ko-KR'));
    return `<td class="${[i===0?'dpr-k':'', typeof v==='number'?'num':''].join(' ').trim()}">${글(typeof v==='number' ? v.toLocaleString('ko-KR') : v)}</td>`; }).join('') + '</tr>'; }
  h += '</tbody></table>';
  속.innerHTML = '<div class="표통">' + h + '</div>';
  부통.닫기(); 속.querySelector('.표통').addEventListener('scroll', () => 부통.닫기());
}
</script>
