<!DOCTYPE html>
<!-- 발주역입력 / 재단 — 에이엠티 「재단 세부내역」(상세내역서 PDF, 월별)을 달마다 표로 본다.
     사장님 11-16: 「월별 재단내역이 목록으로 보이는 페이지를 만들어라.」
     판 번호는 머리의 배지와 같다. 고칠 때 둘을 같이 올린다: v1.8.0
     v1.0.0(11-16): 첫 판. 월 버튼 → 그 달 표 하나. 칸 이름·값은 PDF 글자 그대로, 합친 칸(원장수량·재단금액 묶음 등)은 rowspan 으로 그대로 살린다.
     v1.1.0(11-16): 표를 셀 모양으로 촘촘히 — 칸마다 선, 글씨 11.5px, 여백 2px 5px, 숫자 오른쪽 정렬, 칸 너비는 내용만큼. 기능·칸·값은 그대로.
     v1.2.0(11-16): 제품명 칸마다 작은 「단품 검색」 칸 — 사장님 11-16: 「제품명 칸에 벤더피아 단품명을 검색할 수 있게 검색창을 만들고, 벤더피아와 연동되게 해 줘.」
       단품 목록은 창고 `납품내역_단품목록`(납품내역 제품목록 「벤더피아 단품」 과 같은 것, 읽기만).
       고른 것은 창고 `발주역입력_단품연결`(문서 하나 = PDF 제품명 하나) — 같은 제품명이면 어느 달이든 같은 연결. 원본 `발주역입력_재단` 은 안 건드린다.
     v1.2.1(11-16): 검색 칸을 누를 때 표가 밀리면 후보 목록이 닫히던 것 — 닫지 않고 칸을 따라가게.
     v1.2.2(11-16): 머리 아래 쪽 이동(재단 세부내역 ↔ 보드매입현황.html) 만 더함. 기능·표는 그대로.
     v1.2.3(11-16): 사장님 「단품검색 창을 열면 해당 제품명의 앞 네 글자가 이미 검색되어 있게 해 줘.」 — 검색 칸을 열면 제품명 앞 네 글자(띄어쓰기 뺌, 「임시」)가 들어가고 전체 선택, 후보도 바로 뜬다.
     v1.3.0(11-16): 사장님 「…다른 달에만 있는 것들은 양식 제목만 있는 빈칸으로 남겨서라도 양식은 동일하게 나타나게 해 줘.」 — 9달 칸을 합친 한 양식(16칸)으로 모든 달을 같은 차례로.
       그 달에 없는 칸은 제목만, 칸은 빈칸. 5월 「출고예정일」 은 「출고예정일(입고처)」 칸에, 「출고일」 은 따로(「임시」). 창고 값·단품 검색은 그대로.
     v1.3.1(11-16): 사장님 「한 칸으로 합치기」 — 6~9월 「출고일」 도 같은 칸으로. 칸 제목 「출고예정일(입고처) / 출고일」(PDF 두 이름을 이음). 15칸.
     v1.4.0(11-16): 사장님 「재단 세부내역 각 열 가로 넓이를 조절 가능하게 해 주세요.」 — 칸 머리 오른쪽 경계를 끌어 칸마다 너비를 넓히고 좁힌다(마우스·손가락).
       고친 너비는 이 브라우저에 남는다(localStorage, 칸 이름마다 · 모든 달 같이). 경계를 두 번 누르면 그 칸만 처음 너비로. 칸·값·디자인은 그대로.
     v1.4.1(11-16): 안 고친 칸은 잰 너비를 올림으로 박는다 — 반올림이면 1px 모자라 글이 「…」 로 잘렸다(3월 종류 「PB-18T」).
     v1.5.0(11-16): 사장님 「벤더 단품 검색 시 해당 제품명 모두가 기본 검색되어 있게 해 주고, 드롭 목록이 검색 중인 제품명을 가리지 않도록 제품명 아래쪽으로 나타나게 해 주세요.」
       검색 칸을 열면 제품명 전체가 들어간다. 다 맞는 단품이 없으면 비슷한 순(조각이 많이 든 순, 「임시」). 후보 목록은 늘 검색 칸 아래(위로 뒤집지 않음).
     v1.6.0(11-16): 사장님 「벤더피아 아이디로 로그인하게 하고, 벤더피아연동의 단품관리 페이지에 따라서 연동되어 검색되도록 해 주세요.」
       단품 후보 = 벤더피아연동 확장(0.35.0~)의 단품관리 목록 그대로(확장 다리 `단품다리.js` ↔ 이 쪽 postMessage, 자료는 이 크롬 안에서만 — 창고에 안 씀).
       벤더피아에 로그인 안 돼 있으면 목록 대신 「벤더피아 로그인 필요」 + 「벤더피아 로그인 화면 열기」(로그인은 벤더피아 자기 화면에서).
       목록 맨 위 「단품 새로 받기」 = 확장이 벤더피아 단품관리에 다시 묻는다. 확장(새 판)이 없는 기기(폰 등)는 예전처럼 창고 사본을 「임시 목록」 으로.
     v1.6.1(11-16): 사장님 「왜 벤더피아연동 시키라니까 자꾸 뭘 다운받으라고 하냐.」 — **지금 깔린 확장 그대로** 연동(덮어쓰기 없음).
       창고 `납품내역_단품목록` = 벤더피아연동 단품관리 화면이 목록을 받을 때마다 저절로 올리는 사본(goods.js `단품목록올리기`, 깃 글이라 깔린 판에서 돈다).
       목록 위 「단품 새로 받기」 = 벤더피아연동 단품관리 화면을 새 탭으로 연다 → 거기서 F5 → 이 탭으로 돌아오면 창고를 다시 읽는다.
       「새 판 없음」·「임시 목록」 글은 걷음. 0.35.0 다리(`data-벤더피아단품`)가 있는 크롬이면 v1.6.0 길 그대로.
     v1.7.0(11-16): 사장님 「재단 세부내역 제품명 옆에 품목, 사이즈 순으로 표기되게 해 주세요.」 — 칸 차례만 바꿈(`한양식`).
     v1.7.1(11-17): 쪽 이동 탭 글자만 「보드/엣지 매입현황」(그 쪽 제목이 바뀜 — 주소 보드매입현황.html 그대로).
       재단일 · 제품명 · 품목 · 사이즈 · PO NO. · 종류 · … (나머지 차례 그대로). 묶음(rowspan)·너비 기억(칸 이름 기준)은 그대로 따라온다.
     v1.8.0(11-17): 단품별 부속(BOM)·공통부속 — 사장님과 하나하나 맞춘 사양 그대로.
       ⓪ 「재단수량」 칸을 「사이즈」 바로 옆으로. ① 제품명 칸 「단품 추가」(검색창 그대로, 기본 검색어 = 첫 단품명 · 없으면 제품명) — 목록에서 여러 개 골라 한 줄씩 쌓음, 줄마다 「×」(삭제하겠습니까? 확인).
       ② 단품명을 누르면 연결 상태 → 그 제품명 줄의 품목을 누르면 연결·이미 연결된 것은 해제. 품목 옆 동그라미 숫자 = 연결된 단품 수(2개부터). 연결 없는 품목은 첫 단품에 자동 연결.
       ③ 연결은 제품명 하나 문서(`발주역입력_단품연결`)에 품목+사이즈 열쇠로 — 같은 제품명이면 모든 달 같은 단품·같은 연결.
       ④ 품목 「분할」: 같은 줄 안에서 품목·재단수량만 위(품목명R)·아래(품목명L) 두 칸, 합 = 원래 재단수량, 「3」 = 1/3, 위 칸 「⋈」 = 합치기.
       저장: 바뀐 칸만 merge 로 씀(다른 창·기기 값 안 덮음), 창고는 onSnapshot 으로 받아 다른 곳에서 바꾼 것도 바로 보임.

     ⚠ 값은 창고(artifacts/vivivic-4b7ef/public/data/발주역입력_재단)에서 **읽기만** 한다.
        창고에 넣는 것은 tools/재단내역서읽기.py(드라이브 PDF → 창고). 공개 저장소라 업무 값은 이 파일에 없다.
     겉꼴은 납품내역/재단.html(서류관리 제품관리 표 꼴 .dpr-t, 흰 바탕, 월 버튼 .chip, 화면 높이 표 상자)을 그대로 따른다. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재단 — 발주역입력</title>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs, setDoc, deleteDoc, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
    const app = initializeApp({
        apiKey: "AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",
        authDomain: "vivivic-4b7ef.firebaseapp.com",
        projectId: "vivivic-4b7ef",
        storageBucket: "vivivic-4b7ef.firebasestorage.app",
        messagingSenderId: "830175660542",
        appId: "1:830175660542:web:9054030480c8280af8d8af"
    });
    const auth = getAuth(app);
    window.db = getFirestore(app);
    window.fbRead = { doc, getDoc, collection, getDocs, setDoc, deleteDoc, onSnapshot, deleteField };
    onAuthStateChanged(auth, (u) => {
        if (!u) { signInAnonymously(auth).catch(e => window.목록못읽음('창고에 들어가지 못했습니다', (e&&(e.code||e.message))||'')); return; }
        window.목록읽기();
    });
</script>

<style>
/* 납품내역/재단.html 과 같은 값 — 색 낱말은 서류관리 --vg-* 와 같다. 값을 새로 짓지 마라. */
:root{
  --vg-bg:#fff; --vg-ink:#111110; --vg-body:#1A1A19;
  --vg-muted:#9C9C98; --vg-edge:#E2E2DF; --vg-fill:#F4F4F2; --vg-red:#FF3B30;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--vg-bg);color:var(--vg-body);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding:16px 0 2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:13px;color:var(--vg-muted)}
.logo b{font-size:15px;font-weight:800;letter-spacing:3.2px;color:var(--vg-ink);margin-right:4px}
.badge{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--vg-ink);
  border:1px solid var(--vg-ink);border-radius:999px;padding:3px 9px}
/* 쪽 이동(재단 ↔ 보드매입현황, v1.2.2) — 보드매입현황.html 과 같다 */
.쪽길{display:flex;gap:16px;padding:8px 0 0;border-bottom:1px solid var(--vg-edge)}
.쪽길 a{font-size:13px;font-weight:600;color:var(--vg-muted);text-decoration:none;padding:4px 0 7px;margin-bottom:-1px;border-bottom:2px solid transparent}
.쪽길 a:hover{color:var(--vg-ink)}
.쪽길 a.on{color:var(--vg-ink);font-weight:800;border-bottom-color:var(--vg-ink)}
.쪽길+h1{padding-top:14px}
h1{font-size:30px;line-height:1.1;letter-spacing:-1.2px;font-weight:700;color:var(--vg-ink);padding:4px 0 12px}
.months{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;font-family:inherit;font-size:12px;font-weight:600;line-height:1.45;padding:5px 12px;background:#fff;
  border:1px solid var(--vg-edge);color:var(--vg-body);cursor:pointer;font-variant-numeric:tabular-nums;transition:all .12s;position:relative}
.chip::after{content:"";position:absolute;inset:-8px -3px}   /* 누르는 자리 44px */
.chip:hover{background:var(--vg-fill)}
.chip.on{background:var(--vg-ink);border-color:var(--vg-ink);color:#fff}
/* 쪽은 화면 높이 — 화면 전체 막대 없이 표 상자 안에서만 위아래·옆으로 민다(가로 막대가 늘 보는 화면 아래). */
html,body{height:100%;overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none}
.wrap::-webkit-scrollbar{display:none}
.wrap>*{flex-shrink:0}
.wrap>#속{flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-top:12px}
#속>.표통{flex:1 1 auto;min-height:0}
@media (max-width:600px),(max-height:600px){.wrap>#속{flex:1 0 auto} #속>.표통{flex:1 0 240px}}
.표통{overflow:auto;-webkit-overflow-scrolling:touch;background:var(--vg-bg)}
/* 맥 Chrome 오버레이 막대는 평소 숨는다 → ::-webkit-scrollbar 로 늘 보이게(영림원외주입력 v276 과 같은 까닭).
   scrollbar-width·scrollbar-color 를 여기 넣으면 Chrome 이 아래를 무시한다 — 파이어폭스에만 준다. */
@supports not selector(::-webkit-scrollbar){.표통{scrollbar-width:thin;scrollbar-color:#C7C7C3 var(--vg-fill)}}
.표통::-webkit-scrollbar{width:10px;height:10px}
.표통::-webkit-scrollbar-track,.표통::-webkit-scrollbar-corner{background:var(--vg-fill)}
.표통::-webkit-scrollbar-thumb{background:#C7C7C3;border-radius:10px}
/* 표 — 서류관리 제품관리(.dpr-t) 꼴을 엑셀처럼 셀 모양으로 촘촘히(v1.1.0, 사장님 11-16 「셀 모양으로, 글씨는 작아도 오밀조밀하게」).
   칸마다 선(오른쪽·아래, 표 바깥 위·왼쪽), 글씨 11.5px · 여백 2px 5px. separate 로 그어야 붙박이 첫 칸이 밀릴 때도 선이 따라온다. */
.dpr-t{width:max-content;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;
  border-top:1px solid #C7C7C3;border-left:1px solid #C7C7C3}
.dpr-t th,.dpr-t td{border-right:1px solid #D6D6D3;border-bottom:1px solid #D6D6D3;white-space:nowrap}
.dpr-t th{font-size:11.5px;font-weight:800;line-height:1.3;color:var(--vg-ink);text-align:center;vertical-align:middle;
  padding:4px 5px;background:var(--vg-fill);border-bottom:1px solid #C7C7C3}
.dpr-t td{font-size:11.5px;line-height:1.3;color:var(--vg-body);padding:2px 5px;vertical-align:top;background:var(--vg-bg)}
.dpr-t td.num{text-align:right}
.dpr-t .dpr-k{position:sticky;left:0;z-index:1;font-weight:700;color:var(--vg-ink)}
.dpr-t th.dpr-k{background:var(--vg-fill)}
/* 칸 너비 조절(v1.4.0) — 칸 머리 오른쪽 경계 손잡이(.칸끈)를 끈다. 한 칸이라도 고치면 표를 고정 너비(colgroup)로 바꾸고,
   좁혀 넘치는 글은 칸 안에서 잘린다(…). 손잡이는 평소 안 보이고, 마우스를 올리거나 끌 때만 경계에 선이 진해진다. */
.dpr-t th{position:relative}
.dpr-t th.dpr-k{position:sticky}
.칸끈{position:absolute;top:0;right:0;bottom:0;width:8px;cursor:col-resize;touch-action:none;z-index:2}
.칸끈:hover,.칸끈.끄는중{background:linear-gradient(to right,transparent 6px,#9C9C98 6px)}
@media (pointer:coarse){.칸끈{width:16px}.칸끈:hover,.칸끈.끄는중{background:linear-gradient(to right,transparent 14px,#9C9C98 14px)}}
.dpr-t.고정{table-layout:fixed}
.dpr-t.고정 th,.dpr-t.고정 td{overflow:hidden;text-overflow:ellipsis}
.dpr-t.고정 .vk input,.dpr-t.고정 .vk button{min-width:0}
body.칸끄는중{cursor:col-resize;user-select:none;-webkit-user-select:none}
/* 제품명 칸 단품 검색(v1.2.0) — 칸 안에 맞게 작게(표 글씨와 같은 11.5px). 고른 것은 단품명 + 작은 코드 */
.dpr-t td.pc .vk{margin:2px 0 1px}
.vk input,.vk button{display:block;width:100%;min-width:150px;height:20px;padding:1px 5px;font:inherit;font-size:11.5px;line-height:16px;
  color:var(--vg-body);border:1px solid var(--vg-edge);border-radius:4px;background:var(--vg-fill);outline:none;text-align:left;-webkit-appearance:none}
.vk input:focus{border-color:var(--vg-ink);background:var(--vg-bg)}
.vk input::placeholder{color:var(--vg-muted)}
.vk button{background:var(--vg-bg);border-color:#C7C7C3;font-weight:700;color:var(--vg-ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.vk .cd,.vpd .cd{font-size:10.5px;font-weight:500;color:var(--vg-muted);margin-left:5px}
/* 후보 목록 — 화면에 붙어 서서(fixed) 표 상자 밖으로 잘리지 않는다 */
.vpd{position:fixed;z-index:50;background:var(--vg-bg);border:1px solid var(--vg-edge);border-radius:6px;
  box-shadow:0 6px 20px rgba(0,0,0,.14);overflow-y:auto;-webkit-overflow-scrolling:touch}
.vpd div{padding:4px 8px;font-size:11.5px;line-height:1.3;border-bottom:1px solid #EDEDEA;cursor:pointer;white-space:nowrap}
.vpd div:hover,.vpd div.on{background:var(--vg-fill)}
.vpd div.del{color:var(--vg-red)}
.vpd div.msg{color:var(--vg-muted);cursor:default}
.vpd div.msg.bad{color:var(--vg-red)}
/* v1.6.0 목록 위 작은 단추 줄(단품 새로 받기 · 벤더피아 로그인 화면 열기) */
.vpd div.act{font-weight:700;color:var(--vg-ink);background:var(--vg-fill)}
.vpd div.act:hover{background:#EDEDEA}
/* v1.8.0 제품명 칸 — 고른 단품 한 줄씩(단품명 단추 + 떨어진 「×」) · 맨 아래 「단품 추가」. 단품명 단추 = 연결 상태(검정) */
.vk .dp{display:flex;align-items:center;gap:8px;margin-top:2px}
.vk .dp .dn{flex:1 1 auto;width:auto}
.vk .dp .dx{flex:0 0 20px;width:20px;min-width:0;padding:0;text-align:center;color:var(--vg-muted);border-color:var(--vg-edge)}
.vk .dp .dx:hover{color:var(--vg-red);border-color:var(--vg-red)}
.vk .dn.on{background:var(--vg-ink);border-color:var(--vg-ink);color:#fff}
.vk .dn.on .cd{color:#C7C7C3}
.vk .더{margin-top:2px}
.vk .추가{font-weight:600;color:var(--vg-muted);background:var(--vg-fill);border-color:var(--vg-edge)}
.vpd div.got{color:var(--vg-muted)}
/* v1.8.0 품목 칸 — 공통 숫자(②…) · 작은 「분할」. 연결 상태면 그 제품명 품목을 누를 수 있고(고름), 그 단품에 이어진 품목은 검정 테(이음) */
.dpr-t td .ox{margin-left:3px;font-weight:800;color:var(--vg-ink)}
.dpr-t td .작{font:inherit;font-size:10.5px;line-height:14px;height:16px;padding:0 4px;margin-left:6px;border:1px solid var(--vg-edge);border-radius:4px;
  background:var(--vg-bg);color:var(--vg-muted);cursor:pointer;vertical-align:middle;-webkit-appearance:none}
.dpr-t td .작:hover{color:var(--vg-ink);border-color:#C7C7C3}
.dpr-t td.qy .작{margin:0}
.dpr-t td.pm.고름{cursor:pointer}
.dpr-t td.pm.고름:hover{background:var(--vg-fill)}
.dpr-t td.pm.이음{box-shadow:inset 0 0 0 2px var(--vg-ink)}
/* 나뉜 품목·재단수량 — 같은 줄 안 위·아래 두 칸(가운데 칸 선) */
.dpr-t td .반{display:flex;align-items:center;min-height:20px;margin:0 -5px;padding:1px 5px}
.dpr-t td .반.위{border-bottom:1px solid #D6D6D3}
.dpr-t td.qy .반{justify-content:flex-end;gap:4px}
.dpr-t td.qy input.수{width:46px;height:17px;font:inherit;font-size:11.5px;text-align:right;padding:0 3px;color:var(--vg-body);
  border:1px solid var(--vg-edge);border-radius:3px;background:var(--vg-bg);outline:none}
.dpr-t td.qy input.수:focus{border-color:var(--vg-ink)}
.띠{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--vg-red);color:#fff;font-size:12.5px;font-weight:600;padding:6px 16px;text-align:center}
/* 폰은 16px 아래 글씨 칸을 누르면 화면이 커진다 — 검색 칸·수량 칸만 16px */
@media (max-width:600px){.vk input{font-size:16px;height:26px} .dpr-t td.qy input.수{font-size:16px;height:24px;width:56px}}
.state{background:var(--vg-fill);border-radius:14px;padding:22px 16px;text-align:center;margin-top:12px}
.state .big{font-size:14px;font-weight:600;color:var(--vg-ink);padding-bottom:6px}
.state .sub{font-size:12.5px;color:var(--vg-muted);line-height:1.85}
.state .why{font-size:11.5px;color:var(--vg-red);padding-top:6px;font-family:ui-monospace,monospace}
</style>

<body>
<div class="띠" id="띠" hidden></div>
<div class="wrap">
<header>
  <div class="logo"><b>VIVIVIC</b> — 발주역입력</div>
  <div class="badge">v1.8.0</div>
</header>
<nav class="쪽길"><a href="재단.html" class="on">재단 세부내역</a><a href="보드매입현황.html">보드/엣지 매입현황</a></nav>
<h1>재단 세부내역</h1>
<div class="months" id="고름"></div>
<div class="state" id="목상태"><div class="big">창고를 읽는 중입니다…</div></div>
<div id="속"></div>
</div>

<!-- 짚어서 지시하는 손잡이 — 바이글 박스에서 열면 켜진다. -->
<script src="../shared/viggle.js"></script>

<script>
const 창고자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_재단'];
const 숫자칸 = new Set(['재단수량','원장수량','재단금액']);
/* 합친 칸 — 같은 칸(g)에 든 줄은 한 칸으로 묶어 그린다(rowspan). 재단일은 쪽이 넘어가도 같은 날이면 잇는다. */
let 달들 = [], 받은 = {}, 고른 = '', 답했나 = false;

const 글 = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function 목상태(큰,작,까닭){
  const el=document.getElementById('목상태'); el.style.display='block';
  el.innerHTML = `<div class="big">${큰}</div>` + (작?`<div class="sub">${작}</div>`:'') + (까닭?`<div class="why">${까닭}</div>`:'');
}
window.목록못읽음 = (큰,까닭) => { 답했나=true; 목상태(큰,'관리자에게 알려 주십시오.',까닭||''); };
setTimeout(() => { if(!답했나) 목상태('창고에 닿지 못했습니다','인터넷이 끊겼거나 창고가 막혀 있습니다. 새로고침해 보십시오.'); }, 20000);

const 달글 = 달 => (+String(달).slice(5,7)) + '월';

window.목록읽기 = async function(){
  try{
    const { doc, getDoc } = window.fbRead;
    const [목] = await Promise.all([getDoc(doc(window.db, ...창고자리, '_달목록')), 연결듣기().catch(()=>{})]);   /* 연결을 못 읽어도 표는 선다 */
    답했나 = true;
    달들 = (목.exists() && 목.data().달들) || [];
    if(!달들.length){ 목상태('창고에 재단 세부내역이 없습니다'); return; }
    document.getElementById('목상태').style.display='none';
    document.getElementById('고름').innerHTML = 달들.map(d => `<button class="chip" data-m="${d}">${달글(d)}</button>`).join('');
    document.querySelectorAll('#고름 .chip').forEach(b => b.onclick = () => 달고름(b.dataset.m));
    달고름(달들[달들.length-1]);
  }catch(e){ window.목록못읽음('창고를 읽지 못했습니다', (e&&(e.code||e.message))||''); }
};

async function 달고름(m){
  고른 = m;
  document.querySelectorAll('#고름 .chip').forEach(b => b.classList.toggle('on', b.dataset.m===m));
  const 속 = document.getElementById('속');
  if(!받은[m]){
    속.innerHTML = '<div class="state"><div class="big">읽는 중입니다…</div></div>';
    try{
      const { doc, getDoc } = window.fbRead;
      const s = await getDoc(doc(window.db, ...창고자리, m));
      받은[m] = s.exists() ? s.data() : { 칸:[], 줄:[] };
    }catch(e){ 속.innerHTML = `<div class="state"><div class="big">창고를 읽지 못했습니다</div><div class="why">${글((e&&(e.code||e.message))||'')}</div></div>`; return; }
  }
  if(고른 !== m) return;
  그리기(받은[m]);
}

/* 한 양식(v1.3.0) — 사장님 11-16: 「재단 세부내역 양식이 월별로 조금씩 다른 것 같은데, 다른 달에만 있는 것들은 양식 제목만 있는 빈칸으로 남겨서라도 양식은 동일하게 나타나게 해 줘.」
   9달 PDF 칸을 모두 합친 차례. 그 달 PDF 에 없는 칸은 제목만 두고 칸은 빈칸. 창고 값은 그대로(보이는 차례만 맞춤).
   5월 「출고예정일」 = 1~4월 「출고예정일(입고처)」 같은 칸(입고처 괄호만 빠짐). 6~9월 「출고일」 도 같은 칸(v1.3.1, 사장님 「한 칸으로 합치기」). 칸 제목은 두 이름을 이어 「출고예정일(입고처) / 출고일」.
   여기 없는 칸이 창고에 새로 오면 끝에 붙여 보인다(빠뜨리지 않게). */
const 한양식 = ['재단일','제품명','품목','사이즈','재단수량','PO NO.','종류','색상','모델명','출고처','원장입고일','원장수량','재단금액','출고예정일(입고처) / 출고일','비고'];   /* v1.8.0 재단수량을 사이즈 옆으로 */
const 같은칸 = { '출고예정일(입고처)':'출고예정일(입고처) / 출고일', '출고예정일':'출고예정일(입고처) / 출고일', '출고일':'출고예정일(입고처) / 출고일' };

function 그리기(d){
  const 원칸 = d.칸 || [], 줄 = d.줄 || [];
  const 속 = document.getElementById('속');
  if(!줄.length){ 속.innerHTML = '<div class="state"><div class="big">줄 없음</div></div>'; return; }
  const 칸 = [...한양식, ...원칸.filter(x => !한양식.includes(같은칸[x]||x))];
  const 자리 = 칸.map(k => 원칸.findIndex(x => (같은칸[x]||x)===k));   /* -1 = 이 달 PDF 에 없는 칸 */
  const 값 = (r,i) => 자리[i] < 0 ? '' : r.v[자리[i]];
  const di = 칸.indexOf('재단일'), pi = 칸.indexOf('제품명'), mi = 칸.indexOf('품목'), si = 칸.indexOf('사이즈'), qi = 칸.indexOf('재단수량');
  /* 칸마다 묶음 열쇠: 재단일은 값(이어진 같은 날), 나머지는 PDF 의 합친 칸 번호 g. 없는 칸은 줄마다 따로(빈칸) */
  const 열쇠 = (r,i,n) => 자리[i] < 0 ? 'x:'+n : i===di ? 'd:'+값(r,i) : 'g:'+r.g[자리[i]];
  const 남은 = 칸.map(()=>0);
  /* v1.8.0 줄마다 제품명·품목·사이즈·재단수량(합친 칸이면 그 칸 값) — 품목 연결·분할 열쇠 */
  const 이은값 = i => { const a = []; for(let n=0;n<줄.length;n++) a[n] = (n>0 && 열쇠(줄[n],i,n)===열쇠(줄[n-1],i,n-1)) ? a[n-1] : String(값(줄[n],i)??'').trim(); return a; };
  const 줄P = 이은값(pi), 줄M = 이은값(mi), 줄S = 이은값(si), 줄Q = 이은값(qi);
  let h = '<table class="dpr-t"><thead><tr>' +
    칸.map((k,i) => `<th class="${i===0?'dpr-k':''}${숫자칸.has(k)?' num':''}" data-k="${글(k)}">${글(k)}<span class="칸끈"></span></th>`).join('') + '</tr></thead><tbody>';
  for(let n=0; n<줄.length; n++){
    const r = 줄[n];
    h += '<tr>';
    for(let i=0;i<칸.length;i++){
      if(남은[i] > 0){ 남은[i]--; continue; }
      let span = 1; const k = 열쇠(r,i,n);
      while(n+span < 줄.length && 열쇠(줄[n+span],i,n+span)===k) span++;
      남은[i] = span-1;
      const 이름 = i===pi ? String(값(r,i)??'').trim() : '';
      /* v1.8.0 품목(연결·분할) · 재단수량(분할) 칸 — 제품명이 있는 줄만 */
      const 품 = (i===mi || i===qi) && 줄P[n] && 줄M[n] ? ` data-p="${글(줄P[n])}" data-m="${글(줄M[n])}" data-k="${글(줄M[n]+'\t'+줄S[n])}"` + (i===qi?` data-q="${글(줄Q[n])}"`:'') : '';
      const cls = (i===0?'dpr-k':'') + (숫자칸.has(칸[i])?' num':'') + (이름?' pc':'') + (품?(i===mi?' pm':' qy'):'');
      const 속글 = !품 ? 글(값(r,i)) : i===mi ? 품목속(줄P[n], 줄M[n], 줄M[n]+'\t'+줄S[n]) : 수량속(줄P[n], 줄M[n]+'\t'+줄S[n], 줄Q[n]);
      h += `<td${cls.trim()?` class="${cls.trim()}"`:''}${span>1?` rowspan="${span}"`:''}${품}>${속글}${이름?단품칸(이름):''}</td>`;
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  속.innerHTML = '<div class="표통">' + h + '</div>';
  속.querySelector('.표통').addEventListener('scroll', () => { if(후보 && 후보칸) 후보자리(후보칸); });   /* 표를 밀면 후보 목록이 칸을 따라간다 */
  너비맞추기(속.querySelector('.dpr-t'));
  if(활성 && !단품있나(활성.p, 활성.코드)) 활성 = null;
  활성칠();
}

/* ════ 칸 너비 조절 (v1.4.0) ════
   사장님 11-16: 「재단 세부내역 각 열 가로 넓이를 조절 가능하게 해 주세요.」
   칸 머리 오른쪽 경계(.칸끈)를 끌면 그 칸 너비가 바뀐다. 고친 너비 = 이 브라우저 localStorage `발주역입력_재단_칸너비` {칸 이름: px}
   (화면 기억용 — 창고에 안 넣음, 모든 달 같은 칸 이름이면 같은 너비). 경계를 두 번 누르면(더블클릭·두 번 톡) 그 칸만 처음 너비(내용만큼)로.
   고친 칸이 없으면 표는 예전 그대로(내용만큼). 있으면 칸마다 지금 너비를 재어 colgroup 에 박고 고친 칸만 바꾼다. */
const 너비열쇠 = '발주역입력_재단_칸너비';
let 칸너비 = {};
try{ 칸너비 = JSON.parse(localStorage.getItem(너비열쇠) || '{}') || {}; }catch(e){ 칸너비 = {}; }
function 너비저장(){ try{ localStorage.setItem(너비열쇠, JSON.stringify(칸너비)); }catch(e){} }
function 너비맞추기(t){
  if(!t) return;
  t.querySelector('colgroup')?.remove(); t.classList.remove('고정'); t.style.width = '';
  const ths = [...t.querySelectorAll('thead th')];
  if(!ths.some(th => 칸너비[th.dataset.k])) return;
  const 잰 = ths.map(th => th.getBoundingClientRect().width);   /* 내용만큼 너비(고치기 전) */
  const cg = document.createElement('colgroup');
  let 합 = 0;
  ths.forEach((th,i) => { const w = 칸너비[th.dataset.k] ? Math.round(칸너비[th.dataset.k]) : Math.ceil(잰[i]);   /* 안 고친 칸은 올림 — 반올림으로 1px 모자라면 글이 잘린다 */ 합 += w; const c = document.createElement('col'); c.style.width = w+'px'; cg.appendChild(c); });
  t.prepend(cg); t.style.width = 합+'px'; t.classList.add('고정');
}
let 톡때 = 0, 톡칸 = null;
document.addEventListener('pointerdown', e => {
  const 끈 = e.target.closest('.칸끈'); if(!끈 || e.button > 0) return;
  e.preventDefault();
  if(document.activeElement && document.activeElement.matches('.vk input')) document.activeElement.blur();
  const th = 끈.parentElement, t = th.closest('.dpr-t'), k = th.dataset.k, i = [...th.parentElement.children].indexOf(th), x0 = e.clientX;
  let col = null, 처음 = 0, 표처음 = 0;
  끈.setPointerCapture(e.pointerId); 끈.classList.add('끄는중'); document.body.classList.add('칸끄는중');
  const 움 = ev => {
    const dx = ev.clientX - x0;
    if(!col){
      if(Math.abs(dx) <= 3) return;   /* 3px 넘게 끌어야 시작 — 그냥 누름은 너비를 안 바꾼다 */
      if(!t.classList.contains('고정')){ 칸너비[k] = Math.ceil(th.getBoundingClientRect().width); 너비맞추기(t); }
      col = t.querySelector('colgroup').children[i]; 처음 = parseFloat(col.style.width); 표처음 = parseFloat(t.style.width);
    }
    const w = Math.max(24, Math.round(처음 + dx));
    col.style.width = w+'px'; t.style.width = (표처음 - 처음 + w)+'px'; 칸너비[k] = w;
  };
  const 끝 = () => {
    끈.removeEventListener('pointermove', 움); 끈.removeEventListener('pointerup', 끝); 끈.removeEventListener('pointercancel', 끝);
    끈.classList.remove('끄는중'); document.body.classList.remove('칸끄는중');
    if(col){ 너비저장(); 톡때 = 0; return; }
    /* 안 끌고 두 번 누름 = 그 칸만 처음 너비로 */
    const 지금 = Date.now();
    if(톡칸 === k && 지금 - 톡때 < 400){ if(k in 칸너비){ delete 칸너비[k]; 너비저장(); 너비맞추기(t); } 톡때 = 0; }
    else { 톡칸 = k; 톡때 = 지금; }
  };
  끈.addEventListener('pointermove', 움); 끈.addEventListener('pointerup', 끝); 끈.addEventListener('pointercancel', 끝);
