<h1>재단 세부내역</h1>

<!-- 짚어서 지시하는 손잡이 — 바이글 박스에서 열면 켜진다. -->

<script src="단품찾기.js?v=1"></script>   <!-- v1.10.8 누계 단품 찾기 -->   <!-- v1.10.0 메모 열 공용(재단·이룸산업·로앤) -->

<script>
const 창고자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_재단'];
const 숫자칸 = new Set(['재단수량','원장수량','재단금액']);
/* 합친 칸 — 같은 칸(g)에 든 줄은 한 칸으로 묶어 그린다(rowspan). 재단일은 쪽이 넘어가도 같은 날이면 잇는다. */
let 달들 = [], 받은 = {}, 고른 = '', 답했나 = false;

const 글 = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function 목상태(큰,작,까닭){
  const el=document.getElementById('목상태'); el.style.display='block';
  el.innerHTML = `<div class="big">${큰}</div>` + (작?`<div class="sub">${작}</div>`:'') + (까닭?`<div class="why">${까닭}</div>`:'');
}
window.목록못읽음 = (큰,까닭) => { 답했나=true; 목상태(큰,'관리자에게 알려 주십시오.',까닭||''); };
setTimeout(() => { if(!답했나) 목상태('창고에 닿지 못했습니다','인터넷이 끊겼거나 창고가 막혀 있습니다. 새로고침해 보십시오.'); }, 20000);

const 달글 = 달 => (+String(달).slice(5,7)) + '월';

window.목록읽기 = async function(){
  try{
    const { doc, getDoc } = window.fbRead;
    const [목] = await Promise.all([getDoc(doc(window.db, ...창고자리, '_달목록')), 연결듣기().catch(()=>{})]);   /* 연결을 못 읽어도 표는 선다 */
    답했나 = true;
    달들 = (목.exists() && 목.data().달들) || [];
    if(!달들.length){ 목상태('창고에 재단 세부내역이 없습니다'); return; }
    document.getElementById('목상태').style.display='none';
    document.getElementById('고름').innerHTML = 달들.map(d => `<button class="chip" data-m="${d}">${달글(d)}</button>`).join('') + '<button class="chip" data-m="누계">누계</button>';
    document.querySelectorAll('#고름 .chip').forEach(b => b.onclick = () => 달고름(b.dataset.m));
    업체단품.듣기(window.db, window.fbRead, () => { if(후보칸) 후보그리기(후보칸); });   /* v1.10.0 */
    부통.시작(window.db, window.fbRead); 메모.시작(window.db, window.fbRead);   /* v1.10.0 */
    달고름(decodeURIComponent(location.hash.slice(1)) === '누계' ? '누계' : 달들[달들.length-1]);
  }catch(e){ window.목록못읽음('창고를 읽지 못했습니다', (e&&(e.code||e.message))||''); }
};

async function 달고름(m){
  고른 = m;
  document.querySelectorAll('#고름 .chip').forEach(b => b.classList.toggle('on', b.dataset.m===m));
  try{ history.replaceState(null, '', m === '누계' ? '#누계' : location.pathname + location.search); }catch(e){}
  if(m === '누계'){ 누계고름(); return; }
  const 속 = document.getElementById('속');
  if(!받은[m]){
    속.innerHTML = '<div class="state"><div class="big">읽는 중입니다…</div></div>';
    try{
      const { doc, getDoc } = window.fbRead;
      const s = await getDoc(doc(window.db, ...창고자리, m));
      받은[m] = s.exists() ? s.data() : { 칸:[], 줄:[] };
    }catch(e){ 속.innerHTML = `<div class="state"><div class="big">창고를 읽지 못했습니다</div><div class="why">${글((e&&(e.code||e.message))||'')}</div></div>`; return; }
  }
  if(고른 !== m) return;
  그리기(받은[m]);
}

/* 한 양식(v1.3.0) — 사장님 11-16: 「재단 세부내역 양식이 월별로 조금씩 다른 것 같은데, 다른 달에만 있는 것들은 양식 제목만 있는 빈칸으로 남겨서라도 양식은 동일하게 나타나게 해 줘.」
   9달 PDF 칸을 모두 합친 차례. 그 달 PDF 에 없는 칸은 제목만 두고 칸은 빈칸. 창고 값은 그대로(보이는 차례만 맞춤).
   5월 「출고예정일」 = 1~4월 「출고예정일(입고처)」 같은 칸(입고처 괄호만 빠짐). 6~9월 「출고일」 도 같은 칸(v1.3.1, 사장님 「한 칸으로 합치기」). 칸 제목은 두 이름을 이어 「출고예정일(입고처) / 출고일」.
   여기 없는 칸이 창고에 새로 오면 끝에 붙여 보인다(빠뜨리지 않게). */
const 한양식 = ['재단일','제품명','제품명 메모','품목','품목 메모','사이즈','재단수량','PO NO.','종류','색상','모델명','출고처','원장입고일','원장수량','재단금액','출고예정일(입고처) / 출고일','비고'];   /* v1.8.0 재단수량을 사이즈 옆으로 */
const 같은칸 = { '출고예정일(입고처)':'출고예정일(입고처) / 출고일', '출고예정일':'출고예정일(입고처) / 출고일', '출고일':'출고예정일(입고처) / 출고일' };

/* v1.10.0 메모 열(화면 머리 「메모」) — 칸 너비·묶음(rowspan)은 옆 칸(제품명·품목)을 따름 */
const 메모열 = { '제품명 메모':['제품','제품명'], '품목 메모':['품목','품목'] };
/* v1.10.0 입고처(업체별 단품명 거래처 단서) = 5~9월 PO NO. 의 첫 숫자 넷 앞 글자(아인2605… → 아인) · 없으면 1~4월 출고예정일(입고처) 괄호 안(1/28 (바른) → 바른) */
/* v1.10.6 재단 입고처 짝 더함(이 쪽만) — 사장님 「조혼이 조혼가구 입니다」 · 「조흔」 = 오타로 같은 짝 */
const 재단짝 = { '조혼':'조혼가구', '조흔':'조혼가구' };
const 업맞춤 = u => 업체단품.맞춤(재단짝[u] || u);
const 입고처 = (po, 출) => { const a = String(po ?? '').match(/([가-힣A-Za-z]+)\d{4}/); if(a) return a[1]; const b = String(출 ?? '').match(/\(([^)]+)\)/); return b && b[1].trim() !== '입고처' ? b[1].trim() : ''; };   /* PDF 머리 글 「(입고처)」 는 뺌 */
/* 한 달 문서 → 칸·자리·묶음 열쇠·이은 값(합친 칸이면 그 칸 값) — 그리기·누계 같이 씀 */
function 달틀(d){
  const 원칸 = d.칸 || [], 줄 = d.줄 || [];
  const 칸 = [...한양식, ...원칸.filter(x => !한양식.includes(같은칸[x]||x))];
  const 자리 = 칸.map(k => 원칸.findIndex(x => (같은칸[x]||x)===k));   /* -1 = 이 달 PDF 에 없는 칸 */
  const 값 = (r,i) => 자리[i] < 0 ? '' : r.v[자리[i]];
  const di = 칸.indexOf('재단일');
  /* 칸마다 묶음 열쇠: 재단일은 값(이어진 같은 날), 나머지는 PDF 의 합친 칸 번호 g. 없는 칸은 줄마다 따로(빈칸) · 메모 열 = 옆 칸 열쇠 */
  const 열쇠 = (r,i,n) => 메모열[칸[i]] ? 열쇠(r, 칸.indexOf(메모열[칸[i]][1]), n) : 자리[i] < 0 ? 'x:'+n : i===di ? 'd:'+값(r,i) : 'g:'+r.g[자리[i]];
  const 이은값 = i => { const a = []; if(i < 0) return 줄.map(() => ''); for(let n=0;n<줄.length;n++) a[n] = (n>0 && 열쇠(줄[n],i,n)===열쇠(줄[n-1],i,n-1)) ? a[n-1] : String(값(줄[n],i)??'').trim(); return a; };
  const 첫 = i => 줄.map((r,n) => !(n>0 && 열쇠(줄[n],i,n)===열쇠(줄[n-1],i,n-1)));
  const I = k => 칸.indexOf(k);
  const 줄업 = (() => { const po = 이은값(I('PO NO.')), 출 = 이은값(I('출고예정일(입고처) / 출고일')); return 줄.map((r,n) => 입고처(po[n], 출[n])); })();
  return { 원칸, 줄, 칸, 자리, 값, 열쇠, 이은값, 첫, I, 줄업 };
}
function 그리기(d){
  const 속 = document.getElementById('속');
  if(!(d.줄 || []).length){ 속.innerHTML = '<div class="state"><div class="big">줄 없음</div></div>'; return; }
  const { 줄, 칸, 값, 열쇠, 이은값, I, 줄업 } = 달틀(d);
  const pi = I('제품명'), mi = I('품목'), si = I('사이즈'), qi = I('재단수량');
  const 남은 = 칸.map(()=>0);
  /* v1.8.0 줄마다 제품명·품목·사이즈·재단수량(합친 칸이면 그 칸 값) — 품목 연결 열쇠 · v1.10.0 분할 = 품목명(부통) */
  const 줄P = 이은값(pi), 줄M = 이은값(mi), 줄S = 이은값(si), 줄Q = 이은값(qi);
  let h = '<table class="dpr-t"><thead><tr>' +
    칸.map((k,i) => `<th class="${i===0?'dpr-k':''}${숫자칸.has(k)?' num':''}" data-k="${글(k)}">${글(메모열[k] ? '메모' : k)}<span class="칸끈"></span></th>`).join('') + '</tr></thead><tbody>';
  for(let n=0; n<줄.length; n++){
    const r = 줄[n];
    h += '<tr>';
    for(let i=0;i<칸.length;i++){
      if(남은[i] > 0){ 남은[i]--; continue; }
      let span = 1; const k = 열쇠(r,i,n);
      while(n+span < 줄.length && 열쇠(줄[n+span],i,n+span)===k) span++;
      남은[i] = span-1;
      const rs = span>1 ? ` rowspan="${span}"` : '';
      if(메모열[칸[i]]){ const z = 메모열[칸[i]][0];   /* v1.10.0 메모 */
        h += 메모.칸(z==='제품' ? '월제품' : '월품목', 줄P[n] ? d.달 + '\t' + n + '\t' + 줄P[n] : '', rs); continue; }   /* v1.10.11 그 줄(합친 칸 첫 줄) 하나 */
      const 이름 = i===pi ? String(값(r,i)??'').trim() : '';
      /* v1.10.0 그 제품명 칸이 덮는 줄들의 입고처 → 업체별 단품명 거래처(드롭 = 그 거래처 단품만) */
      const 업들 = 이름 ? [...new Set(줄업.slice(n, n+span).map(u => 업맞춤(u)).filter(Boolean).map(x => x.문서))] : [];
