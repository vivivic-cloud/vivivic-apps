<!DOCTYPE html>
<!-- 발주역입력 / 이룸산업 — 이룸산업 「N월 이룸 엣지 출고 총내역」(PDF, 월별)을 달마다 표로 본다.
     사장님 11-18: 「폴더에 이룸산업 파일도 월별로 목록이 나타나게 해줘. 기능 넣지 말고 목록만 일단 나타나게 해줘.」
     판 번호는 머리의 배지와 같다. 고칠 때 둘을 같이 올린다: v1.3.2
     v1.0.0(11-18): 첫 판. 월 버튼 → 그 달 표 하나 + 맨 아래 「총 합 계」 줄(PDF 처럼 칸을 합침). 칸 이름·값은 PDF 글자 그대로. 기능 없음(목록만).
       한 양식: 1~4월에 없는 「PO NO.」 는 제목만 두고 빈칸. 마지막 칸 제목은 그 달 PDF 이름 그대로(1~4월 「필름」 · 5~9월 「필름소요량」).
     v1.0.1(11-18): 쪽 이동에 「로앤 출고내역」(로앤.html) 탭 하나만 더함. 기능·표는 그대로.
     v1.1.0(11-18): 사장님 「이룸 품목 숫자 사이즈(111*222) 앞의 품목명을 새로운 열에 따로 나타나게 해줘.」 — 품목 칸 바로 왼쪽에 「품목명」 열.
       값 = 품목 글자에서 첫 사이즈(숫자*숫자) 앞부분(앞뒤 빈칸만 뺌, 그 밖 글자 그대로). 사이즈가 없으면 품목 그대로. 품목 칸·창고 값은 그대로(화면에서만 셈).
     v1.2.0(11-18): 사장님 「이룸/로앤 제품명 칸에 벤더피아 단품 검색하게 해줘.」 — 제품명 칸마다 「단품 추가」 → 검색 칸(기본 = 제품명, 고른 단품 있으면 그 단품명) → 목록에서 여러 개 고름 · 줄마다 「×」.
       재단.html 단품 검색과 같은 방식(납품내역_단품목록 사본 · 중지 단품 숨김 · 비슷한 순 · 단품 새로 받기). 품목 연결·공통 숫자·분할은 없음.
       저장 = 창고 `발주역입력_이룸_단품`(제품명마다 한 문서, 재단과 따로) — 같은 제품명이면 모든 달 같은 단품, 바뀐 것만 merge, 실패 = 빨간 띠.
     v1.3.0(11-18): 사장님 「단품 검색을 벤더피아연동을 통해 실시간 벤더피아 단품관리 검색으로」 — 재단 v1.9.0 과 같은 길(`벤더피아실시간.js`, 확장 덮어쓰기 없음).
       「단품 추가」 → (이어진 탭 없으면) 벤더피아 단품관리 탭 한 번 열기 → 치는 검색어로 벤더피아에 바로 조회해 새 단품·판매상태를 덮음 · 목록 위 「· 실시간」. 없거나 답 없으면 사본 그대로.
     v1.3.1(11-18): 쪽 이동에 「조혼가구 단품명」 탭 하나만 더함. 그 밖은 그대로.
     v1.3.2(11-18): 그 탭을 「업체별 단품명」(업체별단품.html)으로 바꿈. 그 밖은 그대로.

     ⚠ 값은 창고(artifacts/vivivic-4b7ef/public/data/발주역입력_이룸)에서 **읽기만** 한다.
        창고에 넣는 것은 tools/이룸출고읽기.py(드라이브 PDF → 창고). 공개 저장소라 업무 값은 이 파일에 없다.
     겉꼴은 재단.html(재단 세부내역 v1.1.0 셀 모양 표 · 월 버튼 · 화면 높이 표 상자)과 같다. -->

    import { getFirestore, doc, getDoc, collection, getDocs, setDoc, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
    const app = initializeApp({
        apiKey: "AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",
        authDomain: "vivivic-4b7ef.firebaseapp.com",
        projectId: "vivivic-4b7ef",
        storageBucket: "vivivic-4b7ef.firebasestorage.app",

<h1>이룸산업 출고내역</h1>
<div class="months" id="고름"></div>
<div class="state" id="목상태"><div class="big">창고를 읽는 중입니다…</div></div>
<div id="속"></div>

<!-- 짚어서 지시하는 손잡이 — 바이글 박스에서 열면 켜진다. -->
<script src="../shared/viggle.js"></script>

<script>
const 창고자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_이룸'];
const 숫자칸 = new Set(['수량','엣지단가','엣지가공합계','필름','필름소요량']);
let 달들 = [], 받은 = {}, 고른 = '', 답했나 = false;

const 글 = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function 목상태(큰,작,까닭){
  const el=document.getElementById('목상태'); el.style.display='block';
  el.innerHTML = `<div class="big">${큰}</div>` + (작?`<div class="sub">${작}</div>`:'') + (까닭?`<div class="why">${까닭}</div>`:'');
}
window.목록못읽음 = (큰,까닭) => { 답했나=true; 목상태(큰,'',까닭||''); };
setTimeout(() => { if(!답했나) 목상태('창고에 닿지 못했습니다'); }, 20000);

const 달글 = 달 => (+String(달).slice(5,7)) + '월';

window.목록읽기 = async function(){
  try{
    const { doc, getDoc } = window.fbRead;
    const [목] = await Promise.all([getDoc(doc(window.db, ...창고자리, '_달목록')), 연결듣기().catch(()=>{})]);   /* 단품 연결을 못 읽어도 표는 선다 */
    답했나 = true;
    달들 = (목.exists() && 목.data().달들) || [];
    if(!달들.length){ 목상태('창고에 이룸산업 출고내역이 없습니다'); return; }
    document.getElementById('목상태').style.display='none';
    document.getElementById('고름').innerHTML = 달들.map(d => `<button class="chip" data-m="${d}">${달글(d)}</button>`).join('');
    document.querySelectorAll('#고름 .chip').forEach(b => b.onclick = () => 달고름(b.dataset.m));
    달고름(달들[달들.length-1]);
  }catch(e){ window.목록못읽음('창고를 읽지 못했습니다', (e&&(e.code||e.message))||''); }
};

async function 달고름(m){
  고른 = m;
  document.querySelectorAll('#고름 .chip').forEach(b => b.classList.toggle('on', b.dataset.m===m));
  const 속 = document.getElementById('속');
  if(!받은[m]){
    속.innerHTML = '<div class="state"><div class="big">읽는 중입니다…</div></div>';
    try{
      const { doc, getDoc } = window.fbRead;
      const s = await getDoc(doc(window.db, ...창고자리, m));
      받은[m] = s.exists() ? s.data() : { 칸:[], 줄:[] };
    }catch(e){ 속.innerHTML = `<div class="state"><div class="big">창고를 읽지 못했습니다</div><div class="why">${글((e&&(e.code||e.message))||'')}</div></div>`; return; }
  }
  if(고른 !== m) return;
  그리기(받은[m]);
}

/* 한 양식 — 9달 PDF 칸을 합친 차례. 그 달 PDF 에 없는 칸(1~4월 PO NO.)은 제목만 두고 빈칸.
   마지막 칸은 1~4월 「필름」 = 5~9월 「필름소요량」 같은 자리 — 제목은 그 달 PDF 이름 그대로. 여기 없는 칸이 창고에 새로 오면 끝에 붙인다. */
const 한양식 = ['출고일','PO NO.','출고업체명','제품명','품목명','품목','엣지규격','수량','엣지단가','엣지가공합계','필름'];
/* v1.1.0 「품목명」 = 품목 글자의 첫 사이즈(숫자*숫자) 앞부분. 사이즈 없으면 품목 그대로. PDF 칸이 아니라 화면에서 셈(창고에 없음). */
const 품목명 = s => { s = String(s ?? ''); const m = s.match(/\d+(?:\.\d+)?\s*\*\s*\d/); return (m ? s.slice(0, m.index) : s).trim(); };
const 같은칸 = { '필름소요량':'필름' };

function 그리기(d){
  const 원칸 = d.칸 || [], 줄 = d.줄 || [], 합계 = d.합계 || [];
  const 속 = document.getElementById('속');
  if(!줄.length){ 속.innerHTML = '<div class="state"><div class="big">줄 없음</div></div>'; return; }
  const 칸 = [...한양식, ...원칸.filter(x => !한양식.includes(같은칸[x]||x))];
  const 자리 = 칸.map(k => 원칸.findIndex(x => (같은칸[x]||x)===k));   /* -1 = 이 달 PDF 에 없는 칸 */
  const 제목 = 칸.map((k,i) => 자리[i] < 0 ? k : 원칸[자리[i]]);
  const 품자리 = 원칸.indexOf('품목');
  let h = '<table class="dpr-t"><thead><tr>' +
    제목.map((k,i) => `<th class="${i===0?'dpr-k':''}">${글(k)}</th>`).join('') + '</tr></thead><tbody>';
  for(const r of 줄){
    h += '<tr>' + 칸.map((k,i) => {

  if(낱.length && !후보들.length){
    const 조 = [...new Set(input.value.toLowerCase().match(/[가-힣]+|[0-9]+|[a-z]+/g)||[])].filter(w=>w.length>=2);
    const 점 = [];
    보일.forEach((d,j) => { let n=0, k=''; for(const w of 조){ const y=d.찾글.includes(w); if(y) n++; k+=y?'1':'0'; } if(n) 점.push({d,n,k,j}); });
    점.sort((a,b) => b.n-a.n || (a.k<b.k?1:a.k>b.k?-1:0) || a.j-b.j);
    후보들 = 점.slice(0,50).map(x=>x.d); 비슷 = 후보들.length > 0;
  }
  if(비슷) t += '<div class="msg">다 맞는 단품 없음 — 비슷한 순</div>';
  if(!낱.length) t += '<div class="msg">단품명 · 단품코드를 치세요</div>';
  else if(!후보들.length) t += '<div class="msg">맞는 단품 없음</div>';
  t += 후보들.map((d,i) => `<div data-i="${i}" class="${i===0?'on':''}${단품있나(p,d.코드)?' got':''}">${단품있나(p,d.코드)?'✓ ':''}${글(d.이름)}<span class="cd">${글(d.코드)}${d.상태&&d.상태!=='판매중'?' · '+글(d.상태):''}</span></div>`).join('');
  후보.innerHTML = t;
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible' || !단품관리열었나 || 단품출처 !== '창고') return;
  const input = 후보칸; 단품읽기(true).then(() => { if(input && 후보칸 === input) 후보그리기(input); }, () => {});
});
function 단품단추(일){
  if(일 === 'login'){ window.open(벤더피아로그인주소, '_blank'); return; }
  if(일 === 'new' && 단품출처 === '창고'){ 단품관리열었나 = true; window.open(단품관리주소, 'vp단품관리'); if(후보칸) 후보그리기(후보칸); return; }
  if(일 === 'new'){ const input = 후보칸; 단품읽기(true); if(input) 후보그리기(input); }
}
function 고르기(input, i){
  const p = input.closest('.vk').dataset.p, x = 후보들[+i]; if(!x) return;
  단품더하기(p, x);
  if(후보칸 === input) 후보그리기(input);
}
document.addEventListener('click', e => {
  const t = e.target;
  const 추 = t.closest('.vk .추가');
  if(추){ const 더 = 추.parentElement;
    if(window.VP실시간) VP실시간.열기();   /* v1.3.0 이어진 벤더피아 탭이 없으면 단품관리 탭을 한 번 연다 */
    더.innerHTML = '<input type="search" placeholder="단품 검색" autocomplete="off" enterkeyhint="search">';
    더.querySelector('input').focus(); return; }
  const x = t.closest('.vk .dx');
  if(x){ const p = x.closest('.vk').dataset.p; if(confirm('삭제하겠습니까?')) 단품빼기(p, x.dataset.c); }
});
function 검색어(p){ return String(p).replace(/\s+/g,' ').trim(); }
document.addEventListener('focusin', e => {
  const input = e.target; if(!input.matches('.vk input')) return;
  if(!input.value){
    const p = input.closest('.vk').dataset.p;
    input.value = 연결[p] && 연결[p].단품들[0] ? 연결[p].단품들[0].이름 : 검색어(p);   /* 기본 = 고른 단품명(첫 단품), 없으면 제품명 */
    input.select();
    const 막기 = ev => ev.preventDefault();
    input.addEventListener('mouseup', 막기, {once:true}); setTimeout(() => input.removeEventListener('mouseup', 막기), 600);
  }
  if(단품말 && 단품말.막힘){ 단품말 = null; 단품받기 = null; }
  단품읽기(); 후보그리기(input);
});
document.addEventListener('input', e => { if(e.target.matches('.vk input')) 후보그리기(e.target); });
document.addEventListener('focusout', e => { if(e.target.matches('.vk input')) setTimeout(() => { if(후보칸===e.target && document.activeElement!==e.target) 후보닫기(); }, 0); });
document.addEventListener('keydown', e => {
  if(!e.target.matches('.vk input')) return;
  if(e.key==='Escape'){ e.target.blur(); }
  else if(e.key==='Enter' && 후보들.length && e.target.value.trim()){ e.preventDefault(); 고르기(e.target, 0); }
});
window.addEventListener('resize', 후보닫기);
document.querySelector('.wrap').addEventListener('scroll', () => { if(후보 && 후보칸) 후보자리(후보칸); });
if(window.visualViewport) for(const ev of ['resize','scroll']) visualViewport.addEventListener(ev, () => { if(후보 && 후보칸) 후보자리(후보칸); });
</script>
</body>
