<!DOCTYPE html>
<!-- 발주역입력 / 이룸산업 — 이룸산업 「N월 이룸 엣지 출고 총내역」(PDF, 월별)을 달마다 표로 본다.
     사장님 11-18: 「폴더에 이룸산업 파일도 월별로 목록이 나타나게 해줘. 기능 넣지 말고 목록만 일단 나타나게 해줘.」
     판 번호는 머리의 배지와 같다. 고칠 때 둘을 같이 올린다: v1.6.4
     v1.6.4(11-24): 사장님 「이룸산업 출고 명세 월별 분할된 부속 수량도 재단세부내역과 동일한 논리로 분할」 — 월별 명세 나뉜 품목 줄 수량 = 위수(재단 논리, 누계에서 고른 방식) / 나머지 · 엣지가공합계도 같은 비율로 나눔(합 = 원래).
     v1.6.3(11-24): 쪽길에 「조혼가구부속명」 탭(업체별 단품명 다음)만 더함.
     v1.6.2(11-24): 사장님 「다른 제품도 그렇게 되게 해줘」 — 부속명·분할 저장 열쇠 = 품목명만(문서 `발주역입력_이룸_품목명/_전체`) → 모든 제품의 같은 품목명 줄(누계·월별)에 같이. 옛 제품별 문서 1개 옮김.
     v1.6.1(11-24): 사장님 「…등록대기 대기중인 것, 이후 등록완료된 것으로 목록 작성해줘」 — 부속명 목록 = 입력폼 품목등록 받기 자료(영림원품목등록 보내기 반제품) + erp_items 대기·진행중 + 11-24 이후 새로 완료(영림원 불러오기 뺌). 옛 완료 4건(11-17 불러오기) 뺌.
     v1.6.0(11-24): 사장님 「…누계의 품목명을 입력폼과 통일…부속명을 드롭다운선택…월별명세의 해당품목명이 동시에 변경」 · 「응 거기서 가져와. 차후에 등록완료된 곳에서도 가져오게 미리 세팅해줘」 · 「이곳에 품목명 분할이 필요해. 분할 방식은 이미 재단세부내역에 참고하면 된다. 분할된 칸에서도 부속명통일이 되게 칸 만들어줘」 — 누계 품목명 「분할」(재단.html 그대로) · 칸마다 아래 부속명 드롭(입력폼 품목등록 반제품 품명 「_」 뒤, 대기·완료) · 월별 명세 품목명 따라 바뀜. 저장 = 발주역입력_이룸_품목명.
     v1.5.0(11-24): 사장님 「이룸출고내역 누계에 엣지규격, 엣지단가가 나타나야 합니다」 — 누계 칸 엣지규격(출고업체명 뒤) · 엣지단가(수량 뒤) = 명세 줄 값 그대로, 묶음 안 값이 다르면 주황 + 가장 많은 값, 마우스 = 모두.
     v1.4.4(11-24): 사장님 「발주역입력에서 입력폼으로 돌아가는 길이 없습니다」 — 쪽길 끝에 「외주자료 입력폼」(../영림원외주입력/영림원외주입력.html, 입력폼 제목 글자 그대로) 탭.
     v1.4.3(11-23): 사장님 「이 앱은 앞으로 여러 사람이 계속 쓰게 될 앱인데, 이런 문제(옛 판 창이 공개 문서를 끝없이 덮어쓰기)는 발생 안 해야 되는 거 아닌가요?」 — 공용 ../shared/쓰기지킴.js 부름(모듈보다 먼저): 옛 판이면 저장 멈춤·배지 빨강 · 같은 문서 10초 50번 넘게 쓰면 멈춤·배지 주황 · 같은 내용 10초 안 다시 쓰기 건너뜀. 페이지 코드는 그대로.
     v1.4.2(11-21): 사장님 「로앤 이룸 출고내역 누계에 숫자정보인 사이즈도 나타나게 해주세요」 — 누계 「사이즈」 칸(품목명 오른쪽) = 품목 글자의 첫 사이즈(숫자*숫자)부터 끝까지. 묶음 안에 여럿이면 가장 많이 나온 값, 나머지는 마우스.
     v1.4.1(11-21): 사장님 「이룸산업 로앤의 누계는 제품명+품목명에 의한 누계가 계산되어야 합니다. 제품명+품목명 이 다르다면 다른 순위가 되어야 합니다. 중복제거 조건도 제품명+품목명의 중복조건입니다」
       — 누계 한 줄 = 제품명 + 품목명(품목의 첫 사이즈 앞 글자, 이룸 「품목명」 열과 같은 셈) · 칸 「품목명」 을 제품명 오른쪽에. 단품 저장은 그대로 제품명마다(같은 제품명 = 같은 단품).
     v1.4.0(11-21): 사장님 「로앤출고내역을 보면 출고업체명 값을 볼 수 있습니다. 이는 업체별단품명의 거래처 단서가 됩니다. … 업체별단품명 안에서 해당거래처 단품으로만 한정되는 드롭다운 목록 … 로앤/이룸 출고내역에서 출고업체명을 업체별단품명 기준으로 변경」
       + 「모든 총계를 계산하여 합계단가 상위 순으로 제품명중복없이 보여지는 누계페이지 … 같은 논리의 단품명 검색 … 동일 제품명에 동시에 선택되는 논리를 유지」
       — 출고업체명 = 업체별 단품명 거래처 이름(화면만, `업체단품목록.js`) · 단품 드롭 = 그 거래처 업체별 단품명 단품만(벤더피아 전체 검색·실시간 탭 뺌) · 짝 없는 칸 주황(까닭 = 마우스) ·
         달 단추 끝 「누계」(주소 #누계) = 9달 제품명별 합, 엣지가공합계 큰 차례, 단품 저장은 달 표와 같은 창고.
     v1.3.7(11-21): 사장님 「드롭다운칸이 입력칸과 약간의 거리를 두어야」 — 후보 목록(.vpd) = 검색 칸 아래 10px 띄움(전 2px) · 테두리·그림자 = 보드·영림원품목등록 드롭과 같은 꼴(#C7C7C3 · 0 4px 14px).
     v1.3.6(11-19): 사장님 「모든 표의 첫 행을 고정해서 스크롤해도 사라지지 않게 해 줘.」 — 머리 줄(thead) 고정, 붙박이 첫 칸 모서리는 맨 위. 폰·낮은 화면은 표 상자 높이를 화면까지(상자 안에서 밀어야 머리가 남음).
     v1.3.5(11-18): 쪽길 여섯째 탭 「품목등록업로드」 → 「영림원품목등록」(영림원품목등록.html).
     v1.3.4(11-18): 쪽길 탭이 여섯이라 폰 폭에서 탭 이름이 낱말 중간에 끊겨 — 이름은 한 줄(nowrap), 넘치면 탭째 다음 줄.
     v1.3.3(11-18): 쪽길에 여섯째 탭 「품목등록업로드」.
     v1.0.0(11-18): 첫 판. 월 버튼 → 그 달 표 하나 + 맨 아래 「총 합 계」 줄(PDF 처럼 칸을 합침). 칸 이름·값은 PDF 글자 그대로. 기능 없음(목록만).
       한 양식: 1~4월에 없는 「PO NO.」 는 제목만 두고 빈칸. 마지막 칸 제목은 그 달 PDF 이름 그대로(1~4월 「필름」 · 5~9월 「필름소요량」).
     v1.0.1(11-18): 쪽 이동에 「로앤 출고내역」(로앤.html) 탭 하나만 더함. 기능·표는 그대로.
     v1.1.0(11-18): 사장님 「이룸 품목 숫자 사이즈(111*222) 앞의 품목명을 새로운 열에 따로 나타나게 해줘.」 — 품목 칸 바로 왼쪽에 「품목명」 열.
       값 = 품목 글자에서 첫 사이즈(숫자*숫자) 앞부분(앞뒤 빈칸만 뺌, 그 밖 글자 그대로). 사이즈가 없으면 품목 그대로. 품목 칸·창고 값은 그대로(화면에서만 셈).
     v1.2.0(11-18): 사장님 「이룸/로앤 제품명 칸에 벤더피아 단품 검색하게 해줘.」 — 제품명 칸마다 「단품 추가」 → 검색 칸(기본 = 제품명, 고른 단품 있으면 그 단품명) → 목록에서 여러 개 고름 · 줄마다 「×」.
       재단.html 단품 검색과 같은 방식(납품내역_단품목록 사본 · 중지 단품 숨김 · 비슷한 순 · 단품 새로 받기). 품목 연결·공통 숫자·분할은 없음.
       저장 = 창고 `발주역입력_이룸_단품`(제품명마다 한 문서, 재단과 따로) — 같은 제품명이면 모든 달 같은 단품, 바뀐 것만 merge, 실패 = 빨간 띠.
     v1.3.0(11-18): 사장님 「단품 검색을 벤더피아연동을 통해 실시간 벤더피아 단품관리 검색으로」 — 재단 v1.9.0 과 같은 길(`벤더피아실시간.js`, 확장 덮어쓰기 없음).
       「단품 추가」 → (이어진 탭 없으면) 벤더피아 단품관리 탭 한 번 열기 → 치는 검색어로 벤더피아에 바로 조회해 새 단품·판매상태를 덮음 · 목록 위 「· 실시간」. 없거나 답 없으면 사본 그대로.
     v1.3.1(11-18): 쪽 이동에 「조혼가구 단품명」 탭 하나만 더함. 그 밖은 그대로.
     v1.3.2(11-18): 그 탭을 「업체별 단품명」(업체별단품.html)으로 바꿈. 그 밖은 그대로.

     ⚠ 값은 창고(artifacts/vivivic-4b7ef/public/data/발주역입력_이룸)에서 **읽기만** 한다.
        창고에 넣는 것은 tools/이룸출고읽기.py(드라이브 PDF → 창고). 공개 저장소라 업무 값은 이 파일에 없다.
     겉꼴은 재단.html(재단 세부내역 v1.1.0 셀 모양 표 · 월 버튼 · 화면 높이 표 상자)과 같다. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이룸산업 출고내역 — 발주역입력</title>
<script src="업체단품목록.js?v=11-21"></script>
<script src="../shared/쓰기지킴.js?v=11-23b"></script>   <!-- 쓰기 안전장치(옛 판·잦은 쓰기 멈춤) — 모듈보다 먼저 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs, setDoc, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
    const 설정 = {
        apiKey: "AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",
        authDomain: "vivivic-4b7ef.firebaseapp.com",
        projectId: "vivivic-4b7ef",
        storageBucket: "vivivic-4b7ef.firebasestorage.app",
        messagingSenderId: "830175660542",
        appId: "1:830175660542:web:9054030480c8280af8d8af"
    };
    const app = initializeApp(설정);
    const auth = getAuth(app);
    /* v1.6.0 입력폼(앱 이름 'erp-input') 로그인을 같이 씀(영림원품목등록과 같은 길, 읽기만) — 5 품목등록 erp_items 오류 뺀 전부(대기·진행중·완료…) → 반제품 품명 마지막 「_」 뒤 = 부속명 목록 */
    try{
        const 폼앱 = initializeApp(설정, 'erp-input'), 폼auth = getAuth(폼앱), 폼db = getFirestore(폼앱);
        let 끄기 = null;
        const 받음 = (줄, 왜) => { window.폼품목대기 = [줄, 왜]; if (window.폼품목받음) window.폼품목받음(줄, 왜); };
        onAuthStateChanged(폼auth, (u) => {
            if (끄기) { 끄기(); 끄기 = null; }
            if (!u) { 받음(null, '입력폼 로그인 없음'); return; }
            끄기 = onSnapshot(collection(폼db, 'erp_items'), s => 받음(s.docs.map(d => d.data()), ''), e => 받음(null, (e && (e.code || e.message)) || ''));
        });
    }catch(e){ window.폼품목대기 = [null, String(e && e.message || e)]; }
    window.db = getFirestore(app);
    window.fbRead = { doc, getDoc, collection, getDocs, setDoc, onSnapshot, deleteField };
    onAuthStateChanged(auth, (u) => {
        if (!u) { signInAnonymously(auth).catch(e => window.목록못읽음('창고에 들어가지 못했습니다', (e&&(e.code||e.message))||'')); return; }
        window.목록읽기();
    });
</script>

.표통::-webkit-scrollbar-track,.표통::-webkit-scrollbar-corner{background:var(--vg-fill)}
.표통::-webkit-scrollbar-thumb{background:#C7C7C3;border-radius:10px}
/* 표 — 재단.html 셀 모양(v1.1.0) 그대로 */
.dpr-t{width:max-content;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;
  border-top:1px solid #C7C7C3;border-left:1px solid #C7C7C3}
.dpr-t th,.dpr-t td{border-right:1px solid #D6D6D3;border-bottom:1px solid #D6D6D3;white-space:nowrap}
.dpr-t th{font-size:11.5px;font-weight:800;line-height:1.3;color:var(--vg-ink);text-align:center;vertical-align:middle;
  padding:4px 5px;background:var(--vg-fill);border-bottom:1px solid #C7C7C3}
.dpr-t td{font-size:11.5px;line-height:1.3;color:var(--vg-body);padding:2px 5px;vertical-align:top;background:var(--vg-bg)}
.dpr-t td.num{text-align:right}
.dpr-t .dpr-k{position:sticky;left:0;z-index:1;font-weight:700;color:var(--vg-ink)}
.dpr-t th.dpr-k{background:var(--vg-fill)}
/* v1.3.6 머리 줄 고정 — 표 상자(.표통) 안에서 위아래로 밀어도 머리가 맨 위에 남는다. 붙박이 첫 칸 머리(모서리)가 맨 위. */
.dpr-t thead th{position:sticky;top:0;z-index:2}
.dpr-t thead th.dpr-k{z-index:3}
@media (max-width:600px),(max-height:600px){#속>.표통{max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px)}}
/* 「총 합 계」 줄 — 머리와 같은 바탕·굵기 */
.dpr-t tr.합 td{font-weight:800;color:var(--vg-ink);background:var(--vg-fill);border-top:1px solid #C7C7C3}
.dpr-t tr.합 td.dpr-k{text-align:center}
/* 제품명 칸 벤더피아 단품 검색 — 재단.html(v1.2.0~v1.8.3) 과 같은 값 */
.dpr-t td.pc .vk{margin:2px 0 1px}
.vk input,.vk button{display:block;width:100%;min-width:150px;height:20px;padding:1px 5px;font:inherit;font-size:11.5px;line-height:16px;
  color:var(--vg-body);border:1px solid var(--vg-edge);border-radius:4px;background:var(--vg-fill);outline:none;text-align:left;-webkit-appearance:none}
.vk input:focus{border-color:var(--vg-ink);background:var(--vg-bg)}
.vk input::placeholder{color:var(--vg-muted)}
.vk button{background:var(--vg-bg);border-color:#C7C7C3;font-weight:700;color:var(--vg-ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.vk .cd,.vpd .cd{font-size:10.5px;font-weight:500;color:var(--vg-muted);margin-left:5px}
.vpd{position:fixed;z-index:50;background:var(--vg-bg);border:1px solid #C7C7C3;border-radius:6px;
  box-shadow:0 4px 14px rgba(0,0,0,.12);overflow-y:auto;-webkit-overflow-scrolling:touch}
.vpd div{padding:4px 8px;font-size:11.5px;line-height:1.3;border-bottom:1px solid #EDEDEA;cursor:pointer;white-space:nowrap}
.vpd div:hover,.vpd div.on{background:var(--vg-fill)}
.vpd div.msg{color:var(--vg-muted);cursor:default}
.vpd div.msg.bad{color:var(--vg-red)}
.vpd div.act{font-weight:700;color:var(--vg-ink);background:var(--vg-fill)}
.vpd div.act:hover{background:#EDEDEA}
.vk .dp{display:flex;align-items:center;gap:8px;margin-top:2px}
.vk .dp .dn{flex:1 1 auto;width:auto;cursor:default}
.vk .dp .dx{flex:0 0 20px;width:20px;min-width:0;padding:0;text-align:center;color:var(--vg-muted);border-color:var(--vg-edge)}
.vk .dp .dx:hover{color:var(--vg-red);border-color:var(--vg-red)}
.vk .더{margin-top:2px}
.vk .추가{font-weight:600;color:var(--vg-muted);background:var(--vg-fill);border-color:var(--vg-edge)}
.vpd div.got{color:var(--vg-muted)}
/* 출고업체명이 업체별 단품명 거래처와 짝이 없음 — 까닭은 마우스 */
.dpr-t td.업체없음{background:#FFF1E0}
.dpr-t td.여럿{background:#FFF1E0}
/* v1.6.0 누계 품목명 분할(재단.html v1.8.0 과 같은 꼴) · 부속명 통일 드롭 */
.dpr-t td.pm .품줄{display:flex;align-items:center}
.dpr-t td .작{font:inherit;font-size:10.5px;line-height:14px;height:16px;padding:0 4px;margin-left:6px;border:1px solid var(--vg-edge);border-radius:4px;background:var(--vg-bg);color:var(--vg-muted);cursor:pointer;flex:0 0 auto}
.dpr-t td .작:hover{color:var(--vg-ink);border-color:var(--vg-ink)}
.dpr-t td.qy .작{margin:0}
.dpr-t td .반{display:block;min-height:20px;margin:0 -5px;padding:1px 5px}
.dpr-t td .반.위{border-bottom:1px solid #D6D6D3}
.dpr-t td .반 .품줄{display:flex;align-items:center}
.dpr-t td.qy .반{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.dpr-t td.qy input.수{width:52px;height:18px;padding:0 4px;font:inherit;font-size:11.5px;text-align:right;border:1px solid #C7C7C3;border-radius:4px}
.속명{display:block;min-width:90px;height:18px;margin:2px 0 1px;padding:0 5px;font:inherit;font-size:11px;line-height:16px;text-align:left;border:1px dashed #C7C7C3;border-radius:4px;background:var(--vg-bg);color:var(--vg-muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.속명.on{border-style:solid;color:#1565c0;font-weight:700}
.속명.없음{background:#FFF1E0;cursor:default}
.띠{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--vg-red);color:#fff;font-size:12.5px;font-weight:600;padding:6px 16px;text-align:center}
@media (max-width:600px){.vk input{font-size:16px;height:26px}}
.state{background:var(--vg-fill);border-radius:14px;padding:22px 16px;text-align:center;margin-top:12px}
.state .big{font-size:14px;font-weight:600;color:var(--vg-ink);padding-bottom:6px}
.state .sub{font-size:12.5px;color:var(--vg-muted);line-height:1.85}
.state .why{font-size:11.5px;color:var(--vg-red);padding-top:6px;font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div class="띠" id="띠" hidden></div>
<div class="wrap">
<header>
  <div class="logo"><b>VIVIVIC</b> — 발주역입력</div>
  <div class="badge">v1.6.4</div>
</header>
<nav class="쪽길"><a href="재단.html">재단 세부내역</a><a href="보드매입현황.html">보드/엣지 매입현황</a><a href="이룸산업.html" class="on">이룸산업 출고내역</a><a href="로앤.html">로앤 출고내역</a><a href="업체별단품.html">업체별 단품명</a><a href="조혼가구부속명.html">조혼가구부속명</a><a href="영림원품목등록.html">영림원품목등록</a><a href="../영림원외주입력/영림원외주입력.html">외주자료 입력폼</a></nav>
<h1>이룸산업 출고내역</h1>
<div class="months" id="고름"></div>
<div class="state" id="목상태"><div class="big">창고를 읽는 중입니다…</div></div>
<div id="속"></div>
</div>

<!-- 짚어서 지시하는 손잡이 — 바이글 박스에서 열면 켜진다. -->
<script src="../shared/viggle.js"></script>

<script>
const 창고자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_이룸'];
const 숫자칸 = new Set(['수량','엣지단가','엣지가공합계','필름','필름소요량']);
let 달들 = [], 받은 = {}, 고른 = '', 답했나 = false;

const 글 = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function 목상태(큰,작,까닭){
  const el=document.getElementById('목상태'); el.style.display='block';
  el.innerHTML = `<div class="big">${큰}</div>` + (작?`<div class="sub">${작}</div>`:'') + (까닭?`<div class="why">${까닭}</div>`:'');
}
window.목록못읽음 = (큰,까닭) => { 답했나=true; 목상태(큰,'',까닭||''); };
setTimeout(() => { if(!답했나) 목상태('창고에 닿지 못했습니다'); }, 20000);

const 달글 = 달 => (+String(달).slice(5,7)) + '월';

window.목록읽기 = async function(){
  try{
    const { doc, getDoc } = window.fbRead;
    const [목] = await Promise.all([getDoc(doc(window.db, ...창고자리, '_달목록')), 연결듣기().catch(()=>{})]);   /* 단품 연결을 못 읽어도 표는 선다 */
    답했나 = true;
    달들 = (목.exists() && 목.data().달들) || [];
    if(!달들.length){ 목상태('창고에 이룸산업 출고내역이 없습니다'); return; }
    document.getElementById('목상태').style.display='none';
    document.getElementById('고름').innerHTML = 달들.map(d => `<button class="chip" data-m="${d}">${달글(d)}</button>`).join('') + '<button class="chip" data-m="누계">누계</button>';
    document.querySelectorAll('#고름 .chip').forEach(b => b.onclick = () => 달고름(b.dataset.m));
    업체단품.듣기(window.db, window.fbRead, () => { if(후보칸) 후보그리기(후보칸); });
    품명듣기();   /* v1.6.0 */
    받기듣기();   /* v1.6.1 */
    달고름(decodeURIComponent(location.hash.slice(1)) === '누계' ? '누계' : 달들[달들.length-1]);
  }catch(e){ window.목록못읽음('창고를 읽지 못했습니다', (e&&(e.code||e.message))||''); }
};

async function 달고름(m){
  고른 = m;
  document.querySelectorAll('#고름 .chip').forEach(b => b.classList.toggle('on', b.dataset.m===m));
  try{ history.replaceState(null, '', m === '누계' ? '#누계' : location.pathname + location.search); }catch(e){}
  if(m === '누계'){ 누계고름(); return; }
  const 속 = document.getElementById('속');
  if(!받은[m]){
    속.innerHTML = '<div class="state"><div class="big">읽는 중입니다…</div></div>';
    try{
      const { doc, getDoc } = window.fbRead;
      const s = await getDoc(doc(window.db, ...창고자리, m));
      받은[m] = s.exists() ? s.data() : { 칸:[], 줄:[] };
    }catch(e){ 속.innerHTML = `<div class="state"><div class="big">창고를 읽지 못했습니다</div><div class="why">${글((e&&(e.code||e.message))||'')}</div></div>`; return; }
  }
  if(고른 !== m) return;
  그리기(받은[m]);
}

/* 한 양식 — 9달 PDF 칸을 합친 차례. 그 달 PDF 에 없는 칸(1~4월 PO NO.)은 제목만 두고 빈칸.
   마지막 칸은 1~4월 「필름」 = 5~9월 「필름소요량」 같은 자리 — 제목은 그 달 PDF 이름 그대로. 여기 없는 칸이 창고에 새로 오면 끝에 붙인다. */
const 한양식 = ['출고일','PO NO.','출고업체명','제품명','품목명','품목','엣지규격','수량','엣지단가','엣지가공합계','필름'];
/* v1.1.0 「품목명」 = 품목 글자의 첫 사이즈(숫자*숫자) 앞부분. 사이즈 없으면 품목 그대로. PDF 칸이 아니라 화면에서 셈(창고에 없음). */
const 품목명 = s => { s = String(s ?? ''); const m = s.match(/\d+(?:\.\d+)?\s*\*\s*\d/); return (m ? s.slice(0, m.index) : s).trim(); };
const 같은칸 = { '필름소요량':'필름' };

function 그리기(d){
  const 원칸 = d.칸 || [], 줄 = d.줄 || [], 합계 = d.합계 || [];
  const 속 = document.getElementById('속');
  if(!줄.length){ 속.innerHTML = '<div class="state"><div class="big">줄 없음</div></div>'; return; }
  const 칸 = [...한양식, ...원칸.filter(x => !한양식.includes(같은칸[x]||x))];
  const 자리 = 칸.map(k => 원칸.findIndex(x => (같은칸[x]||x)===k));   /* -1 = 이 달 PDF 에 없는 칸 */
  const 제목 = 칸.map((k,i) => 자리[i] < 0 ? k : 원칸[자리[i]]);
  const 업자리 = 자리[칸.indexOf('출고업체명')] ?? -1;
  const 품자리 = 원칸.indexOf('품목'), 제자리 = 원칸.indexOf('제품명');
  let h = '<table class="dpr-t"><thead><tr>' +
    제목.map((k,i) => `<th class="${i===0?'dpr-k':''}">${글(k)}</th>`).join('') + '</tr></thead><tbody>';
  const 수i = 자리[칸.indexOf('수량')], 금i = 자리[칸.indexOf('엣지가공합계')];
  for(const r of 줄){
    const 업원 = 업자리 >= 0 ? String(r.v[업자리]??'').trim() : '', 업 = 업체단품.맞춤(업원);
    /* v1.6.4 사장님 「이룸산업 출고 명세 월별 분할된 부속 수량도 재단세부내역과 동일한 논리로 분할」 — 누계에서 나눈 품목명(전체값.분할)이면 이 줄 수량 n 을 위수(나, n)(반반 홀수 위 +1 · 「3」 · 직접 = 같은 비율) / n−위 로,
       엣지가공합계 = 원래 금액 × 위/n(원 단위 반올림) / 나머지 — 두 칸 합 = 원래. 수량이 정수가 아니면 안 나눔. 표시만(원본·총 합 계 그대로). */
    const 나 = 품자리 >= 0 && 전체값.분할[품목명(r.v[품자리])], n = 나 && 수i >= 0 ? 수(r.v[수i]) : null, 나눔 = n != null && Number.isInteger(n) && n > 0 ? 위수(나, n) : null;
    const 반칸 = (위, 아래, t) => `<td class="num"${t?` title="${글(t)}"`:''}><div class="반 위">${글(위)}</div><div class="반 아래">${글(아래)}</div></td>`;
    h += '<tr>' + 칸.map((k,i) => {
      if(나눔 != null && k==='수량') return 반칸(나눔.toLocaleString('ko-KR'), (n-나눔).toLocaleString('ko-KR'), '원래 ' + r.v[수i]);
      if(나눔 != null && k==='엣지가공합계' && 금i >= 0 && 수(r.v[금i]) != null){ const 금 = 수(r.v[금i]), 위금 = Math.round(금 * 나눔 / n); return 반칸(위금.toLocaleString('ko-KR'), (금-위금).toLocaleString('ko-KR'), '원래 ' + r.v[금i]); }
      if(k==='출고업체명') return 업 ? `<td title="${글('출고업체명 '+업원)}">${글(업.이름)}</td>` : `<td class="업체없음" title="${글('업체별 단품명 거래처 없음 — 출고업체명 '+업원)}">${글(업원)}</td>`;
      const 이름 = k==='제품명' && 자리[i] >= 0 ? String(r.v[자리[i]]??'').trim() : '';
      const cls = (i===0?'dpr-k':'') + (숫자칸.has(제목[i])?' num':'') + (이름?' pc':'');
      if(k==='품목명' && 품자리 >= 0){ const 제 = 제자리 >= 0 ? String(r.v[제자리]??'').trim() : ''; return 월품목명칸(제, 품목명(r.v[품자리])); }   /* v1.6.0 부속명 통일·분할 */
      return `<td${cls.trim()?` class="${cls.trim()}"`:''}>${글(자리[i] < 0 ? '' : r.v[자리[i]])}${이름?단품칸(이름, 업?[업.문서]:[]):''}</td>`;
    }).join('') + '</tr>';
  }
  /* 「총 합 계」 — PDF 처럼 칸을 합친 그대로(첫 칸이 남은 칸을 다 차지 → 금액·필름 칸이 제자리에 온다) */
  if(합계.length){
    const 뒤 = 합계.slice(1).reduce((a,c) => a + (c.n||1), 0);
    h += '<tr class="합">' + 합계.map((c,j) => {
      const n = j===0 ? 칸.length - 뒤 : (c.n||1);
      return `<td class="${j===0?'dpr-k':'num'}"${n>1?` colspan="${n}"`:''}>${글(c.v)}</td>`;
    }).join('') + '</tr>';
  }
  h += '</tbody></table>';
  속.innerHTML = '<div class="표통">' + h + '</div>';
  후보닫기();
  속.querySelector('.표통').addEventListener('scroll', () => { if(후보 && 후보칸) 후보자리(후보칸); });   /* 표를 밀면 후보 목록이 칸을 따라간다 */
}

/* ════ v1.4.0 누계 — 9달 출고내역을 제품명(앞뒤 빈칸 뺀 글자) + 품목명(v1.4.1, 품목의 첫 사이즈 앞)마다 한 줄 — 둘 다 같아야 한 줄. 엣지가공합계 합이 큰 차례(같으면 수량 · 제품명).
   칸 = 제품명 · 출고업체명(업체별 단품명 이름, 여럿이면 「 · 」, 짝 없으면 원래 글자 주황) · 출고내역 숫자 칸 합. 단가 칸은 더하지 않음.
   제품명 칸 = 달 표와 같은 단품칸(같은 창고 · 같은 제품명이면 같은 단품) — 드롭 = 그 제품 출고업체들의 업체별 단품명 단품. ════ */
/* 사이즈 = 품목 글자의 첫 사이즈(숫자*숫자)부터 끝(품목명 뒤 나머지). PDF 에 따로 칸이 없어 칸 이름은 사장님 말 「사이즈」. */
const 사이즈 = s => { s = String(s ?? ''); const m = s.match(/\d+(?:\.\d+)?\s*\*\s*\d/); return m ? s.slice(m.index).trim() : ''; };
const 누계숫자 = [['수량','수량'],['엣지가공합계','엣지가공합계'],['필름','필름 / 필름소요량']];
