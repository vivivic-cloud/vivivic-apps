<!DOCTYPE html>
<!-- 발주역입력 / 업체별 단품명 — 「업체별단품명」 엑셀(시트 「업체별단품코드」)을 A열 업체 표시로 나눠 업체마다 표로 본다.
     사장님 11-18: 「폴더에 업체별단품명 파일의 A열이 조혼가구인 것만 목록으로 보여지게 해줘.」 →
       「폴더에 업체별 단품폴더를 새로만들었어 그안에 있는 구글시트 A열 확인해서 업체별로 목록 만들어줘」
     판 번호는 머리의 배지와 같다. 고칠 때 둘을 같이 올린다: v1.3.1
     v1.3.1(11-19): 사장님 「판매중지도 약간 죽은느낌으로 보이게 해줘」 — 관련 상품에 판매중지 상품도(회색·옅게, 판매중 뒤, 까닭은 title). 자료 = 확장 0.35.7 이 중지까지 올린 납품내역_상품목록.
     v1.3.0(11-19): 사장님 「업체별 단품명에는 이 단품을 포함시키고 있는 상품명을 연결해줘야해 방법은 벤더피아연동의 단품명 버튼이 그대로 지금 이 표의 단품명에 나타나게 하면 된다. 그 단품안에는 관련상품이 연동되어 보이게 해뒀으니 맞지?」
       — 단품명 칸 = 벤더피아연동 단품 단추(shared/벤더피아단품단추.js), 누르면 단품 상세 + 「관련 상품」. 관련 상품 없는 단추는 빨간 글자, 까닭은 title.
     v1.2.2(11-19): 사장님 「유한가구로 되어 있는 모든 거래처를 진아산업으로 바꿔 줘. 유한가구 = 진아산업이야.」 — 업체 단추·칸 값의 「유한가구」 를 「진아산업」 으로 보임(창고·엑셀은 그대로).
     v1.2.1(11-19): 사장님 「모든 표의 첫 행을 고정해서 스크롤해도 사라지지 않게 해 줘.」 — 머리 줄(thead) 고정, 붙박이 첫 칸 모서리는 맨 위. 폰·낮은 화면은 표 상자 높이를 화면까지(상자 안에서 밀어야 머리가 남음).
     v1.2.0(11-18): 사장님 「두 자료가 상호 연결되도록」 — 단품코드가 영림원품목등록 「품목등록업로드」 제품(품목자산분류=제품) 품번에 있는 줄은 줄 색(.등록, title).
       두 창고를 onSnapshot 으로 실시간 구독(한쪽이 바뀌면 색이 따라 바뀜). 대조 = 앞뒤 빈칸 뺀 같은 글자.
     v1.1.3(11-18): 쪽길 여섯째 탭 「품목등록업로드」 → 「영림원품목등록」(영림원품목등록.html).
     v1.1.2(11-18): 쪽길 탭이 여섯이라 폰 폭에서 탭 이름이 낱말 중간에 끊겨 — 이름은 한 줄(nowrap), 넘치면 탭째 다음 줄.
     v1.1.1(11-18): 쪽길에 여섯째 탭 「품목등록업로드」.
     v1.0.0(11-18): 첫 판(같은 날 만든 「조혼가구 단품명」 조혼가구단품.html 을 바꿔 이은 것). 업체 단추(엑셀 A열 차례) → 그 업체 표 하나(처음엔 첫 업체).
       칸 이름·값은 그 업체 구간 머리 줄(B~O) 그대로. 기능 없음(목록만). 쪽길은 탭 「업체별 단품명」.
     v1.1.0(11-18): 사장님 「코드1차등록여부 최종수정여부 비고 사용합판코드 사용필름코드 예외부속코드(매칭필름코드) 예외부속코드(매칭원자재코드) 열 모두 삭제」 →
       읽기 도구가 그 이름의 칸을 빼고 창고에 다시 씀(이 쪽은 받은 칸 그대로 그림). 이름이 다른 예외합판코드·예외필름코드(유한·럭스·아인·본사)는 남김.

     ⚠ 값은 창고(artifacts/vivivic-4b7ef/public/data/발주역입력_업체별단품)에서 **읽기만** 한다.
        창고에 넣는 것은 tools/업체별단품읽기.py(드라이브 엑셀 → 창고). 공개 저장소라 업무 값은 이 파일에 없다.
     겉꼴은 로앤.html · 이룸산업.html · 재단.html(셀 모양 표 · 단추 · 화면 높이 표 상자)과 같다. -->

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
    const app = initializeApp({
        apiKey: "AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",
        authDomain: "vivivic-4b7ef.firebaseapp.com",
        projectId: "vivivic-4b7ef",
        storageBucket: "vivivic-4b7ef.firebasestorage.app",
        messagingSenderId: "830175660542",
        appId: "1:830175660542:web:9054030480c8280af8d8af"
    });
    const auth = getAuth(app);
    window.db = getFirestore(app);
    window.fbRead = { doc, getDoc, onSnapshot, collection, getDocs };
    onAuthStateChanged(auth, (u) => {
        if (!u) { signInAnonymously(auth).catch(e => window.목록못읽음('창고에 들어가지 못했습니다', (e&&(e.code||e.message))||'')); return; }
        window.목록읽기();
    });
</script>

<h1>업체별 단품명</h1>
<div class="months" id="고름"></div>
<div class="state" id="목상태"><div class="big">창고를 읽는 중입니다…</div></div>
<div id="속"></div>
</div>

<!-- 짚어서 지시하는 손잡이 — 바이글 박스에서 열면 켜진다. -->
<script src="../shared/viggle.js"></script>
<script src="../shared/벤더피아단품단추.js"></script>

<script>
const 창고자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_업체별단품'];
/* vv1.2.2 사장님 11-19 「유한가구로 되어 있는 모든 거래처를 진아산업으로 바꿔 줘. 유한가구 = 진아산업이야.」 — 보이는 글만 바꿈(창고·원본 엑셀 사본은 그대로, 비교·열쇠는 원래 글자) */
const 별명 = v => typeof v==='string' ? v.replace(/유한가구/g,'진아산업') : v;
const 숫자칸 = new Set(['no']);
let 업체들 = [], 받은 = {}, 고른 = '', 답했나 = false;

const 글 = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');
function 목상태(큰,작,까닭){
  const el=document.getElementById('목상태'); el.style.display='block';
  el.innerHTML = `<div class="big">${큰}</div>` + (작?`<div class="sub">${작}</div>`:'') + (까닭?`<div class="why">${까닭}</div>`:'');
}
window.목록못읽음 = (큰,까닭) => { 답했나=true; 목상태(큰,'',까닭||''); };
setTimeout(() => { if(!답했나) 목상태('창고에 닿지 못했습니다'); }, 20000);

const 문서이름 = u => String(u).replace(/\//g,'／');

window.목록읽기 = async function(){
  try{
    const { doc, getDoc } = window.fbRead;
    const 목 = await getDoc(doc(window.db, ...창고자리, '_업체목록'));
    답했나 = true;
    업체들 = (목.exists() && 목.data().업체들) || [];
    if(!업체들.length){ 목상태('창고에 업체별 단품명이 없습니다'); return; }
    document.getElementById('목상태').style.display='none';
    document.getElementById('고름').innerHTML = 업체들.map(u => `<button class="chip" data-u="${글(u)}">${글(별명(u))}</button>`).join('');
    document.querySelectorAll('#고름 .chip').forEach(b => b.onclick = () => 업체고름(b.dataset.u));
    업체고름(업체들[0]);
    영림원구독();
    VP단품단추.읽기({ db: window.db, ...window.fbRead }).catch(() => {});
  }catch(e){ window.목록못읽음('창고를 읽지 못했습니다', (e&&(e.code||e.message))||''); }
};

async function 업체고름(u){
  고른 = u;
  document.querySelectorAll('#고름 .chip').forEach(b => b.classList.toggle('on', b.dataset.u===u));
  const 속 = document.getElementById('속');
  if(받은[u]){ 그리기(받은[u]); return; }
  속.innerHTML = '<div class="state"><div class="big">읽는 중입니다…</div></div>';
  const { doc, onSnapshot } = window.fbRead;
  onSnapshot(doc(window.db, ...창고자리, 문서이름(u)), s => {
    받은[u] = s.exists() ? s.data() : { 칸:[], 줄:[] };
    if(고른 === u) 그리기(받은[u]);
  }, e => { if(고른===u) 속.innerHTML = `<div class="state"><div class="big">창고를 읽지 못했습니다</div><div class="why">${글((e&&(e.code||e.message))||'')}</div></div>`; });
}

/* 영림원품목등록 창고의 「품목등록업로드」 제품 품번 — 실시간. 바뀌면 색만 다시 칠한다. */
const 영림원자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_영림원품목등록'];
const 영림원시트 = '품목등록업로드';
let 등록품번 = new Set(), 조각값 = [], 조각끊기 = [];
function 영림원구독(){
  const { doc, onSnapshot } = window.fbRead;
  onSnapshot(doc(window.db, ...영림원자리, '_시트목록'), m => {
    const t = ((m.exists() && m.data().시트들) || []).find(x => x.이름===영림원시트);
    조각끊기.forEach(f => f()); 조각끊기 = []; 조각값 = [];
    if(!t){ 품번셈(t); return; }
    const 칸 = t.칸 || [], n = t.조각 || 1;
    조각값 = Array(n).fill(null);
    for(let k=0;k<n;k++){
      조각끊기.push(onSnapshot(doc(window.db, ...영림원자리, `${문서이름(영림원시트)}_${k+1}`), s => {
        조각값[k] = s.exists() ? (s.data().줄||[]) : [];
        if(조각값.every(x => x)) 품번셈(칸);
      }, () => {}));
    }
  }, () => {});
}
function 품번셈(칸){
  const pi = (칸||[]).indexOf('품번'), ai = (칸||[]).indexOf('품목자산분류');
  등록품번 = new Set();
  if(pi>=0 && ai>=0) for(const r of [].concat(...조각값)) if(String(r.v[ai]??'').trim()==='제품'){ const c = String(r.v[pi]??'').trim(); if(c) 등록품번.add(c); }
  색칠();
}
function 색칠(){
  document.querySelectorAll('#속 tr[data-code]').forEach(tr => {
    const on = 등록품번.has(tr.dataset.code);
    tr.classList.toggle('등록', on);
    if(on) tr.title = '영림원품목등록 품목등록업로드'; else tr.removeAttribute('title');
  });
}

function 그리기(d){
  const 칸 = d.칸 || [], 줄 = d.줄 || [];
  const 속 = document.getElementById('속');
  if(!줄.length){ 속.innerHTML = '<div class="state"><div class="big">줄 없음</div></div>'; return; }
  const ci = 칸.indexOf('단품코드'), ni = 칸.indexOf('단품명');
  let h = '<table class="dpr-t"><thead><tr>' +
    칸.map((k,i) => `<th class="${i===0?'dpr-k':''}">${글(k)}</th>`).join('') + '</tr></thead><tbody>';
  for(const r of 줄){
    h += (ci>=0 ? `<tr data-code="${글(String(r.v[ci]??'').trim())}">` : '<tr>') + 칸.map((k,i) => {
      const cls = (i===0?'dpr-k':'') + (숫자칸.has(k)?' num':'');
      /* v1.3.0 단품명 칸 = 벤더피아연동 단품 단추(단품코드가 있는 줄만) */
      const 값 = i===ni && ci>=0 && String(r.v[ci]??'').trim() && String(r.v[i]??'').trim() ? VP단품단추.단추글(r.v[ci], 별명(r.v[i])) : 글(별명(r.v[i]));
      return `<td${cls.trim()?` class="${cls.trim()}"`:''}>${값}</td>`;
    }).join('') + '</tr>';
  }
  h += '</tbody></table>';
  const 옛통 = 속.querySelector('.표통'), 옛자리 = 옛통 && 옛통.dataset.u===고른 ? [옛통.scrollLeft, 옛통.scrollTop] : null;
  속.innerHTML = '<div class="표통">' + h + '</div>';
  const 통 = 속.querySelector('.표통'); 통.dataset.u = 고른;
  if(옛자리){ 통.scrollLeft = 옛자리[0]; 통.scrollTop = 옛자리[1]; }
  색칠();
  VP단품단추.칠하기(속);
}
</script>
