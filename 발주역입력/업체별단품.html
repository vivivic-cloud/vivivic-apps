<!DOCTYPE html>
<!-- 발주역입력 / 업체별 단품명 — 「업체별단품명」 엑셀(시트 「업체별단품코드」)을 A열 업체 표시로 나눠 업체마다 표로 본다.
     사장님 11-18: 「폴더에 업체별단품명 파일의 A열이 조혼가구인 것만 목록으로 보여지게 해줘.」 →
       「폴더에 업체별 단품폴더를 새로만들었어 그안에 있는 구글시트 A열 확인해서 업체별로 목록 만들어줘」
     판 번호는 머리의 배지와 같다. 고칠 때 둘을 같이 올린다: v1.5.3
     v1.5.3(11-24): 사장님 「발주역입력에서 입력폼으로 돌아가는 길이 없습니다」 — 쪽길 끝에 「외주자료 입력폼」(../영림원외주입력/영림원외주입력.html, 입력폼 제목 글자 그대로) 탭.
     v1.5.2(11-23): 사장님 「이 앱은 앞으로 여러 사람이 계속 쓰게 될 앱인데, 이런 문제(옛 판 창이 공개 문서를 끝없이 덮어쓰기)는 발생 안 해야 되는 거 아닌가요?」 — 공용 ../shared/쓰기지킴.js 부름(모듈보다 먼저): 옛 판이면 저장 멈춤·배지 빨강 · 같은 문서 10초 50번 넘게 쓰면 멈춤·배지 주황 · 같은 내용 10초 안 다시 쓰기 건너뜀. 페이지 코드는 그대로.
     v1.5.1(11-21): 사장님 「드롭다운칸이 입력칸과 약간의 거리를 두어야」 — 후보 목록(.vpd) = 검색 칸 아래 10px 띄움(전 2px) · 테두리·그림자 = 보드·영림원품목등록 드롭과 같은 꼴(#C7C7C3 · 0 4px 14px).
     v1.5.0(11-20): 사장님 「업체별단품명 양식 조혼가구형태로 다른거래처 모두 바꿔줘」 — 모든 업체 표 칸 = 조혼가구 칸(이름·차례 그대로). 다른 업체에만 있던 예외합판코드·예외필름코드는 안 보임(창고·엑셀은 그대로), 조혼가구 칸이 그 업체에 없으면 빈칸.
     v1.4.1(11-19): 사장님 「아 단품관리페이지가 나오라는게 아니라 이 단품관리의 검색창이 작게 나와서 검색후 드롭선택 가능하게 해달라고」 — 빨간 단품 누름이 벤더피아 단품관리 탭을 열던 것을 뺌. 칸 안 작은 검색창 + 드롭 목록만.
     v1.4.0(11-19): 사장님 「뻘건색 클릭시 해당 단품명 벤더피아 단품검색이 되어 선택시 해당 단품코드로 교체 되게 해주세요. 이전 단품코드는 변동전 자료로 죽은글씨로 남게 해주세요」
       — 빨간 단품 누름 = 그 칸이 단품 검색(이룸산업 「단품 추가」 와 같은 꼴·목록·실시간) → 고르면 교체(창고 발주역입력_업체별단품교체), 옛 단품코드·단품명은 아래 죽은 글씨(회색 줄그음). 원래 코드를 다시 고르면 교체 풀림.
     v1.3.1(11-19): 사장님 「판매중지도 약간 죽은느낌으로 보이게 해줘」 — 관련 상품에 판매중지 상품도(회색·옅게, 판매중 뒤, 까닭은 title). 자료 = 확장 0.35.7 이 중지까지 올린 납품내역_상품목록.
     v1.3.0(11-19): 사장님 「업체별 단품명에는 이 단품을 포함시키고 있는 상품명을 연결해줘야해 방법은 벤더피아연동의 단품명 버튼이 그대로 지금 이 표의 단품명에 나타나게 하면 된다. 그 단품안에는 관련상품이 연동되어 보이게 해뒀으니 맞지?」
       — 단품명 칸 = 벤더피아연동 단품 단추(shared/벤더피아단품단추.js), 누르면 단품 상세 + 「관련 상품」. 관련 상품 없는 단추는 빨간 글자, 까닭은 title.
     v1.2.2(11-19): 사장님 「유한가구로 되어 있는 모든 거래처를 진아산업으로 바꿔 줘. 유한가구 = 진아산업이야.」 — 업체 단추·칸 값의 「유한가구」 를 「진아산업」 으로 보임(창고·엑셀은 그대로).
     v1.2.1(11-19): 사장님 「모든 표의 첫 행을 고정해서 스크롤해도 사라지지 않게 해 줘.」 — 머리 줄(thead) 고정, 붙박이 첫 칸 모서리는 맨 위. 폰·낮은 화면은 표 상자 높이를 화면까지(상자 안에서 밀어야 머리가 남음).
     v1.2.0(11-18): 사장님 「두 자료가 상호 연결되도록」 — 단품코드가 영림원품목등록 「품목등록업로드」 제품(품목자산분류=제품) 품번에 있는 줄은 줄 색(.등록, title).
       두 창고를 onSnapshot 으로 실시간 구독(한쪽이 바뀌면 색이 따라 바뀜). 대조 = 앞뒤 빈칸 뺀 같은 글자.
     v1.1.3(11-18): 쪽길 여섯째 탭 「품목등록업로드」 → 「영림원품목등록」(영림원품목등록.html).
     v1.1.2(11-18): 쪽길 탭이 여섯이라 폰 폭에서 탭 이름이 낱말 중간에 끊겨 — 이름은 한 줄(nowrap), 넘치면 탭째 다음 줄.
     v1.1.1(11-18): 쪽길에 여섯째 탭 「품목등록업로드」.
     v1.0.0(11-18): 첫 판(같은 날 만든 「조혼가구 단품명」 조혼가구단품.html 을 바꿔 이은 것). 업체 단추(엑셀 A열 차례) → 그 업체 표 하나(처음엔 첫 업체).
       칸 이름·값은 그 업체 구간 머리 줄(B~O) 그대로. 기능 없음(목록만). 쪽길은 탭 「업체별 단품명」.
     v1.1.0(11-18): 사장님 「코드1차등록여부 최종수정여부 비고 사용합판코드 사용필름코드 예외부속코드(매칭필름코드) 예외부속코드(매칭원자재코드) 열 모두 삭제」 →
       읽기 도구가 그 이름의 칸을 빼고 창고에 다시 씀(이 쪽은 받은 칸 그대로 그림). 이름이 다른 예외합판코드·예외필름코드(유한·럭스·아인·본사)는 남김.

     ⚠ 값은 창고(artifacts/vivivic-4b7ef/public/data/발주역입력_업체별단품)에서 **읽기만** 한다.
        창고에 넣는 것은 tools/업체별단품읽기.py(드라이브 엑셀 → 창고). 공개 저장소라 업무 값은 이 파일에 없다.

/* vv1.2.2 사장님 11-19 「유한가구로 되어 있는 모든 거래처를 진아산업으로 바꿔 줘. 유한가구 = 진아산업이야.」 — 보이는 글만 바꿈(창고·원본 엑셀 사본은 그대로, 비교·열쇠는 원래 글자) */
const 별명 = v => typeof v==='string' ? v.replace(/유한가구/g,'진아산업') : v;
const 숫자칸 = new Set(['no']);
let 업체들 = [], 받은 = {}, 고른 = '', 답했나 = false;

const 글 = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');
function 목상태(큰,작,까닭){
  const el=document.getElementById('목상태'); el.style.display='block';
  el.innerHTML = `<div class="big">${큰}</div>` + (작?`<div class="sub">${작}</div>`:'') + (까닭?`<div class="why">${까닭}</div>`:'');
}
window.목록못읽음 = (큰,까닭) => { 답했나=true; 목상태(큰,'',까닭||''); };
setTimeout(() => { if(!답했나) 목상태('창고에 닿지 못했습니다'); }, 20000);

const 문서이름 = u => String(u).replace(/\//g,'／');

window.목록읽기 = async function(){
  try{
    const { doc, getDoc } = window.fbRead;
    const 목 = await getDoc(doc(window.db, ...창고자리, '_업체목록'));
    답했나 = true;
    업체들 = (목.exists() && 목.data().업체들) || [];
    if(!업체들.length){ 목상태('창고에 업체별 단품명이 없습니다'); return; }
    document.getElementById('목상태').style.display='none';
    document.getElementById('고름').innerHTML = 업체들.map(u => `<button class="chip" data-u="${글(u)}">${글(별명(u))}</button>`).join('');
    document.querySelectorAll('#고름 .chip').forEach(b => b.onclick = () => 업체고름(b.dataset.u));
    업체고름(업체들[0]);
    영림원구독();
    VP단품단추.읽기({ db: window.db, ...window.fbRead }).catch(() => {});
    교체구독();
  }catch(e){ window.목록못읽음('창고를 읽지 못했습니다', (e&&(e.code||e.message))||''); }
};

async function 업체고름(u){
  고른 = u;
  document.querySelectorAll('#고름 .chip').forEach(b => b.classList.toggle('on', b.dataset.u===u));
  const 속 = document.getElementById('속');
  if(받은[u]){ 그리기(받은[u]); return; }
  속.innerHTML = '<div class="state"><div class="big">읽는 중입니다…</div></div>';
  const { doc, onSnapshot } = window.fbRead;
  onSnapshot(doc(window.db, ...창고자리, 문서이름(u)), s => {
    받은[u] = s.exists() ? s.data() : { 칸:[], 줄:[] };
    if(고른 === u) 그리기(받은[u]);
  }, e => { if(고른===u) 속.innerHTML = `<div class="state"><div class="big">창고를 읽지 못했습니다</div><div class="why">${글((e&&(e.code||e.message))||'')}</div></div>`; });
}

/* 영림원품목등록 창고의 「품목등록업로드」 제품 품번 — 실시간. 바뀌면 색만 다시 칠한다. */
const 영림원자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_영림원품목등록'];
const 영림원시트 = '품목등록업로드';
let 등록품번 = new Set(), 조각값 = [], 조각끊기 = [];
function 영림원구독(){
  const { doc, onSnapshot } = window.fbRead;
  onSnapshot(doc(window.db, ...영림원자리, '_시트목록'), m => {
    const t = ((m.exists() && m.data().시트들) || []).find(x => x.이름===영림원시트);
    조각끊기.forEach(f => f()); 조각끊기 = []; 조각값 = [];
    if(!t){ 품번셈(t); return; }
    const 칸 = t.칸 || [], n = t.조각 || 1;
    조각값 = Array(n).fill(null);
    for(let k=0;k<n;k++){
      조각끊기.push(onSnapshot(doc(window.db, ...영림원자리, `${문서이름(영림원시트)}_${k+1}`), s => {
        조각값[k] = s.exists() ? (s.data().줄||[]) : [];
        if(조각값.every(x => x)) 품번셈(칸);
      }, () => {}));
    }
  }, () => {});
}
function 품번셈(칸){
  const pi = (칸||[]).indexOf('품번'), ai = (칸||[]).indexOf('품목자산분류');
  등록품번 = new Set();
  if(pi>=0 && ai>=0) for(const r of [].concat(...조각값)) if(String(r.v[ai]??'').trim()==='제품'){ const c = String(r.v[pi]??'').trim(); if(c) 등록품번.add(c); }
  색칠();
}
function 색칠(){
  document.querySelectorAll('#속 tr[data-code]').forEach(tr => {
    const on = 등록품번.has(tr.dataset.code);
    tr.classList.toggle('등록', on);
    if(on) tr.title = '영림원품목등록 품목등록업로드'; else tr.removeAttribute('title');
  });
}

/* v1.5.0 사장님 「업체별단품명 양식 조혼가구형태로 다른거래처 모두 바꿔줘」 — 모든 업체 표 = 조혼가구 칸(이름·차례). 칸 이름으로 맞춤, 그 업체에 없는 칸은 빈칸, 조혼가구에 없는 칸은 안 보임(창고 값은 그대로). */
const 기준업체 = '조혼가구';
let 기준구독 = false;
function 조혼양식(d){
  if(고른 === 기준업체) return d;
  const 기준 = 받은[기준업체];
  if(!기준){
    if(!기준구독){ 기준구독 = true;
      const { doc, onSnapshot } = window.fbRead;
      onSnapshot(doc(window.db, ...창고자리, 문서이름(기준업체)), s => {
        받은[기준업체] = s.exists() ? s.data() : { 칸:[], 줄:[] };
        if(받은[고른]) 그리기(받은[고른]);
      }, () => {});
    }
    return null;
  }
  const 기준칸 = 기준.칸 || [];
  if(!기준칸.length) return d;
  const 칸 = d.칸 || [], 자리 = 기준칸.map(k => 칸.indexOf(k));
  return { 칸: 기준칸, 줄: (d.줄 || []).map(r => ({ ...r, v: 자리.map(i => i >= 0 ? r.v[i] : null) })) };
}

function 그리기(d){
  d = 조혼양식(d);
  if(!d){ document.getElementById('속').innerHTML = '<div class="state"><div class="big">읽는 중입니다…</div></div>'; return; }
  const 칸 = d.칸 || [], 줄 = d.줄 || [];
  const 속 = document.getElementById('속');
  if(!줄.length){ 속.innerHTML = '<div class="state"><div class="big">줄 없음</div></div>'; return; }
  const ci = 칸.indexOf('단품코드'), ni = 칸.indexOf('단품명');
  let h = '<table class="dpr-t"><thead><tr>' +
    칸.map((k,i) => `<th class="${i===0?'dpr-k':''}">${글(k)}</th>`).join('') + '</tr></thead><tbody>';
  const 바뀜 = 교체[고른] || {};
  for(const r of 줄){
    const 옛코드 = ci>=0 ? String(r.v[ci]??'').trim() : '', 옛이름 = ni>=0 ? String(r.v[ni]??'').trim() : '';
    const x = 옛코드 && 바뀜[VP단품단추.키(옛코드)];   /* v1.4.0 교체된 단품 — 새 코드·이름, 옛 것은 죽은 글씨 */
    h += (ci>=0 ? `<tr data-code="${글(x ? x.새코드 : 옛코드)}">` : '<tr>') + 칸.map((k,i) => {
      const cls = (i===0?'dpr-k':'') + (숫자칸.has(k)?' num':'');
      /* v1.3.0 단품명 칸 = 벤더피아연동 단품 단추(단품코드가 있는 줄만) */
      let 값 = i===ni && 옛코드 && 옛이름 ? VP단품단추.단추글(x ? x.새코드 : 옛코드, x ? x.새이름 : 별명(옛이름)) : 글(별명(r.v[i]));
      if(x && i===ci) 값 = `${글(x.새코드)}<div class="죽음">${글(옛코드)}</div>`;
      if(x && i===ni) 값 += `<div class="죽음">${글(별명(옛이름))}</div>`;
      const 표 = i===ni && 옛코드 ? ` data-ok="${글(옛코드)}" data-on="${글(옛이름)}"` : '';
      return `<td${cls.trim()?` class="${cls.trim()}"`:''}${표}>${값}</td>`;
    }).join('') + '</tr>';
  }
  h += '</tbody></table>';
  const 옛통 = 속.querySelector('.표통'), 옛자리 = 옛통 && 옛통.dataset.u===고른 ? [옛통.scrollLeft, 옛통.scrollTop] : null;
  속.innerHTML = '<div class="표통">' + h + '</div>';
  const 통 = 속.querySelector('.표통'); 통.dataset.u = 고른;
  if(옛자리){ 통.scrollLeft = 옛자리[0]; 통.scrollTop = 옛자리[1]; }
  색칠();
  VP단품단추.칠하기(속);
}

/* ════ v1.4.0 빨간 단품 → 벤더피아 단품 검색 → 교체 ════
   교체 창고 `발주역입력_업체별단품교체` — 문서 = 업체(`/` → `／`) `{업체, 교체:{원래 단품코드(trim+소문자): {옛코드, 옛이름, 새코드, 새이름, 고친때}}}`.
   원래 업체별 단품 창고·엑셀은 안 고친다(엑셀을 다시 읽어 올려도 교체는 남음 — 원래 코드로 짝짓기). 원래 코드를 다시 고르면 그 교체를 지움.
   검색 목록 = 벤더피아연동이 올린 `납품내역_단품목록`(shared 가 이미 받은 것) + 이어진 벤더피아 탭이 있으면 실시간(`벤더피아실시간.js`) — 이룸산업 「단품 추가」 와 같은 길. 「중지」 단품은 후보에서 뺌. */
const 교체자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_업체별단품교체'];
let 교체 = {}, 다시그릴것 = false;
function 교체구독(){
  const { collection, onSnapshot } = window.fbRead;
  onSnapshot(collection(window.db, ...교체자리), s => {
    교체 = {}; s.forEach(d => { const x = d.data() || {}; if(x.업체) 교체[x.업체] = x.교체 || {}; });
    if(후보칸){ 다시그릴것 = true; return; }      /* 검색 중엔 표를 안 갈아 끼움 — 닫을 때 */
    if(받은[고른]) 그리기(받은[고른]);
  }, () => {});
}
const 실시간줄 = new Map(), 실시간본 = new Map(); let 실시간시계 = 0;
function 실시간묻기(input){
  const V = window.VP실시간; if(!V || !V.이어짐()) return;
  const 열쇠 = V.낱말(input.value).join('|'); if(!열쇠) return;
  const 앞 = 실시간본.get(열쇠); if(앞 && Date.now() - 앞 < 20000) return;
  clearTimeout(실시간시계);
  실시간시계 = setTimeout(() => {
    if(후보칸 !== input || V.낱말(input.value).join('|') !== 열쇠) return;
    실시간본.set(열쇠, Date.now());
    V.찾기(input.value).then(답 => {
      if(답 && 답.로그인) for(const [코드,이름='',상태=''] of 답.줄) if(코드) 실시간줄.set(VP단품단추.키(코드), {코드:String(코드), 이름:String(이름), 상태:String(상태)});
      if(답 && 후보칸 === input) 후보그리기(input);
    });
  }, 350);
}
if(window.VP실시간) VP실시간.이으면(() => { if(후보칸) 후보그리기(후보칸); });
function 검색목록(){
  const 본 = new Set(), 다 = [];
  for(const d of 실시간줄.values()){ 본.add(VP단품단추.키(d.코드)); 다.push(d); }
  for(const d of VP단품단추.단품목록()) if(!본.has(VP단품단추.키(d.코드))) 다.push(d);
  return 다.filter(d => d.상태 !== '중지').map(d => ({...d, 찾글:(d.이름+' '+d.코드).toLowerCase().replace(/\s+/g,'')}));
}
let 후보 = null, 후보칸 = null, 후보들 = [];
function 후보닫기(){
  if(후보){ 후보.remove(); 후보 = null; }
  후보칸 = null;
  다시그릴것 = false;
  if(받은[고른]) 그리기(받은[고른]);
}
const 화면끝 = () => window.visualViewport ? visualViewport.offsetTop + visualViewport.height : innerHeight;
function 후보자리(input){
  const 폭 = Math.min(380, innerWidth-16), r = input.getBoundingClientRect();
  const 왼 = Math.max(8, Math.min(r.left, innerWidth-폭-8)), 위 = r.bottom + 10;
  Object.assign(후보.style, {left:왼+'px', top:위+'px', width:폭+'px', maxHeight:Math.max(60, Math.min(280, 화면끝()-8-위))+'px'});
}
function 후보그리기(input){
  if(!후보){ 후보 = document.createElement('div'); 후보.className = 'vpd'; document.body.appendChild(후보);
    후보.addEventListener('pointerdown', e => e.preventDefault());
    후보.addEventListener('click', e => { const d = e.target.closest('div[data-i]'); if(d && 후보칸) 고르기(후보칸, 후보들[+d.dataset.i]); }); }
  후보칸 = input; 후보자리(input);
  const 목 = 검색목록();
  if(!목.length){ 후보들 = []; 후보.innerHTML = '<div class="msg">단품 목록을 읽는 중…</div>'; return; }
  실시간묻기(input);
  const 낱 = input.value.toLowerCase().split(/\s+/).filter(Boolean);
  후보들 = [];
  if(낱.length) for(const d of 목){ if(낱.every(w => d.찾글.includes(w))){ 후보들.push(d); if(후보들.length >= 50) break; } }
  let t = '';
  if(낱.length && !후보들.length){
    const 조 = [...new Set(input.value.toLowerCase().match(/[가-힣]+|[0-9]+|[a-z]+/g)||[])].filter(w => w.length >= 2);
    const 점 = [];
    목.forEach((d,j) => { let n=0, k=''; for(const w of 조){ const y = d.찾글.includes(w); if(y) n++; k += y?'1':'0'; } if(n) 점.push({d,n,k,j}); });
    점.sort((a,b) => b.n-a.n || (a.k<b.k?1:a.k>b.k?-1:0) || a.j-b.j);
    후보들 = 점.slice(0,50).map(x => x.d);
    if(후보들.length) t += '<div class="msg">다 맞는 단품 없음 — 비슷한 순</div>';
  }
  if(!낱.length) t += '<div class="msg">단품명 · 단품코드를 치세요</div>';
  else if(!후보들.length) t += '<div class="msg">맞는 단품 없음</div>';
  t += 후보들.map((d,i) => `<div data-i="${i}" class="${i===0?'on':''}">${글(d.이름)}<span class="cd">${글(d.코드)}${d.상태&&d.상태!=='판매중'?' · '+글(d.상태):''}</span></div>`).join('');
  후보.innerHTML = t;
}
function 고르기(input, d){
  if(!d) return;
  const td = input.closest('td'), 옛코드 = td.dataset.ok, 옛이름 = td.dataset.on, k = VP단품단추.키(옛코드), u = 고른;
  const { doc, setDoc, deleteField } = window.fbRead;
  const 값 = VP단품단추.키(d.코드) === k ? deleteField()
    : { 옛코드, 옛이름, 새코드: d.코드.trim(), 새이름: d.이름, 고친때: new Date().toISOString() };
  setDoc(doc(window.db, ...교체자리, 문서이름(u)), { 업체: u, 교체: { [k]: 값 } }, { merge: true })
    .catch(e => alert('저장하지 못했습니다 ' + ((e && (e.code || e.message)) || '')));
  후보칸 = null; input.blur(); 후보닫기();
}
VP단품단추.빨강누름 = (b) => {
  const td = b.closest('td'); if(!td || !td.dataset.ok) return;
  /* v1.4.1 사장님 「단품관리페이지가 나오라는게 아니라 … 검색창이 작게 나와서 검색후 드롭선택」 — 벤더피아 단품관리 탭을 열지 않는다(VP실시간.열기 안 부름). 이미 이어진 탭이 있을 때만 실시간을 덧씀 */
  td.innerHTML = '<div class="vk"><input type="search" placeholder="단품 검색" autocomplete="off" enterkeyhint="search"></div>';
  const input = td.querySelector('input');
  input.value = String(b.dataset.vpn || '').replace(/\s+/g,' ').trim();
  input.focus(); input.select();
  후보그리기(input);
};
document.addEventListener('input', e => { if(e.target.matches('.vk input')) 후보그리기(e.target); });
document.addEventListener('focusout', e => { if(e.target.matches('.vk input')) setTimeout(() => { if(후보칸 === e.target && document.activeElement !== e.target) 후보닫기(); }, 0); });
document.addEventListener('keydown', e => {
  if(!e.target.matches('.vk input')) return;
  if(e.key === 'Escape'){ 후보칸 = null; e.target.blur(); 후보닫기(); }
  else if(e.key === 'Enter' && 후보들.length && e.target.value.trim()){ e.preventDefault(); 고르기(e.target, 후보들[0]); }
});
window.addEventListener('resize', () => { if(후보칸) 후보칸.blur(); });
document.addEventListener('scroll', () => { if(후보 && 후보칸) 후보자리(후보칸); }, true);
</script>
</body>
</html>
