<!DOCTYPE html>
<!-- 발주역입력 / 조혼가구 단품명 — 「업체별단품명」 엑셀(시트 「업체별단품코드」)에서 매입처가 「조혼가구」 인 줄만 표 하나로 본다.
     사장님 11-18: 「폴더에 업체별단품명 파일의 A열이 조혼가구인 것만 목록으로 보여지게 해줘.」 (A열은 no — 업체는 C열 「매입처」)
     판 번호는 머리의 배지와 같다. 고칠 때 둘을 같이 올린다: v1.0.0
     v1.0.0(11-18): 첫 판. 월 구분 없음 → 단추 없이 표 하나. 칸 이름·값은 엑셀 5행 머리(A~N) 그대로. 기능 없음(목록만).

     ⚠ 값은 창고(artifacts/vivivic-4b7ef/public/data/발주역입력_조혼단품/목록)에서 **읽기만** 한다.
        창고에 넣는 것은 tools/조혼단품읽기.py(드라이브 엑셀 → 창고). 공개 저장소라 업무 값은 이 파일에 없다.
     겉꼴은 로앤.html · 이룸산업.html · 재단.html(셀 모양 표 · 화면 높이 표 상자)과 같다. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조혼가구 단품명 — 발주역입력</title>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
    const app = initializeApp({
        apiKey: "AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",
        authDomain: "vivivic-4b7ef.firebaseapp.com",
        projectId: "vivivic-4b7ef",
        storageBucket: "vivivic-4b7ef.firebasestorage.app",
        messagingSenderId: "830175660542",
        appId: "1:830175660542:web:9054030480c8280af8d8af"
    });
    const auth = getAuth(app);
    window.db = getFirestore(app);
    window.fbRead = { doc, getDoc };
    onAuthStateChanged(auth, (u) => {
        if (!u) { signInAnonymously(auth).catch(e => window.목록못읽음('창고에 들어가지 못했습니다', (e&&(e.code||e.message))||'')); return; }
        window.목록읽기();
    });
</script>

<style>
/* 재단.html 과 같은 값 — 값을 새로 짓지 마라. */
:root{
  --vg-bg:#fff; --vg-ink:#111110; --vg-body:#1A1A19;
  --vg-muted:#9C9C98; --vg-edge:#E2E2DF; --vg-fill:#F4F4F2; --vg-red:#FF3B30;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--vg-bg);color:var(--vg-body);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding:16px 0 2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:13px;color:var(--vg-muted)}
.logo b{font-size:15px;font-weight:800;letter-spacing:3.2px;color:var(--vg-ink);margin-right:4px}
.badge{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--vg-ink);
  border:1px solid var(--vg-ink);border-radius:999px;padding:3px 9px}
.쪽길{display:flex;gap:16px;padding:8px 0 0;border-bottom:1px solid var(--vg-edge)}
.쪽길 a{font-size:13px;font-weight:600;color:var(--vg-muted);text-decoration:none;padding:4px 0 7px;margin-bottom:-1px;border-bottom:2px solid transparent}
.쪽길 a:hover{color:var(--vg-ink)}
.쪽길 a.on{color:var(--vg-ink);font-weight:800;border-bottom-color:var(--vg-ink)}
.쪽길+h1{padding-top:14px}
h1{font-size:30px;line-height:1.1;letter-spacing:-1.2px;font-weight:700;color:var(--vg-ink);padding:4px 0 12px}
/* 쪽은 화면 높이 — 화면 전체 막대 없이 표 상자 안에서만 위아래·옆으로 민다(가로 막대가 늘 보는 화면 아래). */
html,body{height:100%;overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none}
.wrap::-webkit-scrollbar{display:none}
.wrap>*{flex-shrink:0}
.wrap>#속{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
#속>.표통{flex:1 1 auto;min-height:0}
@media (max-width:600px),(max-height:600px){.wrap>#속{flex:1 0 auto} #속>.표통{flex:1 0 240px}}
.표통{overflow:auto;-webkit-overflow-scrolling:touch;background:var(--vg-bg)}
@supports not selector(::-webkit-scrollbar){.표통{scrollbar-width:thin;scrollbar-color:#C7C7C3 var(--vg-fill)}}
.표통::-webkit-scrollbar{width:10px;height:10px}
.표통::-webkit-scrollbar-track,.표통::-webkit-scrollbar-corner{background:var(--vg-fill)}
.표통::-webkit-scrollbar-thumb{background:#C7C7C3;border-radius:10px}
/* 표 — 재단.html 셀 모양(v1.1.0) 그대로 */
.dpr-t{width:max-content;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;
  border-top:1px solid #C7C7C3;border-left:1px solid #C7C7C3}
.dpr-t th,.dpr-t td{border-right:1px solid #D6D6D3;border-bottom:1px solid #D6D6D3;white-space:nowrap}
.dpr-t th{font-size:11.5px;font-weight:800;line-height:1.3;color:var(--vg-ink);text-align:center;vertical-align:middle;
  padding:4px 5px;background:var(--vg-fill);border-bottom:1px solid #C7C7C3}
.dpr-t td{font-size:11.5px;line-height:1.3;color:var(--vg-body);padding:2px 5px;vertical-align:top;background:var(--vg-bg)}
.dpr-t td.num{text-align:right}
.dpr-t .dpr-k{position:sticky;left:0;z-index:1;font-weight:700;color:var(--vg-ink)}
.dpr-t th.dpr-k{background:var(--vg-fill)}
.state{background:var(--vg-fill);border-radius:14px;padding:22px 16px;text-align:center;margin-top:12px}
.state .big{font-size:14px;font-weight:600;color:var(--vg-ink);padding-bottom:6px}
.state .sub{font-size:12.5px;color:var(--vg-muted);line-height:1.85}
.state .why{font-size:11.5px;color:var(--vg-red);padding-top:6px;font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><b>VIVIVIC</b> — 발주역입력</div>
  <div class="badge">v1.0.0</div>
</header>
<nav class="쪽길"><a href="재단.html">재단 세부내역</a><a href="보드매입현황.html">보드/엣지 매입현황</a><a href="이룸산업.html">이룸산업 출고내역</a><a href="로앤.html">로앤 출고내역</a><a href="조혼가구단품.html" class="on">조혼가구 단품명</a></nav>
<h1>조혼가구 단품명</h1>
<div class="state" id="목상태"><div class="big">창고를 읽는 중입니다…</div></div>
<div id="속"></div>
</div>

<!-- 짚어서 지시하는 손잡이 — 바이글 박스에서 열면 켜진다. -->
<script src="../shared/viggle.js"></script>

<script>
const 창고자리 = ['artifacts','vivivic-4b7ef','public','data','발주역입력_조혼단품','목록'];
const 숫자칸 = new Set(['no']);
let 답했나 = false;

const 글 = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');
function 목상태(큰,작,까닭){
  const el=document.getElementById('목상태'); el.style.display='block';
  el.innerHTML = `<div class="big">${큰}</div>` + (작?`<div class="sub">${작}</div>`:'') + (까닭?`<div class="why">${까닭}</div>`:'');
}
window.목록못읽음 = (큰,까닭) => { 답했나=true; 목상태(큰,'',까닭||''); };
setTimeout(() => { if(!답했나) 목상태('창고에 닿지 못했습니다'); }, 20000);

window.목록읽기 = async function(){
  try{
    const { doc, getDoc } = window.fbRead;
    const s = await getDoc(doc(window.db, ...창고자리));
    답했나 = true;
    const d = s.exists() ? s.data() : null;
    if(!d || !(d.줄||[]).length){ 목상태('창고에 조혼가구 단품명이 없습니다'); return; }
    document.getElementById('목상태').style.display='none';
    그리기(d);
  }catch(e){ window.목록못읽음('창고를 읽지 못했습니다', (e&&(e.code||e.message))||''); }
};

function 그리기(d){
  const 칸 = d.칸 || [], 줄 = d.줄 || [];
  let h = '<table class="dpr-t"><thead><tr>' +
    칸.map((k,i) => `<th class="${i===0?'dpr-k':''}">${글(k)}</th>`).join('') + '</tr></thead><tbody>';
  for(const r of 줄){
    h += '<tr>' + 칸.map((k,i) => {
      const cls = (i===0?'dpr-k':'') + (숫자칸.has(k)?' num':'');
      return `<td${cls.trim()?` class="${cls.trim()}"`:''}>${글(r.v[i])}</td>`;
    }).join('') + '</tr>';
  }
  h += '</tbody></table>';
  document.getElementById('속').innerHTML = '<div class="표통">' + h + '</div>';
}
</script>
</body>
</html>
