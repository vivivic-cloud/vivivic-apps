     사장님 11-28: 「나중에 확인할 질문 트리가 필요한데?」 → 「질문 트리는 새 페이지로 열리게 하고, 실제로 트리 구조가 보여야지. 이게 뭐야」

     v1.0.0(11-28): 첫 판. 뿌리 입력폼(메뉴 박스 › 메뉴) · 발주역입력(묶음 › 페이지 › 탭) — 선(├ └)·들여쓰기 · ▸/▾ 접기 · 자리마다 대기(노랑)·답함(파랑)·실행함(초록) 수 ·
       누르면 오른쪽 = 그 자리(밑 가지 포함) 질문(대기 답 칸 · 지난 질문) + 그 자리 링크.
