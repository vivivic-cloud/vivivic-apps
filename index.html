<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIVIVIC — Apps</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1a1a1a;color:#c8c8c8;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
.wrap{max-width:800px;margin:0 auto;padding:0 40px}

header{padding:40px 0 28px}
.logo{font-size:13px;color:#444;letter-spacing:.18em;text-transform:uppercase}
.logo b{color:#fff;font-weight:500}
hr.rule{border:none;border-top:1px solid #222}
.sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#2e2e2e;padding:14px 0 40px;text-align:right}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#1e1e1e;border:1px solid #1e1e1e;margin-bottom:1px}

.card{background:#1a1a1a;padding:32px 28px;text-decoration:none;display:block;transition:background .15s;position:relative;overflow:hidden}
.card:hover{background:#1e1e1e}
.card:hover .arrow{color:#555}
.card-num{font-size:10px;color:#252525;letter-spacing:.14em;margin-bottom:20px}
.card-title{font-size:15px;color:#d0d0d0;font-weight:400;margin-bottom:8px;letter-spacing:.01em}
.card-desc{font-size:11px;color:#303030;line-height:1.7;letter-spacing:.03em}
.arrow{position:absolute;bottom:24px;right:24px;font-size:11px;color:#232323;transition:color .15s;letter-spacing:.06em}

@media(max-width:560px){
  .wrap{padding:0 20px}
  .grid{grid-template-columns:1fr}
}

footer{padding:20px 0;margin-top:0;font-size:10px;color:#222;letter-spacing:.06em;border-top:1px solid #1e1e1e;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><b>VIVIVIC</b> — Apps</div>
  </header>
  <hr class="rule">
  <div class="sub">도구 모음 ▶</div>

  <div class="grid">
    <a class="card" href="https://vivivic-cloud.github.io/chinese-book-analyzer/" target="_blank">
      <div class="card-num">01</div>
      <div class="card-title">중국어.분석기</div>
      <div class="card-desc">책 페이지 사진을 올리면<br>문장·단어·문법을 분석</div>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="https://vivivic-cloud.github.io/furniture-designer/" target="_blank">
      <div class="card-num">02</div>
      <div class="card-title">가구.디자이너</div>
      <div class="card-desc">가구 디자인 도구</div>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="https://vivivic-cloud.github.io/furniture-order-tool/" target="_blank">
      <div class="card-num">03</div>
      <div class="card-title">가구.주문</div>
      <div class="card-desc">가구 주문 관리 도구</div>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="https://vivivic-cloud.github.io/sentend/" target="_blank">
      <div class="card-num">04</div>
      <div class="card-title">Sentend</div>
      <div class="card-desc">문장 전송 도구</div>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="https://vivivic-cloud.github.io/lang-practice/" target="_blank">
      <div class="card-num">05</div>
      <div class="card-title">언어.연습</div>
      <div class="card-desc">언어 학습 연습 도구</div>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="https://vivivic-cloud.github.io/vivivic-apps/vivivic_sync.html" target="_blank">
      <div class="card-num">06</div>
      <div class="card-title">VIVIVIC Sync</div>
      <div class="card-desc">CS 관리 · 반품 · 주문 통합</div>
      <span class="arrow">→</span>
    </a>
  </div>

  <footer>
    <span>vivivic-cloud</span>
    <span>powered by Claude</span>
  </footer>
</div>
</body>
</html>
