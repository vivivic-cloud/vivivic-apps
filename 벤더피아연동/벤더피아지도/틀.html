<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>벤더피아 지도</title>
<style>
  :root { --ink: #37352f; --muted: #787774; --fill: #f1f1ef; --line: #e3e2e0; --bg: #fff; --card: #fbfbfa; --hit: #fff3bf; --link: #337ea9; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #e6e6e3; --muted: #9b9a97; --fill: #2f2f2d; --line: #3a3a38; --bg: #191919; --card: #202020; --hit: #5c4d12; --link: #6fb3d8; }
  }
  :root[data-theme="dark"] { --ink: #e6e6e3; --muted: #9b9a97; --fill: #2f2f2d; --line: #3a3a38; --bg: #191919; --card: #202020; --hit: #5c4d12; --link: #6fb3d8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: Inter, -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 14px; line-height: 1.6; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; font-weight: 900; white-space: nowrap; cursor: pointer; }
  #찾기 { flex: 1 1 220px; min-width: 0; padding: 8px 12px; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  #수 { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .틀 { display: grid; grid-template-columns: 260px minmax(0, 1fr); }
  nav { position: sticky; top: 59px; align-self: start; height: calc(100vh - 59px); overflow-y: auto; border-right: 1px solid var(--line); padding: 8px; background: var(--card); }
  nav h2 { margin: 12px 8px 4px; font-size: 12px; font-weight: 800; color: var(--muted); }
  nav a { display: block; padding: 3px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13px; }
  nav a:hover { background: var(--fill); }
  nav a.켬 { background: var(--fill); font-weight: 700; }
  nav i { font-style: normal; font-size: 10px; color: var(--muted); margin-left: 4px; }
  main { min-width: 0; padding: 16px 24px 56px; max-width: 1100px; }
  main h1 { font-size: 22px; font-weight: 900; margin: 4px 0 10px; }
  main h2 { font-size: 15px; font-weight: 900; margin: 24px 0 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  main h3 { font-size: 13px; font-weight: 800; margin: 14px 0 6px; }
  main p, main ul { margin: 6px 0; }
  main ul { padding-left: 18px; }
  code { padding: 1px 5px; border-radius: 5px; background: var(--fill); font-size: 12.5px; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  .표통 { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th { text-align: left; background: var(--fill); font-weight: 800; white-space: nowrap; }
  th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tr.짚음 td { background: var(--hit); }
  mark { background: var(--hit); color: inherit; }
  .결과 { display: block; padding: 6px 8px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 12.5px; }
  .결과:hover { background: var(--fill); }
  .결과 b { display: block; font-size: 12px; color: var(--link); }
  .없음 { color: var(--muted); padding: 16px 0; }
  main a { color: var(--link); }
  @media (max-width: 760px) {
    .틀 { grid-template-columns: minmax(0, 1fr); }
    nav { position: static; height: auto; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 12px 16px 48px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="집">벤더피아 지도</h1>
  <input id="찾기" type="search" placeholder="버튼·칸 이름·주소로 찾기 (예: btnSearch, 저장, csDetl, tbQty)" autocomplete="off">
  <span id="수"></span>
</header>
<div class="틀">
  <nav id="차례"></nav>
  <main id="본문"></main>
</div>
<script>
const 문서 = /*자료*/[];
const 칸 = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const 안글 = (s) => 칸(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
  .replace(/\[([^\]]+)\]\(([^)\s]+\.md)\)/g, (m, 글, 곳) => `<a href="#${encodeURIComponent(곳.split('/').pop())}">${글}</a>`);
function 그리기(글) {
  const 줄 = 글.split('\n'); let 밖 = '', i = 0;
  while (i < 줄.length) {
    const l = 줄[i];
    if (l.startsWith('|')) {
      const 묶 = []; while (i < 줄.length && 줄[i].startsWith('|')) 묶.push(줄[i++]);
      const 칸들 = (r) => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map((x) => x.trim());
      밖 += '<div class="표통"><table><thead><tr>' + 칸들(묶[0]).map((x) => `<th>${안글(x)}</th>`).join('') + '</tr></thead><tbody>'
        + 묶.slice(2).map((r) => '<tr>' + 칸들(r).map((x) => `<td>${안글(x)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if (l.startsWith('- ')) {
      밖 += '<ul>'; while (i < 줄.length && 줄[i].startsWith('- ')) 밖 += `<li>${안글(줄[i++].slice(2))}</li>`; 밖 += '</ul>';
      continue;
    }
    const 머리 = l.match(/^(#{1,3}) (.*)/);
    if (머리) 밖 += `<h${머리[1].length}>${안글(머리[2])}</h${머리[1].length}>`;
    else if (l.trim()) 밖 += `<p>${안글(l)}</p>`;
    i++;
  }
  return 밖;
}
const 본문 = document.getElementById('본문'), 찾기 = document.getElementById('찾기'), 수 = document.getElementById('수');
function 차례그리기(켠) {
  let 밖 = '', 묶음 = '';
  for (const d of 문서) {
    if (d.g !== 묶음) { 묶음 = d.g; 밖 += `<h2>${칸(묶음)}</h2>`; }
    const 이름 = d.t.includes(' > ') ? d.t.split(' > ').slice(1).join(' > ') : d.t;
    const 표 = d.s && d.s !== '확인함' ? `<i>${칸(d.s)}</i>` : '';
    밖 += `<a href="#${encodeURIComponent(d.f)}" class="${d.f === 켠 ? '켬' : ''}">${칸(이름)}${표}</a>`;
  }
  document.getElementById('차례').innerHTML = 밖;
}
function 열기(f, 낱말) {
  const d = 문서.find((x) => x.f === f) || 문서[0];
  본문.innerHTML = 그리기(d.b); 차례그리기(d.f); 수.textContent = `화면 ${문서.length - 2}개`;
  if (낱말) {
    const 소 = 낱말.toLowerCase();
    const 줄 = [...본문.querySelectorAll('tr')].find((t) => t.textContent.toLowerCase().includes(소));
    if (줄) { 줄.classList.add('짚음'); 줄.scrollIntoView({ block: 'center' }); return; }
  }
  scrollTo(0, 0);
}
function 찾아보기(q) {
  const 낱말 = q.toLowerCase().split(/\s+/).filter(Boolean), 결과 = [];
  for (const d of 문서) {
    if (d.f === '목차.md') continue;
    if (낱말.every((w) => d.t.toLowerCase().includes(w))) 결과.push([d, d.t, '']);
    for (const l of d.b.split('\n')) {
      if (l.startsWith('|---') || l.startsWith('# ')) continue;
      const 소 = l.toLowerCase();
      if (낱말.every((w) => 소.includes(w))) 결과.push([d, l, 낱말[0]]);
    }
  }
  수.textContent = `찾은 줄 ${결과.length}개`;
  if (!결과.length) { 본문.innerHTML = '<p class="없음">찾는 글이 없습니다.</p>'; return; }
  const 빛 = new RegExp('(' + 낱말.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  본문.innerHTML = 결과.slice(0, 300).map(([d, l, w]) => {
    const 글 = 칸(l.replace(/^\||\|$/g, '').replace(/\|/g, ' · ').replace(/`/g, '').slice(0, 220)).replace(빛, '<mark>$1</mark>');
    return `<a class="결과" href="#${encodeURIComponent(d.f)}" data-w="${칸(w)}"><b>${칸(d.t)}</b>${글}</a>`;
  }).join('') + (결과.length > 300 ? '<p class="없음">앞 300줄만 보입니다. 낱말을 더 넣으세요.</p>' : '');
}
let 대기 = '';
본문.addEventListener('click', (e) => { const a = e.target.closest('.결과'); if (a) 대기 = a.dataset.w; });
찾기.addEventListener('input', () => { const q = 찾기.value.trim(); if (q) 찾아보기(q); else 열기(decodeURIComponent(location.hash.slice(1))); });
document.getElementById('집').onclick = () => { 찾기.value = ''; location.hash = ''; 열기('목차.md'); };
addEventListener('hashchange', () => { 열기(decodeURIComponent(location.hash.slice(1)), 대기); 대기 = ''; });
열기(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
