위화면_메인_첫화면_confirmOrder.md) |\n| `WebSvcBarcode.asmx` | [단품(쿠팡)관리](화면/Master_단품_쿠팡_관리.md) · [단품(오집)관리](화면/Master_단품_오집_관리.md) |\n| `WebSvcInspection.asmx` | [StockInspectionForUser](화면/하위화면_Lot재고관리_StockInspectionForUser.md) |\n| `WebSvcLotBarcode.asmx` | 공통 7개 화면 |\n| `WebSvcOrderOption.asmx` | [confirmOrder](화면/하위화면_메인_첫화면_confirmOrder.md) |\n| `WebSvcQRPrint.asmx` | [단품QR출력](화면/Master_단품QR출력.md) |\n| `WebSvcStock.asmx` | [confirmOrder](화면/하위화면_메인_첫화면_confirmOrder.md) · [QRStock](화면/하위화면_예외입고_QRStock.md) |\n| `yearlySalesResult.aspx` | [메인 틀](화면/메인_틀.md) · [연도별](화면/경영정보_연도별.md) |\n| `YearlyTotAmt.aspx` | [메인 틀](화면/메인_틀.md) · [연매출누계](화면/경영정보_연매출누계.md) |\n"}, {"f": "공통.md", "t": "공통 — 모든 화면이 같이 쓰는 것", "g": "안내", "b": "# 공통 — 모든 화면이 같이 쓰는 것\n\n확인한 날: 2026-11-07. 실제 화면과 벤더피아 공용 글(`/js/common.js`·`/js/commonJQ.js`·`/js/accountGuard.js`·`/js/vpCookie.js`)을 읽어 적었다.\n\n## 틀\n\n- 로그인 뒤 맨 위 문서는 `/index.aspx`. 왼쪽 메뉴와 머리 단추가 있고, 화면은 `iframe#icontentFrame` 안에 뜬다. (⚠ `벤더피아연동/CLAUDE.md` 의 「메인은 frameset」 설명과 다르다. 2026-11-07 원래 화면에서 재면 `<body>` + `iframe#icontentFrame` 이다.)\n- 메뉴 단추: `GoUrl(주소, 메뉴id)` = `$('#icontentFrame').attr('src', 주소)` 후 왼쪽 메뉴 불을 옮긴다. 쪽 전체는 안 바뀐다.\n- 머리 단추(jQuery click, `index.aspx`): `#lnkOrderUpload` 주문등록 → `System/Upload/oRowInsert.aspx` · `#lnkOrderProcess` 주문확정 → `System/Sales/confirmOrder.aspx` · `#lnkDeliveryReg` 송장등록 → `System/Delivery/confirmDv.aspx` · `#lnkCSReg` CS등록 → `System/CS/csDetl.aspx?previousPage=first` · `#lnkKakaoAmt` 잔액 → `/System/Kakao/ChargeHistory.aspx` · `#newTab` 새탭(지금 주소를 새 탭) · `#lnkHelp` 도움말 · `#lnkUserMsg` 관리자 메시지(서랍) · `#btnLogout`·`#btnMLogout` LOGOUT → `LogOut.aspx`.\n\n## 쪽의 꼴\n\n- ASP.NET WebForms. 폼은 거의 `form#aspnetForm` 하나, POST 자기 주소, 칸 이름 앞머리는 `ctl00$Contents$`.\n- 숨은 값 공통: `__EVENTTARGET` · `__EVENTARGUMENT` · `__VIEWSTATE` · `__VIEWSTATEGENERATOR` · `__EVENTVALIDATION` · `ctl00$hdKey` · `ctl00$hWidth` · `ctl00$hMobile` · `oGrid_clientState`.\n- 조회 단추는 대개 `input[type=image]#btnSearch`(`icon_hit.gif`) 로 **폼 제출**이다. 요청에 `ctl00$Contents$btnSearch.x/.y` 가 붙는다. 엑셀은 `#btnExcel`, 쪽 넘김은 `#Pager1`(`__doPostBack('ctl00$Contents$Pager1$ctl…')` 와 Next·Last 그림 단추).\n- 쪽당 줄 수 `ddlRowCnt`: 고르면 바로 다시 조회한다(`__doPostBack` 또는 `$('#btnSearch').click()`).\n- 화면마다 `jScript()` 함수에서 jQuery 로 단추에 click 을 단다. 그래서 `onclick` 속성만 봐서는 동작을 모른다. 이 지도의 「동작」 칸은 달린 jQuery 처리 글까지 읽은 것이다.\n- UpdatePanel 이 있는 화면은 조회가 부분 다시 그리기다. 각 화면 파일의 「비동기」 줄을 본다.\n- `$('#aspnetForm').submit` 이면 `#divloading`(돌림 표시)을 켠다. `excel` 속성이 있는 단추는 켜지 않는다.\n- 달력 칸은 Infragistics 공용 달력(`table#ctl00__ig_def_dp_cal.igmc_Control`)을 같이 쓴다. ⚠ 표를 찾을 때 이 달력을 목록으로 잡지 마라.\n\n## 그리드 (Infragistics WebDataGrid)\n\n- `div#oGrid.ig_Control.igg_Control`. 머리와 몸이 서로 다른 `table` 이다.\n- 자바스크립트로 `$find('oGrid')` → `.get_columns()`(`get_key`·`get_headerText`·`get_hidden`) · `.get_rows()`(`get_row(i)`·`get_cellByColumnKey(열키)`) 로 읽는다. 화면 파일의 열 이름은 `머리글(열키)` 꼴이다.\n- 숨은 열은 사용자 칸 설정으로 바뀔 수 있다. 박지 말고 그때그때 `get_hidden()` 또는 머리 th 의 computed display 로 가른다.\n- 줄 누름: 많은 화면이 `oGrid_CellSelectionChanged` 로 상세 화면에 간다. `CHK` 칸을 누른 것이면 가지 않는다.\n- 체크: `CHK` 열. 줄 안 체크상자는 대개 `ctl00$Contents$oGrid$it…$chkItem`. 머리 `chkALL` = `CheckAllChkItems(this)`.\n- ⚠ 체크가 바로 서버로 가는 화면이 있다(csDetl 의 주문 그리드 등). 화면 파일을 보고, 모르면 체크하지 마라.\n\n## 화면 사이 이동\n\n- `SetSearchCondition(주소)`: `#divSearch`·`#divCondition` 안의 칸 값과 `hdCurrentPage` 를 `▥` 로 이어 `?SearchCondition=…` 로 붙인다. 상세에서 돌아올 때 `ReturnSearchCondition(주소)` 가 그대로 돌려준다.\n- 팝업: `fnShowPopup()` = `#iFramePopup` 에 `src` 를 넣은 뒤 `#dialogPopup` jQuery UI 대화창(너비 1250). `fnShowModal(제목, 주소, 크기)` = `#modalPopupiFrame` + 부트스트랩 모달. `window.open` 팝업도 있다.\n- `sendPost(action, params)`: 숨은 폼을 만들어 POST. `sendPrint(action, params)`: `PrintViewer` 창에 POST(출력).\n- 값을 고르는 팝업은 부모의 `getReturnValue` 를 부른다(`ordersPopup.aspx` 등).\n\n## 계정·세션\n\n- 쿠키 `VP_Cookie` 는 값 단위 암호화. `getServerCookie('VP_Cookie', 'LOGON_EMP_VCD')` 등이 `vpCookie.js` 로 푼다.\n- `accountGuard.js`(2026-10-13): 브라우저당 한 계정. 쪽의 `window.VP_PAGE_ACCOUNT` 와 쿠키를 비교해 다르면 index 를 다시 연다.\n- 벤더피아는 한 로그인의 요청을 하나씩 처리한다(ASP.NET 세션 잠금). 잰 값은 `벤더피아연동/CLAUDE.md` 의 「이동 느림」 쪽. 뒤에서 요청을 겹쳐 보내면 사람 화면이 밀린다.\n\n## 다시 재는 법\n\n- 확장 없는 원래 화면: 새 탭에서 `window.name=\"vp원본\"; sessionStorage.setItem(\"vp원본\",\"1\"); location.reload()`.\n- 이 지도는 그 탭에서 각 화면을 `sandbox=\"allow-same-origin allow-scripts\"` iframe 으로 열어 읽었다. allow-forms·allow-modals·allow-popups 가 없어 폼 제출·알림창·새 창이 원래부터 막힌다. **단추를 하나도 누르지 않았다.**\n- 재기 전 메뉴: 왼쪽 메뉴 a 의 `onclick=\"GoUrl(…)\"` 전체.\n\n## 기존 기록과 대조 (2026-11-07)\n\n`벤더피아연동/CLAUDE.md` 의 내용을 실제 화면으로 다시 봤다.\n\n| 항목 | 기록 | 실제 | 판단 |\n|---|---|---|---|\n| 메인 구조 | 틀(frameset) | `<body>` + `iframe#icontentFrame` | **다름.** 틀 안 글(`all_frames`)은 iframe 에도 그대로 듣는다 |\n| 주문관리 머리 수 | 69칸 | 69칸(열 키는 [주문관리](화면/판매관리_주문관리.md)) | 같음 |\n| 주문관리 보이는 칸 | 32칸 | 34칸. 상품명·단품구성이 더 보임 | **다름.** 칸 설정이 바뀐 것으로 보임. 기록대로 그때그때 display 로 가르면 된다 |\n| 주문관리 폼·조회 | `ddlRowCnt`·`btnSearch`·`#Pager1`·검색 칸 | 같은 이름. 줄 수 10·30·50·100·150·200·250·300·350·400·500·700 | 같음(「10~500·700」 의 사이 값까지 확인) |\n| 주문관리 줄 누름 | (기록 없음) | 빈 칸 누르면 `orderDetl.aspx`. 조건은 `oGrid_CellSelectionChanged` | 새로 앎 |\n| csDetl 폼 | multipart, action `./csDetl.aspx?previousPage=first` | 같음 | 같음 |\n| csDetl 처음 탭 | first·CS = 고객주문변경, inquiry = 고객문의 | `li2`, inquiry 만 `li1` | 같음 |\n| csDetl 유형 | 잇기 전 `1=취소` 하나 | 빈 쪽 `ddlCsType` = `1=취소` 하나, 기존 건은 1~5 | 같음 |\n| csDetl 사유 | `ddlReason` 기본 `0=게시판취소` | 같음 | 같음 |\n| csDetl 저장 | `btnSaveInsert`, 잇기 `btnReflash` | 같은 단추가 있음. 숨은 값에 `hCancelConfirm` 이 더 있음 | 대체로 같음. `hCancelConfirm`·`btnBatchCancel`·`btnDInfoSave` 는 기록에 없다 |\n| 원주문 팝업 | `ordersPopup.aspx`, 줄 수 24·50·100·500, 39열 | 같음 | 같음 |\n| 고객문의 목록 | POST urlencoded, 그리드 | 같음. 34열 | 같음 |\n| 머리 CS등록 | `lnkCSReg` → `csDetl.aspx?previousPage=first` | 같음 | 같음 |\n\n⚠ `저장`·`일괄취소`·`배송정보저장` 은 눌러 보지 않았다. 위 「같음」 은 칸과 단추가 있다는 뜻이고, 서버 처리까지 다시 잰 것은 아니다.\n\n## 지도 고치는 법\n\n내용은 `목차.md`·`공통.md`·`화면/*.md` 에만 있다. 고친 뒤 `python3 벤더피아지도/만들기.py` 로 `index.html` 을 다시 굽는다. `index.html` 을 손으로 고치지 않는다(겉모습은 `틀.html`). `*.md` 는 저장소가 막으므로 `git add -f` 로 올린다. 고객 이름·전화·주소·실제 주문번호·상품코드·거래처 이름·
