<!-- ==========================================
     벤더피아상품정리 / index.html
     버전: v0.1.0 (2026-10-03) — 상품목록 올리기 최초 버전
     목적: 벤더피아에서 받은 "상품목록" 엑셀을 파이어스토어에 올린다.
           여기 올라간 자료를 바탕으로 앞으로 가공 화면들을 붙인다.

     문서 이름을 「파일 안의 줄 차례」(00001, 00002 …)로 하는 까닭:
       칸 이름으로 지으면 그 칸이 있어야만 올라간다. 10-03 에 「매출처명·
       상품코드」로 짓다가 사장님 파일이 두 번 튕겼다 — 그 조건은 사장님이
       시키신 적이 없고 우리가 만들어 붙인 것이었다.
       줄 차례로 지으면 칸 이름을 하나도 몰라도 되고, 겹칠 일이 없으며,
       같은 파일을 다시 올리면 그대로 덮여 중복이 안 생긴다.

     한 줄을 한 문서로 두는 까닭:
       파이어스토어는 문서 하나에 1MB 가 끝이다. 4,565줄을 한 문서 안
       배열로 넣으면 머지않아 쓰기가 거부된다.
     ========================================== -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>벤더피아 상품정리</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<!-- Firebase — 다른 프로그램들과 같은 프로젝트. 로그인 화면 없이 익명 인증만. -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
    import { getFirestore, collection, doc, getDocs, setDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",
        authDomain: "vivivic-4b7ef.firebaseapp.com",
        projectId: "vivivic-4b7ef",
        storageBucket: "vivivic-4b7ef.firebasestorage.app",
        messagingSenderId: "830175660542",
        appId: "1:830175660542:web:9054030480c8280af8d8af",
        measurementId: "G-MCPHWSQBQR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    window.db = getFirestore(app);
    window.fb = { collection, doc, getDocs, setDoc, writeBatch, serverTimestamp };

    onAuthStateChanged(auth, (user) => {
        if (!user) { signInAnonymously(auth).catch(e => console.error('익명 인증 실패:', e)); return; }
        window.initApp();
    });
</script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
    body { font-family:'Inter', ui-sans-serif, system-ui, sans-serif; background:#fbfbfa; color:#37352f; }
    .btn { min-height:48px; border-radius:10px; font-weight:800; font-size:15px; transition:.12s; }
    .btn:disabled { opacity:.4; }
    .chip { font-size:11px; padding:3px 8px; border-radius:6px; background:#f0efed; white-space:nowrap; }
    .chip.key { background:#37352f; color:#fff; font-weight:800; }
    .chip.off { opacity:.4; text-decoration:line-through; }
    /* 테일윈드가 늦게 뜨거나 못 뜨면 .hidden 이 안 먹어서 네 단계가 한꺼번에
       보인다 — 실제로 그렇게 나온 것을 보고 넣는다. 우리가 직접 박아 둔다. */
    .hidden { display:none !important; }
</style>
</head>
<body class="min-h-screen">

<div class="max-w-xl mx-auto px-4 py-6">

    <header class="mb-5">
        <h1 class="text-[22px] font-black tracking-tight">벤더피아 상품정리</h1>
        <p class="text-[13px] text-[#787774] mt-1">벤더피아에서 받은 상품목록 엑셀을 올립니다.</p>
    </header>

    <!-- 들어오기 전 -->
    <div id="loading" class="bg-white border border-[#ededeb] rounded-xl p-8 text-center">
        <div class="text-[13px] text-[#787774]">여는 중…</div>
    </div>

    <!-- 1. 파일 고르기 -->
    <div id="step-pick" class="hidden bg-white border border-[#ededeb] rounded-xl p-5">
        <div class="border-2 border-dashed border-[#ededeb] rounded-lg p-7 text-center">
            <p class="text-[13px] text-[#787774] mb-4">벤더피아 <b class="text-[#37352f]">상품목록</b> 엑셀을 고르십시오</p>
            <input type="file" id="file" accept=".xlsx,.xls" class="hidden">
            <button id="btn-pick" class="btn w-full bg-[#37352f] text-white px-6">엑셀 고르기</button>
        </div>
    </div>

    <!-- 2. 읽은 것 보여주기 -->
    <div id="step-read" class="hidden space-y-3">
        <div class="bg-white border border-[#ededeb] rounded-xl p-4">
            <div class="flex items-center gap-2 min-w-0">
                <span id="fname" class="text-[13px] font-bold truncate"></span>
                <span id="fsize" class="text-[11px] text-[#a8a6a2] ml-auto shrink-0"></span>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <div class="bg-white border border-[#ededeb] rounded-xl p-4">
                <div id="n-row" class="text-[22px] font-black tabular-nums">0</div>
                <div class="text-[11px] text-[#787774]">줄</div>
            </div>
            <div class="bg-white border border-[#ededeb] rounded-xl p-4">
                <div id="n-col" class="text-[22px] font-black tabular-nums">0</div>
                <div class="text-[11px] text-[#787774]">칸</div>
            </div>
        </div>

        <div id="warn" class="hidden border-l-4 border-amber-400 bg-amber-50 rounded-r-lg p-3 text-[12px] leading-relaxed"></div>

        <div class="bg-white border border-[#ededeb] rounded-xl p-4">
            <div class="text-[11px] font-bold text-[#787774] mb-2">칸 이름</div>
            <div id="cols" class="flex flex-wrap gap-1.5"></div>
        </div>

        <button id="btn-up" class="btn w-full bg-[#37352f] text-white">파이어베이스에 올리기</button>
        <button id="btn-cancel" class="btn w-full bg-white border border-[#ededeb] text-[#787774]">그만두기</button>
    </div>

    <!-- 3. 올리는 중 -->
    <div id="step-up" class="hidden bg-white border border-[#ededeb] rounded-xl p-5">
        <div class="h-2.5 bg-[#f0efed] rounded-full overflow-hidden mb-3">
            <div id="fill" class="h-full bg-[#37352f] rounded-full transition-all duration-150" style="width:0"></div>
        </div>
        <div class="flex text-[12px] tabular-nums text-[#787774] gap-3">
            <span><b id="p-n" class="text-[#37352f]">0</b> / <span id="p-t">0</span></span>
            <span id="p-b"></span>
            <span id="p-p" class="ml-auto">0%</span>
        </div>
        <p class="text-[11px] text-[#a8a6a2] mt-3">창을 닫지 마십시오.</p>
    </div>

    <!-- 4. 끝 -->
    <div id="step-done" class="hidden space-y-3">
        <div class="bg-white border-2 border-emerald-500 rounded-xl p-5">
            <h2 class="text-[16px] font-black text-emerald-600 mb-3">다 올렸습니다</h2>
            <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-1 text-[13px]">
                <dt class="text-[#787774]">올린 줄</dt><dd id="d-ok" class="tabular-nums font-bold">0</dd>
                <dt class="text-[#787774]">건너뜀</dt><dd id="d-skip" class="tabular-nums">0</dd>
                <dt class="text-[#787774]">묶음</dt><dd id="d-batch" class="tabular-nums">0</dd>
                <dt class="text-[#787774]">걸린 시간</dt><dd id="d-sec" class="tabular-nums">0초</dd>
            </dl>
        </div>
        <button id="btn-again" class="btn w-full bg-white border border-[#ededeb]">또 올리기</button>
    </div>

    <div id="err" class="hidden mt-3 border-l-4 border-red-400 bg-red-50 rounded-r-lg p-3 text-[12px] text-red-700"></div>

    <footer class="mt-8 pt-4 border-t border-[#ededeb] text-[11px] text-[#a8a6a2] leading-relaxed">
        <p>자리 — <code>artifacts/vivivic-4b7ef/public/data/vp_상품목록</code></p>
        <p>문서 이름 — <code>줄 차례 (00001, 00002 …)</code></p>
        <p>v0.1.0</p>
    </footer>
</div>

<!-- 짚어서 지시하는 손잡이 (?viggle=1 일 때만 켜진다) -->
<script src="../shared/viggle.js"></script>

<script>
// ════════════════════════════════════════════════════════════════════
// 설정
// ════════════════════════════════════════════════════════════════════
const COLLECTION = ['artifacts','vivivic-4b7ef','public','data','vp_상품목록'];
const EMPTY_COLS = ['조립설치비','유리비','제품비','판매상태']; // 통째로 비어 있는 칸 (올리되 흐리게 표시)
const BATCH_SIZE = 400;                               // 파이어스토어 한 묶음 한계는 500. 넉넉히 400.

let rows = [], headers = [], fileName = '', 건너뛴줄 = 0;

const $ = id => document.getElementById(id);
const show = (...ids) => { ['step-pick','step-read','step-up','step-done','loading']
    .forEach(s => $(s).classList.add('hidden'));
    ids.forEach(s => $(s).classList.remove('hidden')); };

window.initApp = function () { show('step-pick'); };

// ════════════════════════════════════════════════════════════════════
// 1. 엑셀 읽기
// ════════════════════════════════════════════════════════════════════
$('btn-pick').addEventListener('click', () => $('file').click());

$('file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    fileName = f.name;
    const r = new FileReader();
    r.onload = ev => { try { readBook(ev.target.result, f); } catch (err) { fail(err); } };
    r.onerror = () => fail(new Error('파일을 읽지 못했습니다.'));
    r.readAsArrayBuffer(f);
    e.target.value = '';   // 같은 파일을 다시 골라도 change 가 뜨도록
});

// ⚠ **칸 이름으로 막지 않는다.** 어떤 엑셀이든 읽고 올린다.
//   10-03 에 「매출처명·상품코드 칸이 있어야 한다」 로 막았다가 사장님 파일이 두 번 튕겼다.
//   그 조건은 사장님이 시키신 적이 없다 — 우리가 만들어 붙인 것이었다.
//   「상품명 업로드 페이지 하나」 가 시키신 전부다. 그 조건을 통째로 걷어냈다.
//
// 머리줄은 **이름으로 찾지 않는다.** 위 열 줄 가운데 **채워진 칸이 가장 많은 줄**이
// 머리줄이다(같으면 위엣것). 한국 ERP 엑셀은 맨 위에 제목 줄·회사 이름·뽑은 날짜가
// 붙어 나오는데, 그 줄들은 칸이 한둘뿐이라 이 잣대로 저절로 걸러진다.
const 머리줄깊이 = 10;

// 앞뒤 공백을 턴다. trim() 은 전각 공백(U+3000)도 턴다.
const 칸이름들 = 줄 => (줄 || []).map(h => String(h ?? '').trim());

function 머리줄찾기(aoa) {
    let 고른것 = { 몇째: 0, 이름들: 칸이름들(aoa[0]) };
    const 끝 = Math.min(머리줄깊이, aoa.length);
    for (let i = 1; i < 끝; i++) {
        const 이름들 = 칸이름들(aoa[i]);
        // 꼭 「보다 많을 때」만 바꾼다 — 같으면 위엣것이 머리줄이다.
        if (이름들.filter(Boolean).length > 고른것.이름들.filter(Boolean).length) {
            고른것 = { 몇째: i, 이름들 };
        }
    }
    return 고른것;
}

function readBook(buf, f) {
    const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
    if (!aoa.length) return fail(new Error('빈 파일입니다.'));

    const 머리 = 머리줄찾기(aoa);
    headers = 머리.이름들;

    // 한 줄을 { 칸이름: 값 } 으로. 값은 전부 글자로 둔다 —
    // 날짜에 연도가 없고(09-22), 코드가 숫자로 보이는 것도 있어서
    // 숫자로 바꾸면 앞의 0 이나 모양이 망가진다.
    // 거르는 것은 **통째로 빈 줄 하나뿐이다.** 그 밖에는 아무 줄도 버리지 않는다.
    rows = []; 건너뛴줄 = 0;
    for (let i = 머리.몇째 + 1; i < aoa.length; i++) {
        const o = {};
        let any = false;
        headers.forEach((h, c) => {
            const v = aoa[i][c];
            o[h] = (v === undefined || v === null) ? '' : String(v).trim();
            if (o[h] !== '') any = true;
        });
        if (any) rows.push(o); else 건너뛴줄++;
    }

    renderRead(f);
}

function renderRead(f) {
    $('fname').textContent = fileName;
    $('fsize').textContent = Math.round(f.size / 1024).toLocaleString('ko-KR') + ' KB';
    $('n-row').textContent = rows.length.toLocaleString('ko-KR');
    $('n-col').textContent = headers.length;

    const box = $('cols');
    box.innerHTML = '';
    headers.forEach(h => {
        const s = document.createElement('span');
        s.className = 'chip' + (EMPTY_COLS.indexOf(h) > -1 ? ' off' : '');
        s.textContent = h;
        box.appendChild(s);
    });

    // 막을 것이 없다 — 어떤 엑셀이든 올린다. 알릴 것도 없다.
    $('warn').classList.add('hidden');
    $('btn-up').disabled = false;

    $('err').classList.add('hidden');
    show('step-read');
}

// 문서 이름 — **파일 안의 줄 차례다.** 00001, 00002 …
// 칸 이름으로 짓지 않는다. 칸 이름을 안다고 생각하면 안 된다 —
// 10-03 에 「매출처명__상품코드」 로 짓다가 사장님 파일이 두 번 튕겼다.
// 줄 차례로 지으면 겹칠 일이 없고(4,565줄이면 4,565개가 그대로 들어간다),
// 같은 파일을 다시 올리면 그대로 덮여 중복이 안 생긴다.
const docId = i => String(i + 1).padStart(5, '0');

// ════════════════════════════════════════════════════════════════════
// 2. 올리기 — 400씩 끊어 보낸다
// ════════════════════════════════════════════════════════════════════
$('btn-cancel').addEventListener('click', () => { rows = []; headers = []; show('step-pick'); });
$('btn-again').addEventListener('click', () => { rows = []; headers = []; show('step-pick'); });

$('btn-up').addEventListener('click', async () => {
    const { doc, writeBatch, serverTimestamp } = window.fb;
    const live = rows;                 // 읽은 줄은 다 올린다. 거른 것은 읽을 때의 빈 줄뿐이다.
    const skipped = 건너뛴줄;

    $('p-t').textContent = live.length.toLocaleString('ko-KR');
    $('fill').style.width = '0';
    $('p-n').textContent = '0';
    $('p-p').textContent = '0%';
    show('step-up');

    const t0 = Date.now();
    let done = 0, nBatch = 0;

    try {
        for (let i = 0; i < live.length; i += BATCH_SIZE) {
            const slice = live.slice(i, i + BATCH_SIZE);
            const batch = writeBatch(window.db);
            slice.forEach((o, j) => {
                batch.set(doc(window.db, ...COLLECTION, docId(i + j)), {
                    fields: o,
                    source: '벤더피아 상품목록',
                    fileName: fileName,
                    updatedAt: serverTimestamp()
                });
            });
            await batch.commit();
            nBatch++;
            done += slice.length;

            const pct = Math.round(done / live.length * 100);
            $('fill').style.width = pct + '%';
            $('p-n').textContent = done.toLocaleString('ko-KR');
            $('p-b').textContent = '묶음 ' + nBatch + ' / ' + Math.ceil(live.length / BATCH_SIZE);
            $('p-p').textContent = pct + '%';
        }

        $('d-ok').textContent = done.toLocaleString('ko-KR');
        $('d-skip').textContent = skipped.toLocaleString('ko-KR');
        $('d-batch').textContent = nBatch + ' (' + BATCH_SIZE + '씩)';
        $('d-sec').textContent = ((Date.now() - t0) / 1000).toFixed(1) + '초';
        show('step-done');

    } catch (err) {
        console.error(err);
        fail(new Error(done.toLocaleString('ko-KR') + '건까지 올리고 멈췄습니다 — ' + err.message));
    }
});

function fail(err) {
    console.error(err);
    const e = $('err');
    e.textContent = err.message;
    e.classList.remove('hidden');
    show('step-pick');
}
</script>
</body>
</html>
