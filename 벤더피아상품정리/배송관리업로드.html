<!-- ==========================================
     벤더피아상품정리 / 배송관리업로드.html
     버전: v0.1.0 (2026-10-05) — 배송관리 엑셀 올리기 최초 버전
     목적: 벤더피아 "배송관리" 엑셀(주문줄)을 쌓아 가면서
           「어떤 물건이 얼마나 나갔나」를 싸게 묻게 한다.

     돈이 안 들게 하는 길 — 원줄을 파이어스토어에 넣지 않는다:
       ① 원본 엑셀은 창고(Storage)에 파일 그대로 둔다. 읽기 횟수로 돈을
          떼지 않으므로 몇십만 줄이든 월 몇백원이다. 나중에 새 질문이
          생기면 이 파일을 받아 다시 세면 된다.
       ② 브라우저가 그 자리에서 「달 × 상품명 × 수량」으로 센다.
       ③ 센 것만 파이어스토어에 넣는다. 문서 하나가 「파일 한 개의 한 달」이다.
          100만 줄을 넣어도 문서는 수십 개라, 물을 때 수십 번만 읽는다.

     문서를 「파일__달」로 쪼개는 까닭:
       한 문서는 1MB 가 끝이다. 한 해치를 한 문서에 담으면 넘친다.
       그리고 같은 파일을 두 번 올려도 같은 문서를 덮어쓰므로 두 번 세지 않는다.
     ========================================== -->

    import { getFirestore, collection, doc, getDocs, deleteDoc, writeBatch, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",
        authDomain: "vivivic-4b7ef.firebaseapp.com",
        projectId: "vivivic-4b7ef",
        storageBucket: "vivivic-4b7ef.firebasestorage.app",
        messagingSenderId: "830175660542",
        appId: "1:830175660542:web:9054030480c8280af8d8af",
        measurementId: "G-MCPHWSQBQR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    window.db = getFirestore(app);
    window.st = getStorage(app);
    window.fb = { collection, doc, getDocs, deleteDoc, writeBatch, query, where, serverTimestamp };
    window.fs = { ref, uploadBytes };

    onAuthStateChanged(auth, (user) => {
        if (!user) { signInAnonymously(auth).catch(e => console.error('익명 인증 실패:', e)); return; }
        window.initApp();
    });
</script>

        <p>원본 — <code>vp_배송원본/</code> 창고</p>
        <p>센 것 — <code>vp_배송집계</code> · 문서 하나가 「파일 한 개의 한 달」</p>
        <p>세는 법 — 주문등록일 기준 · CS 「취소」는 뺌 · 상품명 칸 그대로</p>

<script src="../shared/viggle.js"></script>

<script>
// ════════════════════════════════════════════════════════════════════
// 설정
// ════════════════════════════════════════════════════════════════════
const COL      = ['artifacts','vivivic-4b7ef','public','data','vp_배송집계'];
const RAW_DIR  = 'artifacts/vivivic-4b7ef/vp_배송원본';
const BATCH    = 100;                                   // 문서가 크므로 넉넉히 작게

// ⚠ 칸 이름으로 막지 않는다. 10-03 에 그렇게 막았다가 사장님 파일이 두 번 튕겼다.
//    있으면 쓰고, 없으면 없는 대로 간다. 무엇으로 셌는지는 화면에 한 줄 적어 드린다.

let counted = null, rawFile = null;

const $ = id => document.getElementById(id);
const show = (...ids) => { ['loading','step-pick','step-read','step-up','step-done']
    .forEach(s => $(s).classList.add('hidden'));
    ids.forEach(s => $(s).classList.remove('hidden')); };

window.initApp = function () { show('step-pick'); };

// ════════════════════════════════════════════════════════════════════
// 1. 읽고 그 자리에서 센다 — 원줄은 들고 있지 않는다
// ════════════════════════════════════════════════════════════════════
$('btn-pick').addEventListener('click', () => $('file').click());

$('file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    rawFile = f;
    const r = new FileReader();
    r.onload = ev => { try { count(ev.target.result, f); } catch (err) { fail(err); } };
    r.onerror = () => fail(new Error('파일을 읽지 못했습니다.'));
    r.readAsArrayBuffer(f);
    e.target.value = '';
});

// 「26.10.02」 · 「2026-10-03」 두 모양이 섞여 있다. 둘 다 받아 YYYY-MM 으로.
function toMonth(v) {
    const s = String(v || '').trim();
    let m = s.match(/^(\d{4})[-.\/](\d{1,2})/);        // 2026-10-03
    if (m) return m[1] + '-' + m[2].padStart(2, '0');
    m = s.match(/^(\d{2})[-.\/](\d{1,2})/);            // 26.10.02
    if (m) return '20' + m[1] + '-' + m[2].padStart(2, '0');
    return '';
}

// 머리줄은 이름으로 찾지 않는다. 위 열 줄 가운데 채워진 칸이 가장 많은 줄이다(같으면 위엣것).
// 제목 줄·회사 이름·뽑은 날짜는 칸이 한둘뿐이라 저절로 걸러진다.
function 머리줄찾기(aoa) {
    let best = 0, n = -1;
    for (let i = 0; i < Math.min(10, aoa.length); i++) {
        const k = (aoa[i] || []).filter(v => String(v ?? '').trim() !== '').length;
        if (k > n) { n = k; best = i; }
    }
    return best;
}

function count(buf, f) {
    const wb  = XLSX.read(new Uint8Array(buf), { type: 'array' });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
    if (!aoa.length) return fail(new Error('빈 파일입니다.'));

    const hRow = 머리줄찾기(aoa);
    const head = (aoa[hRow] || []).map(h => String(h).trim());

    const iN = head.indexOf('상품명'), iQ = head.indexOf('수량'),
          iD = head.indexOf('주문등록일'), iC = head.indexOf('CS');

    const byMonth = {};          // { '2026-10': { 상품명: 수량 } }
    const rowsOf  = {};          // { '2026-10': 센 줄 }
    const cs      = {};          // CS 종류별 줄 수
    let used = 0, noDate = 0, noName = 0, dropped = 0;

    for (let i = hRow + 1; i < aoa.length; i++) {
        const row = aoa[i];
        if (!row || !row.length) continue;
        if (row.every(v => String(v ?? '').trim() === '')) continue;   // 통째로 빈 줄만 거른다

        if (iC >= 0) {
            const csv = String(row[iC] ?? '').trim();
            if (csv) cs[csv] = (cs[csv] || 0) + 1;
            if (csv === '취소') { dropped++; continue; }               // 안 나간 것
        }

        const name = iN >= 0 ? String(row[iN] ?? '').trim() : '';
        if (iN >= 0 && !name) { noName++; continue; }
        if (iN < 0) { used++; continue; }            // 셀 칸이 없다 — 줄만 센다. 막지 않는다.

        const mon = iD >= 0 ? (toMonth(row[iD]) || '날짜없음') : '날짜없음';
        const q = iQ >= 0 ? (parseFloat(String(row[iQ] ?? '').replace(/,/g, '')) || 0) : 1;
        if (!byMonth[mon]) { byMonth[mon] = {}; rowsOf[mon] = 0; }
        byMonth[mon][name] = (byMonth[mon][name] || 0) + q;
        rowsOf[mon]++;
        used++;
    }

    counted = { byMonth, rowsOf, cs, used, noDate, noName, dropped,
                total: aoa.length - hRow - 1, hRow,
                쓴칸: { 이름: iN >= 0 ? '상품명' : null, 수량: iQ >= 0 ? '수량' : null,
                        날짜: iD >= 0 ? '주문등록일' : null, 거름: iC >= 0 ? 'CS' : null } };
    render(f);
}

function render(f) {
    const c = counted;
    const months = Object.keys(c.byMonth).sort();
    const items  = new Set();
    months.forEach(m => Object.keys(c.byMonth[m]).forEach(n => items.add(n)));

    $('fname').textContent = f.name;
    $('fsize').textContent = Math.round(f.size / 1024).toLocaleString('ko-KR') + ' KB';
    $('n-row').textContent   = c.used.toLocaleString('ko-KR');
    $('n-item').textContent  = items.size.toLocaleString('ko-KR');
    $('n-month').textContent = months.length;

    $('months').innerHTML = months.map(m =>
        `<div class="row"><span class="t">${m}</span><span class="r tabular-nums">${c.rowsOf[m].toLocaleString('ko-KR')}</span></div>`
    ).join('') || '<div class="text-[#a8a6a2]">없음</div>';

    const all = {};
    months.forEach(m => Object.entries(c.byMonth[m]).forEach(([n, q]) => all[n] = (all[n] || 0) + q));
    $('top10').innerHTML = Object.entries(all).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([n, q]) =>
        `<div class="row"><span class="t">${esc(n)}</span><span class="r tabular-nums">${q.toLocaleString('ko-KR')}</span></div>`
    ).join('') || '<div class="text-[#a8a6a2]">없음</div>';

    // 무엇으로 셌는지 밝힌다. 막는 대신 알린다.
    const u = c.쓴칸;
    $('usedcol').textContent =
        (c.hRow > 0 ? `머리줄 ${c.hRow + 1}째 줄 · ` : '') +
        `이름 ${u.이름 || '못 찾음'} · 수량 ${u.수량 || '없어서 한 줄 1'} · ` +
        `달 ${u.날짜 || '못 찾음'} · 거름 ${u.거름 || '없음'}`;

    const w = [];
    if (!u.이름) w.push('셀 칸(<b>상품명</b>)을 못 찾았습니다 — <b>원본만</b> 창고에 담습니다.');
    if (!u.날짜) w.push('날짜 칸(<b>주문등록일</b>)을 못 찾아 <b>「날짜없음」</b> 한 칸에 모았습니다.');
    if (c.dropped) w.push(`CS 「취소」 <b>${c.dropped}</b>줄은 빼고 셌습니다.`);
    const other = Object.entries(c.cs).filter(([k]) => k !== '취소');
    if (other.length) w.push('그대로 센 것 — ' + other.map(([k, v]) => `${k} ${v}`).join(' · '));
    if (c.noDate) w.push(`주문등록일을 못 읽은 줄 <b>${c.noDate}</b>건 — 건너뜁니다.`);
    if (c.noName) w.push(`상품명이 빈 줄 <b>${c.noName}</b>건 — 건너뜁니다.`);
    const big = months.filter(m => Object.keys(c.byMonth[m]).length > 8000);
    if (big.length) w.push(`<b>${big.join(', ')}</b> 은 물건이 너무 많아 한 문서에 안 들어갈 수 있습니다.`);
    const box = $('warn');
    if (w.length) { box.innerHTML = w.join('<br>'); box.classList.remove('hidden'); }
    else box.classList.add('hidden');

    $('err').classList.add('hidden');
    show('step-read');
}

const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const safe = s => String(s).replace(/\//g, '／').slice(0, 300);

// ════════════════════════════════════════════════════════════════════
// 2. 창고에 원본, 화베에 센 것
// ════════════════════════════════════════════════════════════════════
$('btn-cancel').addEventListener('click', reset);
$('btn-again').addEventListener('click', reset);
function reset() { counted = null; rawFile = null; show('step-pick'); }

$('btn-up').addEventListener('click', async () => {
    const { doc, getDocs, deleteDoc, writeBatch, query, where, collection, serverTimestamp } = window.fb;
    const c = counted, name = rawFile.name;
    const months = Object.keys(c.byMonth).sort();

    show('step-up');
    const t0 = Date.now();
    let fileNote = '못 올림';

    try {
        // ① 원본을 창고에 — 여기가 싸다. 나중에 새 질문이 생기면 이걸 다시 센다.
        step(5, '원본을 창고에 올리는 중…');
        try {
            await window.fs.uploadBytes(window.fs.ref(window.st, RAW_DIR + '/' + name), rawFile);
            fileNote = RAW_DIR + '/' + name;
        } catch (e) {
            console.warn('창고 올리기 실패', e);
            fileNote = '못 올림 — ' + e.code;
        }

        // ② 같은 파일로 전에 넣어 둔 문서를 먼저 지운다. 두 번 세지 않게.
        step(15, '전에 넣은 것 확인 중…');
        const old = await getDocs(query(collection(window.db, ...COL), where('파일', '==', name)));
        for (const d of old.docs) await deleteDoc(d.ref);

        // ③ 센 것을 넣는다. 문서 하나가 「파일 한 개의 한 달」이다.
        let done = 0;
        for (let i = 0; i < months.length; i += BATCH) {
            const slice = months.slice(i, i + BATCH);
            const batch = writeBatch(window.db);
            slice.forEach(m => {
                batch.set(doc(window.db, ...COL, safe(name) + '__' + m), {
                    파일: name,
                    달: m,
                    줄수: c.rowsOf[m],
                    집계: c.byMonth[m],
                    올린때: serverTimestamp()
                });
            });
            await batch.commit();
            done += slice.length;
            step(20 + Math.round(done / months.length * 80), `센 것 넣는 중 — ${done} / ${months.length} 달`);
        }

        $('d-row').textContent = c.used.toLocaleString('ko-KR');
        $('d-doc').textContent = months.length + '개 (달마다 하나)';
        $('d-file').textContent = fileNote;
        $('d-sec').textContent = ((Date.now() - t0) / 1000).toFixed(1) + '초';
        show('step-done');

    } catch (err) {
        console.error(err);
        fail(new Error('쌓다가 멈췄습니다 — ' + err.message));
    }
});

function step(pct, msg) { $('fill').style.width = pct + '%'; $('p-msg').textContent = msg; }

function fail(err) {
    console.error(err);
    const e = $('err');
    e.textContent = err.message;
    e.classList.remove('hidden');
    show('step-pick');
}
</script>
</body>
</html>
