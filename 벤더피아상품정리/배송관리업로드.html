<!-- ==========================================
     벤더피아상품정리 / 배송관리업로드.html
     버전: v0.1.0 (2026-10-05) — 배송관리 엑셀 올리기 최초 버전
     목적: 벤더피아 "배송관리" 엑셀(주문줄)을 쌓아 가면서
           「어떤 물건이 얼마나 나갔나」를 싸게 묻게 한다.

     돈이 안 들게 하는 길 — 원줄을 파이어스토어에 넣지 않는다:
       ① 원본 엑셀은 창고(Storage)에 파일 그대로 둔다. 읽기 횟수로 돈을
          떼지 않으므로 몇십만 줄이든 월 몇백원이다. 나중에 새 질문이
          생기면 이 파일을 받아 다시 세면 된다.
       ② 브라우저가 그 자리에서 「달 × 상품명 × 수량」으로 센다.
       ③ 센 것만 파이어스토어에 넣는다. 문서 하나가 「파일 한 개의 한 달」이다.
          100만 줄을 넣어도 문서는 수십 개라, 물을 때 수십 번만 읽는다.

     문서를 「파일__달」로 쪼개는 까닭:
       한 문서는 1MB 가 끝이다. 한 해치를 한 문서에 담으면 넘친다.

     겹친 주문을 막는 법 (10-05 사장님 — 「여기 중복자료는 업로드가
     안되는게 인지상정인데 방법이 있으까나?」):
       전에는 「같은 파일 이름」으로만 막았다. 그러면 벤더피아에서 날짜를
       달리해 두 번 받은 파일처럼 **이름은 다른데 주문이 겹치는** 경우를
       그대로 두 번 센다. 그래서 **주문줄 하나하나**로 막는다.
         ① 그 파일 안에서 **겹치지 않는 칸**을 찾아 열쇠로 삼는다(주문번호 따위).
            칸 이름을 코드에 박지 않는다 — 값을 세어 보고 고른다.
         ② 열쇠를 16자리로 줄여 `vp_배송열쇠` 에 모아 둔다.
         ③ 다음에 올릴 때 **이미 있는 줄은 들어가기 전에 빠진다.**
            「○건 중 △건은 이미 있어 건너뜁니다」 라고 숫자로 보여 드린다.
       그래서 같은 파일을 덮어쓸 일이 없다 — 겹친 줄은 애초에 안 들어간다.
     ========================================== -->

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";

        from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
    import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc, writeBatch, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",
        authDomain: "vivivic-4b7ef.firebaseapp.com",
        projectId: "vivivic-4b7ef",
        storageBucket: "vivivic-4b7ef.firebasestorage.app",
        messagingSenderId: "830175660542",
        appId: "1:830175660542:web:9054030480c8280af8d8af",
        measurementId: "G-MCPHWSQBQR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    window.db = getFirestore(app);
    window.st = getStorage(app);
    window.fb = { collection, doc, getDocs, setDoc, deleteDoc, writeBatch, query, where, serverTimestamp };
    window.fs = { ref, uploadBytes };

    // 이 집의 다른 프로그램은 익명으로 들어간다. 여기만 사장님 계정으로만 들어간다 —
    // 벤더피아 자료에는 매입단가·매입금액이, 배송관리 원본에는 사람 정보가 있었다.
    // 익명 로그인은 주소를 아는 사람이면 누구나 받는다. 잠금.js 와 화베 규칙이 짝이다.
    onAuthStateChanged(auth, (user) => {
        if (!user) { window.잠금.열기((메일, 비번) => signInWithEmailAndPassword(auth, 메일, 비번)); return; }
        // 전에 이 화면을 열었을 때 받은 익명 통행증이 폰에 남아 있다. 그대로 두면
        // 로그인 칸을 건너뛰고 들어온다 — 내보내고 다시 묻는다.
        if (user.isAnonymous) { signOut(auth); return; }
        window.잠금.닫기(user, () => signOut(auth));
        window.나 = user;                                   // 기록에 「누가」로 들어간다
        window.initApp();
        window.기록.그리기({ db: window.db, fb: window.fb, 넣을곳: '기록자리' });
    });
</script>

<script>
// ════════════════════════════════════════════════════════════════════
// 설정
// ════════════════════════════════════════════════════════════════════
const COL      = ['artifacts','vivivic-4b7ef','public','data','vp_배송집계'];
const KEYCOL   = ['artifacts','vivivic-4b7ef','public','data','vp_배송열쇠'];
const RAW_DIR  = 'artifacts/vivivic-4b7ef/vp_배송원본';
const BATCH    = 100;                                   // 문서가 크므로 넉넉히 작게
const 열쇠칸수 = 20000;                                 // 열쇠 하나 17바이트 → 한 문서 340KB (한 문서 1MB 한계)

// 배송 올리는 셈은 배송올리기.js 에 한 벌만 둔다 — 베껴서 두 벌이 되면 사람 정보가 샌다.
const { 사람칸, toMonth, 시도꼴, 시군구꼴, 끝말꼴, 번지꼴, 괄호꼴, 주소말, 낱말나누기, 주소가리기, 사람정보지우기, 머리줄찾기, 겹침수, 열쇠고르기, 열쇠값, 해시, 집계내기 } = window.배송올리기;
// ⚠ 칸 이름으로 막지 않는다. 10-03 에 그렇게 막았다가 사장님 파일이 두 번 튕겼다.
//    있으면 쓰고, 없으면 없는 대로 간다. 무엇으로 셌는지는 화면에 한 줄 적어 드린다.

let counted = null, rawFile = null, 쓸파일 = null;
let 이미있음 = new Set();          // 파이어스토어에 이미 담긴 열쇠
let 새줄 = [], 겹친줄 = [];

const $ = id => document.getElementById(id);
const show = (...ids) => { ['loading','step-pick','step-read','step-up','step-done']
    .forEach(s => $(s).classList.add('hidden'));
    ids.forEach(s => $(s).classList.remove('hidden')); };

window.initApp = function () { show('step-pick'); };

// ════════════════════════════════════════════════════════════════════
// 1. 읽고 그 자리에서 센다 — 원줄은 들고 있지 않는다
// ════════════════════════════════════════════════════════════════════
$('btn-pick').addEventListener('click', () => $('file').click());

$('file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    rawFile = f;
    const r = new FileReader();
    r.onload = ev => { try { count(ev.target.result, f); } catch (err) { fail(err); } };
    r.onerror = () => fail(new Error('파일을 읽지 못했습니다.'));
    r.readAsArrayBuffer(f);
    e.target.value = '';
});

          // 「부재시」 같은 두 글자 말에 안 걸리게 세 글자 이상
function count(buf, f) {
    const wb  = XLSX.read(new Uint8Array(buf), { type: 'array' });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
    if (!aoa.length) return fail(new Error('빈 파일입니다.'));

    const hRow = 머리줄찾기(aoa);
    const head = (aoa[hRow] || []).map(h => String(h).trim());

    const 지움 = 사람정보지우기(aoa, head);

    const iN = head.indexOf('상품명'), iQ = head.indexOf('수량'),
          iD = head.indexOf('주문등록일'), iC = head.indexOf('CS');

    const cs = {};               // CS 종류별 줄 수
    const 쓸줄 = [];             // 살아남은 원줄 — 열쇠를 고르는 데 쓴다
    let noDate = 0, noName = 0, dropped = 0;

    for (let i = hRow + 1; i < aoa.length; i++) {
        const row = aoa[i];
        if (!row || !row.length) continue;
        if (row.every(v => String(v ?? '').trim() === '')) continue;   // 통째로 빈 줄만 거른다

        if (iC >= 0) {
            const csv = String(row[iC] ?? '').trim();
            if (csv) cs[csv] = (cs[csv] || 0) + 1;
            if (csv === '취소') { dropped++; continue; }               // 안 나간 것
        }

        const name = iN >= 0 ? String(row[iN] ?? '').trim() : '';
        if (iN >= 0 && !name) { noName++; continue; }
        쓸줄.push(row);
    }

    // 겹침 열쇠를 **이 파일의 값에서** 고른다. 칸 이름을 코드에 박지 않는다.
    const 열쇠 = 열쇠고르기(head, 쓸줄);

    const 줄들 = 쓸줄.map(row => ({
        mon:  iD >= 0 ? (toMonth(row[iD]) || '날짜없음') : '날짜없음',
        name: iN >= 0 ? String(row[iN] ?? '').trim() : '',
        q:    iQ >= 0 ? (parseFloat(String(row[iQ] ?? '').replace(/,/g, '')) || 0) : 1,
        열쇠:  해시(열쇠값(row, 열쇠.칸)),
    }));

    counted = { 줄들, 열쇠, cs, noDate, noName, dropped,
                total: aoa.length - hRow - 1, hRow,
                쓴칸: { 이름: iN >= 0 ? '상품명' : null, 수량: iQ >= 0 ? '수량' : null,
                        날짜: iD >= 0 ? '주문등록일' : null, 거름: iC >= 0 ? 'CS' : null },
                지운칸: 지움.뺀이름, 가린번호: 지움.가린수, 주소본것: 지움.주소본것, 올릴파일: 지움.파일 };
    쓸파일 = f;
    이미있음 = new Set(); 새줄 = counted.줄들.slice(); 겹친줄 = [];
    render(f);              // 먼저 보여 드리고
    겹침확인();             // 그 다음 담긴 열쇠를 받아 셈을 고친다
}

// ── 담긴 열쇠 ────────────────────────────────────────────────────────
async function 열쇠불러오기() {
    const { collection, getDocs } = window.fb;
    const snap = await getDocs(collection(window.db, ...KEYCOL));
    const s = new Set();
    snap.docs.forEach(d => (d.data().열쇠 || []).forEach(k => s.add(k)));
    return s;
}
async function 열쇠담기(새열쇠) {
    const { collection, getDocs, doc, writeBatch } = window.fb;
    const snap = await getDocs(collection(window.db, ...KEYCOL));
    const 칸들 = snap.docs.map(d => ({ id: d.id, 열쇠: (d.data().열쇠 || []).slice() }))
        .sort((a, b) => a.id.localeCompare(b.id));
    const 남은 = [...새열쇠], 쓸것 = [];
    const 마지막 = 칸들[칸들.length - 1];
    if (마지막 && 마지막.열쇠.length < 열쇠칸수) {
        마지막.열쇠 = 마지막.열쇠.concat(남은.splice(0, 열쇠칸수 - 마지막.열쇠.length));
        쓸것.push(마지막);
    }
    let n = 칸들.length;
    while (남은.length) 쓸것.push({ id: String(n++).padStart(4, '0'), 열쇠: 남은.splice(0, 열쇠칸수) });
    for (const c of 쓸것) {
        const b = writeBatch(window.db);
        b.set(doc(window.db, ...KEYCOL, c.id), { 열쇠: c.열쇠, 수: c.열쇠.length });
        await b.commit();
    }
    return 쓸것.length;
}

async function 겹침확인() {
    try {
        이미있음 = await 열쇠불러오기();
        $('dupkey').dataset.탈 = '';
    } catch (e) {
        console.warn('담긴 열쇠를 못 읽었습니다', e);
        이미있음 = new Set();
        $('dupkey').dataset.탈 = '담긴 것을 못 읽었습니다 — ' + (e.code || e.message) + '. 다 새것으로 봅니다.';
    }
    갈라놓기();
    render(쓸파일);
}
function 갈라놓기() {
    새줄 = []; 겹친줄 = [];
    counted.줄들.forEach(r => (이미있음.has(r.열쇠) ? 겹친줄 : 새줄).push(r));
}
// 기본은 거르기. 사장님이 굳이 넣고 싶으시면 딱 하나 켜시면 된다.
const 넣을줄 = () => ($('dupforce').checked ? counted.줄들 : 새줄);

function render(f) {
    const c = counted;
    const 집계 = 집계내기(넣을줄());          // 들어갈 것만 보여 드린다
    c.byMonth = 집계.byMonth; c.rowsOf = 집계.rowsOf; c.used = 집계.used;

    const months = Object.keys(c.byMonth).sort();
    const items  = new Set();
    months.forEach(m => Object.keys(c.byMonth[m]).forEach(n => items.add(n)));

    $('fname').textContent = f.name;
    $('fsize').textContent = Math.round(f.size / 1024).toLocaleString('ko-KR') + ' KB';
    $('n-row').textContent   = c.used.toLocaleString('ko-KR');
    $('n-item').textContent  = items.size.toLocaleString('ko-KR');
    $('n-month').textContent = months.length;

    겹침그리기();

    $('months').innerHTML = months.map(m =>
        `<div class="row"><span class="t">${m}</span><span class="r tabular-nums">${c.rowsOf[m].toLocaleString('ko-KR')}</span></div>`
    ).join('') || '<div class="text-[#a8a6a2]">없음</div>';

    const all = {};
    months.forEach(m => Object.entries(c.byMonth[m]).forEach(([n, q]) => all[n] = (all[n] || 0) + q));
    $('top10').innerHTML = Object.entries(all).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([n, q]) =>
        `<div class="row"><span class="t">${esc(n)}</span><span class="r tabular-nums">${q.toLocaleString('ko-KR')}</span></div>`
    ).join('') || '<div class="text-[#a8a6a2]">없음</div>';

    // 무엇으로 셌는지 밝힌다. 막는 대신 알린다.
    const u = c.쓴칸;
    $('usedcol').textContent =
        (c.hRow > 0 ? `머리줄 ${c.hRow + 1}째 줄 · ` : '') +
        `이름 ${u.이름 || '못 찾음'} · 수량 ${u.수량 || '없어서 한 줄 1'} · ` +
        `달 ${u.날짜 || '못 찾음'} · 거름 ${u.거름 || '없음'}`;

    const w = [];
    if (c.지운칸.length)
        w.push('창고에 올릴 때 <b>사람 정보 ' + c.지운칸.length + '칸</b>을 지웁니다 — ' +
               c.지운칸.join(' · ') + '. 세는 데는 안 쓰입니다.' +
               (c.가린번호 ? ' 메모 속 전화번호 <b>' + c.가린번호 + '</b>개도 가립니다.' : ''));
    if (c.주소본것)
        w.push('메모 속 <b>주소 ' + c.주소본것 + '건</b>도 가립니다. ' +
               '「3층 엘리베이터 없음」 같은 일 이야기는 그대로 둡니다.');
    if (!u.이름) w.push('셀 칸(<b>상품명</b>)을 못 찾았습니다 — <b>원본만</b> 창고에 담습니다.');
    if (!u.날짜) w.push('날짜 칸(<b>주문등록일</b>)을 못 찾아 <b>「날짜없음」</b> 한 칸에 모았습니다.');
    if (c.dropped) w.push(`CS 「취소」 <b>${c.dropped}</b>줄은 빼고 셌습니다.`);
    const other = Object.entries(c.cs).filter(([k]) => k !== '취소');
    if (other.length) w.push('그대로 센 것 — ' + other.map(([k, v]) => `${k} ${v}`).join(' · '));
    if (c.noDate) w.push(`주문등록일을 못 읽은 줄 <b>${c.noDate}</b>건 — 건너뜁니다.`);
    if (c.noName) w.push(`상품명이 빈 줄 <b>${c.noName}</b>건 — 건너뜁니다.`);
    const big = months.filter(m => Object.keys(c.byMonth[m]).length > 8000);
    if (big.length) w.push(`<b>${big.join(', ')}</b> 은 물건이 너무 많아 한 문서에 안 들어갈 수 있습니다.`);
    const box = $('warn');
    if (w.length) { box.innerHTML = w.join('<br>'); box.classList.remove('hidden'); }
    else box.classList.add('hidden');

    $('err').classList.add('hidden');
    show('step-read');
}

// 「○건 중 △건은 이미 있어 건너뜁니다」 — 숫자로 보여 드려야 사장님이 안 불안하시다.
function 겹침그리기() {
    const 다 = counted.줄들.length, 겹 = 겹친줄.length, 새 = 새줄.length;
    const 켜짐 = $('dupforce').checked;
    $('dupline').innerHTML = 겹
        ? (켜짐
            ? `${다.toLocaleString('ko-KR')}건 가운데 <b>${겹.toLocaleString('ko-KR')}건이 이미 있습니다</b> — 그래도 <b>${다.toLocaleString('ko-KR')}건 다</b> 넣습니다.`
            : `${다.toLocaleString('ko-KR')}건 가운데 <b>${겹.toLocaleString('ko-KR')}건은 이미 있어 건너뜁니다</b>. <b>${새.toLocaleString('ko-KR')}건</b>만 들어갑니다.`)
        : `${다.toLocaleString('ko-KR')}건 다 새것입니다.`;
    const 탈 = $('dupkey').dataset.탈;
    $('dupkey').textContent = (탈 ? 탈 + ' · ' : '')
        + '겹침 열쇠 — ' + counted.열쇠.이름
        + (counted.열쇠.안겹침 ? ' (이 파일 안에서 겹침 0)' : ' (겹치지 않는 칸이 없어 줄을 통째로 견줍니다)');
    $('duprow').classList.toggle('hidden', 겹 === 0);
    $('btn-up').textContent = (!켜짐 && 새 === 0) ? '넣을 새것이 없습니다' : '쌓기';
    $('btn-up').disabled = (!켜짐 && 새 === 0);
}
$('dupforce').addEventListener('change', () => render(쓸파일));

const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const safe = s => String(s).replace(/\//g, '／').slice(0, 300);

// ════════════════════════════════════════════════════════════════════
// 2. 창고에 원본, 화베에 센 것
// ════════════════════════════════════════════════════════════════════
$('btn-cancel').addEventListener('click', reset);
$('btn-again').addEventListener('click', reset);
function reset() {
    counted = null; rawFile = null; 쓸파일 = null;
    이미있음 = new Set(); 새줄 = []; 겹친줄 = [];
    $('dupforce').checked = false;
    show('step-pick');
}

$('btn-up').addEventListener('click', async () => {
    const { doc, getDocs, writeBatch, query, where, collection, serverTimestamp } = window.fb;
    const c = counted, name = rawFile.name;
    const 넣는줄 = 넣을줄();
    const 집계 = 집계내기(넣는줄);
    c.byMonth = 집계.byMonth; c.rowsOf = 집계.rowsOf; c.used = 집계.used;
    const months = Object.keys(c.byMonth).sort();

    show('step-up');
    const t0 = Date.now();
    let fileNote = '못 올림';

    try {
        // ① 원본을 창고에 — 여기가 싸다. 나중에 새 질문이 생기면 이걸 다시 센다.
        step(5, '원본을 창고에 올리는 중…');
        try {
            // 사람 칸을 지운 사본을 올린다. 지울 것이 없었으면 원본 그대로.
            const 올릴것 = c.올릴파일 || rawFile;
            // 사람 칸을 지운 사본은 CSV 다 — 이름 끝도 그렇게 바꾼다
            const 올릴이름 = c.올릴파일 ? name.replace(/\.[^.]+$/, '') + '.csv' : name;
            await window.fs.uploadBytes(window.fs.ref(window.st, RAW_DIR + '/' + 올릴이름), 올릴것);
            fileNote = RAW_DIR + '/' + 올릴이름 +
                       (c.지운칸.length ? ' (사람 정보 ' + c.지운칸.length + '칸 지움)' : '');
        } catch (e) {
            console.warn('창고 올리기 실패', e);
            fileNote = '못 올림 — ' + e.code;
        }

        // ② 같은 파일로 전에 넣어 둔 것을 읽어 둔다. **지우지 않는다** —
        //    겹친 줄은 이미 빠졌으므로, 새것을 옛것 위에 **보탠다.**
        step(15, '전에 넣은 것 확인 중…');
        const old = await getDocs(query(collection(window.db, ...COL), where('파일', '==', name)));
        const 옛것 = {};
        old.docs.forEach(d => { const v = d.data() || {}; 옛것[v.달] = v; });

        // ③ 센 것을 넣는다. 문서 하나가 「파일 한 개의 한 달」이다.
        let done = 0;
        for (let i = 0; i < months.length; i += BATCH) {
            const slice = months.slice(i, i + BATCH);
            const batch = writeBatch(window.db);
            slice.forEach(m => {
                const o = 옛것[m];
                const 합 = Object.assign({}, (o && o.집계) || {});
                Object.entries(c.byMonth[m]).forEach(([n, q]) => 합[n] = (합[n] || 0) + q);
                batch.set(doc(window.db, ...COL, safe(name) + '__' + m), {
                    파일: name,
                    달: m,
                    줄수: ((o && o.줄수) || 0) + c.rowsOf[m],
                    집계: 합,
                    올린때: serverTimestamp()
                });
            });
            await batch.commit();
            done += slice.length;
            step(20 + Math.round(done / months.length * 75), `센 것 넣는 중 — ${done} / ${months.length} 달`);
        }

        // ④ 들어간 줄의 열쇠를 담아 둔다. 다음에 겹치면 여기서 걸린다.
        step(96, '겹침 열쇠를 담는 중…');
        const 담을열쇠 = [...new Set(넣는줄.map(r => r.열쇠))].filter(k => !이미있음.has(k));
        let 열쇠칸 = 0;
        try { 열쇠칸 = await 열쇠담기(담을열쇠); }
        catch (e) { console.warn('열쇠 담기 실패', e); }

        $('d-row').textContent = c.used.toLocaleString('ko-KR')
            + (겹친줄.length ? ` (겹쳐서 건너뛴 줄 ${겹친줄.length.toLocaleString('ko-KR')})` : '');
        $('d-doc').textContent = months.length + '개 (달마다 하나) · 열쇠칸 ' + 열쇠칸 + '개';
        $('d-file').textContent = fileNote;
        $('d-sec').textContent = ((Date.now() - t0) / 1000).toFixed(1) + '초';

        // 누가·언제·어느 파일·몇 줄을 남긴다. 지운 칸·가린 번호도 함께 —
        // 사람 정보가 정말 빠졌는지 나중에 되짚을 수 있어야 한다.
        await window.기록.적기({ db: window.db, fb: window.fb, user: window.나,
            무엇: '배송관리', 파일: name, 줄수: c.used, 문서수: months.length,
            비고: [ c.지운칸.length ? ('사람칸 ' + c.지운칸.length + '개 지움') : '',
                    c.가린번호 ? ('번호 ' + c.가린번호 + '개 가림') : '',
                    c.주소본것 ? ('주소 ' + c.주소본것 + '건 가림') : '',
                    겹친줄.length ? ('겹침 ' + 겹친줄.length + '줄 건너뜀') : '' ]
                  .filter(Boolean).join(' · ') });
        window.기록.그리기({ db: window.db, fb: window.fb, 넣을곳: '기록자리' });

        show('step-done');

    } catch (err) {
        console.error(err);
        fail(new Error('쌓다가 멈췄습니다 — ' + err.message));
    }
});

function step(pct, msg) { $('fill').style.width = pct + '%'; $('p-msg').textContent = msg; }

function fail(err) {
    console.error(err);
    const e = $('err');
    e.textContent = err.message;
    e.classList.remove('hidden');
    show('step-pick');
}
</script>
