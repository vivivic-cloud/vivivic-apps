<!-- ==========================================
     벤더피아상품정리 / 제품명료화.html
     버전: v0.6.0 (2026-10-09) — 배송정보를 여기서 바로 올린다. 딴 장으로 보내지 않는다 (10-09 사장님)
            v0.5.0 (10-08) 상품 ↔ 단품 맞댄 표. 앞서 있던 분석과 「분석 복사」 는 걷어냈다
     목적: 벤더피아 엑셀(상품정보·단품정보)을 화베에 담아 두고,
           담긴 자료로 「단품 = 물건, 상품 = 파는 이름」 을 가려 가며
           규칙을 쌓는다. (10-07 사장님)

     쓰는 자리 — 셋 다 vp_ 로 시작한다. 화베 규칙이 사장님 계정만 들여보낸다.
       vp_명료자료   올린 엑셀 한 개 = 문서 한 개 (이름·칸이름·줄수·갈래)
       vp_명료묶음   그 엑셀의 줄들. 200줄씩 한 문서 — 읽기 횟수를 줄인다.
       vp_명료규칙   적어 둔 규칙
     읽기만 하는 자리
       vp_상품목록   상품정리 화면에서 이미 올린 상품목록. 한 글자도 안 쓴다.

     줄을 JSON 글자로 담는 까닭:
       칸 이름이 비었거나 겹치면 파이어스토어가 쓰기를 거부한다.
       값만 차례대로 글자로 담고 칸 이름은 자료 문서에 한 번만 둔다.

     막지 않는다:
       어떤 엑셀이든 읽고 올린다. 칸 이름으로 돌려보내는 길은 없다.
       갈래(상품정보·단품정보·그 밖)는 올리는 자리로 정한다. 「옮김」 으로 바꾼다.
     ========================================== -->

<script>
// ════════════════════════════════════════════════════════════════════
// 설정
// ════════════════════════════════════════════════════════════════════
const 뿌리 = ['artifacts','vivivic-4b7ef','public','data'];
const 자리 = { 상품목록: 'vp_상품목록', 자료: 'vp_명료자료', 묶음: 'vp_명료묶음', 규칙: 'vp_명료규칙',
    배송집계: 'vp_배송집계', 배송열쇠: 'vp_배송열쇠' };
const 배송원본 = 'artifacts/vivivic-4b7ef/vp_배송원본';   // 창고. 배송관리업로드와 같은 자리다.
const 열쇠칸수 = 20000;          // 열쇠 하나 17바이트 → 한 문서 340KB (한 문서 1MB 한계 안)
const 묶음줄수 = 200;            // 한 문서에 담는 줄 수
const 묶음글자 = 250000;         // 한 문서 1MB 한계 — 한글은 한 글자가 3바이트라 25만 글자에서 끊는다
const 머리줄깊이 = 10;
const 보일건수 = 200;            // 한 갈래에서 화면에 그리는 건수

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const 셈 = n => Number(n || 0).toLocaleString('ko-KR');
const 칸 = 이름 => window.fb.collection(window.db, ...뿌리, 이름);
const 문서 = (이름, id) => window.fb.doc(window.db, ...뿌리, 이름, id);

function 때이름(d) {
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' +
           p(d.getHours()) + p(d.getMinutes()) + '-' + p(d.getSeconds());
}
const 때보임 = id => { const m = String(id).match(/^\d{4}(\d{2})(\d{2})-(\d{2})(\d{2})/); return m ? `${m[1]}-${m[2]} ${m[3]}:${m[4]}` : ''; };

function fail(err) {
    console.error(err);
    $('err').textContent = err.message || String(err);
    $('err').classList.remove('hidden');
    $('err').scrollIntoView({ block: 'center' });
}
// 어디서 터지든 화면에 보인다 — 조용히 죽으면 「반응이 없다」 가 된다 (10-07 사장님)
window.addEventListener('error', e => fail(new Error('화면 오류 — ' + (e.message || '까닭 모름'))));
window.addEventListener('unhandledrejection', e => fail(new Error('화면 오류 — ' + ((e.reason && e.reason.message) || e.reason || '까닭 모름'))));

// ════════════════════════════════════════════════════════════════════
// 담긴 것 — 열 때 한 번 읽어 여기 담아 둔다. 누를 때마다 다시 읽지 않는다.
// ════════════════════════════════════════════════════════════════════
let 담긴상품목록 = [];           // vp_상품목록 의 줄들 ({칸이름: 값})
let 자료들 = [];                 // vp_명료자료 문서들 (새것이 앞)
let 규칙들 = [];
let 배송집계 = [];               // vp_배송집계 — 배송관리업로드가 쌓은 것. 읽기만 한다.
const 읽은줄 = new Map();        // 자료 id → 줄들 ({칸이름: 값})
let 맞댐결과 = null;

window.initApp = async function () {
    try {
        const { getDocs } = window.fb;
        const [상, 자, 규, 배] = await Promise.all([
            getDocs(칸(자리.상품목록)), getDocs(칸(자리.자료)), getDocs(칸(자리.규칙)), getDocs(칸(자리.배송집계))
        ]);
        배송집계 = 배.docs.map(d => d.data() || {});
        담긴상품목록 = 상.docs.map(d => (d.data() || {}).fields || {});
        자료들 = 자.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => a.id < b.id ? 1 : -1);
        규칙들 = 규.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => a.id < b.id ? 1 : -1);
        $('loading').classList.add('hidden');
        ['판-올리기','판-자료','판-맞댐','판-규칙'].forEach(i => $(i).classList.remove('hidden'));
        자료그리기(); 규칙그리기();
        await 맞댐하기();
    } catch (err) { $('loading').classList.add('hidden'); fail(new Error('읽지 못했습니다 — ' + err.message)); }
};

// ════════════════════════════════════════════════════════════════════
// 1. 엑셀 읽기 — 어떤 엑셀이든 읽는다. 칸 이름으로 막지 않는다.
// ════════════════════════════════════════════════════════════════════
let 읽은것 = null;               // { 이름, 칸이름[], 줄[][] , 머리줄, 건너뜀 }

// 위 열 줄 가운데 채워진 칸이 가장 많은 줄이 머리줄이다 (같으면 위엣것).
function 머리줄찾기(aoa) {
    const 이름들 = 줄 => (줄 || []).map(h => String(h ?? '').trim());
    let 고른것 = { 몇째: 0, 이름들: 이름들(aoa[0]) };
    for (let i = 1; i < Math.min(머리줄깊이, aoa.length); i++) {
        const n = 이름들(aoa[i]);
        if (n.filter(Boolean).length > 고른것.이름들.filter(Boolean).length) 고른것 = { 몇째: i, 이름들: n };
    }
    return 고른것;
}

// 빈 칸 이름은 「칸7」, 겹친 이름은 「이름(2)」 — 그래야 뒤엣것이 앞엣것을 안 덮는다.
function 칸이름다듬기(이름들) {
    const 본 = new Map();
    return 이름들.map((h, i) => {
        let n = h || ('칸' + (i + 1));
        const k = (본.get(n) || 0) + 1; 본.set(n, k);
        return k > 1 ? n + '(' + k + ')' : n;
    });
}

function 엑셀읽기(buf, 이름) {
    const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
    if (!aoa.length) throw new Error('빈 파일입니다.');
    const 머리 = 머리줄찾기(aoa);
    const 칸이름 = 칸이름다듬기(머리.이름들);
    const 줄 = []; let 건너뜀 = 0;
    for (let i = 머리.몇째 + 1; i < aoa.length; i++) {
        // 값은 전부 글자로 — 앞자리 0 과 날짜 모양을 지킨다
        const v = 칸이름.map((_, c) => { const x = aoa[i][c]; return (x === undefined || x === null) ? '' : String(x).trim(); });
        if (v.some(x => x !== '')) 줄.push(v); else 건너뜀++;
    }
    return { 이름, 칸이름, 줄, 머리줄: 머리.몇째 + 1, 건너뜀 };
}

// 갈래는 **올리는 자리로 정한다.** 칸 이름으로 짐작하지 않는다 —
// 어느 자리의 「올리기」 를 누르셨는지가 곧 갈래다. (10-07 사장님)
const 갈래들 = [['상품', '상품정보'], ['단품', '단품정보'], ['', '그 밖']];
const 갈래이름 = g => g === '배송' ? '배송정보' : (갈래들.find(x => x[0] === (g || '')) || 갈래들[2])[1];
let 고른갈래 = '';

$('file').addEventListener('change', e => {

$('btn-cancel').addEventListener('click', () => { 읽은것 = null; 배송읽은것 = null; $('판-읽음').classList.add('hidden'); });

// 2. 화베에 담기 — 줄 묶음을 먼저, 자료 문서를 맨 끝에.
//    끊기면 자료 문서가 없어서 목록에 안 뜬다. 반쯤 담긴 것이 분석에 섞이지 않는다.
// ════════════════════════════════════════════════════════════════════
function 묶기(줄) {
    const 묶음들 = []; let 지금 = [], 글자 = 0;
    줄.forEach(v => {
        const s = JSON.stringify(v);
        if (지금.length && (지금.length >= 묶음줄수 || 글자 + s.length > 묶음글자)) { 묶음들.push(지금); 지금 = []; 글자 = 0; }
        지금.push(s); 글자 += s.length;
    });
    if (지금.length) 묶음들.push(지금);
    return 묶음들;
}

$('btn-up').addEventListener('click', async () => {
    if (배송읽은것) { await 배송담기(); return; }
    if (!읽은것) return;
    const { setDoc, serverTimestamp } = window.fb;
    const 올릴것 = 읽은것, id = 때이름(new Date()), 올린갈래 = 고른갈래;
    const 묶음들 = 묶기(올릴것.줄);
    $('판-읽음').classList.add('hidden');
    $('판-올리는중').classList.remove('hidden');
    올리는중 = true; 자료그리기();
    let 간줄 = 0;
    $('올림셈').textContent = '0 / ' + 셈(올릴것.줄.length);
    // 화베가 답이 없으면 그렇다고 적는다 — 인터넷이 끊기면 쓰기가 끝없이 기다린다
    const 늦음 = setInterval(() => { if (Date.now() - 마지막답 > 15000) $('올림셈').textContent = 셈(간줄) + ' / ' + 셈(올릴것.줄.length) + ' · 화베 답 없음'; }, 3000);
    let 마지막답 = Date.now();
    try {
        for (let i = 0; i < 묶음들.length; i++) {
            await setDoc(문서(자리.묶음, id + '__' + String(i).padStart(4, '0')), { 자료: id, 차례: i, 줄들: 묶음들[i] });
            간줄 += 묶음들[i].length; 마지막답 = Date.now();
            $('fill').style.width = Math.round(간줄 / 올릴것.줄.length * 100) + '%';
            $('올림셈').textContent = 셈(간줄) + ' / ' + 셈(올릴것.줄.length);
        }
        const 새자료 = { 이름: 올릴것.이름, 칸이름: 올릴것.칸이름, 줄수: 올릴것.줄.length, 묶음수: 묶음들.length,
            머리줄: 올릴것.머리줄, 갈래: 올린갈래, 누가: (window.나 && window.나.email) || '' };
        await setDoc(문서(자리.자료, id), Object.assign({ 언제: serverTimestamp() }, 새자료));
        if (window.기록) await window.기록.적기({ db: window.db, fb: window.fb, user: window.나,
            무엇: '제품명료화', 파일: 올릴것.이름, 줄수: 올릴것.줄.length, 문서수: 묶음들.length + 1,
            비고: 올릴것.건너뜀 ? ('건너뜀 ' + 올릴것.건너뜀) : '' });
        자료들.unshift(Object.assign({ id }, 새자료));
        읽은줄.set(id, 올릴것.줄.map(v => 줄풀기(올릴것.칸이름, v)));
        읽은것 = null;
        $('판-끝').textContent = '담았습니다 · ' + 갈래이름(올린갈래) + ' · ' + 올릴것.이름 + ' · ' + 셈(올릴것.줄.length) + '줄';
        $('판-끝').classList.remove('hidden');
        자료그리기();
        await 맞댐하기();
    } catch (err) {
        fail(new Error(셈(간줄) + '줄까지 담고 멈췄습니다 — ' + err.message));
    }
    clearInterval(늦음);
    $('판-올리는중').classList.add('hidden');
    $('fill').style.width = '0';
    올리는중 = false; 자료그리기();
});

const 줄풀기 = (칸이름, v) => { const o = {}; 칸이름.forEach((h, i) => o[h] = v[i] ?? ''); return o; };

async function 자료줄읽기(자료) {
    if (읽은줄.has(자료.id)) return 읽은줄.get(자료.id);
    const { getDocs, query, where } = window.fb;
    const 눈 = await getDocs(query(칸(자리.묶음), where('자료', '==', 자료.id)));
    const 묶음 = 눈.docs.map(d => d.data()).sort((a, b) => a.차례 - b.차례);
    const 줄 = [];
    묶음.forEach(m => (m.줄들 || []).forEach(s => 줄.push(줄풀기(자료.칸이름 || [], JSON.parse(s)))));
    읽은줄.set(자료.id, 줄);
    return 줄;
}

// ════════════════════════════════════════════════════════════════════
// 3. 담긴 자료 — 이름을 누르면 칸마다 채움·가짓수·보기. 딱지를 누르면 갈래가 바뀐다.
// ════════════════════════════════════════════════════════════════════
const 갈래차례 = ['', '상품', '단품'];
let 펼친자료 = null, 올리는중 = false;

function 자료그리기() {
    const 판 = [];
    갈래들.forEach(([g, 이름]) => {
        판.push(`<div class="명료갈래"><b>${esc(이름)}</b><button class="명료딱지 켬" data-pick="${esc(g)}"${올리는중 ? ' disabled' : ''}>올리기</button></div>`);
        const 것 = 자료들.filter(a => (a.갈래 || '') === g);
        // 「그 밖」 은 기준이 따로 없다 — 다 같은 무게로 보인다
        const 줄 = 것.map((a, i) => `<div class="명료줄${g && i ? ' 옛' : ''}"><span class="이름" data-view="${esc(a.id)}">${esc(a.이름)}</span>
            ${g && !i ? '<span class="지금">지금</span>' : ''}<span class="수">${셈(a.줄수)}줄 · ${esc(때보임(a.id))}</span>
            <button class="명료딱지" data-role="${esc(a.id)}">옮김</button></div>`);
        // 상품정리 화면에서 올린 상품목록 — 여기서 상품정보를 올리기 전까지는 이것이 기준이다
        if (g === '상품' && 담긴상품목록.length) 줄.push(`<div class="명료줄${것.length ? ' 옛' : ''}"><span class="이름" data-view="__상품목록">상품목록 (상품정리)</span>
            ${것.length ? '' : '<span class="지금">지금</span>'}<span class="수">${셈(담긴상품목록.length)}줄</span></div>`);
        판.push(줄.join('') || '<div class="명료잔" style="padding:10px 0">없음</div>');
        if (g === '단품') 판.push(배송자리());
    });
    $('자료목록').innerHTML = 판.join('');
}

// 배송정보 — **여기서 바로 올린다. 딴 장으로 보내지 않는다.**
// 「배송관리 파일이 업로드 되지 않고, 업로드 시도시 로딩후 벤더피아상품정리 프로그램으로
//  화면전화 됩니다. 벤더피아 상품정리 프로그램은 이프로그램과 관련시키지 마세요」 (10-09 사장님)
// 사람 칸 지우기·번호와 주소 가리기·겹친 주문줄 거르기는 **배송올리기.js 한 벌**을 그대로 쓴다.
// ⚠ 그 셈을 여기에 베끼지 마라 — 두 벌이 되면 언젠가 달라지고 사람 정보가 샌다.
function 배송자리() {
    const 파일 = new Map();
    배송집계.forEach(d => {
        const f = 파일.get(d.파일) || { 줄: 0, 달: [] };
        f.줄 += Number(d.줄수) || 0; if (d.달) f.달.push(String(d.달)); 파일.set(d.파일, f);
    });
    const 줄 = [...파일.entries()].map(([이름, f]) => { f.달.sort();
        const 달 = f.달.length > 1 ? f.달[0] + '~' + f.달[f.달.length - 1] : (f.달[0] || '');
        return `<div class="명료줄"><span class="이름" style="cursor:default">${esc(이름)}</span><span class="수">${셈(f.줄)}줄 · ${esc(달)}</span></div>`; });
    return `<div class="명료갈래"><b>배송정보</b><button class="명료딱지 켬" data-pick="배송"${올리는중 ? ' disabled' : ''}>올리기</button></div>`
        + (줄.join('') || '<div class="명료잔" style="padding:10px 0">없음</div>');
}

// ════════════════════════════════════════════════════════════════════
// 배송정보 — 읽고 담는 길. **셈은 한 글자도 베끼지 않고 배송올리기.js 를 부른다.**
// 사람 칸 지우기·번호와 주소 가리기·겹침 열쇠 고르기가 두 벌이 되면 사람 정보가 샌다.
// ════════════════════════════════════════════════════════════════════
let 배송읽은것 = null;

function 배송고름(buf, f) {
    const B = window.배송올리기;
    const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
    if (!aoa.length) throw new Error('빈 파일입니다.');
    const 머리 = B.머리줄찾기(aoa);
    const head = (aoa[머리] || []).map(h => String(h).trim());
    const 지움 = B.사람정보지우기(aoa, head);        // 사람 칸을 지운 사본을 창고에 올린다

    // ⚠ 칸 이름으로 막지 않는다. 없으면 없는 대로 간다.
    const iN = head.indexOf('상품명'), iQ = head.indexOf('수량'),
          iD = head.indexOf('주문등록일'), iC = head.indexOf('CS');
    const 쓸줄 = []; let 취소 = 0, 이름없음 = 0;
    for (let i = 머리 + 1; i < aoa.length; i++) {
        const row = aoa[i];
        if (!row || !row.length) continue;
        if (row.every(v => String(v ?? '').trim() === '')) continue;   // 통째로 빈 줄만 거른다
        if (iC >= 0 && String(row[iC] ?? '').trim() === '취소') { 취소++; continue; }   // 안 나간 것
        if (iN >= 0 && !String(row[iN] ?? '').trim()) { 이름없음++; continue; }
        쓸줄.push(row);
    }
    const 열쇠 = B.열쇠고르기(head, 쓸줄);
    const 줄들 = 쓸줄.map(row => ({
        mon: iD >= 0 ? (B.toMonth(row[iD]) || '날짜없음') : '날짜없음',
        name: iN >= 0 ? String(row[iN] ?? '').trim() : '',
        q: iQ >= 0 ? (parseFloat(String(row[iQ] ?? '').replace(/,/g, '')) || 0) : 1,
        열쇠: B.해시(B.열쇠값(row, 열쇠.칸))
    }));
    배송읽은것 = { 이름: f.name, 날것: f, 줄들, 열쇠, 취소, 이름없음, 지움 };
    $('읽음셈').textContent = 셈(줄들.length) + '줄 · ' + head.length + '칸 · 머리줄 ' + (머리 + 1) + '째'
        + (취소 ? ' · 취소 ' + 셈(취소) + ' 뺌' : '')
        + ' · 열쇠 ' + 열쇠.이름
        + ' · 사람칸 ' + 지움.뺀이름.length + '개 지움'
        + (지움.가린수 ? ' · 번호 ' + 지움.가린수 + '개 가림' : '')
        + (지움.주소본것 ? ' · 주소 ' + 지움.주소본것 + '건 가림' : '');
    $('btn-up').disabled = false;
}

async function 배송담기() {
    const 것 = 배송읽은것, { setDoc, getDocs, query, where, serverTimestamp } = window.fb;
    $('판-읽음').classList.add('hidden');
    $('판-올리는중').classList.remove('hidden');
    올리는중 = true; 자료그리기();
    const t0 = Date.now();
    let 창고 = '못 올림';
    try {
        // ① 이미 담긴 열쇠를 받아 겹친 줄을 뺀다 — 들어가기 전에 뺀다
        $('fill').style.width = '10%'; $('올림셈').textContent = '겹친 줄을 가리는 중…';
        const 이미 = new Set();
        (await getDocs(칸(자리.배송열쇠))).docs.forEach(d => (d.data().열쇠 || []).forEach(k => 이미.add(k)));
        const 새줄 = 것.줄들.filter(r => !이미.has(r.열쇠));
        const 겹침 = 것.줄들.length - 새줄.length;

        // ② 사람 칸을 지운 사본을 창고에
        $('fill').style.width = '25%'; $('올림셈').textContent = '원본을 창고에 올리는 중…';
        try {
            await window.fs.uploadBytes(window.fs.ref(window.st, 배송원본 + '/' + 것.이름), 것.지움.파일 || 것.날것);
            창고 = '창고 ✓';
        } catch (e) { 창고 = '창고 못 올림 — ' + (e.code || e.message); }

        // ③ 센 것을 달마다 한 문서로. 지우지 않고 **보탠다.**
        const 집계 = window.배송올리기.집계내기(새줄);
        const 달들 = Object.keys(집계.byMonth).sort();
        const 옛것 = {};
        (await getDocs(query(칸(자리.배송집계), where('파일', '==', 것.이름)))).docs
            .forEach(d => { const v = d.data() || {}; 옛것[v.달] = v; });
        for (let i = 0; i < 달들.length; i++) {
            const m = 달들[i], o = 옛것[m], 합 = Object.assign({}, (o && o.집계) || {});
            Object.entries(집계.byMonth[m]).forEach(([n, q]) => 합[n] = (합[n] || 0) + q);
            await setDoc(문서(자리.배송집계, 것.이름.replace(/[\/.#$\[\]]/g, '_') + '__' + m), {
                파일: 것.이름, 달: m, 줄수: ((o && o.줄수) || 0) + 집계.rowsOf[m], 집계: 합, 올린때: serverTimestamp() });
            $('fill').style.width = (30 + Math.round((i + 1) / 달들.length * 55)) + '%';
            $('올림셈').textContent = '센 것 넣는 중 — ' + (i + 1) + ' / ' + 달들.length + ' 달';
        }

        // ④ 들어간 줄의 열쇠를 담아 둔다. 다음에 겹치면 여기서 걸린다.
        $('fill').style.width = '92%'; $('올림셈').textContent = '겹침 열쇠를 담는 중…';
        const 담을 = [...new Set(새줄.map(r => r.열쇠))].filter(k => !이미.has(k));
        const 칸들 = (await getDocs(칸(자리.배송열쇠))).docs
            .map(d => ({ id: d.id, 열쇠: (d.data().열쇠 || []).slice() })).sort((a, b) => a.id.localeCompare(b.id));
        const 남은 = [...담을], 쓸것 = [];
        const 마지막 = 칸들[칸들.length - 1];
        if (마지막 && 마지막.열쇠.length < 열쇠칸수) {
            마지막.열쇠 = 마지막.열쇠.concat(남은.splice(0, 열쇠칸수 - 마지막.열쇠.length)); 쓸것.push(마지막);
        }
        let n = 칸들.length;
        while (남은.length) 쓸것.push({ id: String(n++).padStart(4, '0'), 열쇠: 남은.splice(0, 열쇠칸수) });
        for (const c of 쓸것) await setDoc(문서(자리.배송열쇠, c.id), { 열쇠: c.열쇠, 수: c.열쇠.length });

        if (window.기록) await window.기록.적기({ db: window.db, fb: window.fb, user: window.나,
            무엇: '배송관리', 파일: 것.이름, 줄수: 집계.used, 문서수: 달들.length,
            비고: [ 것.지움.뺀이름.length ? ('사람칸 ' + 것.지움.뺀이름.length + '개 지움') : '',
                    것.지움.가린수 ? ('번호 ' + 것.지움.가린수 + '개 가림') : '',
                    것.지움.주소본것 ? ('주소 ' + 것.지움.주소본것 + '건 가림') : '',
                    겹침 ? ('겹침 ' + 겹침 + '줄 건너뜀') : '' ].filter(Boolean).join(' · ') });

        $('판-끝').textContent = '담았습니다 · 배송정보 · ' + 것.이름 + ' · ' + 셈(집계.used) + '줄'
            + (겹침 ? ' · 겹쳐서 건너뜀 ' + 셈(겹침) : '') + ' · 달 ' + 달들.length + ' · ' + 창고
            + ' · ' + ((Date.now() - t0) / 1000).toFixed(1) + '초';
        $('판-끝').classList.remove('hidden');
        배송읽은것 = null;
        배송집계 = (await getDocs(칸(자리.배송집계))).docs.map(d => d.data() || {});
        자료그리기();
    } catch (err) {
        fail(new Error('배송정보를 담다가 멈췄습니다 — ' + err.message));
    }
    $('판-올리는중').classList.add('hidden');
    $('fill').style.width = '0';
    올리는중 = false; 자료그리기();
}

$('자료목록').addEventListener('click', async e => {
    const 갈 = e.target.closest('[data-role]'), 보 = e.target.closest('[data-view]'), 올 = e.target.closest('[data-pick]');
    try {
        if (올) { 고른갈래 = 올.dataset.pick; $('file').click(); }
        else if (갈) {
            const a = 자료들.find(x => x.id === 갈.dataset.role);
            a.갈래 = 갈래차례[(갈래차례.indexOf(a.갈래 || '') + 1) % 갈래차례.length];
            자료그리기();
            await window.fb.setDoc(문서(자리.자료, a.id), { 갈래: a.갈래 }, { merge: true });
            await 맞댐하기();
        } else if (보) {
            const id = 보.dataset.view;
            if (펼친자료 === id) { 펼친자료 = null; $('자료칸').classList.add('hidden'); return; }
            펼친자료 = id;
            const 줄 = id === '__상품목록' ? 담긴상품목록 : await 자료줄읽기(자료들.find(x => x.id === id));
            칸보기(줄);
        }
    } catch (err) { fail(err); }
});

function 칸보기(줄) {
    const 이름들 = []; const 본 = new Set();
    줄.forEach(o => Object.keys(o).forEach(k => { if (!본.has(k)) { 본.add(k); 이름들.push(k); } }));
    const 행 = 이름들.map(k => {
        const 값 = 줄.map(o => o[k] ?? '').filter(v => v !== '');
        const 가지 = new Set(값);
        return `<tr><td><b>${esc(k)}</b><div class="명료글씨">${esc([...가지].slice(0, 3).join(' · '))}</div></td>
            <td class="오른">${줄.length ? Math.round(값.length / 줄.length * 100) : 0}%</td><td class="오른">${셈(가지.size)}가지</td></tr>`;
    });
    $('자료칸').innerHTML = '<div class="명료가로"><table class="명료표">' + 행.join('') + '</table></div>';
    $('자료칸').classList.remove('hidden');
}

// ════════════════════════════════════════════════════════════════════
// 4. 맞대기 — 상품 한 줄에 그 상품의 단품을 코드·이름까지 붙여 보인다.
// ════════════════════════════════════════════════════════════════════
// 「상품목록의 상품명/코드별 - 이에 해당하는 단품명/코드명을 매칭시켜서 보여줘」 (10-08 사장님)
//
// ⚠ 맞는 것만 보이지 않는다. **못 맞춘 단품도 그 자리에 그대로 보인다** — 몇인지 머리에도 적는다.
//    숨기면 사장님이 못 믿으신다.
//
// 단품코드·단품명은 한 칸에 「+」 로 이어 붙어 있다. 「 +」 와 「+」 가 섞여 있어
// 「+」 로 쪼개고 앞뒤 빈칸을 턴다. (「 +」 로 쪼개면 163건이 틀어진다)
const 쪼개기 = s => String(s ?? '').split('+').map(v => v.trim()).filter(Boolean);
const 더하기 = (m, k, v) => { if (!m.has(k)) m.set(k, new Set()); m.get(k).add(v); };

// 코드 수와 이름 수가 맞는 줄로 「코드 → 이름」 사전을 먼저 짓는다.
// 단품**명** 안에도 「+」 가 든 줄이 있어 수가 안 맞는 줄이 있다 — 그런 줄을 이 사전으로 맞춘다.
// 「같은 단품코드 → 단품명은 늘 하나」 가 193가지에서 어긋남 0 이라 이 길이 선다.
function 사전짓기(줄들) {
    const 코드이름 = new Map(), 쓰임 = new Map();
    줄들.forEach(o => {
        const 코드 = 쪼개기(o['단품코드']), 이름 = 쪼개기(o['단품명']);
        if (코드.length && 코드.length === 이름.length) 코드.forEach((c, k) => 더하기(코드이름, c, 이름[k]));
        코드.forEach(c => 더하기(쓰임, c, o['상품코드'] || o['상품명'] || ''));
    });
    return { 코드이름, 쓰임 };
}

// 단품 자료의 코드 칸·이름 칸은 **이름으로 찾지 않는다** — 상품 쪽 값과 가장 많이 겹치는 칸이다.
// 그래야 칸 이름이 「품번·품명」 이어도 찾는다. 무엇을 골랐는지는 화면에 적어 드린다.
function 단품칸찾기(줄들, 사전) {
    const 이름들 = 줄들.length ? Object.keys(줄들[0]) : [];
    const 겹침 = (k, 모음) => 줄들.reduce((n, o) => n + (모음.has(o[k]) ? 1 : 0), 0);
    const 고르기 = (모음, 기본) => {
        let 고른 = '', 많 = 0;
        이름들.forEach(k => { const n = 겹침(k, 모음); if (n > 많) { 많 = n; 고른 = k; } });
        return 고른 || (이름들.indexOf(기본) > -1 ? 기본 : '');
    };
    const 이름모음 = new Set(); 사전.코드이름.forEach(s => s.forEach(v => 이름모음.add(v)));
    const 코드칸 = 고르기(사전.쓰임, '단품코드'), 이름칸 = 고르기(이름모음, '단품명');
    const 목록 = new Map();
    줄들.forEach(o => { const c = 코드칸 ? String(o[코드칸] || '').trim() : '';
        if (c && !목록.has(c)) 목록.set(c, 이름칸 ? String(o[이름칸] || '').trim() : ''); });
    return { 코드칸, 이름칸, 목록 };
}

// 이름을 찾는 네 걸음 — ① 한 줄에서 코드 수 = 이름 수 면 자리끼리
//                      ② 사전  ③ 단품관리목록  ④ 못 찾음(숨기지 않고 그대로 보인다)
function 맞대기(상줄들, 단줄들) {
    const 사전 = 사전짓기(상줄들);
    const 단 = (단줄들 && 단줄들.length) ? 단품칸찾기(단줄들, 사전) : null;
    const 상품들 = [];
    let 맞음 = 0, 못맞춤 = 0, 단품없는상품 = 0;
    상줄들.forEach(o => {
        const 코드 = 쪼개기(o['단품코드']), 이름 = 쪼개기(o['단품명']);
        const 자리끼리 = 코드.length > 0 && 코드.length === 이름.length;
        const 단품들 = 코드.map((c, i) => {
            if (자리끼리 && 이름[i]) return { 코드: c, 이름: 이름[i] };
            const 사 = 사전.코드이름.get(c);
            if (사 && 사.size) return { 코드: c, 이름: [...사][0] };
            if (단 && 단.목록.get(c)) return { 코드: c, 이름: 단.목록.get(c) };
            return { 코드: c, 이름: '' };                      // 못 찾음
        });
        단품들.forEach(d => d.이름 ? 맞음++ : 못맞춤++);
        if (!코드.length) 단품없는상품++;
        상품들.push({ 상품코드: o['상품코드'] || '', 상품명: o['상품명'] || '', 단품들 });
    });
    return { 상품들, 맞음, 못맞춤, 단품없는상품, 상품수: 상줄들.length,
        단코드칸: 단 ? 단.코드칸 : '', 단코드수: 단 ? 단.목록.size : 0 };
}

async function 맞댐하기() {
    // 상품 쪽 — 「상품」 딱지가 붙은 가장 새 자료. 없으면 이미 담긴 상품목록.
    const 상자료 = 자료들.find(a => a.갈래 === '상품'), 단자료 = 자료들.find(a => a.갈래 === '단품');
    const 상줄 = 상자료 ? await 자료줄읽기(상자료) : 담긴상품목록;
    const 단줄 = 단자료 ? await 자료줄읽기(단자료) : null;
    맞댐결과 = 맞대기(상줄, 단줄);
    맞댐그리기();
}

function 맞댐그리기() {
    const m = 맞댐결과;
    $('맞댐셈').textContent = '상품 ' + 셈(m.상품수) + ' · 단품 ' + 셈(m.맞음 + m.못맞춤)
        + ' · 못 맞춘 단품 ' + 셈(m.못맞춤) + (m.단품없는상품 ? ' · 단품 없는 상품 ' + 셈(m.단품없는상품) : '');
    // 자료 이름은 위 목록에 이미 있다 — 여기엔 **새로 아는 것만** 적는다.
    if (m.단코드칸) { $('맞댐잔').textContent = '코드 칸 ' + m.단코드칸 + ' · ' + 셈(m.단코드수) + '가지';
        $('맞댐잔').classList.remove('hidden'); }
    else $('맞댐잔').classList.add('hidden');
    const 줄 = m.상품들.slice(0, 보일건수).map(p => '<div class="맞댐상품">'
        + `<div class="맞댐머리"><span class="맞댐코드">${esc(p.상품코드)}</span><b>${esc(p.상품명)}</b></div>`
        + (p.단품들.length
            ? p.단품들.map(d => `<div class="맞댐단품"><span class="맞댐코드">${esc(d.코드)}</span>`
                + (d.이름 ? `<span class="이름">${esc(d.이름)}</span>` : '<span class="맞댐못">이름 못 찾음</span>') + '</div>').join('')
            : '<div class="맞댐단품"><span class="맞댐못">단품 없음</span></div>')
        + '</div>').join('');
    $('맞댐목록').innerHTML = 줄 + (m.상품들.length > 보일건수
        ? '<div class="명료잔" style="padding:10px 0">밖에 ' + 셈(m.상품들.length - 보일건수) + '건</div>' : '');
}

// ════════════════════════════════════════════════════════════════════
// 5. 규칙 — 한 줄씩 적어 둔다. 딱지를 누르면 추정 ↔ 확인.
// ════════════════════════════════════════════════════════════════════
function 규칙그리기() {
    $('규칙목록').innerHTML = 규칙들.map(r => `<div class="명료줄"><span style="flex:1;min-width:0;overflow-wrap:anywhere;padding:8px 0">${esc(r.글)}</span>
        <button class="명료딱지 ${r.상태 === '확인' ? '켬' : '노랑'}" data-rule="${esc(r.id)}">${esc(r.상태 || '추정')}</button></div>`).join('');
}
$('btn-rule').addEventListener('click', async () => {
    const 글 = $('규칙글').value.trim();
    if (!글) { $('규칙글').focus(); return; }
    const id = 때이름(new Date()), r = { 글, 상태: '추정', 누가: (window.나 && window.나.email) || '' };
    $('btn-rule').disabled = true;
    try {
        await window.fb.setDoc(문서(자리.규칙, id), Object.assign({ 언제: window.fb.serverTimestamp() }, r));
        규칙들.unshift(Object.assign({ id }, r)); $('규칙글').value = ''; 규칙그리기();
    } catch (err) { fail(new Error('규칙을 담지 못했습니다 — ' + err.message)); }
    $('btn-rule').disabled = false;
});
$('규칙글').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('btn-rule').click(); } });
$('규칙목록').addEventListener('click', async e => {
    const b = e.target.closest('[data-rule]');
    if (!b) return;
    const r = 규칙들.find(x => x.id === b.dataset.rule);
    r.상태 = r.상태 === '확인' ? '추정' : '확인';
    규칙그리기();
    try { await window.fb.setDoc(문서(자리.규칙, r.id), { 상태: r.상태 }, { merge: true }); }
    catch (err) { fail(new Error('규칙을 바꾸지 못했습니다 — ' + err.message)); }
});
</script>
