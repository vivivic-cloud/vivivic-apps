<!-- ==========================================
     벤더피아상품정리 / 제품명료화.html
     버전: v0.6.0 (2026-10-09) — 배송정보를 여기서 바로 올린다. 딴 장으로 보내지 않는다 (10-09 사장님)
            v0.5.0 (10-08) 상품 ↔ 단품 맞댄 표. 앞서 있던 분석과 「분석 복사」 는 걷어냈다
     목적: 벤더피아 엑셀(상품정보·단품정보)을 화베에 담아 두고,
           담긴 자료로 「단품 = 물건, 상품 = 파는 이름」 을 가려 가며
           규칙을 쌓는다. (10-07 사장님)

     쓰는 자리 — 셋 다 vp_ 로 시작한다. 화베 규칙이 사장님 계정만 들여보낸다.
       vp_명료자료   올린 엑셀 한 개 = 문서 한 개 (이름·칸이름·줄수·갈래)
       vp_명료묶음   그 엑셀의 줄들. 200줄씩 한 문서 — 읽기 횟수를 줄인다.
       vp_명료규칙   적어 둔 규칙
     읽기만 하는 자리
       vp_상품목록   상품정리 화면에서 이미 올린 상품목록. 한 글자도 안 쓴다.

     줄을 JSON 글자로 담는 까닭:
       칸 이름이 비었거나 겹치면 파이어스토어가 쓰기를 거부한다.
       값만 차례대로 글자로 담고 칸 이름은 자료 문서에 한 번만 둔다.

     막지 않는다:
       어떤 엑셀이든 읽고 올린다. 칸 이름으로 돌려보내는 길은 없다.
       갈래는 올리는 자리로 정한다 — 어느 자리의 「올리기」 를 누르셨는지가 곧 갈래다.
     ========================================== -->

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
        from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
    import { getFirestore, collection, doc, getDocs, setDoc, query, where, serverTimestamp }
        from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes }
        from "https://www.gstatic.com/firebasejs/11.2.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",
        authDomain: "vivivic-4b7ef.firebaseapp.com",
        projectId: "vivivic-4b7ef",
        storageBucket: "vivivic-4b7ef.firebasestorage.app",
        messagingSenderId: "830175660542",
        appId: "1:830175660542:web:9054030480c8280af8d8af",
        measurementId: "G-MCPHWSQBQR"
    };

    // ⚠ **앱에 이름을 붙인다 — 이것이 「들어왔다가 바로 나가진다」 를 막는 길이다.** (10-09)
    //    이 집 프로그램이 전부 vivivic-cloud.github.io 한 주소 아래 있다. 파이어베이스 로그인 자리는
    //    (주소 + 앱 이름)마다 하나인데, 다들 initializeApp(config) 를 **이름 없이** 부른다 →
    //    전부 같은 자리 하나를 쓴다. 그래서 돌림고리가 났다:
    //      ① 작업대·에이엠티가 익명으로 들어간다 → ② 여기가 익명을 보고 signOut 한다 →
    //      ③ 쫓겨난 ①이 또 익명으로 들어간다 → ④ 사장님이 비밀번호로 들어오셔도 ③이 덮는다 → ⑤ ②가 또 쫓아낸다.
    //    이름 'vp' 를 붙이면 로그인 자리가 따로 생겨 서로 못 건드린다.
    // ⚠ **getAuth·getFirestore·getStorage 를 반드시 이 app 에서 받아라.** 하나라도 이름 없는 앱에서
    //    받으면 자격이 엇갈려 쓰기가 거부된다.
    // ⚠ 익명으로 도는 다른 프로그램(작업대·에이엠티·조혼가구·원장관리)은 **한 글자도 건드리지 않는다.**
    const app = initializeApp(firebaseConfig, 'vp');
    const auth = getAuth(app);
    window.db = getFirestore(app);
    window.fb = { collection, doc, getDocs, setDoc, query, where, serverTimestamp };
    window.st = getStorage(app);                      // 배송 원본은 창고로 간다
    window.fs = { ref, uploadBytes };

    // 상품정리 화면과 같은 잠금이다 — 사장님 계정으로만 들어간다.
    onAuthStateChanged(auth, (user) => {
        if (!user) { window.잠금.열기((메일, 비번) => signInWithEmailAndPassword(auth, 메일, 비번)); return; }
        if (user.isAnonymous) { signOut(auth); return; }   // 남아 있던 익명 통행증은 내보낸다
        window.잠금.닫기(user, () => signOut(auth));
        window.나 = user;
        window.initApp();
    });
</script>

<script src="../shared/viggle.js"></script>

<script>
// ════════════════════════════════════════════════════════════════════
// 설정
// ════════════════════════════════════════════════════════════════════
const 뿌리 = ['artifacts','vivivic-4b7ef','public','data'];
const 자리 = { 상품목록: 'vp_상품목록', 자료: 'vp_명료자료', 묶음: 'vp_명료묶음', 규칙: 'vp_명료규칙',
    배송집계: 'vp_배송집계', 배송열쇠: 'vp_배송열쇠' };
const 배송원본 = 'artifacts/vivivic-4b7ef/vp_배송원본';   // 창고. 배송관리업로드와 같은 자리다.
const 열쇠칸수 = 20000;          // 열쇠 하나 17바이트 → 한 문서 340KB (한 문서 1MB 한계 안)
const 묶음줄수 = 200;            // 한 문서에 담는 줄 수
const 묶음글자 = 250000;         // 한 문서 1MB 한계 — 한글은 한 글자가 3바이트라 25만 글자에서 끊는다
const 머리줄깊이 = 10;
const 보일건수 = 200;            // 한 갈래에서 화면에 그리는 건수

const $ = id => document.getElementById(id);

// 머리 탭 — 「재고관리」 를 누르면 재고 화면으로 들어간다. 「제품명료화」 로 돌아온다.
const 탭판 = { 명료: ['판-올리기', '판-자료', '판-맞댐', '판-규칙'], 재고: ['판-재고'] };
let 지금탭 = '명료';
function 탭보이기(t) {
    지금탭 = t;
    Object.keys(탭판).forEach(k => 탭판[k].forEach(i => $(i).classList.add('hidden')));
    탭판[t].forEach(i => $(i).classList.remove('hidden'));
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('켬', b.dataset.tab === t));
    window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
    const b = e.target.closest('[data-tab]');
    if (b) 탭보이기(b.dataset.tab);
});
const esc = s => String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const 셈 = n => Number(n || 0).toLocaleString('ko-KR');
const 칸 = 이름 => window.fb.collection(window.db, ...뿌리, 이름);
const 문서 = (이름, id) => window.fb.doc(window.db, ...뿌리, 이름, id);

function 때이름(d) {
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' +
           p(d.getHours()) + p(d.getMinutes()) + '-' + p(d.getSeconds());
}
const 때보임 = id => { const m = String(id).match(/^\d{4}(\d{2})(\d{2})-(\d{2})(\d{2})/); return m ? `${m[1]}-${m[2]} ${m[3]}:${m[4]}` : ''; };

function fail(err) {
    console.error(err);
    $('err').textContent = err.message || String(err);
    $('err').classList.remove('hidden');
    $('err').scrollIntoView({ block: 'center' });
}
// 어디서 터지든 화면에 보인다 — 조용히 죽으면 「반응이 없다」 가 된다 (10-07 사장님)
window.addEventListener('error', e => fail(new Error('화면 오류 — ' + (e.message || '까닭 모름'))));
window.addEventListener('unhandledrejection', e => fail(new Error('화면 오류 — ' + ((e.reason && e.reason.message) || e.reason || '까닭 모름'))));

// ════════════════════════════════════════════════════════════════════

let 담긴상품목록 = [];           // vp_상품목록 의 줄들 ({칸이름: 값})
let 자료들 = [];                 // vp_명료자료 문서들 (새것이 앞)
let 규칙들 = [];
let 배송집계 = [];               // vp_배송집계 — 배송관리업로드가 쌓은 것. 읽기만 한다.
const 읽은줄 = new Map();        // 자료 id → 줄들 ({칸이름: 값})
let 맞댐결과 = null;

window.initApp = async function () {
    try {
        const { getDocs } = window.fb;
        const [상, 자, 규, 배] = await Promise.all([
            getDocs(칸(자리.상품목록)), getDocs(칸(자리.자료)), getDocs(칸(자리.규칙)), getDocs(칸(자리.배송집계))
        ]);
        배송집계 = 배.docs.map(d => d.data() || {});
        담긴상품목록 = 상.docs.map(d => (d.data() || {}).fields || {});
        자료들 = 자.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => a.id < b.id ? 1 : -1);
        규칙들 = 규.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => a.id < b.id ? 1 : -1);
        $('loading').classList.add('hidden');
        $('탭').classList.remove('hidden');
        탭보이기(지금탭);
        자료그리기(); 규칙그리기();
        await 맞댐하기();
        await 재고하기();
    } catch (err) { $('loading').classList.add('hidden'); fail(new Error('읽지 못했습니다 — ' + err.message)); }
};

// ════════════════════════════════════════════════════════════════════
// 1. 엑셀 읽기 — 어떤 엑셀이든 읽는다. 칸 이름으로 막지 않는다.
// ════════════════════════════════════════════════════════════════════
let 읽은것 = null;               // { 이름, 칸이름[], 줄[][] , 머리줄, 건너뜀 }

// 위 열 줄 가운데 채워진 칸이 가장 많은 줄이 머리줄이다 (같으면 위엣것).
function 머리줄찾기(aoa) {
    const 이름들 = 줄 => (줄 || []).map(h => String(h ?? '').trim());
    let 고른것 = { 몇째: 0, 이름들: 이름들(aoa[0]) };
    for (let i = 1; i < Math.min(머리줄깊이, aoa.length); i++) {
        const n = 이름들(aoa[i]);
        if (n.filter(Boolean).length > 고른것.이름들.filter(Boolean).length) 고른것 = { 몇째: i, 이름들: n };
    }
    return 고른것;
}

// 빈 칸 이름은 「칸7」, 겹친 이름은 「이름(2)」 — 그래야 뒤엣것이 앞엣것을 안 덮는다.
function 칸이름다듬기(이름들) {
    const 본 = new Map();
    return 이름들.map((h, i) => {
        let n = h || ('칸' + (i + 1));
        const k = (본.get(n) || 0) + 1; 본.set(n, k);
        return k > 1 ? n + '(' + k + ')' : n;
    });
}

// 엑셀 한 장을 안전하게 줄 배열로. **두 길(상품·단품·그 밖 / 배송정보)이 다 이것을 쓴다.**
// 「엑셀을 못읽었대」 — 화면에 「Invalid array length」 가 떴다 (10-09 사장님). 까닭 둘을 여기서 막는다:
//   ① 엑셀에서 **열 통째에 서식**을 먹이면 시트의 테두리(!ref)가 A1:XFD1048576 으로 나온다.
//      그대로 sheet_to_json 에 넣으면 170억 칸을 만들려다 화면이 굳거나 터진다.
//      → **!ref 를 안 믿고 실제로 값이 든 칸으로 테두리를 다시 잰다.**
//   ② 첫 장이 안내문인 파일이 있다. wb.SheetNames[0] 만 보면 자료를 통째로 놓친다.
//      → **칸이 가장 많이 든 시트**를 고르고, 무엇을 골랐는지 화면에 적는다.
// ⚠ 못 읽는 파일을 조용히 삼키지 않는다. 사장님이 알아들을 말로 적는다.
// 시트의 테두리를 **실제로 값이 든 칸**으로 잰다. !ref 는 믿지 않는다.
// ⚠ SheetJS 는 판마다 칸을 담는 꼴이 다르다. 셋을 다 받는다 —
//    0.20.x dense : ws['!data'][행][칸]      0.18.x dense : ws 가 배열, ws[행][칸]
//    성긴(sparse) : ws['A1'] 처럼 글자 열쇠
//    모르는 꼴이면 !ref 로 물러나되 **터무니없는 크기는 자른다** (열 통째에 서식 먹인 파일).
function 테두리(ws) {
    const 행들 = ws['!data'] || (Array.isArray(ws) ? ws : null);
    if (행들) {
        let r1 = Infinity, r2 = -1, c2 = -1;
        for (let i = 0; i < 행들.length; i++) {
            const 행 = 행들[i]; if (!행 || !행.length) continue;
            let 끝 = -1;
            for (let c = 0; c < 행.length; c++) if (행[c] != null) 끝 = c;
            if (끝 < 0) continue;
            if (i < r1) r1 = i;
            if (i > r2) r2 = i;
            if (끝 > c2) c2 = 끝;
        }
        return r2 >= 0 ? { s: { r: r1, c: 0 }, e: { r: r2, c: c2 } } : null;
    }
    const 열쇠 = Object.keys(ws).filter(k => k.charAt(0) !== '!');
    if (열쇠.length) {
        let r1 = Infinity, r2 = -1, c1 = Infinity, c2 = -1, 봤다 = false;
        열쇠.forEach(k => {
            let a; try { a = XLSX.utils.decode_cell(k); } catch (e) { return; }
            if (!a || !isFinite(a.r) || !isFinite(a.c) || a.r < 0 || a.c < 0) return;
            봤다 = true;
            if (a.r < r1) r1 = a.r;
            if (a.r > r2) r2 = a.r;
            if (a.c < c1) c1 = a.c;
            if (a.c > c2) c2 = a.c;
        });
        if (봤다) return { s: { r: r1, c: c1 }, e: { r: r2, c: c2 } };
    }
    if (ws['!ref']) {
        try {
            const r = XLSX.utils.decode_range(ws['!ref']);
            if (r && isFinite(r.e.r) && isFinite(r.e.c)) {
                const s0 = Math.max(0, r.s.r), c0 = Math.max(0, r.s.c);
                const s1 = Math.min(r.e.r, s0 + 500000), c1 = Math.min(r.e.c, c0 + 500);
                if (s1 >= s0 && c1 >= c0) return { s: { r: s0, c: c0 }, e: { r: s1, c: c1 } };
            }
        } catch (e) { /* !ref 가 쓰레기면 그냥 없는 것으로 본다 */ }
    }
    return null;
}

// 엑셀 한 장을 안전하게 줄 배열로. **두 길(상품·단품·그 밖 / 배송정보)이 다 이것을 쓴다.**
// 「엑셀을 못읽었대 — Invalid array length」 (10-09 사장님). 막는 것 셋:
//   ① **dense** — 칸 하나에 객체 하나를 만들지 않고 배열로 담는다. SheetJS 가 「10만 줄 넘으면
//      dense 를 써라」 고 적어 두었다. 20만 줄 × 38칸이면 칸이 760만 개다.
//   ② 열 통째에 서식을 먹인 파일은 !ref 가 A1:XFD1048576 으로 나온다 → 테두리()가 막는다.
//   ③ 첫 장이 안내문인 파일 → 가장 넓은 시트를 고르고 무엇을 골랐는지 화면에 적는다.
// ⚠ 못 읽는 파일을 조용히 삼키지 않는다. 사장님이 알아들을 말로 적는다.
function 시트읽기(buf) {
    let wb;
    try { wb = XLSX.read(new Uint8Array(buf), { type: 'array', dense: true }); }
    catch (e) { throw new Error('엑셀로 열리지 않는 파일입니다 — ' + (e.message || e)); }
    if (!wb || !wb.SheetNames || !wb.SheetNames.length) throw new Error('이 파일에는 시트가 없습니다.');

    let 고른 = null, 넓이 = -1, 시트이름 = '', 고른테 = null;
    wb.SheetNames.forEach(n => {
        const ws = wb.Sheets[n]; if (!ws) return;
        const t = 테두리(ws); if (!t) return;
        const 넓 = (t.e.r - t.s.r + 1) * (t.e.c - t.s.c + 1);
        if (넓 > 넓이) { 넓이 = 넓; 고른 = ws; 시트이름 = n; 고른테 = t; }
    });
    if (!고른) throw new Error('이 파일은 시트가 비어 있습니다.');

    const aoa = XLSX.utils.sheet_to_json(고른, { header: 1, defval: '', range: 고른테 });
    if (!aoa.length) throw new Error('이 파일은 시트가 비어 있습니다.');
    return { aoa, 시트이름, 시트수: wb.SheetNames.length };
}

function 엑셀읽기(buf, 이름) {
    const { aoa, 시트이름, 시트수 } = 시트읽기(buf);
    const 머리 = 머리줄찾기(aoa);
    const 칸이름 = 칸이름다듬기(머리.이름들);
    const 줄 = []; let 건너뜀 = 0;
    for (let i = 머리.몇째 + 1; i < aoa.length; i++) {
        // 값은 전부 글자로 — 앞자리 0 과 날짜 모양을 지킨다
        const v = 칸이름.map((_, c) => { const x = aoa[i][c]; return (x === undefined || x === null) ? '' : String(x).trim(); });
        if (v.some(x => x !== '')) 줄.push(v); else 건너뜀++;
    }
    return { 이름, 칸이름, 줄, 머리줄: 머리.몇째 + 1, 건너뜀, 시트이름, 시트수 };
}

// 갈래는 **올리는 자리로 정한다.** 칸 이름으로 짐작하지 않는다 —
// 어느 자리의 「올리기」 를 누르셨는지가 곧 갈래다. (10-07 사장님)
// 재고정보 — 단품의 재고수량이 든 자리 (10-09 사장님 「재고정리 파일을 올릴 자리를 만들어줘」)
const 갈래들 = [['상품', '상품정보'], ['단품', '단품정보'], ['재고', '재고정보'], ['', '그 밖']];
const 갈래이름 = g => g === '배송' ? '배송정보'
    : (갈래들.find(x => x[0] === (g || '')) || 갈래들[갈래들.length - 1])[1];
let 고른갈래 = '';

$('file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    // 고르자마자 판을 띄운다 — 큰 엑셀은 읽는 데 몇 초 걸리고, 그동안 아무것도 안 보이면 먹통 같다
    읽은것 = null;
    $('err').classList.add('hidden'); $('판-끝').classList.add('hidden');
    $('읽음이름').textContent = f.name;
    $('읽음셈').textContent = '읽는 중…';
    $('btn-up').textContent = 갈래이름(고른갈래) + ' 자리에 담기';
    $('btn-up').disabled = true;
    $('판-읽음').classList.remove('hidden');
    $('판-읽음').scrollIntoView({ block: 'center' });
    const r = new FileReader();
    r.onload = ev => setTimeout(() => {          // 「읽는 중」 이 먼저 그려지게 한 박자 쉰다
        try {
            if (고른갈래 === '배송') {
                // 흘려 읽기가 되면 그 길로. 안 되면(.xls·csv·옛 사파리) 옛 길로 떨어진다.
                if (window.엑셀흘려읽기) {
                    배송흘려고름(ev.target.result, f)
                        .catch(err => { if (String(err && err.message).indexOf('지퍼 꼴이 아닙니다') > -1) {
                                try { 배송고름(ev.target.result, f); } catch (e2) { $('판-읽음').classList.add('hidden'); fail(new Error('엑셀을 읽지 못했습니다 — ' + e2.message)); }
                            } else { $('판-읽음').classList.add('hidden'); fail(new Error('엑셀을 읽지 못했습니다 — ' + (err.message || err))); } });
                    return;
                }
                배송고름(ev.target.result, f); return;
            }
            읽은것 = 엑셀읽기(ev.target.result, f.name);
            $('읽음셈').textContent = 셈(읽은것.줄.length) + '줄 · ' + 읽은것.칸이름.length + '칸 · 머리줄 ' + 읽은것.머리줄 + '째'
                + (읽은것.시트수 > 1 ? ' · 시트 ' + 읽은것.시트이름 : '');
            $('btn-up').disabled = false;
        } catch (err) { $('판-읽음').classList.add('hidden'); fail(new Error('엑셀을 읽지 못했습니다 — ' + err.message)); }
    }, 30);
    r.onerror = () => { $('판-읽음').classList.add('hidden'); fail(new Error('파일을 읽지 못했습니다.')); };
    r.readAsArrayBuffer(f);
    e.target.value = '';
});
$('btn-cancel').addEventListener('click', () => { 읽은것 = null; 배송읽은것 = null; $('판-읽음').classList.add('hidden'); });

// ════════════════════════════════════════════════════════════════════
// 2. 화베에 담기 — 줄 묶음을 먼저, 자료 문서를 맨 끝에.
//    끊기면 자료 문서가 없어서 목록에 안 뜬다. 반쯤 담긴 것이 분석에 섞이지 않는다.
// ════════════════════════════════════════════════════════════════════
function 묶기(줄) {
    const 묶음들 = []; let 지금 = [], 글자 = 0;
    줄.forEach(v => {
        const s = JSON.stringify(v);
        if (지금.length && (지금.length >= 묶음줄수 || 글자 + s.length > 묶음글자)) { 묶음들.push(지금); 지금 = []; 글자 = 0; }
        지금.push(s); 글자 += s.length;
    });
    if (지금.length) 묶음들.push(지금);
    return 묶음들;
}

$('btn-up').addEventListener('click', async () => {
    if (배송읽은것) { await 배송담기(); return; }
    if (!읽은것) return;
    const { setDoc, serverTimestamp } = window.fb;
    const 올릴것 = 읽은것, id = 때이름(new Date()), 올린갈래 = 고른갈래;
    const 묶음들 = 묶기(올릴것.줄);
    $('판-읽음').classList.add('hidden');
    $('판-올리는중').classList.remove('hidden');
    올리는중 = true; 자료그리기();
    let 간줄 = 0;
    $('올림셈').textContent = '0 / ' + 셈(올릴것.줄.length);
    // 화베가 답이 없으면 그렇다고 적는다 — 인터넷이 끊기면 쓰기가 끝없이 기다린다
    const 늦음 = setInterval(() => { if (Date.now() - 마지막답 > 15000) $('올림셈').textContent = 셈(간줄) + ' / ' + 셈(올릴것.줄.length) + ' · 화베 답 없음'; }, 3000);
    let 마지막답 = Date.now();
    try {
        for (let i = 0; i < 묶음들.length; i++) {
            await setDoc(문서(자리.묶음, id + '__' + String(i).padStart(4, '0')), { 자료: id, 차례: i, 줄들: 묶음들[i] });
            간줄 += 묶음들[i].length; 마지막답 = Date.now();
            $('fill').style.width = Math.round(간줄 / 올릴것.줄.length * 100) + '%';
            $('올림셈').textContent = 셈(간줄) + ' / ' + 셈(올릴것.줄.length);
        }
        const 새자료 = { 이름: 올릴것.이름, 칸이름: 올릴것.칸이름, 줄수: 올릴것.줄.length, 묶음수: 묶음들.length,
            머리줄: 올릴것.머리줄, 갈래: 올린갈래, 누가: (window.나 && window.나.email) || '' };
        await setDoc(문서(자리.자료, id), Object.assign({ 언제: serverTimestamp() }, 새자료));
        if (window.기록) await window.기록.적기({ db: window.db, fb: window.fb, user: window.나,
            무엇: '제품명료화', 파일: 올릴것.이름, 줄수: 올릴것.줄.length, 문서수: 묶음들.length + 1,
            비고: 올릴것.건너뜀 ? ('건너뜀 ' + 올릴것.건너뜀) : '' });
        자료들.unshift(Object.assign({ id }, 새자료));
        읽은줄.set(id, 올릴것.줄.map(v => 줄풀기(올릴것.칸이름, v)));
        읽은것 = null;
        $('판-끝').textContent = '담았습니다 · ' + 갈래이름(올린갈래) + ' · ' + 올릴것.이름 + ' · ' + 셈(올릴것.줄.length) + '줄';
        $('판-끝').classList.remove('hidden');
        자료그리기();
        await 맞댐하기();
        await 재고하기();
    } catch (err) {
        fail(new Error(셈(간줄) + '줄까지 담고 멈췄습니다 — ' + err.message));
    }
    clearInterval(늦음);
    $('판-올리는중').classList.add('hidden');
    $('fill').style.width = '0';
    올리는중 = false; 자료그리기();
});

const 줄풀기 = (칸이름, v) => { const o = {}; 칸이름.forEach((h, i) => o[h] = v[i] ?? ''); return o; };

async function 자료줄읽기(자료) {
    if (읽은줄.has(자료.id)) return 읽은줄.get(자료.id);
    const { getDocs, query, where } = window.fb;
    const 눈 = await getDocs(query(칸(자리.묶음), where('자료', '==', 자료.id)));
    const 묶음 = 눈.docs.map(d => d.data()).sort((a, b) => a.차례 - b.차례);
    const 줄 = [];
    묶음.forEach(m => (m.줄들 || []).forEach(s => 줄.push(줄풀기(자료.칸이름 || [], JSON.parse(s)))));
    읽은줄.set(자료.id, 줄);
    return 줄;
}

// ════════════════════════════════════════════════════════════════════
// 3. 담긴 자료 — 이름을 누르면 칸마다 채움·가짓수·보기. 딱지를 누르면 갈래가 바뀐다.
// ════════════════════════════════════════════════════════════════════
let 펼친자료 = null, 올리는중 = false;

function 자료그리기() {
    const 판 = [];
    갈래들.forEach(([g, 이름]) => {
        판.push(`<div class="명료갈래"><b>${esc(이름)}</b><button class="명료딱지 켬" data-pick="${esc(g)}"${올리는중 ? ' disabled' : ''}>올리기</button></div>`);
        const 것 = 자료들.filter(a => (a.갈래 || '') === g);
        // 「그 밖」 은 기준이 따로 없다 — 다 같은 무게로 보인다
        const 줄 = 것.map((a, i) => `<div class="명료줄${g && i ? ' 옛' : ''}"><span class="이름" data-view="${esc(a.id)}">${esc(a.이름)}</span>
            ${g && !i ? '<span class="지금">지금</span>' : ''}<span class="수">${셈(a.줄수)}줄 · ${esc(때보임(a.id))}</span></div>`);
        // 상품정리 화면에서 올린 상품목록 — 여기서 상품정보를 올리기 전까지는 이것이 기준이다
        if (g === '상품' && 담긴상품목록.length) 줄.push(`<div class="명료줄${것.length ? ' 옛' : ''}"><span class="이름" data-view="__상품목록">상품목록 (상품정리)</span>
            ${것.length ? '' : '<span class="지금">지금</span>'}<span class="수">${셈(담긴상품목록.length)}줄</span></div>`);
        판.push(줄.join('') || '<div class="명료잔" style="padding:10px 0">없음</div>');
        if (g === '단품') 판.push(배송자리());
    });
    $('자료목록').innerHTML = 판.join('');
}

// 배송정보 — **여기서 바로 올린다. 딴 장으로 보내지 않는다.**
// 「배송관리 파일이 업로드 되지 않고, 업로드 시도시 로딩후 벤더피아상품정리 프로그램으로
//  화면전화 됩니다. 벤더피아 상품정리 프로그램은 이프로그램과 관련시키지 마세요」 (10-09 사장님)
// 사람 칸 지우기·번호와 주소 가리기·겹친 주문줄 거르기는 **배송올리기.js 한 벌**을 그대로 쓴다.
// ⚠ 그 셈을 여기에 베끼지 마라 — 두 벌이 되면 언젠가 달라지고 사람 정보가 샌다.
function 배송자리() {
    const 파일 = new Map();
    배송집계.forEach(d => {
        const f = 파일.get(d.파일) || { 줄: 0, 달: [] };
        f.줄 += Number(d.줄수) || 0; if (d.달) f.달.push(String(d.달)); 파일.set(d.파일, f);
    });
    const 줄 = [...파일.entries()].map(([이름, f]) => { f.달.sort();
        const 달 = f.달.length > 1 ? f.달[0] + '~' + f.달[f.달.length - 1] : (f.달[0] || '');
        return `<div class="명료줄"><span class="이름" style="cursor:default">${esc(이름)}</span><span class="수">${셈(f.줄)}줄 · ${esc(달)}</span></div>`; });
    return `<div class="명료갈래"><b>배송정보</b><button class="명료딱지 켬" data-pick="배송"${올리는중 ? ' disabled' : ''}>올리기</button></div>`
        + (줄.join('') || '<div class="명료잔" style="padding:10px 0">없음</div>');
}

// 배송정보 — 읽고 담는 길. **셈은 한 글자도 베끼지 않고 배송올리기.js 를 부른다.**
// 사람 칸 지우기·번호와 주소 가리기·겹침 열쇠 고르기가 두 벌이 되면 사람 정보가 샌다.
// ════════════════════════════════════════════════════════════════════
let 배송읽은것 = null;

// ── 흘려 읽는 길 ────────────────────────────────────────────────────
// 20만 줄을 통째로 메모리에 올리지 않는다. 두 번 흘려 읽는다 —
//   ① 고를 때  : 머리줄 · 칸 이름 · 겹침 열쇠 · 줄 수를 센다. 줄은 안 들고 있는다.
//   ② 담을 때  : 다시 흘리며 가리고 → CSV 토막으로 뱉고 → 세고 → 버린다.
// 손에 남는 것은 집계(작다) + 열쇠 목록 + CSV 토막뿐이다.
// 가리는 셈은 배송올리기.js 의 **한 벌**(가릴자리·줄가리기)을 그대로 부른다. 베끼지 않는다.
async function 배송흘려고름(buf, f) {
    const B = window.배송올리기, S = window.엑셀흘려읽기;
    const 첫줄 = [];
    let 머리 = -1, head = null, 후보 = null, 봉지 = null;
    let 쓸줄수 = 0, 취소 = 0, 이름없음 = 0, iN = -1, iC = -1, 칸수 = 0;
    const 센것 = await S.줄마다(buf, (값, i) => {
        if (머리 < 0) {
            첫줄.push(값.slice());
            if (첫줄.length < 머리줄깊이) return;          // 위 열 줄을 모아 머리줄을 고른다
            머리 = B.머리줄찾기(첫줄);
            head = (첫줄[머리] || []).map(h => String(h).trim());
            칸수 = head.length;
            iN = head.indexOf('상품명'); iC = head.indexOf('CS');
            후보 = B.열쇠후보(head);
            봉지 = 후보.map(c => ({ 칸: c, 본것: new Set(), 산다: true }));
            for (let k = 머리 + 1; k < 첫줄.length; k++) 한줄본다(첫줄[k]);
            return;
        }
        한줄본다(값);
    });
    if (머리 < 0) {                                        // 열 줄이 안 되는 파일
        if (!첫줄.length) throw new Error('이 파일은 시트가 비어 있습니다.');
        머리 = B.머리줄찾기(첫줄);
        head = (첫줄[머리] || []).map(h => String(h).trim());
        칸수 = head.length;
        iN = head.indexOf('상품명'); iC = head.indexOf('CS');
        후보 = B.열쇠후보(head);
        봉지 = 후보.map(c => ({ 칸: c, 본것: new Set(), 산다: true }));
        for (let k = 머리 + 1; k < 첫줄.length; k++) 한줄본다(첫줄[k]);
    }

    function 한줄본다(값) {
        if (!값 || !값.length) return;
        let 빔 = true;
        for (let i = 0; i < 값.length; i++) if (String(값[i]).trim() !== '') { 빔 = false; break; }
        if (빔) return;                                    // 통째로 빈 줄만 거른다
        if (iC >= 0 && String(값[iC] ?? '').trim() === '취소') { 취소++; return; }
        if (iN >= 0 && !String(값[iN] ?? '').trim()) { 이름없음++; return; }
        쓸줄수++;
        for (const b of 봉지) {                            // 겹치는 후보는 그 자리에서 버린다
            if (!b.산다) continue;
            const k = B.열쇠값(값, b.칸);
            if (b.본것.has(k)) { b.산다 = false; b.본것 = null; } else b.본것.add(k);
        }
    }

    const 산것 = 봉지.find(b => b.산다);
    const 열쇠 = 산것 ? { 칸: 산것.칸, 이름: 산것.칸.map(i => head[i]).join(' + '), 안겹침: true }
                      : { 칸: null, 이름: '줄 전체', 안겹침: false };
    봉지 = null;
    const 자리 = B.가릴자리(head);
    배송읽은것 = { 이름: f.name, 날것: f, 흘림: true, head, 머리, 열쇠, 취소, 이름없음, 쓸줄수 };
    $('읽음셈').textContent = 셈(쓸줄수) + '줄 · ' + 칸수 + '칸 · 머리줄 ' + (머리 + 1) + '째'
        + (센것.공유수 ? ' · 공유글자 ' + 셈(센것.공유수) + '가지' : '')
        + (취소 ? ' · 취소 ' + 셈(취소) + ' 뺌' : '')
        + ' · 열쇠 ' + 열쇠.이름
        + ' · 사람칸 ' + 자리.뺀이름.length + '개 지움';
    $('btn-up').disabled = false;
}

// 담을 때 — 다시 흘리며 가리고 세고 버린다. 겹친 줄은 들어가기 전에 뺀다.
async function 배송흘려담기(것, 이미) {
    const B = window.배송올리기, S = window.엑셀흘려읽기;
    const { 뺄자리, 뺀이름, 남길자리 } = B.가릴자리(것.head);
    const iN = 것.head.indexOf('상품명'), iQ = 것.head.indexOf('수량'),
          iD = 것.head.indexOf('주문등록일'), iC = 것.head.indexOf('CS');
    const 셈통 = { 가린수: 0, 주소본것: 0 };
    const byMonth = {}, rowsOf = {};
    const 조각들 = [B.BOM], 묶음 = [], 새열쇠 = new Set();
    let 센줄 = 0, 겹침 = 0, 줄차례 = 0;
    await S.줄마다(await 것.날것.arrayBuffer(), (값) => {
        // ⚠ **창고 사본에는 모든 줄이 들어간다** — 머리줄도, 취소 줄도, 겹친 줄도.
        //    창고는 원본을 두는 자리다(CLAUDE.md 「원본을 버리지 마라」). 세는 것만 걸러낸다.
        const rr = 남길자리.map(i => (값[i] !== undefined) ? String(값[i]) : '');
        B.줄가리기(rr, 셈통);                                  // ← 가리는 셈은 한 벌 그대로
        묶음.push(rr.map(B.칸글).join(','));
        if (묶음.length >= 5000) { 조각들.push(묶음.join('\n') + '\n'); 묶음.length = 0; }

        // 여기부터는 **세는 쪽**이다. 창고와 상관없다.
        if (줄차례++ <= 것.머리) return;
        if (!값 || !값.length) return;
        let 빔 = true;
        for (let i = 0; i < 값.length; i++) if (String(값[i]).trim() !== '') { 빔 = false; break; }
        if (빔) return;
        if (iC >= 0 && String(값[iC] ?? '').trim() === '취소') return;
        if (iN >= 0 && !String(값[iN] ?? '').trim()) return;
        const 열 = B.해시(B.열쇠값(값, 것.열쇠.칸));
        if (이미.has(열) || 새열쇠.has(열)) { 겹침++; return; }   // 들어가기 전에 뺀다
        새열쇠.add(열);
        const 달 = iD >= 0 ? (B.toMonth(값[iD]) || '날짜없음') : '날짜없음';
        const 이름 = iN >= 0 ? String(값[iN] ?? '').trim() : '';
        const 몇 = iQ >= 0 ? (parseFloat(String(값[iQ] ?? '').replace(/,/g, '')) || 0) : 1;
        센줄++;
        if (이름) { if (!byMonth[달]) { byMonth[달] = {}; rowsOf[달] = 0; }
            byMonth[달][이름] = (byMonth[달][이름] || 0) + 몇; rowsOf[달]++; }
    });
    if (묶음.length) 조각들.push(묶음.join('\n') + '\n');
    return { 집계: { byMonth, rowsOf, used: 센줄 }, 겹침, 새열쇠: [...새열쇠],
             지움: { 뺀이름, 가린수: 셈통.가린수, 주소본것: 셈통.주소본것,
                     파일: 뺄자리.length ? new Blob(조각들, { type: 'text/csv;charset=utf-8' }) : null } };
}

function 배송고름(buf, f) {
    const B = window.배송올리기;
    const { aoa, 시트이름, 시트수 } = 시트읽기(buf);
    const 머리 = B.머리줄찾기(aoa);
    const head = (aoa[머리] || []).map(h => String(h).trim());
    const 지움 = B.사람정보지우기(aoa, head);        // 사람 칸을 지운 사본을 창고에 올린다

    // ⚠ 칸 이름으로 막지 않는다. 없으면 없는 대로 간다.
    const iN = head.indexOf('상품명'), iQ = head.indexOf('수량'),
          iD = head.indexOf('주문등록일'), iC = head.indexOf('CS');
    const 쓸줄 = []; let 취소 = 0, 이름없음 = 0;
    for (let i = 머리 + 1; i < aoa.length; i++) {
        const row = aoa[i];
        if (!row || !row.length) continue;
        if (row.every(v => String(v ?? '').trim() === '')) continue;   // 통째로 빈 줄만 거른다
        if (iC >= 0 && String(row[iC] ?? '').trim() === '취소') { 취소++; continue; }   // 안 나간 것
        if (iN >= 0 && !String(row[iN] ?? '').trim()) { 이름없음++; continue; }
        쓸줄.push(row);
    }
    const 열쇠 = B.열쇠고르기(head, 쓸줄);
    const 줄들 = 쓸줄.map(row => ({
        mon: iD >= 0 ? (B.toMonth(row[iD]) || '날짜없음') : '날짜없음',
        name: iN >= 0 ? String(row[iN] ?? '').trim() : '',
        q: iQ >= 0 ? (parseFloat(String(row[iQ] ?? '').replace(/,/g, '')) || 0) : 1,
        열쇠: B.해시(B.열쇠값(row, 열쇠.칸))
    }));
    배송읽은것 = { 이름: f.name, 날것: f, 줄들, 열쇠, 취소, 이름없음, 지움 };
    $('읽음셈').textContent = 셈(줄들.length) + '줄 · ' + head.length + '칸 · 머리줄 ' + (머리 + 1) + '째'
        + (시트수 > 1 ? ' · 시트 ' + 시트이름 : '')
        + (취소 ? ' · 취소 ' + 셈(취소) + ' 뺌' : '')
        + ' · 열쇠 ' + 열쇠.이름
        + ' · 사람칸 ' + 지움.뺀이름.length + '개 지움'
        + (지움.가린수 ? ' · 번호 ' + 지움.가린수 + '개 가림' : '')
        + (지움.주소본것 ? ' · 주소 ' + 지움.주소본것 + '건 가림' : '');
    $('btn-up').disabled = false;
}

async function 배송담기() {
    const 것 = 배송읽은것, { setDoc, getDocs, query, where, serverTimestamp } = window.fb;
    $('판-읽음').classList.add('hidden');
    $('판-올리는중').classList.remove('hidden');
    올리는중 = true; 자료그리기();
    const t0 = Date.now();
    let 창고 = '못 올림';
    try {
        // ① 이미 담긴 열쇠를 받아 겹친 줄을 뺀다 — 들어가기 전에 뺀다
        $('fill').style.width = '10%'; $('올림셈').textContent = '겹친 줄을 가리는 중…';
        const 이미 = new Set();
        (await getDocs(칸(자리.배송열쇠))).docs.forEach(d => (d.data().열쇠 || []).forEach(k => 이미.add(k)));
        // 흘려 읽은 것이면 여기서 **다시 흘리며** 가리고 센다. 줄을 들고 있지 않는다.
        let 집계, 겹침, 담을, 지움;
        if (것.흘림) {
            $('fill').style.width = '15%'; $('올림셈').textContent = '세고 가리는 중 — ' + 셈(것.쓸줄수) + '줄';
            const 흘 = await 배송흘려담기(것, 이미);
            집계 = 흘.집계; 겹침 = 흘.겹침; 담을 = 흘.새열쇠; 지움 = 흘.지움;
        } else {
            const 새줄 = 것.줄들.filter(r => !이미.has(r.열쇠));
            겹침 = 것.줄들.length - 새줄.length;
            집계 = window.배송올리기.집계내기(새줄);
            담을 = [...new Set(새줄.map(r => r.열쇠))].filter(k => !이미.has(k));
            지움 = 것.지움;
        }

        // ② 사람 칸을 지운 사본을 창고에
        $('fill').style.width = '25%'; $('올림셈').textContent = '원본을 창고에 올리는 중…';
        try {
            // 사람 칸을 지운 사본은 CSV 다 — 이름 끝도 그렇게 바꾼다
            const 올릴이름 = 지움.파일 ? 것.이름.replace(/\.[^.]+$/, '') + '.csv' : 것.이름;
            await window.fs.uploadBytes(window.fs.ref(window.st, 배송원본 + '/' + 올릴이름), 지움.파일 || 것.날것);
            창고 = '창고 ✓';
        } catch (e) { 창고 = '창고 못 올림 — ' + (e.code || e.message); }

        // ③ 센 것을 달마다 한 문서로. 지우지 않고 **보탠다.**
        const 달들 = Object.keys(집계.byMonth).sort();
        const 옛것 = {};
        (await getDocs(query(칸(자리.배송집계), where('파일', '==', 것.이름)))).docs
            .forEach(d => { const v = d.data() || {}; 옛것[v.달] = v; });
        for (let i = 0; i < 달들.length; i++) {
            const m = 달들[i], o = 옛것[m], 합 = Object.assign({}, (o && o.집계) || {});
            Object.entries(집계.byMonth[m]).forEach(([n, q]) => 합[n] = (합[n] || 0) + q);
            await setDoc(문서(자리.배송집계, 것.이름.replace(/[\/.#$\[\]]/g, '_') + '__' + m), {
                파일: 것.이름, 달: m, 줄수: ((o && o.줄수) || 0) + 집계.rowsOf[m], 집계: 합, 올린때: serverTimestamp() });
            $('fill').style.width = (30 + Math.round((i + 1) / 달들.length * 55)) + '%';
            $('올림셈').textContent = '센 것 넣는 중 — ' + (i + 1) + ' / ' + 달들.length + ' 달';
        }

        // ④ 들어간 줄의 열쇠를 담아 둔다. 다음에 겹치면 여기서 걸린다.
        $('fill').style.width = '92%'; $('올림셈').textContent = '겹침 열쇠를 담는 중…';
        const 칸들 = (await getDocs(칸(자리.배송열쇠))).docs
            .map(d => ({ id: d.id, 열쇠: (d.data().열쇠 || []).slice() })).sort((a, b) => a.id.localeCompare(b.id));
        const 남은 = [...담을], 쓸것 = [];
        const 마지막 = 칸들[칸들.length - 1];
        if (마지막 && 마지막.열쇠.length < 열쇠칸수) {
            마지막.열쇠 = 마지막.열쇠.concat(남은.splice(0, 열쇠칸수 - 마지막.열쇠.length)); 쓸것.push(마지막);
        }
        let n = 칸들.length;
        while (남은.length) 쓸것.push({ id: String(n++).padStart(4, '0'), 열쇠: 남은.splice(0, 열쇠칸수) });
        for (const c of 쓸것) await setDoc(문서(자리.배송열쇠, c.id), { 열쇠: c.열쇠, 수: c.열쇠.length });

        if (window.기록) await window.기록.적기({ db: window.db, fb: window.fb, user: window.나,
            무엇: '배송관리', 파일: 것.이름, 줄수: 집계.used, 문서수: 달들.length,
            비고: [ 지움.뺀이름.length ? ('사람칸 ' + 지움.뺀이름.length + '개 지움') : '',
                    지움.가린수 ? ('번호 ' + 지움.가린수 + '개 가림') : '',
                    지움.주소본것 ? ('주소 ' + 지움.주소본것 + '건 가림') : '',
                    겹침 ? ('겹침 ' + 겹침 + '줄 건너뜀') : '' ].filter(Boolean).join(' · ') });

        $('판-끝').textContent = '담았습니다 · 배송정보 · ' + 것.이름 + ' · ' + 셈(집계.used) + '줄'
            + (겹침 ? ' · 겹쳐서 건너뜀 ' + 셈(겹침) : '') + ' · 달 ' + 달들.length
            + (지움.가린수 ? ' · 번호 ' + 셈(지움.가린수) + '개 가림' : '') + ' · ' + 창고
            + ' · ' + ((Date.now() - t0) / 1000).toFixed(1) + '초';
        $('판-끝').classList.remove('hidden');
        배송읽은것 = null;
        배송집계 = (await getDocs(칸(자리.배송집계))).docs.map(d => d.data() || {});
        자료그리기();
    } catch (err) {
        fail(new Error('배송정보를 담다가 멈췄습니다 — ' + err.message));
    }
    $('판-올리는중').classList.add('hidden');
    $('fill').style.width = '0';
    올리는중 = false; 자료그리기();
}

$('자료목록').addEventListener('click', async e => {
    const 보 = e.target.closest('[data-view]'), 올 = e.target.closest('[data-pick]');
    try {
        if (올) { 고른갈래 = 올.dataset.pick; $('file').click(); }
        else if (보) {
            const id = 보.dataset.view;
            if (펼친자료 === id) { 펼친자료 = null; $('자료칸').classList.add('hidden'); return; }
            펼친자료 = id;
            const 자료 = id === '__상품목록' ? null : 자료들.find(x => x.id === id);
            const 줄 = 자료 ? await 자료줄읽기(자료) : 담긴상품목록;
            // 재고는 칸 채움이 아니라 **단품으로 묶은 재고**를 보여 드린다 (10-09 사장님)
            // 재고는 **재고관리 자리**에 늘 떠 있다. 같은 것을 여기에 또 그리지 않고 그리로 데려간다.
            if (자료 && 자료.갈래 === '재고') {
                펼친자료 = null; $('자료칸').classList.add('hidden');
                탭보이기('재고'); return;
            }
            칸보기(줄);
        }
    } catch (err) { fail(err); }
});

function 칸보기(줄) {
    const 이름들 = []; const 본 = new Set();
    줄.forEach(o => Object.keys(o).forEach(k => { if (!본.has(k)) { 본.add(k); 이름들.push(k); } }));
    const 행 = 이름들.map(k => {
        const 값 = 줄.map(o => o[k] ?? '').filter(v => v !== '');
        const 가지 = new Set(값);
        return `<tr><td><b>${esc(k)}</b><div class="명료글씨">${esc([...가지].slice(0, 3).join(' · '))}</div></td>
            <td class="오른">${줄.length ? Math.round(값.length / 줄.length * 100) : 0}%</td><td class="오른">${셈(가지.size)}가지</td></tr>`;
    });
    $('자료칸').innerHTML = '<div class="명료가로"><table class="명료표">' + 행.join('') + '</table></div>';
    $('자료칸').classList.remove('hidden');
}

// ════════════════════════════════════════════════════════════════════
// 3-2. 재고 — 올린 재고 파일을 **단품으로 묶어** 보인다.
// ════════════════════════════════════════════════════════════════════
// 「재고파일을 올렸으니 이곳에 정리된 재고를 정리해서 보여줘」 (10-09 사장님)
// 이 집 뼈대가 「단품이 기준」 이라 창고 줄을 단품코드로 묶는다.
//
// ⚠ **창고를 통째로 더한 한 숫자만 보이지 않는다.** 창고에 불량창고·폐기창고·반품·리퍼·
//    쇼룸이 섞여 있다(잰 것: 2,721줄 · 단품 1,666가지 · 그 가운데 702가지가 창고 둘 이상).
//    어느 창고를 셈에서 뺄지는 사장님이 정하실 일이라 **합과 창고별을 둘 다** 보인다.
// ⚠ **칸 이름으로 막지 마라.** 없는 칸은 없는 대로 간다 — 셈 칸이 하나도 없으면 줄 수만 보인다.
// ⚠ 단품코드 뒤에 빈칸이 붙어 온다(잰 것: 2,721줄 가운데 1,452줄). 묶기 전에 턴다.
// ⚠ 금액 칸(단가·금액·가용금액)은 보이지 않는다 — 이 집 규칙이다.
const 재고셈칸 = ['양품수', '불량품', '가용재고'];       // 이 가운데 **있는 것만** 보인다
const 숫자 = v => { const n = Number(String(v ?? '').replace(/,/g, '').trim()); return isFinite(n) ? n : 0; };

// 코드 칸·이름 칸은 **이름으로 찾지 않는다** — 맞댐이 쓰는 단품칸찾기() 그대로 부른다.
// ⚠ 여기에 베껴 쓰지 마라. 두 벌이 되면 언젠가 달라진다.
function 재고묶기(줄들, 단줄들) {
    const 쓰임 = new Map(), 코드이름 = new Map();
    (맞댐결과 ? 맞댐결과.상품들 : []).forEach(p => p.단품들.forEach(d => {
        더하기(쓰임, d.코드, p.상품코드 || p.상품명 || '');
        if (d.이름) 더하기(코드이름, d.코드, d.이름);
    }));
    const 칸이름 = 줄들.length ? Object.keys(줄들[0]) : [];
    const 고른칸 = 단품칸찾기(줄들, { 쓰임, 코드이름 });   // 바깥 칸() 을 가리지 않게 이름을 달리 둔다
    // 단품관리목록 쪽도 **같은 함수**로 코드 칸·이름 칸을 찾는다. 칸 이름이 「품번·품명」 이어도 찾는다.
    const 단 = (단줄들 && 단줄들.length) ? 단품칸찾기(단줄들, { 쓰임, 코드이름 }) : null;
    const 셈칸 = 재고셈칸.filter(k => 칸이름.indexOf(k) > -1);
    const 창고칸 = 칸이름.indexOf('창고') > -1 ? '창고' : '';
    const 묶음 = new Map(), 창고곳 = new Set();
    줄들.forEach(o => {
        const c = 고른칸.코드칸 ? String(o[고른칸.코드칸] ?? '').trim() : '';
        const 열 = c || '(코드 없음)';
        let g = 묶음.get(열);
        if (!g) { g = { 코드: c, 이름: '', 줄: 0, 창고: new Map(), 셈: {} }; 셈칸.forEach(k => g.셈[k] = 0); 묶음.set(열, g); }
        g.줄++;
        if (!g.이름 && 고른칸.이름칸) g.이름 = String(o[고른칸.이름칸] ?? '').trim();
        셈칸.forEach(k => g.셈[k] += 숫자(o[k]));
        // ⚠ **창고마다 더한다.** 한 단품이 같은 창고에 여러 줄로 들어 있다
        //    (사장님 파일에서 잰 것: 2가지 · 6줄 — EC_0209m 이 0.본사에 세 줄).
        //    줄마다 밀어 넣으면 「0.본사 11 · 0.본사 11 · 0.본사 0」 으로 뜬다. 읽으실 글이 아니다.
        if (창고칸) { const w = String(o[창고칸] ?? '').trim();
            if (w) { 창고곳.add(w); g.창고.set(w, (g.창고.get(w) || 0) + (셈칸.length ? 숫자(o[셈칸[0]]) : 1)); } }
    });
    // 창고 차례는 **많은 것부터**. 같으면 파일에서 먼저 나온 차례 그대로(sort 가 제자리를 지킨다).
    const 단품들 = [...묶음.values()];
    단품들.forEach(g => { g.창고 = [...g.창고.entries()].map(([곳, 값]) => ({ 곳, 값 }))
        .sort((a, b) => b.값 - a.값); });
    // ── 단품관리목록과 맞대기 (10-09 사장님 「재고관리의 단품과 단품관리목록의 단품명및 코드가
    //    매칭되는지 확인해줘」) — 코드가 있나, 있으면 이름까지 같나, 셋으로 가른다.
    //    ⚠ 안 맞는 것을 숨기지 않는다. 그 줄에 그대로 딱지를 붙이고 몇인지 머리에도 적는다.
    let 다맞음 = 0, 이름다름 = 0, 목록에없음 = 0;
    if (단) 단품들.forEach(g => {
        if (!단.목록.has(g.코드)) { g.맞댐 = '없음'; 목록에없음++; return; }
        const 목이름 = String(단.목록.get(g.코드) || '').trim();
        if (목이름 && g.이름 && 목이름 !== g.이름) { g.맞댐 = '이름다름'; g.목록이름 = 목이름; 이름다름++; }
        else { g.맞댐 = '맞음'; 다맞음++; }
    });
    const 재고에없음 = 단 ? [...단.목록.keys()].filter(c => !묶음.has(c)).length : 0;
    // ⚠ 안 맞는 것을 **앞에 놓는다.** 화면에 200가지만 그리는데 안 맞는 것이 뒤로 밀리면
    //    머리에 「이름 다름 100」 이라 적혀도 사장님이 그 100을 못 보신다. 숨기는 것과 같다.
    //    급한 차례로 — 같은 코드인데 이름이 다른 것 → 단품목록에 없는 것 → 맞는 것.
    //    (맞대지 않을 때는 손대지 않는다. 정렬 단추는 만들지 않는다 — 차례가 하나로 박혀 있다.)
    if (단) { const 급함 = { '이름다름': 0, '없음': 1, '맞음': 2 };
        단품들.sort((a, b) => 급함[a.맞댐] - 급함[b.맞댐]); }
    return { 단품들, 줄수: 줄들.length, 셈칸, 창고곳: 창고곳.size, 상품코드수: 쓰임.size,
        맞물림: 쓰임.size ? 단품들.filter(g => 쓰임.has(g.코드)).length : 0,
        단있나: !!단, 단코드칸: 단 ? 단.코드칸 : '', 단이름칸: 단 ? 단.이름칸 : '',
        단가짓수: 단 ? 단.목록.size : 0, 다맞음, 이름다름, 목록에없음, 재고에없음 };
}

// 재고관리 자리를 다시 그린다. **맞댐 뒤에 부른다** — 상품 쪽 맞물림을 맞댐결과에서 얻는다.
async function 재고하기() {
    const 재자료 = 자료들.find(a => a.갈래 === '재고');
    if (!재자료) {
        $('재고셈').textContent = '';
        $('재고잔').innerHTML = '<div class="명료잔">재고정보를 올리시면 여기에 보입니다.</div>';
        $('재고목록').innerHTML = '';
        return;
    }
    // 단품관리목록은 「단품」 자리의 가장 새 자료다. 없으면 맞대지 않고 재고만 보인다.
    const 단자료 = 자료들.find(a => a.갈래 === '단품');
    재고그리기(재고묶기(await 자료줄읽기(재자료), 단자료 ? await 자료줄읽기(단자료) : null));
}

function 재고그리기(r) {
    // 자료 이름·올린 때는 위 목록에 이미 있다 — 여기엔 **새로 아는 것만** 적는다.
    $('재고셈').textContent = '재고 ' + 셈(r.줄수) + '줄 → 단품 ' + 셈(r.단품들.length) + '가지'
        + (r.창고곳 ? ' · 창고 ' + 셈(r.창고곳) + '곳' : '');
    const 잔 = [];
    if (r.상품코드수) 잔.push('상품 쪽과 맞물림 ' + 셈(r.맞물림) + '가지');
    // 안 맞는 것을 숨기지 않는다 — 넷을 다 적는다. 더하면 양쪽 가짓수가 된다.
    if (r.단있나) 잔.push('단품목록 ' + 셈(r.단가짓수) + '가지 (코드 칸 ' + r.단코드칸 + ') — '
        + '코드·이름 맞음 ' + 셈(r.다맞음) + ' · 이름 다름 ' + 셈(r.이름다름)
        + ' · 단품목록에 없음 ' + 셈(r.목록에없음) + ' · 재고에 없음 ' + 셈(r.재고에없음));
    else 잔.push('단품정보가 없습니다 — 올리시면 맞물리는지 같이 보여 드립니다.');
    $('재고잔').innerHTML = 잔.map(t => `<div class="명료잔" style="margin:2px 0 6px">${esc(t)}</div>`).join('');
    $('재고목록').innerHTML = r.단품들.slice(0, 보일건수).map(g => '<div class="맞댐상품">'
        + `<div class="맞댐머리"><span class="맞댐코드">${esc(g.코드)}</span><b>${esc(g.이름)}</b>`
        + (g.맞댐 === '없음' ? '<span class="맞댐못">단품목록에 없음</span>'
         : g.맞댐 === '이름다름' ? '<span class="맞댐못">이름 다름</span>' : '') + '</div>'
        + (g.맞댐 === '이름다름'
            ? `<div class="재고딴이름 명료글씨">단품목록 — ${esc(g.목록이름)}</div>` : '')
        + (r.셈칸.length
            ? `<div class="재고셈">${r.셈칸.map(k => `<span>${esc(k)} ${셈(g.셈[k])}</span>`).join('')}</div>`
            : `<div class="재고셈"><span>${셈(g.줄)}줄</span></div>`)
        // 창고가 둘 이상일 때만 펼쳐 적는다 — 합 하나로는 어디 있는 재고인지 모른다
        + (g.창고.length > 1
            ? `<div class="재고창고 명료글씨">${esc(g.창고.map(w => w.곳 + ' ' + 셈(w.값)).join(' · '))}</div>` : '')
        + '</div>').join('')
        + (r.단품들.length > 보일건수
            ? '<div class="명료잔" style="padding:10px 0">밖에 ' + 셈(r.단품들.length - 보일건수) + '건</div>' : '');
}

// ════════════════════════════════════════════════════════════════════
// 4. 맞대기 — 상품 한 줄에 그 상품의 단품을 코드·이름까지 붙여 보인다.
// ════════════════════════════════════════════════════════════════════
// 「상품목록의 상품명/코드별 - 이에 해당하는 단품명/코드명을 매칭시켜서 보여줘」 (10-08 사장님)
//
// ⚠ 맞는 것만 보이지 않는다. **못 맞춘 단품도 그 자리에 그대로 보인다** — 몇인지 머리에도 적는다.
//    숨기면 사장님이 못 믿으신다.
//
// 단품코드·단품명은 한 칸에 「+」 로 이어 붙어 있다. 「 +」 와 「+」 가 섞여 있어
// 「+」 로 쪼개고 앞뒤 빈칸을 턴다. (「 +」 로 쪼개면 163건이 틀어진다)
const 쪼개기 = s => String(s ?? '').split('+').map(v => v.trim()).filter(Boolean);
const 더하기 = (m, k, v) => { if (!m.has(k)) m.set(k, new Set()); m.get(k).add(v); };

// 코드 수와 이름 수가 맞는 줄로 「코드 → 이름」 사전을 먼저 짓는다.
// 단품**명** 안에도 「+」 가 든 줄이 있어 수가 안 맞는 줄이 있다 — 그런 줄을 이 사전으로 맞춘다.
// 「같은 단품코드 → 단품명은 늘 하나」 가 193가지에서 어긋남 0 이라 이 길이 선다.
function 사전짓기(줄들) {
    const 코드이름 = new Map(), 쓰임 = new Map();
    줄들.forEach(o => {
        const 코드 = 쪼개기(o['단품코드']), 이름 = 쪼개기(o['단품명']);
        if (코드.length && 코드.length === 이름.length) 코드.forEach((c, k) => 더하기(코드이름, c, 이름[k]));
        코드.forEach(c => 더하기(쓰임, c, o['상품코드'] || o['상품명'] || ''));
    });
    return { 코드이름, 쓰임 };
}

// 단품 자료의 코드 칸·이름 칸은 **이름으로 찾지 않는다** — 상품 쪽 값과 가장 많이 겹치는 칸이다.
// 그래야 칸 이름이 「품번·품명」 이어도 찾는다. 무엇을 골랐는지는 화면에 적어 드린다.
function 단품칸찾기(줄들, 사전) {
    const 이름들 = 줄들.length ? Object.keys(줄들[0]) : [];
    const 겹침 = (k, 모음) => 줄들.reduce((n, o) => n + (모음.has(o[k]) ? 1 : 0), 0);
    const 고르기 = (모음, 기본) => {
        let 고른 = '', 많 = 0;
        이름들.forEach(k => { const n = 겹침(k, 모음); if (n > 많) { 많 = n; 고른 = k; } });
        return 고른 || (이름들.indexOf(기본) > -1 ? 기본 : '');
    };
    const 이름모음 = new Set(); 사전.코드이름.forEach(s => s.forEach(v => 이름모음.add(v)));
    const 코드칸 = 고르기(사전.쓰임, '단품코드'), 이름칸 = 고르기(이름모음, '단품명');
    const 목록 = new Map();
    줄들.forEach(o => { const c = 코드칸 ? String(o[코드칸] || '').trim() : '';
        if (c && !목록.has(c)) 목록.set(c, 이름칸 ? String(o[이름칸] || '').trim() : ''); });
    return { 코드칸, 이름칸, 목록 };
}

// 이름을 찾는 네 걸음 — ① 한 줄에서 코드 수 = 이름 수 면 자리끼리
//                      ② 사전  ③ 단품관리목록  ④ 못 찾음(숨기지 않고 그대로 보인다)
function 맞대기(상줄들, 단줄들) {
    const 사전 = 사전짓기(상줄들);
    const 단 = (단줄들 && 단줄들.length) ? 단품칸찾기(단줄들, 사전) : null;
    const 상품들 = [];
    let 맞음 = 0, 못맞춤 = 0, 단품없는상품 = 0;
    상줄들.forEach(o => {
        const 코드 = 쪼개기(o['단품코드']), 이름 = 쪼개기(o['단품명']);
        const 자리끼리 = 코드.length > 0 && 코드.length === 이름.length;
        const 단품들 = 코드.map((c, i) => {
            if (자리끼리 && 이름[i]) return { 코드: c, 이름: 이름[i] };
            const 사 = 사전.코드이름.get(c);
            if (사 && 사.size) return { 코드: c, 이름: [...사][0] };
            if (단 && 단.목록.get(c)) return { 코드: c, 이름: 단.목록.get(c) };
            return { 코드: c, 이름: '' };                      // 못 찾음
        });
        단품들.forEach(d => d.이름 ? 맞음++ : 못맞춤++);
        if (!코드.length) 단품없는상품++;
        상품들.push({ 상품코드: o['상품코드'] || '', 상품명: o['상품명'] || '', 단품들 });
    });
    return { 상품들, 맞음, 못맞춤, 단품없는상품, 상품수: 상줄들.length,
        단코드칸: 단 ? 단.코드칸 : '', 단코드수: 단 ? 단.목록.size : 0 };
}

async function 맞댐하기() {
    // 상품 쪽 — 「상품」 딱지가 붙은 가장 새 자료. 없으면 이미 담긴 상품목록.
    const 상자료 = 자료들.find(a => a.갈래 === '상품'), 단자료 = 자료들.find(a => a.갈래 === '단품');
    const 상줄 = 상자료 ? await 자료줄읽기(상자료) : 담긴상품목록;
    const 단줄 = 단자료 ? await 자료줄읽기(단자료) : null;
    맞댐결과 = 맞대기(상줄, 단줄);
    맞댐그리기();
}

function 맞댐그리기() {
    const m = 맞댐결과;
    $('맞댐셈').textContent = '상품 ' + 셈(m.상품수) + ' · 단품 ' + 셈(m.맞음 + m.못맞춤)
        + ' · 못 맞춘 단품 ' + 셈(m.못맞춤) + (m.단품없는상품 ? ' · 단품 없는 상품 ' + 셈(m.단품없는상품) : '');
    // 자료 이름은 위 목록에 이미 있다 — 여기엔 **새로 아는 것만** 적는다.
    if (m.단코드칸) { $('맞댐잔').textContent = '코드 칸 ' + m.단코드칸 + ' · ' + 셈(m.단코드수) + '가지';
        $('맞댐잔').classList.remove('hidden'); }
    else $('맞댐잔').classList.add('hidden');
    const 줄 = m.상품들.slice(0, 보일건수).map(p => '<div class="맞댐상품">'
        + `<div class="맞댐머리"><span class="맞댐코드">${esc(p.상품코드)}</span><b>${esc(p.상품명)}</b></div>`
        + (p.단품들.length
            ? p.단품들.map(d => `<div class="맞댐단품"><span class="맞댐코드">${esc(d.코드)}</span>`
                + (d.이름 ? `<span class="이름">${esc(d.이름)}</span>` : '<span class="맞댐못">이름 못 찾음</span>') + '</div>').join('')
            : '<div class="맞댐단품"><span class="맞댐못">단품 없음</span></div>')
        + '</div>').join('');
    $('맞댐목록').innerHTML = 줄 + (m.상품들.length > 보일건수
        ? '<div class="명료잔" style="padding:10px 0">밖에 ' + 셈(m.상품들.length - 보일건수) + '건</div>' : '');
}

// ════════════════════════════════════════════════════════════════════
// 5. 규칙 — 한 줄씩 적어 둔다. 딱지를 누르면 추정 ↔ 확인.
// ════════════════════════════════════════════════════════════════════
function 규칙그리기() {
    $('규칙목록').innerHTML = 규칙들.map(r => `<div class="명료줄"><span style="flex:1;min-width:0;overflow-wrap:anywhere;padding:8px 0">${esc(r.글)}</span>
        <button class="명료딱지 ${r.상태 === '확인' ? '켬' : '노랑'}" data-rule="${esc(r.id)}">${esc(r.상태 || '추정')}</button></div>`).join('');
}
$('btn-rule').addEventListener('click', async () => {
    const 글 = $('규칙글').value.trim();
    if (!글) { $('규칙글').focus(); return; }
    const id = 때이름(new Date()), r = { 글, 상태: '추정', 누가: (window.나 && window.나.email) || '' };
    $('btn-rule').disabled = true;
    try {
        await window.fb.setDoc(문서(자리.규칙, id), Object.assign({ 언제: window.fb.serverTimestamp() }, r));
        규칙들.unshift(Object.assign({ id }, r)); $('규칙글').value = ''; 규칙그리기();
    } catch (err) { fail(new Error('규칙을 담지 못했습니다 — ' + err.message)); }
    $('btn-rule').disabled = false;
});
$('규칙글').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('btn-rule').click(); } });
$('규칙목록').addEventListener('click', async e => {
    const b = e.target.closest('[data-rule]');
    if (!b) return;
    const r = 규칙들.find(x => x.id === b.dataset.rule);
    r.상태 = r.상태 === '확인' ? '추정' : '확인';
    규칙그리기();
    try { await window.fb.setDoc(문서(자리.규칙, r.id), { 상태: r.상태 }, { merge: true }); }
    catch (err) { fail(new Error('규칙을 바꾸지 못했습니다 — ' + err.message)); }
});
</script>
