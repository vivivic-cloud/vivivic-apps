<!-- ==========================================
     벤더피아상품정리 / 제품명료화.html
     버전: v0.2.0 (2026-10-07) — 올리는 자리를 갈래마다 나눔
     목적: 벤더피아 엑셀(상품정보·단품정보)을 화베에 담아 두고,
           담긴 자료로 「단품 = 물건, 상품 = 파는 이름」 을 가려 가며
           규칙을 쌓는다. (10-07 사장님)

     쓰는 자리 — 셋 다 vp_ 로 시작한다. 화베 규칙이 사장님 계정만 들여보낸다.
       vp_명료자료   올린 엑셀 한 개 = 문서 한 개 (이름·칸이름·줄수·갈래)
       vp_명료묶음   그 엑셀의 줄들. 200줄씩 한 문서 — 읽기 횟수를 줄인다.
       vp_명료규칙   적어 둔 규칙
     읽기만 하는 자리
       vp_상품목록   상품정리 화면에서 이미 올린 상품목록. 한 글자도 안 쓴다.

     줄을 JSON 글자로 담는 까닭:
       칸 이름이 비었거나 겹치면 파이어스토어가 쓰기를 거부한다.
       값만 차례대로 글자로 담고 칸 이름은 자료 문서에 한 번만 둔다.

     막지 않는다:
       어떤 엑셀이든 읽고 올린다. 칸 이름으로 돌려보내는 길은 없다.
       갈래(상품정보·단품정보·그 밖)는 올리는 자리로 정한다. 「옮김」 으로 바꾼다.
     ========================================== -->

        from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",

        projectId: "vivivic-4b7ef",

        messagingSenderId: "830175660542",
        appId: "1:830175660542:web:9054030480c8280af8d8af",
        measurementId: "G-MCPHWSQBQR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    window.db = getFirestore(app);
    window.fb = { collection, doc, getDocs, setDoc, query, where, serverTimestamp };

    // 상품정리 화면과 같은 잠금이다 — 사장님 계정으로만 들어간다.
    onAuthStateChanged(auth, (user) => {

        window.잠금.닫기(user, () => signOut(auth));
        window.나 = user;
        window.initApp();
    });

<script src="../shared/viggle.js"></script>

<script>
// ════════════════════════════════════════════════════════════════════
// 설정
// ════════════════════════════════════════════════════════════════════
const 뿌리 = ['artifacts','vivivic-4b7ef','public','data'];
const 자리 = { 상품목록: 'vp_상품목록', 자료: 'vp_명료자료', 묶음: 'vp_명료묶음', 규칙: 'vp_명료규칙' };
const 묶음줄수 = 200;            // 한 문서에 담는 줄 수
const 묶음글자 = 600000;         // 한 문서 1MB 한계 — 넉넉히 60만 글자에서 끊는다
const 머리줄깊이 = 10;
const 보일건수 = 200;            // 한 갈래에서 화면에 그리는 건수

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const 셈 = n => Number(n || 0).toLocaleString('ko-KR');
const 칸 = 이름 => window.fb.collection(window.db, ...뿌리, 이름);
const 문서 = (이름, id) => window.fb.doc(window.db, ...뿌리, 이름, id);

function 때이름(d) {
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' +
           p(d.getHours()) + p(d.getMinutes()) + '-' + p(d.getSeconds());
}
const 때보임 = id => { const m = String(id).match(/^\d{4}(\d{2})(\d{2})-(\d{2})(\d{2})/); return m ? `${m[1]}-${m[2]} ${m[3]}:${m[4]}` : ''; };

function fail(err) {
    console.error(err);
    $('err').textContent = err.message || String(err);
    $('err').classList.remove('hidden');
}

// ════════════════════════════════════════════════════════════════════
// 담긴 것 — 열 때 한 번 읽어 여기 담아 둔다. 누를 때마다 다시 읽지 않는다.
// ════════════════════════════════════════════════════════════════════
let 담긴상품목록 = [];           // vp_상품목록 의 줄들 ({칸이름: 값})
let 자료들 = [];                 // vp_명료자료 문서들 (새것이 앞)
let 규칙들 = [];
const 읽은줄 = new Map();        // 자료 id → 줄들 ({칸이름: 값})
let 분석결과 = null;

window.initApp = async function () {
    try {
        const { getDocs } = window.fb;
        const [상, 자, 규] = await Promise.all([
            getDocs(칸(자리.상품목록)), getDocs(칸(자리.자료)), getDocs(칸(자리.규칙))
        ]);
        담긴상품목록 = 상.docs.map(d => (d.data() || {}).fields || {});
        자료들 = 자.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => a.id < b.id ? 1 : -1);
        규칙들 = 규.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => a.id < b.id ? 1 : -1);
        $('loading').classList.add('hidden');
        ['판-올리기','판-자료','판-분석','판-규칙'].forEach(i => $(i).classList.remove('hidden'));
        자료그리기(); 규칙그리기();
        await 분석하기();
    } catch (err) { $('loading').classList.add('hidden'); fail(new Error('읽지 못했습니다 — ' + err.message)); }
};

// ════════════════════════════════════════════════════════════════════
// 1. 엑셀 읽기 — 어떤 엑셀이든 읽는다. 칸 이름으로 막지 않는다.
// ════════════════════════════════════════════════════════════════════
let 읽은것 = null;               // { 이름, 칸이름[], 줄[][] , 머리줄, 건너뜀 }

// 위 열 줄 가운데 채워진 칸이 가장 많은 줄이 머리줄이다 (같으면 위엣것).
function 머리줄찾기(aoa) {
    const 이름들 = 줄 => (줄 || []).map(h => String(h ?? '').trim());
    let 고른것 = { 몇째: 0, 이름들: 이름들(aoa[0]) };
    for (let i = 1; i < Math.min(머리줄깊이, aoa.length); i++) {
        const n = 이름들(aoa[i]);
        if (n.filter(Boolean).length > 고른것.이름들.filter(Boolean).length) 고른것 = { 몇째: i, 이름들: n };
    }
    return 고른것;
}

// 빈 칸 이름은 「칸7」, 겹친 이름은 「이름(2)」 — 그래야 뒤엣것이 앞엣것을 안 덮는다.
function 칸이름다듬기(이름들) {
    const 본 = new Map();
    return 이름들.map((h, i) => {
        let n = h || ('칸' + (i + 1));
        const k = (본.get(n) || 0) + 1; 본.set(n, k);
        return k > 1 ? n + '(' + k + ')' : n;
    });
}

function 엑셀읽기(buf, 이름) {
    const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
    if (!aoa.length) throw new Error('빈 파일입니다.');
    const 머리 = 머리줄찾기(aoa);
    const 칸이름 = 칸이름다듬기(머리.이름들);
    const 줄 = []; let 건너뜀 = 0;
    for (let i = 머리.몇째 + 1; i < aoa.length; i++) {
        // 값은 전부 글자로 — 앞자리 0 과 날짜 모양을 지킨다
        const v = 칸이름.map((_, c) => { const x = aoa[i][c]; return (x === undefined || x === null) ? '' : String(x).trim(); });
        if (v.some(x => x !== '')) 줄.push(v); else 건너뜀++;
    }
    return { 이름, 칸이름, 줄, 머리줄: 머리.몇째 + 1, 건너뜀 };
}

// 갈래는 **올리는 자리로 정한다.** 칸 이름으로 짐작하지 않는다 —
// 어느 자리의 「올리기」 를 누르셨는지가 곧 갈래다. (10-07 사장님)
const 갈래들 = [['상품', '상품정보'], ['단품', '단품정보'], ['', '그 밖']];
const 갈래이름 = g => (갈래들.find(x => x[0] === (g || '')) || 갈래들[2])[1];
let 고른갈래 = '';

$('file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
        try {
            읽은것 = 엑셀읽기(ev.target.result, f.name);
            $('err').classList.add('hidden');
            $('읽음이름').textContent = f.name;
            $('읽음셈').textContent = 셈(읽은것.줄.length) + '줄 · ' + 읽은것.칸이름.length + '칸 · 머리줄 ' + 읽은것.머리줄 + '째';
            $('btn-up').textContent = 갈래이름(고른갈래) + ' 자리에 담기';
            $('판-읽음').classList.remove('hidden');
        } catch (err) { fail(err); }
    };
    r.onerror = () => fail(new Error('파일을 읽지 못했습니다.'));
    r.readAsArrayBuffer(f);
    e.target.value = '';
});
$('btn-cancel').addEventListener('click', () => { 읽은것 = null; $('판-읽음').classList.add('hidden'); });

// ════════════════════════════════════════════════════════════════════
// 2. 화베에 담기 — 줄 묶음을 먼저, 자료 문서를 맨 끝에.
//    끊기면 자료 문서가 없어서 목록에 안 뜬다. 반쯤 담긴 것이 분석에 섞이지 않는다.
// ════════════════════════════════════════════════════════════════════
function 묶기(줄) {
    const 묶음들 = []; let 지금 = [], 글자 = 0;
    줄.forEach(v => {
        const s = JSON.stringify(v);
        if (지금.length && (지금.length >= 묶음줄수 || 글자 + s.length > 묶음글자)) { 묶음들.push(지금); 지금 = []; 글자 = 0; }
        지금.push(s); 글자 += s.length;
    });
    if (지금.length) 묶음들.push(지금);
    return 묶음들;
}

$('btn-up').addEventListener('click', async () => {
    if (!읽은것) return;

const 줄풀기 = (칸이름, v) => { const o = {}; 칸이름.forEach((h, i) => o[h] = v[i] ?? ''); return o; };

async function 자료줄읽기(자료) {
    if (읽은줄.has(자료.id)) return 읽은줄.get(자료.id);
    const { getDocs, query, where } = window.fb;
    const 눈 = await getDocs(query(칸(자리.묶음), where('자료', '==', 자료.id)));
    const 묶음 = 눈.docs.map(d => d.data()).sort((a, b) => a.차례 - b.차례);
    const 줄 = [];
    묶음.forEach(m => (m.줄들 || []).forEach(s => 줄.push(줄풀기(자료.칸이름 || [], JSON.parse(s)))));
    읽은줄.set(자료.id, 줄);
    return 줄;
}

// 3. 담긴 자료 — 이름을 누르면 칸마다 채움·가짓수·보기. 딱지를 누르면 갈래가 바뀐다.
// ════════════════════════════════════════════════════════════════════
const 갈래차례 = ['', '상품', '단품'];
let 펼친자료 = null, 올리는중 = false;

function 자료그리기() {
    const 판 = [];
    갈래들.forEach(([g, 이름]) => {
        판.push(`<div class="명료갈래"><b>${esc(이름)}</b><button class="명료딱지 켬" data-pick="${esc(g)}"${올리는중 ? ' disabled' : ''}>올리기</button></div>`);
        const 것 = 자료들.filter(a => (a.갈래 || '') === g);
        // 「그 밖」 은 기준이 따로 없다 — 다 같은 무게로 보인다
        const 줄 = 것.map((a, i) => `<div class="명료줄${g && i ? ' 옛' : ''}"><span class="이름" data-view="${esc(a.id)}">${esc(a.이름)}</span>
            ${g && !i ? '<span class="지금">지금</span>' : ''}<span class="수">${셈(a.줄수)}줄 · ${esc(때보임(a.id))}</span>
            <button class="명료딱지" data-role="${esc(a.id)}">옮김</button></div>`);
        // 상품정리 화면에서 올린 상품목록 — 여기서 상품정보를 올리기 전까지는 이것이 기준이다
        if (g === '상품' && 담긴상품목록.length) 줄.push(`<div class="명료줄${것.length ? ' 옛' : ''}"><span class="이름" data-view="__상품목록">상품목록 (상품정리)</span>
            ${것.length ? '' : '<span class="지금">지금</span>'}<span class="수">${셈(담긴상품목록.length)}줄</span></div>`);
        판.push(줄.join('') || '<div class="명료잔" style="padding:10px 0">없음</div>');
    });
    $('자료목록').innerHTML = 판.join('');
}

$('자료목록').addEventListener('click', async e => {
    const 갈 = e.target.closest('[data-role]'), 보 = e.target.closest('[data-view]'), 올 = e.target.closest('[data-pick]');
    try {
        if (올) { 고른갈래 = 올.dataset.pick; $('file').click(); }
        else if (갈) {
            const a = 자료들.find(x => x.id === 갈.dataset.role);
            a.갈래 = 갈래차례[(갈래차례.indexOf(a.갈래 || '') + 1) % 갈래차례.length];
            자료그리기();
            await window.fb.setDoc(문서(자리.자료, a.id), { 갈래: a.갈래 }, { merge: true });
            await 분석하기();
        } else if (보) {
            const id = 보.dataset.view;
            if (펼친자료 === id) { 펼친자료 = null; $('자료칸').classList.add('hidden'); return; }
            펼친자료 = id;
            const 줄 = id === '__상품목록' ? 담긴상품목록 : await 자료줄읽기(자료들.find(x => x.id === id));
            칸보기(줄);
        }
    } catch (err) { fail(err); }
});

function 칸보기(줄) {
    const 이름들 = []; const 본 = new Set();
    줄.forEach(o => Object.keys(o).forEach(k => { if (!본.has(k)) { 본.add(k); 이름들.push(k); } }));
    const 행 = 이름들.map(k => {
        const 값 = 줄.map(o => o[k] ?? '').filter(v => v !== '');
        const 가지 = new Set(값);
        return `<tr><td><b>${esc(k)}</b><div class="명료글씨">${esc([...가지].slice(0, 3).join(' · '))}</div></td>
            <td class="오른">${줄.length ? Math.round(값.length / 줄.length * 100) : 0}%</td><td class="오른">${셈(가지.size)}가지</td></tr>`;
    });
    $('자료칸').innerHTML = '<div class="명료가로"><table class="명료표">' + 행.join('') + '</table></div>';
    $('자료칸').classList.remove('hidden');
}

// ════════════════════════════════════════════════════════════════════
// 4. 분석 — 단품이 기준이다. 상품은 단품 묶음에 붙인 파는 이름이다.
// ════════════════════════════════════════════════════════════════════
// 단품코드·단품명은 한 칸에 「+」 로 이어 붙어 있다. 「 +」 와 「+」 가 섞여 있어
// 「+」 로 쪼개고 앞뒤 빈칸을 턴다.
const 쪼개기 = s => String(s ?? '').split('+').map(v => v.trim()).filter(Boolean);
const 더하기 = (m, k, v) => { if (!m.has(k)) m.set(k, new Set()); m.get(k).add(v); };

function 상품쪽분석(줄들) {
    // 코드 수와 이름 수가 맞는 줄로 「코드 → 이름」 을 먼저 모은다
    const 코드이름 = new Map(), 이름코드 = new Map(), 쓰임 = new Map();
    줄들.forEach(o => {
        const 코드 = 쪼개기(o['단품코드']), 이름 = 쪼개기(o['단품명']);
        if (코드.length && 코드.length === 이름.length) 코드.forEach((c, k) => { 더하기(코드이름, c, 이름[k]); 더하기(이름코드, 이름[k], c); });
    });
    const 못맞춘 = [], 단품없음 = [], 상품구성 = new Map(), 구성상품 = new Map(), 상품코드들 = new Set();
    줄들.forEach(o => {
        const 코드 = 쪼개기(o['단품코드']), 이름 = 쪼개기(o['단품명']);
        const 상 = o['상품코드'] || '', 명 = o['상품명'] || '';
        if (상) 상품코드들.add(상);
        if (!코드.length) { 단품없음.push({ 상, 명 }); return; }
        if (코드.length !== 이름.length && !코드.every(c => 코드이름.has(c))) 못맞춘.push({ 상, 명, 코드: o['단품코드'] || '', 이름: o['단품명'] || '' });
        코드.forEach(c => 더하기(쓰임, c, 상 || 명));
        const 구성 = [...코드].sort().join(' + ');
        if (상) { 더하기(상품구성, 상, 구성); 더하기(구성상품, 구성, 상); }
    });
    const 여럿 = m => [...m.entries()].filter(([, s]) => s.size > 1).map(([k, s]) => ({ 열쇠: k, 값: [...s] }));
    const 앞머리 = new Map();
    쓰임.forEach((_, c) => { const p = c.indexOf('-') > 0 ? c.slice(0, c.indexOf('-')) : '(줄표 없음)'; 더하기(앞머리, p, c); });
    return {
        줄수: 줄들.length, 상품코드수: 상품코드들.size, 단품코드수: 쓰임.size, 코드이름, 쓰임,
        코드에이름여럿: 여럿(코드이름), 이름에코드여럿: 여럿(이름코드), 못맞춘, 단품없음,
        구성다름: 여럿(상품구성), 같은구성: 여럿(구성상품),
        앞머리: [...앞머리.entries()].map(([p, s]) => ({ 앞: p, 수: s.size, 보기: [...s][0], 이름: [...(코드이름.get([...s][0]) || [])][0] || '' })).sort((a, b) => b.수 - a.수)
    };
}

// 단품 자료의 「코드 칸」 은 이름으로 찾지 않는다 — 상품 쪽 단품코드와 가장 많이 겹치는 칸이다.
function 단품쪽분석(줄들, 상) {
    const 이름들 = 줄들.length ? Object.keys(줄들[0]) : [];
    const 겹침 = (k, 모음) => 줄들.reduce((n, o) => n + (모음.has(o[k]) ? 1 : 0), 0);
    const 고르기 = (모음, 기본) => {
        let 고른 = '', 많 = 0;
        이름들.forEach(k => { const n = 겹침(k, 모음); if (n > 많) { 많 = n; 고른 = k; } });
        return 고른 || (이름들.indexOf(기본) > -1 ? 기본 : '');
    };
    const 코드칸 = 고르기(상.쓰임, '단품코드');
    const 이름모음 = new Set(); 상.코드이름.forEach(s => s.forEach(v => 이름모음.add(v)));
    const 이름칸 = 고르기(이름모음, '단품명');
    const 목록 = new Map(), 겹친코드 = new Map();
    줄들.forEach(o => {
        const c = 코드칸 ? (o[코드칸] || '') : '';
        if (!c) return;
        if (목록.has(c)) 겹친코드.set(c, (겹친코드.get(c) || 1) + 1); else 목록.set(c, 이름칸 ? (o[이름칸] || '') : '');
    });
    const 목록에없음 = [...상.쓰임.keys()].filter(c => !목록.has(c)).map(c => ({ 코드: c, 이름: [...(상.코드이름.get(c) || [])][0] || '', 쓰임: 상.쓰임.get(c).size }));
    const 안쓰임 = [...목록.entries()].filter(([c]) => !상.쓰임.has(c)).map(([c, n]) => ({ 코드: c, 이름: n }));
    const 이름다름 = [...목록.entries()].filter(([c, n]) => n && 상.코드이름.has(c) && !상.코드이름.get(c).has(n))
        .map(([c, n]) => ({ 코드: c, 단품쪽: n, 상품쪽: [...상.코드이름.get(c)].join(' / ') }));
    return { 줄수: 줄들.length, 코드칸, 이름칸, 코드수: 목록.size, 목록에없음, 안쓰임, 이름다름,
        겹친코드: [...겹친코드.entries()].map(([c, n]) => ({ 코드: c, 줄: n })) };
}

async function 분석하기() {
    // 상품 쪽 — 「상품」 딱지가 붙은 가장 새 자료. 없으면 이미 담긴 상품목록.
    const 상자료 = 자료들.find(a => a.갈래 === '상품'), 단자료 = 자료들.find(a => a.갈래 === '단품');
    const 상줄 = 상자료 ? await 자료줄읽기(상자료) : 담긴상품목록;
    const 상 = 상품쪽분석(상줄);
    const 단 = 단자료 ? 단품쪽분석(await 자료줄읽기(단자료), 상) : null;
    분석결과 = { 상, 단, 상이름: 상자료 ? 상자료.이름 : '상품목록', 단이름: 단자료 ? 단자료.이름 : '' };
    분석그리기();
}

function 분석갈래들() {
    const { 상, 단 } = 분석결과;
    const g = [
        { 이름: '한 코드 · 이름 여럿', 건: 상.코드에이름여럿, 한줄: x => `<span class="명료글씨">${esc(x.열쇠)}</span><div>${x.값.map(esc).join('<br>')}</div>`, 글: x => x.열쇠 + ' → ' + x.값.join(' / ') },
        { 이름: '한 이름 · 코드 여럿', 건: 상.이름에코드여럿, 한줄: x => `<div>${esc(x.열쇠)}</div><span class="명료글씨">${x.값.map(esc).join(' · ')}</span>`, 글: x => x.열쇠 + ' → ' + x.값.join(' / ') },
        { 이름: '같은 상품코드 · 구성 다름', 건: 상.구성다름, 한줄: x => `<span class="명료글씨">${esc(x.열쇠)}</span><div class="명료글씨">${x.값.map(esc).join('<br>')}</div>`, 글: x => x.열쇠 + ' → ' + x.값.join(' | ') },
        { 이름: '같은 구성 · 상품코드 여럿', 건: 상.같은구성, 한줄: x => `<span class="명료글씨">${esc(x.열쇠)}</span><div class="명료글씨">${x.값.map(esc).join(' · ')}</div>`, 글: x => x.열쇠 + ' → ' + x.값.join(' / ') },
        { 이름: '이름 못 맞춘 줄', 건: 상.못맞춘, 한줄: x => `<span class="명료글씨">${esc(x.상)}</span><div>${esc(x.명)}</div><div class="명료글씨">${esc(x.코드)}<br>${esc(x.이름)}</div>`, 글: x => x.상 + ' | ' + x.코드 + ' | ' + x.이름 },
        { 이름: '단품 없는 상품', 건: 상.단품없음, 한줄: x => `<span class="명료글씨">${esc(x.상)}</span><div>${esc(x.명)}</div>`, 글: x => x.상 + ' ' + x.명 }
    ];
    if (단) g.push(
        { 이름: '단품목록에 없는 코드', 건: 단.목록에없음, 한줄: x => `<span class="명료글씨">${esc(x.코드)} · 상품 ${x.쓰임}</span><div>${esc(x.이름)}</div>`, 글: x => x.코드 + ' ' + x.이름 + ' (상품 ' + x.쓰임 + ')' },
        { 이름: '상품에 안 쓰인 단품', 건: 단.안쓰임, 한줄: x => `<span class="명료글씨">${esc(x.코드)}</span><div>${esc(x.이름)}</div>`, 글: x => x.코드 + ' ' + x.이름 },
        { 이름: '단품목록 안 · 코드 겹침', 건: 단.겹친코드, 한줄: x => `<span class="명료글씨">${esc(x.코드)} · ${x.줄}줄</span>`, 글: x => x.코드 + ' ' + x.줄 + '줄' },
        { 이름: '두 자료 · 이름 다름', 건: 단.이름다름, 한줄: x => `<span class="명료글씨">${esc(x.코드)}</span><div>${esc(x.단품쪽)}</div><div class="명료잔">${esc(x.상품쪽)}</div>`, 글: x => x.코드 + ' | ' + x.단품쪽 + ' | ' + x.상품쪽 }
    );
    return g;
}

function 분석그리기() {
    const { 상, 단, 상이름, 단이름 } = 분석결과;
    $('분석셈').textContent = '상품 ' + 셈(상.줄수) + '줄 · 상품코드 ' + 셈(상.상품코드수) + ' · 단품코드 ' + 셈(상.단품코드수);
    $('분석근거').textContent = '상품 — ' + 상이름 + (단 ? ' · 단품 — ' + 단이름 + ' (' + 셈(단.코드수) + '가지, 코드 칸 ' + (단.코드칸 || '못 찾음') + ')' : ' · 단품 자료 없음');
    const 접 = (이름, 수, 안, 늘) => `<details class="명료접"><summary>${esc(이름)}<span class="수 ${늘 ? '' : (수 ? '있음' : '없음')}">${셈(수)}</span></summary><div class="명료안">${안}</div></details>`;
    const 줄 = 분석갈래들().map(g => 접(g.이름, g.건.length,
        g.건.slice(0, 보일건수).map(x => '<div class="한건">' + g.한줄(x) + '</div>').join('')
        + (g.건.length > 보일건수 ? '<div class="명료잔">밖에 ' + 셈(g.건.length - 보일건수) + '건</div>' : '')));
    줄.push(접('코드 앞머리', 상.앞머리.length,
        '<table class="명료표">' + 상.앞머리.map(a => `<tr><td><b>${esc(a.앞)}</b><div class="명료글씨">${esc(a.보기)} ${esc(a.이름)}</div></td><td class="오른">${셈(a.수)}가지</td></tr>`).join('') + '</table>', true));
    const 사전 = [...상.쓰임.entries()].map(([c, s]) => ({ 코드: c, 이름: [...(상.코드이름.get(c) || [])][0] || '', 쓰임: s.size })).sort((a, b) => b.쓰임 - a.쓰임);
    줄.push(접('단품 사전', 사전.length,
        '<table class="명료표">' + 사전.map(a => `<tr><td><span class="명료글씨">${esc(a.코드)}</span><div>${esc(a.이름)}</div></td><td class="오른">상품 ${셈(a.쓰임)}</td></tr>`).join('') + '</table>', true));
    $('분석목록').innerHTML = 줄.join('');
}

// 분석 복사 — 코드와 이름, 셈만 담는다. 금액 칸은 한 글자도 안 들어간다.
$('btn-copy').addEventListener('click', async () => {
    if (!분석결과) return;
    const { 상, 단, 상이름, 단이름 } = 분석결과, L = [];
    L.push('[제품명료화 분석 ' + 때보임(때이름(new Date())) + ']');
    L.push('상품 — ' + 상이름 + ' · ' + 상.줄수 + '줄 · 상품코드 ' + 상.상품코드수 + ' · 단품코드 ' + 상.단품코드수);
    if (단) L.push('단품 — ' + 단이름 + ' · ' + 단.줄수 + '줄 · 코드 ' + 단.코드수 + '가지 · 코드 칸 ' + 단.코드칸 + ' · 이름 칸 ' + 단.이름칸);
    자료들.forEach(a => L.push('자료 — ' + a.이름 + ' · ' + a.줄수 + '줄 · 갈래 ' + (a.갈래 || '그 밖') + ' · 칸: ' + (a.칸이름 || []).join(', ')));
    분석갈래들().forEach(g => { L.push('', '■ ' + g.이름 + ' ' + g.건.length); g.건.slice(0, 40).forEach(x => L.push('  ' + g.글(x))); });
    L.push('', '■ 코드 앞머리 ' + 상.앞머리.length);
    상.앞머리.forEach(a => L.push('  ' + a.앞 + ' ' + a.수 + '가지 · ' + a.보기 + ' ' + a.이름));
    L.push('', '■ 규칙 ' + 규칙들.length);
    규칙들.forEach(r => L.push('  [' + (r.상태 || '추정') + '] ' + r.글));
    const 글 = L.join('\n'), b = $('btn-copy');
    try { await navigator.clipboard.writeText(글); b.textContent = '복사됨'; }
    catch (e) { $('복사글').value = 글; $('복사글').classList.remove('hidden'); $('복사글').select(); b.textContent = '아래 글을 복사'; }
    setTimeout(() => b.textContent = '분석 복사', 2500);
});

// ════════════════════════════════════════════════════════════════════
// 5. 규칙 — 한 줄씩 적어 둔다. 딱지를 누르면 추정 ↔ 확인.
// ════════════════════════════════════════════════════════════════════
function 규칙그리기() {
    $('규칙목록').innerHTML = 규칙들.map(r => `<div class="명료줄"><span style="flex:1;min-width:0;overflow-wrap:anywhere;padding:8px 0">${esc(r.글)}</span>
        <button class="명료딱지 ${r.상태 === '확인' ? '켬' : '노랑'}" data-rule="${esc(r.id)}">${esc(r.상태 || '추정')}</button></div>`).join('');
}
$('btn-rule').addEventListener('click', async () => {
    const 글 = $('규칙글').value.trim();
    if (!글) { $('규칙글').focus(); return; }
    const id = 때이름(new Date()), r = { 글, 상태: '추정', 누가: (window.나 && window.나.email) || '' };
    $('btn-rule').disabled = true;
    try {
        await window.fb.setDoc(문서(자리.규칙, id), Object.assign({ 언제: window.fb.serverTimestamp() }, r));
        규칙들.unshift(Object.assign({ id }, r)); $('규칙글').value = ''; 규칙그리기();
    } catch (err) { fail(new Error('규칙을 담지 못했습니다 — ' + err.message)); }
    $('btn-rule').disabled = false;
});
$('규칙글').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('btn-rule').click(); } });
$('규칙목록').addEventListener('click', async e => {
    const b = e.target.closest('[data-rule]');
    if (!b) return;
    const r = 규칙들.find(x => x.id === b.dataset.rule);
    r.상태 = r.상태 === '확인' ? '추정' : '확인';
    규칙그리기();
    try { await window.fb.setDoc(문서(자리.규칙, r.id), { 상태: r.상태 }, { merge: true }); }
    catch (err) { fail(new Error('규칙을 바꾸지 못했습니다 — ' + err.message)); }
});
</script>
</body>
</html>
