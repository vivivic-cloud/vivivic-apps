<!doctype html>
<!-- inghome 상품 카탈로그 — VG-VER v1.1.0
     판 번호는 머리띠 VIVIVIC 옆 배지와 같다. 고칠 때 둘을 같이 올린다. -->
<html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>inghome 상품 카탈로그</title>
<style>
/* Layout: 상단 고정 필터 바 + 반응형 상품 카드 그리드, 옵션은 사이즈x색상 표 창으로. 원목 가구 톤의 오크 액센트 */
:root{
  /* 비비빅(구 바이글) 한 벌 — 열다섯 프로그램이 같이 쓴다. 조혼가구·에이엠티와 같은 값이다 */
  --vg-bg:#fff; --vg-ink:#111110; --vg-body:#1A1A19; --vg-soft:#6E6E6A;
  --vg-muted:#9C9C98; --vg-line:#EDEDEB; --vg-edge:#E2E2DF;
  --vg-fill:#F4F4F2; --vg-fill2:#EAEAE7; --vg-red:#FF3B30;
  --fluid-h1:clamp(1.5rem,5vw,2.25rem); --fluid-h2:clamp(1.125rem,4vw,1.5rem);
  --fluid-body:clamp(0.875rem,2.5vw,1.05rem); --fluid-small:clamp(0.75rem,2vw,0.875rem);
  --fluid-mini:clamp(0.65rem,1.5vw,0.75rem);
  /* 아래는 이 화면이 쓰던 이름 — 위 한 벌을 가리키는 별칭일 뿐이다 */
  --bg:var(--vg-bg); --surface:var(--vg-bg); --fg:var(--vg-ink); --muted:var(--vg-muted);
  --line:var(--vg-line); --accent:var(--vg-ink); --accent-soft:var(--vg-fill);
  --sale:var(--vg-red); --head:var(--vg-fill); --scrim:rgba(17,17,16,.5);
  /* 기계 글꼴 — 집 프로그램이 다 쓰는 것. 폰에서 글꼴 받느라 늦어지지 않는다 */
  --body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  --display:var(--body);
}
/* 어두운 꼴은 두지 않는다 — 집 프로그램은 밝은 꼴 하나다 */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:var(--fluid-body)/1.5 var(--body);margin:0}
/* 머리띠 — VIVIVIC 과 그 옆 판 번호 배지. 조혼가구·에이엠티와 같은 꼴.
   판 번호를 고칠 때는 글머리 주석(VG-VER)과 이 화면의 배지를 같이 올린다 */
.vgbar{display:flex;align-items:center;gap:8px;max-width:1280px;margin:0 auto;
  padding:12px 16px;border-bottom:1px solid var(--vg-line)}
.vgbar b{font-weight:800;font-size:20px;letter-spacing:-1px;color:var(--vg-ink)}
.vgbar .ver{font:700 9px/1 ui-monospace,SFMono-Regular,monospace;color:var(--vg-muted);
  background:var(--vg-fill);border:1px solid var(--vg-line);padding:3px 6px;
  border-radius:4px;letter-spacing:.04em}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}
header.top{padding-block:28px 12px}
h1{font:700 var(--fluid-h1)/1.2 var(--display);letter-spacing:-.9px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;font-size:var(--fluid-small)}
.sub a{color:var(--accent)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row+.row{margin-top:10px}
input[type=search],select{font:inherit;color:var(--fg);background:var(--vg-fill);border:1px solid var(--vg-line);border-radius:999px;padding:9px 16px;min-width:0}
input[type=search]{flex:1 1 240px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px;min-width:0}
.chip{flex:none;font:500 var(--fluid-small) var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips.subc .chip{font-size:12px;padding:4px 10px}
.chips.subc .chip[aria-pressed=true]{background:var(--vg-fill2);border-color:var(--vg-edge);color:var(--vg-ink);font-weight:700}
.count{color:var(--muted);font-size:var(--fluid-small);margin-left:auto;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px 16px;padding-block:20px 48px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 10px}}
.card{display:flex;flex-direction:column;min-width:0;content-visibility:auto;contain-intrinsic-size:auto 440px}
.ph{position:relative;aspect-ratio:1;max-width:100%;background:var(--vg-fill);border-radius:18px;overflow:hidden;border:1px solid var(--vg-line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .off{position:absolute;left:8px;top:8px;background:var(--vg-red);color:#fff;font:700 var(--fluid-mini) var(--body);padding:3px 9px;border-radius:999px}
.ph .stop{position:absolute;inset:auto 0 0 0;background:rgba(17,17,16,.62);color:#fff;font:600 var(--fluid-mini) var(--body);text-align:center;padding:6px}
.ph .no{position:absolute;right:8px;top:8px;background:rgba(17,17,16,.55);color:#fff;font-size:var(--fluid-mini);padding:2px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.name{font-weight:600;font-size:var(--fluid-body);line-height:1.4;margin:10px 0 4px;overflow-wrap:anywhere}
.cats{color:var(--muted);font-size:var(--fluid-mini);margin:0 0 6px}
.price{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.price b{font-size:var(--fluid-h2);font-weight:700}
.price s{color:var(--muted);font-size:var(--fluid-mini)}
.optsum{margin-top:8px;font-size:var(--fluid-mini);color:var(--muted);display:grid;gap:3px}
.optsum .k{color:var(--fg);font-weight:500;margin-right:4px}
.optsum .cw{color:var(--fg)}
.links{display:flex;gap:6px;margin-top:10px}
.links a,.links button{flex:1;text-align:center;font:600 var(--fluid-mini) var(--body);text-decoration:none;color:var(--accent);background:var(--vg-fill);border:0;border-radius:999px;padding:8px 6px;cursor:pointer}
.links button{background:var(--fg);color:var(--bg)}
.links a:hover,.links button:hover{filter:brightness(.95)}
.empty,.loading{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}

/* 옵션 창 */
.modal{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px}
.sheet{background:var(--surface);color:var(--fg);border-radius:20px;width:100%;max-width:880px;padding:20px;min-width:0;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sh-head{display:flex;gap:16px;align-items:flex-start}
.sh-head img{width:96px;height:96px;object-fit:cover;border-radius:14px;border:1px solid var(--vg-line);flex:none}
.sh-head .t{min-width:0;flex:1}
.sh-head h2{font:700 var(--fluid-h2)/1.35 var(--body);letter-spacing:-.4px;margin:0 0 6px;overflow-wrap:anywhere}
.x{flex:none;background:var(--vg-fill);border:1px solid var(--vg-line);color:var(--fg);border-radius:999px;width:34px;height:34px;font-size:18px;cursor:pointer}
.sh-links{display:flex;gap:12px;margin-top:6px;font-size:var(--fluid-small)}
.sh-links a{color:var(--accent)}
.sec{margin-top:20px}
.sec h3{font:700 19px var(--body);letter-spacing:-.4px;color:var(--vg-ink);margin:0 0 8px}
.note{font-size:var(--fluid-mini);color:var(--muted);margin:8px 0 0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--vg-line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:var(--fluid-small);font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
thead th{background:var(--head);font-weight:600;white-space:nowrap}
tbody th{font-weight:500;background:var(--head);min-width:120px}
td.c{text-align:right;white-space:nowrap}
td .d{display:block;font-size:11px;color:var(--accent)}
td.na{color:var(--muted);text-align:center}
.so{color:var(--sale);font-weight:600;font-size:12px}
.pill{display:inline-block;font-size:var(--fluid-mini);border:1px solid var(--vg-edge);border-radius:999px;padding:2px 10px;margin:0 6px 6px 0}
.warn{background:var(--vg-fill);color:var(--fg);border-radius:14px;padding:10px 14px;font-size:var(--fluid-small);margin-top:14px}
details summary{cursor:pointer;font-size:var(--fluid-small);color:var(--accent)}
@media (max-width:480px){.sheet{padding:16px}.sh-head img{width:72px;height:72px}}
/* 회사 박스 — 비비빅 판(viggle/index.html)의 타일 숫자 그대로.
   안여백 17 · 최소높이 150 · 모서리 26 · 칸 1.02fr 1fr · 사이 12 */
.home{padding-block:28px 48px;max-width:430px}
.home h1{font:700 23px/1.06 var(--body);letter-spacing:-.9px;margin:0 0 14px}
.tiles{display:grid;grid-template-columns:1.02fr 1fr;gap:12px}
.tile{position:relative;border-radius:26px;padding:17px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;cursor:pointer;border:1px solid transparent;color:var(--vg-ink);text-align:left;min-height:150px;transition:transform .12s;width:100%;font:inherit;gap:18px}
.tile:active{transform:scale(.975)}
.tile.light{background:var(--vg-fill)}
.tile.white{background:var(--vg-bg);border-color:var(--vg-edge)}
.tile.dark{background:var(--vg-ink);color:#fff}
.tile .ico{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(0,0,0,.05)}
.tile.white .ico{background:var(--vg-fill)}
.tile.dark .ico{background:rgba(255,255,255,.14)}
.tile .nm{display:block;font-size:20px;line-height:1.22;letter-spacing:-.5px;font-weight:700}
.tile .pct{display:block;margin:5px 0 0;font-size:12.5px;color:var(--vg-muted)}
.tile.dark .pct{color:rgba(255,255,255,.62)}
/* 스크랩할 웹사이트 주소 — 첫 화면에 늘 보인다. 접어 두지 않는다 */
.ask{margin-top:20px}
.ask h2{font:700 19px var(--body);letter-spacing:-.4px;margin:0 0 8px}
.ask form{display:flex;gap:8px}
.ask input{flex:1 1 auto;min-width:0;font:inherit;font-size:var(--fluid-small);
  color:var(--fg);background:var(--vg-fill);border:1px solid var(--vg-line);
  border-radius:999px;padding:10px 16px}
.ask button{flex:none;font:600 var(--fluid-small) var(--body);color:#fff;
  background:var(--vg-ink);border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
.ask button[disabled]{background:var(--vg-muted);cursor:default}
.ask .say{margin:8px 0 0;font-size:var(--fluid-small);color:var(--vg-soft)}
.ask .say.bad{color:var(--vg-red)}
.back{font:500 var(--fluid-small) var(--body);color:var(--muted);background:none;border:0;padding:0 0 10px;cursor:pointer;min-height:44px}
</style>

<div class="vgbar"><b>VIVIVIC</b><span class="ver">v1.1.0</span></div>

<div class="wrap home" id="home">
  <h1>스크랩한 회사</h1>
  <div class="tiles">
    <button type="button" class="tile light" id="open-inghome">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></svg></span>
      <span><span class="nm">inghome</span><span class="pct">스크랩 위치 1곳</span></span>
    </button>
  </div>
  <div class="ask">
    <h2>스크랩할 웹사이트 주소</h2>
    <!-- novalidate — 브라우저가 제 말풍선을 띄우고 멈추면 우리 알림 줄이 안 뜬다.
         type=url 은 폰 글쇠판을 주소 꼴로 띄우려고 남긴다 -->
    <form id="ask-form" novalidate>
      <input type="url" id="ask-url" placeholder="https://example.co.kr/" inputmode="url"
             autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="스크랩할 웹사이트 주소">
      <button type="submit" id="ask-go">요청</button>
    </form>
    <p class="say" id="ask-say" hidden></p>
  </div>
</div>
<div class="wrap home" id="site" hidden>
  <button type="button" class="back" id="back-site">← 스크랩한 회사</button>
  <h1>inghome</h1>
  <div class="tiles">
    <button type="button" class="tile light" id="open-site">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
      <span><span class="nm">inghome.co.kr</span><span class="pct">상품 684개 · 10-10 수집</span></span>
    </button>
  </div>
</div>
<div id="cat" hidden>
<div class="wrap">
  <header class="top">
    <button type="button" class="back" id="back">← inghome</button>
    <h1>inghome 상품 카탈로그</h1>
    <p class="sub"><a href="https://inghome.co.kr/" target="_blank" rel="noopener">inghome.co.kr</a> 전체 상품 684개 · 옵션 2,171개 · 2026년 10월 10일 수집</p>
  </header>
</div>
<div class="bar">
  <div class="wrap">
    <div class="row">
      <input type="search" id="q" placeholder="상품명, 상품번호, 옵션 이름으로 찾기" aria-label="상품 검색">
      <select id="color" aria-label="색상"><option value="">모든 색상</option></select>
      <select id="sort" aria-label="정렬">
        <option value="def">사이트 진열순</option>
        <option value="low">낮은 가격순</option>
        <option value="high">높은 가격순</option>
        <option value="off">할인율 높은순</option>
        <option value="opts">옵션 많은순</option>
        <option value="name">이름순</option>
      </select>
    </div>
    <div class="row"><div class="chips" id="top" role="group" aria-label="카테고리"></div></div>
    <div class="row"><div class="chips subc" id="subs" role="group" aria-label="세부 카테고리" hidden></div><span class="count" id="count"></span></div>
  </div>
</div>
<main class="wrap"><div class="grid" id="grid"><div class="loading">상품을 불러오는 중입니다…</div></div></main>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="sh-title"><div class="sheet" id="sheet"></div></div>

<script>
const TOP=["전체","NEW","BEST","Weekly Best","침실","드레스룸","수납","거실","주방","서재","ING HOME KIDS","매장가구","리빙소품"];
let items=[],byNo={},cat="전체",sub=null;
const $=id=>document.getElementById(id);
const won=n=>n.toLocaleString("ko-KR")+"원";
const off=p=>p.cp>p.sp&&p.sp?Math.round((1-p.sp/p.cp)*100):0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function inCat(p,c){return c==="전체"||p.c.some(x=>x===c||x.startsWith(c+" > "))}

function drawTop(){
  $("top").innerHTML=TOP.map(c=>{const n=items.filter(p=>inCat(p,c)).length;
    return `<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)} ${n}</button>`}).join("");
  const subs=[...new Set(items.flatMap(p=>p.c).filter(x=>x.startsWith(cat+" > ")))];
  $("subs").hidden=!subs.length;
  $("subs").innerHTML=subs.length?[`<button class="chip" aria-pressed="${!sub}" data-s="">전체</button>`]
    .concat(subs.map(s=>`<button class="chip" aria-pressed="${s===sub}" data-s="${esc(s)}">${esc(s.split(" > ")[1])}</button>`)).join(""):"";
}

/* 카드에 들어가는 옵션 요약 */
function optSummary(p){
  const o=p.o,lines=[];
  if(o.mode==="matrix"&&o.colName==="색상"||o.mode==="matrix"&&/색|컬러/.test(o.colName)){
    lines.push(`<div><span class="k">${esc(o.rowName)}</span>${o.rows.length}종</div>`);
  }else if(o.mode==="matrix"){
    lines.push(`<div><span class="k">${esc(o.rowName)}</span>${o.rows.length}종 · <span class="k">${esc(o.colName)}</span>${o.cols.length}종</div>`);
  }else if(o.mode==="list"&&o.count>1){
    lines.push(`<div><span class="k">선택</span>${o.count}종</div>`);
  }
  if(p.cw.length)lines.push(`<div><span class="k">색상</span><span class="cw">${p.cw.slice(0,4).map(esc).join(" · ")}${p.cw.length>4?` 외 ${p.cw.length-4}`:""}</span></div>`);
  if(!lines.length)lines.push(`<div>옵션 ${o.count}개</div>`);
  return lines.join("");
}

function render(){
  const q=$("q").value.trim().toLowerCase(),col=$("color").value;
  let list=items.filter(p=>inCat(p,cat)&&(!sub||p.c.includes(sub))&&(!col||p.cw.includes(col))&&
    (!q||p.t.toLowerCase().includes(q)||p.n===q||p.o.list.some(r=>r[0].toLowerCase().includes(q))));
  const s=$("sort").value;
  if(s==="low")list.sort((a,b)=>a.sp-b.sp);
  else if(s==="high")list.sort((a,b)=>b.sp-a.sp);
  else if(s==="off")list.sort((a,b)=>off(b)-off(a));
  else if(s==="opts")list.sort((a,b)=>b.o.count-a.o.count);
  else if(s==="name")list.sort((a,b)=>a.t.localeCompare(b.t,"ko"));
  $("count").textContent=`${list.length}개 상품`;
  $("grid").innerHTML=list.length?list.map(p=>{const o=off(p);return `
  <article class="card">
    <a class="ph" href="${p.u}" target="_blank" rel="noopener"><img src="${p.th}" data-big="${p.img}" alt="${esc(p.t)}" loading="lazy" decoding="async">
      ${o?`<span class="off">${o}%</span>`:""}<span class="no">#${p.n}</span>${p.o.hidden?`<span class="stop">현재 판매중지 · 품절</span>`:""}</a>
    <div class="name">${esc(p.t)}</div>
    <div class="cats">${esc(p.c.filter(x=>!["NEW","BEST","Weekly Best","Discover"].includes(x)).join(" · ")||p.c.join(" · "))}</div>
    <div class="price"><b>${won(p.sp)}</b>${o?`<s>${won(p.cp)}</s>`:""}</div>
    <div class="optsum">${optSummary(p)}</div>
    <div class="links"><button type="button" data-open="${p.n}">옵션 ${p.o.count}개 보기</button><a href="${p.u}" target="_blank" rel="noopener">상품 페이지</a></div>
  </article>`}).join(""):`<div class="empty">조건에 맞는 상품이 없습니다. 검색어, 색상, 카테고리를 바꿔 보세요.</div>`;
}

/* 옵션 표 */
function priceCell(price,sold,base){
  if(sold)return `<td class="c"><span class="so">품절</span><span class="d" style="color:var(--muted)">${won(price)}</span></td>`;
  const diff=price-base;
  return `<td class="c">${won(price)}${diff?`<span class="d">${diff>0?"+":""}${won(diff)}</span>`:""}</td>`;
}
function openSheet(no){
  const p=byNo[no],o=p.o;let body="";
  if(o.mode==="matrix"){
    body+=`<div class="sec"><h3>${esc(o.rowName)} × ${esc(o.colName)}</h3><div class="tbl-wrap"><table>
      <thead><tr><th>${esc(o.rowName)} \\ ${esc(o.colName)}</th>${o.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>
      ${o.rows.map(r=>`<tr><th scope="row">${esc(r)}</th>${o.cols.map(c=>{const v=o.cells[r+"\u0001"+c];return v?priceCell(v[0],v[1],o.base):`<td class="na">없음</td>`}).join("")}</tr>`).join("")}
      </tbody></table></div><p class="note">칸 안의 금액은 해당 조합의 판매가입니다. 아래 작은 글씨는 기본 판매가(${won(o.base)})와의 차이입니다. '없음'은 판매하지 않는 조합입니다.</p></div>`;
    body+=`<div class="sec"><details><summary>사이트에 표시된 옵션 이름 그대로 보기 (${o.count}개)</summary>${listTable(o)}</details></div>`;
  }else{
    body+=`<div class="sec"><h3>${o.mode==="colors"?esc(o.colName||"색상"):"옵션"} (${o.count}개)</h3>${listTable(o)}</div>`;
  }
  if(o.add&&o.add.length)body+=`<div class="sec"><h3>추가 구성 옵션</h3>${o.add.map(a=>`<div><b style="font-size:13px">${esc(a.name)}</b><div style="margin-top:6px">${a.values.map(v=>`<span class="pill">${esc(v)}</span>`).join("")}</div></div>`).join("")}</div>`;
  $("sheet").innerHTML=`<div class="sh-head"><img src="${p.th}" data-big="${p.img}" alt="">
    <div class="t"><h2 id="sh-title">${esc(p.t)}</h2><div class="price"><b>${won(p.sp)}</b>${off(p)?`<s>${won(p.cp)}</s>`:""}</div>
    <div class="sh-links"><a href="${p.u}" target="_blank" rel="noopener">상품 페이지</a><a href="${p.img}" target="_blank" rel="noopener">원본 사진</a><span style="color:var(--muted)">#${p.n}</span></div></div>
    <button class="x" type="button" id="close" aria-label="닫기">×</button></div>
    ${o.hidden?`<div class="warn">이 상품은 수집 시점에 모든 옵션이 숨김 처리되어 있었습니다. 판매중지나 품절 상태로 보이며, 아래 옵션은 참고용입니다.</div>`:""}
    ${body}`;
  $("modal").hidden=false;document.body.style.overflow="hidden";$("close").focus();
}
function listTable(o){
  return `<div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>옵션</th><th style="text-align:right">판매가</th></tr></thead><tbody>
    ${o.list.map(r=>`<tr><td>${esc(r[0])}</td>${priceCell(r[1],r[2],o.base)}</tr>`).join("")}</tbody></table></div>`;
}
function closeSheet(){$("modal").hidden=true;document.body.style.overflow=""}

/* 사진은 남의 집 주소에서 바로 불러온다 — 남의 회사 그림을 우리 저장소에 두지 않는다.

function imgFail(e){
  const im=e.target;if(!im||im.tagName!=="IMG")return;
  if(im.dataset.big&&im.src!==im.dataset.big){im.src=im.dataset.big;return}
  im.remove();
}

/* ── 스크랩 요청 ────────────────────────────────────────────────────
   새 길을 내지 않는다. 짚어서 지시하기가 쓰는 그 칸(wt_asked)에 그대로 적는다.
   shared/viggle.js 와 같은 꼴이다 — 그 파일은 한 줄도 손대지 않았다.
   창고 주소와 웹 열쇠도 그 파일에 이미 적혀 있는 것과 같다(브라우저가 들고
   다니는 공개된 표다. 숨기는 낱말이 아니다).
   적고 나면 바이글의 감시가 1분 안에 집어서 작업자에게 넘긴다. */
const VG_PROJ="vivivic-4b7ef";
const VG_KEY="AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs";
const VG_창고=`https://firestore.googleapis.com/v1/projects/${VG_PROJ}/databases/(default)/documents/artifacts/${VG_PROJ}/public/data`;
const VG_자리="box:catalog";

async function vgToken(){
  try{const u=window.fbAuth&&window.fbAuth.auth&&window.fbAuth.auth.currentUser;if(u)return await u.getIdToken()}catch(e){}
  try{const d=JSON.parse(localStorage.getItem("vg.tok")||"null");if(d&&d.until>Date.now()+60000)return d.tok}catch(e){}
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${VG_KEY}`,
    {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({returnSecureToken:true})});
  if(!r.ok)throw new Error("들어가지 못했습니다");
  const d=await r.json();
  try{localStorage.setItem("vg.tok",JSON.stringify({tok:d.idToken,until:Date.now()+3300000}))}catch(e){}
  return d.idToken;
}
const vg값=v=>v===null||v===undefined?{nullValue:null}
  :typeof v==="boolean"?{booleanValue:v}
  :typeof v==="number"?(Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v})
  :Array.isArray(v)?{arrayValue:{values:v.map(vg값)}}
  :typeof v==="object"?{mapValue:{fields:Object.fromEntries(Object.entries(v).map(([k,x])=>[k,vg값(x)]))}}
  :{stringValue:String(v)};

/* 주소가 성한지 그 자리에서 본다 — http/https 에 집 이름이 있어야 한다 */
function seeUrl(t){
  t=(t||"").trim();
  if(!t)return{bad:"주소를 적어 주세요."};
  let u;try{u=new URL(/^https?:\/\//i.test(t)?t:"https://"+t)}catch(e){return{bad:"주소 꼴이 아닙니다. 보기: https://example.co.kr/"}}
  if(!/^https?:$/i.test(u.protocol))return{bad:"http 나 https 로 시작하는 주소만 됩니다."};
  if(!/^[^.\s]+(\.[^.\s]+)+$/.test(u.hostname))return{bad:"집 이름이 빠졌습니다. 보기: https://example.co.kr/"};
  return{url:u.href};
}
function askSay(글,나쁨){
  const e=$("ask-say");e.textContent=글;e.className="say"+(나쁨?" bad":"");e.hidden=false;
}
async function askScrape(주소){
  const 글="[스크랩요청] "+주소,때=Math.floor(Date.now()/1000);
  const 몸={자리:VG_자리,짚은자리:"스크랩한 회사 · 스크랩할 웹사이트 주소",
    페이지:location.href,말:글,한줄:글.slice(0,40)+(글.length>40?"…":""),상태:"받음",때:때};
  const tok=await vgToken();
  const 머리={Authorization:"Bearer "+tok,"Content-Type":"application/json"};
  /* 이미 있으면 덮지 않는다 — 같은 초에 두 번이면 다음 초로 비킨다.
     viggle.js 는 조용히 돌아서지만, 여기서 그러면 사장님 요청이 사라진다 */
  for(let i=0;i<5;i++){
    const 길=`${VG_창고}/wt_asked/a${때+i}`;
    const 봄=await fetch(길,{headers:{Authorization:"Bearer "+tok}});
    if(봄.ok)continue;
    몸.때=때+i;
    const w=await fetch(길,{method:"PATCH",headers:머리,
      body:JSON.stringify({fields:Object.fromEntries(Object.entries(몸).map(([k,v])=>[k,vg값(v)]))})});
    if(!w.ok)throw new Error("적지 못했습니다 ("+w.status+")");
    return;
  }
  throw new Error("적지 못했습니다 (자리가 찼습니다)");
}
$("ask-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const 본것=seeUrl($("ask-url").value);
  if(본것.bad){askSay(본것.bad,true);$("ask-url").focus();return}
  const 단추=$("ask-go");단추.disabled=true;askSay("보내는 중입니다…");
  try{
    await askScrape(본것.url);
    $("ask-url").value="";
    askSay("받았습니다 — 곧 긁습니다");
  }catch(err){
    askSay("보내지 못했습니다. "+((err&&err.message)||"")+" 다시 눌러 주세요.",true);
  }finally{단추.disabled=false}
});
