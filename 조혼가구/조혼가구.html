    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";    
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithEmailAndPassword, signOut, setPersistence, indexedDBLocalPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp, getDoc, getDocs, deleteDoc, doc, setDoc, updateDoc, writeBatch, runTransaction } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",
            authDomain: "vivivic-4b7ef.firebaseapp.com",
            projectId: "vivivic-4b7ef",
            storageBucket: "vivivic-4b7ef.firebasestorage.app",
            messagingSenderId: "830175660542",
            appId: "1:830175660542:web:9054030480c8280af8d8af",
            measurementId: "G-MCPHWSQBQR"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 로그인 유지 — 브라우저를 닫아도 남게 한다.
        // 지정하지 않으면 저장에 실패했을 때 조용히 "이번 창에서만" 으로 떨어져
        // 다음에 열 때 로그인이 풀린다. indexedDB 가 막히면 localStorage 로 물러선다.
        setPersistence(auth, indexedDBLocalPersistence)
            .catch(() => setPersistence(auth, browserLocalPersistence))
            .catch(err => console.warn('로그인 유지 설정 실패:', err));
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.db = db;
        window.storage = storage;
        window.fbFirestore = { collection, addDoc, query, where, onSnapshot, serverTimestamp, getDoc, getDocs, deleteDoc, doc, setDoc, updateDoc, writeBatch, runTransaction };
        window.fbStorage = { ref, uploadBytes, getDownloadURL };
        window.fbAuth = { auth, signInWithEmailAndPassword, signOut };

        // 로그아웃을 눌렀을 때만 로그인 화면을 띄운다. 그 밖에는 익명으로 바로 들어간다.
        let _로그인화면요청 = false;
        try {
            _로그인화면요청 = sessionStorage.getItem('vv.wantLogin') === '1';
            sessionStorage.removeItem('vv.wantLogin');
        } catch (e) {}

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                if (_로그인화면요청) { _로그인화면요청 = false; window.showAuthLoginScreen(); return; }
                // 로그인 없이 들어와도 그대로 쓸 수 있게 익명으로 들어간다
                signInAnonymously(auth)
                    .catch(err => window.showAuthLoginScreen('접속 실패: ' + (err.code || err.message)));
                return;
            }

            if (user.isAnonymous) {
                // 로그인 없이 쓰는 사람 — 계정 권한 조회를 건너뛰고 바로 들어간다
                window._myAccount = { uid: user.uid, email: '', role: null, company: null };
                window.hideAuthLoginScreen();
                const emailEl0 = document.getElementById('auth-account-email');
                if (emailEl0) emailEl0.textContent = '로그인 없이 이용 중';
                const outBtn = document.getElementById('auth-logout-btn');
                if (outBtn) { outBtn.textContent = '로그인'; outBtn.onclick = () => window.showAuthLoginScreen(); }
                initCloudDataSync();
                initConfirmedOrdersSync();
                return;
            }

            try {
                const accSnap = await getDoc(doc(db, 'artifacts', 'vivivic-4b7ef', 'public', 'data', 'user_accounts', user.uid));
                if (!accSnap.exists()) {
                    window.showAuthLoginScreen('권한 없음 · 관리자 문의');
                    await signOut(auth);
                    return;
                }
                const acc = accSnap.data();
                window._myAccount = { uid: user.uid, email: user.email, role: acc.role, company: acc.company || null };
                window.hideAuthLoginScreen();
                const emailEl = document.getElementById('auth-account-email');
                if (emailEl) emailEl.textContent = user.email;
                console.log("Firebase Auth Success:", user.uid, window._myAccount);
                if (typeof window.applyAccountRestrictions === 'function') window.applyAccountRestrictions();
                initCloudDataSync();
                initConfirmedOrdersSync();
            } catch (err) {
                console.error('계정 정보 조회 실패:', err);
                window.showAuthLoginScreen('계정 조회 실패');
            }
        });

        window.showAuthLoginScreen = function(errorMsg) {
            const overlay = document.getElementById('auth-login-overlay');
            if (!overlay) return;
            overlay.classList.remove('hidden');
            const errEl = document.getElementById('auth-login-error');
            if (errorMsg) { errEl.textContent = errorMsg; errEl.classList.remove('hidden'); }
            else { errEl.classList.add('hidden'); }
            const btn = document.getElementById('auth-login-submit');
            if (btn) { btn.disabled = false; btn.textContent = '로그인'; }
        };
        window.hideAuthLoginScreen = function() {
            const overlay = document.getElementById('auth-login-overlay');
            if (overlay) overlay.classList.add('hidden');
        };
        window.handleAuthLoginSubmit = async function(e) {
            e.preventDefault();
            const email = document.getElementById('auth-login-email').value.trim();
            const password = document.getElementById('auth-login-password').value;
            const btn = document.getElementById('auth-login-submit');
            btn.disabled = true; btn.textContent = '로그인 중...';
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                console.error('로그인 실패:', err);
                let msg = '로그인 실패';
                if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
                    msg = '이메일·비밀번호 확인';
                } else if (err.code === 'auth/too-many-requests') {
                    msg = '시도 많음 · 잠시 뒤';
                }
                window.showAuthLoginScreen(msg);
            }
            return false;
        };
        window.handleAuthLogout = async function() {
            window._myAccount = null;
            try { sessionStorage.setItem('vv.wantLogin', '1'); } catch (e) {}   // 이번만 로그인 화면
            await signOut(auth);
            location.reload();
        };
    </script>

    <link rel="stylesheet" href="../shared/조혼가구모양.css">   <!-- 조혼가구 CSS 한 벌 — 영림원외주입력의 발주 상품고르기도 같이 쓴다 -->

    <script>
        const IDENTITY_HEADERS = ["대분류", "중분류", "소분류", "상품색상"];
        const pageToSupplierMap = {
            '조혼가구': '조혼가구',
            '아인가구': '아인가구',
            'ing': '본사',
            '럭스디자인': '럭스디자인',
            '유한가구': '유한가구'
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vivivic-4b7ef';
        const COLLECTION_ORDERS = 'confirmed_orders';

        function normalizeValue(val) { if (val === null || val === undefined || String(val).trim() === "" || String(val).trim() === "선택없음") return "선택없음"; return String(val).trim(); }
        function buildDisplayName(v1, v2, v3, v4) { let n = (v1 !== '선택없음' ? v1 : '') + (v2 !== '선택없음' ? v2 : '') + (v3 !== '선택없음' ? v3 : ''); let c = (v4 !== '선택없음') ? `-${v4}` : ""; return (n + c) || "상품명 없음"; }

        /* ═══ 대한민국 공휴일 표 ═══════════════════════════════════════════
           설·추석은 음력이라 규칙으로 셀 수 없다. 해마다 손으로 적는다.
           대체공휴일도 함께 적는다(삼일절·어린이날·부처님오신날·광복절·
           개천절·한글날·성탄절·설·추석이 주말과 겹칠 때. 신정과 현충일은
           대체 대상이 아니다).
           ⚠ 임시공휴일이 생기면 그 해 줄에 날짜 하나만 더 넣으면 된다.
           ⚠ 표는 2027년까지다. 그 뒤 날짜는 공휴일로 안 걸리고 토·일만 걸린다.
              2027년이 가기 전에 2028년 줄을 더해야 한다. */
        const KR_HOLIDAYS_LAST_YEAR = 2027;
        const KR_HOLIDAYS = [
            "2025-01-01", "2025-01-28", "2025-01-29", "2025-01-30", "2025-03-01", "2025-05-05", "2025-06-06", "2025-08-15", "2025-10-03", "2025-10-09", "2025-12-25",
            // 2026
            "2026-01-01", "2026-02-16", "2026-02-17", "2026-02-18", "2026-03-01", "2026-03-02", "2026-05-05",
            "2026-05-24", "2026-05-25", "2026-06-03", "2026-06-06", "2026-08-15", "2026-08-17",
            "2026-09-24", "2026-09-25", "2026-09-26", "2026-09-28",   // 추석(목금토) + 토요일 겹침 대체
            "2026-10-03", "2026-10-05", "2026-10-09", "2026-12-25",
            // 2027
            "2027-01-01",
            "2027-02-06", "2027-02-07", "2027-02-08", "2027-02-09", "2027-02-10",  // 설(토일월) + 대체 둘
            "2027-03-01", "2027-05-05", "2027-05-13",                              // 삼일절 · 어린이날 · 부처님오신날
            "2027-06-06",                                                          // 현충일(일) — 대체 대상 아님
            "2027-08-15", "2027-08-16",                                            // 광복절(일) + 대체
            "2027-09-14", "2027-09-15", "2027-09-16",                              // 추석(화수목)
            "2027-10-03", "2027-10-04",                                            // 개천절(일) + 대체
            "2027-10-09", "2027-10-11",                                            // 한글날(토) + 대체
            "2027-12-25", "2027-12-27"                                             // 성탄절(토) + 대체
        ];

        let currentFullData = [];
        let uniqueProductIdentities = [];

        // ── 공정 기본 속도 상수 (에이엠티와 동일) ─────────────────────
        const PROCESS_BASE_RATES = { 재단: 7.9366e-05, 엣지: 0.00032, 보링: 0.00025, NC: 0.00051333 };
        function calcProcessTime(row, qty, difficulties, h) {
            const W = parseFloat(row[h.indexOf("재단W")]) || 0;
            const D = parseFloat(row[h.indexOf("재단D")]) || 0;
            const totalEdge = String(row[h.indexOf("총엣지면")] || '').toLowerCase();
            const edgeFaces = (totalEdge === 'non' || totalEdge === 'x' || totalEdge === '') ? 0 : (parseFloat(totalEdge) || 0);
            const hasBoring  = String(row[h.indexOf("보링수량")] || '').includes('입력대기') || (parseFloat(row[h.indexOf("보링수량")]) > 0);
            const hasNC      = String(row[h.indexOf("NC유무")] || '').toUpperCase() === 'O';
            const hasEdge    = edgeFaces > 0;
            const hasCutting = W > 0 && D > 0;
            const diffMap = (typeof difficulties === 'object' && difficulties !== null) ? difficulties : {};
            const mult = (key) => { const d = Math.max(1, Math.min(10, parseInt(diffMap[key]) || 1)); return 1 + (d - 1) * 0.1; };
            const perimeter = (W * 2) + (D * 2);
            const edgeVal   = (W * edgeFaces) + (edgeFaces * D);
            return {
                재단: hasCutting ? +(perimeter * qty * PROCESS_BASE_RATES.재단 * mult('재단')).toFixed(3) : 0,
                엣지: hasEdge    ? +(edgeVal   * qty * PROCESS_BASE_RATES.엣지 * mult('엣지')).toFixed(3) : 0,
                보링: hasBoring  ? +(perimeter * qty * PROCESS_BASE_RATES.보링 * mult('보링')).toFixed(3) : 0,
                NC:   hasNC      ? +(perimeter * qty * PROCESS_BASE_RATES.NC   * mult('NC')).toFixed(3)   : 0,
            };
        }

        // 부속별 필요공정 점 — 에이엠티 부속카드(renderPendingOrderParts·renderTlConfParts)와 같은 판정·같은 모양.
        // calcProcessTime 값이 0보다 큰 공정만 찍는다. 얹으면 공정명·분이 뜬다. 화이어베이스에는 안 쓴다.
        function 부속공정점글(row, item, h) {
            const partUnitCons = parseFloat(row[h.indexOf("세트별소모량")]) || 1;
            const partQtyForTime = partUnitCons * (item.orderQty || 1);
            const partT = calcProcessTime(row, partQtyForTime, {}, h);
            const procDots = [
                { key: '재단', color: '#37352f', time: partT.재단 },
                { key: 'NC',   color: '#37352f', time: partT.NC   },
                { key: '엣지', color: '#37352f', time: partT.엣지 },
                { key: '보링', color: '#37352f', time: partT.보링 },
            ].filter(p => p.time > 0)
             .map(p => `<span class="card-hint-wrap" style="display:inline-flex;align-items:center;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${p.color};flex-shrink:0;cursor:default;" class="transition-transform hover:scale-150"></span><span class="card-hint" style="font-size:10px;white-space:nowrap;">${p.key} ${p.time.toFixed(1)}분</span></span>`)
             .join('');
            return procDots ? `<div style="display:flex;gap:3px;align-items:center;flex-wrap:wrap;margin-top:2px;">${procDots}</div>` : '';
        }
        let pendingOrdersMap = { '조혼가구': [], '아인가구': [], 'ing': [], '럭스디자인': [], '유한가구': [] };
        let confirmedOrders = [];
        let orderCount = 0;
        let appMode = '조혼가구';
        let timelineProcessFilter = new Set();
        let tlDragInitialized = false;
        // 수정모드 뒤로가기 히스토리 스택 { idNum: [ {partInfoMap, orderQty, deliveryDate}, ... ] }
        const editHistoryMap = {};

        // 부속발주 상품명 표시: [부속명]은 붉은색, 나머지는 기본색
        function displayNameHtml(item, extraClass = '') {
            if (item.targetPartName) {
                return `<span class="text-red-500 font-bold">[${item.targetPartName}]</span><span class="${extraClass}"> ${item.code}</span>`;
            }
            return `<span class="${extraClass}">${item.displayName}</span>`;
        }

        function copyID(idText, badgeElement) { 
            const tempInput = document.createElement('textarea'); tempInput.value = idText; document.body.appendChild(tempInput); tempInput.select(); document.execCommand('copy'); document.body.removeChild(tempInput); 
            if (badgeElement) { badgeElement.classList.add('copied'); setTimeout(() => badgeElement.classList.remove('copied'), 600); }
            showToastMessage(`${idText} 복사됨`);
        }
        function isWeekendOrHoliday(date) { const day = date.getDay(); const dateStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; return day === 0 || day === 6 || KR_HOLIDAYS.includes(dateStr); }
        function dateToStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
        function getKSTDateStr(offsetDays = 0) { const d = new Date(new Date().getTime() + 9 * 60 * 60 * 1000); d.setUTCDate(d.getUTCDate() + offsetDays); return d.toISOString().split('T')[0]; }
        function getMinDeliveryDate() { return getKSTDateStr(4); }
        // 기본 입고요청일 — 여는 날로부터 2주 뒤.
        // 그날이 토·일·공휴일이면 다음 영업일로 민다(지시 09-12 12:07).
        // 못 고르는 날이 기본값이 되면 안 되고, 당기면 납기가 짧아지므로 뒤로 민다.
        // 2주라는 셈 자체는 그대로다.
        function getInitialDeliveryDate() {
            const d = new Date(getKSTDateStr(14) + 'T00:00:00');
            while (isWeekendOrHoliday(d)) { d.setDate(d.getDate() + 1); }
            return dateToStr(d);
        }
        function validateDeliveryDate(el) { const min = getMinDeliveryDate(); if (el.value < min) { showToastMessage("4일 이후만"); el.value = getInitialDeliveryDate(); return; } let d = new Date(el.value + 'T00:00:00'); if (isWeekendOrHoliday(d)) { showToastMessage("다음 영업일로"); while (isWeekendOrHoliday(d)) { d.setDate(d.getDate() + 1); } el.value = dateToStr(d); } }

        function handleFileUpload(input) {
            const file = input.files[0]; if (!file) return;
            const overlay = document.getElementById('loading-overlay'); 
            const statusText = document.getElementById('loading-status-text');
            overlay.classList.remove('hidden');
            statusText.textContent = "보내는 중…";
            
            const reader = new FileReader();
            reader.onload = async function(e) { 
                try { 
                    if (window.storage && window.db && window.fbStorage && window.fbFirestore) {

        function initCloudDataSync() {
            const { collection, query, onSnapshot } = window.fbFirestore;

            onSnapshot(colRef, (snapshot) => {

        async function loadCloudExcelData(url, fileName) {
            const indicator = document.getElementById('cloud-sync-status');
            indicator.className = "sync-indicator sync-active";
            indicator.textContent = "SYNCING...";
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Network Error");
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                if (jsonData.length > 0) {
                    currentFullData = jsonData;
                    buildProductIdentities();
                    onSupplierChange();
                    renderID0508();
                    indicator.className = "sync-indicator sync-idle";
                    indicator.textContent = "CLOUD SYNCED";
                    showToastMessage(`[${fileName}] 데이터 로드됨`);
                    // 데이터 로드 후 튜토리얼 체크
                    setTimeout(checkAndShowTutorial, 600);
                }
            } catch (err) { console.error("Cloud Load Error:", err); indicator.textContent = "SYNC FAIL"; }
        }

        // 드롭다운 컨트롤러
        class DropdownController {
            constructor() {
                this.activeDropdown = null;
                this.init();
            }

            init() {
                document.querySelectorAll('[data-dropdown]').forEach(button => {
                    button.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const dropdownId = button.getAttribute('data-dropdown');
                        this.toggle(dropdownId, button);
                    });
                });

                document.addEventListener('click', () => {
                    this.closeAll();
                });

                document.querySelectorAll('.dropdown-menu').forEach(menu => {
                    menu.addEventListener('click', (e) => {
                        e.stopPropagation();
                    });
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.closeAll();
                    }
                });
            }

            toggle(dropdownId, button) {
                const menu = document.getElementById(dropdownId);
                if (!menu) return;

                const isOpen = menu.getAttribute('data-state') === 'open';
                this.closeAll();

                if (!isOpen) {
                    this.open(menu, button);
                }
            }

            open(menu, button) {
                menu.classList.remove('hidden');
                menu.setAttribute('data-state', 'open');
                button.setAttribute('data-state', 'open');
                this.activeDropdown = menu;
            }

            close(menu, button) {
                menu.classList.add('hidden');
                menu.setAttribute('data-state', 'closed');
                button.setAttribute('data-state', 'closed');
            }

            closeAll() {
                document.querySelectorAll('.dropdown-menu').forEach(menu => {
                    const button = document.querySelector(`[data-dropdown="${menu.id}"]`);
                    if (button) {
                        this.close(menu, button);
                    }
                });
                this.activeDropdown = null;
            }
        }

        function addOrderedProduct() {
            // 현재 활성화된 검색 모드 확인
            let currentSearchMode = 'category';
            if (!document.getElementById('search-mode-direct').classList.contains('hidden')) {
                currentSearchMode = 'direct';
            } else if (!document.getElementById('search-mode-ing').classList.contains('hidden')) {
                currentSearchMode = 'ing';
            }

            // 부속발주 값
            const partSelectId = currentSearchMode === 'direct' ? 'sel-part-name-direct' : currentSearchMode === 'ing' ? 'sel-part-name-ing' : 'sel-part-name-category';
            const targetPartName = document.getElementById(partSelectId).value;

            const supplier = getCurrentSupplier();
            const h = currentFullData[0];

            // 모드별로 code와 카테고리 값을 분리해서 가져옴
            let code = '', v1 = '', v2 = '', v3 = '', v4 = '';

            if (currentSearchMode === 'direct') {
                // 직접검색: product-search에 표시된 code값 사용, 카테고리는 해당 code로 데이터에서 찾음
                code = document.getElementById('product-search').value;
                if (!code) return;
                const row = currentFullData.slice(1).find(r => normalizeValue(r[h.indexOf("ing발주처")]) === supplier && normalizeValue(r[0]) === code);
                if (!row) return;
                v1 = normalizeValue(row[h.indexOf("대분류")]);
                v2 = normalizeValue(row[h.indexOf("중분류")]);
                v3 = normalizeValue(row[h.indexOf("소분류")]);
                v4 = normalizeValue(row[h.indexOf("상품색상")]);

            } else if (currentSearchMode === 'ing') {
                // ING단품명: sel-ing-code에서 code 가져옴, 카테고리는 해당 code로 데이터에서 찾음
                code = document.getElementById('sel-ing-code').value;
                if (!code) return;
                const row = currentFullData.slice(1).find(r => normalizeValue(r[h.indexOf("ing발주처")]) === supplier && normalizeValue(r[0]) === code);
                if (!row) return;
                v1 = normalizeValue(row[h.indexOf("대분류")]);
                v2 = normalizeValue(row[h.indexOf("중분류")]);
                v3 = normalizeValue(row[h.indexOf("소분류")]);
                v4 = normalizeValue(row[h.indexOf("상품색상")]);

            } else {
                // 카테고리: 카테고리 select에서 v1~v4 가져오고, code는 매칭된 데이터에서 자동 확인
                v1 = document.getElementById('sel-l1').value;
                v2 = document.getElementById('sel-l2').value;
                v3 = document.getElementById('sel-l3').value;
                v4 = document.getElementById('sel-l4').value;
                if (!v1 && !v2 && !v3 && !v4) return;
            }

            // 데이터 매칭
            let matchingRows = currentFullData.slice(1).filter(r => {
                const sMatch = normalizeValue(r[h.indexOf("ing발주처")]) === supplier;
                const cMatch = code ? normalizeValue(r[0]) === code : true; // 카테고리는 code 없이 통과
                const dMatch = normalizeValue(r[h.indexOf("대분류")]) === v1;
                const jMatch = normalizeValue(r[h.indexOf("중분류")]) === v2;
                const sSubMatch = normalizeValue(r[h.indexOf("소분류")]) === v3;
                const colorMatch = normalizeValue(r[h.indexOf("상품색상")]) === v4 || normalizeValue(r[h.indexOf("마감색상")]).toLowerCase() === 'any';
                return sMatch && cMatch && dMatch && jMatch && sSubMatch && colorMatch;
            });

            if (targetPartName) {
                matchingRows = matchingRows.filter(r => normalizeValue(r[h.indexOf("부속명")]) === targetPartName);
                // 부속발주로 선택한 경우 → 선택 부속의 행 중 첫 번째만 사용
                if (matchingRows.length > 0) {
                    matchingRows = [matchingRows[0]];
                }
            }
            if (matchingRows.length === 0) return;

            // 카테고리 모드일 때 code(ing단품명)를 매칭 행에서 가져옴
            if (currentSearchMode === 'category' && !code) {
                // 매칭된 행 중 r[0](ing단품명)이 비어있지 않은 첫 번째 행에서 가져옴
                const rowWithCode = matchingRows.find(r => normalizeValue(r[0]));
                if (rowWithCode) {
                    code = normalizeValue(rowWithCode[0]);
                } else {
                    // 그래도 없으면 대분류/중분류/소분류/색상으로 표시
                    code = [v1, v2, v3, v4].filter(Boolean).join(' / ');

            orderCount++;
            const idNum = 1400 + orderCount, partInfoMap = {};
            matchingRows.forEach((row) => {

                const isAmt = (partSupplier === "AMT");
                const partName = row[h.indexOf("부속명")] || "";
                const plateName = row[h.indexOf("원장명")] || "";
                const finish = row[h.indexOf("마감")] || "";
                // 마감색상(원장 색상)은 그동안 이 카드 데이터에 전혀 담기지 않아서
                // 부속카드에 표시가 안 되고 있었음 — "마감"(양면/편면 등 가공형태)과는
                // 다른 컬럼이라 별도로 조회해서 함께 저장
                const finishColor = row[h.indexOf("마감색상")] || "";
                const w = parseFloat(row[h.indexOf("재단W")]) || 0;
                const d = parseFloat(row[h.indexOf("재단D")]) || 0;
                // 부속발주로 특정 부속 선택 시 → 공급처 무관 기본 발주 포함
                // 부속발주: 수량 = 1 (사용자 입력), 일반발주: 수량 = 세트별소모량 × 1

                partInfoMap[key] = {

            const displayTitle = targetPartName ? `[${targetPartName}] ${code}` : code;

        function renderConfirmedBatchList() {
            const container = document.getElementById('confirmed-product-list-container'); if (!container) return; container.innerHTML = '';
            const currentSupplier = getCurrentSupplier();
            const relevantOrders = confirmedOrders.filter(o => o.amtRegistered !== true && o.amtConfirmedCancel !== true && o.amtTimeline !== true && o.supplier === currentSupplier);
            if (relevantOrders.length === 0) { container.innerHTML = '<div class="p-8 text-center font-bold tracking-tight fluid-text-body italic text-gray-400">없음</div>'; renderRegisteredOrders(); return; }
            // 날짜(년월일) 기준으로 그룹핑
            const dateGroups = {};
            relevantOrders.forEach(order => {
                const d = new Date(parseInt(order.batchId));
                const dateKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                if (!dateGroups[dateKey]) dateGroups[dateKey] = [];
                dateGroups[dateKey].push(order);
            });
            const sortedDateKeys = Object.keys(dateGroups).sort((a, b) => b.localeCompare(a));
            sortedDateKeys.forEach(dateKey => {
                const orders = dateGroups[dateKey]; const batchCard = document.createElement('div'); batchCard.className = 'immutable-order-card space-y-4';
                const [y, m, d] = dateKey.split('-');
                const headerDateStr = `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;
                let itemsHtml = orders.map(item => {
                    const isEdited = !!item.editInfo;
                    const isEditCompleted = item.editCompleted === false;
                    const isEditApproved = item.amtApprovedEdit && !item.editCompleted;
                    const cancelStatus = item.amtConfirmedCancel ? `<span class="px-2 py-0.5 bg-gray-500 text-white rounded font-black text-[10px] uppercase ml-2">취소완료</span>` : (item.isCancelRequested ? `<span class="px-2 py-0.5 bg-red-600 text-white rounded font-black text-[10px] uppercase ml-2 animate-pulse">취소요청됨</span>` : "");
                    const editStatus = isEdited ? `<div class="text-[10px] font-bold text-blue-500 mt-1">수정됨: ${item.editInfo.time} (${item.editInfo.requester})</div>` : "";
                    const editApprovedBadge = isEditApproved && !isEditCompleted ? `<span class="px-2 py-0.5 bg-red-600 text-white rounded font-black text-[10px] uppercase ml-2 animate-pulse">수정승인됨</span>` : '';
                    const editCompletedBadge = isEditCompleted ? `<span class="px-2 py-0.5 bg-gray-400 text-white rounded font-black text-[10px] uppercase ml-2">수정완료됨</span>` : '';

                    const cardBgClass = isEditCompleted ? '' : (isEditApproved ? 'bg-red-50 animate-pulse' : (item.isCancelRequested ? 'is-cancelled' : (isEdited ? 'is-edited' : '')));
                    const editBtnDisabledAttr = item.isCancelRequested ? 'disabled' : '';
                    const editBtnOpacity = item.isCancelRequested ? 'opacity-50 cursor-not-allowed' : '';

                    const dateDisplay = item.isEditMode
                        ? `<input type="date" class="notion-input !w-32 !py-0.5 !px-1 !text-[11px] font-bold" value="${item.deliveryDate}" min="${getMinDeliveryDate()}" onchange="validateDeliveryDate(this); updateItemDate(${item.idNum}, this.value)">`
                        : `입고요청일: ${formatDeliveryDate(item.deliveryDate)}`;

                    const orderQtyDisplay = item.isEditMode
                        ? `<input type="number" min="1" value="${item.orderQty}" class="notion-input !w-16 !py-0.5 !px-1 !text-[13px] !text-center font-black" onclick="event.stopPropagation()" onchange="event.stopPropagation(); updateItemQty(${item.idNum}, this.value)"> EA`
                        : `${item.orderQty} EA`;

                    let actionButtons = "";
                    if (item.amtConfirmedCancel) {
                        actionButtons = "";
                    } else if (item.isEditMode) {
                        // 편집 모드일 때
                        actionButtons = "";
                    } else if (isEditCompleted) {
                        // 수정완료됨 - 취소요청 + 재수정요청 버튼
                        // (에이엠티 확인 절차 없이 바로 이 상태가 되므로, 다시 고칠 일이 생기면
                        //  여기서도 수정요청을 이어서 보낼 수 있어야 함)
                        actionButtons = `
                            <button onclick="requestCancelOrder('${item.docId}')" class="text-[10px] px-2 py-1 ${item.isCancelRequested ? 'bg-red-500 text-white' : 'bg-white border border-red-200 text-red-500'} rounded hover:bg-red-50 font-bold transition-all">
                                ${item.isCancelRequested ? '취소요청해제' : '취소요청'}
                            </button>
                            <button onclick="toggleEditMode('${item.docId}')" ${editBtnDisabledAttr} class="text-[10px] px-2 py-1 bg-white border border-blue-200 text-blue-500 rounded hover:bg-blue-50 font-bold ${editBtnOpacity}">수정요청</button>
                        `;
                    } else if (isEditApproved) {
                        // 수정 승인됨 - 발주수정 + 취소요청 버튼
                        actionButtons = `
                            <button onclick="requestCancelOrder('${item.docId}')" class="text-[10px] px-2 py-1 ${item.isCancelRequested ? 'bg-red-500 text-white' : 'bg-white border border-red-200 text-red-500'} rounded hover:bg-red-50 font-bold transition-all">
                                ${item.isCancelRequested ? '취소요청해제' : '취소요청'}
                            </button>
                            <button onclick="startEditingApproved('${item.docId}')" class="text-[10px] px-2 py-1 bg-blue-600 text-white rounded hover:bg-blue-700 font-bold transition-all">발주수정</button>
                        `;
                    } else if (isEdited && !item.amtApprovedEdit) {
                        // 수정요청됨 (승인 대기 중)
                        actionButtons = `<button onclick="revertEditingOrder('${item.docId}')" class="text-[10px] px-2 py-1 bg-amber-500 text-white rounded hover:bg-amber-600 font-bold transition-all">수정요청취소</button>`;
                    } else {
                        // 기본 상태
                        actionButtons = `
                            <button onclick="requestCancelOrder('${item.docId}')" class="text-[10px] px-2 py-1 ${item.isCancelRequested ? 'bg-red-500 text-white' : 'bg-white border border-red-200 text-red-500'} rounded hover:bg-red-50 font-bold transition-all">
                                ${item.isCancelRequested ? '취소요청해제' : '취소요청'}
                            </button>
                            <button onclick="toggleEditMode('${item.docId}')" ${editBtnDisabledAttr} class="text-[10px] px-2 py-1 bg-white border border-blue-200 text-blue-500 rounded hover:bg-blue-50 font-bold ${editBtnOpacity}">수정요청</button>
                        `;
                    }
                    
                    const deleteBtn = item.amtConfirmedCancel ? `<button onclick="removeIndividualConfirmedOrderLocal('${item.docId}')" class="p-1.5 text-gray-300 hover:text-red-500 transition-all"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>` : '';

                    return `
                    <div id="confirmed-item-${item.idNum}" class="flex flex-col gap-1 py-3 border-b border-[#f1f1ef] last:border-none relative group/item ${cardBgClass} ${item.isEditMode ? 'ring-2 ring-blue-400 p-4 rounded-xl' : ''}">
                        <div class="flex justify-between items-center mb-1">
                            <div class="flex items-center">
                                <span class="order-code-badge" onclick="copyID('${item.orderCode}', this)">${item.orderCode}</span>
                                ${cancelStatus}${editApprovedBadge}${editCompletedBadge}
                            </div>
                            <div class="flex items-center gap-2">
                                ${actionButtons}
                                ${deleteBtn}
                            </div>
                        </div>
                        <div class="flex justify-between items-start cursor-pointer group" onclick="toggleOrderDetails(${item.idNum})">
                            <div class="flex flex-col flex-1 mr-8">
                                <span class="font-bold text-[14px] leading-tight group-hover:text-blue-600 transition-colors">${displayNameHtml(item, 'text-[#37352f]')}</span>
                                ${editStatus}
                            </div>
                            <span class="font-black text-gray-800 text-[14px] whitespace-nowrap">${orderQtyDisplay}</span>
                        </div>
                        <div class="flex items-center gap-2 text-[11px] text-[#787774] font-medium mt-1">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="16" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>${dateDisplay}
                        </div>
                        <div id="details-container-${item.idNum}" class="${item.isEditMode ? '' : 'hidden'} flex flex-col gap-3 mt-4 pt-4 border-t border-dashed border-[#f1f1ef]">
                            <div id="details-${item.idNum}" class="flex flex-col gap-4"></div>
                            ${item.isEditMode ? `
                            <div class="flex items-center justify-between mt-4 gap-2">
                                <div class="flex items-center gap-2">
                                    <button onclick="undoEditStep(${item.idNum})" class="flex items-center gap-1 px-3 py-1.5 bg-white border border-gray-300 text-gray-600 rounded-lg font-bold text-[11px] hover:bg-gray-50 active:scale-95 transition-all shadow-sm" title="한 단계 되돌리기">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
                                        뒤로가기
                                    </button>
                                    <button onclick="resetEditToOriginal(${item.idNum})" class="flex items-center gap-1 px-3 py-1.5 bg-white border border-red-200 text-red-500 rounded-lg font-bold text-[11px] hover:bg-red-50 active:scale-95 transition-all shadow-sm" title="원주문으로 초기화">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                                        수정초기화
                                    </button>
                                </div>
                                <button onclick="finishEditingOrderFirebase('${item.docId}')" class="px-8 py-2 bg-blue-600 text-white rounded-lg font-bold text-sm shadow-md hover:bg-blue-700 active:scale-95 transition-all">수정완료</button>
                            </div>` : ''}
                        </div>
                    </div>`;
                }).join(''); 
                batchCard.innerHTML = `<div class="flex justify-between items-center mb-2"><div class="flex items-center gap-2"><span class="text-[12px] font-black text-[#37352f]">확정대기 List</span><span class="text-[11px] text-[#787774] font-bold">${headerDateStr}</span></div></div><div class="space-y-1 bg-[#fbfbfa] p-4 rounded-xl border border-[#f1f1ef]">${itemsHtml}</div>`;
                container.appendChild(batchCard);
            });
            relevantOrders.forEach(o => { if (o.isEditMode) renderOrderParts(o.idNum); });
            renderRegisteredOrders();
        }

        // 발주등록완료 리스트 렌더링 — 오더코드별 그룹, 한 테이블
        function renderRegisteredOrders() {
            const container = document.getElementById('registered-orders-list-container');
            if (!container) return;

            const currentSupplier = getCurrentSupplier();
            const registeredOrders = confirmedOrders.filter(o => o.amtTimeline === true && o.supplier === currentSupplier);

            const countBadge = document.getElementById('registered-orders-count-badge');
            if (countBadge) countBadge.textContent = registeredOrders.length > 0 ? `${registeredOrders.length}건` : '';

            if (registeredOrders.length === 0) {
                container.innerHTML = '<div class="p-8 text-center font-bold tracking-tight fluid-text-body italic text-gray-400">없음</div>';
                return;
            }

            // 오더코드 기준 그룹화, 납기일 오름차순 정렬
            const orderGroups = {};
            registeredOrders.forEach(order => {
                const key = order.orderCode ? String(order.orderCode).trim() : '미지정';
                if (!orderGroups[key]) orderGroups[key] = [];
                orderGroups[key].push(order);
            });
            // 각 그룹 내 납기일 오름차순 정렬, 그룹 자체도 첫 납기일 기준 오름차순
            const sortedGroupKeys = Object.keys(orderGroups).sort((a, b) => {
                const aDate = orderGroups[a][0].deliveryDate || '';
                const bDate = orderGroups[b][0].deliveryDate || '';
                return aDate.localeCompare(bDate);
            });

            // 목록 만들기 — 마크업 한 벌로 폰은 카드, 넓은 화면은 표가 된다
            let groupsHtml = '';
            sortedGroupKeys.forEach((orderKey) => {
                const items = orderGroups[orderKey].slice().sort((a, b) =>
                    (a.deliveryDate || '').localeCompare(b.deliveryDate || ''));

                let itemsHtml = '';
                items.forEach((item) => {
                    const delDate = item.deliveryDate
                        ? (() => { const [y,m,d] = item.deliveryDate.split('-'); return `${parseInt(m)}/${parseInt(d)}`; })()
                        : '미정';
                    const cancelBadge = item.amtConfirmedCancel
                        ? `<span class="px-1.5 py-0.5 bg-gray-400 text-white rounded font-black text-[9px]">취소</span>` : '';

                    itemsHtml += `
                        <div class="job-item" id="registered-item-${item.idNum}"
                             onclick="toggleRegisteredOrderDetails(${item.idNum})">
                            <span class="job-nm">${item.displayName} ${cancelBadge}</span>
                            <span class="job-sub">
                                <span class="job-qty">${item.orderQty} EA</span>
                                <span class="job-due">${delDate}</span>
                            </span>
                            <div id="registered-details-row-${item.idNum}" class="hidden job-more">
                                <div id="registered-details-container-${item.idNum}" class="flex flex-col gap-3 pt-3 border-t border-dashed border-[#ededeb]">
                                    <div id="registered-details-${item.idNum}" class="flex flex-col gap-4"></div>
                                </div>
                            </div>
                        </div>`;
                });

                groupsHtml += `
                    <section class="job" style="--rows:${items.length + 1}">
                        <div class="job-code">
                            <span class="order-code-badge" onclick="event.stopPropagation(); copyID('${orderKey}', this)">${orderKey}</span>
                            <span style="background:#b0aeaa;color:#fff;" class="px-1.5 py-0.5 rounded font-black text-[9px]">작업중</span>
                            <span class="job-n">${items.length}건</span>
                        </div>
                        ${itemsHtml}
                    </section>`;
            });

            container.innerHTML = `
                <div class="jobs">
                    <div class="jobs-head">
                        <span>오더코드</span><span>상품명</span><span>수량</span><span>납기</span>
                    </div>
                    ${groupsHtml}
                </div>`;
        }

        // ══════════════════════════════════════════════════════════════
        //  공정 일정 타임라인 (에이엠티와 동일 구조, 공급처 필터)
        // ══════════════════════════════════════════════════════════════

        function toLocalDateStr(d) {
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function parseDateCard(dateStr) {
            if (!dateStr) return null;
            const d = new Date(dateStr + 'T00:00:00');
            if (isNaN(d)) return null;
            const weekdays = ['일','월','화','수','목','금','토'];
            return { dateStr, month:d.getMonth()+1, day:d.getDate(),
                     weekday:weekdays[d.getDay()], isSat:d.getDay()===6, isSun:d.getDay()===0 };
        }

        function renderProcessTimeline() {
            const sup = getCurrentSupplier();
            const items = confirmedOrders.filter(o => o.amtTimeline === true && o.supplier === sup && !o.amtConfirmedCancel);
            const section = document.getElementById('order-timeline-section');
            if (section) section.style.display = (items.length > 0 && _currentPageTab === '작업중') ? 'block' : 'none';
            if (_currentPageTab !== '작업중') return;
            // 박스 판에서 이 구역을 감췄으면 그리지 않는다 — 안 보이는 채로
            // TL.init() 이 돌면 폭이 0 으로 잡혀 타임라인 자리가 어긋난다.
            if (typeof johonBoxShows === 'function' && !johonBoxShows('order-timeline-section')) return;
            if (TL.renderedDates.length === 0) {
                TL.init();
            } else {
                TL.refreshCards();
            }
        }

        function setTimelineFilter(process) {
            if (process === 'all') {
                timelineProcessFilter.clear();
            } else {
                timelineProcessFilter.has(process) ? timelineProcessFilter.delete(process) : timelineProcessFilter.add(process);
            }
            const isAll = timelineProcessFilter.size === 0;
            document.getElementById('tl-filter-all').classList.toggle('active', isAll);
            ['재단','NC','엣지','보링'].forEach(p => {
                const btn = document.getElementById(`tl-filter-${p}`);
                if (btn) btn.classList.toggle('active', timelineProcessFilter.has(p));
            });
            renderProcessTimeline();
        }

        function tlScrollToToday() {
            const today = toLocalDateStr(new Date());
            if (!TL.renderedDates.includes(today)) {
                TL.centerDate = today;
                TL.renderedDates = [];
                document.getElementById('process-timeline-container').innerHTML = '';
                TL.offset = 0;
                TL._buildRange();
            }
            TL._scrollToDate(today, true);
        }

        const TL = {
            CARD_W: 165, GAP: 12, BUFFER: 30,
            offset: 0, dragging: false, startX: 0, lastX: 0, velX: 0, rafId: null,
            centerDate: null, renderedDates: [],

            get cellW() { return this.CARD_W + this.GAP; },

            _getPendingOrders() {
                const sup = getCurrentSupplier();
                return confirmedOrders.filter(o => o.amtTimeline === true && o.amtRegistered !== true && o.supplier === sup && !o.amtConfirmedCancel);
            },

            init() {
                const wrap  = document.getElementById('tl-infinite-wrap');
                const track = document.getElementById('tl-infinite-track');
                if (!wrap || !track) return;
                const today = toLocalDateStr(new Date());
                const upcoming = this._getPendingOrders().map(o => o.deliveryDate).filter(d => d && d >= today).sort();
                this.centerDate    = upcoming[0] || today;
                this.offset        = 0;
                this.renderedDates = [];
                this._buildRange();
                this._applyTransform(false);
                this._scrollToDate(this.centerDate, false);
                if (!tlDragInitialized) {
                    this._initDrag(wrap);
                    tlDragInitialized = true;
                }
                this._fillDeliverySections();
                this._fillProcessSections();
                this._fillPartSections();
            },

            _dateOffset(dateStr, days) {
                const d = new Date(dateStr + 'T00:00:00');
                d.setDate(d.getDate() + days);
                return toLocalDateStr(d);
            },

            _toValidDate(dateStr) {
                const day = new Date(dateStr + 'T00:00:00').getDay();
                // 에이엠티와 같은 방향으로 민다. 뒤로(금요일) 밀면 토요일로 다시 붙잡혀

                // 공정 섹션이 없는 날에 배치되어 카드가 사라진다.

                if (day === 6) return this._dateOffset(dateStr, 2); // 토 → 월
                if (day === 0) return this._dateOffset(dateStr, 1); // 일 → 월
                return dateStr;
            },

            _buildRange() {
                const container = document.getElementById('process-timeline-container');
                if (!container) return;
                const start = this._dateOffset(this.centerDate, -this.BUFFER);
                const end   = this._dateOffset(this.centerDate,  this.BUFFER);
                let d = start;
                const toAdd = [];
                while (d <= end) {
                    if (!this.renderedDates.includes(d)) toAdd.push(d);
                    d = this._dateOffset(d, 1);
                }
                if (toAdd.length === 0) return;
                const before = toAdd.filter(d => !this.renderedDates.length || d < this.renderedDates[0]);
                const after  = toAdd.filter(d => !this.renderedDates.length || d > this.renderedDates[this.renderedDates.length-1]);
                before.reverse().forEach(dateStr => {
                    const el = this._makeCard(dateStr);
                    container.insertBefore(el, container.firstChild);
                    this.renderedDates.unshift(dateStr);
                    this.offset -= this.cellW;
                });
                after.forEach(dateStr => {
                    const el = this._makeCard(dateStr);
                    container.appendChild(el);
                    this.renderedDates.push(dateStr);
                });
                this._applyTransform(false);
            },

            _makeCard(dateStr) {
                const div = document.createElement('div');
                div.dataset.tlDate = dateStr;
                div.style.cssText = `min-width:${this.CARD_W}px;max-width:${this.CARD_W}px;flex-shrink:0;`;
                div.innerHTML = this._renderEmptyCard(dateStr);
                return div;
            },

            _renderEmptyCard(dateStr) {
                const info = parseDateCard(dateStr);
                if (!info) return '';
                const today   = toLocalDateStr(new Date());
                const isToday = dateStr === today;
                const wColor  = info.isSun ? 'text-red-400' : 'text-[#787774]';

                if (info.isSat || info.isSun) {
                    const bColor = info.isSat ? 'border-[#ededeb]' : 'border-red-100';
                    return `<div class="flex flex-col rounded-xl border ${bColor} bg-white shadow-sm overflow-hidden h-full" data-card-date="${dateStr}">
                        <div class="px-3 pt-3 pb-2 flex flex-col items-center" style="opacity:0.45;">
                            <span class="text-[10px] font-bold text-[#c8c6c2]">${info.month}월</span>
                            <span class="text-[32px] font-black leading-none text-[#d0ceca]">${info.day}</span>
                            <span class="text-[12px] font-black ${wColor} mt-0.5">${info.weekday}요일</span>
                        </div>
                    </div>`;
                }

                const borderCls = isToday ? 'tl-card-today border-[#ededeb]' : 'border-[#ededeb]';
                const makeSection = (label, hdrCls, lblCls, procKey) =>
                    `<div class="border-t border-[#f1f1ef]">
                        <div class="px-2 py-0.5 ${hdrCls} flex items-center justify-between gap-1">
                            <span class="text-[8px] font-black ${lblCls} uppercase tracking-wider">${label}</span>
                            <span class="tl-proc-stat" data-date="${dateStr}" data-process="${procKey}" style="display:none;font-size:8px;font-weight:800;color:#fff;background:rgba(0,0,0,.18);padding:0 4px;border-radius:3px;white-space:nowrap;"></span>
                        </div>
                        <div class="tl-process-section px-1 py-1" data-date="${dateStr}" data-process="${procKey}"></div>
                    </div>`;
                const deliverySection =
                    `<div class="border-t border-[#f1f1ef]">
                        <div class="px-2 py-0.5 tl-proc-header-납기 flex items-center justify-between gap-1">
                            <span class="text-[8px] font-black tl-proc-label-납기 uppercase tracking-wider">납기</span>
                            <span class="tl-delivery-count" data-date="${dateStr}" style="font-size:8px;font-weight:800;color:#fff;background:rgba(0,0,0,.18);padding:0 4px;border-radius:3px;display:none;"></span>
                        </div>
                        <div class="tl-process-section px-1 py-1" data-date="${dateStr}" data-process="납기"></div>
                    </div>`;

                return `<div class="flex flex-col rounded-xl border ${borderCls} bg-white shadow-sm overflow-hidden h-full" style="transition:opacity .25s,transform .25s;" data-card-date="${dateStr}">
                    <div class="px-3 pt-3 pb-2 flex flex-col items-center">
                        <span class="text-[10px] font-bold text-[#b0aeaa]">${info.month}월</span>
                        <span class="text-[32px] font-black leading-none ${isToday ? 'text-[#787774]' : 'text-[#37352f]'}">${info.day}</span>
                        <span class="text-[12px] font-black text-[#787774] mt-0.5">${info.weekday}요일</span>
                        <span class="tl-today-badge" style="visibility:${isToday ? 'visible' : 'hidden'};">TODAY</span>
                    </div>
                    ${deliverySection}
                    ${makeSection('보링','tl-proc-header-보링','tl-proc-label-보링','보링')}
                    ${makeSection('엣지','tl-proc-header-엣지','tl-proc-label-엣지','엣지')}
                    ${makeSection('NC',  'tl-proc-header-NC',  'tl-proc-label-NC',  'NC')}
                    ${makeSection('재단','tl-proc-header-재단','tl-proc-label-재단','재단')}
                </div>`;
            },

            refreshCards() {
                const container = document.getElementById('process-timeline-container');
                if (!container) return;
                container.querySelectorAll('[data-tl-date]').forEach(div => {
                    div.innerHTML = this._renderEmptyCard(div.dataset.tlDate);
                });
                this._fillDeliverySections();
                this._fillProcessSections();
                this._fillPartSections();
            },

            _fillDeliverySections() {
                const PROC = [
                    { key:'재단', color:'#90BBC6' }, { key:'NC', color:'#FF9C75' },
                    { key:'엣지', color:'#17C3B2' }, { key:'보링', color:'#227C9D' },
                ];
                const h = currentFullData[0];
                const byDate = {};
                this._getPendingOrders().forEach(item => {
                    const d = item.deliveryDate; if (!d) return;
                    if (!byDate[d]) byDate[d] = [];
                    byDate[d].push(item);
                });
                Object.entries(byDate).forEach(([dateStr, items]) => {
                    const section = document.querySelector(`.tl-process-section[data-date="${dateStr}"][data-process="납기"]`);
                    if (!section) return;
                    const countBadge = document.querySelector(`.tl-delivery-count[data-date="${dateStr}"]`);
                    if (countBadge) { countBadge.textContent = items.length; countBadge.style.display = 'inline'; }
                    section.innerHTML = items.map(item => {
                        let partsHtml = '';
                        let totalMin = 0;
                        if (h && currentFullData.length >= 2) {
                            const matchingRows = currentFullData.slice(1).filter(r =>
                                r && normalizeValue(r[h.indexOf("ing발주처")]) === item.supplier &&
                                IDENTITY_HEADERS.every((col, i) => normalizeValue(r[h.indexOf(col)]) === item.criteria[i])
                            );
                            matchingRows.forEach(row => {
                                const cardKey = `card-${item.idNum}-${currentFullData.indexOf(row)}`;
                                const pData   = item.partInfoMap ? item.partInfoMap[cardKey] : null;
                                if (!pData || pData.isDeleted) return;
                                if (normalizeValue(row[h.indexOf("공급처")]) !== "AMT") return;
                                const unitCons  = parseFloat(row[h.indexOf("세트별소모량")]) || 1;
                                const partQty   = pData.qty || (unitCons * (item.orderQty || 1));
                                const partT     = calcProcessTime(row, partQty, (pData && pData.difficulties) || {}, h);
                                const partTotal = PROC.reduce((s, p) => s + (partT[p.key] ?? 0), 0);
                                totalMin += partTotal;
                                const partName  = row[h.indexOf("부속명")] || '-';
                                const totalQty  = Math.round(unitCons * (item.orderQty || 1));
                                const partSpots = PROC.filter(p => (partT[p.key] ?? 0) > 0)
                                    .map(p => `<span class="tl-spot-wrap"><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:${p.color};"></span><span class="tl-spot-tip">${p.key}</span></span>`).join('');
                                const _dlvBatches  = item.partMoveLog?.[cardKey] || [];
                                const _dlvOD       = item.deliveryDate;
                                const _dlvMoved    = _dlvBatches.filter(b => b['납기'] && b['납기'] !== _dlvOD).map(b => ({ date: b['납기'], qty: b.qty }));
                                const _dlvMovedQty = _dlvMoved.reduce((s, e) => s + (e.qty || 0), 0);
                                const _dlvRemain   = totalQty - _dlvMovedQty;
                                const _dlvIsMoved  = _dlvMovedQty > 0;
                                const _dlvMovedLabel = _dlvIsMoved
                                    ? `<span style="font-size:7px;font-weight:800;color:#b0aeaa;white-space:nowrap;flex-shrink:0;">→${_dlvMoved.map(e=>`${e.date.slice(5)}(${e.qty}EA)`).join(' ')}</span>`
                                    : '';
                                const _dlvDisplayQty = _dlvIsMoved ? Math.max(0, _dlvRemain) : totalQty;
                                const _dlvOpacity    = (_dlvIsMoved && _dlvRemain <= 0) ? '0.35' : '1';
                                partsHtml += `<div style="display:flex;align-items:center;gap:4px;padding:2px 0;border-bottom:1px solid #ededeb;opacity:${_dlvOpacity};">
                                    <span style="flex:1;font-size:8px;font-weight:700;color:#37352f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${partName}</span>
                                    ${_dlvMovedLabel}
                                    <span style="display:flex;gap:2px;align-items:center;flex-shrink:0;">${partSpots}</span>
                                    <span style="font-size:8px;font-weight:800;color:#37352f;white-space:nowrap;flex-shrink:0;background:#ededeb;padding:0 3px;border-radius:3px;">${_dlvDisplayQty}EA</span>
                                </div>`;
                            });
                        }
                        return `<div class="tl-delivery-item" onclick="tlJHToggleParts(this)">
                            <div style="display:flex;align-items:center;gap:3px;cursor:pointer;">
                                <span class="tl-arrow" style="font-size:9px;color:#787774;flex-shrink:0;padding:0 2px;">▶</span>
                                <span style="flex:1;font-size:9px;font-weight:700;color:#37352f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.displayName}</span>
                                <span style="font-size:8px;font-weight:800;color:#37352f;white-space:nowrap;flex-shrink:0;">${item.orderQty}EA</span>
                            </div>
                            <div class="tl-delivery-parts">
                                <div style="padding:4px 8px;">
                                    ${partsHtml || '<span style="font-size:8px;color:#b0aeaa;padding:2px 0;display:block;">부속 없음</span>'}
                                </div>
                            </div>
                        </div>`;
                    }).join('');
                });
            },

            _fillProcessSections() {
                const PROC_DEF = [
                    { key:'보링', offset:1, color:'#227C9D' },
                    { key:'엣지', offset:2, color:'#17C3B2' },
                    { key:'NC',   offset:2, color:'#FF9C75' },
                    { key:'재단', offset:3, color:'#90BBC6' },
                ];
                const h = currentFullData[0];
                const byProc = {};
                PROC_DEF.forEach(p => { byProc[p.key] = {}; });

                // 해당 공정이 포함된 부속이 실제로 있는지 확인 — 없으면 그 공정 섹션에
                // 아예 배치하지 않음 (에이엠티엔 없는 공정에 조혼가구 쪽만 기본 배치되던 문제 수정)
                const hasProcInItem = (item, procKey) => {
                    if (!h || currentFullData.length < 2) return false;
                    const matchingRows = currentFullData.slice(1).filter(r =>
                        r && normalizeValue(r[h.indexOf("ing발주처")]) === item.supplier &&
                        IDENTITY_HEADERS.every((col, i) => normalizeValue(r[h.indexOf(col)]) === item.criteria[i])
                    );
                    for (const row of matchingRows) {
                        if (normalizeValue(row[h.indexOf("공급처")]) !== "AMT") continue;
                        const unitCons = parseFloat(row[h.indexOf("세트별소모량")]) || 1;
                        const partT = calcProcessTime(row, unitCons * (item.orderQty || 1), {}, h);
                        if ((partT[procKey] ?? 0) > 0) return true;
                    }
                    return false;
                };

                this._getPendingOrders().forEach(item => {
                    const d = item.deliveryDate; if (!d) return;
                    const po = item.procOverrides || {};
                    PROC_DEF.forEach(proc => {
                        if (!hasProcInItem(item, proc.key)) return;
                        const td = po[proc.key] || this._toValidDate(this._dateOffset(d, -proc.offset));
                        if (!byProc[proc.key][td]) byProc[proc.key][td] = [];
                        byProc[proc.key][td].push(item);
                    });
                });
                PROC_DEF.forEach(proc => {
                    Object.entries(byProc[proc.key]).forEach(([targetDate, items]) => {
                        const section = document.querySelector(`.tl-process-section[data-date="${targetDate}"][data-process="${proc.key}"]`);
                        if (!section) return;
                        let sectionTotalMin = 0;
                        section.innerHTML = items.map(item => {
                            let itemPartTotal = 0;
                            let partsHtml = '';
                            if (h && currentFullData.length >= 2) {
                                const matchingRows = currentFullData.slice(1).filter(r =>
                                    r && normalizeValue(r[h.indexOf("ing발주처")]) === item.supplier &&
                                    IDENTITY_HEADERS.every((col, i) => normalizeValue(r[h.indexOf(col)]) === item.criteria[i])
                                );
                                matchingRows.forEach(row => {
                                    const cardKey     = `card-${item.idNum}-${currentFullData.indexOf(row)}`;
                                    const pData       = item.partInfoMap ? item.partInfoMap[cardKey] : null;
                                    // 거래처가 지운 부속은 공정에도 올리지 않는다 (납기 섹션과 같은 규칙)
                                    if (!pData || pData.isDeleted) return;
                                    if (normalizeValue(row[h.indexOf("공급처")]) !== "AMT") return;
                                    const unitCons    = parseFloat(row[h.indexOf("세트별소모량")]) || 1;
                                    const partQty     = pData.qty || (unitCons * (item.orderQty || 1));
                                    const partT       = calcProcessTime(row, partQty, (pData && pData.difficulties) || {}, h);
                                    const partProcMin = partT[proc.key] ?? 0;
                                    if (partProcMin <= 0) return;
                                    const partName  = row[h.indexOf("부속명")] || '-';
                                    const totalQty  = Math.round(unitCons * (item.orderQty || 1));
                                    const _batches      = item.partMoveLog?.[cardKey] || [];
                                    const _procOD       = item.procOverrides?.[proc.key] || this._toValidDate(this._dateOffset(item.deliveryDate, -proc.offset));
                                    const _movedQtySum  = _batches.reduce((s, b) => s + (b[proc.key] && b[proc.key] !== _procOD ? b.qty : 0), 0);
                                    const _remainQty    = totalQty - _movedQtySum;
                                    itemPartTotal += totalQty > 0 ? partProcMin * Math.max(0, _remainQty) / totalQty : partProcMin;
                                    const _isMoved      = _movedQtySum > 0;
                                    const _movedEntries = _batches.filter(b => b[proc.key] && b[proc.key] !== _procOD).map(b => ({ date: b[proc.key], qty: b.qty }));
                                    const _movedLabel   = _isMoved
                                        ? `<span style="font-size:7px;font-weight:800;color:#b0aeaa;white-space:nowrap;flex-shrink:0;">→${_movedEntries.map(e=>`${e.date.slice(5)}(${e.qty}EA)`).join(' ')}</span>`
                                        : '';
                                    const _displayQty   = _isMoved ? Math.max(0, _remainQty) : totalQty;
                                    const _rowOpacity   = (_isMoved && _remainQty <= 0) ? '0.35' : '1';
                                    const partSpot = `<span class="tl-spot-wrap"><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:${proc.color};"></span><span class="tl-spot-tip">${proc.key}</span></span>`;
                                    partsHtml += `<div style="display:flex;align-items:center;gap:4px;padding:2px 0;border-bottom:1px solid #ededeb;opacity:${_rowOpacity};">
                                        <span style="flex:1;font-size:8px;font-weight:700;color:#37352f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${partName}</span>
                                        ${_movedLabel}
                                        <span style="display:flex;gap:2px;align-items:center;flex-shrink:0;">${partSpot}</span>
                                        <span style="font-size:8px;font-weight:800;color:#37352f;white-space:nowrap;flex-shrink:0;background:#ededeb;padding:0 3px;border-radius:3px;">${_displayQty}EA</span>
                                    </div>`;
                                });
                            }
                            const procMin = itemPartTotal;
                            const spot    = procMin > 0 ? `<span class="tl-spot-wrap"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${proc.color};"></span><span class="tl-spot-tip">${proc.key}</span></span>` : '';
                            sectionTotalMin += procMin;
                            return `<div class="tl-delivery-item" onclick="tlJHToggleParts(this)">
                                <div style="display:flex;align-items:center;gap:3px;cursor:pointer;">
                                    <span class="tl-arrow" style="font-size:9px;color:#787774;flex-shrink:0;padding:0 2px;">▶</span>
                                    <span style="flex:1;font-size:9px;font-weight:700;color:#37352f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.displayName}</span>
                                    <span style="display:flex;gap:2px;align-items:center;flex-shrink:0;">${spot}</span>
                                </div>
                                <div class="tl-delivery-parts">
                                    <div style="padding:4px 8px;">
                                        ${partsHtml || '<span style="font-size:8px;color:#b0aeaa;padding:2px 0;display:block;">부속 없음</span>'}
                                    </div>
                                </div>
                            </div>`;
                        }).join('');
                        const statBadge = document.querySelector(`.tl-proc-stat[data-date="${targetDate}"][data-process="${proc.key}"]`);
                        if (statBadge) { statBadge.textContent = `${items.length}건`; statBadge.style.display = 'inline'; }
                    });
                });
            },

            _fillPartSections() {
                const PROC_DEF = ['보링','엣지','NC','재단','납기'];
                const PROC_COLORS = { 보링:'#227C9D', 엣지:'#17C3B2', NC:'#FF9C75', 재단:'#90BBC6', 납기:'#b0aeaa' };
                const h = currentFullData[0];
                document.querySelectorAll('.tl-delivery-item[data-partcard="1"]').forEach(el => el.remove());
                this._getPendingOrders().forEach(item => {
                    if (!item.partMoveLog) return;
                    Object.entries(item.partMoveLog).forEach(([cardKey, batches]) => {
                        if (!h || currentFullData.length < 2) return;
                        const grouped = {};
                        batches.forEach(batch => {
                            PROC_DEF.forEach(procKey => {
                                const batchDate = batch[procKey];
                                if (!batchDate) return;
                                const orderDate = procKey === '납기' ? item.deliveryDate : item.procOverrides?.[procKey];
                                if (batchDate === orderDate) return;
                                const gKey = `${procKey}|${batchDate}`;
                                grouped[gKey] = (grouped[gKey] || 0) + (batch.qty || 0);
                            });
                        });
                        Object.entries(grouped).forEach(([gKey, movedQty]) => {
                            const [procKey, batchDate] = gKey.split('|');
                            const section = document.querySelector(`.tl-process-section[data-date="${batchDate}"][data-process="${procKey}"]`);
                            if (!section) return;
                            const rowIdx = parseInt(cardKey.split('-')[2]);
                            const row = currentFullData[rowIdx];
                            const partName = row ? (row[h.indexOf("부속명")] || '-') : cardKey;
                            const unitCons = row ? (parseFloat(row[h.indexOf("세트별소모량")]) || 1) : 1;
                            const totalQty = Math.round(unitCons * (item.orderQty || 1));
                            const partT = row ? calcProcessTime(row, totalQty, {}, h) : {};
                            const procMin = partT[procKey] ?? 0;
                            const scaledMin = (procMin > 0 && totalQty > 0) ? procMin * movedQty / totalQty : 0;
                            const spot = procMin > 0
                                ? `<span class="tl-spot-wrap"><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:${PROC_COLORS[procKey]};"></span><span class="tl-spot-tip">${procKey}</span></span>`
                                : '';
                            const el = document.createElement('div');
                            el.className = 'tl-delivery-item';
                            el.dataset.partcard = '1';
                            el.innerHTML = `<div style="display:flex;align-items:center;gap:3px;">
                                <span style="flex:1;font-size:9px;font-weight:700;color:#37352f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><span style="color:#787774;font-size:8px;">[${partName}]</span> ${item.displayName}</span>
                                ${spot}
                                <span style="font-size:8px;font-weight:800;color:#37352f;white-space:nowrap;flex-shrink:0;background:#ededeb;padding:0 3px;border-radius:3px;">${movedQty}EA</span>
                            </div>`;
                            section.appendChild(el);
                        });
                    });
                });
            },

            _applyTransform(animate) {
                const track = document.getElementById('tl-infinite-track');
                if (!track) return;
                if (animate) { track.classList.add('momentum'); setTimeout(() => track.classList.remove('momentum'), 500); }
                else { track.classList.remove('momentum'); }
                track.style.transform = `translateX(${this.offset}px)`;
            },

            _scrollToDate(dateStr, animate) {
                const idx = this.renderedDates.indexOf(dateStr);
                if (idx < 0) return;
                const wrap = document.getElementById('tl-infinite-wrap');
                if (!wrap) return;
                const wrapW = wrap.offsetWidth;
                const cardCenter = 16 + idx * this.cellW + this.CARD_W / 2;
                this.offset = wrapW / 2 - cardCenter;
                this._applyTransform(animate);
            },

            _initDrag(wrap) {
                const onDown = e => {
                    if (e.target.closest('button,input')) return;
                    this.dragging = true;
                    this.startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
                    this.lastX  = this.startX; this.velX = 0;
                    wrap.classList.add('grabbing');
                    if (this.rafId) cancelAnimationFrame(this.rafId);
                };
                const onMove = e => {
                    if (!this.dragging) return;
                    const x = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                    const dx = x - this.lastX;
                    this.velX = dx; this.lastX = x;
                    this.offset += dx;
                    this._applyTransform(false);
                    this._checkEdges();
                };
                const onUp = () => {
                    if (!this.dragging) return;
                    this.dragging = false;
                    wrap.classList.remove('grabbing');
                    this._startMomentum();
                };
                wrap.addEventListener('mousedown',  onDown);
                wrap.addEventListener('touchstart', onDown, { passive:true });
                window.addEventListener('mousemove', onMove);
                window.addEventListener('touchmove', onMove, { passive:true });
                window.addEventListener('mouseup',   onUp);
                window.addEventListener('touchend',  onUp);
            },

            _startMomentum() {
                let vel = this.velX * 3;
                const step = () => {
                    if (Math.abs(vel) < 0.5) return;
                    vel *= 0.85;
                    this.offset += vel;
                    this._applyTransform(false);
                    this._checkEdges();
                    this.rafId = requestAnimationFrame(step);
                };
                this.rafId = requestAnimationFrame(step);
            },

            _checkEdges() {
                const wrap = document.getElementById('tl-infinite-wrap');
                if (!wrap) return;
                const wrapW = wrap.offsetWidth;
                const leftEdge  = this.offset + 16;
                const rightEdge = this.offset + 16 + this.renderedDates.length * this.cellW;
                if (leftEdge > -this.cellW * 5) {
                    this.centerDate = this._dateOffset(this.renderedDates[0], -this.BUFFER / 2);
                    this._buildRange(); this._fillDeliverySections(); this._fillProcessSections();
                }
                if (rightEdge < wrapW + this.cellW * 5) {
                    this.centerDate = this._dateOffset(this.renderedDates[this.renderedDates.length-1], this.BUFFER / 2);
                    this._buildRange(); this._fillDeliverySections(); this._fillProcessSections();
                }
            },
        };
        // ══ /공정 일정 타임라인 ══════════════════════════════════════════

        async function requestCancelOrder(docId) {
            const item = confirmedOrders.find(o => o.docId === docId);
            if (item) {
                if (item.isEditMode) {
                    showToastMessage("수정 모드 — 취소 불가");
                    return;
                }
                const { doc, updateDoc } = window.fbFirestore;
                try {
                    const docRef = doc(window.db, 'artifacts', appId, 'public', 'data', COLLECTION_ORDERS, docId);
                    await updateDoc(docRef, { isCancelRequested: !item.isCancelRequested });
                    showToastMessage(item.isCancelRequested ? "취소 요청 해제됨" : "상품 발주 취소 요청됨");
                } catch (err) { console.error("Cancel Update Fail:", err); }
            }
        }

        // 수정요청 (에이엠티 승인 대기)
        async function toggleEditMode(docId) {
            const item = confirmedOrders.find(o => o.docId === docId);
            if (item) {
                if (item.isCancelRequested) return;
                const { doc, updateDoc } = window.fbFirestore;
                try {
                    const docRef = doc(window.db, 'artifacts', appId, 'public', 'data', COLLECTION_ORDERS, docId);
                    const now = new Date();
                    await updateDoc(docRef, {
                        editInfo: {
                            time: now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                            requester: '조혼가구(수정요청)'
                        },
                        // 수정완료된 발주를 다시 수정요청하는 경우도 완전히 새 요청과 동일하게 취급 —
                        // 이전 승인 이력을 이어받지 않고 처음부터 다시 에이엠티 승인을 받아야 함
                        editCompleted: null,
                        amtApprovedEdit: false,
                        backup: JSON.parse(JSON.stringify({
                            partInfoMap: item.partInfoMap,
                            orderQty: item.orderQty,
                            deliveryDate: item.deliveryDate
                        }))
                    });
                    showToastMessage("수정 요청 보냄 · 승인 대기");
                } catch (err) { console.error("Edit Request Fail:", err); }
            }
        }

        // 발주수정 버튼 (승인 후 편집 모드 진입)
        async function startEditingApproved(docId) {

        async function finishEditingOrderFirebase(docId) {
            const item = confirmedOrders.find(o => o.docId === docId);
            if (item) {
                const now = new Date();
                const { doc, updateDoc } = window.fbFirestore;
                try {
                    const docRef = doc(window.db, 'artifacts', appId, 'public', 'data', COLLECTION_ORDERS, docId);
                    await updateDoc(docRef, {
                        editInfo: {
                            time: now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),

            if (!editHistoryMap[idNum]) editHistoryMap[idNum] = [];
            // 화면 값 옆에 '수정중 지키기' 초안 한 칸도 같이 담는다.
            // 안 담으면 되돌린 것을 그 초안이 곧바로 도로 덮는다 — 「뒤로가기」가
            // 알림만 뜨고 부속이 안 돌아왔다(지시 09-13 19:42).
            // 칸 전체를 놓아 버리면 앞서 해 두신 수량·날짜 손댐까지 보호가 풀린다.
            // 그래서 그 단계 직전의 초안 모습을 통째로 담아 둔다.
            let 초안칸;
            try { 초안칸 = item.docId ? johonDraftRead()[item.docId] : undefined; } catch (e) {}
            editHistoryMap[idNum].push(JSON.parse(JSON.stringify({
                partInfoMap: item.partInfoMap,
                orderQty: item.orderQty,
                deliveryDate: item.deliveryDate,
                draft: 초안칸 === undefined ? null : 초안칸,

            })));

        // 뒤로가기: 히스토리 스택에서 한 단계 복원
        function undoEditStep(idNum) {
            const history = editHistoryMap[idNum];
            if (!history || history.length === 0) { showToastMessage("되돌릴 것 없음"); return; }
            const prev = history.pop();
            const item = confirmedOrders.find(o => o.idNum === idNum);
            if (!item) return;
            item.partInfoMap = JSON.parse(JSON.stringify(prev.partInfoMap));
            item.orderQty = prev.orderQty;
            item.deliveryDate = prev.deliveryDate;
            // 담아 둔 초안 칸을 그대로 도로 써 넣는다 — 그리기 전에 해야 한다.
            // renderConfirmedBatchList 가 johonDraftApply 를 먼저 돌리기 때문이다.
            // 그 단계 직전 모습으로 돌아가므로 되돌린 것은 다시 안 덮이고,
            // 앞서 해 두신 손댐은 그 초안 안에 그대로 남아 지켜진다.
            try {
                if (item.docId) {
                    const d = johonDraftRead();
                    if (prev.hadDraft && prev.draft) d[item.docId] = JSON.parse(JSON.stringify(prev.draft));
                    else delete d[item.docId];
                    johonDraftWrite(d);
                }
            } catch (e) {}
            renderConfirmedBatchList();
            showToastMessage("한 단계 되돌림");
        }
