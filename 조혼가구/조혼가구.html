        // ── 부속수량 최종 확정: 발주 확정 전에 부속카드 수량 정확히 계산
        function finalizePendingOrdersBeforeConfirm() {
            const currentPending = pendingOrdersMap[appMode];
            if (!currentPending || currentPending.length === 0) return;

            currentPending.forEach(item => {
                // 각 부속의 수량을 최종 계산
                for (let key in item.partInfoMap) {
                    const pData = item.partInfoMap[key];

                    // isManual이면 사용자가 직접 수정한 것 → 그대로 유지
                    if (pData.isManual) continue;

                    // 부속발주인지 확인
                    if (item.targetPartName) {
                        // 부속발주: 수량 = 사용자가 발주상품목록에 입력한 수량
                        pData.qty = item.orderQty;
                    } else {
                        // 일반발주: 수량 = 세트별소모량 × 발주수량
                        pData.qty = pData.unitCons * item.orderQty;
                    }
                }
            });
        }

        async function confirmProductOrderBatch() {
            const currentPending = pendingOrdersMap[appMode]; if (!currentPending || currentPending.length === 0) return;

            // 📌 발주 확정 전: 부속수량 최종 확정
            finalizePendingOrdersBeforeConfirm();

            const btn = document.getElementById('test-confirm-btn');
            const btnText = document.getElementById('confirm-btn-text');
            const originalClass = btn.className;

            btn.disabled = true;
            btnText.textContent = "전송중...";
            btn.className = originalClass + " opacity-50 cursor-not-allowed";

            const now = new Date(); const batchId = now.getTime();
            const yyyy = now.getFullYear(), mm = String(now.getMonth() + 1).padStart(2, '0'), dd = String(now.getDate()).padStart(2, '0');
            const dateStr = `${yyyy}${mm}${dd}`;

            // ing발주처(appMode 키) → 오더코드 축약어 매핑
            const supplierPrefixMap = { '조혼가구': '조혼', '아인가구': '아인', 'ing': '본사', '럭스디자인': '럭스', '유한가구': '유한' };
            const supplierPrefix = supplierPrefixMap[appMode] || appMode;

            // Get last seq from local confirmedOrders (synced with Firebase)
            // prefix-YYYYMMDD-seq 형식에서 현재 발주처(supplierPrefix)의 seq만 계산
            // 각 ing발주처별로 독립적인 순차 부여 (예: 럭스-20260219-01, 조혼-20260219-01 동시 가능)
            let lastSeq = 0;
            confirmedOrders.forEach(o => {
                if (o.orderCode && o.orderCode.startsWith(`${supplierPrefix}-`)) {
                    const parts = o.orderCode.split('-');
                    // 마지막에서 두 번째 파트가 dateStr(8자리)이면 마지막 파트가 seq
                    const datePartIndex = parts.findIndex(p => p === dateStr);
                    if (datePartIndex !== -1 && datePartIndex === parts.length - 2) {
                        const seq = parseInt(parts[parts.length - 1]);
                        if (!isNaN(seq) && seq > lastSeq) lastSeq = seq;
                    }
                }
            });

            const { collection, addDoc, serverTimestamp } = window.fbFirestore;
            const ordersRef = collection(window.db, 'artifacts', appId, 'public', 'data', COLLECTION_ORDERS);

            let successCount = 0;
            try {
                for(let i=0; i < currentPending.length; i++) {
                    const item = currentPending[i];
                    const sequence = String(lastSeq + i + 1).padStart(2, '0');
                    const confirmedItem = JSON.parse(JSON.stringify(item));
                    confirmedItem.orderCode = `${supplierPrefix}-${dateStr}-${sequence}`;
                    confirmedItem.batchId = batchId;
                    confirmedItem.createdAt = serverTimestamp();
                    confirmedItem.is_test_data = true; // For bulk deletion

                    await addDoc(ordersRef, confirmedItem);
                    successCount++;
                }

                btnText.textContent = "전송완료";
                btn.className = originalClass + " bg-green-600";
                showToastMessage(`발주 ${successCount}건 확정`);
                pendingOrdersMap[appMode] = []; 
                renderID0508();
            } catch (err) {
                console.error("Firebase Save Error:", err);
                btnText.textContent = "전송실패(재시도)";
                btn.className = originalClass + " bg-red-600";
                showToastMessage("전송 실패 · 연결 확인");
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btnText.textContent = "발주확정";
                    btn.className = originalClass;
                }, 3000);
            }
        }

                // ⚠ 미확정을 먼저 뒤진다. 예전에는 확정 목록을 먼저 뒤졌다 —
                // idNum 은 거래처마다 1401 부터 새로 세므로 남의 확정 발주와 겹친다.
                // 그래서 ✕ 를 눌러도 표가 남의 확정 발주에 찍히고, 화면은
                // renderOrderParts 가 미확정을 그리므로 아무 일도 안 일어났다
                // (지시 09-13 09:50 · 세 번째 말씀). 그리는 쪽과 같은 순서로 맞춘다.
                const item = pendingOrdersMap[appMode].find(d => d.idNum === idNum) || confirmedOrders.find(d => d.idNum === idNum);
                if (item && item.partInfoMap[cardKey]) {
                    pushEditHistory(idNum); // 변경 전 상태 저장
                    item.partInfoMap[cardKey].qty = newQty; item.partInfoMap[cardKey].isManual = true;
                }
                input.disabled = true; btn.textContent = "수정"; btn.classList.replace('text-blue-600', 'text-[#787774]');
            }
        }

        function deleteSubPart(idNum, cardKey) {
            // ⚠ 미확정을 먼저 뒤진다. 예전에는 확정 목록을 먼저 뒤졌다 —
                // idNum 은 거래처마다 1401 부터 새로 세므로 남의 확정 발주와 겹친다.
                // 그래서 ✕ 를 눌러도 표가 남의 확정 발주에 찍히고, 화면은
                // renderOrderParts 가 미확정을 그리므로 아무 일도 안 일어났다
                // (지시 09-13 09:50 · 세 번째 말씀). 그리는 쪽과 같은 순서로 맞춘다.
                const item = pendingOrdersMap[appMode].find(d => d.idNum === idNum) || confirmedOrders.find(d => d.idNum === idNum);
            if (item && item.partInfoMap[cardKey]) {
                pushEditHistory(idNum); // 변경 전 상태 저장
                item.partInfoMap[cardKey].isDeleted = true;
            }
            renderOrderParts(idNum);
        }

        function renderOrderParts(idNum) {
            const el = document.getElementById(`details-${idNum}`);

            // 📌 핵심 수정: pendingOrdersMap을 먼저 찾아서 부속발주 설정을 우선 적용
            let item = pendingOrdersMap[appMode].find(d => d.idNum === idNum);
            let isConfirmed = false;
            let isEditMode = false;

            // pendingOrdersMap에 없으면 confirmedOrders에서 찾음
            if (!item) {
                const confirmedItem = confirmedOrders.find(o => o.idNum === idNum);
                if (confirmedItem) {
                    item = confirmedItem;
                    isConfirmed = true;
                    isEditMode = confirmedItem.isEditMode;
                }
            }

            if (!el || !item) return;
            const h = currentFullData[0];

            let basicHtml = "", specialHtml = "";

            // 부속발주 선택된 부속명
            const targetPartName = item.targetPartName || '';

            // 부속발주 선택 시 partInfoMap 필터링
            let filteredPartInfoMap = item.partInfoMap;
            if (targetPartName) {
                // partInfoMap을 필터링하여 선택된 부속명만 포함
                filteredPartInfoMap = {};
                Object.entries(item.partInfoMap).forEach(([cardKey, pData]) => {
                    const rowIndex = parseInt(cardKey.split('-')[2]);
                    const row = currentFullData[rowIndex];
                    if (row && normalizeValue(row[h.indexOf("부속명")]) === targetPartName) {
                        filteredPartInfoMap[cardKey] = pData;
                    }
                });
            }

            // 필터링된 partInfoMap의 키들만 순회
            Object.entries(filteredPartInfoMap).forEach(([cardKey, pData]) => {
                // cardKey 형식: "card-{idNum}-{rowIndex}"에서 rowIndex 추출
                const rowIndex = parseInt(cardKey.split('-')[2]);
                const row = currentFullData[rowIndex];
                if (!row) return;
                
                const partSupplier = pData.partSupplier || normalizeValue(row[h.indexOf("공급처")]); const isAmt = (partSupplier === "AMT");
                const w = parseFloat(row[h.indexOf("재단W")]), d = parseFloat(row[h.indexOf("재단D")]);
                const plateName = row[h.indexOf("원장명")] || "원장정보없음";
                const finish = row[h.indexOf("마감")] || "마감정보없음";
                // 마감색상(원장 색상) — "마감"(가공형태)과는 다른 컬럼이라 별도로 조회해서 표시
                const finishColor = pData.finishColor || row[h.indexOf("마감색상")] || "";
                // 원장 1장당 생산량 — 재단 편집 기본규칙(shared/원장재단수량.js 원장당)
                const 원장당 = 원장재단수량.원장당(w, d, row[h.indexOf("결보호")]);

                // 손댈 수 있는가 — 예전에는 공급처가 AMT 인 부속만이었다. 그래서
                // 'AMT 발주 추가' 로 딸려 온 부속(전도방지 같은 것)은 수정도 삭제도
                // 단추가 아예 안 붙었다(지시 09-13 02:51). 기본발주에 들어 있는
                // 부속이면 공급처와 상관없이 손댈 수 있게 한다. 붙는 규칙은 그대로다.
                const 손댈수있음 = isEditMode || (!isConfirmed && !pData.isDeleted);
                let actionsHtml = "";
                if (손댈수있음) {
                    actionsHtml = `<button onclick="handleSubPartEdit(this, ${idNum}, '${cardKey}')" class="text-[8px] px-1 py-px bg-white border border-[#ededeb] rounded hover:bg-gray-50 text-[#787774] font-bold leading-none jh-blink">수정</button>`;
                }

                const canDelete = 손댈수있음;
                const deleteBtn = canDelete ? `<button onclick="event.stopPropagation(); deleteSubPart(${idNum}, '${cardKey}')" class="absolute -top-1 -right-1 sub-part-action-btn bg-white border border-[#ededeb] text-[#b0aeaa] hover:text-red-500 shadow-sm"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>` : '';

                // 카드 글은 공용 부품(shared/발주상품고르기.js 부속카드) — 영림원외주입력과 한 벌
                const cardHtml = 발주상품고르기.부속카드({ isAmt: isAmt, deleteBtn: deleteBtn, 부속명: row[h.indexOf("부속명")], plateName: plateName, finishColor: finishColor,
                    finish: finish, w: w, d: d, cardKey: cardKey, qty: pData.qty, actionsHtml: actionsHtml, 원장당: 원장당, 공정점: 부속공정점글(row, item, h) });

                // 부속카드 분류 로직
                // 1. isDeleted = false 또는 targetPartName이 있으면 → "기본 발주 부속"
                // 2. isDeleted = true 그리고 targetPartName 없으면 → "AMT 외 공급처 부속"

                const showInBasic = !pData.isDeleted;  // isDeleted가 false면 기본발주에 표시
                // 'AMT 외 공급처 부속' 은 원장 공급처가 AMT 가 아닌 것들로 이미 뜻이
                // 정해져 있다. 사장님이 이 오더에서 뺀 AMT 부속은 그리로 가면 안 된다 —
                // 이번 오더에서 그냥 사라지는 것이다(지시 09-13 10:22).
                // 발주등록완료 쪽(renderRegisteredOrderParts)은 처음부터 이랬다. 거기에 맞춘다.
                const showInSpecial = pData.isDeleted && !targetPartName && !isAmt;

                if (showInBasic) {
                    // 기본 발주 부속에 표시
                    basicHtml += cardHtml;
                } else if (showInSpecial) {
                    // AMT 외 공급처 부속 섹션에 표시
                    const specialBtn = isEditMode ? `<button onclick="addSpecialPart(${idNum}, '${cardKey}')" class="px-3 py-1 bg-white border border-blue-300 text-blue-600 rounded text-[10px] font-black hover:bg-blue-50 shadow-sm transition-all active:scale-95">AMT 발주 추가</button>` : '';
                    specialHtml += 발주상품고르기.특별카드({ 부속명: row[h.indexOf("부속명")], plateName: plateName, finishColor: finishColor, finish: finish, w: w, d: d, 원장당: 원장당,
                        단추: !isConfirmed ? `<button onclick="addSpecialPart(${idNum}, '${cardKey}')" class="mt-0.5 px-1 py-px bg-white border border-blue-300 text-blue-600 rounded text-[8px] font-black hover:bg-blue-50 shadow-sm transition-all active:scale-95 leading-none">AMT추가</button>` : specialBtn });
                }
            });
            el.innerHTML = 발주상품고르기.부속묶음(basicHtml, specialHtml);
        }

        async function addSpecialPart(idNum, cardKey) {
            const result = await showConfirmModal("드문 발주 · 추가?");
            if (result) {
                // pendingOrdersMap을 먼저 찾음 (발주상품목록)
                let item = pendingOrdersMap[appMode].find(d => d.idNum === idNum);

                // pendingOrdersMap에 없으면 confirmedOrders에서 찾음 (확정발주)
                if (!item) {
                    item = confirmedOrders.find(d => d.idNum === idNum);
                }

                if (item && item.partInfoMap[cardKey]) {
                    item.partInfoMap[cardKey].isDeleted = false;  // 기본발주 부속으로 이동
                    renderOrderParts(idNum);  // 화면 갱신
                    showToastMessage("기본 발주에 추가");  // 메시지 수정
                }
            }
        }

        function showConfirmModal(message, opts) {
            opts = opts || {};
            const title        = opts.title        || '발주 추가 확인';
            const confirmLabel = opts.confirmLabel  || 'AMT 발주 추가';
            return new Promise((resolve) => {
                const modal = document.getElementById('custom-confirm-modal');
                const titleEl = document.getElementById('modal-title');
                const msgEl = document.getElementById('modal-message');
                const cancelBtn = document.getElementById('modal-cancel-btn');
                const confirmBtn = document.getElementById('modal-confirm-btn');
                if (titleEl) titleEl.textContent = title;
                msgEl.textContent = message; confirmBtn.textContent = confirmLabel; modal.classList.add('active');
                const cleanup = (val) => {
                    modal.classList.remove('active');
                    if (titleEl) titleEl.textContent = '발주 추가 확인';
                    confirmBtn.textContent = 'AMT 발주 추가';
                    resolve(val);
                };
                cancelBtn.onclick = () => cleanup(false); confirmBtn.onclick = () => cleanup(true);
            });
        }

        function showToastMessage(msg) { const toast = document.getElementById('toast'); toast.textContent = msg; toast.style.opacity = '1'; setTimeout(() => toast.style.opacity = '0', 3000); }

        // 드롭다운 컨트롤러 초기화
        window.dropdownController = new DropdownController();

        window.tlJHToggleParts = function(itemEl) {
            const parts = itemEl.querySelector('.tl-delivery-parts');
            const arrow = itemEl.querySelector('.tl-arrow');
            if (!parts) return;
            const isOpen = parts.classList.contains('open');
            parts.classList.toggle('open');
            if (arrow) arrow.textContent = isOpen ? '▶' : '▼';
        };

        // 부속발주 팝오버 + 목록 팝오버: 바깥 클릭 시 모두 닫기
        document.addEventListener('click', function(e) {
            ['direct','ing','category'].forEach(mode => {
                const wrap = document.getElementById(`wrap-part-${mode}`);
                if (!wrap || wrap.contains(e.target)) return;
                document.getElementById(`popover-part-${mode}`)?.classList.add('hidden');
                document.getElementById(`listpop-part-${mode}`)?.classList.add('hidden');
            });
        });

        /* ═══ 박스 첫 화면 ══════════════════════════════════════════════
           구역을 "보였다 숨긴다". 지우지 않는다 —
           기존 자바스크립트가 찾는 요소는 전부 그대로 DOM 에 있다.
           박스를 누르면 그 구역을 가진 페이지 탭으로 보내고, 그 탭의 다른
           덩어리만 CSS 로 감춘다. 안쪽 화면은 한 줄도 안 고쳤다.
           거래처 탭(조혼가구·아인가구·ING·럭스디자인·유한가구)은 박스 안에서도
           그대로 듣는다 — switchSupplier 는 건드리지 않았다. */
        const JOHON_BOXES = {
            order     : { tab:'발주하기', name:'발주하기' },
            waiting   : { tab:'발주하기', name:'확정대기 List' },
            registered: { tab:'작업중',   name:'발주등록완료 리스트' },
            timeline  : { tab:'작업중',   name:'공정 일정 타임라인' },
            danger    : { tab:'발주하기', name:'발주기록삭제' }
        };
        var johonCurrentBox = null;   // 'let' 이면 앞선 코드가 부를 때 TDZ 에 걸린다
        var _johonSwitching = false;

        // 지금 박스가 이 구역을 보여 주는가 — renderProcessTimeline 이 물어본다.
        // 안 보이는 타임라인에 TL.init() 이 돌면 폭이 0 으로 잡혀 자리가 어긋난다.
        function johonBoxShows(sectionId){
            if (!johonCurrentBox) return true;
            if (sectionId === 'order-timeline-section') return johonCurrentBox === 'timeline';
            return true;
        }

        function johonOpenBox(key){
            const box = JOHON_BOXES[key];
            if (!box) return;
            johonCurrentBox = key;
            document.documentElement.setAttribute('data-johonbox', key);
            document.documentElement.removeAttribute('data-johonhome');
            _johonSwitching = true;
            try { switchPageTab(box.tab); } finally { _johonSwitching = false; }
            try { johonGuideSync(); } catch (e) {}
            window.scrollTo(0, 0);
        }

        // 머리띠(header) 높이를 재서 첫 화면이 그 아래에 딱 붙게 한다.
        function johonFitTop(){
            const h = document.querySelector('header');
            const px = h ? Math.round(h.getBoundingClientRect().height) : 64;
            if (px > 0) document.documentElement.style.setProperty('--jhh-top', px + 'px');
        }
        window.addEventListener('resize', johonFitTop);

        function johonGoHome(){
            johonFitTop();
            johonCurrentBox = null;
            document.documentElement.removeAttribute('data-johonbox');
            document.documentElement.setAttribute('data-johonhome', '1');
            johonHomeRefresh();
            johonGuideSync();
            window.scrollTo(0, 0);
        }

        // 페이지 탭(발주하기·작업중)을 직접 누르면 박스 판에서 빠져나온 것으로 본다 —
        // 기존 흐름이 갇히지 않게.
        (function(){
            const _origSwitchPageTab = window.switchPageTab;
            window.switchPageTab = function(tab){
                if (!_johonSwitching){
                    johonCurrentBox = null;
                    document.documentElement.removeAttribute('data-johonbox');
                    document.documentElement.removeAttribute('data-johonhome');
                }
                return _origSwitchPageTab.apply(this, arguments);
            };
        })();

        /* ═══ 발주완료리스트를 발주하기 쪽 아래에도 보인다 ══════════════
           사장님 10-15: 「이 박스의 내용을 발주하기 페이지의 하단에
           발주완료리스트 로 보이게 해주세요.」

           ⚠ **옮기는 것이 아니라 보이게** 하라는 말씀이다 — 「작업중」 쪽은 그대로다.
           ⚠ **세는 셈을 두 벌로 만들지 않는다.** 베껴 그리면 그 안의 아이디
             (`registered-item-…`·`registered-details-…`)가 두 벌이 되어, 펼치기가
             엉뚱한 것을 집는다. 그리는 셈도 두 군데가 되어 곧 어긋난다.
           그래서 — 두 쪽은 **한 번에 하나만 보인다.** 그 덩어리 **하나를**
           보이는 쪽으로 옮긴다. 셈도 아이디도 한 벌로 남는다. */
        (function(){
            const 덩이 = () => document.getElementById('registered-orders-section');
            const 처음 = 덩이();
            if (!처음 || !처음.parentNode) return;
            // 「작업중」 에서 섰던 자리를 적어 둔다 — 돌아갈 때 그 자리에 그대로 넣는다.
            const 제자리 = document.createComment('발주등록완료 리스트 제자리');
            처음.parentNode.insertBefore(제자리, 처음);

            function 옮기기(tab){
                const el = 덩이(); if (!el) return;
                if (tab === '발주하기') {
                    const 쪽 = document.getElementById('page-발주하기');
                    if (쪽 && el.parentNode !== 쪽) 쪽.appendChild(el);   // 맨 아래
                } else if (제자리.parentNode) {
                    제자리.parentNode.insertBefore(el, 제자리.nextSibling);
                }
                try { renderRegisteredOrders(); } catch (e) {}
            }

            const _sw = window.switchPageTab;
            if (typeof _sw === 'function') window.switchPageTab = function(tab){
                const r = _sw.apply(this, arguments);
                try { 옮기기(tab); } catch (e) {}
                return r;
            };
            // 처음 열릴 때. 첫 쪽은 「발주하기」 다.
            try { 옮기기(typeof _currentPageTab !== 'undefined' ? _currentPageTab : '발주하기'); }
            catch (e) {}
        })();

        function johonHomeRefresh(){
            const put = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
            const D = new Date();
            put('jhh-day', `${D.getDate()}일 ${['일','월','화','수','목','금','토'][D.getDay()]}요일`);
            try {
                put('jhh-role', appMode === 'ing' ? 'ING' : appMode);
                const sup   = getCurrentSupplier();
                const mine  = (confirmedOrders || []).filter(o => o.supplier === sup);
                const nPend = ((pendingOrdersMap || {})[appMode] || []).length;
                const nWait = mine.filter(o => o.amtRegistered !== true && o.amtConfirmedCancel !== true && o.amtTimeline !== true).length;
                const nReg  = mine.filter(o => o.amtTimeline === true).length;
                const nTl   = mine.filter(o => o.amtTimeline === true && !o.amtConfirmedCancel).length;
                put('jhh-c-order',      `담은 상품 ${nPend}건`);
                put('jhh-c-waiting',    `확정대기 ${nWait}건`);
                put('jhh-c-registered', `작업중 ${nReg}건`);
                put('jhh-c-timeline',   `카드 ${nTl}건`);
                put('jhh-sub',          `발주 ${nWait + nReg}건`);
            } catch (e) {
                put('jhh-sub', '자료 읽는 중');
            }
        }

        // 첫 화면으로 연다. 파싱 시점에 표를 찍어 둬야 잠깐이라도 안쪽이 비치지 않는다.
        document.documentElement.setAttribute('data-johonhome', '1');
        try { johonFitTop(); johonHomeRefresh(); johonGuideSync(); } catch (e) {}
        window.addEventListener('load', () => {
            try { johonFitTop(); johonHomeRefresh(); } catch (e) {}
        });
        // 파이어베이스가 늦게 채워 주므로 첫 화면에 머무는 동안만 셈을 갱신한다.
        setInterval(() => {
            if (document.documentElement.getAttribute('data-johonhome') === '1') {
                try { johonFitTop(); johonHomeRefresh(); } catch (e) {}
            }
        }, 4000);

        /* ── 처음 쓰는 분 이끌기 ────────────────────────────────────────
           바깥 업체가 쓰는 프로그램이다. 박스 판에서 말풍선 하나로만 이끈다.
           설명 카드는 지시(09-12 04:25 "설명 치워라 인간은 이런거 안본다")로 걷어냈다.
           업무 자료는 읽기만 한다 — 여기서 발주를 만들거나 지우지 않는다.

           잦아드는 기준은 '그 회사가 전에 발주한 적 있는가' 가 아니라
           '이 사람이 이 기계에서 발주를 끝까지 해 봤는가' 다. 회사로 따지면
           거래처는 이미 다 발주 기록이 있어 아무에게도 안 뜬다 (v1.0.0 의 잘못).
             · 이 기계에서 발주를 마친 적 없음 → 말풍선 + 깜빡임
             · 한두 번 해 봤음               → 말풍선만, 깜빡임은 멈춘다
             · 세 번 넘게 해 봤음            → 꺼진다. 할 줄 아는 사람이다
             · 지금 상품을 담고 있음         → 쉰다 */
        const JOHON_GUIDE_OFF = 'johon_guide_off';   // 사람이 껐다
        /* ═══ 깜빡임을 끄는 것은 여기 넷뿐이다 ═══════════════════════════
           다시 죽이지 않으려고 한 군데에 모아 둔다. 깜빡임을 건드릴 일이
           생기면 이 덩어리만 보면 된다. 다른 곳에 조건을 흩지 마라.
             1. johon_guide_off  사람이 껐다 (지금은 끄는 단추가 없다)
             2. johon_done2      이 기계에서 발주를 마친 횟수가 3 이상
             3. 담은 상품이 있다  (발주하기 깜빡임만. 수정 단추와는 상관없다)
             4. johon_edit_used  수정을 한 번 썼다 (수정 단추 깜빡임만)
             5. data-johonpicked 검색 방법 셋 중 하나를 골랐다 (검색 방법 박스만.
                johonPickTick 이 검색칸이 열렸는지 보고 찍는다)
           깜빡이는 곳은 셋이고 모두 johonBlinkTick 한 곳에서 돈다 —
           발주하기 박스 · 수정 단추 · 검색 방법 박스. 한 박자로 같이 뛴다.
           v1.1.2 까지 죽었던 까닭 둘 — 둘 다 여기 있었다:
             · 세는 자리가 틀렸다. 발주상품목록이 빈 채로 발주확정을 눌러도
               한 번 센다(원래 함수는 빈 목록이면 그냥 돌아간다). 세 번 헛누르면
               안내가 통째로 꺼졌다. 이제 '있던 것이 비워졌을 때'만 센다.
             · 깜빡임 조건이 done === 0 이었다. 한 번만 세어져도 영영 안 깜빡였다.
               이제 안내가 살아 있는 동안(done < 3)은 깜빡인다.
           셈 이름을 johon_done2 로 새로 지었다. 앞 판이 잘못 올려 둔 수가
           남아 있어도 깜빡임이 되살아난다. ══════════════════════════════ */
        const JOHON_DONE      = 'johon_done2';       // 이 기계에서 발주를 마친 횟수
        const JOHON_DONE_MAX  = 3;                   // 이만큼 해 봤으면 손을 뗀다

        function johonLS(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
        function johonLSet(k, v){ try { localStorage.setItem(k, v === undefined ? '1' : String(v)); } catch (e) {} }

        function johonDoneCount(){
            const v = parseInt(johonLS(JOHON_DONE) || '0', 10);
            return isNaN(v) ? 0 : v;
        }

        // 담은 상품 수 — 발주상품목록에 지금 올라와 있는 줄
        function johonPendingCount(){
            try { return ((pendingOrdersMap || {})[appMode] || []).length; } catch (e) { return 0; }
        }

        // 발주확정이 끝나면 한 번 센다. 발주 흐름은 건드리지 않는다 —
        // 원래 함수를 그대로 부르고 끝난 뒤에 옆에서 세기만 한다.
        (function(){
            const _origConfirm = window.confirmProductOrderBatch;
            if (typeof _origConfirm !== 'function') return;
            window.confirmProductOrderBatch = function(){
                const 보내기전 = johonPendingCount();      // 헛누름을 세지 않으려고 먼저 잰다
                const r = _origConfirm.apply(this, arguments);
                try {
                    Promise.resolve(r).then(() => {
                        // 있던 것이 비워졌을 때만 — 그게 실제로 보내진 자리다.
                        // 빈 목록에서 눌러도 세던 것이 깜빡임을 죽였다(v1.1.2 까지).
                        try {
                            if (보내기전 > 0 && johonPendingCount() === 0) {
                                // 올라간 것이 되살아나면 두 번 발주가 된다 — 곧바로 지운다
                                johonCartClear(); _johonCartLast = '';
                                johonLSet(JOHON_DONE, johonDoneCount() + 1);
                                johonGuideSync();
                            }
                        } catch (e) {}
                    }, () => {});
                } catch (e) {}
                return r;
            };
        })();

        function johonGuideSync(){
            const de = document.documentElement;
            const off  = johonLS(JOHON_GUIDE_OFF) === '1';
            const done = johonDoneCount();
            const live = !off && done < JOHON_DONE_MAX;   // 도움을 아직 보여 줄 때
            const n    = johonPendingCount();
            const call = live && n === 0;                 // 말풍선
            const puls = call;                            // 깜빡임 — 안내가 살아 있는 동안 (2·3번 조건은 위 덩어리 참고)

            if (call) de.setAttribute('data-johoncall',  '1'); else de.removeAttribute('data-johoncall');
            if (puls) de.setAttribute('data-johonpulse', '1'); else de.removeAttribute('data-johonpulse');
        }
        // 깜빡임 — 값을 직접 바꾼다. CSS 애니메이션은 아이폰의 '동작 줄이기'·
        // 저전력 모드에 막힐 수 있어 믿지 않는다. 흐림만 오르내리므로 어디서나 돈다.
        var _johonDim = false;
        var _johonChip = -1;   // 차례로 도는 칩 — 한 칸에 560ms, 셋 한 바퀴 1.68초
        function johonBlinkTick(){
            const de   = document.documentElement;
            const tile = document.querySelector('#johon-home .jhh-call');
            const lead = document.getElementById('jhh-lead');
            const pick = document.querySelector('.jh-pick-box');
            // 깜빡이는 곳 셋 — 켜짐/꺼짐은 위 덩어리에 적은 조건뿐이다
            // 발주하기 박스 — 박스 판을 보고 있을 때만. 박스 안으로 들어가면 멎는다
            // (안 보이는 채로 돌아도 눈에는 안 띄지만, 둘이 겹치지 않게 못 박아 둔다)
            const on = de.getAttribute('data-johonpulse') === '1'
                       && de.getAttribute('data-johonhome') === '1';
            const ed = johonEditGuideOn();                                   // 수정 단추
            const pk = !!pick && pick.offsetParent !== null                  // 검색 방법 박스
                       && de.getAttribute('data-johonhome') !== '1'
                       && de.getAttribute('data-johonpicked') !== '1';
            // 한 박자로 같이 뛴다 — 셋이 따로 놀면 어지럽다
            _johonDim = (on || ed || pk) ? !_johonDim : false;
            const v = _johonDim ? '0.32' : '1';
            if (tile) tile.style.opacity = on ? v : '';
            if (lead) lead.style.opacity = on ? v : '';
            // 검색 방법 — 박스 바탕은 가만히 두고(지시 09-12 23:53),
            // 글 한 줄만 깜빡이고 칩 테두리가 차례로 돈다.
            const msg  = document.querySelector('.jh-pick-msg');
            const chips = document.querySelectorAll('.method-chip');
            if (pick) pick.style.opacity = '';
            if (msg)  msg.style.opacity = pk ? v : '';
            if (pk) _johonChip = (_johonChip + 1) % (chips.length || 1);
            chips.forEach((c, i) => {
                // 테두리 둘레에 고리를 씌운다. 테두리 빛깔을 바꾸면 ING단품명 칩은
                // 원래 먹빛이라 제 차례인지 알 수 없다. 고리는 자리를 안 먹으므로
                // 칩 크기도 그대로다.
                c.style.boxShadow = (pk && i === _johonChip)
                    ? '0 0 0 3px rgba(55,53,47,.45)' : '';
            });
            de.setAttribute('data-johonedit', ed ? '1' : '0');
            document.querySelectorAll('.jh-blink').forEach(b => { b.style.opacity = ed ? v : ''; });
            // 수정 안내 글도 단추와 한 박자로. 따로 뛰면 두 박자가 되어 어지럽다.
            document.querySelectorAll('.jh-edit-tip').forEach(t => { t.style.opacity = ed ? v : ''; });
        }

        /* ── 수정 단추 이끌기 ────────────────────────────────────────────
           '수정버튼으로 각 부속의 발주수량을 조정할 수 있습니다' 안내와 깜빡임.
           이 기계에서 수정을 한 번 쓰고 나면 둘 다 사라진다. 늘 깜빡이면
           곧 눈에 안 들어온다. 부속 카드 모양은 건드리지 않았다 —
           안내는 카드 위 한 줄이고, 깜빡임은 흐림만 오르내린다. */
        const JOHON_EDIT_USED = 'johon_edit_used';
        function johonEditGuideOn(){ return johonLS(JOHON_EDIT_USED) !== '1'; }
        (function(){
            const _orig = window.handleSubPartEdit;
            if (typeof _orig !== 'function') return;
            window.handleSubPartEdit = function(){
                johonLSet(JOHON_EDIT_USED);
                try { johonBlinkTick(); } catch (e) {}
                return _orig.apply(this, arguments);
            };
        })();

        /* ── 달력 안내를 달력 바로 아래에 띄운다 ─────────────────────────
           지시(09-12 11:52). 맨 위 토스트는 화면 기준이라 넓은 화면에서 사장님
           눈이 가 있는 달력과 멀리 떨어졌다. 원래 함수는 그대로 부르고, 그 함수가
           도는 동안에만 알림을 가로채 칸 옆에 붙인다. 글은 새로 짓지 않았다. */
        function johonDateNote(el, msg){
            const wrap = el.closest('.card-hint-wrap') || el.parentElement;
            if (!wrap) return;
            wrap.querySelectorAll('.jh-datenote').forEach(n => n.remove());
            const note = document.createElement('div');
            note.className = 'jh-datenote';
            note.textContent = msg;
            wrap.appendChild(note);
            setTimeout(() => note.remove(), 4000);
        }
        (function(){
            const _orig = window.validateDeliveryDate;
            if (typeof _orig !== 'function') return;
            window.validateDeliveryDate = function(el){
                const _toast = window.showToastMessage;
                let 말 = null;
                window.showToastMessage = function(m){ 말 = m; };   // 이 함수가 도는 동안만
                try { return _orig.apply(this, arguments); }
                finally {
                    window.showToastMessage = _toast;
                    if (말) { try { johonDateNote(el, 말); } catch (e) { _toast(말); } }
                }
            };
        })();

        /* ── 담은 상품을 폰 안에 담아 둔다 ──────────────────────────────
           지시(09-12 12:06). 담은 상품은 메모리에만 있어 새로고침하면 다
           날아갔다. 아이폰은 탭을 내려놨다 되살릴 때 새로고침하므로 손도
           안 댄 채 사라진다.
           파이어스토어에는 올리지 않는다. 담기만 한 것은 아직 발주가 아니고,
           발주확정목록에 없는 것이 다음 단계로 새면 안 된다. 폰 안에만 담는다.
           발주확정을 누르면 곧바로 지운다. 되살아나면 두 번 발주가 된다. */
        const JOHON_CART   = 'johon_cart_v1';
        const JOHON_CART_H = 48;        // 이보다 오래된 것은 버린다 (시간)

        function johonCartClear(){ try { localStorage.removeItem(JOHON_CART); } catch (e) {} }
        function johonCartSave(){
            try {
                const map = pendingOrdersMap || {};
                const 빔 = Object.keys(map).every(k => !(map[k] || []).length);
                if (빔) { johonCartClear(); return; }
                localStorage.setItem(JOHON_CART,
                    JSON.stringify({ at: Date.now(), n: orderCount, map }));
            } catch (e) {}
        }
        function johonCartLoad(){
            let raw = null;
            try { raw = localStorage.getItem(JOHON_CART); } catch (e) {}
            if (!raw) return 0;
            let d = null;
            try { d = JSON.parse(raw); } catch (e) { johonCartClear(); return 0; }
            if (!d || !d.map || !d.at) { johonCartClear(); return 0; }
            if (Date.now() - d.at > JOHON_CART_H * 3600 * 1000) { johonCartClear(); return 0; }
            let 살림 = 0;
            Object.keys(pendingOrdersMap).forEach(k => {       // 거래처별로 따로 담긴다
                const 줄 = Array.isArray(d.map[k]) ? d.map[k] : [];
                if (줄.length && !(pendingOrdersMap[k] || []).length) {
                    pendingOrdersMap[k] = 줄; 살림 += 줄.length;
                }
            });
            // idNum 이 겹치지 않게 셈을 이어받는다 (idNum = 1400 + orderCount)
            if (typeof d.n === 'number' && d.n > orderCount) orderCount = d.n;
            return 살림;
        }
        // 바뀔 때만 적는다. 어느 길로 바뀌든(담기·빼기·수량·입고일·부속) 다 잡힌다.
        var _johonCartLast = '';
        setInterval(() => {
            try {
                const 지금 = JSON.stringify(pendingOrdersMap || {});
                if (지금 === _johonCartLast) return;
                _johonCartLast = 지금;
                johonCartSave();
            } catch (e) {}
        }, 700);
        try {
            if (johonCartLoad()) {
                window.addEventListener('load', () => { try { renderID0508(); } catch (e) {} });
            }
        } catch (e) {}

        /* ── 담은 상품을 지우기 전에 묻는다 ──────────────────────────────
           지시(09-12 11:51) "입고일 입력중이던 발주자체가 사라지는 오류".
           ✕ 가 묻지도 않고 한 번에 지웠다. 되돌릴 길도 없었다. 이제 묻는다.
           발주상품목록은 아직 파이어스토어에 없는 것이라 지워지는 업무 자료는 없다. */
        (function(){
            const _orig = window.removePendingItem;
            if (typeof _orig !== 'function') return;
            window.removePendingItem = async function(idNum){
                try {
                    const item = (pendingOrdersMap[appMode] || []).find(d => d.idNum === idNum);
                    const 이름 = item ? (item.displayName || '이 상품') : '이 상품';
                    const ok = await showConfirmModal(`${이름} 빼기`,
                               { title: '발주상품목록에서 빼기', confirmLabel: '빼기' });
                    if (!ok) return;
                } catch (e) {}
                return _orig.apply(this, arguments);
            };
        })();

        /* ── 기본 입고요청일보다 앞당기면 알리고 확인을 받는다 ───────────
           지시(09-12 05:51). 원래 함수는 그대로 부르고, 확인 전에는 안 넣는다.
           알림은 이 프로그램이 이미 쓰는 화면 안 덮개(showConfirmModal)다. */
        (function(){
            const _orig = window.updateItemDate;
            if (typeof _orig !== 'function') return;
            window.updateItemDate = async function(idNum, val){
                try {
                    if (val && val < getInitialDeliveryDate()) {
                        const ok = await showConfirmModal(
                            '입고일 조정될 수 있음',
                            { title: '입고요청일 확인', confirmLabel: '확인' });
                        if (!ok) {
                            // 되돌린다 — 아직 넣지 않았으므로 칸의 글자만 제자리로
                            const item = (pendingOrdersMap[appMode] || []).find(d => d.idNum === idNum)
                                      || (confirmedOrders || []).find(d => d.idNum === idNum);
                            const box = document.querySelector(
                                `input[type="date"][onchange*="updateItemDate(${idNum},"]`);
                            if (box && item) box.value = item.deliveryDate;
                            return;
                        }
                    }
                } catch (e) {}
                return _orig.apply(this, arguments);
            };
        })();
        setInterval(() => { try { johonBlinkTick(); } catch (e) {} }, 560);

        // 자막이동 — 긴 글을 오른쪽에서 왼쪽으로 민다. CSS 애니메이션에 기대지 않는다.
        // 짧아서 다 보이면 움직이지 않고, 안 보이는 자리면 쉰다.
        function johonMarqTick(){
            document.querySelectorAll('.jh-marq').forEach(box => {
                if (!box.offsetParent) { box._x = 0; return; }
                const inner = box.firstElementChild;
                if (!inner) return;
                const w = inner.scrollWidth, bw = box.clientWidth;
                if (w <= bw) { inner.style.transform = ''; box._x = 0; return; }
                box._x = (box._x || 0) - 2;     // 1초에 50px 쯤 — 읽을 만한 빠르기
                if (box._x < -w) box._x = bw;
                inner.style.transform = `translateX(${box._x}px)`;
            });
        }
        setInterval(() => { try { johonPickTick(); johonMarqTick(); } catch (e) {} }, 40);

        // 담고 지우는 것은 파이어베이스를 거치지 않으므로 짧게 살펴본다. 하는 일은 가볍다.
        setInterval(() => { try { johonGuideSync(); } catch (e) {} }, 1200);

        /* ── 고치는 중인 것은 목록이 새로 읽혀도 남긴다 ──────────────────
           지시(09-13 06:11 · ㉠). 확정된 발주를 수정모드에서 고칠 때
           (AMT추가·부속삭제·부속수량·발주수량·입고요청일) 그 손댐은 '수정완료'
           를 누를 때까지 이 기계 안에만 있었다. 그 사이 다른 발주가 하나라도
           바뀌면 onSnapshot 이 목록을 통째로 갈아끼워(confirmedOrders =
           snapshot.docs.map(...)) 더해 놓은 부속이 소리 없이 사라졌다.
           사장님은 사라진 줄 모르고 그대로 발주를 넣으신다.

           ⚠ 지키는 것은 '사장님이 손댄 칸' 뿐이다. 부속 하나하나, 칸 하나하나를
              적어 두고 그것만 덮는다. 나머지는 새로 읽은 것을 그대로 따른다 —
              그래야 그 사이 에이엠티가 바꾼 것을 가리지 않는다.
           ⚠ 놓는 때는 셋. 수정완료 · 되돌리기/초기화 · 새로 읽은 문서가 더는
              수정모드가 아님(다른 데서 수정이 끝났다).
           ⚠ 담는 곳은 localStorage 다. 사파리는 뒤로 돌린 탭을 버리고 되살릴
              때 새로고침하므로, 화면 기억에만 두면 잠깐 딴 데 보고 오시면 날아간다.
           파이어스토어에는 한 줄도 쓰지 않는다. 올리는 것은 여전히 '수정완료' 뿐이다. */
        const JOHON_DRAFT   = 'johon_edit_draft_v1';
        const JOHON_DRAFT_H = 24;       // 이보다 오래된 손댐은 버린다 (시간)

        function johonDraftWrite(d){
            try {
                if (!d || !Object.keys(d).length) localStorage.removeItem(JOHON_DRAFT);
                else localStorage.setItem(JOHON_DRAFT, JSON.stringify(d));
            } catch (e) {}
        }
        function johonDraftRead(){
            let raw = null;
            try { raw = localStorage.getItem(JOHON_DRAFT); } catch (e) {}
            if (!raw) return {};
            let d = null;
            try { d = JSON.parse(raw); } catch (e) { johonDraftWrite(null); return {}; }
            if (!d || typeof d !== 'object') return {};
            const 끝 = Date.now() - JOHON_DRAFT_H * 3600 * 1000;
            let 변함 = false;
            Object.keys(d).forEach(id => {
                if (!d[id] || !d[id].at || d[id].at < 끝) { delete d[id]; 변함 = true; }
            });
            if (변함) johonDraftWrite(d);
            return d;
        }
        function johonDraftDrop(docId){
            if (!docId) return;
            const d = johonDraftRead();
            if (d[docId]) { delete d[docId]; johonDraftWrite(d); }
        }

        // 이 idNum 이 '수정모드인 확정 발주' 인가. 미확정 발주는 이 길이 아니다 —
        // 그쪽은 johon_cart_v1 이 이미 폰 안에 담아 둔다.
        function johonDraftTarget(idNum){
            try {
                if (((pendingOrdersMap || {})[appMode] || []).some(d => d.idNum === idNum)) return null;
                const c = (confirmedOrders || []).find(o => o.idNum === idNum);
                if (!c || !c.docId || c.isEditMode !== true) return null;
                return c;
            } catch (e) { return null; }
        }

        // 사장님이 손댄 칸을 적어 둔다. 값은 손댄 뒤의 것을 그대로 베낀다.
        function johonDraftMark(idNum, cardKey, 칸들){
            const c = johonDraftTarget(idNum);
            if (!c) return;
            const d = johonDraftRead();
            const r = d[c.docId] || { parts: {}, item: {} };
            r.at = Date.now();
            r.parts = r.parts || {}; r.item = r.item || {};
            if (cardKey) {
                const p = c.partInfoMap && c.partInfoMap[cardKey];
                if (!p) return;
                r.parts[cardKey] = r.parts[cardKey] || {};
                칸들.forEach(k => { r.parts[cardKey][k] = p[k]; });
            } else {
                칸들.forEach(k => { r.item[k] = c[k]; });
            }
            d[c.docId] = r;
            johonDraftWrite(d);
        }

        // 새로 읽은 목록 위에 사장님이 손댄 칸만 다시 얹는다.
        function johonDraftApply(){
            const d = johonDraftRead();
            const ids = Object.keys(d);
            if (!ids.length) return;
            let 변함 = false;
            ids.forEach(docId => {
                const o = (confirmedOrders || []).find(x => x.docId === docId);
                if (!o) return;                  // 아직 안 내려왔다 — 적어 둔 것은 그대로 둔다
                if (o.isEditMode !== true) {     // 다른 데서 수정이 끝났다 — 놓는다
                    delete d[docId]; 변함 = true; return;
                }
                const r = d[docId] || {};
                Object.entries(r.parts || {}).forEach(([cardKey, 칸]) => {
                    const p = o.partInfoMap && o.partInfoMap[cardKey];
                    if (!p) return;              // 그 부속이 없어졌다 — 새로 만들지 않는다
                    Object.entries(칸).forEach(([k, v]) => { p[k] = v; });
                });
                Object.entries(r.item || {}).forEach(([k, v]) => { o[k] = v; });
            });
            if (변함) johonDraftWrite(d);
        }

        /* 갈아끼운 바로 뒤에 얹는다. onSnapshot 은 목록을 바꾼 다음 곧바로
           renderConfirmedBatchList() 를 부르므로, 그 앞에 끼우면 화면에는
           언제나 손댄 것이 실려 그려진다. 여러 번 불려도 같은 값이라 해롭지 않다. */
        (function(){
            const _orig = window.renderConfirmedBatchList;
            if (typeof _orig !== 'function') return;
            window.renderConfirmedBatchList = function(){
                try { johonDraftApply(); } catch (e) {}
                return _orig.apply(this, arguments);
            };
        })();

        /* 손댈 때마다 적어 둔다. 원래 함수는 그대로 부르고 끝난 뒤에 옆에서 적는다. */
        (function(){
            const _edit = window.handleSubPartEdit;
            if (typeof _edit === 'function') window.handleSubPartEdit = function(btn, idNum, cardKey){
                // '수정' 을 눌러 칸을 연 때가 아니라, '수정완료' 를 눌러 값이 들어간 때만 적는다
                const 넣는가 = !!btn && btn.textContent !== '수정';
                const r = _edit.apply(this, arguments);
                if (넣는가) { try { johonDraftMark(idNum, cardKey, ['qty', 'isManual']); } catch (e) {} }
                return r;
            };
            const _del = window.deleteSubPart;
            if (typeof _del === 'function') window.deleteSubPart = function(idNum, cardKey){
                const r = _del.apply(this, arguments);
                try { johonDraftMark(idNum, cardKey, ['isDeleted']); } catch (e) {}
                // 빗나가도 아무 말이 없어서 사장님이 세 번을 말씀하셔야 했다(지시 09-13 10:03).
                // 지워졌는지 한 번 보고, 안 지워졌으면 짧게 알린다. 묻는 창은 넣지 않는다 —
                // 눌러도 안 지워지는 것이 답답하신 것이지 한 걸음을 더 바라시는 게 아니다.
                try {
                    const it = (pendingOrdersMap[appMode] || []).find(d => d.idNum === idNum)
                            || (confirmedOrders || []).find(d => d.idNum === idNum);
                    const p = it && it.partInfoMap && it.partInfoMap[cardKey];
                    if (!p || p.isDeleted !== true) {
                        showToastMessage('지우지 못함');
                    }
                } catch (e) {
                    showToastMessage('지우지 못함');
                }
                return r;
            };
            const _add = window.addSpecialPart;
            if (typeof _add === 'function') window.addSpecialPart = async function(idNum, cardKey){
                const r = await _add.apply(this, arguments);
                try { johonDraftMark(idNum, cardKey, ['isDeleted']); } catch (e) {}
                return r;
            };
            const _qty = window.updateItemQty;
            if (typeof _qty === 'function') window.updateItemQty = function(idNum, val){
                const r = _qty.apply(this, arguments);
                try {
                    johonDraftMark(idNum, null, ['orderQty']);
                    const c = johonDraftTarget(idNum);      // 딸려 다시 셈해진 부속수량도 같이
                    if (c) Object.keys(c.partInfoMap || {}).forEach(k => {
                        if (!c.partInfoMap[k].isManual) johonDraftMark(idNum, k, ['qty']);
                    });
                } catch (e) {}
                return r;
            };
            const _date = window.updateItemDate;           // 앞서 얹은 확인창 위에 다시 얹는다
            if (typeof _date === 'function') window.updateItemDate = async function(idNum, val){
                const r = await _date.apply(this, arguments);
                try { johonDraftMark(idNum, null, ['deliveryDate']); } catch (e) {}
                return r;
            };
        })();

        /* 놓는 자리 — 수정완료 · 되돌리기 · 초기화. 여기서 놓지 않으면 옛 것이
           계속 눌러앉아 다음에 내려온 값을 덮는다. */
        (function(){
            const _fin = window.finishEditingOrderFirebase;
            if (typeof _fin === 'function') window.finishEditingOrderFirebase = async function(docId){
                const r = await _fin.apply(this, arguments);
                try { johonDraftDrop(docId); } catch (e) {}
                return r;
            };
            const _rev = window.revertEditingOrder;
            if (typeof _rev === 'function') window.revertEditingOrder = async function(docId){
                const r = await _rev.apply(this, arguments);
                try { johonDraftDrop(docId); } catch (e) {}
                return r;
            };
            const _reset = window.resetEditToOriginal;
            if (typeof _reset === 'function') window.resetEditToOriginal = function(idNum){
                // ⚠ 초안은 원래 함수를 부르기 **전에** 놓는다. 뒤에 놓으면 한 줄 늦다 —
                //    _reset 이 제 안에서 renderConfirmedBatchList() 를 부르고, 그것이
                //    johonDraftApply() 를 먼저 돌려 원주문으로 되돌려 놓은 것 위에
                //    손댄 값을 도로 얹었다. 눌러도 아무것도 안 돌아왔다(지시 09-13 20:41).
                // ⚠ 되돌릴 것이 실제로 있을 때만 놓는다. _reset 은 backup 이 없으면
                //    맨 앞에서 그냥 돌아나간다. 그때 초안까지 놓아 버리면 되돌린 것은
                //    없는데 사장님 손댐만 보호가 풀려 다음 갈아끼움에 소리 없이 날아간다.
                let docId = null;
                try {
                    const c = (confirmedOrders || []).find(o => o.idNum === idNum);
                    if (c && c.backup) docId = c.docId;      // backup 이 있을 때만
                } catch (e) {}
                try { if (docId) johonDraftDrop(docId); } catch (e) {}
                return _reset.apply(this, arguments);
            };
        })();

        /* ── 박스추가 ─────────────────────────────────────────────────────
           지시(09-13 07:24) "박스가 있는 화면에는 박스추가 단추를 만들어 달라".
           작업대(viggle) 가 /api/box → wt_boxes 에 담는 그대로 한다. 다만
           wt_boxes 에는 쓰지 않는다 — 작업대 박스와 섞인다. 이 프로그램의 칸은
           artifacts/{앱}/public/data/johon_boxes 다.

           ⚠ 일하는 박스와 내 박스를 코드에서 갈랐다.
              일하는 박스(발주하기·확정대기 List·발주등록완료 리스트·공정 일정
              타임라인·발주기록삭제)는 HTML 에 박혀 있고 JOHON_BOXES 가 맡는다.
              이 목록에서 그리지 않으므로 지우거나 옮길 길이 아예 없다.
              내 박스만 #jhh-mine 안에 그려지고, 거기에만 고치기 단추가 붙는다.
           ⚠ 발주 흐름·확정 규칙은 건드리지 않는다. 이 박스는 이름표와 바로가기다.
           ⚠ 폰과 넓은 화면이 같아야 하므로 파이어스토어에 담는다. 못 닿을 때를
              대비해 폰 안(localStorage)에도 같이 둔다 — 화면은 늘 곧바로 뜬다. */
        // 아이콘 하나 — 작업대의 ico()·에이엠티의 아이콘() 과 같은 방식(lucide 원자료를 svg 로)
        const johonPascal = n => String(n||'').split('-')
            .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');
        function johonIco(name, sz, stroke){
            const L = (window.lucide && window.lucide.icons) || {};
            const n = L[johonPascal(name)] || L.Square;
            if (!n) return '';
            const a = Object.assign({}, n[1], { width: sz, height: sz, 'stroke-width': stroke || 1.7 });
            const at = Object.keys(a).map(k => k + '="' + johonEsc(a[k]) + '"').join(' ');
            const 안 = (n[2] || []).map(c => '<' + c[0] + ' ' +
                Object.keys(c[1] || {}).map(k => k + '="' + johonEsc(c[1][k]) + '"').join(' ') + '/>').join('');
            return '<svg ' + at + '>' + 안 + '</svg>';
        }
        // 작업대의 아이콘 묶음 그대로. 한 글자도 고치지 않았다.
        const JOHON_ICONS = [
          ['자주 쓰는 것', ['square','layout-grid','folder','file-text','message-square','star',
            'check-check','bell','tag','bookmark','pin','flag']],
          ['프로그램·화면', ['monitor','smartphone','app-window','panel-left','table-2','list',
            'kanban','sliders-horizontal','toggle-right','mouse-pointer-click']],
          ['서류·문서', ['files','folder-open','clipboard-list','receipt','notebook-pen','book-open',
            'printer','scan-text','file-spreadsheet','file-check','stamp','signature']],
          ['가구·제조', ['hammer','wrench','ruler','pencil-ruler','scissors','layers','package','boxes',
            'factory','cog','drill','component']],
          ['물류·배송', ['truck','ship','plane','warehouse','forklift','route','map-pin','map',
            'scan-barcode','qr-code','container','package-check']],
          ['돈·거래', ['banknote','coins','credit-card','calculator','percent','wallet','trending-up',
            'chart-column','chart-pie','handshake']],
          ['사람·연락', ['users','user-round','phone','mail','send','headphones','messages-square',
            'megaphone','id-card','contact']],
          ['시간·일정', ['calendar','calendar-days','clock','timer','hourglass','alarm-clock',
            'calendar-check','history']],
          ['알림·상태', ['circle-alert','triangle-alert','info','circle-check','circle-dot','circle-x',
            'shield-check','activity','zap','heart']],
          ['그 밖', ['image','camera','video','mic','globe','key','lock','search','lightbulb','rocket',
            'database','code-xml','cpu','cloud','link','download','upload','archive','trash-2','wand-sparkles']],
        ];
        const johonIcoHas = n => !!((window.lucide && window.lucide.icons) || {})[johonPascal(n)];
        function johonIcoDraw(){
            const ig = document.getElementById('jhm-ig'); if (!ig) return;
            const 한칸 = n => '<button type="button" data-ic="' + n + '" class="' +
                (n === johonBoxIcon ? 'on' : '') + '">' + johonIco(n, 20) + '</button>';
            const q = ((document.getElementById('jhm-q') || {}).value || '').trim().toLowerCase();
            if (q){
                const L = (window.lucide && window.lucide.icons) || {};
                const all = Object.keys(L).map(k => k.replace(/([a-z0-9])([A-Z])/g,'$1-$2').toLowerCase())
                             .filter(n => n.includes(q)).slice(0, 60);
                ig.innerHTML = all.length ? all.map(한칸).join('')
                    : '<p class="jhm-icohead">없음</p>';
                return;
            }
            ig.innerHTML = JOHON_ICONS.map(([이름, 것들]) => {
                const 쓸것 = 것들.filter(johonIcoHas);
                return 쓸것.length ? '<h5 class="jhm-icohead">' + 이름 + '</h5>' + 쓸것.map(한칸).join('') : '';
            }).join('');
        }
        (function(){
            const ig = document.getElementById('jhm-ig'); if (!ig) return;
            ig.addEventListener('click', e => {
                const t = e.target.closest('[data-ic]'); if (!t) return;
                johonBoxIcon = t.dataset.ic;
                [...ig.children].forEach(c => c.classList.toggle('on', c === t));
            });
        })();

        const JOHON_BOXCOL = 'johon_boxes';
        const JOHON_BOXLS  = 'johon_boxes_v1';
        let johonMyBoxes = [];          // [{id, name, tone, link, at}]
        let johonBoxEdit = null;        // 고치는 중인 박스 (null 이면 새것)
        let johonBoxTone = 'white';
        let johonBoxIcon = 'square';

        function johonBoxLoadLS(){
            try {
                const a = JSON.parse(localStorage.getItem(JOHON_BOXLS) || '[]');
                if (Array.isArray(a)) johonMyBoxes = a;
            } catch (e) {}
        }
        function johonBoxSaveLS(){
            try { localStorage.setItem(JOHON_BOXLS, JSON.stringify(johonMyBoxes)); } catch (e) {}
        }
        function johonBoxCol(){
            const { collection } = window.fbFirestore || {};
            if (!collection || !window.db) return null;
            return collection(window.db, 'artifacts', appId, 'public', 'data', JOHON_BOXCOL);
        }
        // 다른 기기에서 만들거나 고쳐도 따라온다. 작업대가 하는 그대로다.
        function johonBoxSync(){
            const col = johonBoxCol(); if (!col) return;
            const { onSnapshot } = window.fbFirestore;
            try {
                onSnapshot(col, s => {
                    johonMyBoxes = s.docs.map(d => ({ id: d.id, ...d.data() }))
                        .sort((a, b) => (a.at || 0) - (b.at || 0));
                    johonBoxSaveLS(); johonBoxRender();
                    johonDealBoxSeed();
                }, () => {});
            } catch (e) {}
        }

        /* 10-12 사장님: 「해당 거래처에 **거래내역 박스를 만들어** 명세서가 도착하도록」 —
           박스판에 **딱 한 번** 세운다.

           ⚠⚠ **박스판은 사장님이 손수 꾸리시는 자리다.** 지우신 것이 새로고침마다
              돌아오면 「왜 자꾸 생기냐」 하신다. 그래서 「한 번 세웠다」 는 **자국**을
              박스와 **다른 자리**(`johon_meta/박스세움`)에 남긴다.
              · 박스를 지워도 자국은 안 지워진다 — 지운 채로 남는다.
              · 자국은 다른 칸이라 **박스판에 네모로 뜨지 않는다.**
              · 화베에 남기므로 폰을 바꾸셔도 또 생기지 않는다(localStorage 는 안 쓴다).
           차례 — 박스를 먼저 쓰고 자국을 쓴다. 자국부터 쓰면 박스 쓰기가 실패했을 때
                  영영 안 세워진다. */
        const JOHON_METACOL = 'johon_meta';
        const JOHON_METADOC = '박스세움';
        let _jhd박스봤나 = false;
        async function johonDealBoxSeed(){
            if (_jhd박스봤나) return;
            _jhd박스봤나 = true;
            try {
                const { doc, getDoc, setDoc } = window.fbFirestore || {};
                if (!doc || !getDoc || !setDoc || !window.db) return;
                const 자국칸 = doc(window.db, 'artifacts', appId, 'public', 'data',
                                   JOHON_METACOL, JOHON_METADOC);
                const 자국 = await getDoc(자국칸);
                if (자국 && 자국.exists() && (자국.data() || {}).거래내역) return;   // 이미 한 번 세웠다
                if (!johonMyBoxes.some(b => String(b.name || '').trim() === '거래내역')) {
                    await setDoc(doc(window.db, 'artifacts', appId, 'public', 'data',
                                     JOHON_BOXCOL, '거래내역'),
                        { name: '거래내역', icon: 'receipt', tone: 'white', link: '', at: Date.now() },
                        { merge: true });
                }
                await setDoc(자국칸, { 거래내역: Date.now() }, { merge: true });
            } catch (e) { /* 못 세워도 다른 박스는 그대로 돈다 */ }
        }

        function johonBoxRender(){
            const list = document.getElementById('jhh-mine');
            const n    = document.getElementById('jhh-mine-n');
            if (!list) return;
            if (n) n.textContent = String(johonMyBoxes.length);
            const ico = document.getElementById('jhh-newbox-ico');
            if (ico && !ico.firstChild) ico.innerHTML = johonIco('plus', 22);
            list.innerHTML = johonMyBoxes.map(b => {
                const 어둠 = b.tone === 'dark' ? ' jhh-dark' : '';
                const 바탕 = b.tone === 'light' ? '' : (b.tone === 'dark' ? '' : ' style="background:#fff;border:1px solid var(--vg-edge)"');
                return `<div class="jhh-row"${바탕}>
                    <span class="jhh-ico${어둠}">
                        ${johonIco(b.icon || 'square', 17, 2)}
                    </span>
                    <span class="jhh-t" data-go="${johonEsc(b.id)}">${johonEsc(b.name || '새 박스')}${
                        b.link ? `<i>${johonEsc(b.link)}</i>` : '<i>이름표</i>'}</span>
                    <button type="button" class="jhh-set" data-set="${johonEsc(b.id)}"
                            aria-label="박스설정" title="박스설정">⋯</button>
                </div>`;
            }).join('');
        }
        function johonEsc(s){
            return String(s == null ? '' : s).replace(/[&<>"']/g,
                c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // 누르면 간다 / ⋯ 를 누르면 고친다. 일하는 박스에는 이 길이 닿지 않는다 —
        // 저것들은 #jhh-mine 밖에 있고 onclick 이 따로 박혀 있다.
        document.addEventListener('click', function(e){
            const s = e.target.closest && e.target.closest('#jhh-mine [data-set]');
            if (s) { e.stopPropagation();
                     johonBoxOpen(johonMyBoxes.find(b => b.id === s.dataset.set) || null); return; }
            const g = e.target.closest && e.target.closest('#jhh-mine [data-go]');
            if (g) {
                const b = johonMyBoxes.find(x => x.id === g.dataset.go);
                if (!b) return;
                // 「스캔」 박스는 이 안의 스캔 화면을 연다. 사장님이 만드신 박스라
                // link 가 비어 있고, 파이어스토어에 쓰지 말라 하셔서 채워 넣지 못한다.
                // 그래서 이름으로 가른다. 이 이름 하나뿐이다 — 「입고확인」 은 안 건드린다.
                if ((b.name || '').trim() === '스캔') { johonScanOpen(); return; }
                // 「거래내역」 도 같은 길이다 — 이 안의 화면을 연다 (10-12 지시).
                if ((b.name || '').trim() === '거래내역') { johonDealOpen(); return; }
                if (b.link) { try { window.open(b.link, '_blank', 'noopener'); } catch (err) {} }
            }
        });

        function johonBoxOpen(b){
            johonBoxEdit = b || null;
            johonBoxTone = (b && b.tone) || 'white';
            johonBoxIcon = (b && b.icon) || 'square';
            const put = (id, t) => { const el = document.getElementById(id); if (el) el.textContent = t; };
            put('jhm-title', b ? '박스설정' : '새 박스');
            put('jhm-go',    b ? '저장' : '만들기');
            put('jhm-hint', '');
            const del = document.getElementById('jhm-del');
            if (del) del.style.display = b ? 'block' : 'none';
            const nm = document.getElementById('jhm-name');
            if (nm) { nm.value = (b && b.name) || ''; }
            const lk = document.getElementById('jhm-link');
            if (lk) { lk.value = (b && b.link) || ''; }
            johonBoxTones();
            const q = document.getElementById('jhm-q'); if (q) q.value = '';
            johonIcoDraw();
            document.documentElement.setAttribute('data-johonmk', '1');
            if (nm) setTimeout(() => { try { nm.focus(); } catch (e) {} }, 60);
        }
        function johonBoxClose(){
            document.documentElement.removeAttribute('data-johonmk');
            johonBoxEdit = null;
        }
        function johonBoxTones(){
            const wrap = document.getElementById('jhm-tones'); if (!wrap) return;
            [...wrap.children].forEach(c => c.classList.toggle('on', c.dataset.tone === johonBoxTone));
        }
        (function(){
            const wrap = document.getElementById('jhm-tones'); if (!wrap) return;
            wrap.addEventListener('click', e => {
                const t = e.target.closest('[data-tone]'); if (!t) return;
                johonBoxTone = t.dataset.tone; johonBoxTones();
            });
        })();

        async function johonBoxSave(){
            const nm   = (document.getElementById('jhm-name')  || {}).value || '';
            const lk   = (document.getElementById('jhm-link')  || {}).value || '';
            const hint = document.getElementById('jhm-hint');
            const name = nm.trim().slice(0, 60) || '새 박스';
            const link = lk.trim();
            const 값 = { name: name, tone: johonBoxTone, icon: johonBoxIcon, link: link };
            const fb = window.fbFirestore || {};
            try {
                if (johonBoxEdit) {
                    const { doc, updateDoc } = fb;
                    if (doc && updateDoc && window.db) {
                        await updateDoc(doc(window.db, 'artifacts', appId, 'public', 'data',
                                            JOHON_BOXCOL, johonBoxEdit.id), 값);
                    }
                    const i = johonMyBoxes.findIndex(b => b.id === johonBoxEdit.id);
                    if (i >= 0) johonMyBoxes[i] = { ...johonMyBoxes[i], ...값 };
                } else {
                    값.at = Date.now();
                    let id = 'local-' + 값.at;
                    const col = johonBoxCol();
                    if (col && fb.addDoc) { const r = await fb.addDoc(col, 값); if (r && r.id) id = r.id; }
                    johonMyBoxes.push({ id: id, ...값 });
                }
                johonBoxSaveLS(); johonBoxRender(); johonBoxClose();
            } catch (e) {
                // 못 올렸으면 알린다. 폰 안에는 남겨 두어 손댄 것이 사라지지 않게 한다.
                if (!johonBoxEdit) { 값.at = 값.at || Date.now();
                                     johonMyBoxes.push({ id: 'local-' + 값.at, ...값 }); }
                johonBoxSaveLS(); johonBoxRender();
                if (hint) hint.textContent = '이 기계에만 저장됨';
            }
        }

        async function johonBoxDelete(){
            if (!johonBoxEdit) return;
            const ok = await showConfirmModal(`'${johonBoxEdit.name || '새 박스'}' 지우기`,
                { title: '박스 지우기', confirmLabel: '지우기' });
            if (!ok) return;
            const id = johonBoxEdit.id;
            const fb = window.fbFirestore || {};
            try {
                const { doc, deleteDoc } = fb;
                if (doc && deleteDoc && window.db && !String(id).startsWith('local-')) {
                    await deleteDoc(doc(window.db, 'artifacts', appId, 'public', 'data', JOHON_BOXCOL, id));
                }
            } catch (e) {}
            johonMyBoxes = johonMyBoxes.filter(b => b.id !== id);
            johonBoxSaveLS(); johonBoxRender(); johonBoxClose();
        }

        // 폰 안에 있는 것을 먼저 그려 화면이 비지 않게 하고, 그 뒤 클라우드를 붙인다.
        johonBoxLoadLS(); johonBoxRender();
        // lucide 는 이 글 아래에서 실린다. 뜨면 한 번 다시 그려 아이콘을 채운다.
        window.addEventListener('load', () => { try { johonBoxRender(); } catch (e) {} });
        (function(){
            let 남은횟수 = 40;               // 파이어베이스가 늦게 뜰 수 있다
            const t = setInterval(() => {
                if (window.db && window.fbFirestore) { clearInterval(t); johonBoxSync(); return; }
                if (--남은횟수 <= 0) clearInterval(t);
            }, 500);
        })();

        /* ── 스캔 화면 ────────────────────────────────────────────────────
           지시(10-11) "스캔박스 클릭시 고성능 스캔큐알을 할 수 있는 화면".

           ⚠ 바퀴를 새로 만들지 않았다. 반품스캔/반품스캔.html 의
             startScanner()·stopScanner() 를 그대로 옮긴 것이다.
             그쪽은 리액트(ref·state)고 여기는 맨 자바스크립트라 함수를 불러올 수
             없다 — 저장소도 다르다. 그래서 뜻만 그대로 베꼈다.
               방법 A  BarcodeDetector (폰이 가진 것. 아이폰 사파리가 이것을 쓴다)
                       facingMode environment · 1280×720 · requestAnimationFrame
               방법 B  html5-qrcode (A 가 없을 때 받침)

           ⚠ 끄는 길이 핵심이다. 카메라 트랙을 안 끄면 폰 불이 계속 켜져 있고
             배터리가 녹는다. 닫을 때·뒤로 갈 때·화면을 덮었을 때 모두 끈다.

           ⚠ 읽은 글로 무엇을 할지는 말씀이 없었다. 크게 보여 주고 복사까지만 한다. */
        let _jhsStream = null, _jhsRaf = null, _jhsQr = null, _jhsText = '';

        function johonScanTag(글){
            const el = document.getElementById('jhs-tag');
            if (el) el.textContent = 글 || '';
        }

        async function johonScanStop(){
            if (_jhsRaf) { cancelAnimationFrame(_jhsRaf); _jhsRaf = null; }
            if (_jhsStream) { _jhsStream.getTracks().forEach(t => t.stop()); _jhsStream = null; }
            if (_jhsQr) { try { await _jhsQr.stop(); } catch (e) {} _jhsQr = null; }
            const v = document.getElementById('jhs-view');
            if (v) [...v.querySelectorAll('video,div:not(.jhs-aim)')].forEach(n => n.remove());
            document.documentElement.removeAttribute('data-johonscanon');
        }

        // html5-qrcode 를 한 번만 받아 온다. 못 받아 오면 조용히 지나간다 —
        // 부르는 쪽에서 「카메라 막힘」 딱지를 붙인다.
        let _jhsQrLoad = null;
        function johonScanLoadQr(){
            if (window.Html5Qrcode) return Promise.resolve();
            if (_jhsQrLoad) return _jhsQrLoad;
            _jhsQrLoad = new Promise(풀기 => {
                const s = document.createElement('script');
                s.src = 'https://unpkg.com/html5-qrcode';
                s.async = true;
                s.onload = () => 풀기();
                s.onerror = () => { _jhsQrLoad = null; 풀기(); };
                document.head.appendChild(s);
            });
            return _jhsQrLoad;
        }

        async function johonScanStart(){
            await johonScanStop();
            johonScanTag('');
            const 담을곳 = document.getElementById('jhs-view');
            if (!담을곳) return;
            const 찾음 = 글 => { johonScanFound(글); };

            // ── 방법 A: BarcodeDetector (네이티브, 빠름) ──
            if ('BarcodeDetector' in window) {
                try {
                    const 꼴 = ['code_128','code_39','ean_13','ean_8','qr_code','data_matrix','itf','codabar'];
                    const 되는것 = await window.BarcodeDetector.getSupportedFormats().catch(() => 꼴);
                    const 눈 = new window.BarcodeDetector({ formats: 되는것.filter(f => 꼴.includes(f)) });
                    _jhsStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: 'environment' },
                                 width: { ideal: 1280 }, height: { ideal: 720 } } });
                    const v = document.createElement('video');
                    v.srcObject = _jhsStream;
                    v.setAttribute('playsinline',''); v.setAttribute('autoplay',''); v.muted = true;
                    담을곳.appendChild(v);
                    await v.play();
                    document.documentElement.setAttribute('data-johonscanon','1');
                    const 돌기 = async () => {
                        if (!_jhsStream) return;
                        try {
                            const r = await 눈.detect(v);
                            if (r.length > 0) { 찾음(r[0].rawValue); return; }
                        } catch (e) {}
                        _jhsRaf = requestAnimationFrame(돌기);
                    };
                    _jhsRaf = requestAnimationFrame(돌기);
                    return;
                } catch (e) {
                    await johonScanStop();
                    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
                        johonScanTag('카메라 막힘'); return;
                    }
                    if (e && e.name === 'NotFoundError') { johonScanTag('카메라 없음'); return; }
                    // 그 밖에는 받침으로 내려간다
                }
            }

            // ── 방법 B: html5-qrcode (받침) ──
            // 아이폰 사파리에는 BarcodeDetector 가 없다. 그래서 사장님 폰에서
            // 실제로 도는 것은 이쪽이다. 반품스캔은 이 꾸러미를 머리에서 미리
            // 받아 오지만, 여기는 발주를 보는 판이라 스캔 화면을 열 때만 받아 온다.
            // ⚠ 이 꾸러미는 바깥에서 받아 온다. 이 상자에서는 그 길이 막혀 있어
            //   못 재 봤다. 사장님 폰에서만 돌아간다.
            try {
                await johonScanLoadQr();
                // 꾸러미를 못 받아 왔다. 카메라 탓이 아니니 딱지를 달리 붙인다 —
                // 「카메라 막힘」 이라 적으면 사장님이 폰 설정만 뒤지시게 된다.
                if (!window.Html5Qrcode) { johonScanTag('못 불러옴'); return; }
                const 기계들 = await window.Html5Qrcode.getCameras();
                if (!기계들 || 기계들.length === 0) throw Object.assign(new Error(''), {name:'NotFoundError'});
                const 뒤 = 기계들.find(d => /back|rear|environ/i.test(d.label)) || 기계들[기계들.length-1];
                _jhsQr = new window.Html5Qrcode('jhs-view');
                await _jhsQr.start(뒤.id, { fps:15, qrbox:{ width:240, height:240 } }, 찾음, () => {});
                document.documentElement.setAttribute('data-johonscanon','1');
            } catch (e) {
                await johonScanStop();
                johonScanTag(e && e.name === 'NotFoundError' ? '카메라 없음' : '카메라 막힘');
            }
        }

        /* ═══ 찍은 글 → 가는 길 ═════════════════════════════════════════
           사장님 10-11: 「스캔내용 클릭시 해당 납기 명세서가 나타나야 합니다」
           「이런 스캔의 종류가 많아 질텐데 … 다른 루트를 보여주는 큐알일때는 어떻게 해지?」

           ⚠⚠ **큐알 종류를 여기에 박지 않는다.** 가는 길은 화베의 규칙표(`큐알규칙`)에
              줄로 쌓이고, 새 큐알은 줄 하나만 더하면 된다. 셈은 shared/큐알길.js 한 벌이다.
           ⚠ 규칙표는 **읽기만** 한다. 줄을 더하는 것은 바이글이 한다.
           ⚠ 규칙표를 **못 읽어도 스캔 화면은 그대로 돈다.** 여기서 터지면 안 된다. */
        let _jhs규칙 = null;      // 읽어 둔 줄들
        let _jhs규칙중 = null;    // 읽는 중인 약속

        function johonScanRulesLoad(){
            _jhs규칙중 = (async () => {
                try {
                    if (!window.db || !window.fbFirestore || !window.큐알길) return [];
                    const { collection, getDocs } = window.fbFirestore;
                    const 눈 = await getDocs(collection(window.db, ...window.큐알길.자리));
                    const 줄 = []; 눈.forEach(d => 줄.push(d.data()));
                    return 줄;
                } catch (e) { return []; }   // 못 읽어도 그냥 빈 줄로 간다
            })().then(줄 => { _jhs규칙 = 줄; return 줄; });
            return _jhs규칙중;
        }

        function johonScanWaysClear(){
            document.documentElement.removeAttribute('data-johonscanway');
            const 통 = document.getElementById('jhs-ways');
            if (통) 통.innerHTML = '';
        }

        /* 길을 누르면 간다. ⚠ 가기 전에 카메라를 끈다 — 안 끄면 폰 불이 켜진 채 남는다.

           10-12 사장님: 「에이엠티 프로그램으로 연결되어 나타나는 듯하다 — 로그인 문제로
           혼란을 줄 수 있다.」 그래서 **「납기 명세표」 는 주소로 안 가고 제 집에서 편다.**
           ⚠ 무슨 큐알인지 **가리는 것은 규칙표 그대로**다(`shared/큐알길.js`). 규칙표는
             안 건드린다 — 거기 갈곳은 다른 스캐너를 위한 것이다.
           가름은 **길 이름**으로 한다. 택배·명함처럼 큐알이 그 자체로 주소인 것
           (「그 주소 열기」)은 여전히 바깥으로 나가야 하기 때문이다. */
        const JOHON_집에서펴는길 = '납기 명세서';
        async function johonScanGo(주소, 이름, 큐알){
            try { await johonScanStop(); } catch (e) {}
            if (String(이름 || '').trim() === JOHON_집에서펴는길) { johonBillOpen(큐알); return; }
            try { window.open(주소, '_blank', 'noopener'); } catch (e) {}
        }

        async function johonScanRoute(글){
            johonScanWaysClear();
            let 줄 = _jhs규칙;
            if (!줄) { try { 줄 = await (_jhs규칙중 || johonScanRulesLoad()); } catch (e) { 줄 = []; } }
            let 길 = [];
            try { 길 = (window.큐알길 && window.큐알길.풀기(글, 줄 || [])) || []; } catch (e) { 길 = []; }
            if (글 !== _jhsText) return;        // 그새 다시 찍으셨으면 버린다
            const 통 = document.getElementById('jhs-ways');
            if (!통 || 길.length === 0) return; // 길이 없으면 「무엇인지 모르겠습니다」 한 줄이 선다
            길.forEach(ㄱ => {
                const b = document.createElement('button');
                b.type = 'button'; b.className = 'jhs-way';
                b.textContent = ㄱ.이름;
                b.addEventListener('click', () => johonScanGo(ㄱ.주소, ㄱ.이름, 글));
                통.appendChild(b);
            });
            document.documentElement.setAttribute('data-johonscanway','1');
        }

        function johonScanFound(글){
            _jhsText = String(글 == null ? '' : 글);
            const el = document.getElementById('jhs-read');
            if (el) el.textContent = _jhsText;
            johonScanWaysClear();
            document.documentElement.setAttribute('data-johonscanread','1');
            johonScanStop();          // 하나 읽으면 멎는다 — 카메라도 같이 끈다
            johonScanRoute(_jhsText); // 길은 뒤따라 선다. 여기서 기다리지 않는다.
        }

        function johonScanAgain(){
            _jhsText = '';
            document.documentElement.removeAttribute('data-johonscanread');
            const el = document.getElementById('jhs-read'); if (el) el.textContent = '';
            johonScanWaysClear();
            johonScanStart();
        }

        function johonScanCopy(){
            if (!_jhsText) return;
            const 알림 = () => { try { showToastMessage('복사됨'); } catch (e) {} };
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(_jhsText).then(알림, () => {});
                    return;
                }
            } catch (e) {}
            try {
                const t = document.createElement('textarea');
                t.value = _jhsText; t.style.position='fixed'; t.style.opacity='0';
                document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
                알림();
            } catch (e) {}
        }

        function johonScanOpen(){
            johonFitTop();
            johonCurrentBox = null;
            _jhsText = '';
            document.documentElement.removeAttribute('data-johonscanread');
            const el = document.getElementById('jhs-read'); if (el) el.textContent = '';
            johonScanWaysClear();
            johonScanRulesLoad();   // 규칙표는 화면을 열 때 한 번. 찍을 때마다 읽지 않는다.
            document.documentElement.removeAttribute('data-johonhome');
            document.documentElement.removeAttribute('data-johonbox');
            document.documentElement.setAttribute('data-johonscan','1');
            window.scrollTo(0, 0);
            johonScanStart();
        }

        function johonScanClose(){
            johonScanStop();
            johonScanWaysClear();
            document.documentElement.removeAttribute('data-johonscan');
            document.documentElement.removeAttribute('data-johonscanread');
        }

        /* ═══ 거래내역 ══════════════════════════════════════════════════
           사장님 10-12: 「입고확인된 명세표는 해당 조혼가구의 해당 거래처에
           거래내역 박스를 만들어 명세서가 도착하도록 해주세요.」

           한 벌을 둘이 본다 — 에이엠티가 담고(출고내역), 여기서 본다(거래내역).
           자리는 `입고확인` 한 곳뿐이다.
           ⚠⚠ **읽기만 한다. 한 글자도 쓰지 않는다** — 책임이 적히는 기록이다.
              지우기·고치기 길을 만들지 않는다.
           ⚠ 명세서(종이)는 여기서 그리지 않는다. 줄을 누르면 에이엠티로 보낸다.
           ⚠ 열 때 한 번만 읽는다. 줄마다 읽으면 돈이 들고 폰이 느려진다. */
        const JOHON_DEALCOL = '입고확인';
        let _jhd줄 = null;      // 읽어 둔 명세표들
        let _jhd중 = null;      // 읽는 중인 약속

        // 화면의 거래처 이름(appMode)을 기록에 적힌 업체 이름으로 옮긴다.
        // ING 만 다르다 — 기록에는 「본사」 로 적힌다(supplierToPageMode 와 같은 잣대).
        function johonDealWho(){
            const m = { 'ing': '본사' };
            return m[appMode] || appMode;
        }

        function johonDealTag(글){
            const el = document.getElementById('jhd-tag');
            if (el) el.textContent = 글 || '';
        }

        function johonDealLoad(){
            _jhd중 = (async () => {
                if (!window.db || !window.fbFirestore) throw new Error('못 읽음');
                const { collection, getDocs } = window.fbFirestore;
                const 눈 = await getDocs(collection(window.db, 'artifacts', appId, 'public', 'data', JOHON_DEALCOL));
                const 줄 = []; 눈.forEach(d => 줄.push({ id: d.id, ...d.data() }));
                return 줄;
            })().then(줄 => { _jhd줄 = 줄; return 줄; });
            return _jhd중;
        }

        // 줄을 누르면 그 명세표를 **제 집에서 편다.** 찍었을 때와 같은 화면이다 —
        // 에이엠티로 보내던 것은 10-12 지시로 뗐다(남의 집에 안 들어간다).
        function johonDealGo(큐알){
            johonBillOpen(큐알);
        }

        function johonDealRender(){
            const 통 = document.getElementById('jhd-list');
            if (!통) return;
            통.innerHTML = '';
            if (_jhd줄 === null) { johonDealTag('읽는 중'); return; }
            const 나 = johonDealWho();
            // ⚠ 차례는 **`확인시각글`** 로 센다. `확인시각` 은 글자가 아니라 timestamp 라
            //   String() 을 씌우면 전부 "[object Object]" 가 되어 **차례가 한 번도 안 선다.**
            //   `확인시각글` 은 "2026-10-12 15:40" 꼴이라 글자로 견주면 그대로 날짜 차례다.
            //   (v1.7.0 에서 이 자리로 한 번 틀렸다. 본보기 자료가 글자였던 탓에 못 잡았다.)
            const 것들 = _jhd줄.filter(r => String(r.업체 || '').trim() === 나)
                .sort((a, b) => String(b.확인시각글 || '').localeCompare(String(a.확인시각글 || '')));
            if (것들.length === 0) { johonDealTag('아직 온 명세서가 없습니다'); return; }
            johonDealTag(나 + ' · ' + 것들.length + '건');
            것들.forEach(r => {
                const 큐알 = String(r.큐알 || r.id || '');
                const b = document.createElement('button');
                b.type = 'button'; b.className = 'jhd-row';
                const 머리 = document.createElement('span');
                머리.className = 'jhd-q'; 머리.textContent = 큐알;
                const 밑 = document.createElement('span');
                밑.className = 'jhd-sub';
                밑.textContent = String(r.확인시각글 || '') +
                    ' · ' + (r.줄수 == null ? '?' : r.줄수) + '줄' +
                    ' · ' + (r.총수량 == null ? '?' : r.총수량) + '개';
                b.appendChild(머리); b.appendChild(밑);
                b.addEventListener('click', () => johonDealGo(큐알));
                통.appendChild(b);
            });
        }

        function johonDealOpen(){
            johonFitTop();
            johonCurrentBox = null;
            document.documentElement.removeAttribute('data-johonhome');
            document.documentElement.removeAttribute('data-johonbox');
            document.documentElement.setAttribute('data-johondeal','1');
            window.scrollTo(0, 0);
            _jhd줄 = null;
            johonDealRender();                    // 「읽는 중」 한 줄
            johonDealLoad().then(() => johonDealRender())
                .catch(() => { johonDealTag('기록을 못 읽었습니다'); });
        }

        function johonDealClose(){
            document.documentElement.removeAttribute('data-johondeal');
            const 통 = document.getElementById('jhd-list'); if (통) 통.innerHTML = '';
            johonDealTag('');
        }

        // 거래처 탭을 바꾸면 보던 목록도 그 거래처 것으로 바뀐다.
        // 기록은 다시 읽지 않는다 — 이미 손에 들고 있다.
        (function(){
            const _sw = window.switchSupplier;
            if (typeof _sw !== 'function') return;
            window.switchSupplier = function(){
                const r = _sw.apply(this, arguments);
                if (document.documentElement.getAttribute('data-johondeal') === '1') {
                    try { johonDealRender(); } catch (e) {}
                }
                return r;
            };
        })();

        /* ═══ 거래명세표 — 제 집에서 편다 ═══════════════════════════════
           사장님 10-12: 「에이엠티 프로그램으로 연결되어 나타나는 듯하다 — 이는 차후
           에이엠티와의 로그인 문제로 혼란을 줄 수 있다. 에이엠티의 거래명세표를
           조혼가구에 따로 받아와서 사용할 수 있는 방법을 강구하라.」

           ⚠⚠ **표 그리는 셈을 여기서 짓지 않는다.** `shared/거래명세표.js` 한 벌을 부른다 —
              베끼면 두 집이 **같은 큐알에서 다른 숫자**를 말한다. 10-11 에 실제로 났던 탈이다.
           ⚠ `출고명세표` 는 **읽기만** 한다. 쓰는 곳은 `입고확인` 하나뿐이다.
           ⚠ `confirmed_orders` 로 표를 세우지 않는다. 그 셈은 에이엠티 것이다. */
        const JOHON_BILLCOL = '출고명세표';
        let _jhb큐알 = '';        // 지금 펴 둔 명세표의 큐알 글
        let _jhb업체 = '';        // 그 종이에 적힌 업체 — 화면에서 고른 거래처를 믿지 않는다
        let _jhb종이 = null;      // 읽어 온 문서

        function johonBillTag(글, 크게){
            const el = document.getElementById('jhb-tag'); if (!el) return;
            el.textContent = 글 || '';
            el.classList.toggle('빔', !!크게);
        }

        // `입고확인` 에 적힌 줄을 집어 온다. 없으면 null. **읽기만** 한다.
        async function johonBillSaid기록(큐알){
            try {
                const { doc, getDoc } = window.fbFirestore || {};
                if (!doc || !getDoc || !window.db) return null;
                const 눈 = await getDoc(doc(window.db, 'artifacts', appId, 'public', 'data',
                                            JOHON_DEALCOL, 큐알));
                if (큐알 !== _jhb큐알) return null;
                return (눈 && 눈.exists()) ? (눈.data() || {}) : null;
            } catch (e) { return null; }
        }

        /* 종이가 없을 때 펴는 머리글. **있는 값만** 적는다 — 없는 칸은 아예 안 만든다.
           ⚠ 종이(표)를 흉내 내지 않는다. 이것은 기록에 적힌 몇 줄일 뿐이다. */
        function johonBillInfo(기록){
            const 통 = document.getElementById('jhb-info'); if (!통) return;
            통.innerHTML = ''; 통.classList.remove('참');
            if (!기록) return;
            const 줄들 = [
                ['업체',   기록.업체],
                ['납기',   기록.납기일],
                ['파레트', 기록.파레트],
                ['줄수',   기록.줄수 == null ? '' : 기록.줄수 + '줄'],
                ['총수량', 기록.총수량 == null ? '' : 기록.총수량 + '개'],
                ['입고확인', 기록.확인시각글]
            ].filter(([, v]) => String(v == null ? '' : v).trim() !== '');
            if (!줄들.length) return;
            줄들.forEach(([이름, 값]) => {
                const dt = document.createElement('dt'); dt.textContent = 이름;
                const dd = document.createElement('dd'); dd.textContent = String(값);
                통.appendChild(dt); 통.appendChild(dd);
            });
            통.classList.add('참');
        }
        function johonBillSaid(글, 빨강){
            const el = document.getElementById('jhb-said'); if (!el) return;
            el.textContent = 글 || '';
            el.classList.toggle('빨강', !!빨강);
        }

        async function johonBillRead(큐알){
            const { doc, getDoc } = window.fbFirestore || {};
            if (!doc || !getDoc || !window.db) throw new Error('못 읽음');
            const 자리 = (window.거래명세표 && window.거래명세표.자리) ||
                         ['artifacts', appId, 'public', 'data', JOHON_BILLCOL];
            const 눈 = await getDoc(doc(window.db, ...자리, 큐알));
            return 눈 && 눈.exists() ? 눈.data() : null;
        }

        function johonBillOpen(큐알){
            johonFitTop();
