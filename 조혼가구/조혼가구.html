            johonCurrentBox = null;
            _jhb큐알 = String(큐알 || ''); _jhb업체 = ''; _jhb종이 = null;
            document.documentElement.removeAttribute('data-johonhome');
            document.documentElement.removeAttribute('data-johonbox');
            document.documentElement.removeAttribute('data-johonbillok');
            document.documentElement.setAttribute('data-johonbill','1');
            const q = document.getElementById('jhb-q'); if (q) q.textContent = _jhb큐알;
            const 종 = document.getElementById('jhb-paper'); if (종) 종.innerHTML = '';
            johonBillSaid(''); johonBillInfo(null); johonBillTag('읽는 중');
            window.scrollTo(0, 0);
            johonBillDraw(_jhb큐알);
        }

        async function johonBillDraw(큐알){
            let 종이 = null;
            try { 종이 = await johonBillRead(큐알); }
            catch (e) { if (큐알 === _jhb큐알) johonBillTag('명세표를 못 읽었습니다'); return; }
            if (큐알 !== _jhb큐알) return;          // 그새 다른 것을 여셨다
            if (!종이) {
                /* 10-17 사장님: 「거래명세표가 안보입니다」
                   에이엠티가 아직 안 보낸 건이라 **그릴 종이가 창고에 없다**
                   (`출고명세표` 0장). 그렇다고 큐알 글 하나만 남겨 두면
                   사장님은 「안 보인다」 고 하신다 — 맞는 말씀이다.
                   ⚠ 종이를 **지어내지 않는다.** 대신 손에 있는 것
                     (`입고확인` 에 적힌 업체·납기·줄수·총수량·확인시각)을 편다. */
                johonBillTag('아직 에이엠티에서 안 보냈습니다', true);
                johonBillInfo(await johonBillSaid기록(큐알));
                return;
            }
            _jhb종이 = 종이;
            _jhb업체 = String(종이.업체 || '').trim();
            let 그린것 = null;
            try {
                // 설정은 {} — 거래명세표 기본값(공정 납기 · 원장 false · 파칸 true)이
                // 거래처에 맞는 꼴이다. 묶음은 담긴 그대로 넘긴다.
                그린것 = window.거래명세표 && window.거래명세표.그리기(종이.명세표, {});
            } catch (e) {}
            const 종 = document.getElementById('jhb-paper');
            if (!그린것 || !그린것.html) { johonBillTag('명세표를 못 폈습니다'); return; }
            if (종) 종.innerHTML = 그린것.html;
            johonBillTag([_jhb업체, 종이.납기일 ? '납기 ' + 종이.납기일 : '',
                          그린것.줄수 + '줄'].filter(Boolean).join(' · '));
            document.documentElement.setAttribute('data-johonbillok','1');
            johonBillSaidIfDone(큐알);
        }

        // 이미 입고확인된 건이면 단추를 잠그고 그 시각을 적는다.
        async function johonBillSaidIfDone(큐알){
            try {
                const { doc, getDoc } = window.fbFirestore || {};
                if (!doc || !getDoc || !window.db) return;
                const 눈 = await getDoc(doc(window.db, 'artifacts', appId, 'public', 'data',
                                            JOHON_DEALCOL, 큐알));
                if (큐알 !== _jhb큐알) return;
                if (눈 && 눈.exists()) {
                    const d = 눈.data() || {};
                    johonBillLock('입고확인 ' + (d.확인시각글 || '') + ' (' + (d.업체 || '') + ')');
                }
            } catch (e) {}
        }
        function johonBillLock(글){
            const b = document.getElementById('jhb-ok'); if (b) b.disabled = true;
            johonBillSaid(글);
        }

        function johonBillClose(){
            document.documentElement.removeAttribute('data-johonbill');
            document.documentElement.removeAttribute('data-johonbillok');
            const 종 = document.getElementById('jhb-paper'); if (종) 종.innerHTML = '';
            const b = document.getElementById('jhb-ok'); if (b) b.disabled = false;
            _jhb큐알 = ''; _jhb업체 = ''; _jhb종이 = null;
            johonBillTag(''); johonBillSaid(''); johonBillInfo(null);
            johonAskClose();
        }

        /* 입고확인 — 사장님이 적어 주신 글귀 그대로. 한 글자도 바꾸지 않는다.
           ⚠ 업체 이름은 **종이에 적힌 것**에서 꺼낸다. 화면에서 고른 거래처를 믿지 않는다. */
        function johonBillAsk(){
            if (!_jhb큐알 || !_jhb종이) return;
            const el = document.getElementById('jha-말');
            if (el) el.textContent = '입고된 수량을 정확히 확인했나요? 확인후 착오된 수량의 ' +
                '책임은 ' + _jhb업체 + '에 기록됩니다.';
            const g = document.getElementById('jha-go'); if (g) g.disabled = false;
            document.documentElement.setAttribute('data-johonask','1');
        }
        function johonAskClose(){
            document.documentElement.removeAttribute('data-johonask');
        }

        /* ⚠⚠ **이것은 책임 기록이다.**
           · 먼저 적힌 것을 **덮지 않는다** — 거래 안에서 한 번 더 보고, 있으면 그대로 둔다.
             (에이엠티가 runTransaction 으로 막아 둔 것과 같은 뜻이다.)
           · 쓰고 **다시 읽어** 들어간 것을 본 뒤에야 「입고확인」 이라 한다.
             못 적으면 「기록을 못 남겼습니다」 — **거짓 초록은 없다.**
           · 지우기·고치기·수량 바꾸는 길은 만들지 않는다. */
        async function johonBillConfirm(){
            const 큐알 = _jhb큐알, 종이 = _jhb종이;
            if (!큐알 || !종이) return;
            const g = document.getElementById('jha-go'); if (g) g.disabled = true;
            const 두 = n => String(n).padStart(2, '0');
            const 이제 = new Date();
            const 시각글 = 이제.getFullYear() + '-' + 두(이제.getMonth()+1) + '-' + 두(이제.getDate()) +
                           ' ' + 두(이제.getHours()) + ':' + 두(이제.getMinutes());
            try {
                const { doc, getDoc, runTransaction, serverTimestamp } = window.fbFirestore || {};
                if (!doc || !getDoc || !runTransaction || !window.db) throw new Error('길 없음');
                const 칸 = doc(window.db, 'artifacts', appId, 'public', 'data', JOHON_DEALCOL, 큐알);
                await runTransaction(window.db, async (거래) => {
                    const 있 = await 거래.get(칸);
                    if (있 && 있.exists()) return;          // 먼저 적힌 것을 덮지 않는다
                    거래.set(칸, {
                        큐알: 큐알, 발주번호: 종이.발주번호 || '', 발주문서: 종이.발주문서 || '',
                        파레트: 종이.파레트 || '', 납기일: 종이.납기일 || '',
                        업체: _jhb업체, 줄수: 종이.줄수 == null ? null : 종이.줄수,
                        총수량: 종이.총수량 == null ? null : 종이.총수량,
                        명세표: 종이.명세표 || null,
                        글귀: '입고된 수량을 정확히 확인했나요? 확인후 착오된 수량의 책임은 ' +
                              _jhb업체 + '에 기록됩니다.',
                        확인시각: serverTimestamp ? serverTimestamp() : null,
                        확인시각글: 시각글, 판: '조혼가구 v1.8.0', 적은곳: '조혼가구'
                    });
                });
                // 쓰고 **다시 읽어** 본다. 이것을 봐야 됐다고 한다.
                const 눈 = await getDoc(칸);
                if (!눈 || !눈.exists()) throw new Error('안 들어감');
                const d = 눈.data() || {};
                johonAskClose();
                johonBillLock('입고확인 ' + (d.확인시각글 || 시각글) + ' (' + (d.업체 || _jhb업체) + ')');
            } catch (e) {
                johonAskClose();
                johonBillSaid('기록을 못 남겼습니다', true);
                if (g) g.disabled = false;
            }
        }

        // 바탕을 눌러도 빠져나온다. 「취소」 라는 글자는 새로 만들지 않는다.
        (function(){
            const 판 = document.getElementById('johon-ask');
            if (판) 판.addEventListener('click', e => { if (e.target === 판) johonAskClose(); });
        })();

        /* 뒤로 갈 때·화면을 덮었을 때 반드시 끈다 */
        (function(){
            const _home = window.johonGoHome;
            if (typeof _home === 'function') window.johonGoHome = function(){
                try { johonScanClose(); } catch (e) {}
                try { johonDealClose(); } catch (e) {}
                try { johonBillClose(); } catch (e) {}
                return _home.apply(this, arguments);
            };
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) { try { johonScanStop(); } catch (e) {} }
            });
            window.addEventListener('pagehide', () => { try { johonScanStop(); } catch (e) {} });
        })();

        /* ═══ /박스 첫 화면 ══════════════════════════════════════════════ */
    </script>
    <!-- 아이콘 — 작업대·에이엠티가 쓰는 그 파일 그대로. 바깥 CDN 이 아니다. -->
    <script src="../shared/lucide.min.js"></script>
    <!-- 찍은 큐알이 어디로 가는 길인지 가리는 셈. 베끼지 않고 부른다 —
         스캔하는 프로그램이 늘어도 셈은 한 벌이다. 규칙은 화베의 표에 쌓인다. -->
    <script src="../shared/큐알길.js"></script>
    <!-- 거래명세표 그리는 법. 에이엠티와 **같은 한 벌**이다 — 베끼면 두 집이
         같은 큐알에서 다른 숫자를 말한다. -->
    <script src="../shared/거래명세표.js"></script>
    <!-- 바이글 손잡이 — 주소에 ?viggle=1 이 있을 때만 켜진다 -->
    <script src="../shared/viggle.js"></script>
</body>
</html>
