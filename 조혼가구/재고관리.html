<!DOCTYPE html>
<!-- 재고관리 — 업체별 제품에 딸린 부속의 재고를 적는다.

     사장님 10-15: 「새박스 - 재고관리 박스를 만들어 , 각 업체별 제품에 해당하는
     부속들의 재고를 기재할 있는 페이지를 만들어 주세요. 제품명 별 분류해 주세요」

     판 번호는 머리띠 VIVIVIC 옆 배지와 같다. 고칠 때 둘을 같이 올린다: v1.0.0

     ⚠⚠ **읽는 것과 쓰는 것을 섞지 않는다.**
       읽기만  `product_master` — 업체(ing발주처) · 제품(ing단품명) · 부속(부속명·부속코드).
               한 글자도 쓰지 않는다. `confirmed_orders`·`cutting_plans`·`wt_*`·
               `partStarted`·`partCompletions` 도 손대지 않는다(읽지도 않는다).
       쓰기    `jh_stock` **이 칸 하나뿐**이다. `vp_` 로 시작하는 이름은 안 쓴다.
     ⚠ **지우기 길을 만들지 않는다.** 재고는 덮어쓰며 이어지는 기록이라,
       고친 값과 고친 때를 `이력` 에 쌓고 **앞 값을 지우지 않는다.**
     ⚠ 사람 이름·전화·주소는 담지 않는다.

     자료를 세어 보고 지었다 (10-15, 화베에서 직접 읽음):
       product_master 문서 1397 · 지워진 것 0 · 속칸 58
       업체(ing발주처) 7 — 조혼가구 533줄 · 본사 323 · 아인가구 311 · 유한가구 128 ·
                          럭스디자인 83 · 본사-A공장-1 18 · 공통 1
       제품(ing단품명) 전체 161 — 조혼가구 58
       부속명 전체 65 — 조혼가구 49. 제품 하나에 부속 1~19줄.
     「제품명 별 분류」 는 `ing단품명` 으로 묶는 것이 맞다 — 자료가 그렇게 서 있다.
-->

    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, getDocs, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs",
        authDomain: "vivivic-4b7ef.firebaseapp.com",
        projectId: "vivivic-4b7ef",
        storageBucket: "vivivic-4b7ef.firebasestorage.app",
        messagingSenderId: "830175660542",
        appId: "1:830175660542:web:9054030480c8280af8d8af",
        measurementId: "G-MCPHWSQBQR"
    };
    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    window.db = getFirestore(app);
    window.fbFirestore = { collection, doc, getDoc, getDocs, setDoc, serverTimestamp };
    onAuthStateChanged(auth, (user) => {
        if (!user) { signInAnonymously(auth).catch(() => { 탈('로그인을 못 했습니다'); }); return; }
        window._myAccount = { uid: user.uid };
        window.시작();
    });
</script>

<script>
/* ═══ 재고관리 ══════════════════════════════════════════════════════
   자료 한 벌: `product_master`. 업체·제품·부속이 **한 줄에 다 있다.**
   열 때 한 번만 읽는다 — 줄마다 읽으면 돈이 들고 폰이 느려진다. */
const appId      = 'vivivic-4b7ef';
const 바탕칸     = 'product_master';   // 읽기만
const 재고칸     = 'jh_stock';         // 쓰는 곳 — 여기 하나뿐
const LS업체     = 'jh_stock_vendor';

let 바탕 = [];      // [{키, 업체, 제품, 제품코드, 부속, 부속코드, 공급처}]
let 재고 = {};      // 키 → {수량, 고친때글}
let 업체 = '조혼가구';
let 편제품 = {};    // 제품이름 → 펴 두었나

const $ = id => document.getElementById(id);
const 글 = s => String(s == null ? '' : s).trim();
const 안전 = s => 글(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

function 알림(말, 빨강){
    const el = $('알림'); if (!el) return;
    el.textContent = 말 || '';
    el.classList.toggle('빨강', !!빨강);
    el.style.display = 말 ? 'block' : 'none';
}
function 탈(말){ 알림(말, true); }

/* 화베가 돌려주는 값을 그대로 쓴다. `product_master` 는 속칸이 `fields` 안에
   한 겹 더 들어 있다 — 원장관리가 담는 꼴 그대로다. */
function 속(d){
    const o = (d && d.fields) || {};
    return (o && typeof o === 'object') ? o : {};
}

async function 바탕읽기(){
    const { collection, getDocs } = window.fbFirestore || {};
    if (!collection || !getDocs || !window.db) throw new Error('화베가 없습니다');
    const 눈 = await getDocs(collection(window.db, 'artifacts', appId, 'public', 'data', 바탕칸));
    const 밖 = [];
    눈.forEach(d => {
        const r = d.data() || {};
        if (r.deleted === true) return;              // 지운 줄은 안 센다
        const f = 속(r);
        const 업 = 글(f.ing발주처); if (!업) return;
        밖.push({
            키: d.id,                                 // product_master 문서 이름 — 1:1 로 붙인다
            업체: 업,
            제품: 글(f.ing단품명) || '(제품 이름 없음)',
            제품코드: 글(f.ing단품코드),
            부속: 글(f.부속명) || '(부속 이름 없음)',
            부속코드: 글(f.부속코드),
            공급처: 글(f.공급처)
        });
    });
    return 밖;
}

async function 재고읽기(){
    const { collection, getDocs } = window.fbFirestore || {};
    const 밖 = {};
    try {
        const 눈 = await getDocs(collection(window.db, 'artifacts', appId, 'public', 'data', 재고칸));
        눈.forEach(d => { const r = d.data() || {};
            밖[d.id] = { 수량: r.수량, 고친때글: 글(r.고친때글) }; });
    } catch (e) { /* 못 읽어도 바탕은 보인다 */ }
    return 밖;
}

function 업체들(){
    const 셈 = new Map();
    바탕.forEach(r => 셈.set(r.업체, (셈.get(r.업체) || 0) + 1));
    return [...셈.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
}

function 업체줄그리기(){
    const 통 = $('업체줄'); if (!통) return;
    const 들 = 업체들();
    if (!들.includes(업체)) 업체 = 들[0] || '';
    통.innerHTML = 들.map(v =>
        `<button type="button" class="업체${v === 업체 ? ' 켜짐' : ''}" data-업체="${안전(v)}">${안전(v)}</button>`
    ).join('');
}

function 목록그리기(){
    const 통 = $('목록'); if (!통) return;
    const 그것 = 바탕.filter(r => r.업체 === 업체);
    if (그것.length === 0) { 통.innerHTML = ''; 알림('이 거래처에는 등록된 부속이 없습니다'); return; }

    // 제품명 별 분류 — 사장님 말씀 그대로. 이름 차례로 세운다.
    const 묶음 = new Map();
    그것.forEach(r => { if (!묶음.has(r.제품)) 묶음.set(r.제품, []); 묶음.get(r.제품).push(r); });
    const 이름들 = [...묶음.keys()].sort((a, b) => a.localeCompare(b, 'ko'));

    $('딱지').textContent = 이름들.length + '개 제품 · 부속 ' + 그것.length;
    알림('');

    통.innerHTML = 이름들.map(이름 => {
        const 줄들 = 묶음.get(이름);
        const 적힘 = 줄들.filter(r => 재고[r.키] && 재고[r.키].수량 != null).length;
        return `<div class="제품${편제품[이름] ? ' 폄' : ''}" data-제품="${안전(이름)}">
            <button type="button" class="제품머리" data-폄="${안전(이름)}">
                <span class="제품이름">${안전(이름)}</span>
                <span class="제품셈">${줄들.length}${적힘 ? ' · 적힘 ' + 적힘 : ''}</span>
            </button>
            <div class="제품몸">${줄들.map(r => {
                const 지금 = 재고[r.키] || {};
                const 값 = 지금.수량 == null ? '' : String(지금.수량);
                return `<div class="부속">
                    <span class="부속글">
                        <span class="부속이름">${안전(r.부속)}</span>
                        <span class="부속밑">${안전(r.부속코드)}${r.공급처 ? ' · ' + 안전(r.공급처) : ''}</span>
                    </span>
                    <input class="수량${값 !== '' ? ' 담김' : ''}" type="number" inputmode="numeric"
                           value="${안전(값)}" data-키="${안전(r.키)}" aria-label="재고 수량">
                    <span class="때" data-때="${안전(r.키)}">${안전(지금.고친때글)}</span>
                </div>`; }).join('')}</div>
        </div>`;
    }).join('');
}

/* ⚠ **앞 값을 지우지 않는다.** 고친 값과 고친 때를 `이력` 에 쌓는다.
   지우기 길은 만들지 않는다 — 말씀도 없었고, 재고는 이어지는 기록이다. */
async function 재고적기(키, 값){
    const { doc, getDoc, setDoc, serverTimestamp } = window.fbFirestore || {};
    if (!doc || !getDoc || !setDoc || !window.db) throw new Error('화베가 없습니다');
    const 줄 = 바탕.find(r => r.키 === 키);
    if (!줄) throw new Error('그 부속을 못 찾았습니다');
    const 칸 = doc(window.db, 'artifacts', appId, 'public', 'data', 재고칸, 키);
    const 눈 = await getDoc(칸);
    const 옛 = (눈 && 눈.exists()) ? (눈.data() || {}) : {};
    const 이제 = new Date();
    const 두 = n => String(n).padStart(2, '0');
    const 때글 = 이제.getFullYear() + '-' + 두(이제.getMonth() + 1) + '-' + 두(이제.getDate()) +
                 ' ' + 두(이제.getHours()) + ':' + 두(이제.getMinutes());
    const 이력 = Array.isArray(옛.이력) ? 옛.이력.slice(-199) : [];
    이력.push({ 수량: 값, 때글: 때글, 적은이: (window._myAccount && window._myAccount.uid) || '' });
    await setDoc(칸, {
        키: 키, 업체: 줄.업체, 제품: 줄.제품, 제품코드: 줄.제품코드,
        부속: 줄.부속, 부속코드: 줄.부속코드,
        수량: 값, 고친때: serverTimestamp ? serverTimestamp() : null, 고친때글: 때글,
        고친이: (window._myAccount && window._myAccount.uid) || '',
        이력: 이력, 판: '재고관리 v1.0.0'
    });
    // ⚠ 쓰고 **다시 읽어** 들어간 것을 보고 나서 화면을 바꾼다. 거짓 초록은 없다.
    const 다시 = await getDoc(칸);
    const 든것 = (다시 && 다시.exists()) ? (다시.data() || {}) : null;
    if (!든것 || 든것.수량 !== 값) throw new Error('안 들어갔습니다');
    재고[키] = { 수량: 든것.수량, 고친때글: 글(든것.고친때글) };
    return 재고[키];
}

/* ── 손가락 ── */
document.addEventListener('click', e => {
    const v = e.target.closest && e.target.closest('[data-업체]');
    if (v) { 업체 = v.dataset.업체; 편제품 = {};
             try { localStorage.setItem(LS업체, 업체); } catch (err) {}
             업체줄그리기(); 목록그리기(); return; }
    const h = e.target.closest && e.target.closest('[data-폄]');
    if (h) { const 이름 = h.dataset.폄;
             편제품[이름] = !편제품[이름];
             const 칸 = h.closest('.제품'); if (칸) 칸.classList.toggle('폄', !!편제품[이름]);
             return; }
});

// 칸에서 손을 떼면 적는다. 단추를 따로 만들지 않는다 — 시키지 않은 것은 안 만든다.
document.addEventListener('change', async e => {
    const el = e.target.closest && e.target.closest('.수량');
    if (!el) return;
    const 키 = el.dataset.키;
    const 날 = 글(el.value);
    if (날 === '') return;                       // 빈칸은 「아직 안 적음」 이다. 지우지 않는다.
    const 값 = Number(날);
    if (!Number.isFinite(값) || 값 < 0) { 탈('수량은 0 이상 숫자입니다'); return; }
    el.disabled = true;
    try {
        const 든것 = await 재고적기(키, 값);
        el.classList.add('담김');
        const 때 = document.querySelector('[data-때="' + CSS.escape(키) + '"]');
        if (때) 때.textContent = 든것.고친때글;
        알림('');
    } catch (err) {
        탈('못 적었습니다 — ' + ((err && err.message) || ''));
    } finally { el.disabled = false; }
});

window.시작 = async function(){
    try { const v = localStorage.getItem(LS업체); if (v) 업체 = v; } catch (e) {}
    try {
        바탕 = await 바탕읽기();
    } catch (e) { 탈('부속 자료를 못 읽었습니다'); return; }
    if (바탕.length === 0) { 탈('부속 자료가 비어 있습니다'); return; }
    재고 = await 재고읽기();
    업체줄그리기();
    목록그리기();
};
</script>
